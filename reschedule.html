<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #D4AF7A; letter-spacing: 3px; }
    .brand p { color: #999; font-size: 14px; margin-top: 4px; }
    h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; letter-spacing: 1px; margin-bottom: 16px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #B8965A; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; background: #2a2a2a; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #B8965A; }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      width: 100%; padding: 16px; background: linear-gradient(135deg, #B8965A, #D4AF7A);
      border: none; border-radius: 8px; color: #1a1a1a; font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; cursor: pointer; margin-top: 24px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184,150,90,0.3); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { display: none; text-align: center; padding: 40px 20px; }
    .success h2 { color: #D4AF7A; font-size: 32px; }
    .success p { color: #999; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Reschedule Your Session</p>
    </div>

    <form id="rescheduleForm">
      <h2>PICK A NEW TIME</h2>
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" name="name" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>WhatsApp Number *</label>
        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="form-group">
        <label>Preferred Date *</label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="form-group">
        <label>Preferred Time (IST) *</label>
        <select name="preferred_time" required>
          <option value="">Select a slot</option>
          <option value="07:00">7:00 AM</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reason for rescheduling</label>
        <textarea name="reason" placeholder="Optional — let us know so we can help"></textarea>
      </div>

      <button type="submit" class="btn-submit">REQUEST RESCHEDULE</button>
    </form>

    <div class="success" id="successMsg">
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>

  <script>
    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
