<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { padding-top: 72px; min-height: 100vh; background: var(--cream); }
    .form-container { max-width: 520px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 40px; }
    .form-card { background: white; padding: 36px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s; }
    .time-slot:has(input:checked) { border-color: var(--gold); background: var(--charcoal); color: white; }
    .time-slot input { display: none; }
    .success-message { text-align: center; padding: 60px 24px; }
    .success-message .check { width: 64px; height: 64px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 24px; color: white; }
    @media (max-width: 400px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="form-page">
  <div class="form-container">
    <div class="form-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body">No worries — life happens. Choose a new slot and we'll lock it in.</p>
    </div>

    <form id="rescheduleForm" novalidate>
      <div class="form-card">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" name="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Phone (WhatsApp) *</label>
          <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="form-group">
          <label>Preferred Date *</label>
          <input type="date" name="preferred_date" required>
        </div>
        <div class="form-group">
          <label>Preferred Time Slot *</label>
          <div class="time-slots">
            <label class="time-slot"><input type="radio" name="time_slot" value="07:00" required>7:00 AM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="08:00">8:00 AM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="09:00">9:00 AM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="10:00">10:00 AM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="16:00">4:00 PM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="17:00">5:00 PM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="18:00">6:00 PM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="19:00">7:00 PM</label>
            <label class="time-slot"><input type="radio" name="time_slot" value="20:00">8:00 PM</label>
          </div>
        </div>
        <div class="form-group">
          <label>Reason (optional)</label>
          <textarea name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" style="width:100%;">Request Reschedule</button>
    </form>

    <div class="success-message" id="successMsg" style="display:none;">
      <div class="check">&#10003;</div>
      <h2 class="section-title">Request <em>Sent!</em></h2>
      <p class="section-body" style="margin:0 auto;">We'll confirm your new time slot on WhatsApp within a few hours. Thanks for letting us know!</p>
    </div>
  </div>
</div>

<script>
(function() {
  var dateInput = document.querySelector('input[name="preferred_date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];
})();

document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.textContent = 'Sending...';
  btn.disabled = true;

  var form = new FormData(this);
  var data = {
    name: form.get('name'),
    phone: form.get('phone'),
    preferred_date: form.get('preferred_date'),
    time_slot: form.get('time_slot'),
    reason: form.get('reason'),
  };

  try {
    var res = await fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-internal-key': 'public-reschedule',
      },
      body: JSON.stringify({
        phone: '917082478374',
        text: 'RESCHEDULE REQUEST\nClient: ' + data.name + '\nPhone: ' + data.phone + '\nDate: ' + data.preferred_date + '\nTime: ' + data.time_slot + '\nReason: ' + (data.reason || 'Not specified'),
        isClient: true,
      }),
    });

    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    window.scrollTo(0, 0);
  } catch (err) {
    btn.textContent = 'Request Reschedule';
    btn.disabled = false;
    alert('Something went wrong. Please message us directly on WhatsApp.');
  }
});
</script>
<script src="js/nav.js"></script>
</body>
</html>
