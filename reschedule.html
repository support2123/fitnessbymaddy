<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: -20px auto 40px;
      padding: 40px 32px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--charcoal);
      letter-spacing: 2px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: var(--cream);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .error-msg {
      background: #fef0f0;
      color: #c0392b;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 600px) {
      .form-container { margin: -20px 12px 24px; padding: 28px 20px; }
      .form-header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>RESCHEDULE SESSION</h1>
    <p>Life happens — let's find a better time</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="error"></div>

    <form id="rescheduleForm">
      <div class="form-section-title">YOUR DETAILS</div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label>Phone (WhatsApp)</label>
        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="form-section-title" style="margin-top:32px">PREFERRED DATE</div>
      <div class="field">
        <label>New Date</label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="field">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="9:00 AM">9:00 AM</div>
          <div class="time-slot" data-time="10:00 AM">10:00 AM</div>
          <div class="time-slot" data-time="11:00 AM">11:00 AM</div>
          <div class="time-slot" data-time="2:00 PM">2:00 PM</div>
          <div class="time-slot" data-time="4:00 PM">4:00 PM</div>
          <div class="time-slot" data-time="6:00 PM">6:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime">
      </div>

      <div class="form-section-title" style="margin-top:32px">REASON</div>
      <div class="field">
        <label>Why are you rescheduling?</label>
        <select name="reason">
          <option value="">Select reason</option>
          <option value="schedule_conflict">Schedule conflict</option>
          <option value="feeling_unwell">Not feeling well</option>
          <option value="travel">Travelling</option>
          <option value="emergency">Emergency</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Additional Notes</label>
        <textarea name="notes" placeholder="Anything else we should know?"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success-msg" id="success">
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly. Keep an eye on your messages.</p>
    </div>
  </div>

  <script>
    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        document.getElementById('selectedTime').value = this.dataset.time;
      });
    });

    var dateInput = document.querySelector('input[name="preferred_date"]');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('error');

      if (!document.getElementById('selectedTime').value) {
        errEl.textContent = 'Please select a preferred time slot.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SENDING...';
      errEl.style.display = 'none';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(v, k) { data[k] = v; });

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          type: 'text',
          text: 'Reschedule Request\nClient: ' + data.name + ' (' + data.phone + ')\nNew Date: ' + data.preferred_date + ' at ' + data.preferred_time + '\nReason: ' + (data.reason || 'Not specified') + '\nNotes: ' + (data.notes || 'None')
        })
      })
      .then(function() {
        document.getElementById('rescheduleForm').style.display = 'none';
        document.getElementById('success').style.display = 'block';
      })
      .catch(function() {
        errEl.textContent = 'Something went wrong. Please message us on WhatsApp directly.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  </script>
</body>
</html>
