<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-page { max-width: 560px; margin: 0 auto; padding: 120px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; cursor: pointer; font-size: 13px; color: var(--mid-grey);
      transition: all 0.3s; background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    .hidden { display: none; }
    @media (max-width: 600px) { .reschedule-form { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="reschedule-page">
  <div class="reschedule-header">
    <p class="section-eyebrow">Session Management</p>
    <h1 class="section-title">Reschedule <em>Session</em></h1>
    <p class="section-body" style="margin: 0 auto;">Can't make your scheduled session? Pick a new time below.</p>
  </div>

  <form class="reschedule-form" id="rescheduleForm">
    <div class="form-group">
      <label class="form-label">Your Phone Number *</label>
      <input class="form-input" type="tel" name="phone" required>
    </div>
    <div class="form-group">
      <label class="form-label">Preferred Date *</label>
      <input class="form-input" type="date" name="preferred_date" required>
    </div>
    <div class="form-group">
      <label class="form-label">Preferred Time Slot *</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="07:00">7:00 AM</div>
        <div class="time-slot" data-time="08:00">8:00 AM</div>
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="10:00">10:00 AM</div>
        <div class="time-slot" data-time="17:00">5:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
        <div class="time-slot" data-time="19:00">7:00 PM</div>
        <div class="time-slot" data-time="20:00">8:00 PM</div>
      </div>
      <input type="hidden" name="preferred_time" id="selectedTime" required>
    </div>
    <div class="form-group">
      <label class="form-label">Reason (optional)</label>
      <textarea class="form-textarea" name="reason" placeholder="Let us know if there's a specific reason..."></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
  </form>

  <div class="success-msg hidden" id="successMsg">
    <h2>Request Received</h2>
    <p>We'll confirm your new session time on WhatsApp shortly.</p>
  </div>
</div>

<script>
(function() {
  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.dataset.time;
    });
  });

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!document.getElementById('selectedTime').value) {
      alert('Please select a time slot.');
      return;
    }
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var formData = new FormData(this);
    var data = {};
    formData.forEach(function(val, key) { data[key] = val; });

    fetch('/api/reschedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function() {
      document.getElementById('rescheduleForm').classList.add('hidden');
      document.getElementById('successMsg').classList.remove('hidden');
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
<script src="js/nav.js"></script>
</body>
</html>
