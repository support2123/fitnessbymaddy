<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Zoom Sessions</p>
    <h1 class="section-title">Reschedule <em>Session</em></h1>
    <p class="section-body" style="margin:12px auto 0">Need to move your session? Pick a new slot below.</p>
  </div>

  <div class="form-card" id="rescheduleForm">
    <form id="reschedule" onsubmit="submitReschedule(event)">
      <div class="form-group">
        <label class="form-label">Your Name *</label>
        <input class="form-input" name="name" required placeholder="Full name">
      </div>

      <div class="form-group">
        <label class="form-label">Phone / WhatsApp *</label>
        <input class="form-input" name="phone" type="tel" required placeholder="+91...">
      </div>

      <div class="form-group">
        <label class="form-label">Original Session Date</label>
        <input class="form-input" name="original_date" type="date">
      </div>

      <div class="form-group">
        <label class="form-label">Preferred New Date *</label>
        <input class="form-input" name="new_date" type="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <select class="form-select" name="time_slot" required>
          <option value="">Select a time</option>
          <option value="7am-8am">7:00 AM - 8:00 AM IST</option>
          <option value="8am-9am">8:00 AM - 9:00 AM IST</option>
          <option value="9am-10am">9:00 AM - 10:00 AM IST</option>
          <option value="5pm-6pm">5:00 PM - 6:00 PM IST</option>
          <option value="6pm-7pm">6:00 PM - 7:00 PM IST</option>
          <option value="7pm-8pm">7:00 PM - 8:00 PM IST</option>
          <option value="8pm-9pm">8:00 PM - 9:00 PM IST</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new slot via WhatsApp within a few hours. Thanks for letting us know in advance.</p>
  </div>
</div>

<script>
async function submitReschedule(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('reschedule');
  var data = Object.fromEntries(new FormData(form));

  try {
    var res = await fetch('/api/reschedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'REQUEST RESCHEDULE';
    alert('Connection error. Please try again.');
  }
}
</script>
</body>
</html>
