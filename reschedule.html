<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .resched-wrap {
      min-height: 100vh; padding: 100px 24px 60px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .resched-card {
      background: white; padding: 48px; border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
      width: 100%; max-width: 480px;
    }
    .resched-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--charcoal);
      text-align: center; margin-bottom: 8px;
    }
    .resched-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 400; color: var(--charcoal);
      text-align: center; margin-bottom: 8px;
    }
    .resched-sub {
      font-size: 14px; color: var(--mid-grey); text-align: center;
      margin-bottom: 36px; line-height: 1.6;
    }
    .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s;
      outline: none; resize: vertical; min-height: 80px;
    }
    .form-textarea:focus { border-color: var(--gold); }
    .resched-submit {
      width: 100%; padding: 16px; margin-top: 12px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .resched-submit:hover { background: var(--gold); }
    .resched-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .time-slots {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 20px;
    }
    .time-slot {
      padding: 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; text-align: center; cursor: pointer;
      font-size: 13px; color: var(--charcoal); transition: all 0.2s;
      background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      border-color: var(--gold); background: var(--gold); color: white;
    }
    .success-msg {
      display: none; text-align: center; padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .error-bar {
      display: none; background: #f8d7da; color: #721c24;
      padding: 12px 16px; border-radius: 2px; font-size: 13px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .resched-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="resched-wrap">
  <div class="resched-card">
    <div class="resched-logo">Fitness by Maddy</div>
    <h1 class="resched-title"><em>Reschedule</em> Session</h1>
    <p class="resched-sub">Life happens! Pick a new time and we'll adjust your schedule.</p>

    <div class="error-bar" id="errorBar"></div>

    <form id="reschedForm">
      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input class="form-input" type="date" name="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="06:00">6:00 AM</div>
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Quick note on why you need to reschedule..." maxlength="500"></textarea>
      </div>

      <button type="submit" class="resched-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Reschedule Requested</h2>
      <p>We'll confirm your new slot on WhatsApp shortly. Keep pushing!</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var selectedTime = null;

  var dateInput = document.querySelector('input[name="date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      selectedTime = this.getAttribute('data-time');
      document.getElementById('selectedTime').value = selectedTime;
    });
  });

  document.getElementById('reschedForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var errorBar = document.getElementById('errorBar');
    errorBar.style.display = 'none';

    if (!selectedTime) {
      errorBar.textContent = 'Please select a time slot.';
      errorBar.style.display = 'block';
      return;
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'REQUESTING...';

    document.getElementById('reschedForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  });
})();
</script>

</body>
</html>
