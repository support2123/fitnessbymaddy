<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: white; letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; letter-spacing: 1px; }
    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 40px 32px;
      background: white; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; cursor: pointer; font-size: 13px;
      font-weight: 500; transition: all 0.3s; background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .submit-btn {
      width: 100%; padding: 16px; margin-top: 24px;
      background: var(--charcoal); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .success-msg {
      display: none; text-align: center; padding: 40px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Pick a new time that works for you</p>
  </div>

  <div class="form-container">
    <form id="rescheduleForm">
      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime" required>
      </div>

      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="submit-btn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Reschedule Requested</h2>
      <p>We'll confirm your new session time on WhatsApp shortly. Thanks for letting us know!</p>
    </div>
  </div>

  <script>
    var slots = document.querySelectorAll('.time-slot');
    var selectedTimeInput = document.getElementById('selectedTime');

    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTimeInput.value = slot.getAttribute('data-time');
      });
    });

    var dateInput = document.querySelector('input[name="date"]');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!selectedTimeInput.value) {
        alert('Please select a time slot');
        return;
      }
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
