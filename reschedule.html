<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #D4AF7A; text-align: center; letter-spacing: 3px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 40px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #ccc; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea { width: 100%; padding: 14px 16px; background: #222; border: 1px solid #333; border-radius: 6px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; margin-bottom: 16px; transition: border-color 0.3s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #D4AF7A; }
    textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .time-slot { background: #222; border: 1px solid #333; border-radius: 6px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .time-slot:hover { border-color: #D4AF7A; }
    .time-slot.selected { border-color: #D4AF7A; background: #2a2a1a; }
    .time-slot .time { font-size: 16px; font-weight: 500; }
    .time-slot .period { font-size: 11px; color: #999; margin-top: 4px; }
    .btn-submit { width: 100%; padding: 16px; background: #D4AF7A; color: #1a1a1a; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-top: 20px; }
    .btn-submit:hover { background: #e8c78a; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { display: none; text-align: center; padding: 60px 20px; }
    .success h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #D4AF7A; margin-bottom: 12px; }
    .success p { color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FITNESS BY MADDY</div>
    <p class="subtitle">Reschedule Your Session</p>

    <form id="rescheduleForm">
      <label for="date">Preferred Date *</label>
      <input type="date" id="date" name="date" required>

      <label>Preferred Time Slot *</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="07:00"><div class="time">7:00 AM</div><div class="period">Morning</div></div>
        <div class="time-slot" data-time="08:00"><div class="time">8:00 AM</div><div class="period">Morning</div></div>
        <div class="time-slot" data-time="09:00"><div class="time">9:00 AM</div><div class="period">Morning</div></div>
        <div class="time-slot" data-time="10:00"><div class="time">10:00 AM</div><div class="period">Morning</div></div>
        <div class="time-slot" data-time="17:00"><div class="time">5:00 PM</div><div class="period">Evening</div></div>
        <div class="time-slot" data-time="18:00"><div class="time">6:00 PM</div><div class="period">Evening</div></div>
        <div class="time-slot" data-time="19:00"><div class="time">7:00 PM</div><div class="period">Evening</div></div>
        <div class="time-slot" data-time="20:00"><div class="time">8:00 PM</div><div class="period">Evening</div></div>
      </div>

      <label for="reason">Reason for Rescheduling</label>
      <textarea id="reason" name="reason" placeholder="Optional — helps us plan better"></textarea>

      <button type="submit" class="btn-submit" id="submitBtn">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success" id="successMsg">
      <h2>RESCHEDULED!</h2>
      <p>Your new session time has been confirmed. You'll receive a WhatsApp reminder 1 hour before.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    const dateInput = document.getElementById('date');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    let selectedTime = '';
    document.querySelectorAll('.time-slot').forEach(slot => {
      slot.addEventListener('click', () => {
        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        selectedTime = slot.dataset.time;
      });
    });

    const form = document.getElementById('rescheduleForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedTime) { alert('Please select a time slot'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'CONFIRMING...';

      const data = {
        client_id: clientId,
        date: dateInput.value,
        time: selectedTime,
        reason: document.getElementById('reason').value
      };

      try {
        const res = await fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          form.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          alert('Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'CONFIRM RESCHEDULE';
        }
      } catch {
        alert('Network error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'CONFIRM RESCHEDULE';
      }
    });
  </script>
</body>
</html>
