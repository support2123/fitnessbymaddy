<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; color: var(--charcoal); }
    .form-success p { color: var(--mid-grey); line-height: 1.7; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px 8px; text-align: center; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s; }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
    @media (max-width: 500px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Need to Reschedule?</p>
    <h1 class="section-title">Pick a New<br><em>Time Slot</em></h1>
    <p class="section-body" style="margin: 16px auto 0;">Life happens. Let's find a time that works better.</p>
  </div>

  <div class="form-card" id="rescheduleForm">
    <form id="reschedule" novalidate>
      <input type="hidden" id="client_id" name="client_id">

      <div class="form-group">
        <label class="form-label" for="date">Preferred Date *</label>
        <input class="form-input" type="date" id="date" name="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot (IST) *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
          <div class="time-slot" data-time="21:00">9:00 PM</div>
        </div>
        <input type="hidden" id="selected_time" name="time">
      </div>

      <div class="form-group">
        <label class="form-label" for="reason">Reason (optional)</label>
        <textarea class="form-textarea" id="reason" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Reschedule Requested!</h2>
    <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  document.getElementById('client_id').value = clientId || '';

  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('date').min = today.toISOString().split('T')[0];

  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selected_time').value = this.dataset.time;
    });
  });

  document.getElementById('reschedule').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');
    errEl.style.display = 'none';

    var date = document.getElementById('date').value;
    var time = document.getElementById('selected_time').value;

    if (!date || !time) {
      errEl.textContent = 'Please select both a date and time slot.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        template: 'reschedule_request',
        params: {
          templateParams: [clientId || 'unknown', date, time, document.getElementById('reason').value || 'No reason given']
        }
      })
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      errEl.textContent = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    });
  });
})();
</script>
</body>
</html>
