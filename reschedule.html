<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .resched-wrap { max-width: 540px; margin: 0 auto; padding: 40px 24px 80px; }
    .resched-header { text-align: center; margin-bottom: 48px; }
    .resched-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 60px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="resched-wrap">
    <div class="resched-header">
      <p class="section-eyebrow">Session Management</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Need to move your Zoom session? Pick a new time below.</p>
    </div>

    <form id="reschedForm" class="resched-form">
      <div class="form-group">
        <label class="form-label">Your Phone Number *</label>
        <input class="form-input" type="tel" name="phone" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred New Date *</label>
        <input class="form-input" type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot</label>
        <select class="form-select" name="time_slot">
          <option value="morning">Morning (8am - 12pm IST)</option>
          <option value="afternoon">Afternoon (12pm - 4pm IST)</option>
          <option value="evening">Evening (4pm - 8pm IST)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Quick note on why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Request Sent!</h2>
      <p>Maddy's team will confirm your new session time via WhatsApp within 24 hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('reschedForm');
  var btn = document.getElementById('submitBtn');
  var success = document.getElementById('successMsg');

  var dateInput = form.querySelector('[name="preferred_date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'SENDING...';

    var data = {
      phone: form.phone.value,
      preferred_date: form.preferred_date.value,
      time_slot: form.time_slot.value,
      reason: form.reason.value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        text: 'RESCHEDULE REQUEST from ' + data.phone + ': ' + data.preferred_date + ' (' + data.time_slot + '). Reason: ' + (data.reason || 'N/A'),
        is_client: true
      })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      form.style.display = 'none';
      success.style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Something went wrong. Please try again or message us on WhatsApp.');
    });
  });
})();
</script>

</body>
</html>
