<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --red: #c0392b; --green: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; color: var(--gold);
      font-size: 32px; letter-spacing: 3px;
    }
    .form-header p { color: #ccc; font-size: 14px; margin-top: 8px; }
    .form-wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      background: #fff; color: var(--charcoal); transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--charcoal);
      color: #fff; border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: wait; }
    .msg { text-align: center; padding: 16px; border-radius: 4px; margin-top: 16px; font-size: 14px; }
    .msg.ok { background: #e8f5e9; color: var(--green); }
    .msg.err { background: #fdecea; color: var(--red); }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .time-slot {
      padding: 12px; border: 2px solid var(--light-grey); border-radius: 6px;
      text-align: center; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: var(--gold); color: #fff; }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Reschedule Session</h1>
  <p>Pick a new time that works for you</p>
</div>

<form class="form-wrap" id="rescheduleForm">
  <input type="hidden" name="client_id" id="client_id">

  <div class="field">
    <label>Your Name</label>
    <input type="text" name="name" required placeholder="Your name">
  </div>

  <div class="field">
    <label>Preferred Date *</label>
    <input type="date" name="preferred_date" required id="dateInput">
  </div>

  <div class="field">
    <label>Preferred Time Slot *</label>
    <div class="time-slots" id="timeSlots">
      <div class="time-slot" data-time="07:00">7:00 AM</div>
      <div class="time-slot" data-time="08:00">8:00 AM</div>
      <div class="time-slot" data-time="09:00">9:00 AM</div>
      <div class="time-slot" data-time="10:00">10:00 AM</div>
      <div class="time-slot" data-time="17:00">5:00 PM</div>
      <div class="time-slot" data-time="18:00">6:00 PM</div>
      <div class="time-slot" data-time="19:00">7:00 PM</div>
      <div class="time-slot" data-time="20:00">8:00 PM</div>
    </div>
    <input type="hidden" name="preferred_time" id="selectedTime" required>
  </div>

  <div class="field">
    <label>Reason for Rescheduling</label>
    <textarea name="reason" placeholder="Optional — let us know why you need to reschedule"></textarea>
  </div>

  <button type="submit" class="btn-submit" id="submitBtn">Request Reschedule</button>
  <div id="formMsg" class="msg" style="display:none"></div>
</form>

<script>
  var params = new URLSearchParams(window.location.search);
  document.getElementById('client_id').value = params.get('c') || '';

  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('dateInput').min = today.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.dataset.time;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMsg');

    if (!document.getElementById('selectedTime').value) {
      msg.className = 'msg err';
      msg.textContent = 'Please select a time slot';
      msg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.style.display = 'none';

    var data = {};
    new FormData(this).forEach(function(v, k) { data[k] = v; });

    try {
      var res = await fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          template_name: 'reschedule_request',
          params: [data.name || 'Client', data.preferred_date, data.preferred_time, data.reason || 'No reason given'],
          is_client: true,
        }),
      });
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Reschedule request sent! We\'ll confirm your new time within 24 hours.';
        msg.style.display = 'block';
        btn.textContent = 'SENT ✓';
      } else {
        throw new Error('Failed to send');
      }
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = 'Something went wrong. Please message us on WhatsApp instead.';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    }
  });
</script>
</body>
</html>
