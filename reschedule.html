<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; color: var(--charcoal); }
    .form-header h1 em { font-style: italic; color: var(--gold); }
    .form-header p { font-size: 15px; color: var(--mid-grey); margin-top: 12px; line-height: 1.7; }
    .form-card { background: white; padding: 48px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { text-align: center; }
    .time-slot input { display: none; }
    .time-slot label {
      display: block; padding: 12px 8px; font-size: 13px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; cursor: pointer; transition: all 0.3s; background: var(--cream); color: var(--mid-grey);
    }
    .time-slot input:checked + label { border-color: var(--gold); background: var(--gold); color: white; }
    .form-submit {
      width: 100%; padding: 18px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; transition: background 0.3s; margin-top: 32px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1>Pick a <em>New Time</em></h1>
      <p>Life happens — let's find a time that works better for your session.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="resched" onsubmit="return submitReschedule(event)">

        <div class="form-group">
          <label class="form-label" for="resched_date">Preferred Date *</label>
          <input class="form-input" type="date" id="resched_date" name="date" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <div class="time-slots">
            <div class="time-slot">
              <input type="radio" id="t1" name="time_slot" value="6am-8am" required>
              <label for="t1">6–8 AM</label>
            </div>
            <div class="time-slot">
              <input type="radio" id="t2" name="time_slot" value="8am-10am">
              <label for="t2">8–10 AM</label>
            </div>
            <div class="time-slot">
              <input type="radio" id="t3" name="time_slot" value="10am-12pm">
              <label for="t3">10–12 PM</label>
            </div>
            <div class="time-slot">
              <input type="radio" id="t4" name="time_slot" value="12pm-2pm">
              <label for="t4">12–2 PM</label>
            </div>
            <div class="time-slot">
              <input type="radio" id="t5" name="time_slot" value="4pm-6pm">
              <label for="t5">4–6 PM</label>
            </div>
            <div class="time-slot">
              <input type="radio" id="t6" name="time_slot" value="6pm-8pm">
              <label for="t6">6–8 PM</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="resched_reason">Reason (optional)</label>
          <textarea class="form-textarea" id="resched_reason" name="reason" placeholder="e.g., work meeting, travel, not feeling well..."></textarea>
        </div>

        <div id="formError" class="error-msg"></div>
        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>Request Sent!</h2>
      <p>Maddy's team will confirm your new slot via WhatsApp. You'll hear back within a few hours.</p>
    </div>
  </div>
</div>

<script>
var today = new Date();
today.setDate(today.getDate() + 1);
var minDate = today.toISOString().split('T')[0];
document.getElementById('resched_date').setAttribute('min', minDate);

async function submitReschedule(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var errEl = document.getElementById('formError');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';
  errEl.style.display = 'none';

  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (!clientId) {
    errEl.textContent = 'Invalid link — please use the link sent to your WhatsApp.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'REQUEST RESCHEDULE';
    return false;
  }

  var form = document.getElementById('resched');
  var selectedTime = form.querySelector('input[name="time_slot"]:checked');

  var data = {
    client_id: clientId,
    date: document.getElementById('resched_date').value,
    time_slot: selectedTime ? selectedTime.value : '',
    reason: document.getElementById('resched_reason').value,
  };

  try {
    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'REQUEST RESCHEDULE';
  }
  return false;
}
</script>
<script src="js/nav.js"></script>
</body>
</html>
