<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --error: #C0392B; --success: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream); color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p {
      color: #ccc; font-size: 14px; margin-top: 8px;
    }
    .form-container {
      max-width: 540px; margin: -20px auto 40px; padding: 32px 24px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 8px; background: var(--cream); color: var(--charcoal);
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .required::after { content: ' *'; color: var(--error); }
    .btn-submit {
      width: 100%; padding: 14px; font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--gold); color: #fff; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--charcoal); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .msg.error { display: block; background: #fde8e8; color: var(--error); }
    .msg.success { display: block; background: #e8fde8; color: var(--success); }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .time-slot {
      padding: 10px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s; background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected {
      background: var(--gold); color: #fff; border-color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Life happens! Pick a new time that works for you.</p>
  </div>

  <div class="form-container">
    <div id="msg" class="msg"></div>

    <form id="rescheduleForm" novalidate>
      <input type="hidden" id="client_id" name="client_id">

      <div class="field">
        <label class="required" for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>

      <div class="field">
        <label class="required" for="phone">WhatsApp Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label class="required" for="original_date">Original Session Date</label>
        <input type="date" id="original_date" name="original_date" required>
      </div>

      <div class="field">
        <label class="required" for="preferred_date">Preferred New Date</label>
        <input type="date" id="preferred_date" name="preferred_date" required>
      </div>

      <div class="field">
        <label class="required">Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="7:00 AM">7:00 AM</div>
          <div class="time-slot" data-time="8:00 AM">8:00 AM</div>
          <div class="time-slot" data-time="9:00 AM">9:00 AM</div>
          <div class="time-slot" data-time="10:00 AM">10:00 AM</div>
          <div class="time-slot" data-time="5:00 PM">5:00 PM</div>
          <div class="time-slot" data-time="6:00 PM">6:00 PM</div>
          <div class="time-slot" data-time="7:00 PM">7:00 PM</div>
          <div class="time-slot" data-time="8:00 PM">8:00 PM</div>
        </div>
        <input type="hidden" id="preferred_time" name="preferred_time" required>
      </div>

      <div class="field">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason" rows="2" placeholder="Quick note on why you're rescheduling..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    if (clientId) document.getElementById('client_id').value = clientId;

    var today = new Date().toISOString().split('T')[0];
    document.getElementById('preferred_date').setAttribute('min', today);

    var slots = document.querySelectorAll('.time-slot');
    for (var i = 0; i < slots.length; i++) {
      slots[i].addEventListener('click', function() {
        for (var j = 0; j < slots.length; j++) slots[j].classList.remove('selected');
        this.classList.add('selected');
        document.getElementById('preferred_time').value = this.getAttribute('data-time');
      });
    }

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'msg';

      var form = e.target;
      var time = document.getElementById('preferred_time').value;
      if (!time) {
        msg.className = 'msg error';
        msg.textContent = 'Please select a preferred time slot.';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        return;
      }

      var data = {
        client_id: form.client_id.value || undefined,
        name: form.name.value,
        phone: form.phone.value,
        original_date: form.original_date.value,
        preferred_date: form.preferred_date.value,
        preferred_time: time,
        reason: form.reason.value || undefined,
      };

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer internal-form',
        },
        body: JSON.stringify({
          phone: '+917082478374',
          message: 'Reschedule request from ' + data.name + ' (' + data.phone + '): ' +
            data.original_date + ' → ' + data.preferred_date + ' at ' + data.preferred_time +
            (data.reason ? '. Reason: ' + data.reason : ''),
          is_client: true,
        }),
      })
      .then(function() {
        msg.className = 'msg success';
        msg.textContent = 'Reschedule request sent! Maddy\'s team will confirm your new slot on WhatsApp.';
        form.style.display = 'none';
      })
      .catch(function() {
        msg.className = 'msg error';
        msg.textContent = 'Failed to submit. Please message us on WhatsApp directly.';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  </script>
</body>
</html>
