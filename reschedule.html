<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #B8965A;
      --charcoal: #2C2C2C;
      --cream: #FAF8F4;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 24px 32px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    .form-header p {
      color: #ccc;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .form-container {
      max-width: 480px;
      margin: -20px auto 40px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .field label .req { color: var(--gold); }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      background: var(--cream);
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field textarea { resize: vertical; min-height: 80px; }

    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .time-slot {
      padding: 10px;
      border: 1.5px solid var(--light-grey);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      background: var(--cream);
    }

    .time-slot:hover { border-color: var(--gold); }

    .time-slot.selected {
      border-color: var(--gold);
      background: var(--gold);
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }

    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2rem;
    }

    .success-msg p {
      color: var(--mid-grey);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Pick a new date and time that works for you</p>
  </div>

  <div class="form-container" id="formContainer">
    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="field">
        <label>Your Name <span class="req">*</span></label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="field">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label>Preferred Date <span class="req">*</span></label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot <span class="req">*</span></label>
        <input type="hidden" name="preferred_time" id="selectedTime" required>
        <div class="time-slots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
      </div>

      <div class="field">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — let us know why"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Received!</h2>
    <p>We'll confirm your new session time on WhatsApp shortly.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    if (clientId) document.getElementById('clientId').value = clientId;

    var today = new Date().toISOString().split('T')[0];
    document.querySelector('input[name="preferred_date"]').setAttribute('min', today);

    document.querySelectorAll('.time-slot').forEach(function (slot) {
      slot.addEventListener('click', function () {
        document.querySelectorAll('.time-slot').forEach(function (s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        document.getElementById('selectedTime').value = slot.getAttribute('data-time');
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', function (e) {
      e.preventDefault();

      if (!document.getElementById('selectedTime').value) {
        alert('Please select a time slot');
        return;
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var form = e.target;
      var data = {
        client_id: form.client_id.value || undefined,
        name: form.name.value,
        phone: form.phone.value,
        preferred_date: form.preferred_date.value,
        preferred_time: form.preferred_time.value,
        reason: form.reason.value,
      };

      fetch('/api/reschedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(function () {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'REQUEST RESCHEDULE';
          alert('Something went wrong. Please try again.');
        });
    });
  </script>
</body>
</html>
