<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .header {
      background: var(--charcoal); padding: 24px 20px; text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      color: var(--gold); letter-spacing: 4px;
    }
    .header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }

    .form-container { max-width: 520px; margin: 0 auto; padding: 32px 20px 60px; }

    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--charcoal); letter-spacing: 2px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--light-grey); border-radius: 3px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--white);
      outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }

    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .time-slot {
      padding: 14px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 3px; cursor: pointer; transition: all 0.3s;
      font-size: 13px; font-weight: 500; background: var(--white);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: var(--white); border-color: var(--charcoal); }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); border: none; cursor: pointer;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; border-radius: 3px;
      transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none; text-align: center; padding: 60px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }

    .error-msg {
      background: #fee; color: #c00; padding: 12px; border-radius: 3px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Reschedule Your Session</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="rescheduleForm">
      <div class="form-section-title">SELECT NEW DATE</div>
      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="date" required id="dateInput">
      </div>

      <div class="form-section-title" style="margin-top:24px">SELECT TIME SLOT</div>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="06:00">6:00 AM</div>
        <div class="time-slot" data-time="07:00">7:00 AM</div>
        <div class="time-slot" data-time="08:00">8:00 AM</div>
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="17:00">5:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
        <div class="time-slot" data-time="19:00">7:00 PM</div>
        <div class="time-slot" data-time="20:00">8:00 PM</div>
      </div>
      <input type="hidden" name="time" id="timeInput">

      <div class="field" style="margin-top:24px">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — let us know so we can help plan better"></textarea>
      </div>

      <input type="hidden" name="client_id" id="clientIdInput">
      <button type="submit" class="submit-btn" id="submitBtn">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>RESCHEDULED!</h2>
      <p>Your session has been rescheduled. You'll receive a confirmation on WhatsApp shortly.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    document.getElementById('clientIdInput').value = params.get('c') || '';

    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('dateInput').min = tomorrow.toISOString().split('T')[0];

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        document.getElementById('timeInput').value = this.dataset.time;
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');

      if (!document.getElementById('timeInput').value) {
        errEl.textContent = 'Please select a time slot.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'CONFIRMING...';
      errEl.style.display = 'none';

      // For now, show success. In production, POST to a reschedule API.
      setTimeout(function() {
        document.getElementById('rescheduleForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      }, 800);
    });
  </script>
</body>
</html>
