<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card {
      background: white; padding: 40px 32px; border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
    }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 12px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success {
      text-align: center; padding: 60px 24px; display: none;
    }
    .form-success h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; color: var(--charcoal); margin-bottom: 16px;
    }
    .form-success p { color: var(--mid-grey); font-size: 16px; line-height: 1.7; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer;
      transition: all 0.3s; color: var(--charcoal);
      background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal); color: white; border-color: var(--charcoal);
    }
    .required::after { content: ' *'; color: var(--gold); }
    @media (max-width: 600px) {
      .time-slots { grid-template-columns: repeat(2, 1fr); }
      .form-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <p class="section-eyebrow">Rescheduling</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin: 0 auto;">Pick a new date and time that works for you. We'll confirm via WhatsApp.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="submitReschedule(event)">
        <div class="form-group">
          <label class="form-label required">Preferred Date</label>
          <input class="form-input" type="date" name="date" required>
        </div>

        <div class="form-group">
          <label class="form-label required">Preferred Time Slot</label>
          <input type="hidden" name="time_slot" id="timeSlotInput" required>
          <div class="time-slots">
            <div class="time-slot" onclick="selectSlot(this,'7:00 AM')">7:00 AM</div>
            <div class="time-slot" onclick="selectSlot(this,'8:00 AM')">8:00 AM</div>
            <div class="time-slot" onclick="selectSlot(this,'9:00 AM')">9:00 AM</div>
            <div class="time-slot" onclick="selectSlot(this,'10:00 AM')">10:00 AM</div>
            <div class="time-slot" onclick="selectSlot(this,'5:00 PM')">5:00 PM</div>
            <div class="time-slot" onclick="selectSlot(this,'6:00 PM')">6:00 PM</div>
            <div class="time-slot" onclick="selectSlot(this,'7:00 PM')">7:00 PM</div>
            <div class="time-slot" onclick="selectSlot(this,'8:00 PM')">8:00 PM</div>
            <div class="time-slot" onclick="selectSlot(this,'9:00 PM')">9:00 PM</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Reason for Rescheduling</label>
          <textarea class="form-textarea" name="reason" placeholder="Optional — let us know if there's anything specific..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');

  var dateInput = document.querySelector('input[name="date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  function selectSlot(el, time) {
    document.querySelectorAll('.time-slot').forEach(function(s) {
      s.classList.remove('selected');
    });
    el.classList.add('selected');
    document.getElementById('timeSlotInput').value = time;
  }

  async function submitReschedule(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');

    if (!document.getElementById('timeSlotInput').value) {
      alert('Please select a time slot.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = document.getElementById('reschedule');
    var data = {
      client_id: clientId,
      date: form.date.value,
      time_slot: document.getElementById('timeSlotInput').value,
      reason: form.reason.value,
    };

    try {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Something went wrong. Please try again.');
    }
  }
</script>
</body>
</html>
