<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap {
      min-height: 100vh;
      background: var(--cream);
      padding: 100px 24px 60px;
      display: flex; justify-content: center;
    }
    .reschedule-card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 48px 40px;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .reschedule-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); text-align: center; margin-bottom: 8px;
    }
    .reschedule-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 300; text-align: center;
      color: var(--charcoal); margin-bottom: 8px;
    }
    .reschedule-title em { color: var(--gold); font-style: italic; }
    .reschedule-sub {
      text-align: center; font-size: 14px; color: var(--mid-grey);
      margin-bottom: 40px; line-height: 1.6;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
    }
    .form-textarea { min-height: 80px; resize: vertical; }
    .submit-btn {
      width: 100%; padding: 16px; margin-top: 12px;
      background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; border: none; cursor: pointer;
      border-radius: 2px; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg {
      background: #fff0f0; color: #c00; padding: 12px 16px;
      border-radius: 4px; font-size: 13px; margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 600px) {
      .reschedule-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="reschedule-wrap">
  <div class="reschedule-card">
    <div id="formSection">
      <div class="reschedule-brand">Fitness by Maddy</div>
      <h1 class="reschedule-title">Reschedule <em>Session</em></h1>
      <p class="reschedule-sub">Life happens. Pick a new slot and we'll sort it out.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="rescheduleForm">
        <div class="form-group">
          <label class="form-label" for="name">Your Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">WhatsApp Number *</label>
          <input class="form-input" type="tel" id="phone" name="phone" placeholder="+91..." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="preferred_date">Preferred New Date *</label>
          <input class="form-input" type="date" id="preferred_date" name="preferred_date" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="preferred_time">Preferred Time Slot *</label>
          <select class="form-select" id="preferred_time" name="preferred_time" required>
            <option value="">Select a time</option>
            <option value="morning_early">6:00 AM - 8:00 AM</option>
            <option value="morning">8:00 AM - 10:00 AM</option>
            <option value="midday">10:00 AM - 12:00 PM</option>
            <option value="afternoon">2:00 PM - 4:00 PM</option>
            <option value="evening_early">4:00 PM - 6:00 PM</option>
            <option value="evening">6:00 PM - 8:00 PM</option>
            <option value="night">8:00 PM - 10:00 PM</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reason">Reason (optional)</label>
          <textarea class="form-textarea" id="reason" name="reason" placeholder="Why do you need to reschedule?"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We've received your reschedule request. You'll get a confirmation on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('preferred_date').min = today;

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var data = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      preferred_date: document.getElementById('preferred_date').value,
      preferred_time: document.getElementById('preferred_time').value,
      reason: document.getElementById('reason').value.trim()
    };

    setTimeout(function() {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }, 800);
  });
})();
</script>
</body>
</html>
