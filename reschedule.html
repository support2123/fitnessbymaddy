<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); }
    .hidden { display: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; cursor: pointer; font-size: 13px; transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    @media (max-width: 600px) { .form-card { padding: 32px 20px; } .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="margin:0 auto">Life happens! Let's find a time that works better for you.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="return submitReschedule(event)">
        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input class="form-input" type="date" name="date" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="16:00">4:00 PM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
          </div>
          <input type="hidden" name="time" id="selectedTime">
        </div>

        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Confirm Reschedule</button>
      </form>
    </div>

    <div class="success-msg hidden" id="successMsg">
      <h2>Rescheduled! ✓</h2>
      <p>Your session has been moved. You'll get a WhatsApp confirmation shortly.</p>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.time-slot').forEach(function(slot) {
  slot.addEventListener('click', function() {
    document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
    slot.classList.add('selected');
    document.getElementById('selectedTime').value = slot.dataset.time;
  });
});

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function submitReschedule(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var time = document.getElementById('selectedTime').value;
  if (!time) { alert('Please select a time slot.'); return false; }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var form = document.getElementById('reschedule');
  var data = {
    client_id: getParam('c'),
    date: form.date.value,
    time: time,
    reason: form.reason.value || null
  };

  try {
    var resp = await fetch('/api/reschedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (resp.ok) {
      document.getElementById('rescheduleForm').classList.add('hidden');
      document.getElementById('successMsg').classList.remove('hidden');
    } else {
      btn.disabled = false;
      btn.textContent = 'Confirm Reschedule';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Confirm Reschedule';
    alert('Network error. Please check your connection.');
  }
  return false;
}
</script>
</body>
</html>
