<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --white: #FFFFFF;
      --error: #C0392B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 20px 30px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }

    .form-header p {
      color: var(--gold-light);
      font-size: 14px;
      margin-top: 8px;
    }

    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .info-box {
      background: var(--sand);
      border-left: 3px solid var(--gold);
      padding: 16px;
      margin-bottom: 28px;
      border-radius: 0 4px 4px 0;
      font-size: 14px;
      color: var(--mid-grey);
      line-height: 1.5;
    }

    .field-group {
      margin-bottom: 24px;
    }

    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--white);
      transition: border-color 0.3s;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field-group textarea { min-height: 80px; resize: vertical; }

    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .time-slots label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--charcoal);
      transition: all 0.2s;
    }

    .time-slots label:has(input:checked) {
      border-color: var(--gold);
      background: rgba(184, 150, 90, 0.1);
    }

    .time-slots input { display: none; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 16px;
    }

    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg .check { font-size: 48px; }

    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      margin: 16px 0 8px;
    }

    .success-msg p { color: var(--mid-grey); font-size: 15px; }

    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>RESCHEDULE SESSION</h1>
    <p>Life happens — let's find a new time</p>
  </div>

  <div class="form-container">
    <div class="info-box">
      Rescheduling must be done at least 12 hours before your session. Same-day cancellations count as a used session.
    </div>

    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="field-group">
        <label for="name">Your Name *</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field-group">
        <label for="phone">WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="field-group">
        <label for="originalDate">Original Session Date *</label>
        <input type="date" id="originalDate" name="original_date" required>
      </div>

      <div class="field-group">
        <label for="newDate">Preferred New Date *</label>
        <input type="date" id="newDate" name="new_date" required>
      </div>

      <div class="field-group">
        <label>Preferred Time Slot *</label>
        <div class="time-slots">
          <label><input type="radio" name="time_slot" value="7am" required> 7:00 AM</label>
          <label><input type="radio" name="time_slot" value="8am"> 8:00 AM</label>
          <label><input type="radio" name="time_slot" value="9am"> 9:00 AM</label>
          <label><input type="radio" name="time_slot" value="10am"> 10:00 AM</label>
          <label><input type="radio" name="time_slot" value="5pm"> 5:00 PM</label>
          <label><input type="radio" name="time_slot" value="6pm"> 6:00 PM</label>
          <label><input type="radio" name="time_slot" value="7pm"> 7:00 PM</label>
          <label><input type="radio" name="time_slot" value="8pm"> 8:00 PM</label>
        </div>
      </div>

      <div class="field-group">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason" placeholder="Quick note on why you need to reschedule..."></textarea>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <div class="check">✅</div>
      <h2>REQUEST RECEIVED!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours. Check your messages!</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    if (clientId) document.getElementById('clientId').value = clientId;

    var today = new Date().toISOString().split('T')[0];
    document.getElementById('newDate').setAttribute('min', today);

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(v, k) { data[k] = v; });

      try {
        var resp = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        document.getElementById('rescheduleForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        errEl.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      }
    });
  </script>
</body>
</html>
