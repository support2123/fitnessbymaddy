<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; font-size: 13px; cursor: pointer; transition: all 0.3s; }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
    @media (max-width: 600px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Zoom Coaching</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Pick a new time that works for you.</p>
    </div>

    <div class="form-card" id="reschedule-form-card">
      <form id="reschedule-form">
        <div class="form-group">
          <label class="form-label">Preferred Date</label>
          <input type="date" name="date" class="form-input" required id="date-input">
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot (IST)</label>
          <div class="time-slots" id="time-slots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
            <div class="time-slot" data-time="21:00">9:00 PM</div>
          </div>
          <input type="hidden" name="time" id="selected-time">
        </div>

        <div class="form-group">
          <label class="form-label">Reason for Rescheduling (optional)</label>
          <textarea name="reason" class="form-textarea" placeholder="Let us know why you need to reschedule..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submit-btn">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="success-msg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');

  var dateInput = document.getElementById('date-input');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  var slots = document.querySelectorAll('.time-slot');
  var selectedTimeInput = document.getElementById('selected-time');

  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      selectedTimeInput.value = slot.getAttribute('data-time');
    });
  });

  var form = document.getElementById('reschedule-form');
  var btn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!selectedTimeInput.value) { alert('Please select a time slot.'); return; }
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var data = {
      client_id: clientId,
      date: form.date.value,
      time: selectedTimeInput.value,
      reason: form.reason.value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        template_name: 'reschedule_request',
        params: [clientId, data.date, data.time, data.reason || 'N/A']
      })
    })
    .then(function() {
      document.getElementById('reschedule-form-card').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Network error. Please try again.');
    });
  });
})();
</script>
</body>
</html>
