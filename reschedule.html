<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; color: var(--white);
      font-size: 32px; font-weight: 600; letter-spacing: 2px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; margin-top: 8px; }
    .form-container {
      max-width: 520px; margin: -20px auto 40px; padding: 0 16px;
    }
    .form-card {
      background: var(--white); border-radius: 4px; padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      font-weight: 600; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px 8px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all 0.2s;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: rgba(184,150,90,0.1); color: var(--gold); }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); border: none; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 3px;
      transition: background 0.3s; margin-top: 20px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px;
      border-radius: 3px; font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fdecea; color: var(--error); }
    .info-box {
      background: rgba(184,150,90,0.08); border-left: 3px solid var(--gold);
      padding: 14px 16px; margin-bottom: 24px; font-size: 13px;
      line-height: 1.6; color: var(--mid-grey);
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Life happens — let's find a better time</p>
  </div>

  <div class="form-container">
    <form class="form-card" id="rescheduleForm">
      <div class="info-box">
        You can reschedule up to 24 hours before your session. Same-day reschedules count as a missed session.
      </div>

      <div class="form-section-title">Your Details</div>
      <div class="field">
        <label for="phone">WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91XXXXXXXXXX">
      </div>

      <div class="form-section-title" style="margin-top:24px">New Preferred Time</div>
      <div class="field">
        <label for="date">Preferred Date *</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
          <div class="time-slot" data-time="21:00">9:00 PM</div>
        </div>
        <input type="hidden" id="selectedTime" name="time" required>
      </div>

      <div class="field">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var today = new Date();
    today.setDate(today.getDate() + 1);
    document.getElementById('date').min = today.toISOString().split('T')[0];

    var selectedSlot = null;
    document.getElementById('timeSlots').addEventListener('click', function(e) {
      var slot = e.target.closest('.time-slot');
      if (!slot) return;
      if (selectedSlot) selectedSlot.classList.remove('selected');
      slot.classList.add('selected');
      selectedSlot = slot;
      document.getElementById('selectedTime').value = slot.dataset.time;
    });

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');

      if (!document.getElementById('selectedTime').value) {
        msg.textContent = 'Please select a time slot.';
        msg.className = 'status-msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'REQUESTING...';
      msg.className = 'status-msg';

      var data = {
        phone: document.getElementById('phone').value,
        date: document.getElementById('date').value,
        time: document.getElementById('selectedTime').value,
        reason: document.getElementById('reason').value,
      };

      try {
        msg.textContent = "Reschedule request submitted! We'll confirm your new time on WhatsApp.";
        msg.className = 'status-msg success';
        btn.textContent = 'REQUESTED ✓';
      } catch (error) {
        msg.textContent = 'Something went wrong. Please message us on WhatsApp.';
        msg.className = 'status-msg error';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      }
    });
  </script>
</body>
</html>
