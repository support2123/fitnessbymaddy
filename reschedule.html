<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap { max-width: 480px; margin: 0 auto; padding: 40px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 12px; }
    .reschedule-header p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .reschedule-form .form-group { margin-bottom: 24px; }
    .reschedule-form .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .reschedule-form .form-input, .reschedule-form .form-select, .reschedule-form textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; transition: border-color 0.3s; outline: none;
    }
    .reschedule-form .form-input:focus, .reschedule-form .form-select:focus { border-color: var(--gold); }
    .reschedule-form .form-select { appearance: none; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 16px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 14px; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Zoom Session</p>
      <h1>Reschedule <em>Session</em></h1>
      <p>Need to move your session? Pick a new time that works for you.</p>
    </div>

    <form class="reschedule-form" id="rescheduleForm">
      <div class="form-group">
        <label class="form-label">Your Name *</label>
        <input type="text" name="name" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred New Date *</label>
        <input type="date" name="new_date" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <select name="time_slot" class="form-select" required>
          <option value="">Select a time</option>
          <option value="7am">7:00 AM IST</option>
          <option value="8am">8:00 AM IST</option>
          <option value="9am">9:00 AM IST</option>
          <option value="10am">10:00 AM IST</option>
          <option value="5pm">5:00 PM IST</option>
          <option value="6pm">6:00 PM IST</option>
          <option value="7pm">7:00 PM IST</option>
          <option value="8pm">8:00 PM IST</option>
          <option value="9pm">9:00 PM IST</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <input type="text" name="reason" class="form-input" placeholder="E.g., work conflict, travel...">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Request Sent!</h2>
      <p>Maddy will confirm your new slot on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var today = new Date().toISOString().split('T')[0];
  document.querySelector('input[name="new_date"]').min = today;

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var form = e.target;
    var data = {
      name: form.name.value,
      new_date: form.new_date.value,
      time_slot: form.time_slot.value,
      reason: form.reason.value || null,
      client_id: new URLSearchParams(window.location.search).get('c')
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        message: 'Reschedule request from ' + data.name + ': ' + data.new_date + ' at ' + data.time_slot + (data.reason ? ' (' + data.reason + ')' : '')
      })
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
