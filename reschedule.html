<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--black);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: white;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .form-header p {
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 300;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--charcoal);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      min-height: 80px;
      resize: vertical;
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 4px;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 15px;
      line-height: 1.6;
    }
    .error-msg {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>RESCHEDULE SESSION</h1>
    <p>Life happens. Let's find a time that works better.</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="rescheduleForm">
      <div class="form-section-title">NEW DATE & TIME</div>

      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-value="7:00 AM">7:00 AM</div>
          <div class="time-slot" data-value="8:00 AM">8:00 AM</div>
          <div class="time-slot" data-value="9:00 AM">9:00 AM</div>
          <div class="time-slot" data-value="10:00 AM">10:00 AM</div>
          <div class="time-slot" data-value="5:00 PM">5:00 PM</div>
          <div class="time-slot" data-value="6:00 PM">6:00 PM</div>
          <div class="time-slot" data-value="7:00 PM">7:00 PM</div>
          <div class="time-slot" data-value="8:00 PM">8:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime" required>
      </div>

      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Why do you need to reschedule?"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>RESCHEDULE REQUESTED</h2>
      <p>We'll confirm your new slot on WhatsApp shortly. If the time isn't available, we'll suggest alternatives.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var selectedTime = '';

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTime = slot.getAttribute('data-value');
        document.getElementById('selectedTime').value = selectedTime;
      });
    });

    var dateInput = document.querySelector('input[name="preferred_date"]');
    var today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorEl = document.getElementById('errorMsg');

      if (!selectedTime) {
        errorEl.textContent = 'Please select a time slot.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errorEl.style.display = 'none';

      var formData = new FormData(this);
      var payload = {
        client_id: clientId,
        preferred_date: formData.get('preferred_date'),
        preferred_time: selectedTime,
        reason: formData.get('reason')
      };

      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
