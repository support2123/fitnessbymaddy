<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--cream);
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: var(--mid-grey);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 4px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--charcoal);
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>Reschedule Session</h1>
      <p>Life happens — pick a new time that works for you</p>
    </div>

    <form id="rescheduleForm">
      <div class="form-group">
        <label>Preferred Date *</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label>Preferred Time *</label>
        <select name="preferred_time" required>
          <option value="">Select a slot</option>
          <option value="6:00">6:00 AM</option>
          <option value="7:00">7:00 AM</option>
          <option value="8:00">8:00 AM</option>
          <option value="9:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>

      <div class="form-group">
        <label>Reason for Reschedule</label>
        <textarea name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <button type="submit" class="btn-submit">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Rescheduled!</h2>
      <p>You'll receive a WhatsApp confirmation with your new session time shortly.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    const dateInput = document.querySelector('input[name="preferred_date"]');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'CONFIRMING...';

      const formData = new FormData(this);
      const data = {
        client_id: clientId,
        preferred_date: formData.get('preferred_date'),
        preferred_time: formData.get('preferred_time'),
        reason: formData.get('reason') || null,
      };

      try {
        const res = await fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          alert('Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'CONFIRM RESCHEDULE';
        }
      } catch {
        alert('Network error. Please check your connection.');
        btn.disabled = false;
        btn.textContent = 'CONFIRM RESCHEDULE';
      }
    });
  </script>
</body>
</html>
