<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #1a1a1a; color: #fff; }
    .resched-wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
    .resched-header { text-align: center; padding: 40px 0 32px; border-bottom: 2px solid #B8965A; margin-bottom: 32px; }
    .resched-brand { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 6px; color: #B8965A; text-transform: uppercase; margin-bottom: 8px; }
    .resched-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: #fff; }
    .resched-sub { font-size: 13px; color: #888; margin-top: 8px; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #B8965A; margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; background: #222; border: 1.5px solid #333;
      border-radius: 4px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #B8965A; }
    .field textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; background: #222; border: 1.5px solid #333; border-radius: 4px; text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s; }
    .time-slot:hover { border-color: #B8965A; }
    .time-slot.selected { background: #B8965A; color: #1a1a1a; border-color: #B8965A; font-weight: 600; }
    .submit-btn {
      width: 100%; padding: 16px; background: #B8965A; color: #1a1a1a;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px;
      cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: #D4AF7A; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #B8965A; margin-bottom: 12px; }
    .success-msg p { font-size: 14px; color: #888; }
    .error-msg { background: #4a1c1c; color: #ff6b6b; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; display: none; }
  </style>
</head>
<body>
<div class="page-wrap" style="padding-top:0">
  <div class="resched-wrap">
    <div class="resched-header">
      <div class="resched-brand">Fitness by Maddy</div>
      <div class="resched-title">Reschedule Session</div>
      <div class="resched-sub">Life happens — pick a new time that works for you</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="rescheduleForm">
      <div class="field">
        <label>Your Phone (WhatsApp)</label>
        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="field">
        <label>Preferred Date</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime">
      </div>

      <div class="field">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — let us know if there's anything specific"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Request Submitted!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      document.getElementById('selectedTime').value = slot.dataset.time;
    });
  });

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    if (!document.getElementById('selectedTime').value) {
      errEl.textContent = 'Please select a time slot.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        body: 'Reschedule request from ' + data.phone + ' for ' + data.preferred_date + ' at ' + data.preferred_time + '. Reason: ' + (data.reason || 'Not specified'),
        forceOverrideRateLimit: true
      })
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      errEl.textContent = 'Network error. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
    });
  });
})();
</script>
</body>
</html>
