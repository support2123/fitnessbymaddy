<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Missed a session? Reschedule here.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: white;
      letter-spacing: 3px;
    }
    .form-header p {
      color: var(--gold-light);
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--charcoal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
      background: white;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Missed a session? Let's get you back on track</p>
  </div>

  <div class="form-container" id="formWrap">
    <form id="rescheduleForm">
      <div class="form-section-title">Your Details</div>
      <div class="field">
        <label>Name *</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Phone (WhatsApp) *</label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>
      <div class="field">
        <label>Program</label>
        <select name="program">
          <option value="zoom_trial">Zoom Trial Session</option>
          <option value="zoom_pack">Zoom Session Pack</option>
          <option value="12wk">12-Week Custom</option>
          <option value="vip">1-on-1 VIP Coaching</option>
        </select>
      </div>

      <div class="form-section-title" style="margin-top:32px">Preferred Date & Time</div>
      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="field">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="14:00">2:00 PM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="preferred_time">
      </div>

      <div class="field">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Sent!</h2>
    <p>Maddy's team will confirm your rescheduled session via WhatsApp within 24 hours.</p>
  </div>

  <script>
    var slots = document.querySelectorAll('.time-slot');
    for (var i = 0; i < slots.length; i++) {
      slots[i].addEventListener('click', function() {
        for (var j = 0; j < slots.length; j++) slots[j].classList.remove('selected');
        this.classList.add('selected');
        document.getElementById('preferred_time').value = this.getAttribute('data-time');
      });
    }

    var dateInput = document.querySelector('input[name="preferred_date"]');
    var today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      var form = e.target;
      var data = {};
      var inputs = form.querySelectorAll('input, select, textarea');
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].name) data[inputs[i].name] = inputs[i].value;
      }

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function() {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        alert('Something went wrong. Please try again.');
      });
    });
  </script>
</body>
</html>
