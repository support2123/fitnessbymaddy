<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:#FAF8F4; color:#2C2C2C; min-height:100vh; }
    .form-header { background:#2C2C2C; padding:40px 24px; text-align:center; }
    .form-header h1 { font-family:'Bebas Neue',sans-serif; font-size:36px; color:#B8965A; letter-spacing:4px; }
    .form-header p { color:#999; font-size:14px; margin-top:8px; }
    .form-container { max-width:480px; margin:0 auto; padding:40px 24px 60px; }
    .field { margin-bottom:20px; }
    .field label { display:block; font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:#6B6B6B; margin-bottom:8px; }
    .field input, .field select, .field textarea {
      width:100%; padding:14px 16px; border:1.5px solid #E8E3DC; border-radius:4px;
      font-size:14px; font-family:'DM Sans',sans-serif; color:#2C2C2C;
      background:#fff; outline:none; transition:border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:#B8965A; }
    .field textarea { resize:vertical; min-height:80px; }
    .time-slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
    .time-slot { text-align:center; padding:12px; border:1.5px solid #E8E3DC; border-radius:4px; cursor:pointer; transition:all 0.2s; font-size:13px; }
    .time-slot:hover { border-color:#B8965A; }
    .time-slot.selected { border-color:#B8965A; background:#FBF7F0; color:#B8965A; font-weight:600; }
    .submit-btn {
      width:100%; padding:16px; background:#2C2C2C; color:#fff;
      font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      border:none; border-radius:4px; cursor:pointer; transition:background 0.3s; margin-top:24px;
    }
    .submit-btn:hover { background:#B8965A; }
    .success-msg { display:none; text-align:center; padding:60px 24px; }
    .success-msg h2 { font-family:'Bebas Neue',sans-serif; font-size:32px; color:#B8965A; margin-bottom:12px; }
    .success-msg p { color:#6B6B6B; font-size:15px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Pick a new time that works for you</p>
  </div>

  <div class="form-container" id="formWrap">
    <form id="rescheduleForm">
      <div class="field">
        <label>Your Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label>WhatsApp Number</label>
        <input type="tel" name="phone" placeholder="+91..." required>
      </div>
      <div class="field">
        <label>Preferred Date</label>
        <input type="date" name="date" required>
      </div>
      <div class="field">
        <label>Preferred Time (IST)</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" onclick="selectSlot(this)" data-val="09:00">9:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-val="10:00">10:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-val="11:00">11:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-val="14:00">2:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-val="16:00">4:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-val="18:00">6:00 PM</div>
        </div>
        <input type="hidden" name="time" id="timeInput" required>
      </div>
      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Why do you need to reschedule?"></textarea>
      </div>
      <button type="submit" class="submit-btn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Received!</h2>
    <p>We'll confirm your new session time on WhatsApp shortly.</p>
  </div>

  <script>
    function selectSlot(el) {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      el.classList.add('selected');
      document.getElementById('timeInput').value = el.getAttribute('data-val');
    }

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });

    var dateInput = document.querySelector('input[name="date"]');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];
  </script>
</body>
</html>
