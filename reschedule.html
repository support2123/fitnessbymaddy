<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your missed Fitness by Maddy session.">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-header">
    <div class="form-logo">FITNESS BY <span>MADDY</span></div>
    <div class="form-title">RESCHEDULE SESSION</div>
    <p class="form-subtitle">Missed a session? No worries — pick a new time that works for you.</p>
  </div>

  <div class="form-card">
    <form id="rescheduleForm">
      <input type="hidden" name="client_id" id="clientId">

      <div class="form-section-title">YOUR DETAILS</div>

      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label for="phone">WhatsApp Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
      </div>

      <div class="form-section-title">NEW SESSION TIME</div>

      <div class="field">
        <label for="date">Preferred Date</label>
        <input type="date" id="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label for="time">Preferred Time (IST)</label>
        <select id="time" name="preferred_time" required>
          <option value="">Select a time slot</option>
          <option value="07:00">7:00 AM</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="16:00">4:00 PM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>

      <div class="field">
        <label for="reason">Reason for Reschedule (optional)</label>
        <textarea id="reason" name="reason" placeholder="Let us know why you're rescheduling..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>

      <div class="form-message" id="formMessage"></div>
    </form>
  </div>

  <div class="form-footer">
    Fitness by Maddy &middot; We'll confirm your new slot within 24 hours.
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.getElementById('date');
  var today = new Date();
  today.setDate(today.getDate() + 1);
  dateInput.min = today.toISOString().split('T')[0];
  var maxDate = new Date();
  maxDate.setDate(maxDate.getDate() + 14);
  dateInput.max = maxDate.toISOString().split('T')[0];

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMessage');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>SUBMITTING...';
    msg.className = 'form-message';
    msg.style.display = 'none';

    var formData = {
      client_id: document.getElementById('clientId').value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      preferred_date: document.getElementById('date').value,
      preferred_time: document.getElementById('time').value,
      reason: document.getElementById('reason').value,
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer internal',
      },
      body: JSON.stringify({
        phone: '+917082478374',
        message: 'RESCHEDULE REQUEST\nClient: ' + formData.name +
          '\nPhone: ' + formData.phone +
          '\nDate: ' + formData.preferred_date +
          '\nTime: ' + formData.preferred_time +
          '\nReason: ' + (formData.reason || 'Not provided'),
      }),
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      msg.className = 'form-message success';
      msg.textContent = 'Reschedule request sent! We\'ll confirm your new slot within 24 hours via WhatsApp.';
      msg.style.display = 'block';
      document.getElementById('rescheduleForm').reset();
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      msg.className = 'form-message error';
      msg.textContent = 'Network error. Please try again or message us on WhatsApp directly.';
      msg.style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
