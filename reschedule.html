<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      padding: 24px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 4px;
      padding: 48px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .form-header { text-align: center; margin-bottom: 40px; }
    .form-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--charcoal);
    }
    .form-subtitle { font-size: 14px; color: var(--mid-grey); margin-top: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.3s;
      margin-top: 24px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 14px; }
    @media (max-width: 480px) { .form-container { padding: 32px 20px; } }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="form-brand">FITNESS BY MADDY</div>
      <h1 class="form-title">RESCHEDULE SESSION</h1>
      <p class="form-subtitle">Need to move your session? No worries — pick a new time</p>
    </div>

    <form id="rescheduleForm">
      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input type="date" class="form-input" name="date" required>
      </div>
      <div class="form-group">
        <label class="form-label">Preferred Time *</label>
        <select class="form-select" name="time" required>
          <option value="">Select a time</option>
          <option value="06:00">6:00 AM</option>
          <option value="07:00">7:00 AM</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="16:00">4:00 PM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Quick note on why you need to reschedule..."></textarea>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>RESCHEDULED!</h2>
      <p>Your new session time has been confirmed. You'll receive a reminder on WhatsApp before your session.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    // Set min date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.querySelector('input[name="date"]').min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'CONFIRMING...';

      const formData = new FormData(this);
      const data = {
        client_id: clientId,
        date: formData.get('date'),
        time: formData.get('time'),
        reason: formData.get('reason')
      };

      // For now, just show success (webhook integration can be added)
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
