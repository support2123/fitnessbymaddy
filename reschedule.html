<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6B6B; margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid #E8E3DC; border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: #2C2C2C;
      background: #FAF8F4; transition: border-color 0.3s; outline: none; box-sizing: border-box;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #B8965A; }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: #2C2C2C; color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px;
    }
    .form-submit:hover { background: #B8965A; }
    .form-submit:disabled { background: #C8B89A; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: #2C2C2C; margin-bottom: 12px; }
    .form-success p { color: #6B6B6B; font-size: 15px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot {
      padding: 14px 8px; border: 1.5px solid #E8E3DC; background: white; border-radius: 4px;
      text-align: center; cursor: pointer; transition: all 0.2s; font-size: 13px; color: #2C2C2C;
    }
    .time-slot.selected { border-color: #B8965A; background: #FAF3EB; font-weight: 600; }
    @media (max-width: 480px) { .form-card { padding: 28px 20px; } .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links"><li><a href="index.html">Home</a></li></ul>
</nav>

<div class="page-wrap">
  <div class="form-page" id="formPage">
    <div class="form-hero">
      <p class="section-eyebrow">No Worries</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Life happens. Pick a new time that works for you.</p>
    </div>

    <div class="form-card">
      <form id="rescheduleForm">
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input class="form-input" type="text" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label">WhatsApp Number *</label>
          <input class="form-input" type="tel" name="phone" placeholder="+91..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input class="form-input" type="date" name="date" required id="dateInput">
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-val="7:00 AM">7:00 AM</div>
            <div class="time-slot" data-val="8:00 AM">8:00 AM</div>
            <div class="time-slot" data-val="9:00 AM">9:00 AM</div>
            <div class="time-slot" data-val="10:00 AM">10:00 AM</div>
            <div class="time-slot" data-val="5:00 PM">5:00 PM</div>
            <div class="time-slot" data-val="6:00 PM">6:00 PM</div>
            <div class="time-slot" data-val="7:00 PM">7:00 PM</div>
            <div class="time-slot" data-val="8:00 PM">8:00 PM</div>
            <div class="time-slot" data-val="9:00 PM">9:00 PM</div>
          </div>
          <input type="hidden" name="time_slot" id="timeInput" required>
        </div>

        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea class="form-textarea" name="reason" placeholder="Quick note about why you're rescheduling..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>
  </div>

  <div class="form-success" id="successPage">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
  </div>
</div>

<script>
(function() {
  var dateInput = document.getElementById('dateInput');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  var slots = document.querySelectorAll('#timeSlots .time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      document.getElementById('timeInput').value = slot.dataset.val;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    if (!document.getElementById('timeInput').value) {
      alert('Please select a time slot.');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var form = e.target;
    var data = {
      name: form.name.value,
      phone: form.phone.value,
      date: form.date.value,
      time_slot: document.getElementById('timeInput').value,
      reason: form.reason.value
    };

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_id: 'reschedule',
        name: data.name,
        reschedule: true,
        phone: data.phone,
        date: data.date,
        time_slot: data.time_slot,
        reason: data.reason
      })
    })
    .then(function() {
      document.getElementById('formPage').style.display = 'none';
      document.getElementById('successPage').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Something went wrong. Please try again or message us on WhatsApp.');
    });
  });
})();
</script>
</body>
</html>
