<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap { max-width: 520px; margin: 0 auto; padding: 40px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; cursor: pointer; font-size: 13px; color: var(--charcoal); transition: all 0.2s; }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--sand); color: var(--gold); }
    .time-slot input { display: none; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 12px; color: var(--charcoal); }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Need to Reschedule?</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="margin:0 auto">Life happens. Let us know when works best and we'll get you sorted.</p>
    </div>

    <form id="rescheduleForm" class="reschedule-form">
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input class="form-input" type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="form-group">
        <label class="form-label">WhatsApp Number</label>
        <input class="form-input" type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date</label>
        <input class="form-input" type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot (IST)</label>
        <div class="time-slots" id="timeSlots">
          <label class="time-slot"><input type="radio" name="time_slot" value="9:00 AM"> 9:00 AM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="10:00 AM"> 10:00 AM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="11:00 AM"> 11:00 AM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="2:00 PM"> 2:00 PM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="4:00 PM"> 4:00 PM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="6:00 PM"> 6:00 PM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="7:00 PM"> 7:00 PM</label>
          <label class="time-slot"><input type="radio" name="time_slot" value="8:00 PM"> 8:00 PM</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-input" name="reason" rows="2" placeholder="Quick note on why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="btn-primary" style="width:100%;padding:16px;margin-top:12px">Request Reschedule</button>
    </form>

    <div id="successMsg" class="success-msg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours. Thanks for letting us know.</p>
    </div>
  </div>
</div>

<script>
(function() {
  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      slot.querySelector('input').checked = true;
    });
  });

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var data = {};
    new FormData(form).forEach(function(v, k) { data[k] = v; });

    var btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    // For now, this sends a WhatsApp notification to Maddy's team
    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + 'internal'
      },
      body: JSON.stringify({
        phone: data.phone.replace(/[^0-9]/g, ''),
        type: 'template',
        template_name: 'reschedule_confirm',
        params: [data.name, data.preferred_date, data.time_slot || 'TBD']
      })
    })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      form.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
