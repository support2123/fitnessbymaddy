<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .container { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; }
    .brand p { font-size: 13px; color: var(--mid-grey); margin-top: 8px; }
    .form-card { background: white; border-radius: 8px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; margin-bottom: 8px; }
    .form-subtitle { font-size: 14px; color: var(--mid-grey); margin-bottom: 32px; line-height: 1.6; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { text-align: center; padding: 60px 20px; }
    .success h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; margin-bottom: 12px; }
    .success p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Reschedule Your Session</p>
    </div>

    <div class="form-card" id="formCard">
      <div class="form-title">NEED TO RESCHEDULE?</div>
      <p class="form-subtitle">No worries — life happens. Pick a new time that works for you.</p>

      <form id="rescheduleForm">
        <div class="field">
          <label>Your Name</label>
          <input type="text" name="name" required placeholder="Full name">
        </div>

        <div class="field">
          <label>Preferred Date</label>
          <input type="date" name="preferred_date" required>
        </div>

        <div class="field">
          <label>Preferred Time (IST)</label>
          <select name="preferred_time" required>
            <option value="">Select a time slot</option>
            <option value="07:00">7:00 AM</option>
            <option value="08:00">8:00 AM</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="17:00">5:00 PM</option>
            <option value="18:00">6:00 PM</option>
            <option value="19:00">7:00 PM</option>
            <option value="20:00">8:00 PM</option>
          </select>
        </div>

        <div class="field">
          <label>Reason (optional)</label>
          <textarea name="reason" placeholder="Quick note on why you need to reschedule"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="success hidden" id="successMsg">
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      data.client_id = clientId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead_id: clientId, ...data })
        });

        if (res.ok) {
          document.getElementById('formCard').classList.add('hidden');
          document.getElementById('successMsg').classList.remove('hidden');
        } else {
          btn.disabled = false;
          btn.textContent = 'REQUEST RESCHEDULE';
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
