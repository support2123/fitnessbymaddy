<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); padding: 32px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { font-size: 14px; color: rgba(255,255,255,0.6); }

    .form-container { max-width: 480px; margin: 0 auto; padding: 32px 24px 48px; }

    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 2px; color: var(--charcoal); margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white;
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 60px; }
    .field .hint { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }

    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 14px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all 0.3s; background: white;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }

    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: white; font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer;
      transition: background 0.3s; margin-top: 8px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.7; }

    .error-msg {
      background: #fee; border: 1px solid #fcc; padding: 12px 16px;
      border-radius: 2px; font-size: 13px; color: #c33;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Reschedule Session</h1>
  <p>No worries — let's find a better time</p>
</div>

<div class="form-container" id="formContainer">
  <div class="error-msg" id="errorMsg"></div>

  <form id="rescheduleForm" novalidate>
    <input type="hidden" name="client_id" id="clientId">

    <div class="form-section">
      <div class="form-section-title">Your Details</div>
      <div class="field">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="phone">WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">New Session Time</div>
      <div class="field">
        <label for="date">Preferred Date *</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>
      <div class="field">
        <label for="reason">Reason for rescheduling</label>
        <textarea id="reason" name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Request Reschedule</button>
  </form>
</div>

<div class="success-msg" id="successMsg">
  <h2>Request Sent!</h2>
  <p>We'll confirm your new session time on WhatsApp within a few hours. Keep an eye on your messages!</p>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('date').min = today.toISOString().split('T')[0];

  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.getAttribute('data-time');
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = e.target;
    var data = {
      client_id: form.client_id.value || undefined,
      name: form.name.value.trim(),
      phone: form.phone.value.trim(),
      date: form.date.value,
      time: form.time.value,
      reason: form.reason.value.trim() || undefined
    };

    if (!data.name || !data.phone || !data.date || !data.time) {
      errEl.textContent = 'Please fill in all required fields and select a time slot.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      return;
    }

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: data.phone,
        name: data.name,
        goal: 'Reschedule: ' + data.date + ' ' + data.time + (data.reason ? ' — ' + data.reason : '')
      })
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.error) {
        errEl.textContent = result.error;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Request Reschedule';
      } else {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      }
    })
    .catch(function() {
      errEl.textContent = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
    });
  });
})();
</script>

</body>
</html>
