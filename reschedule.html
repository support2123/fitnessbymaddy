<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: #fff;
      min-height: 100vh;
    }
    .form-header {
      background: linear-gradient(135deg, #1a1a1a 0%, var(--charcoal) 100%);
      padding: 48px 24px 32px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 6px; color: var(--gold); margin-bottom: 8px; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff; letter-spacing: 2px; }
    .form-header p { font-size: 14px; color: var(--mid-grey); margin-top: 8px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .form-body { max-width: 500px; margin: 0 auto; padding: 32px 24px 60px; }
    .field { margin-bottom: 24px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px; font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: #fff; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,0.3); }
    .field select option { background: var(--charcoal); color: #fff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .time-slot {
      padding: 14px; text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px; cursor: pointer;
      font-size: 13px; font-weight: 500;
      transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--gold); color: var(--charcoal); border-color: var(--gold); font-weight: 600; }
    .submit-btn {
      width: 100%; padding: 16px;
      background: var(--gold); color: var(--charcoal);
      border: none; border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px;
      cursor: pointer; transition: all 0.3s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="form-header">
    <div class="brand">FITNESS BY MADDY</div>
    <h1>RESCHEDULE SESSION</h1>
    <p>Life happens. Let's find a new time that works for you.</p>
  </div>

  <div class="form-body" id="formContainer">
    <form id="rescheduleForm" novalidate>
      <input type="hidden" id="clientId" name="client_id">

      <div class="field">
        <label>Your Name *</label>
        <input type="text" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label>WhatsApp Number *</label>
        <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required>
      </div>

      <div class="field">
        <label>Preferred New Date *</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime">
      </div>

      <div class="field">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>REQUEST SENT!</h2>
    <p>We'll confirm your new session time via WhatsApp within 24 hours. Thanks for letting us know!</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    if (clientId) document.getElementById('clientId').value = clientId;

    var today = new Date();
    today.setDate(today.getDate() + 1);
    var minDate = today.toISOString().split('T')[0];
    document.querySelector('input[name="preferred_date"]').setAttribute('min', minDate);

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        document.getElementById('selectedTime').value = slot.getAttribute('data-time');
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');

      var data = {
        client_id: form.client_id.value,
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        preferred_date: form.preferred_date.value,
        preferred_time: form.preferred_time.value,
        reason: form.reason.value.trim(),
      };

      if (!data.name || !data.phone || !data.preferred_date || !data.preferred_time) {
        errEl.textContent = 'Please fill in all required fields and select a time slot.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SENDING...';
      errEl.style.display = 'none';

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + 'client-form',
        },
        body: JSON.stringify({
          phone: '+917082478374',
          type: 'text',
          text: 'Reschedule request from ' + data.name + ' (' + data.phone + '): ' + data.preferred_date + ' at ' + data.preferred_time + '. Reason: ' + (data.reason || 'Not specified'),
          skipRateLimit: true,
        }),
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      });
    });
  </script>
</body>
</html>
