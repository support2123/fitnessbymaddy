<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; background: rgba(250,248,244,0.96);
      backdrop-filter: blur(12px); z-index: 1000; padding: 0 24px;
      display: flex; align-items: center; height: 72px; border-bottom: 1px solid var(--light-grey);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--charcoal); text-decoration: none;
    }
    .page-wrap { padding-top: 72px; }
    .form-hero { background: var(--charcoal); padding: 60px 24px 48px; text-align: center; }
    .form-hero .eyebrow {
      font-size: 11px; font-weight: 500; letter-spacing: 4px;
      text-transform: uppercase; color: var(--gold-light); margin-bottom: 16px;
    }
    .form-hero h1 {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 48px);
      font-weight: 300; color: white; line-height: 1.1; margin-bottom: 12px;
    }
    .form-hero h1 em { font-style: italic; color: var(--gold-light); }
    .form-hero p { font-size: 15px; color: rgba(255,255,255,0.6); max-width: 500px; margin: 0 auto; }
    .form-container {
      max-width: 540px; margin: -24px auto 60px; padding: 48px 40px;
      background: white; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); position: relative; z-index: 2;
    }
    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px;
      font-weight: 300; color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg h2 em { color: var(--gold); }
    .success-msg p { font-size: 15px; color: var(--mid-grey); line-height: 1.7; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    footer { background: var(--charcoal); padding: 40px 24px; text-align: center; }
    .footer-brand {
      font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;
      letter-spacing: 2px; color: white; text-transform: uppercase; margin-bottom: 8px;
    }
    .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>

<nav><a class="nav-logo" href="index.html">Fitness by Maddy</a></nav>

<div class="page-wrap">
  <div class="form-hero">
    <p class="eyebrow">Schedule Change</p>
    <h1>Reschedule <em>Your Session</em></h1>
    <p>Life happens — let's get you back on track.</p>
  </div>

  <div class="form-container" id="form-section">
    <form id="reschedule-form">
      <div class="form-group">
        <label class="form-label">Which Session Did You Miss?</label>
        <input type="text" class="form-input" id="session" required placeholder="e.g. Day 3 - Upper Body Push">
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Reschedule Date</label>
        <input type="date" class="form-input" id="reschedule-date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time</label>
        <select class="form-select" id="time-pref" required>
          <option value="">Select...</option>
          <option value="morning">Morning (6 – 9 AM)</option>
          <option value="late_morning">Late Morning (9 AM – 12 PM)</option>
          <option value="afternoon">Afternoon (12 – 4 PM)</option>
          <option value="evening">Evening (4 – 8 PM)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Reason for Missing</label>
        <select class="form-select" id="reason" required>
          <option value="">Select...</option>
          <option value="work">Work / Schedule Conflict</option>
          <option value="health">Not Feeling Well</option>
          <option value="travel">Travel</option>
          <option value="personal">Personal</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Notes — optional</label>
        <textarea class="form-textarea" id="notes" placeholder="Any additional context..."></textarea>
      </div>

      <div class="error-msg" id="error-msg"></div>
      <button type="submit" class="btn-submit" id="submit-btn">Submit Reschedule Request</button>
    </form>
  </div>

  <div class="success-msg" id="success-section">
    <h2>Request <em>Received!</em></h2>
    <p>We'll get your session rescheduled. You'll receive a WhatsApp confirmation shortly.</p>
  </div>
</div>

<footer>
  <div class="footer-brand">Fitness by Maddy</div>
  <div class="footer-copy">&copy; 2025 Fitness by Maddy. All rights reserved.</div>
</footer>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');

  var dateInput = document.getElementById('reschedule-date');
  dateInput.min = new Date().toISOString().split('T')[0];

  document.getElementById('reschedule-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    try {
      var payload = {
        client_id: clientId,
        session: document.getElementById('session').value,
        reschedule_date: dateInput.value,
        time_preference: document.getElementById('time-pref').value,
        reason: document.getElementById('reason').value,
        notes: document.getElementById('notes').value || null
      };

      var res = await fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer internal'
        },
        body: JSON.stringify({
          phone: null,
          text: 'Reschedule request from client ' + clientId + ': ' + JSON.stringify(payload)
        })
      });

      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT RESCHEDULE REQUEST';
    }
  });
})();
</script>
</body>
</html>
