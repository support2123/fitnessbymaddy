<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit { width: 100%; padding: 18px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 12px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; color: var(--charcoal); }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    @media (max-width: 500px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Session Management</p>
    <h1 class="section-title">Reschedule <em>Session</em></h1>
    <p class="section-body" style="margin:0 auto">Life happens. Pick a new time that works better for you.</p>
  </div>

  <div class="form-card" id="rescheduleForm">
    <form id="reschedule" onsubmit="submitReschedule(event)">
      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input class="form-input" name="date" type="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" onclick="selectSlot(this)" data-time="06:00">6:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="07:00">7:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="08:00">8:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="09:00">9:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="10:00">10:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="17:00">5:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="18:00">6:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="19:00">7:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Quick note on why you're rescheduling..."></textarea>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Reschedule Requested</h2>
    <p>We've noted your preferred time. You'll get a confirmation on WhatsApp shortly.</p>
  </div>
</div>

<script>
var selectedTimeSlot = null;

function selectSlot(el) {
  document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
  el.classList.add('selected');
  selectedTimeSlot = el.dataset.time;
  document.getElementById('selectedTime').value = selectedTimeSlot;
}

async function submitReschedule(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var params = new URLSearchParams(window.location.search);
  var form = document.getElementById('reschedule');
  var formData = new FormData(form);
  var data = {
    client_id: params.get('c'),
    date: formData.get('date'),
    time: formData.get('time'),
    reason: formData.get('reason')
  };

  try {
    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (_) {
    btn.disabled = false;
    btn.textContent = 'Request Reschedule';
  }
}
</script>
</body>
</html>
