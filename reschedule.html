<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #FAF8F4;
      color: #2C2C2C;
      min-height: 100vh;
    }
    .header {
      background: #2C2C2C;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: #B8965A;
      font-size: 28px;
      letter-spacing: 2px;
    }
    .header p { color: #E8E3DC; font-size: 13px; margin-top: 4px; }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .intro {
      background: #F0EAE0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
      color: #6B6B6B;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 500;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #B8965A;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #E8E3DC;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      background: #FFFFFF;
      color: #2C2C2C;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #B8965A; }
    textarea { resize: vertical; min-height: 60px; }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .time-slot {
      display: block;
      padding: 12px;
      background: #FFFFFF;
      border: 1px solid #E8E3DC;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .time-slot:hover { border-color: #B8965A; }
    .time-slot input { display: none; }
    .time-slot:has(input:checked) {
      border-color: #B8965A;
      background: #FAF5ED;
      font-weight: 600;
      color: #B8965A;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2C2C2C;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #B8965A; }
    .btn-submit:disabled { background: #C8B89A; cursor: not-allowed; }
    .success { display: none; text-align: center; padding: 40px 20px; }
    .success h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: #B8965A;
      font-size: 28px;
      margin-bottom: 12px;
    }
    .success p { color: #6B6B6B; font-size: 15px; line-height: 1.6; }
    .error-msg { color: #cc3333; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Reschedule Your Session</p>
  </div>

  <div class="container">
    <div class="intro">
      Life happens! Pick a new date and time that works for you. We'll confirm via WhatsApp.
    </div>

    <form id="rescheduleForm">
      <input type="hidden" name="client_id" id="clientId">

      <div class="form-group">
        <label>Your Phone *</label>
        <input type="tel" name="phone" id="phoneInput" required placeholder="+91...">
      </div>

      <div class="form-group">
        <label>New Date *</label>
        <input type="date" name="new_date" required id="dateInput">
      </div>

      <div class="form-group">
        <label>Preferred Time Slot *</label>
        <div class="time-slots">
          <label class="time-slot"><input type="radio" name="time_slot" value="6:00 AM" required><span>6:00 AM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="7:00 AM"><span>7:00 AM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="8:00 AM"><span>8:00 AM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="9:00 AM"><span>9:00 AM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="10:00 AM"><span>10:00 AM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="5:00 PM"><span>5:00 PM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="6:00 PM"><span>6:00 PM</span></label>
          <label class="time-slot"><input type="radio" name="time_slot" value="7:00 PM"><span>7:00 PM</span></label>
        </div>
      </div>

      <div class="form-group">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <p class="error-msg" id="errorMsg"></p>
      <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success" id="successMsg">
      <h2>REQUEST SENT!</h2>
      <p>Maddy's team will confirm your new slot on WhatsApp shortly. Keep an eye on your messages.</p>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var phone = params.get('phone');
      if (clientId) document.getElementById('clientId').value = clientId;
      if (phone) document.getElementById('phoneInput').value = decodeURIComponent(phone);

      var tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('dateInput').min = tomorrow.toISOString().split('T')[0];

      document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var errEl = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'SENDING...';
        errEl.style.display = 'none';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(v, k) { data[k] = v; });

        fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) { return r.json(); })
        .then(function() {
          document.getElementById('rescheduleForm').style.display = 'none';
          document.querySelector('.intro').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        })
        .catch(function(err) {
          errEl.textContent = 'Something went wrong. Please message us on WhatsApp directly.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'REQUEST RESCHEDULE';
        });
      });
    })();
  </script>
</body>
</html>
