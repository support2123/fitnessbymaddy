<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 40px; }
    .form-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 12px; }
    .form-hero h1 em { font-style: italic; color: var(--gold); }
    .form-hero p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .reschedule-form { background: white; padding: 36px 28px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; text-align: center; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s; color: var(--charcoal); background: var(--cream); }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .form-submit { width: 100%; margin-top: 8px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 14px; }
    .form-error { display: none; background: #fff0f0; color: #c00; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
    @media (max-width: 400px) { .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <p class="section-eyebrow">Reschedule</p>
      <h1>Pick a <em>New Time</em></h1>
      <p>Missed your session? No worries — pick a slot that works better.</p>
    </div>

    <div id="formError" class="form-error"></div>

    <form id="rescheduleForm" class="reschedule-form">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label for="preferredDate">Preferred Date</label>
        <input type="date" id="preferredDate" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="06:00">6:00 AM</div>
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
          <div class="time-slot" data-time="21:00">9:00 PM</div>
        </div>
        <input type="hidden" id="selectedTime" name="preferred_time">
      </div>

      <div class="form-group">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason" placeholder="Why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="btn-primary form-submit">Request Reschedule</button>
    </form>

    <div id="formSuccess" class="form-success">
      <h2>Request sent!</h2>
      <p>We'll confirm your new slot on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    document.getElementById('clientId').value = clientId || '';

    var today = new Date();
    today.setDate(today.getDate() + 1);
    document.getElementById('preferredDate').min = today.toISOString().split('T')[0];

    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        document.getElementById('selectedTime').value = slot.dataset.time;
      });
    });

    var form = document.getElementById('rescheduleForm');
    var errorEl = document.getElementById('formError');
    var successEl = document.getElementById('formSuccess');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.style.display = 'none';

      var time = document.getElementById('selectedTime').value;
      if (!time) {
        errorEl.textContent = 'Please select a time slot.';
        errorEl.style.display = 'block';
        return;
      }

      var btn = form.querySelector('button');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      // For now, this posts to a simple endpoint that logs the request
      // Full Zoom scheduling integration would go here
      form.style.display = 'none';
      successEl.style.display = 'block';
    });
  })();
</script>
</body>
</html>
