<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit { width: 100%; margin-top: 24px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success.show { display: block; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .form-card.hidden { display: none; }
    @media (max-width: 600px) { .form-card { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Need to Reschedule?</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Life happens! Pick a new time that works for you.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="submitReschedule(event)">
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input class="form-input" type="text" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label">WhatsApp Number *</label>
          <input class="form-input" type="tel" name="phone" required placeholder="+91...">
        </div>

        <div class="form-group">
          <label class="form-label">Preferred New Date *</label>
          <input class="form-input" type="date" name="preferred_date" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot</label>
          <select class="form-select" name="time_slot">
            <option value="">Select...</option>
            <option value="morning">Morning (7am - 10am IST)</option>
            <option value="midday">Midday (11am - 2pm IST)</option>
            <option value="afternoon">Afternoon (3pm - 6pm IST)</option>
            <option value="evening">Evening (7pm - 9pm IST)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
        </div>

        <button type="submit" class="btn-primary form-submit">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Request Submitted!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
  async function submitReschedule(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Submitting...';
    btn.disabled = true;

    const data = {
      name: form.name.value,
      phone: form.phone.value,
      preferred_date: form.preferred_date.value,
      time_slot: form.time_slot.value,
      reason: form.reason.value,
    };

    try {
      const res = await fetch('/api/reschedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      if (res.ok) {
        document.getElementById('rescheduleForm').classList.add('hidden');
        document.getElementById('successMsg').classList.add('show');
      } else {
        btn.textContent = 'Error — Try Again';
        btn.disabled = false;
      }
    } catch (err) {
      btn.textContent = 'Error — Try Again';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
