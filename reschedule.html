<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #111111; --gold: #B8965A; --gold-light: #D4AF7A;
      --white: #FFFFFF;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--black);
      color: var(--white); min-height: 100vh;
    }
    .form-header {
      background: linear-gradient(180deg, var(--black) 0%, #1a1a1a 100%);
      padding: 60px 24px 40px; text-align: center;
      border-bottom: 1px solid rgba(184,150,90,0.2);
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 48px;
      letter-spacing: 4px; color: var(--gold);
    }
    .form-header p {
      color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 8px;
    }
    .form-wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
    .field { margin-bottom: 24px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 2px; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .time-slot {
      padding: 12px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 2px; text-align: center; cursor: pointer;
      font-size: 13px; transition: all 0.3s;
    }
    .time-slot:hover, .time-slot.selected {
      border-color: var(--gold); color: var(--gold);
    }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--gold);
      color: var(--black); font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px; border: none;
      cursor: pointer; transition: background 0.3s; border-radius: 2px;
      margin-top: 32px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
      max-width: 560px; margin: 0 auto;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px;
    }
    .success-msg p { color: rgba(255,255,255,0.6); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Pick a new time that works for you. We'll confirm within 24 hours.</p>
  </div>

  <form id="rescheduleForm" class="form-wrap">
    <div class="field">
      <label>Your Name *</label>
      <input type="text" name="name" required placeholder="Your full name">
    </div>
    <div class="field">
      <label>Email or Phone *</label>
      <input type="text" name="contact" required placeholder="your@email.com or +91...">
    </div>
    <div class="field">
      <label>Preferred Date *</label>
      <input type="date" name="preferred_date" required>
    </div>
    <div class="field">
      <label>Preferred Time Slot</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="10:00">10:00 AM</div>
        <div class="time-slot" data-time="11:00">11:00 AM</div>
        <div class="time-slot" data-time="14:00">2:00 PM</div>
        <div class="time-slot" data-time="16:00">4:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
      </div>
      <input type="hidden" name="preferred_time" id="selectedTime">
    </div>
    <div class="field">
      <label>Reason for Reschedule</label>
      <textarea name="reason" placeholder="Optional — let us know why you need to reschedule"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new slot via WhatsApp within 24 hours.</p>
  </div>

  <script>
    (function() {
      var slots = document.querySelectorAll('.time-slot');
      slots.forEach(function(slot) {
        slot.addEventListener('click', function() {
          slots.forEach(function(s) { s.classList.remove('selected'); });
          slot.classList.add('selected');
          document.getElementById('selectedTime').value = slot.dataset.time;
        });
      });

      var dateInput = document.querySelector('input[name="preferred_date"]');
      var today = new Date().toISOString().split('T')[0];
      dateInput.setAttribute('min', today);

      document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'SENDING...';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(val, key) { data[key] = val; });

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ type: 'reschedule' }, data))
        })
        .then(function() {
          document.getElementById('rescheduleForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'REQUEST RESCHEDULE';
          alert('Something went wrong. Please try again.');
        });
      });
    })();
  </script>
</body>
</html>
