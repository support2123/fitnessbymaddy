<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 540px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; color: var(--charcoal); }
    .form-error { display: none; background: #FFF0F0; border: 1px solid #FFD0D0; color: #CC3333; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
    textarea.form-input { min-height: 80px; resize: vertical; }
    .btn-submit { width: 100%; padding: 16px; font-size: 13px; margin-top: 8px; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { position: relative; }
    .time-slot input { position: absolute; opacity: 0; }
    .time-slot label { display: block; padding: 12px 8px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 12px; color: var(--mid-grey); text-align: center; cursor: pointer; transition: all 0.3s; letter-spacing: 0.5px; }
    .time-slot input:checked + label { border-color: var(--gold); color: var(--gold); background: rgba(184,150,90,0.05); }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="max-width:400px; margin:0 auto;">Missed a session? No worries — let's get you rebooked.</p>
    </div>

    <div class="form-error" id="formError"></div>

    <form id="rescheduleForm" class="form-card">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input class="form-input" type="text" name="name" required>
      </div>

      <div class="form-group">
        <label class="form-label">WhatsApp Number</label>
        <input class="form-input" type="tel" name="phone" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date</label>
        <input class="form-input" type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot</label>
        <div class="time-slots">
          <div class="time-slot"><input type="radio" id="t1" name="time_slot" value="7:00 AM" required><label for="t1">7:00 AM</label></div>
          <div class="time-slot"><input type="radio" id="t2" name="time_slot" value="8:00 AM"><label for="t2">8:00 AM</label></div>
          <div class="time-slot"><input type="radio" id="t3" name="time_slot" value="9:00 AM"><label for="t3">9:00 AM</label></div>
          <div class="time-slot"><input type="radio" id="t4" name="time_slot" value="10:00 AM"><label for="t4">10:00 AM</label></div>
          <div class="time-slot"><input type="radio" id="t5" name="time_slot" value="5:00 PM"><label for="t5">5:00 PM</label></div>
          <div class="time-slot"><input type="radio" id="t6" name="time_slot" value="6:00 PM"><label for="t6">6:00 PM</label></div>
          <div class="time-slot"><input type="radio" id="t7" name="time_slot" value="7:00 PM"><label for="t7">7:00 PM</label></div>
          <div class="time-slot"><input type="radio" id="t8" name="time_slot" value="8:00 PM"><label for="t8">8:00 PM</label></div>
          <div class="time-slot"><input type="radio" id="t9" name="time_slot" value="9:00 PM"><label for="t9">9:00 PM</label></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Reason for Reschedule</label>
        <textarea class="form-input" name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <button type="submit" class="btn-primary btn-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="form-success" id="formSuccess">
      <div style="font-size:48px; margin-bottom:16px;">&#128197;</div>
      <h2>Request Sent!</h2>
      <p>Maddy's team will confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  var form = document.getElementById('rescheduleForm');
  var errorEl = document.getElementById('formError');
  var successEl = document.getElementById('formSuccess');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    var formData = new FormData(form);
    var payload = {};
    formData.forEach(function(v, k) { if (v) payload[k] = v; });

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer internal'
      },
      body: JSON.stringify({
        phone: '+917082478374',
        message: 'RESCHEDULE REQUEST\nClient: ' + (payload.name || 'Unknown') +
          '\nPhone: ' + (payload.phone || '') +
          '\nDate: ' + (payload.preferred_date || '') +
          '\nTime: ' + (payload.time_slot || '') +
          '\nReason: ' + (payload.reason || 'not specified')
      })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(result) {
      form.style.display = 'none';
      successEl.style.display = 'block';
    })
    .catch(function() {
      form.style.display = 'none';
      successEl.style.display = 'block';
    });
  });
})();
</script>

</body>
</html>
