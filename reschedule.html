<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0D0D0D;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: white;
      min-height: 100vh;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 40px 20px 60px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
    .brand p { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 8px; }
    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%23B8965A' stroke-width='2'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    .form-select option { background: var(--charcoal); color: white; }
    .form-textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: rgba(184,150,90,0.15); border-color: var(--gold); color: var(--gold); }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 24px;
    }
    .btn-submit:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status-msg {
      text-align: center;
      padding: 16px;
      border-radius: 4px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: rgba(46,125,50,0.2); color: #81C784; }
    .status-msg.error { display: block; background: rgba(211,47,47,0.2); color: #EF9A9A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Reschedule Your Session</p>
    </div>

    <form id="rescheduleForm">
      <div class="form-group">
        <label class="form-label">Preferred Date</label>
        <input type="date" class="form-input" name="date" required id="dateInput">
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>

      <div class="form-group">
        <label class="form-label">Reason for Rescheduling</label>
        <textarea class="form-textarea" name="reason" placeholder="Optional — let us know why you need to reschedule"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var selectedTime = '';

    var dateInput = document.getElementById('dateInput');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTime = slot.getAttribute('data-time');
        document.getElementById('selectedTime').value = selectedTime;
      });
    });

    var form = document.getElementById('rescheduleForm');
    var statusMsg = document.getElementById('statusMsg');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!selectedTime) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Please select a time slot.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      statusMsg.className = 'status-msg';

      var formData = new FormData(form);
      var data = {
        client_id: clientId,
        date: formData.get('date'),
        time: selectedTime,
        reason: formData.get('reason') || ''
      };

      statusMsg.className = 'status-msg success';
      statusMsg.textContent = 'Reschedule request submitted! We\'ll confirm your new slot via WhatsApp.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'REQUEST RESCHEDULE';
    });
  </script>
</body>
</html>
