<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | FitnessByMaddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 32px; padding-top: 20px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #D4AF7A; letter-spacing: 3px; text-transform: uppercase; }
    .brand p { color: #888; font-size: 14px; margin-top: 4px; }
    h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #D4AF7A; letter-spacing: 2px; margin: 24px 0 12px; text-transform: uppercase; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; background: #222; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-size: 15px; font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #D4AF7A; }
    textarea { resize: vertical; min-height: 80px; }
    .btn {
      width: 100%; padding: 16px; background: #D4AF7A; color: #1a1a1a;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 24px; text-transform: uppercase; letter-spacing: 1px;
      transition: background 0.2s;
    }
    .btn:hover { background: #c9a060; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { text-align: center; padding: 60px 20px; }
    .success h2 { color: #D4AF7A; font-size: 28px; }
    .success p { color: #aaa; margin-top: 12px; }
    .hidden { display: none; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; background: #222; border: 1px solid #333; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .time-slot:hover { border-color: #D4AF7A; }
    .time-slot.selected { background: #D4AF7A; color: #1a1a1a; border-color: #D4AF7A; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FitnessByMaddy</h1>
      <p>Reschedule Your Session</p>
    </div>

    <form id="rescheduleForm">
      <h2>Pick a New Date</h2>
      <div class="form-group">
        <label>Preferred Date *</label>
        <input type="date" name="date" required id="dateInput">
      </div>

      <div class="form-group">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="timeInput" required>
      </div>

      <h2>Reason (Optional)</h2>
      <div class="form-group">
        <textarea name="reason" placeholder="Let us know why you're rescheduling so we can help better..."></textarea>
      </div>

      <button type="submit" class="btn" id="submitBtn">Confirm Reschedule</button>
    </form>

    <div id="successMsg" class="success hidden">
      <h2>Rescheduled!</h2>
      <p>Your session has been moved. You'll receive a confirmation on WhatsApp shortly.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    const today = new Date();
    today.setDate(today.getDate() + 1);
    document.getElementById('dateInput').min = today.toISOString().split('T')[0];

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        document.getElementById('timeInput').value = slot.dataset.time;
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!document.getElementById('timeInput').value) {
        alert('Please select a time slot');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Confirming...';

      const formData = new FormData(this);
      const data = {
        client_id: clientId,
        date: formData.get('date'),
        time: formData.get('time'),
        reason: formData.get('reason'),
      };

      try {
        const res = await fetch('/api/send-whatsapp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer internal',
          },
          body: JSON.stringify({
            phone: '+917082478374',
            message: 'Reschedule request from client ' + clientId + ': ' + data.date + ' at ' + data.time + '. Reason: ' + (data.reason || 'none given'),
          }),
        });

        document.getElementById('rescheduleForm').classList.add('hidden');
        document.getElementById('successMsg').classList.remove('hidden');
      } catch (err) {
        alert('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Confirm Reschedule';
      }
    });
  </script>
</body>
</html>
