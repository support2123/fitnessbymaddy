<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-header">
    <div class="form-logo">Fitness by Maddy</div>
    <h1 class="form-title">RESCHEDULE SESSION</h1>
    <p class="form-subtitle">Life happens! Pick a new time that works better for you.</p>
  </div>

  <div id="form-container">
    <form id="reschedule-form" class="form-card">
      <div id="error-msg" class="form-error"></div>

      <div class="field">
        <label for="name">Your Name *</label>
        <input type="text" id="name" name="name" required placeholder="Your full name">
      </div>

      <div class="field">
        <label for="phone">WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91 70824 78374">
      </div>

      <div class="form-divider"></div>
      <div class="form-section-title">NEW PREFERRED TIME</div>

      <div class="field">
        <label for="date">Preferred Date *</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label for="time">Preferred Time Slot *</label>
        <select id="time" name="time" required>
          <option value="">Select a time</option>
          <option value="07:00">7:00 AM</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="16:00">4:00 PM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>

      <div class="field">
        <label for="timezone">Timezone</label>
        <select id="timezone" name="timezone">
          <option value="IST">IST (India)</option>
          <option value="GST">GST (UAE/Dubai)</option>
          <option value="GMT">GMT (UK)</option>
          <option value="EST">EST (US East)</option>
          <option value="PST">PST (US West)</option>
        </select>
      </div>

      <div class="field">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason" placeholder="Quick note about why you need to reschedule"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">REQUEST RESCHEDULE</button>
    </form>
  </div>

  <div id="success" class="form-success">
    <div class="check">&#10003;</div>
    <h2>REQUEST SENT!</h2>
    <p>We'll confirm your new session time on WhatsApp within a few hours. Thanks for keeping us in the loop!</p>
  </div>
</div>

<script>
(function() {
  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('date').min = today.toISOString().split('T')[0];

  var form = document.getElementById('reschedule-form');
  var errorMsg = document.getElementById('error-msg');
  var submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'SENDING...';

    var data = {
      name: form.name.value.trim(),
      phone: form.phone.value.trim(),
      date: form.date.value,
      time: form.time.value,
      timezone: form.timezone.value,
      reason: form.reason.value.trim()
    };

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: data.phone,
        name: data.name,
        goal: 'Reschedule: ' + data.date + ' ' + data.time + ' ' + data.timezone +
              (data.reason ? ' — ' + data.reason : '')
      })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('success').classList.add('show');
    })
    .catch(function() {
      errorMsg.textContent = 'Network error. Please try again or message us on WhatsApp.';
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'REQUEST RESCHEDULE';
    });
  });
})();
</script>

</body>
</html>
