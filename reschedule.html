<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    .reschedule-wrap { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 3px; color: var(--charcoal); }
    .reschedule-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      font-family: 'DM Sans', sans-serif;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 2px; }
    .success-msg p { color: var(--mid-grey); margin-top: 12px; font-size: 15px; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Missed a Session?</p>
      <h1>RESCHEDULE</h1>
      <p style="color:var(--mid-grey);font-size:15px;line-height:1.7;margin-top:12px;">
        Life happens. Pick a new time and we'll get you back on track.
      </p>
    </div>

    <form id="rescheduleForm" class="reschedule-form">
      <div class="form-group">
        <label class="form-label">Your Name *</label>
        <input class="form-input" type="text" name="name" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone / WhatsApp *</label>
        <input class="form-input" type="tel" name="phone" placeholder="+91..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Original Session Date *</label>
        <input class="form-input" type="date" name="original_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred New Date *</label>
        <input class="form-input" type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time (IST)</label>
        <select class="form-select" name="preferred_time">
          <option value="morning">Morning (7am - 10am)</option>
          <option value="midday">Midday (10am - 1pm)</option>
          <option value="afternoon">Afternoon (1pm - 4pm)</option>
          <option value="evening" selected>Evening (4pm - 8pm)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Brief reason for reschedule..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div id="successMsg" class="success-msg" style="display:none;">
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new session time on WhatsApp within 24 hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'SENDING...';

    var formData = new FormData(this);
    var data = {};
    formData.forEach(function(v, k) { data[k] = v; });

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        message: 'Reschedule request from ' + data.name + ' (' + data.phone + '). Original: ' + data.original_date + '. New: ' + data.preferred_date + ' ' + data.preferred_time + '. Reason: ' + (data.reason || 'N/A'),
        is_client: true,
      }),
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Something went wrong. Please try again or message us on WhatsApp.');
    });
  });
})();
</script>

<script src="js/nav.js"></script>
</body>
</html>
