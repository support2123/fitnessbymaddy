<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--cream);
      min-height: 100vh;
    }
    .form-header {
      background: linear-gradient(135deg, #1a1a1a 0%, var(--charcoal) 100%);
      padding: 48px 24px 40px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,150,90,0.3);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field select option { background: var(--charcoal); color: var(--cream); }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 14px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected {
      background: rgba(184,150,90,0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 32px;
    }
    .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .success-msg p { color: rgba(255,255,255,0.7); line-height: 1.7; }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Reschedule Session</h1>
  <p>Missed a session? No worries — pick a new time below.</p>
</div>

<div class="form-container" id="formWrap">
  <form id="rescheduleForm">
    <input type="hidden" id="clientId" name="client_id">

    <div class="section-label">Your Details</div>

    <div class="field">
      <label>Name *</label>
      <input type="text" name="name" required placeholder="Your name">
    </div>
    <div class="field">
      <label>Phone (WhatsApp) *</label>
      <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
    </div>

    <div class="section-label">Preferred Date</div>
    <div class="field">
      <label>New Date *</label>
      <input type="date" name="preferred_date" required>
    </div>

    <div class="field">
      <label>Preferred Time Slot *</label>
      <input type="hidden" name="preferred_time" id="timeInput" required>
      <div class="time-slots">
        <div class="time-slot" onclick="selectTime(this, '7:00 AM')">7:00 AM</div>
        <div class="time-slot" onclick="selectTime(this, '9:00 AM')">9:00 AM</div>
        <div class="time-slot" onclick="selectTime(this, '11:00 AM')">11:00 AM</div>
        <div class="time-slot" onclick="selectTime(this, '2:00 PM')">2:00 PM</div>
        <div class="time-slot" onclick="selectTime(this, '5:00 PM')">5:00 PM</div>
        <div class="time-slot" onclick="selectTime(this, '7:00 PM')">7:00 PM</div>
      </div>
    </div>

    <div class="field">
      <label>Reason for Reschedule</label>
      <textarea name="reason" placeholder="Optional — let us know why you need to reschedule"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
  </form>
</div>

<div class="success-msg" id="successMsg">
  <h2>Request Submitted!</h2>
  <p>We'll confirm your new session time on WhatsApp within 24 hours. Keep an eye out!</p>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  function selectTime(el, time) {
    document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
    el.classList.add('selected');
    document.getElementById('timeInput').value = time;
  }

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');

    if (!document.getElementById('timeInput').value) {
      alert('Please select a time slot.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var form = e.target;
    var data = {
      client_id: form.client_id.value,
      name: form.name.value,
      phone: form.phone.value,
      preferred_date: form.preferred_date.value,
      preferred_time: form.preferred_time.value,
      reason: form.reason.value,
    };

    // Reschedule requests go to Maddy for manual confirmation
    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer internal',
      },
      body: JSON.stringify({
        phone: '+917082478374',
        message: 'RESCHEDULE REQUEST\nClient: ' + data.name + '\nPhone: ' + data.phone +
          '\nDate: ' + data.preferred_date + '\nTime: ' + data.preferred_time +
          '\nReason: ' + (data.reason || 'Not provided'),
      }),
    })
    .then(function() {
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  });
</script>

</body>
</html>
