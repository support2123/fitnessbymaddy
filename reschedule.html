<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      color: var(--gold-light); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p { color: #aaa; font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
    .form-container { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
    .section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
      color: var(--charcoal); margin-bottom: 16px; letter-spacing: 1px;
    }
    label {
      display: block; font-size: 12px; font-weight: 500; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: var(--charcoal); background: var(--white); transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .time-slot {
      padding: 14px; border: 1.5px solid var(--light-grey); border-radius: 4px;
      text-align: center; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.3s; user-select: none;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .submit-btn {
      width: 100%; padding: 18px; background: var(--charcoal); color: white;
      border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px; border-radius: 4px;
      font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fbe9e7; color: var(--error); }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Fitness by Maddy</h1>
    <p>Reschedule Your Session</p>
  </div>

  <div class="form-container">
    <form id="rescheduleForm">
      <input type="hidden" id="client_id" name="client_id">

      <div class="section-title">Select New Date</div>
      <label for="date">Preferred Date *</label>
      <input type="date" id="date" name="date" required>

      <label>Preferred Time Slot *</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="06:00">6:00 AM</div>
        <div class="time-slot" data-time="07:00">7:00 AM</div>
        <div class="time-slot" data-time="08:00">8:00 AM</div>
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="17:00">5:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
        <div class="time-slot" data-time="19:00">7:00 PM</div>
        <div class="time-slot" data-time="20:00">8:00 PM</div>
      </div>
      <input type="hidden" id="time" name="time" required>

      <label for="reason">Reason for Rescheduling</label>
      <textarea id="reason" name="reason" placeholder="Optional — let us know why you need to reschedule"></textarea>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    document.getElementById('client_id').value = params.get('c') || '';

    var today = new Date();
    today.setDate(today.getDate() + 1);
    document.getElementById('date').min = today.toISOString().split('T')[0];

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        document.getElementById('time').value = this.dataset.time;
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');

      if (!document.getElementById('time').value) {
        msg.className = 'status-msg error';
        msg.textContent = 'Please select a time slot.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'status-msg';

      var data = {
        client_id: document.getElementById('client_id').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        reason: document.getElementById('reason').value
      };

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          text: 'Reschedule request from client ' + data.client_id +
            ': ' + data.date + ' at ' + data.time +
            (data.reason ? ' — Reason: ' + data.reason : '')
        })
      })
      .then(function() {
        msg.className = 'status-msg success';
        msg.textContent = 'Reschedule request sent! Maddy\'s team will confirm your new slot shortly.';
        btn.textContent = 'REQUESTED ✓';
      })
      .catch(function() {
        msg.className = 'status-msg error';
        msg.textContent = 'Something went wrong. Please message us directly on WhatsApp.';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  </script>
</body>
</html>
