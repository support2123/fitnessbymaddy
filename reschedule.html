<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-header">
    <div class="logo">Fitness by Maddy</div>
    <h1>Reschedule <em>Session</em></h1>
    <p>Missed a session? No worries — pick a new time that works for you.</p>
  </div>

  <div id="formError" class="form-error"></div>

  <form id="rescheduleForm" novalidate>
    <input type="hidden" id="clientId" name="client_id">

    <div class="form-section">
      <h2 class="form-section-title">Your Details</h2>
      <div class="field">
        <label>Name <span class="required">*</span></label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Phone / WhatsApp <span class="required">*</span></label>
        <input type="tel" name="phone" required placeholder="+91 xxxxx xxxxx">
      </div>
    </div>

    <div class="form-section">
      <h2 class="form-section-title">New Session Time</h2>
      <div class="field">
        <label>Preferred Date <span class="required">*</span></label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="field">
        <label>Preferred Time (IST) <span class="required">*</span></label>
        <select name="preferred_time" required>
          <option value="">Select a time slot</option>
          <option value="07:00">7:00 AM</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="16:00">4:00 PM</option>
          <option value="17:00">5:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="20:00">8:00 PM</option>
        </select>
      </div>
      <div class="field">
        <label>Reason for Rescheduling</label>
        <select name="reason">
          <option value="">Select reason</option>
          <option value="scheduling_conflict">Scheduling conflict</option>
          <option value="feeling_unwell">Feeling unwell</option>
          <option value="travel">Travelling</option>
          <option value="personal">Personal reasons</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Additional Notes</label>
        <textarea name="notes" rows="3" placeholder="Anything else we should know?"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit">Request Reschedule</button>
  </form>

  <div id="formSuccess" class="form-success">
    <div class="check">✓</div>
    <h2>Request Received!</h2>
    <p>We'll confirm your new session time on WhatsApp within a few hours. Keep an eye on your messages!</p>
  </div>

  <div class="form-footer">FITNESS BY MADDY · fitnessbymaddy.com</div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date();
  today.setDate(today.getDate() + 1);
  dateInput.min = today.toISOString().split('T')[0];

  var form = document.getElementById('rescheduleForm');
  var errorEl = document.getElementById('formError');
  var successEl = document.getElementById('formSuccess');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.style.display = 'none';

    var data = Object.fromEntries(new FormData(form));
    if (!data.name || !data.phone || !data.preferred_date || !data.preferred_time) {
      errorEl.textContent = 'Please fill in all required fields.';
      errorEl.style.display = 'block';
      return;
    }

    var btn = form.querySelector('.btn-submit');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    try {
      var res = await fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          type: 'text',
          text: 'Reschedule request from ' + data.name + ' (' + data.phone + '): ' +
                data.preferred_date + ' at ' + data.preferred_time +
                (data.reason ? ' — Reason: ' + data.reason : '') +
                (data.notes ? ' — Notes: ' + data.notes : ''),
        }),
      });

      form.style.display = 'none';
      successEl.style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please message us on WhatsApp directly.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    }
  });
})();
</script>

</body>
</html>
