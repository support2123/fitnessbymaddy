<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 32px;
      font-weight: 300; color: var(--white); margin-bottom: 8px;
    }
    .form-header h1 em { color: var(--gold); font-style: italic; }
    .form-header p { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
    .form-brand {
      font-family: 'Cormorant Garamond', serif; font-size: 14px;
      letter-spacing: 3px; text-transform: uppercase; color: var(--gold);
      margin-bottom: 20px;
    }

    .form-container { max-width: 560px; margin: 0 auto; padding: 40px 24px 60px; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--white);
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }

    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 14px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; font-size: 13px; cursor: pointer;
      transition: all 0.2s; background: var(--white);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: var(--gold); color: var(--white); }
    .time-slot input { display: none; }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer;
      transition: background 0.3s; margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); }

    .error-msg {
      background: #FEE; border: 1px solid #E88; color: #933;
      padding: 12px 16px; border-radius: 2px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>

<div class="form-header">
  <div class="form-brand">Fitness by Maddy</div>
  <h1>Reschedule <em>Session</em></h1>
  <p>Pick a new time that works for you</p>
</div>

<div class="form-container">
  <div class="error-msg" id="errorMsg"></div>

  <form id="rescheduleForm">
    <div class="field">
      <label>Your Phone Number *</label>
      <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
    </div>

    <div class="field">
      <label>Preferred Date *</label>
      <input type="date" name="preferred_date" required>
    </div>

    <div class="field">
      <label>Preferred Time Slot *</label>
      <div class="time-slots">
        <label class="time-slot"><input type="radio" name="time_slot" value="9:00 AM" required>9:00 AM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="10:00 AM">10:00 AM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="11:00 AM">11:00 AM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="12:00 PM">12:00 PM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="2:00 PM">2:00 PM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="4:00 PM">4:00 PM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="6:00 PM">6:00 PM</label>
        <label class="time-slot"><input type="radio" name="time_slot" value="8:00 PM">8:00 PM</label>
      </div>
    </div>

    <div class="field">
      <label>Reason for Reschedule</label>
      <textarea name="reason" placeholder="Let us know why you need to reschedule (optional)"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>Request sent!</h2>
    <p>We'll confirm your new session time via WhatsApp within 24 hours.</p>
  </div>
</div>

<script>
  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
    });
  });

  var today = new Date();
  today.setDate(today.getDate() + 1);
  var minDate = today.toISOString().split('T')[0];
  document.querySelector('input[name="preferred_date"]').setAttribute('min', minDate);

  var form = document.getElementById('rescheduleForm');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorMsg.style.display = 'none';

    var data = {
      phone: form.phone.value.replace(/\s/g, ''),
      preferred_date: form.preferred_date.value,
      time_slot: form.time_slot.value,
      reason: form.reason.value || '',
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + 'public-reschedule',
      },
      body: JSON.stringify({
        phone: '917082478374',
        type: 'template',
        templateName: 'reschedule_request',
        params: [data.phone, data.preferred_date, data.time_slot, data.reason],
        bypassRateLimit: true,
      }),
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      form.style.display = 'none';
      successMsg.style.display = 'block';
    })
    .catch(function() {
      errorMsg.textContent = 'Network error. Please try again or message us on WhatsApp.';
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request Reschedule';
    });
  });
</script>
</body>
</html>
