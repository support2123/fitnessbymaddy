<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule · Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">
  <main class="form-shell">
    <div class="form-eyebrow">Reschedule</div>
    <h1 class="form-title">Life happens.<br>Let's move it.</h1>
    <p class="form-sub">Tell us what you missed and when you can make it up. Maddy's team will confirm on WhatsApp.</p>

    <form id="rescheduleForm" novalidate>
      <div class="form-field">
        <label for="phone">WhatsApp number</label>
        <input id="phone" name="phone" type="tel" placeholder="+91 70824 78374" required>
      </div>
      <div class="form-field">
        <label for="missed">What did you miss?</label>
        <select id="missed" name="missed" required>
          <option value="">Select</option>
          <option>Zoom session</option>
          <option>Weekly check-in</option>
          <option>Workout day</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-field">
        <label for="when">Preferred new time</label>
        <input id="when" name="when" type="datetime-local" required>
      </div>
      <div class="form-field">
        <label for="reason">Reason (optional)</label>
        <textarea id="reason" name="reason"></textarea>
      </div>

      <button class="btn-submit" type="submit" id="submitBtn">Send request</button>
      <div id="status" class="form-status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('rescheduleForm');
    const btn = document.getElementById('submitBtn');
    const st = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      st.textContent = ''; st.className = 'form-status';
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      payload.notes = `RESCHEDULE: missed=${payload.missed}, when=${payload.when}, reason=${payload.reason || ''}`;
      btn.disabled = true;
      try {
        const r = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error((await r.json()).error || 'Failed');
        st.className = 'form-status ok';
        st.textContent = 'Noted. You\u2019ll hear back on WhatsApp shortly.';
        form.reset();
      } catch (err) {
        st.className = 'form-status err';
        st.textContent = 'Something broke: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
