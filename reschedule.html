<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--charcoal); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px 32px; text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 42px;
      color: white; letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; letter-spacing: 1px; }
    .form-container {
      max-width: 480px; margin: 0 auto; padding: 32px 24px 48px;
      background: var(--cream); min-height: calc(100vh - 130px);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--gold); letter-spacing: 2px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: white; font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; border: none;
      cursor: pointer; transition: background 0.3s; border-radius: 2px;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
      background: var(--cream); min-height: calc(100vh - 130px);
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Pick a new time that works for you</p>
  </div>

  <div class="form-container" id="formContainer">
    <form id="rescheduleForm">
      <div class="form-section-title">Session Details</div>

      <div class="field">
        <label>Your Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label>WhatsApp Number *</label>
        <input type="tel" name="phone" required placeholder="+91...">
      </div>
      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>

      <div class="field">
        <label>Reason for Reschedule</label>
        <textarea name="reason" placeholder="Optional — let us know if there's anything we should be aware of"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Submitted!</h2>
    <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
  </div>

  <script>
    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        document.getElementById('selectedTime').value = this.dataset.time;
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(val, key) { data[key] = val; });

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          body: 'Reschedule request from ' + data.name + ' (' + data.phone + ')\nDate: ' + data.date + ' at ' + data.time + '\nReason: ' + (data.reason || 'N/A'),
          templateName: 'reschedule_request'
        })
      })
      .then(function() {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'Request Reschedule';
        alert('Network error. Please try again.');
      });
    });
  </script>
</body>
</html>
