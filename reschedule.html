<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-page h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 8px; }
    .form-page h1 em { color: var(--gold); font-style: italic; }
    .form-page .form-subtitle { font-size: 14px; color: var(--mid-grey); margin-bottom: 40px; line-height: 1.6; }
    .form-card { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 8px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.3s; border-radius: 2px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 14px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page" id="formSection">
    <p class="section-eyebrow">Missed a Session?</p>
    <h1>Reschedule <em>Your Session</em></h1>
    <p class="form-subtitle">Life happens. Let us know your preferred times and we'll get you rebooked ASAP.</p>

    <div class="form-card">
      <form id="rescheduleForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Your Name *</label>
            <input class="form-input" type="text" name="name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone (WhatsApp) *</label>
            <input class="form-input" type="tel" name="phone" required placeholder="+91...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Reason for Reschedule</label>
          <select class="form-select" name="reason">
            <option value="">Select reason</option>
            <option value="schedule_conflict">Schedule Conflict</option>
            <option value="feeling_unwell">Feeling Unwell</option>
            <option value="travel">Travel</option>
            <option value="emergency">Emergency</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Preferred Date *</label>
            <input class="form-input" type="date" name="preferred_date" required>
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Time *</label>
            <select class="form-select" name="preferred_time" required>
              <option value="">Select time slot</option>
              <option value="morning">Morning (7-10 AM IST)</option>
              <option value="midday">Midday (11 AM - 1 PM IST)</option>
              <option value="afternoon">Afternoon (2-5 PM IST)</option>
              <option value="evening">Evening (6-9 PM IST)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Additional Notes</label>
          <textarea class="form-textarea" name="notes" placeholder="Anything else Maddy should know?"></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>
  </div>

  <div class="success-msg" id="successSection">
    <h2>Request Sent!</h2>
    <p>Maddy's team will confirm your new session time on WhatsApp shortly.</p>
  </div>
</div>

<script>
(function() {
  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = e.target;
    var data = {
      name: form.name.value,
      phone: form.phone.value,
      reason: form.reason.value,
      preferred_date: form.preferred_date.value,
      preferred_time: form.preferred_time.value,
      notes: form.notes.value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        body: 'Reschedule Request:\nClient: ' + data.name + ' (' + data.phone + ')\nReason: ' + data.reason +
              '\nPreferred: ' + data.preferred_date + ' ' + data.preferred_time +
              '\nNotes: ' + (data.notes || 'None')
      })
    })
    .then(function() {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    })
    .catch(function() {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    });
  });
})();
</script>
<script src="js/nav.js"></script>
</body>
</html>
