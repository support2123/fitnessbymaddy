<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap { max-width: 480px; margin: 0 auto; padding: 40px 20px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 40px; }
    .reschedule-header .section-eyebrow { margin-bottom: 12px; }
    .reschedule-header .section-title { font-size: 36px; margin-bottom: 8px; }
    .reschedule-subtitle { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .reschedule-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236B6B6B' stroke-width='1.5' fill='none'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 16px center; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { text-align: center; padding: 14px 8px; border: 1.5px solid var(--light-grey); border-radius: 4px; cursor: pointer; transition: all 0.3s; font-size: 13px; color: var(--charcoal); }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: rgba(184,150,90,0.08); font-weight: 600; }
    .submit-btn { width: 100%; padding: 18px; background: var(--charcoal); color: white; border: none; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 24px; }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--taupe); cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      .reschedule-form { padding: 28px 20px; }
      .time-slots { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Missed a Session?</p>
      <h1 class="section-title">Re<em>schedule</em></h1>
      <p class="reschedule-subtitle">No worries — pick a new time and we'll get you back on track.</p>
    </div>

    <form class="reschedule-form" id="rescheduleForm">
      <div class="form-group">
        <label class="form-label" for="name">Your Name *</label>
        <input class="form-input" type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">WhatsApp Number *</label>
        <input class="form-input" type="tel" id="phone" name="phone" placeholder="+91 70824 78374" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reason">Reason for Rescheduling</label>
        <select class="form-select" id="reason" name="reason">
          <option value="">Select</option>
          <option value="sick">Feeling unwell</option>
          <option value="travel">Travel / Out of town</option>
          <option value="work">Work conflict</option>
          <option value="personal">Personal reasons</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="preferred_date">Preferred Date *</label>
        <input class="form-input" type="date" id="preferred_date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
          <div class="time-slot" data-time="21:00">9:00 PM</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Additional Notes</label>
        <textarea class="form-textarea" id="notes" name="notes" placeholder="Anything we should know..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg hidden" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your rescheduled session on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('rescheduleForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');
  var timeSlots = document.getElementById('timeSlots');
  var selectedTime = '';

  // Set min date to today
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('preferred_date').setAttribute('min', today);

  timeSlots.addEventListener('click', function(e) {
    var slot = e.target.closest('.time-slot');
    if (!slot) return;
    timeSlots.querySelectorAll('.time-slot').forEach(function(el) { el.classList.remove('selected'); });
    slot.classList.add('selected');
    selectedTime = slot.getAttribute('data-time');
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!selectedTime) { alert('Please select a time slot.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    var data = {
      name: form.name.value,
      phone: form.phone.value,
      reason: form.reason.value,
      preferred_date: form.preferred_date.value,
      preferred_time: selectedTime,
      notes: form.notes.value
    };

    // Log as a message for audit
    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        text: 'RESCHEDULE REQUEST from ' + data.name + ' (' + data.phone + '): ' + data.preferred_date + ' at ' + selectedTime + '. Reason: ' + (data.reason || 'not specified') + '. Notes: ' + (data.notes || 'none'),
        skipRateLimit: true
      })
    })
    .then(function() {
      form.classList.add('hidden');
      successMsg.classList.remove('hidden');
    })
    .catch(function() {
      form.classList.add('hidden');
      successMsg.classList.remove('hidden');
    });
  });
})();
</script>
</body>
</html>
