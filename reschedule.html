<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-page { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .reschedule-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 8px;
    }
    .reschedule-submit:hover { background: var(--gold); }
    .reschedule-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); line-height: 1.7; }
    .hidden { display: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; text-align: center; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s; color: var(--charcoal); background: var(--cream); }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-page">
    <div class="reschedule-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="margin: 0 auto;">Life happens! Choose a new slot for your session and we'll confirm on WhatsApp.</p>
    </div>

    <form id="rescheduleForm" class="reschedule-form">
      <div class="form-group">
        <label class="form-label">Your Phone (WhatsApp) *</label>
        <input type="tel" name="phone" class="form-input" placeholder="+91..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input type="date" name="date" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime" required>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea name="reason" class="form-textarea" placeholder="Why are you rescheduling?"></textarea>
      </div>

      <button type="submit" class="reschedule-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div id="successMsg" class="success-msg hidden">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var slots = document.querySelectorAll('.time-slot');
  var selectedTimeInput = document.getElementById('selectedTime');
  var dateInput = document.querySelector('input[name="date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      selectedTimeInput.value = slot.dataset.time;
    });
  });

  var form = document.getElementById('rescheduleForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!selectedTimeInput.value) { alert('Please select a time slot.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    var data = {
      phone: form.phone.value.trim(),
      type: 'text',
      is_client: true,
      text: 'RESCHEDULE REQUEST\nNew date: ' + form.date.value + '\nTime: ' + selectedTimeInput.value + '\nReason: ' + (form.reason.value.trim() || 'Not specified')
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      form.classList.add('hidden');
      successMsg.classList.remove('hidden');
    })
    .catch(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request Reschedule';
      alert('Network error. Please try again or message us on WhatsApp.');
    });
  });
})();
</script>

</body>
</html>
