<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; font-size: 13px; cursor: pointer; transition: all 0.3s; }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
    @media (max-width: 500px) { .form-card { padding: 28px 20px; } .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Missed a Session?</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Pick a new time that works for you. We'll confirm via WhatsApp.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="submitReschedule(event)">
        <div class="form-group">
          <label>Preferred Date *</label>
          <input type="date" name="preferred_date" required min="">
        </div>

        <div class="form-group">
          <label>Preferred Time Slot *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="06:00">6:00 AM</div>
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
          </div>
          <input type="hidden" name="preferred_time" id="selectedTime" required>
        </div>

        <div class="form-group">
          <label>Reason (optional)</label>
          <textarea name="reason" placeholder="Why did you miss the session?"></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
var today = new Date().toISOString().split('T')[0];
document.querySelector('input[name="preferred_date"]').min = today;

document.querySelectorAll('.time-slot').forEach(function(slot) {
  slot.addEventListener('click', function() {
    document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
    this.classList.add('selected');
    document.getElementById('selectedTime').value = this.dataset.time;
  });
});

async function submitReschedule(e) {
  e.preventDefault();
  if (!document.getElementById('selectedTime').value) {
    alert('Please select a time slot.');
    return;
  }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('reschedule');
  var data = Object.fromEntries(new FormData(form));
  var params = new URLSearchParams(window.location.search);
  data.client_id = params.get('c');

  try {
    var res = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'REQUEST RESCHEDULE';
    alert('Network error. Please try again.');
  }
}
</script>
</body>
</html>
