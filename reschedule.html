<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111111;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: white;
      min-height: 100vh;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field select option {
      background: #222;
      color: white;
    }
    .field textarea {
      resize: vertical;
      min-height: 80px;
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .time-slot:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .time-slot.selected {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
      font-weight: 600;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 24px;
    }
    .submit-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      line-height: 1.6;
    }
    .brand-mark {
      text-align: center;
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>RESCHEDULE SESSION</h1>
      <p>Can't make your scheduled time? No worries — pick a new slot below.</p>
    </div>

    <form id="rescheduleForm">
      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="date" required>
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime" required>
      </div>

      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="E.g., work meeting, travelling, not feeling well..."></textarea>
      </div>

      <button type="submit" class="submit-btn">CONFIRM RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>RESCHEDULED!</h2>
      <p>Your session has been moved. You'll receive a WhatsApp confirmation with the new time. See you there!</p>
    </div>

    <div class="brand-mark">Fitness by Maddy</div>
  </div>

  <script>
    const form = document.getElementById('rescheduleForm');
    const successMsg = document.getElementById('successMsg');
    const slots = document.querySelectorAll('.time-slot');
    const selectedTimeInput = document.getElementById('selectedTime');

    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');

    slots.forEach(slot => {
      slot.addEventListener('click', function() {
        slots.forEach(s => s.classList.remove('selected'));
        this.classList.add('selected');
        selectedTimeInput.value = this.dataset.time;
      });
    });

    const dateInput = form.querySelector('[name="date"]');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!selectedTimeInput.value) {
        alert('Please select a time slot');
        return;
      }

      const btn = form.querySelector('.submit-btn');
      btn.disabled = true;
      btn.textContent = 'CONFIRMING...';

      const formData = new FormData(form);
      const data = {
        client_id: clientId,
        date: formData.get('date'),
        time: formData.get('time'),
        reason: formData.get('reason')
      };

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...data, lead_id: clientId, type: 'reschedule' })
        });

        if (res.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          btn.textContent = 'ERROR - TRY AGAIN';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'ERROR - TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
