<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { min-height: 100vh; background: var(--cream); padding: 72px 0 0; }
    .form-container { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300;
      color: var(--charcoal); margin-bottom: 12px;
    }
    .form-header h1 em { font-style: italic; color: var(--gold); }
    .form-header p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .form-card {
      background: white; padding: 40px 32px; border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; cursor: pointer; transition: all 0.3s;
      font-size: 13px; color: var(--mid-grey);
    }
    .time-slot:hover, .time-slot.selected {
      border-color: var(--gold); color: var(--charcoal); background: rgba(184,150,90,0.08);
    }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; transition: background 0.3s; margin-top: 32px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 24px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="form-page">
  <div class="form-container">
    <div class="form-header">
      <p class="section-eyebrow">Missed a Session?</p>
      <h1>Let's <em>Reschedule</em></h1>
      <p>Life happens — pick a new time and we'll get you back on track.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="submitReschedule(event)">
        <input type="hidden" name="client_id" id="clientId">

        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input type="text" name="name" class="form-input" required placeholder="Your full name">
        </div>

        <div class="form-group">
          <label class="form-label">Phone / WhatsApp Number *</label>
          <input type="tel" name="phone" class="form-input" required placeholder="+91...">
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input type="date" name="preferred_date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="7:00 AM" onclick="selectSlot(this)">7:00 AM</div>
            <div class="time-slot" data-time="8:00 AM" onclick="selectSlot(this)">8:00 AM</div>
            <div class="time-slot" data-time="9:00 AM" onclick="selectSlot(this)">9:00 AM</div>
            <div class="time-slot" data-time="10:00 AM" onclick="selectSlot(this)">10:00 AM</div>
            <div class="time-slot" data-time="5:00 PM" onclick="selectSlot(this)">5:00 PM</div>
            <div class="time-slot" data-time="6:00 PM" onclick="selectSlot(this)">6:00 PM</div>
            <div class="time-slot" data-time="7:00 PM" onclick="selectSlot(this)">7:00 PM</div>
            <div class="time-slot" data-time="8:00 PM" onclick="selectSlot(this)">8:00 PM</div>
            <div class="time-slot" data-time="9:00 PM" onclick="selectSlot(this)">9:00 PM</div>
          </div>
          <input type="hidden" name="preferred_time" id="preferredTime">
        </div>

        <div class="form-group">
          <label class="form-label">Reason for Rescheduling</label>
          <textarea name="reason" class="form-textarea" placeholder="Optional — helps us plan better"></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule →</button>
        <div class="form-error" id="formError"></div>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Reschedule Requested ✦</h2>
      <p>We'll confirm your new session time on WhatsApp within 24 hours.</p>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  const dateInput = document.querySelector('input[name="preferred_date"]');
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  let selectedTime = '';
  function selectSlot(el) {
    document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    selectedTime = el.dataset.time;
    document.getElementById('preferredTime').value = selectedTime;
  }

  async function submitReschedule(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('formError');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    err.style.display = 'none';

    const form = document.getElementById('reschedule');
    const data = Object.fromEntries(new FormData(form));

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, type: 'reschedule' })
      });

      if (!res.ok) {
        const body = await res.json();
        throw new Error(body.error || 'Submission failed');
      }

      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (error) {
      err.textContent = error.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Request Reschedule →';
    }
  }
</script>
<script src="js/nav.js"></script>
</body>
</html>
