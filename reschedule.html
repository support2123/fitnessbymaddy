<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">
  <div class="form-header">
    <a class="form-logo" href="index.html">Fitness by Maddy</a>
    <p class="form-subtitle">Reschedule Your Session</p>
  </div>

  <form id="rescheduleForm" class="brand-form">
    <div class="form-section">
      <h3 class="form-section-title">Reschedule Request</h3>

      <div class="form-group">
        <label class="form-label" for="phone">WhatsApp Number *</label>
        <input class="form-input" type="tel" id="phone" name="phone" placeholder="+91..." required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reason">Reason for Rescheduling</label>
        <select class="form-input" id="reason" name="reason">
          <option value="">Select</option>
          <option value="travel">Traveling</option>
          <option value="sick">Feeling unwell</option>
          <option value="work">Work commitment</option>
          <option value="personal">Personal reasons</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="preferred_date">Preferred New Date *</label>
        <input class="form-input" type="date" id="preferred_date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="preferred_time">Preferred Time Slot *</label>
        <select class="form-input" id="preferred_time" name="preferred_time" required>
          <option value="">Select</option>
          <option value="morning">Morning (7am - 10am IST)</option>
          <option value="afternoon">Afternoon (12pm - 3pm IST)</option>
          <option value="evening">Evening (5pm - 8pm IST)</option>
          <option value="night">Night (8pm - 10pm IST)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Additional Notes</label>
        <textarea class="form-input" id="notes" name="notes" rows="3" placeholder="Anything else we should know..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn-primary form-submit">Submit Reschedule Request</button>
    <p class="form-footer-note">We'll confirm your new slot via WhatsApp within 24 hours.</p>
  </form>

  <div id="successMessage" class="form-success" style="display:none;">
    <div class="success-icon">✓</div>
    <h3>Request Submitted!</h3>
    <p>We'll confirm your rescheduled session on WhatsApp shortly.</p>
  </div>
</div>

<script>
(function() {
  var dateInput = document.getElementById('preferred_date');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var btn = form.querySelector('.form-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      phone: form.phone.value,
      reason: form.reason.value || null,
      preferred_date: form.preferred_date.value,
      preferred_time: form.preferred_time.value,
      notes: form.notes.value || null
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer client-form'
      },
      body: JSON.stringify({
        phone: '+917082478374',
        text: 'RESCHEDULE REQUEST\\nPhone: ' + data.phone + '\\nDate: ' + data.preferred_date + '\\nTime: ' + data.preferred_time + '\\nReason: ' + (data.reason || 'N/A') + '\\nNotes: ' + (data.notes || 'N/A')
      })
    })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Reschedule Request';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
