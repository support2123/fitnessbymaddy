<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 20px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .form-header p {
      color: #ccc;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .form-container {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .form-section { margin-bottom: 32px; }

    .form-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--mid-grey);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--charcoal);
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    textarea { resize: vertical; min-height: 80px; }

    .time-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .time-slot input { display: none; }

    .time-slot label {
      display: block;
      text-align: center;
      padding: 12px 8px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      color: var(--charcoal);
      transition: all 0.2s;
    }

    .time-slot input:checked + label {
      border-color: var(--gold);
      background: var(--gold);
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .success-msg p { color: var(--mid-grey); }

    @media (max-width: 600px) {
      .form-header h1 { font-size: 1.6rem; }
      .time-slots { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Life happens — let's find a better time</p>
  </div>

  <div class="form-container">
    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-section">
        <h2>Your Details</h2>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="phone">WhatsApp Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXX XXXXX">
        </div>
      </div>

      <div class="form-section">
        <h2>Preferred Date</h2>
        <div class="field">
          <label for="date">Pick a New Date</label>
          <input type="date" id="date" name="date" required>
        </div>
      </div>

      <div class="form-section">
        <h2>Preferred Time Slot (IST)</h2>
        <div class="time-slots">
          <div class="time-slot">
            <input type="radio" id="t1" name="time_slot" value="7:00 AM" required>
            <label for="t1">7:00 AM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t2" name="time_slot" value="8:00 AM">
            <label for="t2">8:00 AM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t3" name="time_slot" value="9:00 AM">
            <label for="t3">9:00 AM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t4" name="time_slot" value="10:00 AM">
            <label for="t4">10:00 AM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t5" name="time_slot" value="5:00 PM">
            <label for="t5">5:00 PM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t6" name="time_slot" value="6:00 PM">
            <label for="t6">6:00 PM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t7" name="time_slot" value="7:00 PM">
            <label for="t7">7:00 PM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t8" name="time_slot" value="8:00 PM">
            <label for="t8">8:00 PM</label>
          </div>
          <div class="time-slot">
            <input type="radio" id="t9" name="time_slot" value="9:00 PM">
            <label for="t9">9:00 PM</label>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="field">
          <label for="reason">Reason for Reschedule (Optional)</label>
          <textarea id="reason" name="reason" placeholder="Helps us plan better..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Reschedule Requested!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      if (clientId) document.getElementById('clientId').value = clientId;

      var dateInput = document.getElementById('date');
      var today = new Date();
      today.setDate(today.getDate() + 1);
      dateInput.min = today.toISOString().split('T')[0];
      var maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 14);
      dateInput.max = maxDate.toISOString().split('T')[0];

      var form = document.getElementById('rescheduleForm');
      var btn = document.getElementById('submitBtn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        var data = {
          client_id: clientId,
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          date: document.getElementById('date').value,
          time_slot: form.querySelector('input[name="time_slot"]:checked')?.value,
          reason: document.getElementById('reason').value,
        };

        fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
          .then(function (r) { return r.json(); })
          .then(function (result) {
            form.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          })
          .catch(function () {
            form.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          });
      });
    })();
  </script>
</body>
</html>
