<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-container { max-width: 480px; margin: 0 auto; padding: 40px 24px 60px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 4px; color: var(--gold);
    }
    .brand p { font-size: 14px; color: var(--mid-grey); margin-top: 8px; }

    .form-section { margin-bottom: 28px; }
    .form-section h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2px; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--charcoal); margin-bottom: 6px;
    }
    .field label .req { color: var(--error); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; border: 1.5px solid var(--light-grey); border-radius: 4px;
      background: #fff; color: var(--charcoal); transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }

    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .time-slots label {
      text-align: center; padding: 12px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .time-slots input { display: none; }
    .time-slots input:checked + label {
      border-color: var(--gold); background: var(--gold); color: #fff;
    }

    .submit-btn {
      width: 100%; padding: 16px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; border: none; border-radius: 4px;
      background: var(--charcoal); color: #fff; cursor: pointer;
      transition: background 0.3s; margin-top: 20px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg {
      text-align: center; padding: 16px; border-radius: 4px;
      margin-top: 16px; font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fce4ec; color: var(--error); }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Reschedule Your Session</p>
    </div>

    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-section">
        <h2>Select New Date</h2>
        <div class="field">
          <label>Preferred Date <span class="req">*</span></label>
          <input type="date" name="preferred_date" required>
        </div>
      </div>

      <div class="form-section">
        <h2>Preferred Time (IST)</h2>
        <div class="time-slots">
          <input type="radio" name="preferred_time" value="07:00" id="t7">
          <label for="t7">7:00 AM</label>
          <input type="radio" name="preferred_time" value="08:00" id="t8">
          <label for="t8">8:00 AM</label>
          <input type="radio" name="preferred_time" value="09:00" id="t9">
          <label for="t9">9:00 AM</label>
          <input type="radio" name="preferred_time" value="10:00" id="t10">
          <label for="t10">10:00 AM</label>
          <input type="radio" name="preferred_time" value="17:00" id="t17">
          <label for="t17">5:00 PM</label>
          <input type="radio" name="preferred_time" value="18:00" id="t18">
          <label for="t18">6:00 PM</label>
          <input type="radio" name="preferred_time" value="19:00" id="t19">
          <label for="t19">7:00 PM</label>
          <input type="radio" name="preferred_time" value="20:00" id="t20">
          <label for="t20">8:00 PM</label>
        </div>
      </div>

      <div class="form-section">
        <h2>Reason</h2>
        <div class="field">
          <label>Why do you need to reschedule?</label>
          <textarea name="reason" placeholder="Optional — helps us accommodate you better"></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      document.getElementById('clientId').value = clientId || '';

      var dateInput = document.querySelector('input[name="preferred_date"]');
      var today = new Date();
      today.setDate(today.getDate() + 1);
      dateInput.min = today.toISOString().split('T')[0];

      if (!clientId) {
        document.getElementById('statusMsg').textContent = 'Invalid link. Please use the link sent to your WhatsApp.';
        document.getElementById('statusMsg').className = 'status-msg error';
        document.getElementById('submitBtn').disabled = true;
      }

      document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('statusMsg');
        btn.disabled = true;
        btn.textContent = 'Submitting...';
        msg.className = 'status-msg';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(v, k) { data[k] = v; });

        if (!data.preferred_time) {
          msg.textContent = 'Please select a time slot.';
          msg.className = 'status-msg error';
          btn.disabled = false;
          btn.textContent = 'Request Reschedule';
          return;
        }

        msg.textContent = 'Reschedule request submitted! We\'ll confirm your new slot on WhatsApp.';
        msg.className = 'status-msg success';
        btn.textContent = 'Submitted!';
      });
    })();
  </script>
</body>
</html>
