<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --error: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: white;
      letter-spacing: 3px;
    }
    .form-header p {
      color: var(--gold-light);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      resize: vertical;
      min-height: 80px;
    }
    .required::after {
      content: ' *';
      color: var(--error);
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px;
      text-align: center;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--charcoal);
      letter-spacing: 2px;
    }
    .success-msg p {
      color: var(--mid-grey);
      margin-top: 12px;
      line-height: 1.6;
    }
    .error-text {
      color: var(--error);
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Life happens — let's find a new time</p>
  </div>

  <div class="form-container" id="formWrap">
    <form id="rescheduleForm" novalidate>
      <div class="form-section-title">Your Details</div>
      <div class="field">
        <label class="required">Your Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label class="required">Phone (with country code)</label>
        <input type="tel" name="phone" placeholder="+91..." required>
      </div>

      <div class="form-section-title" style="margin-top:32px">Preferred New Date</div>
      <div class="field">
        <label class="required">Date</label>
        <input type="date" name="date" required>
      </div>
      <div class="field">
        <label class="required">Preferred Time Slot (IST)</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="selectedTime">
      </div>

      <div class="field">
        <label>Reason for Rescheduling</label>
        <textarea name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <p class="error-text" id="formError"></p>
      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Sent!</h2>
    <p>Maddy's team will confirm your new session time via WhatsApp within 24 hours.</p>
  </div>

  <script>
    var selectedTime = '';
    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTime = slot.getAttribute('data-time');
        document.getElementById('selectedTime').value = selectedTime;
      });
    });

    var dateInput = document.querySelector('input[name="date"]');
    var today = new Date();
    today.setDate(today.getDate() + 1);
    dateInput.min = today.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('formError');

      if (!form.name.value.trim() || !form.phone.value.trim() || !form.date.value || !selectedTime) {
        errEl.textContent = 'Please fill in all required fields and select a time slot.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      var data = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        date: form.date.value,
        time: selectedTime,
        reason: form.reason.value.trim()
      };

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '917082478374',
          message: 'Reschedule request from ' + data.name + ' (' + data.phone + ') for ' + data.date + ' at ' + data.time + '. Reason: ' + (data.reason || 'Not specified')
        })
      })
      .then(function() {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please try again or message us on WhatsApp.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  </script>
</body>
</html>
