<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 20px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 500px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Reschedule</p>
    <h1 class="section-title">Pick a <em>New</em> Time</h1>
    <p class="section-body" style="margin:12px auto 0">Life happens! Let's find a time that works better for you.</p>
  </div>

  <div class="form-card" id="rescheduleForm">
    <form id="reschedule" onsubmit="submitReschedule(event)">
      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input class="form-input" name="date" type="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" onclick="selectSlot(this)">7:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)">8:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)">9:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)">10:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)">11:00 AM</div>
          <div class="time-slot" onclick="selectSlot(this)">4:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)">5:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)">6:00 PM</div>
          <div class="time-slot" onclick="selectSlot(this)">7:00 PM</div>
        </div>
        <input type="hidden" name="time_slot" id="selectedSlot">
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Any context helps us plan better..."></textarea>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new time slot on WhatsApp shortly.</p>
  </div>
</div>

<script>
let selectedTime = '';

function selectSlot(el) {
  document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  selectedTime = el.textContent;
  document.getElementById('selectedSlot').value = selectedTime;
}

async function submitReschedule(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';

  if (!selectedTime) {
    errorEl.textContent = 'Please select a time slot.';
    errorEl.style.display = 'block';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('c');
  if (!clientId) {
    errorEl.textContent = 'Invalid link. Please use the link sent to your WhatsApp.';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  const data = Object.fromEntries(new FormData(form));
  data.client_id = clientId;

  try {
    const resp = await fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        text: `RESCHEDULE REQUEST\nClient: ${clientId}\nDate: ${data.date}\nTime: ${data.time_slot}\nReason: ${data.reason || 'Not provided'}`,
        force: true,
      }),
    });
    if (!resp.ok) throw new Error('Failed to submit');

    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'REQUEST RESCHEDULE';
  }
}
</script>
</body>
</html>
