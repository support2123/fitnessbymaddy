<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your missed coaching session with Fitness by Maddy.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6B6B; margin-bottom: 8px; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 14px 16px; border: 1.5px solid #E8E3DC; border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: #2C2C2C;
      background: #FAF8F4; transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #B8965A; }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select { appearance: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid #E8E3DC; border-radius: 2px;
      font-size: 13px; color: #6B6B6B; cursor: pointer; transition: all 0.3s;
      background: #FAF8F4;
    }
    .time-slot:hover { border-color: #B8965A; color: #B8965A; }
    .time-slot.selected { border-color: #B8965A; background: #B8965A; color: white; }
    .submit-btn {
      width: 100%; padding: 16px; background: #2C2C2C; color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .submit-btn:hover { background: #B8965A; }
    .submit-btn:disabled { background: #C8B89A; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #2C2C2C; margin-bottom: 12px; }
    .success-msg p { color: #6B6B6B; font-size: 15px; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 400px) { .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="reschedule-wrap">
  <div class="reschedule-header">
    <p class="section-eyebrow">Reschedule</p>
    <h1 class="section-title">Pick a <em>New</em> Time</h1>
    <p class="section-body" style="margin:0 auto">Missed a session? No worries — choose your preferred date and time below.</p>
  </div>

  <form id="rescheduleForm" class="reschedule-form">
    <div class="form-group">
      <label class="form-label" for="clientName">Your Name *</label>
      <input class="form-input" type="text" id="clientName" name="name" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="clientPhone">WhatsApp Number *</label>
      <input class="form-input" type="tel" id="clientPhone" name="phone" placeholder="+91 XXXXX XXXXX" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="preferredDate">Preferred Date *</label>
      <input class="form-input" type="date" id="preferredDate" name="date" required>
    </div>

    <div class="form-group">
      <label class="form-label">Preferred Time Slot (IST) *</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="07:00">7:00 AM</div>
        <div class="time-slot" data-time="08:00">8:00 AM</div>
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="10:00">10:00 AM</div>
        <div class="time-slot" data-time="11:00">11:00 AM</div>
        <div class="time-slot" data-time="17:00">5:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
        <div class="time-slot" data-time="19:00">7:00 PM</div>
        <div class="time-slot" data-time="20:00">8:00 PM</div>
      </div>
      <input type="hidden" id="selectedTime" name="time">
    </div>

    <div class="form-group">
      <label class="form-label" for="reason">Reason for Reschedule</label>
      <textarea class="form-textarea" id="reason" name="reason" placeholder="Optional — helps us plan better"></textarea>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
  </form>

  <div id="successMsg" class="success-msg">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new session time via WhatsApp within a few hours.</p>
  </div>
</div>

<script>
(function() {
  var selectedSlot = null;

  var today = new Date();
  today.setDate(today.getDate() + 1);
  var minDate = today.toISOString().split('T')[0];
  document.getElementById('preferredDate').setAttribute('min', minDate);

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      selectedSlot = slot.getAttribute('data-time');
      document.getElementById('selectedTime').value = selectedSlot;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errorEl = document.getElementById('errorMsg');

    if (!selectedSlot) {
      errorEl.textContent = 'Please select a time slot.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SENDING...';
    errorEl.style.display = 'none';

    var data = {
      name: document.getElementById('clientName').value,
      phone: document.getElementById('clientPhone').value,
      date: document.getElementById('preferredDate').value,
      time: selectedSlot,
      reason: document.getElementById('reason').value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '917082478374',
        message: 'Reschedule Request from ' + data.name + ' (' + data.phone + '): ' + data.date + ' at ' + data.time + '. Reason: ' + (data.reason || 'N/A')
      })
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      errorEl.textContent = 'Network error. Please try again or message us on WhatsApp.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    });
  });
})();
</script>
<script src="js/nav.js"></script>
</body>
</html>
