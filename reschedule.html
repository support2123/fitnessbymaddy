<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .header {
      background: var(--charcoal); padding: 24px 20px; text-align: center;
    }
    .header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      color: white; letter-spacing: 2px;
    }
    .header p {
      font-size: 12px; color: var(--gold-light); letter-spacing: 3px;
      text-transform: uppercase; margin-top: 8px;
    }
    .form-wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
    .form-intro { text-align: center; margin-bottom: 40px; }
    .form-intro h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300;
      margin-bottom: 12px;
    }
    .form-intro h2 em { font-style: italic; color: var(--gold); }
    .form-intro p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field label .req { color: var(--gold); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
    }
    .time-slot {
      padding: 14px; border: 1.5px solid var(--light-grey); border-radius: 3px;
      text-align: center; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all 0.3s; background: white;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal); color: white; border-color: var(--charcoal);
    }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 3px;
      transition: background 0.3s; margin-top: 32px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 20px;
    }
    .success-msg .check {
      width: 64px; height: 64px; background: #2C7A2C; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 28px; color: white;
    }
    .success-msg h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .error-msg {
      background: #FFF0F0; border: 1px solid #FFCCCC; padding: 12px 16px;
      border-radius: 3px; font-size: 13px; color: #CC3333;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Fitness by Maddy</h1>
    <p>Reschedule Session</p>
  </div>

  <div class="form-wrap">
    <div class="form-intro">
      <h2>Let's <em>Reschedule</em></h2>
      <p>Life happens! Pick a new time that works for you, and we'll get you back on track.</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="rescheduleForm">
      <div class="field">
        <label>Your Name <span class="req">*</span></label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Phone / WhatsApp Number <span class="req">*</span></label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>
      <div class="field">
        <label>What did you miss? <span class="req">*</span></label>
        <select name="session_type" required>
          <option value="">Select</option>
          <option>Zoom Session</option>
          <option>Weekly Check-in</option>
          <option>Program Review Call</option>
        </select>
      </div>
      <div class="field">
        <label>Preferred Date <span class="req">*</span></label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="field">
        <label>Preferred Time Slot</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="9:00 AM">9:00 AM</div>
          <div class="time-slot" data-time="11:00 AM">11:00 AM</div>
          <div class="time-slot" data-time="2:00 PM">2:00 PM</div>
          <div class="time-slot" data-time="5:00 PM">5:00 PM</div>
          <div class="time-slot" data-time="7:00 PM">7:00 PM</div>
          <div class="time-slot" data-time="9:00 PM">9:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime">
      </div>
      <div class="field">
        <label>Reason for missing (optional)</label>
        <textarea name="reason" placeholder="No judgment — just helps us plan better"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <div class="check">&#10003;</div>
      <h3>Request Received!</h3>
      <p>We'll confirm your new session time on WhatsApp within 24 hours. Keep crushing it!</p>
    </div>
  </div>

  <script>
    var selectedSlot = null;
    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        if (selectedSlot) selectedSlot.classList.remove('selected');
        slot.classList.add('selected');
        selectedSlot = slot;
        document.getElementById('selectedTime').value = slot.dataset.time;
      });
    });

    var form = document.getElementById('rescheduleForm');
    var errorMsg = document.getElementById('errorMsg');
    var successMsg = document.getElementById('successMsg');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      var data = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        session_type: form.session_type.value,
        preferred_date: form.preferred_date.value,
        preferred_time: form.preferred_time.value,
        reason: form.reason.value.trim()
      };

      try {
        var res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ type: 'reschedule' }, data))
        });

        if (res.ok) {
          form.style.display = 'none';
          document.querySelector('.form-intro').style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          var result = await res.json();
          errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Request Reschedule';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Request Reschedule';
      }
    });
  </script>
</body>
</html>
