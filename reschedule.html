<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 40px; border-radius: 4px; box-shadow: 0 4px 32px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select { appearance: none; }
    .form-hint { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 24px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s;
      background: var(--cream); color: var(--charcoal);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); font-size: 16px; line-height: 1.7; }
    .error-msg { background: #fee; border: 1px solid #fcc; padding: 12px 16px; border-radius: 4px; color: #c00; font-size: 13px; margin-bottom: 16px; display: none; }
    @media (max-width: 600px) {
      .time-slots { grid-template-columns: repeat(2, 1fr); }
      .form-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <p class="section-eyebrow">No Worries</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:12px auto 0">Life happens. Pick a new time that works for you.</p>
    </div>

    <div id="form-container">
      <div class="form-card">
        <div class="error-msg" id="error-msg"></div>
        <form id="reschedule-form">
          <input type="hidden" id="client_id" name="client_id">
          <input type="hidden" id="selected_time" name="selected_time">

          <div class="form-group">
            <label class="form-label" for="name">Your Name *</label>
            <input class="form-input" type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">WhatsApp Number *</label>
            <input class="form-input" type="tel" id="phone" name="phone" required placeholder="+91...">
          </div>

          <div class="form-group">
            <label class="form-label" for="date">Preferred Date *</label>
            <input class="form-input" type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label class="form-label">Preferred Time Slot *</label>
            <div class="time-slots" id="time-slots">
              <div class="time-slot" data-time="07:00">7:00 AM</div>
              <div class="time-slot" data-time="08:00">8:00 AM</div>
              <div class="time-slot" data-time="09:00">9:00 AM</div>
              <div class="time-slot" data-time="10:00">10:00 AM</div>
              <div class="time-slot" data-time="11:00">11:00 AM</div>
              <div class="time-slot" data-time="16:00">4:00 PM</div>
              <div class="time-slot" data-time="17:00">5:00 PM</div>
              <div class="time-slot" data-time="18:00">6:00 PM</div>
              <div class="time-slot" data-time="19:00">7:00 PM</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reason">Reason (optional)</label>
            <textarea class="form-textarea" id="reason" name="reason" placeholder="Why are you rescheduling?"></textarea>
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">Request Reschedule</button>
        </form>
      </div>
    </div>

    <div id="success-container" class="success-msg" style="display:none">
      <h2>Reschedule Requested</h2>
      <p>We'll confirm your new time slot on WhatsApp shortly. Check your messages!</p>
    </div>
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('client_id').value = clientId;

  var dateInput = document.getElementById('date');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selected_time').value = this.dataset.time;
    });
  });

  document.getElementById('reschedule-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var errEl = document.getElementById('error-msg');

    if (!document.getElementById('selected_time').value) {
      errEl.textContent = 'Please select a time slot.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    errEl.style.display = 'none';

    var data = {
      client_id: document.getElementById('client_id').value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      date: document.getElementById('date').value,
      time: document.getElementById('selected_time').value,
      reason: document.getElementById('reason').value
    };

    document.getElementById('form-container').style.display = 'none';
    document.getElementById('success-container').style.display = 'block';
  });
})();
</script>
</body>
</html>
