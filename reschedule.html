<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap { max-width: 540px; margin: 0 auto; padding: 40px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--charcoal); margin-bottom: 12px; }
    .reschedule-header h1 em { color: var(--gold); font-style: italic; }
    .reschedule-header p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .reschedule-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s; color: var(--mid-grey);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--charcoal); }
    .time-slot.selected { border-color: var(--gold); background: rgba(184,150,90,0.08); color: var(--charcoal); font-weight: 600; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 12px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { font-size: 14px; color: var(--mid-grey); }
    .error-msg { background: #fee; border: 1px solid #fcc; padding: 12px; border-radius: 2px; color: #c33; font-size: 13px; margin-bottom: 16px; display: none; }
    @media (max-width: 480px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .reschedule-form { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Session Management</p>
      <h1>Reschedule <em>Session</em></h1>
      <p>Need to move your session? Pick a new time below and we'll get it sorted.</p>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form id="reschedule-form" class="reschedule-form">
      <div class="form-group">
        <label class="form-label">Your Phone Number *</label>
        <input type="tel" class="form-input" name="phone" placeholder="+91XXXXXXXXXX" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date *</label>
        <input type="date" class="form-input" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="time-slots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selected-time" required>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Request Reschedule</button>
    </form>

    <div id="success-view" class="success-msg" style="display:none;">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
  (function() {
    var dateInput = document.querySelector('input[name="preferred_date"]');
    var today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        document.getElementById('selected-time').value = this.getAttribute('data-time');
      });
    });

    document.getElementById('reschedule-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var errBox = document.getElementById('error-box');

      if (!document.getElementById('selected-time').value) {
        errBox.textContent = 'Please select a time slot.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errBox.style.display = 'none';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(val, key) { data[key] = val; });

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '+917082478374',
          type: 'text',
          text: 'Reschedule request from ' + data.phone + ' for ' + data.preferred_date + ' at ' + data.preferred_time + '. Reason: ' + (data.reason || 'not specified')
        })
      })
      .then(function() {
        document.getElementById('reschedule-form').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      })
      .catch(function() {
        errBox.textContent = 'Network error. Please try again.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  })();
</script>
</body>
</html>
