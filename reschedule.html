<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 12px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 20px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); line-height: 1.7; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .slot-btn {
      padding: 12px 8px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      background: var(--cream); font-size: 12px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); cursor: pointer; text-align: center; transition: all 0.3s;
    }
    .slot-btn:hover { border-color: var(--gold); }
    .slot-btn.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    @media (max-width: 600px) { .slot-grid { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <p class="section-eyebrow animate-1">Reschedule</p>
      <h1 class="section-title animate-2">Pick a New <em>Time</em></h1>
      <p class="section-body animate-3" style="margin:0 auto">Life happens! Choose a new time for your missed session.</p>
    </div>

    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="return submitReschedule(event)">
        <input type="hidden" id="client_id" name="client_id">

        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input class="form-input" type="text" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input class="form-input" type="tel" name="phone" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input class="form-input" type="date" name="preferred_date" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <input type="hidden" name="preferred_time" id="selectedTime">
          <div class="slot-grid">
            <button type="button" class="slot-btn" onclick="selectSlot(this, '9:00 AM')">9:00 AM</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '10:00 AM')">10:00 AM</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '11:00 AM')">11:00 AM</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '2:00 PM')">2:00 PM</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '4:00 PM')">4:00 PM</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '6:00 PM')">6:00 PM</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
        </div>

        <div class="form-error" id="formError"></div>
        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('client_id').value = clientId;

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date();
  today.setDate(today.getDate() + 1);
  dateInput.min = today.toISOString().split('T')[0];

  function selectSlot(btn, time) {
    document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    document.getElementById('selectedTime').value = time;
  }

  function submitReschedule(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');

    if (!document.getElementById('selectedTime').value) {
      errEl.textContent = 'Please select a time slot.';
      errEl.style.display = 'block';
      return false;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    errEl.style.display = 'none';

    var form = document.getElementById('reschedule');
    var data = {};
    new FormData(form).forEach(function(v, k) { data[k] = v; });

    // Send reschedule as a WhatsApp message to notify the team
    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        body: 'Reschedule request from ' + data.name + ' (' + data.phone + ')\nDate: ' + data.preferred_date + '\nTime: ' + data.preferred_time + '\nReason: ' + (data.reason || 'N/A'),
        bypassRateLimit: true
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errEl.textContent = 'Something went wrong. Please message us on WhatsApp directly.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    });
    return false;
  }
</script>
</body>
</html>
