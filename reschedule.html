<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Zoom Sessions</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body">Need to move your session? Pick a new time below. Please give at least 24 hours notice.</p>
    </div>

    <form id="rescheduleForm" class="branded-form" novalidate>
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="name">Your Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">WhatsApp Number *</label>
          <input class="form-input" type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="preferredDate">Preferred Date *</label>
          <input class="form-input" type="date" id="preferredDate" name="preferred_date" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="preferredTime">Preferred Time (IST) *</label>
          <select class="form-input" id="preferredTime" name="preferred_time" required>
            <option value="">Select a time slot</option>
            <option value="07:00">7:00 AM</option>
            <option value="08:00">8:00 AM</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="16:00">4:00 PM</option>
            <option value="17:00">5:00 PM</option>
            <option value="18:00">6:00 PM</option>
            <option value="19:00">7:00 PM</option>
            <option value="20:00">8:00 PM</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reason">Reason (optional)</label>
          <textarea class="form-input form-textarea" id="reason" name="reason" rows="2" placeholder="Let us know why you need to reschedule"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary form-submit">Request Reschedule →</button>
      </div>

      <div id="formStatus" class="form-status"></div>
    </form>

    <div id="successScreen" class="success-screen" style="display:none">
      <div class="success-icon">✓</div>
      <h2>Reschedule Requested!</h2>
      <p>We'll confirm your new slot via WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.getElementById('preferredDate');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var status = document.getElementById('formStatus');
    var btn = form.querySelector('.form-submit');

    var data = {};
    new FormData(form).forEach(function(v, k) { data[k] = v; });

    if (!data.name || !data.phone || !data.preferred_date || !data.preferred_time) {
      status.textContent = 'Please fill in all required fields.';
      status.className = 'form-status error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '917082478374',
        template: 'reschedule_request',
        params: [data.name, data.phone, data.preferred_date, data.preferred_time, data.reason || 'No reason given'],
        skipRateLimit: true,
      }),
    })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
    })
    .catch(function() {
      status.textContent = 'Network error. Please message us on WhatsApp directly.';
      status.className = 'form-status error';
      btn.disabled = false;
      btn.textContent = 'Request Reschedule →';
    });
  });
})();
</script>

</body>
</html>
