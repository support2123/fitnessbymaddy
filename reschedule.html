<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your missed coaching session.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --success: #4CAF50;
      --error: #E53935;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .info-card {
      background: var(--sand);
      border-left: 3px solid var(--gold);
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--mid-grey);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .time-slot {
      padding: 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      font-weight: 500;
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center;
      padding: 12px;
      border-radius: 2px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: #E8F5E9; color: var(--success); }
    .status-msg.error { display: block; background: #FFEBEE; color: var(--error); }
    .required::after { content: ' *'; color: var(--error); }
  </style>
</head>
<body>

<div class="form-header">
  <h1>RESCHEDULE SESSION</h1>
  <p>Pick a new time for your missed coaching session</p>
</div>

<div class="form-container">
  <div class="info-card">
    Life happens — no stress! Just pick a new date and preferred time below.
    We'll confirm your slot within 24 hours via WhatsApp.
  </div>

  <form id="rescheduleForm" novalidate>
    <input type="hidden" id="clientId" name="client_id">

    <div class="form-section-title">YOUR DETAILS</div>
    <div class="field">
      <label class="required">Your Name</label>
      <input type="text" name="name" required placeholder="Your full name">
    </div>
    <div class="field">
      <label class="required">WhatsApp Number</label>
      <input type="tel" name="phone" required placeholder="+91 98765 43210">
    </div>

    <div class="form-section-title" style="margin-top:28px">PREFERRED DATE & TIME</div>
    <div class="field">
      <label class="required">Preferred Date</label>
      <input type="date" name="preferred_date" required id="dateInput">
    </div>

    <label style="display:block; font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--mid-grey); margin-bottom:10px;" class="required">Preferred Time Slot</label>
    <div class="time-slots" id="timeSlots">
      <div class="time-slot" data-time="7:00 AM">7:00 AM</div>
      <div class="time-slot" data-time="8:00 AM">8:00 AM</div>
      <div class="time-slot" data-time="9:00 AM">9:00 AM</div>
      <div class="time-slot" data-time="10:00 AM">10:00 AM</div>
      <div class="time-slot" data-time="5:00 PM">5:00 PM</div>
      <div class="time-slot" data-time="6:00 PM">6:00 PM</div>
      <div class="time-slot" data-time="7:00 PM">7:00 PM</div>
      <div class="time-slot" data-time="8:00 PM">8:00 PM</div>
    </div>
    <input type="hidden" name="preferred_time" id="selectedTime">

    <div class="field">
      <label>Reason for Rescheduling (optional)</label>
      <textarea name="reason" placeholder="Let us know so we can accommodate better next time..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.getElementById('dateInput');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];
  var maxDate = new Date();
  maxDate.setDate(maxDate.getDate() + 14);
  dateInput.max = maxDate.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.dataset.time;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    var time = document.getElementById('selectedTime').value;
    if (!time) {
      var msg = document.getElementById('statusMsg');
      msg.className = 'status-msg error';
      msg.textContent = 'Please select a preferred time slot.';
      return;
    }

    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.className = 'status-msg';

    var data = Object.fromEntries(new FormData(this));

    try {
      var res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...data,
          reschedule: true,
        }),
      });

      if (res.ok) {
        msg.className = 'status-msg success';
        msg.textContent = 'Reschedule request submitted! We\'ll confirm your new slot on WhatsApp within 24 hours.';
        btn.textContent = 'SUBMITTED ✓';
      } else {
        throw new Error('Failed');
      }
    } catch (err) {
      msg.className = 'status-msg error';
      msg.textContent = 'Something went wrong. Please message us directly on WhatsApp.';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    }
  });
</script>
</body>
</html>
