<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .resched-wrap { max-width: 520px; margin: 0 auto; padding: 40px 24px 80px; }
    .resched-header { text-align: center; margin-bottom: 48px; }
    .resched-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 12px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    .required::after { content: ' *'; color: var(--gold); }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .time-slot {
      padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s;
      color: var(--charcoal); background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: var(--charcoal); color: white; }
    @media (max-width: 600px) {
      .resched-form { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="resched-wrap">
    <div class="resched-header">
      <p class="hero-eyebrow" style="animation:none;opacity:1;">Session Management</p>
      <h1 style="font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,44px);font-weight:300;color:var(--charcoal);">Reschedule <em style="color:var(--gold);font-style:italic;">Session</em></h1>
      <p style="color:var(--mid-grey);font-size:15px;margin-top:12px;">Life happens. Let's find a new time that works.</p>
    </div>

    <form id="rescheduleForm" class="resched-form">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label class="form-label required">Your Phone Number</label>
        <input type="tel" class="form-input" name="phone" placeholder="+91 98765 43210" required>
      </div>

      <div class="form-group">
        <label class="form-label required">Preferred New Date</label>
        <input type="date" class="form-input" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label required">Preferred Time Slot</label>
        <div class="time-slots">
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="11:00">11:00 AM</div>
          <div class="time-slot" data-time="14:00">2:00 PM</div>
          <div class="time-slot" data-time="16:00">4:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="selectedTime" required>
      </div>

      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>

      <div id="formError" class="error-msg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>

    <div id="successMsg" class="success-msg">
      <h2>Request Received!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var dateInput = document.querySelector('input[name="preferred_date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.dataset.time;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');

    if (!document.getElementById('selectedTime').value) {
      errEl.textContent = 'Please select a time slot.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    errEl.style.display = 'none';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        text: 'Reschedule request from ' + data.phone + ' for ' + data.preferred_date + ' at ' + data.preferred_time + (data.reason ? '. Reason: ' + data.reason : ''),
      }),
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      errEl.textContent = 'Network error. Please try again or message us on WhatsApp.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    });
  });
})();
</script>

</body>
</html>
