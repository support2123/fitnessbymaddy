<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form {
      background: white;
      padding: 48px 36px;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 18px; background: var(--charcoal);
      color: white; border: none; font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      text-align: center; padding: 60px 20px; display: none;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px;
      font-weight: 400; color: var(--charcoal); margin-bottom: 16px;
    }
    .success-msg p { font-size: 16px; color: var(--mid-grey); line-height: 1.7; }
    @media (max-width: 600px) { .reschedule-form { padding: 32px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-wrap">
    <div class="reschedule-header">
      <p class="section-eyebrow">Session Management</p>
      <h1 class="section-title">Reschedule <em>Session</em></h1>
      <p class="section-body" style="margin:0 auto">Need to move your Zoom session? Pick a new time below.</p>
    </div>

    <form class="reschedule-form" id="rescheduleForm">
      <div class="form-group">
        <label class="form-label" for="name">Your Name *</label>
        <input class="form-input" type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">WhatsApp Number *</label>
        <input class="form-input" type="tel" id="phone" name="phone" placeholder="+91..." required>
      </div>
      <div class="form-group">
        <label class="form-label" for="preferredDate">Preferred Date *</label>
        <input class="form-input" type="date" id="preferredDate" name="preferred_date" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="preferredTime">Preferred Time Slot</label>
        <select class="form-select" id="preferredTime" name="preferred_time">
          <option value="">Select</option>
          <option value="morning">Morning (7am - 11am IST)</option>
          <option value="afternoon">Afternoon (12pm - 4pm IST)</option>
          <option value="evening">Evening (5pm - 9pm IST)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="reason">Reason (optional)</label>
        <textarea class="form-textarea" id="reason" name="reason" placeholder="Let us know why you need to reschedule..."></textarea>
      </div>
      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Request Received!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('preferredDate').setAttribute('min', today);

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      preferred_date: document.getElementById('preferredDate').value,
      preferred_time: document.getElementById('preferredTime').value,
      reason: document.getElementById('reason').value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        type: 'text',
        text: 'Reschedule request from ' + data.name + ' (' + data.phone + ')\nDate: ' + data.preferred_date + '\nTime: ' + data.preferred_time + '\nReason: ' + (data.reason || 'Not specified'),
        forceOverrideRateLimit: true
      })
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Network error. Please try again.');
    });
  });
})();
</script>

</body>
</html>
