<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --red: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 20px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 36px;
      letter-spacing: 3px;
    }
    .form-header p {
      color: #aaa;
      font-size: 14px;
      margin-top: 6px;
    }
    .form-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .field { margin-bottom: 22px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      background: white;
      color: var(--charcoal);
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .field-hint {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .time-slot {
      padding: 14px;
      background: white;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      font-weight: 500;
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected {
      border-color: var(--gold);
      background: var(--gold);
      color: white;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .success-msg p {
      color: var(--mid-grey);
      margin-top: 10px;
      font-size: 15px;
    }
    .error-msg {
      background: #fdeaea;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Reschedule Session</h1>
    <p>Missed a session? No worries — pick a new time below.</p>
  </div>

  <div class="form-wrap">
    <div class="error-msg" id="error"></div>

    <form id="rescheduleForm">
      <div class="field">
        <label>Your Phone Number *</label>
        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="date" required id="dateInput">
      </div>

      <div class="field">
        <label>Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="time" id="timeInput">
      </div>

      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Why are you rescheduling?"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="success-msg" id="success">
      <h2>Request Sent!</h2>
      <p>We'll confirm your rescheduled session on WhatsApp within a few hours.</p>
    </div>
  </div>

  <script>
    // Set min date to tomorrow
    var dateInput = document.getElementById('dateInput');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    // Time slot selection
    var selectedTime = '';
    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTime = slot.getAttribute('data-time');
        document.getElementById('timeInput').value = selectedTime;
      });
    });

    var form = document.getElementById('rescheduleForm');
    var errorEl = document.getElementById('error');
    var successEl = document.getElementById('success');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!selectedTime) {
        errorEl.textContent = 'Please select a time slot.';
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      var data = {
        phone: form.phone.value.trim(),
        date: form.date.value,
        time: selectedTime,
        reason: form.reason.value.trim()
      };

      // Send as WhatsApp message to Maddy's team
      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '917082478374',
          message: 'Reschedule Request:\nClient: ' + data.phone + '\nDate: ' + data.date + '\nTime: ' + data.time + '\nReason: ' + (data.reason || 'Not provided'),
          bypass_rate_limit: true
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        form.style.display = 'none';
        successEl.style.display = 'block';
      })
      .catch(function(err) {
        errorEl.textContent = 'Something went wrong. Please message us directly on WhatsApp.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'REQUEST RESCHEDULE';
      });
    });
  </script>
</body>
</html>
