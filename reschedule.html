<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your missed or upcoming session.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 540px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-page-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 48px); font-weight: 300; line-height: 1.1; color: var(--charcoal); margin-bottom: 8px; }
    .form-page-title em { font-style: italic; color: var(--gold); }
    .form-page-sub { font-size: 15px; color: var(--mid-grey); margin-bottom: 40px; line-height: 1.6; }
    .form-textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none; resize: vertical; min-height: 80px; }
    .form-textarea:focus { border-color: var(--gold); }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 24px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 20px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { background: #fef2f2; color: #b91c1c; padding: 12px 16px; border-radius: 2px; font-size: 13px; margin-bottom: 16px; display: none; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .slot-btn { padding: 12px 8px; border: 1.5px solid var(--light-grey); border-radius: 2px; background: white; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); cursor: pointer; text-align: center; transition: all 0.2s; }
    .slot-btn:hover { border-color: var(--gold); }
    .slot-btn.selected { border-color: var(--gold); background: var(--gold); color: white; }
    @media (max-width: 400px) { .slot-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <p class="hero-eyebrow" style="margin-bottom:16px">Reschedule</p>
    <h1 class="form-page-title">Pick a <em>New Slot</em></h1>
    <p class="form-page-sub">Life happens. Pick a new time that works for you, and we'll get you back on track.</p>

    <div class="form-error" id="formError"></div>

    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input class="form-input" type="text" name="name" required>
      </div>

      <div class="form-group">
        <label class="form-label">WhatsApp Number</label>
        <input class="form-input" type="tel" name="phone" required placeholder="+91...">
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date</label>
        <input class="form-input" type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot (IST)</label>
        <div class="slot-grid" id="slotGrid">
          <button type="button" class="slot-btn" data-slot="7:00 AM">7:00 AM</button>
          <button type="button" class="slot-btn" data-slot="8:00 AM">8:00 AM</button>
          <button type="button" class="slot-btn" data-slot="9:00 AM">9:00 AM</button>
          <button type="button" class="slot-btn" data-slot="10:00 AM">10:00 AM</button>
          <button type="button" class="slot-btn" data-slot="5:00 PM">5:00 PM</button>
          <button type="button" class="slot-btn" data-slot="6:00 PM">6:00 PM</button>
          <button type="button" class="slot-btn" data-slot="7:00 PM">7:00 PM</button>
          <button type="button" class="slot-btn" data-slot="8:00 PM">8:00 PM</button>
          <button type="button" class="slot-btn" data-slot="9:00 PM">9:00 PM</button>
        </div>
        <input type="hidden" name="preferred_time" id="selectedSlot" required>
      </div>

      <div class="form-group">
        <label class="form-label">Reason for rescheduling (optional)</label>
        <textarea class="form-textarea" name="reason" placeholder="Travel, work conflict, not feeling well..."></textarea>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
    </form>

    <div class="form-success" id="successMsg" style="display:none">
      <h2>Reschedule requested!</h2>
      <p>We'll confirm your new slot on WhatsApp within a few hours.</p>
    </div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var today = new Date();
  today.setDate(today.getDate() + 1);
  var dateInput = document.querySelector('input[name="preferred_date"]');
  dateInput.min = today.toISOString().split('T')[0];

  document.getElementById('slotGrid').addEventListener('click', function(e) {
    var btn = e.target.closest('.slot-btn');
    if (!btn) return;
    document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    document.getElementById('selectedSlot').value = btn.dataset.slot;
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');

    if (!document.getElementById('selectedSlot').value) {
      errEl.textContent = 'Please select a time slot';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    errEl.style.display = 'none';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errEl.textContent = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
    });
  });
})();
</script>
</body>
</html>
