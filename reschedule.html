<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your Zoom session with Fitness by Maddy.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-page { padding-top: 72px; min-height: 100vh; background: var(--cream); }
    .reschedule-header { background: var(--charcoal); padding: 60px 24px; text-align: center; }
    .reschedule-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: white; margin-bottom: 8px; }
    .reschedule-header h1 em { color: var(--gold); font-style: italic; }
    .reschedule-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
    .reschedule-form { max-width: 480px; margin: -30px auto 60px; background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); position: relative; z-index: 2; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-label .req { color: var(--gold); }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot input { position: absolute; opacity: 0; }
    .time-slot label {
      display: block; padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 13px; text-align: center; cursor: pointer; transition: all 0.3s; color: var(--mid-grey);
    }
    .time-slot input:checked + label { border-color: var(--gold); color: var(--charcoal); background: rgba(184,150,90,0.08); }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 48px 24px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    @media (max-width: 600px) {
      .reschedule-form { margin: -20px 16px 40px; padding: 32px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="reschedule-page">
  <div class="reschedule-header">
    <h1>Reschedule Your <em>Session</em></h1>
    <p>Pick a new time that works for you</p>
  </div>

  <div class="reschedule-form" id="rescheduleFormWrap">
    <form id="rescheduleForm">
      <div class="form-group">
        <label class="form-label">Your Name <span class="req">*</span></label>
        <input type="text" class="form-input" name="name" required>
      </div>

      <div class="form-group">
        <label class="form-label">WhatsApp Number <span class="req">*</span></label>
        <input type="tel" class="form-input" name="phone" placeholder="+91..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Date <span class="req">*</span></label>
        <input type="date" class="form-input" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot <span class="req">*</span></label>
        <div class="time-slots">
          <div class="time-slot"><input type="radio" name="time_slot" id="ts1" value="9:00 AM" required><label for="ts1">9:00 AM</label></div>
          <div class="time-slot"><input type="radio" name="time_slot" id="ts2" value="11:00 AM"><label for="ts2">11:00 AM</label></div>
          <div class="time-slot"><input type="radio" name="time_slot" id="ts3" value="2:00 PM"><label for="ts3">2:00 PM</label></div>
          <div class="time-slot"><input type="radio" name="time_slot" id="ts4" value="4:00 PM"><label for="ts4">4:00 PM</label></div>
          <div class="time-slot"><input type="radio" name="time_slot" id="ts5" value="6:00 PM"><label for="ts5">6:00 PM</label></div>
          <div class="time-slot"><input type="radio" name="time_slot" id="ts6" value="8:00 PM"><label for="ts6">8:00 PM</label></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Reason for rescheduling</label>
        <textarea class="form-textarea" name="reason" placeholder="Optional — helps us plan better"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Request Sent!</h2>
    <p>We'll confirm your new slot via WhatsApp within a few hours. Thanks for letting us know!</p>
  </div>
</div>

<script>
(function() {
  var dateInput = document.querySelector('input[name="preferred_date"]');
  var today = new Date();
  today.setDate(today.getDate() + 1);
  dateInput.min = today.toISOString().split('T')[0];

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '917082478374',
        message: 'Reschedule request from ' + data.name + ' (' + data.phone + '): ' +
                 data.preferred_date + ' at ' + data.time_slot +
                 (data.reason ? ' — Reason: ' + data.reason : ''),
      }),
    })
    .then(function() {
      document.getElementById('rescheduleFormWrap').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Something went wrong. Please message us on WhatsApp instead.');
    });
  });
})();
</script>

</body>
</html>
