<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session — Fitness by Maddy</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .reschedule-page { padding-top: 72px; min-height: 100vh; background: var(--cream); }
    .reschedule-container { max-width: 520px; margin: 0 auto; padding: 48px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-header .section-eyebrow { margin-bottom: 12px; }
    .reschedule-header .section-title { font-size: 36px; margin-bottom: 12px; }
    .reschedule-header p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .reschedule-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-submit { width: 100%; margin-top: 12px; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px 8px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      text-align: center; font-size: 13px; cursor: pointer; transition: all 0.2s;
      background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    @media (max-width: 600px) { .reschedule-form { padding: 24px; } .time-slots { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Fitness by Maddy</a>
    <ul class="nav-links"><li><a href="/">Home</a></li></ul>
  </nav>

  <div class="reschedule-page">
    <div class="reschedule-container">
      <div class="reschedule-header">
        <p class="section-eyebrow">Zoom Session</p>
        <h1 class="section-title">Reschedule <em>Session</em></h1>
        <p>Pick a new date and time that works for you.</p>
      </div>

      <form class="reschedule-form" id="rescheduleForm">
        <div class="form-group">
          <label class="form-label" for="name">Your Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email *</label>
          <input class="form-input" type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="date">Preferred Date *</label>
          <input class="form-input" type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time (IST) *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
            <div class="time-slot" data-time="21:00">9:00 PM</div>
          </div>
          <input type="hidden" id="selectedTime" name="time" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reason">Reason (optional)</label>
          <textarea class="form-input" id="reason" name="reason" placeholder="Let us know why you're rescheduling..."></textarea>
        </div>

        <button type="submit" class="btn-primary form-submit">Request Reschedule</button>
      </form>

      <div class="form-success" id="successMsg">
        <h2>Request Received!</h2>
        <p>We'll confirm your new time on WhatsApp within a few hours.</p>
      </div>
    </div>
  </div>

  <script>
    var selectedTime = null;
    document.querySelectorAll('.time-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
        slot.classList.add('selected');
        selectedTime = slot.dataset.time;
        document.getElementById('selectedTime').value = selectedTime;
      });
    });

    var dateInput = document.getElementById('date');
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedTime) { alert('Please select a time slot.'); return; }

      var form = e.target;
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var params = new URLSearchParams(window.location.search);
      var data = {
        client_id: params.get('c'),
        name: form.name.value,
        email: form.email.value,
        date: form.date.value,
        time: selectedTime,
        reason: form.reason.value || null
      };

      try {
        var res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead_id: data.client_id, name: data.name, email: data.email, reschedule: data })
        });

        form.style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
