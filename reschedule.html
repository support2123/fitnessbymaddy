<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--black); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 32px 24px;
      background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--charcoal); letter-spacing: 1px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.2s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 60px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>RESCHEDULE SESSION</h1>
    <p>Life happens — let's find a better time for you</p>
  </div>

  <div class="form-container" id="formContainer">
    <form id="rescheduleForm">
      <div class="form-section-title">RESCHEDULE REQUEST</div>
      <div class="field">
        <label>Your Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label>Email or Phone *</label>
        <input type="text" name="contact" required placeholder="So we can confirm your new slot">
      </div>
      <div class="field">
        <label>Original Session Date</label>
        <input type="date" name="original_date">
      </div>
      <div class="field">
        <label>Preferred New Date *</label>
        <input type="date" name="preferred_date" required>
      </div>
      <div class="field">
        <label>Preferred Time Slot</label>
        <select name="time_slot">
          <option value="morning">Morning (7am - 11am IST)</option>
          <option value="afternoon">Afternoon (12pm - 4pm IST)</option>
          <option value="evening" selected>Evening (5pm - 9pm IST)</option>
        </select>
      </div>
      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Helps us plan better for you"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>REQUEST SENT!</h2>
    <p>We'll confirm your new session time within 24 hours via WhatsApp. Keep an eye on your messages!</p>
  </div>

  <script>
    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...data, type: 'reschedule' })
        });

        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
