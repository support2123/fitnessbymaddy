<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header { background: var(--charcoal); padding: 40px 24px; text-align: center; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold-light); letter-spacing: 3px; margin-bottom: 8px; }
    .form-header p { font-size: 14px; color: rgba(255,255,255,0.6); }

    .form-container { max-width: 520px; margin: -20px auto 40px; padding: 0 16px; }
    .form-card { background: white; border-radius: 8px; padding: 32px 28px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }

    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      color: var(--gold); margin: 24px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .required::after { content: ' *'; color: var(--error); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 10px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 13px; cursor: pointer;
      transition: all 0.2s; background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 4px;
      transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status { text-align: center; padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 14px; display: none; }
    .status.error { display: block; background: #fdeaea; color: var(--error); }
    .status.success { display: block; background: #eafde7; color: var(--success); }

    .info-box {
      background: var(--sand); border-radius: 4px; padding: 16px; margin-bottom: 24px;
      font-size: 13px; color: var(--mid-grey); line-height: 1.6;
    }

    .brand-footer { text-align: center; padding: 24px; font-size: 12px; color: var(--mid-grey); }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>FITNESS BY MADDY</h1>
    <p>Reschedule Your Session</p>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="info-box">
        Life happens! Pick a new date and time that works for you. We allow up to 2 reschedules per month.
      </div>

      <form id="rescheduleForm">
        <input type="hidden" id="client_id" name="client_id">

        <div class="form-section-title">YOUR DETAILS</div>

        <div class="field">
          <label class="required">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXX XXXXX">
        </div>

        <div class="form-section-title">NEW SESSION TIME</div>

        <div class="field">
          <label class="required">Preferred Date</label>
          <input type="date" id="preferred_date" name="preferred_date" required>
        </div>

        <div class="field">
          <label class="required">Preferred Time Slot</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
            <div class="time-slot" data-time="21:00">9:00 PM</div>
          </div>
          <input type="hidden" id="selected_time" name="preferred_time" required>
        </div>

        <div class="field">
          <label>Reason for Rescheduling</label>
          <select id="reason" name="reason">
            <option value="">Select reason (optional)</option>
            <option value="work">Work conflict</option>
            <option value="health">Feeling unwell</option>
            <option value="travel">Traveling</option>
            <option value="personal">Personal commitment</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label>Additional Notes</label>
          <textarea id="notes" name="notes" placeholder="Anything else we should know..."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Request Reschedule</button>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <div class="brand-footer">fitnessbymaddy.com</div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      if (clientId) document.getElementById('client_id').value = clientId;

      var today = new Date();
      today.setDate(today.getDate() + 1);
      document.getElementById('preferred_date').min = today.toISOString().split('T')[0];

      var slots = document.querySelectorAll('.time-slot');
      slots.forEach(function(slot) {
        slot.addEventListener('click', function() {
          slots.forEach(function(s) { s.classList.remove('selected'); });
          this.classList.add('selected');
          document.getElementById('selected_time').value = this.getAttribute('data-time');
        });
      });

      document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var selectedTime = document.getElementById('selected_time').value;
        if (!selectedTime) {
          var status = document.getElementById('status');
          status.className = 'status error';
          status.textContent = 'Please select a time slot.';
          return;
        }

        var btn = document.getElementById('submitBtn');
        var status = document.getElementById('status');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';
        status.className = 'status';
        status.style.display = 'none';

        var data = {
          client_id: document.getElementById('client_id').value,
          phone: document.getElementById('phone').value,
          preferred_date: document.getElementById('preferred_date').value,
          preferred_time: selectedTime,
          reason: document.getElementById('reason').value,
          notes: document.getElementById('notes').value,
        };

        fetch('/api/send-whatsapp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: '+917082478374',
            type: 'freeform',
            message: 'Reschedule request from ' + data.phone + ': ' + data.preferred_date + ' at ' + data.preferred_time + '. Reason: ' + (data.reason || 'N/A'),
          }),
        })
        .then(function() {
          status.className = 'status success';
          status.textContent = 'Reschedule request sent! We\'ll confirm your new slot shortly on WhatsApp.';
          btn.textContent = 'REQUEST SENT';
        })
        .catch(function() {
          status.className = 'status error';
          status.textContent = 'Something went wrong. Please message us on WhatsApp instead.';
          btn.disabled = false;
          btn.textContent = 'REQUEST RESCHEDULE';
        });
      });
    })();
  </script>
</body>
</html>
