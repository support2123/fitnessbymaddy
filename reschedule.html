<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">
  <div class="form-container">
    <div class="form-header">
      <a class="nav-logo" href="index.html">Fitness by Maddy</a>
      <h1 class="form-title">Reschedule Session</h1>
      <p class="form-subtitle">Life happens — pick a new time that works for you.</p>
    </div>

    <form id="rescheduleForm" class="brand-form">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-section">
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input type="text" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Which session are you rescheduling? *</label>
          <select name="session_type" class="form-input" required>
            <option value="">Select</option>
            <option value="zoom_1on1">1-on-1 Zoom Session</option>
            <option value="zoom_trial">Trial Zoom Session</option>
            <option value="checkin_call">Check-In Call</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Original Date</label>
          <input type="date" name="original_date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Preferred New Date *</label>
          <input type="date" name="new_date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Time *</label>
          <select name="new_time" class="form-input" required>
            <option value="">Select time slot</option>
            <option value="06:00">6:00 AM</option>
            <option value="07:00">7:00 AM</option>
            <option value="08:00">8:00 AM</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="14:00">2:00 PM</option>
            <option value="15:00">3:00 PM</option>
            <option value="16:00">4:00 PM</option>
            <option value="17:00">5:00 PM</option>
            <option value="18:00">6:00 PM</option>
            <option value="19:00">7:00 PM</option>
            <option value="20:00">8:00 PM</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea name="reason" class="form-input form-textarea" rows="2" placeholder="No pressure — just helps us plan better"></textarea>
        </div>
      </div>

      <button type="submit" class="btn-primary form-submit">Request Reschedule</button>
      <div id="formMessage" class="form-message"></div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    if (clientId) document.getElementById('clientId').value = clientId;

    const dateInputs = document.querySelectorAll('input[type="date"]');
    const today = new Date().toISOString().split('T')[0];
    dateInputs.forEach(input => input.min = today);

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.form-submit');
      const msg = document.getElementById('formMessage');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/reschedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (res.ok) {
          msg.className = 'form-message success';
          msg.textContent = 'Reschedule request submitted! We\'ll confirm your new time on WhatsApp.';
          this.reset();
        } else {
          throw new Error(result.error || 'Request failed');
        }
      } catch (err) {
        msg.className = 'form-message error';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Request Reschedule';
      }
    });
  </script>
</body>
</html>
