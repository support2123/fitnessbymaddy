<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <meta name="description" content="Reschedule your missed session with Maddy.">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="form-page">
  <div class="form-header">
    <div class="form-brand">Fitness by Maddy</div>
    <div class="form-title">RESCHEDULE SESSION</div>
    <div class="form-subtitle">Missed a session? No worries — pick a new time that works for you.</div>
  </div>

  <form id="rescheduleForm" class="form-card">
    <div class="field">
      <label class="field-label field-required">Your Name</label>
      <input class="field-input" type="text" name="name" placeholder="Full name" required>
    </div>

    <div class="field">
      <label class="field-label field-required">Phone (WhatsApp)</label>
      <input class="field-input" type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required>
    </div>

    <div class="field">
      <label class="field-label field-required">Preferred Date</label>
      <input class="field-input" type="date" name="preferred_date" required>
    </div>

    <div class="field">
      <label class="field-label field-required">Preferred Time (IST)</label>
      <select class="field-input" name="preferred_time" required>
        <option value="">Select a time slot</option>
        <option value="07:00">7:00 AM</option>
        <option value="08:00">8:00 AM</option>
        <option value="09:00">9:00 AM</option>
        <option value="10:00">10:00 AM</option>
        <option value="11:00">11:00 AM</option>
        <option value="16:00">4:00 PM</option>
        <option value="17:00">5:00 PM</option>
        <option value="18:00">6:00 PM</option>
        <option value="19:00">7:00 PM</option>
        <option value="20:00">8:00 PM</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Reason for Rescheduling</label>
      <textarea class="field-input" name="reason" placeholder="Optional — let us know why you need to reschedule" rows="2"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
  </form>

  <div class="form-footer">You'll receive a confirmation on WhatsApp within 24 hours.</div>

  <div class="success-state" id="successState">
    <div class="success-icon">&#128197;</div>
    <div class="success-title">REQUEST SENT!</div>
    <div class="success-text">We've received your reschedule request. Maddy's team will confirm your new time slot on WhatsApp.</div>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('rescheduleForm');
  var btn = document.getElementById('submitBtn');

  // Set min date to today
  var dateInput = form.querySelector('[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'SENDING...';

    var data = {};
    var formData = new FormData(form);
    formData.forEach(function(value, key) { data[key] = value; });

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ type: 'reschedule' }, data))
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successState').classList.add('visible');
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Network error. Please try again.');
    });
  });
})();
</script>

</body>
</html>
