<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 620px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; text-align: center; border: 1.5px solid var(--light-grey); border-radius: 2px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .time-slot:hover, .time-slot.selected { border-color: var(--gold); background: var(--gold); color: white; }
    .success-msg { text-align: center; padding: 60px 24px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Need to Reschedule?</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="margin:0 auto">No worries — just choose a slot that works better for you.</p>
    </div>
    <div class="form-card" id="rescheduleForm">
      <form id="reschedule" onsubmit="submitReschedule(event)">
        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input class="form-input" type="date" name="date" required>
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
            <div class="time-slot" data-time="21:00">9:00 PM</div>
          </div>
          <input type="hidden" name="time" id="selectedTime" required>
        </div>
        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea class="form-textarea" name="reason" placeholder="E.g., work meeting conflict, travel..."></textarea>
        </div>
        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>
    <div class="success-msg" id="successMsg">
      <h2>Request Sent!</h2>
      <p>We'll confirm your new session time on WhatsApp shortly.</p>
      <p style="margin-top:24px"><a href="index.html" style="color:var(--gold)">← Back to Home</a></p>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('.time-slot').forEach(function(slot) {
  slot.addEventListener('click', function() {
    document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
    slot.classList.add('selected');
    document.getElementById('selectedTime').value = slot.dataset.time;
  });
});

async function submitReschedule(e) {
  e.preventDefault();
  if (!document.getElementById('selectedTime').value) {
    alert('Please select a time slot');
    return;
  }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  var form = document.getElementById('reschedule');
  var data = Object.fromEntries(new FormData(form));
  data.client_id = new URLSearchParams(window.location.search).get('c');
  try {
    var res = await fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: '+917082478374',
        template_name: 'reschedule_request',
        params: { templateParams: [data.client_id, data.date, data.time, data.reason || 'No reason given'] }
      })
    });
    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    btn.textContent = 'Error — Try Again';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
