<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-wrap {
      min-height: 100vh;
      padding: 100px 24px 60px;
      max-width: 540px;
      margin: 0 auto;
    }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form {
      background: white;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color 0.3s;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group select { appearance: none; }
    .time-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .time-slot {
      padding: 12px 8px;
      text-align: center;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 13px;
      color: var(--charcoal);
      cursor: pointer;
      transition: all 0.3s;
      background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }
    .form-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 8px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      text-align: center;
      padding: 40px;
      display: none;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--charcoal);
      margin-bottom: 16px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.7; }
    @media (max-width: 500px) {
      .time-slots { grid-template-columns: repeat(2, 1fr); }
      .reschedule-form { padding: 24px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="reschedule-wrap">
  <div class="reschedule-header">
    <p class="section-eyebrow">Session Management</p>
    <h1 class="section-title">Reschedule <em>Session</em></h1>
    <p class="section-body" style="margin:0 auto">Life happens. Pick a new time that works for you.</p>
  </div>

  <form class="reschedule-form" id="rescheduleForm">
    <div class="form-group">
      <label for="clientPhone">Your WhatsApp Number</label>
      <input type="tel" id="clientPhone" placeholder="+91..." required>
    </div>

    <div class="form-group">
      <label for="newDate">Preferred Date</label>
      <input type="date" id="newDate" required>
    </div>

    <div class="form-group">
      <label>Preferred Time Slot</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="06:00">6:00 AM</div>
        <div class="time-slot" data-time="07:00">7:00 AM</div>
        <div class="time-slot" data-time="08:00">8:00 AM</div>
        <div class="time-slot" data-time="09:00">9:00 AM</div>
        <div class="time-slot" data-time="10:00">10:00 AM</div>
        <div class="time-slot" data-time="11:00">11:00 AM</div>
        <div class="time-slot" data-time="16:00">4:00 PM</div>
        <div class="time-slot" data-time="17:00">5:00 PM</div>
        <div class="time-slot" data-time="18:00">6:00 PM</div>
        <div class="time-slot" data-time="19:00">7:00 PM</div>
        <div class="time-slot" data-time="20:00">8:00 PM</div>
        <div class="time-slot" data-time="21:00">9:00 PM</div>
      </div>
      <input type="hidden" id="selectedTime">
    </div>

    <div class="form-group">
      <label for="reason">Reason (optional)</label>
      <textarea id="reason" placeholder="Travel, work commitment, not feeling well..."></textarea>
    </div>

    <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>Reschedule Requested</h2>
    <p>We'll confirm your new session time on WhatsApp within a few hours.</p>
  </div>
</div>

<script>
(function() {
  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('newDate').min = today.toISOString().split('T')[0];

  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      this.classList.add('selected');
      document.getElementById('selectedTime').value = this.dataset.time;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var time = document.getElementById('selectedTime').value;
    if (!time) { alert('Please select a time slot.'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'REQUESTING...';

    var payload = {
      phone: document.getElementById('clientPhone').value,
      new_date: document.getElementById('newDate').value,
      new_time: time,
      reason: document.getElementById('reason').value,
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer internal',
      },
      body: JSON.stringify({
        phone: '+917082478374',
        type: 'text',
        text: 'Reschedule request from ' + payload.phone +
              ' — New date: ' + payload.new_date +
              ' at ' + payload.new_time +
              (payload.reason ? ' — Reason: ' + payload.reason : ''),
      }),
    })
    .then(function() {
      document.getElementById('rescheduleForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'REQUEST RESCHEDULE';
      alert('Network error. Please try again or message us on WhatsApp.');
    });
  });
})();
</script>

</body>
</html>
