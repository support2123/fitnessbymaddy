<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: #D4AF7A;
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D4AF7A;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      background: #1A1A1A;
      border: 1px solid #333;
      border-radius: 4px;
      color: #FFF;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #D4AF7A;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .time-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .time-slot {
      padding: 12px;
      background: #1A1A1A;
      border: 1px solid #333;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .time-slot:hover {
      border-color: #D4AF7A;
    }
    .time-slot.selected {
      border-color: #D4AF7A;
      background: rgba(212, 175, 122, 0.1);
      color: #D4AF7A;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: #D4AF7A;
      color: #0A0A0A;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 20px;
    }
    .btn-submit:hover {
      background: #B8965A;
    }
    .btn-submit:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #D4AF7A;
      margin-bottom: 12px;
    }
    .success-msg p {
      color: #888;
      font-size: 14px;
    }
    .brand-footer {
      text-align: center;
      margin-top: 40px;
      font-size: 11px;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>RESCHEDULE SESSION</h1>
      <p>Missed a session? Pick a new time and we'll get you back on track.</p>
    </div>

    <form id="rescheduleForm">
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label>Preferred Date</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label>Preferred Time Slot</label>
        <div class="time-slots">
          <div class="time-slot" data-time="06:00">6:00 AM</div>
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
        </div>
        <input type="hidden" name="preferred_time" id="timeInput" required>
      </div>

      <div class="form-group">
        <label>Reason for Reschedule (optional)</label>
        <textarea name="reason" placeholder="Work conflict, feeling unwell, travel..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new slot on WhatsApp shortly.</p>
    </div>

    <div class="brand-footer">Fitness by Maddy</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('clientId').value = params.get('c') || '';

    document.querySelectorAll('.time-slot').forEach(slot => {
      slot.addEventListener('click', function() {
        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
        this.classList.add('selected');
        document.getElementById('timeInput').value = this.dataset.time;
      });
    });

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');

      if (!document.getElementById('timeInput').value) {
        alert('Please select a time slot');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById('rescheduleForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
