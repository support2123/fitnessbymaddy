<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 24px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #B8965A; text-align: center; letter-spacing: 4px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 40px; }
    .form-section { margin-bottom: 32px; }
    .form-section h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #B8965A; letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #333; }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #999; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; background: #2a2a2a; border: 1.5px solid #333;
      border-radius: 4px; color: #fff; font-size: 15px; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #B8965A; }
    .field textarea { resize: vertical; min-height: 80px; }
    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .time-slot {
      padding: 14px; background: #2a2a2a; border: 1.5px solid #333; border-radius: 4px;
      text-align: center; cursor: pointer; transition: all 0.3s; font-size: 14px;
    }
    .time-slot:hover { border-color: #B8965A; }
    .time-slot.selected { background: #B8965A; color: #1a1a1a; border-color: #B8965A; font-weight: 600; }
    .submit-btn {
      width: 100%; padding: 16px; background: #B8965A; color: #1a1a1a; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px;
      cursor: pointer; border-radius: 4px; transition: background 0.3s; margin-top: 24px;
    }
    .submit-btn:hover { background: #d4af7a; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #B8965A; margin-bottom: 12px; }
    .success-msg p { color: #aaa; font-size: 16px; line-height: 1.6; }
    .required::after { content: ' *'; color: #B8965A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FITNESS BY MADDY</div>
    <p class="subtitle">Reschedule Your Session</p>

    <form id="rescheduleForm">
      <div class="form-section">
        <h2>YOUR DETAILS</h2>
        <div class="field">
          <label class="required">Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label class="required">Phone</label>
          <input type="tel" name="phone" required>
        </div>
      </div>

      <div class="form-section">
        <h2>NEW DATE & TIME</h2>
        <div class="field">
          <label class="required">Preferred Date</label>
          <input type="date" name="date" required>
        </div>
        <div class="field">
          <label class="required">Preferred Time Slot (IST)</label>
          <div class="time-slots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
            <div class="time-slot" data-time="20:00">8:00 PM</div>
          </div>
          <input type="hidden" name="time" id="selectedTime" required>
        </div>
      </div>

      <div class="form-section">
        <h2>REASON</h2>
        <div class="field">
          <label>Why are you rescheduling? (optional)</label>
          <textarea name="reason" placeholder="Let us know so we can help..."></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>REQUEST RECEIVED!</h2>
      <p>We'll confirm your new session time on WhatsApp within a few hours. Keep showing up!</p>
    </div>
  </div>

  <script>
    const slots = document.querySelectorAll('.time-slot');
    const timeInput = document.getElementById('selectedTime');

    slots.forEach(slot => {
      slot.addEventListener('click', function() {
        slots.forEach(s => s.classList.remove('selected'));
        this.classList.add('selected');
        timeInput.value = this.dataset.time;
      });
    });

    const dateInput = document.querySelector('input[name="date"]');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!timeInput.value) { alert('Please select a time slot'); return; }

      const btn = this.querySelector('.submit-btn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const data = Object.fromEntries(new FormData(this));
      const params = new URLSearchParams(window.location.search);
      data.client_id = params.get('c');

      try {
        const res = await fetch('/api/send-whatsapp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: '+917082478374',
            templateName: 'reschedule_request',
            bodyValues: [data.name, data.date, data.time, data.reason || 'No reason given'],
          }),
        });

        this.style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'RETRY';
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
