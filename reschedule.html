<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF; --error: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); color: var(--white); padding: 40px 20px 32px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: var(--gold);
    }
    .form-header p { font-size: 14px; color: var(--sand); margin-top: 8px; max-width: 400px; margin-inline: auto; }

    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 32px 24px;
      background: var(--white); border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      border: 1.5px solid var(--light-grey); border-radius: 4px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s; background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { border-color: var(--gold); background: var(--gold); color: var(--white); }

    .btn-submit {
      width: 100%; padding: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 3px; background: var(--charcoal); color: var(--white);
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg { display: none; text-align: center; padding: 40px 24px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }

    .error-text { color: var(--error); font-size: 12px; margin-top: 4px; display: none; }

    @media (max-width: 500px) {
      .form-container { margin: -20px 12px 40px; padding: 24px 16px; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>RESCHEDULE SESSION</h1>
  <p>Life happens! Pick a new time that works for you.</p>
</div>

<div class="form-container" id="formContainer">
  <form id="rescheduleForm">
    <input type="hidden" id="clientId" name="client_id">

    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" name="name" required placeholder="Your name">
    </div>

    <div class="form-group">
      <label for="phone">WhatsApp Number *</label>
      <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
    </div>

    <div class="form-group">
      <label for="date">Preferred New Date *</label>
      <input type="date" id="date" name="preferred_date" required>
    </div>

    <div class="form-group">
      <label>Preferred Time Slot *</label>
      <div class="time-slots" id="timeSlots">
        <div class="time-slot" data-time="morning">Morning<br><small>7 - 10 AM</small></div>
        <div class="time-slot" data-time="midday">Midday<br><small>11 AM - 1 PM</small></div>
        <div class="time-slot" data-time="afternoon">Afternoon<br><small>2 - 5 PM</small></div>
        <div class="time-slot" data-time="evening">Evening<br><small>6 - 9 PM</small></div>
      </div>
      <input type="hidden" id="timeSlot" name="preferred_time" required>
    </div>

    <div class="form-group">
      <label for="reason">Reason for Rescheduling</label>
      <textarea id="reason" name="reason" placeholder="Optional — helps us plan better"></textarea>
    </div>

    <p class="error-text" id="errorMsg"></p>
    <button type="submit" class="btn-submit" id="submitBtn">CONFIRM RESCHEDULE</button>
  </form>
</div>

<div class="success-msg" id="successMsg">
  <h2>RESCHEDULED!</h2>
  <p>Your request has been received. Maddy's team will confirm the new time on WhatsApp.</p>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    if (clientId) document.getElementById('clientId').value = clientId;

    var today = new Date();
    today.setDate(today.getDate() + 1);
    document.getElementById('date').min = today.toISOString().split('T')[0];

    var selectedTime = '';
    var slots = document.querySelectorAll('.time-slot');
    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        slots.forEach(function(s) { s.classList.remove('selected'); });
        this.classList.add('selected');
        selectedTime = this.getAttribute('data-time');
        document.getElementById('timeSlot').value = selectedTime;
      });
    });

    var form = document.getElementById('rescheduleForm');
    var submitBtn = document.getElementById('submitBtn');
    var errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!selectedTime) {
        errorMsg.textContent = 'Please select a preferred time slot.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      errorMsg.style.display = 'none';

      var data = {
        client_id: document.getElementById('clientId').value || null,
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        preferred_date: document.getElementById('date').value,
        preferred_time: selectedTime,
        reason: document.getElementById('reason').value.trim()
      };

      fetch('/api/send-whatsapp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: '917082478374',
          template_name: 'reschedule_request',
          params: [data.name, data.phone, data.preferred_date, data.preferred_time, data.reason || 'N/A'],
          force: true
        })
      })
      .then(function() {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      });
    });
  })();
</script>

</body>
</html>
