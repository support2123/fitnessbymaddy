<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reschedule-page { max-width: 540px; margin: 0 auto; padding: 120px 24px 80px; }
    .reschedule-header { text-align: center; margin-bottom: 48px; }
    .reschedule-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 60px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); font-size: 16px; }
    .error-msg { background: #fee; color: #c00; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; display: none; }
    @media (max-width: 600px) { .reschedule-form { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="reschedule-page">
    <div class="reschedule-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Missed a <em>Session?</em></h1>
      <p class="section-body" style="margin:0 auto">No worries — life happens. Pick a new slot and we'll get you back on track.</p>
    </div>

    <div id="form-section">
      <div id="error-box" class="error-msg"></div>
      <form id="reschedule-form" class="reschedule-form">
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input class="form-input" type="text" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email or Phone *</label>
          <input class="form-input" type="text" name="contact" required placeholder="So we can confirm your slot">
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input class="form-input" type="date" name="preferred_date" required>
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Time (IST)</label>
          <select class="form-select" name="preferred_time">
            <option>Morning (7am - 10am)</option>
            <option>Midday (11am - 1pm)</option>
            <option>Afternoon (2pm - 5pm)</option>
            <option>Evening (6pm - 9pm)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Reason for Reschedule</label>
          <textarea class="form-textarea" name="reason" placeholder="Optional — helps us plan better"></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Request Reschedule</button>
      </form>
    </div>

    <div id="success-section" class="success-msg">
      <h2>Request Received!</h2>
      <p>We'll confirm your rescheduled session within 24 hours via WhatsApp or email.</p>
    </div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
(function() {
  var form = document.getElementById('reschedule-form');
  var errorBox = document.getElementById('error-box');
  var submitBtn = document.getElementById('submit-btn');

  var dateInput = form.querySelector('[name="preferred_date"]');
  var today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    var fd = new FormData(form);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/reschedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, body: j }; }); })
    .then(function(res) {
      if (res.ok) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
      } else {
        errorBox.textContent = res.body.error || 'Something went wrong.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Request Reschedule';
      }
    })
    .catch(function() {
      errorBox.textContent = 'Network error. Please try again.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request Reschedule';
    });
  });
})();
</script>
</body>
</html>
