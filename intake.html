<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 24px 20px;
      text-align: center;
    }
    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: white;
      margin-top: 8px;
      letter-spacing: 2px;
    }
    .header-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }
    .form-wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236B6B6B' stroke-width='1.5' fill='none'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 16px center; }
    .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-option {
      flex: 1; min-width: 100px;
      padding: 12px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .radio-option:has(input:checked) {
      border-color: var(--gold);
      background: rgba(184,150,90,0.08);
      color: var(--gold);
      font-weight: 600;
    }
    .radio-option input { display: none; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .success-msg p {
      font-size: 14px;
      color: var(--mid-grey);
      margin-top: 12px;
      line-height: 1.6;
    }
    .error-msg {
      background: #fee;
      border: 1px solid #fcc;
      color: #a33;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">Fitness by Maddy</div>
    <div class="header-title">Client Intake Form</div>
    <div class="header-sub">Tell us about yourself so we can build your perfect plan</div>
  </div>

  <div class="form-wrap">
    <form id="intakeForm">
      <div class="section-label">Personal Details</div>

      <div class="field">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required placeholder="Your full name">
      </div>

      <div class="field">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="age">Age *</label>
        <input type="number" id="age" name="age" required min="14" max="80" placeholder="25">
      </div>

      <div class="field">
        <label>Gender *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="gender" value="female" required>Female</label>
          <label class="radio-option"><input type="radio" name="gender" value="male">Male</label>
          <label class="radio-option"><input type="radio" name="gender" value="other">Other</label>
        </div>
      </div>

      <div class="section-label">Fitness Profile</div>

      <div class="field">
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your main goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength</option>
          <option value="pcos_management">PCOS Management</option>
          <option value="general_fitness">General Fitness</option>
          <option value="sports_performance">Sports Performance</option>
          <option value="post_pregnancy">Post-Pregnancy Recovery</option>
        </select>
      </div>

      <div class="field">
        <label for="experience_level">Experience Level *</label>
        <select id="experience_level" name="experience_level" required>
          <option value="">How long have you been training?</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field">
        <label for="injuries">Injuries / Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="List any injuries, surgeries, or medical conditions (e.g., knee pain, back issues, PCOS, thyroid)"></textarea>
      </div>

      <div class="field">
        <label for="medical_conditions">Current Medications</label>
        <textarea id="medical_conditions" name="medical_conditions" placeholder="List any medications or supplements you're currently taking"></textarea>
      </div>

      <div class="section-label">Lifestyle</div>

      <div class="field">
        <label for="diet_preference">Diet Preference *</label>
        <select id="diet_preference" name="diet_preference" required>
          <option value="">Select diet type</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="no_preference">No Preference</option>
        </select>
      </div>

      <div class="field">
        <label for="schedule">Training Schedule *</label>
        <select id="schedule" name="schedule" required>
          <option value="">How many days can you train?</option>
          <option value="3">3 days / week</option>
          <option value="4">4 days / week</option>
          <option value="5">5 days / week</option>
          <option value="6">6 days / week</option>
        </select>
      </div>

      <div class="field">
        <label>Training Environment *</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="environment" value="gym" required>Gym</label>
          <label class="radio-option"><input type="radio" name="environment" value="home">Home</label>
          <label class="radio-option"><input type="radio" name="environment" value="both">Both</label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>Thanks for submitting your intake form. Maddy's team will review your details and get your program ready. You'll hear from us on WhatsApp soon!</p>
    </div>
  </div>

  <script>
    var leadId = new URLSearchParams(window.location.search).get('lead');

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var form = e.target;
      var data = {
        lead_id: leadId,
        name: form.name.value,
        email: form.email.value,
        age: form.age.value,
        gender: form.gender.value,
        goal: form.goal.value,
        experience_level: form.experience_level.value,
        injuries: form.injuries.value,
        medical_conditions: form.medical_conditions.value,
        diet_preference: form.diet_preference.value,
        schedule: form.schedule.value,
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errEl.textContent = result.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
