<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your onboarding form to get started with your personalized fitness program.">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --error: #c0392b;
      --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold-light);
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { font-size: 14px; color: rgba(255,255,255,0.6); }

    .form-container {
      max-width: 520px; margin: -20px auto 40px; padding: 0 16px;
    }
    .form-card {
      background: white; border-radius: 8px; padding: 32px 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      color: var(--gold); margin: 24px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select { appearance: none; cursor: pointer; }
    .field .hint { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .required::after { content: ' *'; color: var(--error); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 4px;
      transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status { text-align: center; padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 14px; display: none; }
    .status.error { display: block; background: #fdeaea; color: var(--error); }
    .status.success { display: block; background: #eafde7; color: var(--success); }

    .brand-footer {
      text-align: center; padding: 24px; font-size: 12px; color: var(--mid-grey);
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>FITNESS BY MADDY</h1>
    <p>Client Onboarding Form</p>
  </div>

  <div class="form-container">
    <div class="form-card">
      <form id="intakeForm">
        <input type="hidden" id="lead_id" name="lead_id">

        <div class="form-section-title">PERSONAL DETAILS</div>

        <div class="field">
          <label class="required">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Your full name">
        </div>

        <div class="field">
          <label class="required">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div class="row">
          <div class="field">
            <label class="required">Age</label>
            <input type="number" id="age" name="age" required min="14" max="80" placeholder="25">
          </div>
          <div class="field">
            <label class="required">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-section-title">FITNESS PROFILE</div>

        <div class="field">
          <label class="required">Primary Goal</label>
          <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="pcos_management">PCOS / Hormonal Management</option>
            <option value="general_fitness">General Fitness & Strength</option>
            <option value="postpartum">Post-pregnancy Recovery</option>
            <option value="40plus">40+ Fitness & Joint Health</option>
          </select>
        </div>

        <div class="field">
          <label class="required">Training Experience</label>
          <select id="training_experience" name="training_experience" required>
            <option value="">Select experience level</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label class="required">Current Weight (kg)</label>
            <input type="number" id="current_weight" name="current_weight" required step="0.1" min="30" max="200" placeholder="65">
          </div>
          <div class="field">
            <label>Target Weight (kg)</label>
            <input type="number" id="target_weight" name="target_weight" step="0.1" min="30" max="200" placeholder="58">
          </div>
        </div>

        <div class="field">
          <label>Injuries or Physical Limitations</label>
          <textarea id="injuries" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
        </div>

        <div class="form-section-title">LIFESTYLE</div>

        <div class="field">
          <label class="required">Diet Preference</label>
          <select id="diet_preference" name="diet_preference" required>
            <option value="">Select preference</option>
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="jain">Jain</option>
          </select>
        </div>

        <div class="field">
          <label class="required">How many days/week can you train?</label>
          <select id="schedule_preference" name="schedule_preference" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>

        <div class="field">
          <label>Medical Conditions</label>
          <textarea id="medical_conditions" name="medical_conditions" placeholder="E.g., diabetes, thyroid, PCOS, blood pressure..."></textarea>
          <div class="hint">This helps us design a safe program for you</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <div class="brand-footer">fitnessbymaddy.com</div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var leadId = params.get('lead');
      if (leadId) document.getElementById('lead_id').value = leadId;

      document.getElementById('intakeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var status = document.getElementById('status');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';
        status.className = 'status';
        status.style.display = 'none';

        var data = {
          lead_id: document.getElementById('lead_id').value,
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          age: document.getElementById('age').value,
          gender: document.getElementById('gender').value,
          goal: document.getElementById('goal').value,
          injuries: document.getElementById('injuries').value,
          diet_preference: document.getElementById('diet_preference').value,
          training_experience: document.getElementById('training_experience').value,
          schedule_preference: document.getElementById('schedule_preference').value,
          current_weight: document.getElementById('current_weight').value,
          target_weight: document.getElementById('target_weight').value,
          medical_conditions: document.getElementById('medical_conditions').value,
        };

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(result) {
          if (result.ok) {
            status.className = 'status success';
            status.textContent = 'Form submitted successfully! Maddy\'s team will be in touch soon.';
            btn.textContent = 'SUBMITTED';
          } else {
            throw new Error(result.data.error || 'Submission failed');
          }
        })
        .catch(function(err) {
          status.className = 'status error';
          status.textContent = err.message || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        });
      });
    })();
  </script>
</body>
</html>
