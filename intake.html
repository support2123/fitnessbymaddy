<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      color: white;
      text-align: center;
      padding: 48px 24px 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: var(--gold-light);
      letter-spacing: 1px;
    }
    .form-container {
      max-width: 520px;
      margin: -20px auto 60px;
      background: white;
      border-radius: 2px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      padding: 40px 32px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      border-bottom: 1px solid var(--light-grey);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      background: var(--cream);
      color: var(--charcoal);
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    select { cursor: pointer; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      background: #fff0f0;
      color: #c00;
      padding: 12px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 560px) {
      .form-container { margin: -20px 12px 40px; padding: 28px 20px; }
      .form-header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Client Intake Form</h1>
  <p>Tell us about yourself so we can build your perfect program</p>
</div>

<div class="form-container">
  <div class="error-msg" id="errorMsg"></div>

  <form id="intakeForm">
    <div class="form-section">
      <div class="form-section-title">Personal Details</div>
      <div class="field">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="age">Age *</label>
        <input type="number" id="age" name="age" min="14" max="80" required>
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Select...</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" min="100" max="250">
      </div>
      <div class="field">
        <label for="weight">Current Weight (kg)</label>
        <input type="number" id="weight" name="weight" min="30" max="250" step="0.1">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Fitness Goals</div>
      <div class="field">
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your main goal...</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general">General Fitness & Energy</option>
          <option value="postpartum">Postpartum Recovery</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="goal_detail">Tell us more about your goal</label>
        <textarea id="goal_detail" name="goal_detail" placeholder="What does your ideal transformation look like?"></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Health & Limitations</div>
      <div class="field">
        <label for="injuries">Injuries or Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="E.g., lower back pain, knee issues, thyroid, PCOS, etc. Write 'None' if nothing."></textarea>
      </div>
      <div class="field">
        <label for="medications">Current Medications / Supplements</label>
        <textarea id="medications" name="medications" placeholder="List any medications or supplements you take regularly"></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Lifestyle</div>
      <div class="field">
        <label for="diet_pref">Dietary Preference</label>
        <select id="diet_pref" name="diet_pref">
          <option value="">Select...</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule">Workout Schedule Preference</label>
        <select id="schedule" name="schedule">
          <option value="">Select...</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
          <option value="flexible">Flexible</option>
        </select>
      </div>
      <div class="field">
        <label for="experience">Training Experience</label>
        <select id="experience" name="experience">
          <option value="">Select...</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="field">
        <label for="equipment">Equipment Access</label>
        <select id="equipment" name="equipment">
          <option value="">Select...</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home - Basic Equipment</option>
          <option value="home_none">Home - No Equipment</option>
          <option value="both">Both Gym & Home</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Intake Form</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>You're All Set!</h2>
    <p>We've received your details. Maddy's team will have your program ready soon. Keep an eye on WhatsApp for updates!</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var formData = {
      lead_id: leadId,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      age: document.getElementById('age').value,
      goal: document.getElementById('goal').value,
      goal_detail: document.getElementById('goal_detail').value,
      injuries: document.getElementById('injuries').value,
      diet_pref: document.getElementById('diet_pref').value,
      schedule: document.getElementById('schedule').value,
      gender: document.getElementById('gender').value,
      height: document.getElementById('height').value,
      weight: document.getElementById('weight').value,
      experience: document.getElementById('experience').value,
      equipment: document.getElementById('equipment').value,
      medications: document.getElementById('medications').value,
    };

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData),
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(result) {
      if (!result.ok) {
        throw new Error(result.data.error || 'Something went wrong');
      }
      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
    });
  });
})();
</script>

</body>
</html>
