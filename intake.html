<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your onboarding form to get started with your personalised fitness program.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: white; letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; letter-spacing: 1px; }
    .form-container {
      max-width: 560px; margin: -20px auto 40px; padding: 40px 32px;
      background: white; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      position: relative;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--gold); letter-spacing: 2px; margin: 32px 0 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .section-label:first-child { margin-top: 0; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn {
      width: 100%; padding: 16px; margin-top: 24px;
      background: var(--charcoal); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 40px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      display: none; background: #fee; border: 1px solid #fcc;
      padding: 12px 16px; border-radius: 4px; margin-bottom: 16px;
      color: #c33; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so we can build your perfect program</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <div class="section-label">Personal Details</div>

      <div class="field-row">
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required placeholder="Your name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@email.com">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Age *</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="section-label">Fitness Profile</div>

      <div class="field">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength Building</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness</option>
          <option value="weight_gain">Healthy Weight Gain</option>
          <option value="postnatal">Postnatal Recovery</option>
        </select>
      </div>

      <div class="field">
        <label>Experience Level</label>
        <select name="experience_level">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="current_weight" step="0.1" placeholder="70">
        </div>
        <div class="field">
          <label>Target Weight (kg)</label>
          <input type="number" name="target_weight" step="0.1" placeholder="65">
        </div>
      </div>

      <div class="section-label">Health & Lifestyle</div>

      <div class="field">
        <label>Injuries / Physical Limitations</label>
        <textarea name="injuries" placeholder="Any injuries, surgeries, or physical limitations we should know about..."></textarea>
      </div>

      <div class="field">
        <label>Medical Conditions / Medications</label>
        <textarea name="medical_conditions" placeholder="Any ongoing medical conditions or medications..."></textarea>
      </div>

      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_pref">
          <option value="">Select</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="jain">Jain</option>
          <option value="keto">Keto</option>
          <option value="gluten_free">Gluten Free</option>
        </select>
      </div>

      <div class="field">
        <label>Weekly Schedule / Availability</label>
        <textarea name="schedule" placeholder="How many days can you train? Any time constraints?"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>We've received your intake form. Your personalised program is being prepared. You'll hear from us on WhatsApp shortly!</p>
    </div>
  </div>

  <script>
    var form = document.getElementById('intakeForm');
    var errorMsg = document.getElementById('errorMsg');
    var successMsg = document.getElementById('successMsg');
    var submitBtn = document.getElementById('submitBtn');

    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      var formData = new FormData(form);
      var data = {};
      formData.forEach(function(value, key) { data[key] = value; });
      data.lead_id = leadId;

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json().then(function(j) { return { ok: res.ok, body: j }; }); })
      .then(function(result) {
        if (result.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          errorMsg.textContent = result.body.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT INTAKE FORM';
        }
      })
      .catch(function() {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
