<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px;
    }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; }
    .form-container {
      max-width: 600px; margin: -20px auto 40px; padding: 40px 24px;
      background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      position: relative;
    }
    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-label .required { color: #e74c3c; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-select { appearance: none; cursor: pointer; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: white; border: none; font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px; cursor: pointer;
      border-radius: 4px; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 40px;
    }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); }
    .success-msg p { color: var(--mid-grey); margin-top: 12px; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>CLIENT INTAKE FORM</h1>
    <p>Tell us about yourself so we can build your perfect program</p>
  </div>
  <div class="form-container">
    <form id="intakeForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-input" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email <span class="required">*</span></label>
          <input type="email" class="form-input" name="email" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age <span class="required">*</span></label>
          <input type="number" class="form-input" name="age" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Height (cm)</label>
          <input type="number" class="form-input" name="height" min="100" max="250">
        </div>
        <div class="form-group">
          <label class="form-label">Current Weight (kg) <span class="required">*</span></label>
          <input type="number" class="form-input" name="weight" step="0.1" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Primary Goal <span class="required">*</span></label>
        <select class="form-select" name="goal" required>
          <option value="">Select your main goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength</option>
          <option value="toning">Toning & Definition</option>
          <option value="pcos">PCOS Management</option>
          <option value="general_fitness">General Fitness</option>
          <option value="sports_performance">Sports Performance</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Training Experience</label>
        <select class="form-select" name="experience">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Available Days Per Week</label>
        <select class="form-select" name="schedule">
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Injuries or Physical Limitations</label>
        <textarea class="form-textarea" name="injuries" placeholder="List any current or past injuries, joint issues, or physical limitations..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Medical Conditions</label>
        <textarea class="form-textarea" name="medical_conditions" placeholder="PCOS, thyroid, diabetes, blood pressure, medications, etc."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Dietary Preferences</label>
        <select class="form-select" name="diet_pref">
          <option value="">Select</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="pescatarian">Pescatarian</option>
          <option value="keto">Keto</option>
          <option value="gluten_free">Gluten Free</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Food Allergies</label>
        <input type="text" class="form-input" name="allergies" placeholder="e.g. dairy, nuts, shellfish">
      </div>
      <div class="form-group">
        <label class="form-label">Anything Else We Should Know?</label>
        <textarea class="form-textarea" name="notes" placeholder="Previous programs, supplements, lifestyle details..."></textarea>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>
    <div class="success-msg" id="successMsg">
      <h2>FORM SUBMITTED!</h2>
      <p>Thank you! Your coach will review your profile and your personalized program will be on its way.</p>
    </div>
  </div>
  <script>
    var leadId = new URLSearchParams(window.location.search).get('lead');
    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      var fd = new FormData(this);
      var data = { lead_id: leadId };
      fd.forEach(function(v, k) { if (v) data[k] = v; });
      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(d.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        var el = document.getElementById('errorMsg');
        el.textContent = err.message;
        el.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
