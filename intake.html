<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; color: var(--charcoal); }
    .form-success p { color: var(--mid-grey); line-height: 1.7; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Welcome Aboard</p>
    <h1 class="section-title">Let's Get to<br><em>Know You</em></h1>
    <p class="section-body" style="margin: 16px auto 0;">Fill this out so Maddy can build your perfect program.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" novalidate>
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email *</label>
          <input class="form-input" type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="age">Age *</label>
          <input class="form-input" type="number" id="age" name="age" min="16" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="gender">Gender</label>
          <select class="form-select" id="gender" name="gender">
            <option value="">Select...</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="goal">Primary Goal *</label>
        <select class="form-select" id="goal" name="goal" required>
          <option value="">Select your main goal...</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="post_pregnancy">Post-Pregnancy Recovery</option>
          <option value="mobility">Mobility & Joint Health</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="current_activity">Current Activity Level</label>
        <select class="form-select" id="current_activity" name="current_activity">
          <option value="">Select...</option>
          <option value="sedentary">Sedentary (desk job, no exercise)</option>
          <option value="light">Light (1-2 days/week)</option>
          <option value="moderate">Moderate (3-4 days/week)</option>
          <option value="active">Active (5+ days/week)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="schedule">Available Training Days</label>
        <select class="form-select" id="schedule" name="schedule">
          <option value="">Select...</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="diet_pref">Diet Preference</label>
        <select class="form-select" id="diet_pref" name="diet_pref">
          <option value="">Select...</option>
          <option value="no_preference">No preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="injuries">Injuries / Physical Limitations</label>
        <textarea class="form-textarea" id="injuries" name="injuries" placeholder="E.g. lower back pain, knee issue, shoulder impingement..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="medical_conditions">Medical Conditions / Medications</label>
        <textarea class="form-textarea" id="medical_conditions" name="medical_conditions" placeholder="E.g. PCOS, thyroid, diabetes, blood pressure meds..."></textarea>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>You're All Set!</h2>
    <p>Thanks for filling that out. Maddy's team will review your info and your personalized program will be ready soon. Keep an eye on WhatsApp!</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');
  if (leadId) document.getElementById('lead_id').value = leadId;

  document.getElementById('intake').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var data = {
      lead_id: document.getElementById('lead_id').value,
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      age: document.getElementById('age').value,
      gender: document.getElementById('gender').value,
      goal: document.getElementById('goal').value,
      current_activity: document.getElementById('current_activity').value,
      schedule: document.getElementById('schedule').value,
      diet_pref: document.getElementById('diet_pref').value,
      injuries: document.getElementById('injuries').value.trim(),
      medical_conditions: document.getElementById('medical_conditions').value.trim()
    };

    if (!data.name || !data.email || !data.age || !data.goal) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
      return;
    }

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        document.getElementById('intakeForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        throw new Error(res.error || 'Submission failed');
      }
    })
    .catch(function(err) {
      errEl.textContent = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
    });
  });
})();
</script>
</body>
</html>
