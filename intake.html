<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      color: var(--gold-light); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p { color: #aaa; font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
    .form-container {
      max-width: 480px; margin: 0 auto; padding: 32px 20px 60px;
    }
    .form-section {
      margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--light-grey);
    }
    .form-section:last-of-type { border-bottom: none; }
    .section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
      color: var(--charcoal); margin-bottom: 16px; letter-spacing: 1px;
    }
    label {
      display: block; font-size: 12px; font-weight: 500; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: var(--charcoal); background: var(--white); transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .radio-group { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .radio-option {
      flex: 1; min-width: 100px; padding: 12px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; text-align: center; cursor: pointer; font-size: 13px;
      font-weight: 500; transition: all 0.3s; user-select: none;
    }
    .radio-option:hover { border-color: var(--gold); }
    .radio-option.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .radio-option input { display: none; }
    .submit-btn {
      width: 100%; padding: 18px; background: var(--charcoal); color: white;
      border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px; border-radius: 4px;
      font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fbe9e7; color: var(--error); }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Fitness by Maddy</h1>
    <p>New Client Intake Form</p>
  </div>

  <div class="form-container">
    <form id="intakeForm">
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="form-section">
        <div class="section-title">About You</div>
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
        <label for="age">Age *</label>
        <input type="number" id="age" name="age" min="14" max="80" required>
        <label>Gender *</label>
        <div class="radio-group" data-field="gender">
          <label class="radio-option"><input type="radio" name="gender" value="female"> Female</label>
          <label class="radio-option"><input type="radio" name="gender" value="male"> Male</label>
          <label class="radio-option"><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Body Stats</div>
        <label for="height">Height (cm) *</label>
        <input type="number" id="height" name="height" min="100" max="250" required>
        <label for="weight">Current Weight (kg) *</label>
        <input type="number" id="weight" name="weight" step="0.1" min="30" max="300" required>
      </div>

      <div class="form-section">
        <div class="section-title">Goals & History</div>
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength Training</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
        <label for="experience">Training Experience *</label>
        <select id="experience" name="experience" required>
          <option value="">Select experience level</option>
          <option value="beginner">Beginner (< 6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
        <label for="workout_days">How many days can you train per week? *</label>
        <div class="radio-group" data-field="workout_days">
          <label class="radio-option"><input type="radio" name="workout_days" value="3"> 3</label>
          <label class="radio-option"><input type="radio" name="workout_days" value="4"> 4</label>
          <label class="radio-option"><input type="radio" name="workout_days" value="5"> 5</label>
          <label class="radio-option"><input type="radio" name="workout_days" value="6"> 6</label>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Health & Diet</div>
        <label for="diet_pref">Diet Preference *</label>
        <select id="diet_pref" name="diet_pref" required>
          <option value="">Select preference</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
        <label for="injuries">Injuries / Physical Limitations</label>
        <textarea id="injuries" name="injuries" placeholder="E.g., lower back pain, knee injury, shoulder impingement..."></textarea>
        <label for="medical_conditions">Medical Conditions</label>
        <textarea id="medical_conditions" name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure..."></textarea>
        <label for="current_supplements">Current Supplements</label>
        <textarea id="current_supplements" name="current_supplements" placeholder="E.g., whey protein, creatine, multivitamin..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('lead_id').value = leadId;

    document.querySelectorAll('.radio-option').forEach(function(opt) {
      opt.addEventListener('click', function() {
        var group = this.closest('.radio-group');
        group.querySelectorAll('.radio-option').forEach(function(o) { o.classList.remove('selected'); });
        this.classList.add('selected');
        this.querySelector('input').checked = true;
      });
    });

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'status-msg';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(v, k) { data[k] = v; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
      .then(function(res) {
        if (res.ok) {
          msg.className = 'status-msg success';
          msg.textContent = 'Thank you! Your intake form has been submitted. We\'ll get your program ready!';
          btn.textContent = 'SUBMITTED ✓';
        } else {
          throw new Error(res.data.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        msg.className = 'status-msg error';
        msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
