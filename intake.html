<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <meta name="description" content="Tell us about yourself so Maddy can build your perfect program.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: white;
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { font-size: 14px; color: var(--gold-light); letter-spacing: 1px; }
    .form-wrap {
      max-width: 520px; margin: -20px auto 40px; padding: 40px 28px;
      background: white; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      position: relative;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
      color: var(--gold); margin: 32px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section-title:first-child { margin-top: 0; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-group label {
      display: flex; align-items: center; gap: 6px; padding: 10px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 4px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--charcoal);
      text-transform: none; letter-spacing: 0; transition: all 0.2s;
    }
    .radio-group input { width: auto; padding: 0; }
    .radio-group label:has(input:checked) {
      border-color: var(--gold); background: rgba(184,150,90,0.08);
    }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold);
      letter-spacing: 2px; margin-bottom: 12px;
    }
    .success-msg p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      display: none; background: #fee; color: #c00; padding: 12px 16px;
      border-radius: 4px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so Maddy can build your perfect program</p>
  </div>

  <div class="form-wrap">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <div class="form-section-title">Personal Info</div>

      <div class="field">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field">
        <label for="phone">WhatsApp Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
      </div>
      <div class="field">
        <label for="age">Age *</label>
        <input type="number" id="age" name="age" required min="14" max="80" placeholder="25">
      </div>
      <div class="field">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="form-section-title">Fitness Profile</div>

      <div class="field">
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle / Strength Gain</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="pcos">PCOS Management</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="post_pregnancy">Post-Pregnancy Recovery</option>
          <option value="40plus">40+ Active Lifestyle</option>
        </select>
      </div>
      <div class="field">
        <label for="experience">Training Experience</label>
        <select id="experience" name="experience">
          <option value="">Select level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="field">
        <label for="injuries">Injuries / Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="Any injuries, conditions, or medications we should know about..."></textarea>
      </div>

      <div class="form-section-title">Lifestyle</div>

      <div class="field">
        <label for="diet_pref">Diet Preference</label>
        <select id="diet_pref" name="diet_pref">
          <option value="">Select preference</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="jain">Jain</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule">Weekly Training Availability</label>
        <select id="schedule" name="schedule">
          <option value="">How many days can you train?</option>
          <option value="3">3 days/week</option>
          <option value="4">4 days/week</option>
          <option value="5">5 days/week</option>
          <option value="6">6 days/week</option>
        </select>
      </div>
      <div class="field">
        <label>Training Setup</label>
        <div class="radio-group">
          <label><input type="radio" name="setup" value="gym"> Full Gym</label>
          <label><input type="radio" name="setup" value="home"> Home (minimal equipment)</label>
          <label><input type="radio" name="setup" value="both"> Both</label>
        </div>
      </div>
      <div class="field">
        <label for="notes">Anything else Maddy should know?</label>
        <textarea id="notes" name="notes" placeholder="Lifestyle details, stress levels, sleep quality..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Form Submitted!</h2>
      <p>Thanks! Maddy's team has your details. We'll reach out on WhatsApp with your program details soon.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('intakeForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      const data = {
        lead_id: leadId,
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        age: form.age.value,
        gender: form.gender ? form.gender.value : '',
        goal: form.goal.value,
        experience: form.experience.value,
        injuries: form.injuries.value.trim(),
        diet_pref: form.diet_pref.value,
        schedule: form.schedule.value,
        setup: form.setup ? form.setup.value : '',
        notes: form.notes.value.trim()
      };

      try {
        const resp = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await resp.json();

        if (resp.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT INTAKE FORM';
        }
      } catch {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT INTAKE FORM';
      }
    });
  </script>
</body>
</html>
