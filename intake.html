<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .intake-wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; }
    .intake-header { text-align: center; margin-bottom: 48px; }
    .intake-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--charcoal); margin-bottom: 12px; }
    .intake-header h1 em { color: var(--gold); font-style: italic; }
    .intake-header p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .intake-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-section { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--light-grey); }
    .form-section:last-child { border-bottom: none; margin-bottom: 0; }
    .form-section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--charcoal); margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-label {
      padding: 10px 20px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 13px; cursor: pointer; transition: all 0.3s; color: var(--mid-grey);
    }
    .radio-label:has(input:checked) { border-color: var(--gold); background: rgba(184,150,90,0.08); color: var(--charcoal); }
    .radio-label input { display: none; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { font-size: 14px; color: var(--mid-grey); }
    .error-msg { background: #fee; border: 1px solid #fcc; padding: 12px; border-radius: 2px; color: #c33; font-size: 13px; margin-bottom: 16px; display: none; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .intake-form { padding: 24px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="intake-wrap">
    <div class="intake-header">
      <p class="section-eyebrow">New Client</p>
      <h1>Tell Us About <em>You</em></h1>
      <p>This helps Maddy design a program that fits your body, goals, and lifestyle perfectly.</p>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form id="intake-form" class="intake-form">
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="form-section">
        <div class="form-section-title">Personal Details</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-input" name="name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" name="email">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age *</label>
            <input type="number" class="form-input" name="age" min="14" max="80" required>
          </div>
          <div class="form-group">
            <label class="form-label">Gender *</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="gender" value="female" required> Female</label>
              <label class="radio-label"><input type="radio" name="gender" value="male"> Male</label>
              <label class="radio-label"><input type="radio" name="gender" value="other"> Other</label>
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Fitness Profile</div>
        <div class="form-group">
          <label class="form-label">Primary Goal *</label>
          <select class="form-select" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="general_fitness">General Fitness & Health</option>
            <option value="post_pregnancy">Post-Pregnancy Recovery</option>
            <option value="mobility">Mobility & Pain-Free Movement</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg)</label>
            <input type="number" class="form-input" name="current_weight" step="0.1">
          </div>
          <div class="form-group">
            <label class="form-label">Target Weight (kg)</label>
            <input type="number" class="form-input" name="target_weight" step="0.1">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Experience Level *</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="experience_level" value="beginner" required> Beginner</label>
            <label class="radio-label"><input type="radio" name="experience_level" value="intermediate"> Intermediate</label>
            <label class="radio-label"><input type="radio" name="experience_level" value="advanced"> Advanced</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Workout Schedule</label>
          <select class="form-select" name="workout_schedule">
            <option value="3">3 days/week</option>
            <option value="4">4 days/week</option>
            <option value="5" selected>5 days/week</option>
            <option value="6">6 days/week</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Health & Diet</div>
        <div class="form-group">
          <label class="form-label">Any Injuries?</label>
          <textarea class="form-textarea" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Medical Conditions</label>
          <textarea class="form-textarea" name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Diet Preference</label>
          <select class="form-select" name="diet_pref">
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Veg</option>
            <option value="jain">Jain</option>
            <option value="keto">Keto</option>
            <option value="gluten_free">Gluten Free</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Submit Intake Form</button>
    </form>

    <div id="success-view" class="success-msg" style="display:none;">
      <h2>You're All Set!</h2>
      <p>Maddy's got your info. Your personalised program is on its way.</p>
    </div>
  </div>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('lead_id').value = leadId;

    document.getElementById('intake-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var errBox = document.getElementById('error-box');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errBox.style.display = 'none';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(val, key) { data[key] = val; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, body: j }; }); })
      .then(function(res) {
        if (res.ok) {
          document.getElementById('intake-form').style.display = 'none';
          document.getElementById('success-view').style.display = 'block';
        } else {
          errBox.textContent = res.body.error || 'Something went wrong. Please try again.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        }
      })
      .catch(function() {
        errBox.textContent = 'Network error. Please check your connection and try again.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  })();
</script>
</body>
</html>
