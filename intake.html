<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 12px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Welcome Aboard</p>
      <h1 class="section-title">Client <em>Intake</em> Form</h1>
      <p class="section-body" style="margin: 16px auto 0;">Help us create the perfect program for you.</p>
    </div>

    <div class="form-card" id="intakeForm">
      <form id="intake" onsubmit="submitIntake(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input class="form-input" name="name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input class="form-input" type="email" name="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age *</label>
            <input class="form-input" type="number" name="age" min="14" max="80" required>
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input class="form-input" type="number" name="current_weight" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Target Weight (kg)</label>
            <input class="form-input" type="number" name="target_weight" step="0.1">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Height (cm) *</label>
          <input class="form-input" type="number" name="height" required>
        </div>

        <div class="form-group">
          <label class="form-label">Primary Goal *</label>
          <select class="form-select" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="body_recomp">Body Recomposition</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Training Experience</label>
          <select class="form-select" name="training_experience">
            <option value="">Select</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Equipment Access</label>
          <select class="form-select" name="equipment_access">
            <option value="">Select</option>
            <option value="full_gym">Full Gym</option>
            <option value="home_basic">Home (Dumbbells + Bands)</option>
            <option value="bodyweight_only">Bodyweight Only</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Available Training Days per Week</label>
          <select class="form-select" name="available_days">
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5" selected>5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Diet Preference</label>
          <select class="form-select" name="diet_preference">
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Injuries / Physical Limitations</label>
          <textarea class="form-textarea" name="injuries" placeholder="Any past or current injuries, joint issues, back problems etc."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Medical Conditions / Medications</label>
          <textarea class="form-textarea" name="medical_conditions" placeholder="PCOS, thyroid, diabetes, blood pressure, any medications you take"></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>You're All Set!</h2>
      <p class="section-body">Your intake has been submitted. We'll start building your program right away. You'll receive it on WhatsApp within 24-48 hours.</p>
    </div>
  </div>
</div>

<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  async function submitIntake(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = document.getElementById('intake');
    var data = Object.fromEntries(new FormData(form));
    data.lead_id = getParam('lead');

    try {
      var res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        document.getElementById('intakeForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Intake Form';
        alert('Something went wrong. Please try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
      alert('Network error. Please check your connection.');
    }
  }
</script>
</body>
</html>
