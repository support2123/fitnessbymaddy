<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 12px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 16px; line-height: 1.7; }
    .hidden { display: none; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Getting Started</p>
    <h1 class="section-title">Client <em>Intake</em> Form</h1>
    <p class="section-body" style="margin:12px auto 0">Tell us about yourself so Maddy can design the perfect program for you.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" onsubmit="submitIntake(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" type="text" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input class="form-input" type="number" name="age" min="16" max="80" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <input class="form-input" type="email" name="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Primary Goal *</label>
        <select class="form-select" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="body_recomp">Body Recomposition</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Any Injuries or Medical Conditions?</label>
        <textarea class="form-textarea" name="injuries" placeholder="E.g., knee injury, back pain, diabetes, thyroid — or type 'None'"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Dietary Preferences *</label>
        <select class="form-select" name="diet_pref" required>
          <option value="">Select diet type</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Days Available to Train *</label>
          <select class="form-select" name="schedule" required>
            <option value="">How many days?</option>
            <option value="3">3 days/week</option>
            <option value="4">4 days/week</option>
            <option value="5">5 days/week</option>
            <option value="6">6 days/week</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Equipment Access *</label>
          <select class="form-select" name="equipment" required>
            <option value="">Select</option>
            <option value="full_gym">Full Gym</option>
            <option value="home_basic">Home (Basic Equipment)</option>
            <option value="bodyweight">Bodyweight Only</option>
            <option value="resistance_bands">Resistance Bands</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Training Experience *</label>
        <select class="form-select" name="experience" required>
          <option value="">Select level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="form-success hidden" id="successMsg">
    <h2>You're All Set! 🎉</h2>
    <p>Your intake form has been submitted. Maddy's team will prepare your personalised program. Check WhatsApp for updates!</p>
  </div>
</div>

<script>
async function submitIntake(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');

  const form = e.target;
  const data = {
    lead_id: leadId,
    name: form.name.value,
    age: form.age.value,
    email: form.email.value,
    goal: form.goal.value,
    injuries: form.injuries.value,
    diet_pref: form.diet_pref.value,
    schedule: form.schedule.value,
    equipment: form.equipment.value,
    experience: form.experience.value
  };

  try {
    const res = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      document.getElementById('intakeForm').classList.add('hidden');
      document.getElementById('successMsg').classList.remove('hidden');
    } else {
      const err = await res.json();
      alert('Error: ' + (err.error || 'Something went wrong'));
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
    }
  } catch {
    alert('Network error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Submit Intake Form';
  }
}
</script>
</body>
</html>
