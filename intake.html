<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-container {
      max-width: 480px; margin: 0 auto; padding: 40px 24px 60px;
    }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 4px; color: var(--gold);
    }
    .brand p { font-size: 14px; color: var(--mid-grey); margin-top: 8px; }

    .form-section { margin-bottom: 28px; }
    .form-section h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2px; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--charcoal); margin-bottom: 6px;
    }
    .field label .req { color: var(--error); }

    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; border: 1.5px solid var(--light-grey); border-radius: 4px;
      background: #fff; color: var(--charcoal); transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }

    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-group label {
      padding: 8px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 13px; cursor: pointer;
      transition: all 0.2s; display: inline-block;
    }
    .radio-group input { display: none; }
    .radio-group input:checked + label {
      border-color: var(--gold); background: var(--gold); color: #fff;
    }

    .submit-btn {
      width: 100%; padding: 16px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; border: none; border-radius: 4px;
      background: var(--charcoal); color: #fff; cursor: pointer;
      transition: background 0.3s; margin-top: 20px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg {
      text-align: center; padding: 16px; border-radius: 4px;
      margin-top: 16px; font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fce4ec; color: var(--error); }

    .photo-upload { position: relative; }
    .photo-upload input[type="file"] {
      padding: 10px; background: var(--sand); border: 1.5px dashed var(--light-grey);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Client Onboarding Form</p>
    </div>

    <form id="intakeForm">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-section">
        <h2>Personal Details</h2>
        <div class="field">
          <label>Full Name <span class="req">*</span></label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="email" required>
        </div>
        <div class="field">
          <label>Age <span class="req">*</span></label>
          <input type="number" name="age" min="14" max="80" required>
        </div>
        <div class="field">
          <label>Gender</label>
          <div class="radio-group">
            <input type="radio" name="gender" value="female" id="gf">
            <label for="gf">Female</label>
            <input type="radio" name="gender" value="male" id="gm">
            <label for="gm">Male</label>
            <input type="radio" name="gender" value="other" id="go">
            <label for="go">Other</label>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Body Stats</h2>
        <div class="field">
          <label>Height (cm) <span class="req">*</span></label>
          <input type="number" name="height" min="100" max="220" required>
        </div>
        <div class="field">
          <label>Current Weight (kg) <span class="req">*</span></label>
          <input type="number" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field">
          <label>Goal Weight (kg)</label>
          <input type="number" name="goal_weight" step="0.1" min="30" max="200">
        </div>
      </div>

      <div class="form-section">
        <h2>Goals & History</h2>
        <div class="field">
          <label>Primary Goal <span class="req">*</span></label>
          <select name="goal" required>
            <option value="">Select...</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="body_recomp">Body Recomposition</option>
          </select>
        </div>
        <div class="field">
          <label>Experience Level</label>
          <div class="radio-group">
            <input type="radio" name="experience_level" value="beginner" id="eb">
            <label for="eb">Beginner</label>
            <input type="radio" name="experience_level" value="intermediate" id="ei">
            <label for="ei">Intermediate</label>
            <input type="radio" name="experience_level" value="advanced" id="ea">
            <label for="ea">Advanced</label>
          </div>
        </div>
        <div class="field">
          <label>Equipment Access</label>
          <div class="radio-group">
            <input type="radio" name="equipment_access" value="full_gym" id="efg">
            <label for="efg">Full Gym</label>
            <input type="radio" name="equipment_access" value="home_basic" id="ehb">
            <label for="ehb">Home (Basic)</label>
            <input type="radio" name="equipment_access" value="none" id="en">
            <label for="en">No Equipment</label>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Health & Lifestyle</h2>
        <div class="field">
          <label>Injuries or Medical Conditions</label>
          <textarea name="injuries" placeholder="e.g., lower back pain, knee surgery in 2023, PCOS..."></textarea>
        </div>
        <div class="field">
          <label>Current Medications (if any)</label>
          <textarea name="medical_conditions" placeholder="List any medications or supplements you're currently taking"></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_pref">
            <option value="">No preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="keto">Keto</option>
          </select>
        </div>
        <div class="field">
          <label>Days Available for Training</label>
          <select name="schedule">
            <option value="3">3 days/week</option>
            <option value="4">4 days/week</option>
            <option value="5" selected>5 days/week</option>
            <option value="6">6 days/week</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <h2>Photos (Optional)</h2>
        <div class="field photo-upload">
          <label>Front, Side & Back photos help us design the best program</label>
          <input type="file" name="photos" accept="image/*" multiple>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var leadId = params.get('lead');
      if (leadId) document.getElementById('leadId').value = leadId;

      document.getElementById('intakeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('statusMsg');
        btn.disabled = true;
        btn.textContent = 'Submitting...';
        msg.className = 'status-msg';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(v, k) { if (k !== 'photos') data[k] = v; });

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          if (result.success) {
            msg.textContent = 'Thank you! Your intake form has been submitted. We\'ll get your program ready!';
            msg.className = 'status-msg success';
            btn.textContent = 'Submitted!';
          } else {
            throw new Error(result.error || 'Submission failed');
          }
        })
        .catch(function(err) {
          msg.textContent = 'Something went wrong: ' + err.message + '. Please try again.';
          msg.className = 'status-msg error';
          btn.disabled = false;
          btn.textContent = 'Submit Intake Form';
        });
      });
    })();
  </script>
</body>
</html>
