<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <meta name="description" content="Complete your intake form to get started with your personalized fitness program by Maddy.">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 48px 24px; text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold);
      letter-spacing: 4px;
    }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; }
    .form-container {
      max-width: 560px; margin: -24px auto 40px; padding: 40px 32px;
      background: white; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      position: relative; z-index: 1;
    }
    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold);
      letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s; font-family: 'DM Sans', sans-serif;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 48px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold);
      letter-spacing: 2px; margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg {
      display: none; background: #fee; border: 1px solid #fcc; color: #c33;
      padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;
    }
    .footer-bar {
      text-align: center; padding: 24px; color: var(--mid-grey); font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>FITNESS BY MADDY</h1>
    <p>New Client Intake Form</p>
  </div>

  <div class="form-container" id="formContainer">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm" novalidate>
      <input type="hidden" name="lead_id" id="leadId">

      <div class="form-section">
        <div class="form-section-title">PERSONAL DETAILS</div>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required placeholder="Your full name">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Age</label>
            <input type="number" name="age" min="14" max="80" placeholder="25">
          </div>
          <div class="field">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="field">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss / Shredding</option>
            <option value="muscle_building">Muscle Building</option>
            <option value="body_recomp">Body Recomposition</option>
            <option value="pcos">PCOS / Hormonal Management</option>
            <option value="40plus">40+ Fitness & Strength</option>
            <option value="general">General Health & Fitness</option>
            <option value="athletic">Athletic Performance</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Current Weight (kg)</label>
            <input type="number" name="current_weight" step="0.1" placeholder="70">
          </div>
          <div class="field">
            <label>Target Weight (kg)</label>
            <input type="number" name="target_weight" step="0.1" placeholder="65">
          </div>
        </div>
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" name="height" step="0.1" placeholder="170">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HEALTH & HISTORY</div>
        <div class="field">
          <label>Injuries (current or past)</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee surgery in 2022..."></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions / Medications</label>
          <textarea name="medical_conditions" placeholder="E.g., thyroid, PCOS, blood pressure meds..."></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_preference">
            <option value="">No preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="keto">Keto</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">TRAINING BACKGROUND</div>
        <div class="field">
          <label>Training Experience</label>
          <select name="training_experience">
            <option value="">Select</option>
            <option value="complete_beginner">Complete Beginner</option>
            <option value="beginner">Beginner (0-1 years)</option>
            <option value="intermediate">Intermediate (1-3 years)</option>
            <option value="advanced">Advanced (3+ years)</option>
          </select>
        </div>
        <div class="field">
          <label>Available Equipment</label>
          <select name="available_equipment">
            <option value="full_gym">Full Gym Access</option>
            <option value="home_basic">Home — Basic (dumbbells, bands)</option>
            <option value="home_none">Home — No Equipment</option>
            <option value="home_advanced">Home — Advanced (rack, barbell, bench)</option>
          </select>
        </div>
        <div class="field">
          <label>Weekly Training Schedule</label>
          <select name="weekly_schedule">
            <option value="">Select</option>
            <option value="3_days">3 days/week</option>
            <option value="4_days">4 days/week</option>
            <option value="5_days">5 days/week</option>
            <option value="6_days">6 days/week</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="form-container success-msg" id="successMsg">
    <h2>FORM SUBMITTED!</h2>
    <p>Thanks! Your intake form has been received. Maddy's team will review your details and get you started on the right program.</p>
  </div>

  <div class="footer-bar">Fitness by Maddy &middot; Confidential</div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var leadId = params.get('lead');
      if (leadId) document.getElementById('leadId').value = leadId;

      document.getElementById('intakeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var form = e.target;
        var btn = document.getElementById('submitBtn');
        var errEl = document.getElementById('errorMsg');

        if (!form.name.value.trim()) {
          errEl.textContent = 'Please enter your name.';
          errEl.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';
        errEl.style.display = 'none';

        var data = {};
        var fields = ['lead_id','name','phone','email','age','gender','goal',
          'current_weight','target_weight','height','injuries','medical_conditions',
          'diet_preference','training_experience','available_equipment','weekly_schedule'];
        for (var i = 0; i < fields.length; i++) {
          var el = form.elements[fields[i]];
          if (el) data[fields[i]] = el.value;
        }

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.success) {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          } else {
            throw new Error(result.error || 'Submission failed');
          }
        })
        .catch(function(err) {
          errEl.textContent = 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        });
      });
    })();
  </script>
</body>
</html>
