<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <section class="form-hero">
    <div class="form-container">
      <p class="section-eyebrow">Step 1 of 1</p>
      <h1 class="form-title">Let's <em>tailor</em> your plan</h1>
      <p class="form-sub">Takes about 2 minutes. Maddy reads every intake personally before your first week is built.</p>

      <form id="intakeForm" class="app-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full name *</label>
            <input class="form-input" name="name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Age *</label>
            <input class="form-input" name="age" type="number" min="14" max="85" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">WhatsApp number *</label>
            <input class="form-input" name="phone" placeholder="+91 …" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" name="email" type="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Primary goal *</label>
          <select class="form-select" name="goal" required>
            <option value="">Choose one…</option>
            <option>Fat loss</option>
            <option>Muscle / strength</option>
            <option>PCOS support</option>
            <option>40+ fitness</option>
            <option>General conditioning</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Training schedule (days / week)</label>
          <select class="form-select" name="schedule">
            <option>3 days</option><option>4 days</option><option>5 days</option><option>6 days</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Dietary preference</label>
          <select class="form-select" name="diet_pref">
            <option>No preference</option>
            <option>Vegetarian</option>
            <option>Vegan</option>
            <option>Eggetarian</option>
            <option>Jain</option>
            <option>Halal</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Injuries or pain (anywhere in body)</label>
          <textarea class="form-input" name="injuries" rows="3" placeholder="Knee, lower back, shoulder, etc. Write 'none' if none."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Medical conditions / medications</label>
          <textarea class="form-input" name="medical" rows="3" placeholder="PCOS, thyroid, BP, anything under doctor's care."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Anything else Maddy should know?</label>
          <textarea class="form-input" name="notes" rows="3"></textarea>
        </div>

        <button class="btn-primary form-submit" type="submit">Submit Intake</button>
        <p class="form-status" id="intakeStatus"></p>
      </form>
    </div>
  </section>
</div>

<script src="js/nav.js"></script>
<script>
(function () {
  const form = document.getElementById('intakeForm');
  const status = document.getElementById('intakeStatus');
  const params = new URLSearchParams(location.search);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.textContent = 'Sending…';
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    payload.lead_id = params.get('lead') || null;
    try {
      const r = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed');
      status.textContent = "Got it. Maddy's team will message you on WhatsApp shortly.";
      form.reset();
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again or WhatsApp us.';
    }
  });
})();
</script>

</body>
</html>
