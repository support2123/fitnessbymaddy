<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intake Form | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 32px;
      font-weight: 300; color: var(--gold); letter-spacing: 2px;
    }
    .form-header p { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 8px; }
    .form-wrap {
      max-width: 560px; margin: -20px auto 40px; padding: 40px 24px;
      background: white; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06);
      position: relative;
    }
    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 22px;
      font-weight: 400; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 600px) {
      .field-row { grid-template-columns: 1fr; }
      .form-wrap { margin: -20px 12px 40px; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Client Intake Form</h1>
  <p>Tell us about yourself so we can build your perfect program</p>
</div>

<div class="form-wrap">
  <form id="intakeForm">
    <input type="hidden" id="leadId" name="lead_id">

    <div class="form-section">
      <div class="form-section-title">Personal Information</div>
      <div class="field-row">
        <div class="field">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" min="14" max="80" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone (with country code)</label>
          <input type="tel" id="phone" name="phone" placeholder="+91...">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Fitness Profile</div>
      <div class="field">
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS Management</option>
          <option value="general_fitness">General Fitness</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="postpartum">Postpartum Fitness</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="experience">Training Experience</label>
        <select id="experience" name="experience">
          <option value="">Select experience level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="field">
        <label for="injuries">Injuries or Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="List any injuries, conditions, surgeries, or medications..."></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Lifestyle</div>
      <div class="field">
        <label for="diet_pref">Dietary Preference</label>
        <select id="diet_pref" name="diet_pref">
          <option value="">Select preference</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="keto">Keto</option>
          <option value="gluten_free">Gluten Free</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule">Weekly Workout Schedule</label>
        <select id="schedule" name="schedule">
          <option value="">How many days can you train?</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
          <option value="flexible">Flexible</option>
        </select>
      </div>
      <div class="field">
        <label for="equipment">Equipment Access</label>
        <select id="equipment" name="equipment">
          <option value="">Select equipment access</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home — Basic (dumbbells, bands)</option>
          <option value="home_none">Home — No Equipment</option>
          <option value="both">Both Gym & Home</option>
        </select>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button type="submit" class="btn-submit" id="submitBtn">Submit Intake Form</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>You're All Set!</h2>
    <p>Thanks for filling out your intake form. Maddy's team will use this info to build your personalized program. You'll hear from us on WhatsApp soon!</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    errEl.style.display = 'none';

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Submission failed');

      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
    }
  });
</script>
</body>
</html>
