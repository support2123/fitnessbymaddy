<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your intake form to get started with your personalized fitness program.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .header {
      background: var(--charcoal); padding: 24px 20px; text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      color: var(--gold); letter-spacing: 4px;
    }
    .header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }

    .form-container {
      max-width: 520px; margin: 0 auto; padding: 32px 20px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--charcoal); letter-spacing: 2px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--light-grey); border-radius: 3px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--white);
      outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); border: none; cursor: pointer;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; border-radius: 3px;
      transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none; text-align: center; padding: 60px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }

    .error-msg {
      background: #fee; color: #c00; padding: 12px; border-radius: 3px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Client Intake Form</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <div class="form-section">
        <div class="form-section-title">PERSONAL INFO</div>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Phone *</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Age *</label>
            <input type="number" name="age" min="14" max="80" required>
          </div>
          <div class="field">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">BODY STATS</div>
        <div class="field-row">
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" name="height_cm" min="100" max="250" step="0.1">
          </div>
          <div class="field">
            <label>Current Weight (kg)</label>
            <input type="number" name="weight_kg" min="30" max="300" step="0.1">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="field">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your main goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Bulk</option>
            <option value="body_recomp">Body Recomposition</option>
            <option value="strength">Strength Training</option>
            <option value="pcos">PCOS Management</option>
            <option value="general_fitness">General Fitness & Health</option>
            <option value="postpartum">Postpartum Recovery</option>
            <option value="athletic">Athletic Performance</option>
          </select>
        </div>
        <div class="field">
          <label>Workout Experience</label>
          <select name="workout_experience">
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate" selected>Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Days Per Week Available</label>
            <select name="days_per_week">
              <option value="3">3 days</option>
              <option value="4">4 days</option>
              <option value="5" selected>5 days</option>
              <option value="6">6 days</option>
            </select>
          </div>
          <div class="field">
            <label>Equipment Access</label>
            <select name="equipment_access">
              <option value="full_gym">Full Gym</option>
              <option value="home_basic">Home - Basic Equipment</option>
              <option value="home_none">Home - No Equipment</option>
              <option value="hotel">Hotel / Travel</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HEALTH & DIET</div>
        <div class="field">
          <label>Any Injuries or Physical Limitations?</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee issue, shoulder impingement..."></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions or Medications?</label>
          <textarea name="medical_conditions" placeholder="E.g., thyroid, diabetes, PCOS, blood pressure medication..."></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_pref">
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="keto">Keto</option>
            <option value="gluten_free">Gluten-Free</option>
          </select>
        </div>
        <div class="field">
          <label>Meals Per Day</label>
          <select name="meals_per_day">
            <option value="2">2 meals</option>
            <option value="3" selected>3 meals</option>
            <option value="4">4 meals</option>
            <option value="5">5 meals</option>
            <option value="6">6 meals</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">SCHEDULE</div>
        <div class="field">
          <label>Preferred Workout Time</label>
          <select name="schedule">
            <option value="morning">Morning (6-9 AM)</option>
            <option value="midday">Midday (11 AM-1 PM)</option>
            <option value="afternoon">Afternoon (3-5 PM)</option>
            <option value="evening" selected>Evening (6-9 PM)</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Your intake form has been submitted successfully. Maddy's team will review your details and get your program ready. You'll hear from us on WhatsApp soon!</p>
    </div>
  </div>

  <script>
    var leadId = new URLSearchParams(window.location.search).get('lead');

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(v, k) { data[k] = v; });
      data.lead_id = leadId;

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) {
        if (!r.ok) throw new Error('Submission failed');
        return r.json();
      })
      .then(function() {
        document.getElementById('intakeForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function(err) {
        errEl.textContent = 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
