<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>Welcome to Your Journey</h1>
      <p>Fill this out so we can design the perfect program for you.</p>
    </div>

    <form id="intakeForm" novalidate>
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-section">
        <h2>Basic Info</h2>
        <div class="field">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="age">Age *</label>
            <input type="number" id="age" name="age" min="14" max="80" required>
          </div>
          <div class="field">
            <label for="gender">Gender *</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="height">Height (cm) *</label>
            <input type="number" id="height" name="height" min="100" max="250" required>
          </div>
          <div class="field">
            <label for="weight">Current Weight (kg) *</label>
            <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Goals & Health</h2>
        <div class="field">
          <label for="goal">Primary Goal *</label>
          <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS Management</option>
            <option value="general_fitness">General Fitness & Energy</option>
            <option value="postnatal">Postnatal Recovery</option>
          </select>
        </div>
        <div class="field">
          <label for="injuries">Any injuries or pain areas?</label>
          <textarea id="injuries" name="injuries" rows="2" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
        </div>
        <div class="field">
          <label for="medical_conditions">Medical conditions or medications?</label>
          <textarea id="medical_conditions" name="medical_conditions" rows="2" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <h2>Lifestyle</h2>
        <div class="field">
          <label for="diet_preference">Diet Preference *</label>
          <select id="diet_preference" name="diet_preference" required>
            <option value="">Select</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="flexible">Flexible / No Preference</option>
          </select>
        </div>
        <div class="field">
          <label for="workout_experience">Workout Experience *</label>
          <select id="workout_experience" name="workout_experience" required>
            <option value="">Select</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years consistent)</option>
          </select>
        </div>
        <div class="field">
          <label for="available_days">How many days/week can you train? *</label>
          <select id="available_days" name="available_days" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
        <div class="field">
          <label for="equipment">Equipment Access *</label>
          <select id="equipment" name="equipment" required>
            <option value="">Select</option>
            <option value="full_gym">Full Gym</option>
            <option value="home_basic">Home — Basic (dumbbells + bands)</option>
            <option value="home_none">Home — No equipment</option>
            <option value="mixed">Mix of gym + home</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="wake_time">Usual Wake Time</label>
            <input type="time" id="wake_time" name="wake_time">
          </div>
          <div class="field">
            <label for="sleep_time">Usual Sleep Time</label>
            <input type="time" id="sleep_time" name="sleep_time">
          </div>
        </div>
        <div class="field">
          <label for="stress_level">Stress Level (1-10)</label>
          <input type="range" id="stress_level" name="stress_level" min="1" max="10" value="5">
          <div class="range-labels"><span>Low</span><span>High</span></div>
        </div>
        <div class="field">
          <label for="water_intake">Daily Water Intake</label>
          <select id="water_intake" name="water_intake">
            <option value="">Select</option>
            <option value="less_1L">Less than 1L</option>
            <option value="1-2L">1-2L</option>
            <option value="2-3L">2-3L</option>
            <option value="3L+">3L+</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit & Start</button>
      <div id="formMessage" class="form-message"></div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('leadId').value = params.get('lead') || '';

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      const msg = document.getElementById('formMessage');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      msg.textContent = '';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          msg.textContent = 'Done! We\'ll send your program on WhatsApp soon.';
          msg.className = 'form-message success';
          this.reset();
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'form-message error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit & Start';
      }
    });
  </script>
</body>
</html>
