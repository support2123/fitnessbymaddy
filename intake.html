<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <section class="form-hero">
    <p class="section-eyebrow">New Client Onboarding</p>
    <h1 class="section-title">Let's Get to<br><em>Know You</em></h1>
    <p class="section-body">Fill in your details so Maddy can create a program perfectly tailored to your body, goals, and lifestyle.</p>
  </section>

  <section class="form-section">
    <form id="intakeForm" class="branded-form">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email *</label>
          <input class="form-input" type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="age">Age</label>
          <input class="form-input" type="number" id="age" name="age" min="14" max="80">
        </div>
        <div class="form-group">
          <label class="form-label" for="gender">Gender</label>
          <select class="form-select" id="gender" name="gender">
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="goal">Primary Goal *</label>
        <select class="form-select" id="goal" name="goal" required>
          <option value="">Select your main goal...</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Strength</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="pcos_management">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="sport_specific">Sport-Specific Training</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="current_weight">Current Weight (kg)</label>
          <input class="form-input" type="number" id="current_weight" name="current_weight" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label" for="target_weight">Target Weight (kg)</label>
          <input class="form-input" type="number" id="target_weight" name="target_weight" step="0.1">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="experience_level">Training Experience</label>
        <select class="form-select" id="experience_level" name="experience_level">
          <option value="">Select...</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years consistent)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="injuries">Injuries / Physical Limitations</label>
        <textarea class="form-input form-textarea" id="injuries" name="injuries" rows="3" placeholder="Any past or current injuries, joint issues, back pain, etc."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="medical_conditions">Medical Conditions / Medications</label>
        <textarea class="form-input form-textarea" id="medical_conditions" name="medical_conditions" rows="3" placeholder="PCOS, thyroid, diabetes, blood pressure meds, etc."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="diet_preference">Diet Preference</label>
        <select class="form-select" id="diet_preference" name="diet_preference">
          <option value="">Select...</option>
          <option value="no_preference">No Preference (I eat everything)</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian (Veg + Eggs)</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto / Low Carb</option>
          <option value="halal">Halal</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="schedule">Weekly Availability for Workouts</label>
        <select class="form-select" id="schedule" name="schedule">
          <option value="">Select...</option>
          <option value="3_days">3 days per week</option>
          <option value="4_days">4 days per week</option>
          <option value="5_days">5 days per week</option>
          <option value="6_days">6 days per week</option>
        </select>
      </div>

      <button type="submit" class="btn-primary form-submit">Submit & Start Your Journey</button>

      <div id="formStatus" class="form-status"></div>
    </form>
  </section>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const status = document.getElementById('formStatus');
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    status.className = 'form-status';
    status.textContent = '';

    const data = Object.fromEntries(new FormData(this));

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (res.ok) {
        status.className = 'form-status success';
        status.textContent = 'Done! Your details have been submitted. Maddy will review and your program starts soon.';
        this.reset();
      } else {
        throw new Error(json.error || 'Submission failed');
      }
    } catch (err) {
      status.className = 'form-status error';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit & Start Your Journey';
    }
  });
})();
</script>
</body>
</html>
