<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--cream);
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: var(--mid-grey);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 4px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    select { appearance: none; cursor: pointer; }
    select option { background: var(--charcoal); color: var(--cream); }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--charcoal);
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1>Client Intake Form</h1>
      <p>Tell us about yourself so we can design your perfect program</p>
    </div>

    <form id="intakeForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your name">
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" min="16" max="80" placeholder="25">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Current Weight (kg)</label>
          <input type="number" name="current_weight" step="0.1" placeholder="65">
        </div>
        <div class="form-group">
          <label>Target Weight (kg)</label>
          <input type="number" name="target_weight" step="0.1" placeholder="58">
        </div>
      </div>

      <div class="form-group">
        <label>Experience Level</label>
        <select name="experience_level">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-1 year)</option>
          <option value="intermediate">Intermediate (1-3 years)</option>
          <option value="advanced">Advanced (3+ years)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Training Schedule</label>
        <select name="schedule">
          <option value="">Select</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <div class="form-group">
        <label>Injuries / Medical Conditions</label>
        <textarea name="injuries" placeholder="Any injuries, surgeries, or conditions we should know about..."></textarea>
      </div>

      <div class="form-group">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="">No restriction</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="gluten_free">Gluten Free</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>We've received your details. Your personalized program is being crafted. Check WhatsApp for updates!</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      data.lead_id = leadId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          const err = await res.json();
          alert(err.error || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        }
      } catch {
        alert('Network error. Please check your connection.');
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      }
    });
  </script>
</body>
</html>
