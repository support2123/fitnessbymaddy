<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your onboarding form to start your fitness journey with Maddy.">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">

  <div class="form-header">
    <div class="form-logo">Fitness by Maddy</div>
    <h1 class="form-title">LET'S GET TO KNOW YOU</h1>
    <p class="form-subtitle">Fill this out so Maddy can build your personalised program. Takes about 5 minutes.</p>
  </div>

  <form id="intakeForm" novalidate>
    <input type="hidden" id="leadId" name="lead_id">

    <div class="form-card">
      <div class="form-section-title">BASIC INFO</div>
      <div class="field">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" placeholder="25" min="14" max="80" required>
        </div>
        <div class="field">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" placeholder="165" min="100" max="250">
        </div>
        <div class="field">
          <label for="weight">Current Weight (kg)</label>
          <input type="number" id="weight" name="weight" placeholder="70" min="30" max="250" step="0.1">
        </div>
      </div>
      <div class="field">
        <label for="phone">WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
      </div>
    </div>

    <div class="form-card">
      <div class="form-section-title">YOUR GOALS</div>
      <div class="field">
        <label for="goal">Primary Goal *</label>
        <select id="goal" name="goal" required>
          <option value="">Select your main goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="postnatal">Post-natal Recovery</option>
          <option value="sports">Sports Performance</option>
        </select>
      </div>
      <div class="field">
        <label for="goal_detail">Tell us more about your goal</label>
        <textarea id="goal_detail" name="goal_detail" placeholder="What does your ideal result look like? Any specific target?"></textarea>
      </div>
    </div>

    <div class="form-card">
      <div class="form-section-title">HEALTH & HISTORY</div>
      <div class="field">
        <label for="injuries">Any injuries or physical limitations?</label>
        <textarea id="injuries" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
      </div>
      <div class="field">
        <label for="medical_conditions">Medical conditions or medications?</label>
        <textarea id="medical_conditions" name="medical_conditions" placeholder="E.g., thyroid, diabetes, PCOS, blood pressure meds..."></textarea>
      </div>
      <div class="field">
        <label for="workout_experience">Workout Experience</label>
        <select id="workout_experience" name="workout_experience">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
    </div>

    <div class="form-card">
      <div class="form-section-title">NUTRITION & LIFESTYLE</div>
      <div class="field">
        <label for="diet_preference">Diet Preference</label>
        <select id="diet_preference" name="diet_preference">
          <option value="">Select</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="jain">Jain</option>
        </select>
      </div>
      <div class="field">
        <label for="meals_per_day">Meals per day</label>
        <select id="meals_per_day" name="meals_per_day">
          <option value="">Select</option>
          <option value="2">2 meals</option>
          <option value="3">3 meals</option>
          <option value="4">4 meals</option>
          <option value="5">5+ meals</option>
        </select>
      </div>
      <div class="field">
        <label for="equipment_access">Equipment Access</label>
        <select id="equipment_access" name="equipment_access">
          <option value="">Select</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home (Dumbbells + Bands)</option>
          <option value="home_none">Home (No Equipment)</option>
          <option value="outdoor">Outdoor / Park</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule">How many days/week can you train?</label>
        <select id="schedule" name="schedule">
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    <div id="formMessage" class="form-message"></div>
  </form>

  <div class="form-footer">
    <p class="form-footer-text">Your information is kept private and secure.</p>
    <p class="form-footer-brand">FITNESS BY MADDY</p>
  </div>

</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMessage');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.className = 'form-message';
    msg.style.display = 'none';

    var form = e.target;
    var data = {};
    var fields = form.querySelectorAll('input, select, textarea');
    for (var i = 0; i < fields.length; i++) {
      if (fields[i].name) data[fields[i].name] = fields[i].value;
    }

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.success) {
        msg.textContent = 'Form submitted successfully! We\'ll be in touch on WhatsApp soon.';
        msg.className = 'form-message success';
        form.reset();
      } else {
        throw new Error(result.error || 'Submission failed');
      }
    })
    .catch(function(err) {
      msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
      msg.className = 'form-message error';
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
    });
  });
})();
</script>
</body>
</html>
