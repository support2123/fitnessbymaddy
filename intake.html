<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 24px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); }
    .form-note { font-size: 12px; color: var(--mid-grey); text-align: center; margin-top: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">New Client</p>
    <h1 class="section-title">Tell Us About <em>You</em></h1>
    <p class="section-body" style="margin:0 auto">Help Maddy design the perfect program for your body and goals.</p>
  </div>

  <div id="formContainer">
    <form id="intakeForm" class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="tel" name="phone" class="form-input" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input type="number" name="age" class="form-input" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select name="gender" class="form-select">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg)</label>
          <input type="number" name="current_weight" class="form-input" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">Height (cm)</label>
          <input type="number" name="height" class="form-input">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Primary Goal *</label>
        <select name="goal" class="form-select" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="post_pregnancy">Post-Pregnancy Recovery</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Activity Level</label>
        <select name="activity_level" class="form-select">
          <option value="">Select</option>
          <option value="sedentary">Sedentary (desk job)</option>
          <option value="light">Lightly Active (1-2x/week)</option>
          <option value="moderate">Moderately Active (3-4x/week)</option>
          <option value="very_active">Very Active (5-6x/week)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Injuries / Medical Conditions</label>
        <textarea name="injuries" class="form-textarea" placeholder="Any injuries, surgeries, chronic conditions, medications..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Dietary Preferences</label>
        <select name="diet_pref" class="form-select">
          <option value="">Select</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other (mention in notes)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Available Days for Training</label>
        <select name="schedule" class="form-select">
          <option value="">Select</option>
          <option value="3">3 days/week</option>
          <option value="4">4 days/week</option>
          <option value="5">5 days/week</option>
          <option value="6">6 days/week</option>
        </select>
      </div>

      <button type="submit" class="form-submit">Submit Intake Form</button>
      <p class="form-note">Your information is private and only shared with your coach.</p>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>You're All Set!</h2>
    <p>Maddy's team will review your profile and get back to you on WhatsApp within 24 hours.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = this.querySelector('.form-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var formData = new FormData(this);
    var data = { lead_id: leadId };
    formData.forEach(function(val, key) { data[key] = val; });

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
