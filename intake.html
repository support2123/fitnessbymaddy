<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .form-header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 300;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--charcoal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      min-height: 100px;
      resize: vertical;
    }
    .field select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%236B6B6B' stroke-width='1.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }
    .radio-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .radio-option {
      flex: 1;
      min-width: 100px;
    }
    .radio-option input { display: none; }
    .radio-option label {
      display: block;
      padding: 12px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--mid-grey);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: none;
      letter-spacing: 0;
    }
    .radio-option input:checked + label {
      border-color: var(--gold);
      background: var(--gold);
      color: white;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled {
      background: var(--mid-grey);
      cursor: not-allowed;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 15px;
      line-height: 1.7;
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so Maddy can build your perfect program</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-section">
        <div class="form-section-title">Personal Details</div>
        <div class="field">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="phone">WhatsApp Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="+91..." required>
        </div>
        <div class="field">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" min="14" max="80" required>
        </div>
        <div class="field">
          <label>Gender *</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="male" name="gender" value="male" required>
              <label for="male">Male</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="female" name="gender" value="female">
              <label for="female">Female</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="other" name="gender" value="other">
              <label for="other">Other</label>
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Fitness Profile</div>
        <div class="field">
          <label for="goal">Primary Goal *</label>
          <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness</option>
            <option value="body_recomp">Body Recomposition</option>
          </select>
        </div>
        <div class="field">
          <label for="experience">Experience Level *</label>
          <select id="experience" name="experience_level" required>
            <option value="">Select your level</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6-24 months)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
        <div class="field">
          <label for="currentWeight">Current Weight (kg) *</label>
          <input type="number" id="currentWeight" name="current_weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field">
          <label for="targetWeight">Target Weight (kg)</label>
          <input type="number" id="targetWeight" name="target_weight" step="0.1" min="30" max="250">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Health & Lifestyle</div>
        <div class="field">
          <label for="injuries">Injuries or Physical Limitations</label>
          <textarea id="injuries" name="injuries" placeholder="e.g. lower back pain, knee issue, shoulder impingement..."></textarea>
        </div>
        <div class="field">
          <label for="medical">Medical Conditions</label>
          <textarea id="medical" name="medical_conditions" placeholder="e.g. thyroid, diabetes, PCOS, blood pressure..."></textarea>
        </div>
        <div class="field">
          <label for="diet">Diet Preference *</label>
          <select id="diet" name="diet_preference" required>
            <option value="">Select preference</option>
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="pescatarian">Pescatarian</option>
          </select>
        </div>
        <div class="field">
          <label for="schedule">Workout Schedule Preference *</label>
          <select id="schedule" name="schedule" required>
            <option value="">Select your schedule</option>
            <option value="3_days">3 days/week</option>
            <option value="4_days">4 days/week</option>
            <option value="5_days">5 days/week</option>
            <option value="6_days">6 days/week</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>Thanks for filling out your intake form. Maddy's team will review your details and get your program ready. You'll hear from us on WhatsApp soon!</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) {
      document.getElementById('leadId').value = leadId;
    }

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) { data[key] = value; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errorEl.textContent = result.error || 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        }
      })
      .catch(function() {
        errorEl.textContent = 'Network error. Please check your connection and try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
