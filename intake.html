<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">New Client</p>
      <h1 class="section-title">Intake <em>Form</em></h1>
      <p class="section-body" style="margin:0 auto">Tell us about yourself so we can build your perfect program.</p>
    </div>

    <div class="form-card" id="formCard">
      <form id="intakeForm">
        <input type="hidden" id="leadId" name="lead_id">

        <div class="form-row">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Age *</label>
            <input type="number" name="age" min="14" max="80" required>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Building</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness & Health</option>
            <option value="post_pregnancy">Post-Pregnancy Recovery</option>
            <option value="40plus">40+ Fitness & Mobility</option>
          </select>
        </div>

        <div class="form-group">
          <label>Current Weight (kg)</label>
          <input type="number" name="current_weight" step="0.1">
        </div>

        <div class="form-group">
          <label>Injuries or Medical Conditions</label>
          <textarea name="injuries" placeholder="E.g., knee pain, back issues, PCOS, thyroid, diabetes..."></textarea>
        </div>

        <div class="form-group">
          <label>Current Medications (if any)</label>
          <textarea name="medical_conditions" placeholder="List any medications you're currently taking"></textarea>
        </div>

        <div class="form-group">
          <label>Diet Preference</label>
          <select name="diet_pref">
            <option value="">Select</option>
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="keto">Keto</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Training Schedule (days/week)</label>
          <select name="schedule">
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5" selected>5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>

        <div class="form-group">
          <label>Training Environment</label>
          <select name="environment">
            <option value="gym">Gym (full equipment)</option>
            <option value="home_equipment">Home (dumbbells/bands)</option>
            <option value="home_none">Home (no equipment)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Anything else we should know?</label>
          <textarea name="notes" placeholder="Previous training experience, time constraints, etc."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>Thanks for completing your intake. Your personalised program is being built — we'll reach out on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());
    data.lead_id = document.getElementById('leadId').value;

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Intake Form';
        alert('Something went wrong. Please try again.');
      }
    } catch {
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
      alert('Network error. Please check your connection.');
    }
  });
})();
</script>
</body>
</html>
