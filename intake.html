<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 560px;
      margin: -20px auto 40px;
      padding: 40px 32px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--charcoal);
      letter-spacing: 2px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color 0.3s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    select { appearance: none; cursor: pointer; }
    .required::after {
      content: ' *';
      color: #c0392b;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 14px;
    }
    .error-msg {
      background: #fef0f0;
      color: #c0392b;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 600px) {
      .form-container { margin: -20px 12px 24px; padding: 28px 20px; }
      .form-header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>CLIENT INTAKE FORM</h1>
    <p>Tell us about yourself so we can build your perfect program</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="error"></div>

    <form id="intakeForm">
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="form-section">
        <div class="form-section-title">PERSONAL INFO</div>
        <div class="field">
          <label class="required">Full Name</label>
          <input type="text" name="name" required placeholder="Your full name">
        </div>
        <div class="field">
          <label class="required">Phone Number</label>
          <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" placeholder="your@email.com">
        </div>
        <div class="field">
          <label class="required">Age</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label class="required">Gender</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="field">
          <label class="required">Primary Goal</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="body_recomp">Body Recomposition</option>
            <option value="strength">Strength Building</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="postpartum">Postpartum Recovery</option>
          </select>
        </div>
        <div class="field">
          <label class="required">Current Fitness Level</label>
          <select name="current_fitness" required>
            <option value="">Select level</option>
            <option value="beginner">Beginner (0-6 months training)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years consistent)</option>
          </select>
        </div>
        <div class="field">
          <label>Experience Level</label>
          <select name="experience_level">
            <option value="">Select</option>
            <option value="never">Never worked out before</option>
            <option value="on_off">On and off</option>
            <option value="regular">Regular but plateaued</option>
            <option value="experienced">Experienced lifter</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HEALTH & LIFESTYLE</div>
        <div class="field">
          <label>Injuries or Physical Limitations</label>
          <textarea name="injuries" placeholder="Any injuries, surgeries, or limitations we should know about? (e.g., knee issue, back pain)"></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions</label>
          <textarea name="medical_conditions" placeholder="Any medical conditions? (PCOS, thyroid, diabetes, etc.)"></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_preference">
            <option value="">Select</option>
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="jain">Jain</option>
          </select>
        </div>
        <div class="field">
          <label>Available Schedule</label>
          <select name="schedule">
            <option value="">Select</option>
            <option value="3_days">3 days/week</option>
            <option value="4_days">4 days/week</option>
            <option value="5_days">5 days/week</option>
            <option value="6_days">6 days/week</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="success">
      <h2>FORM SUBMITTED!</h2>
      <p>Thanks! We've got your details. Your coach will review your profile and your personalized program journey begins soon.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('lead_id').value = leadId;

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(v, k) { data[k] = v; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (res.ok) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('success').style.display = 'block';
        } else {
          errEl.textContent = res.data.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
