<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Welcome Aboard</p>
    <h1 class="section-title">Client <em>Intake</em> Form</h1>
    <p class="section-body" style="margin:12px auto 0">Tell us about yourself so we can build the perfect program for you.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" onsubmit="submitIntake(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" name="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-input" name="email" type="email" required placeholder="your@email.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input class="form-input" name="age" type="number" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-input" name="phone" type="tel" placeholder="+91...">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Primary Goal *</label>
        <select class="form-select" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss / Weight Loss</option>
          <option value="muscle_gain">Muscle Gain / Strength</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="pcos_management">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="sport_specific">Sport-Specific Training</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Any Injuries or Physical Limitations?</label>
        <textarea class="form-textarea" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Medical Conditions</label>
        <textarea class="form-textarea" name="medical_conditions" placeholder="E.g., thyroid, diabetes, PCOS, blood pressure... (or 'None')"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Diet Preference</label>
        <select class="form-select" name="diet_preference">
          <option value="">No preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="jain">Jain</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Weekly Training Schedule</label>
        <select class="form-select" name="schedule">
          <option value="">Select availability</option>
          <option value="3_days">3 days per week</option>
          <option value="4_days">4 days per week</option>
          <option value="5_days">5 days per week</option>
          <option value="6_days">6 days per week</option>
          <option value="flexible">Flexible / varies</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Anything Else We Should Know?</label>
        <textarea class="form-textarea" name="notes" placeholder="Previous training experience, supplements you take, sleep schedule..."></textarea>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>You're All Set!</h2>
    <p>Thanks for filling this out. Your coach will review your profile and your program will be built accordingly. Check your WhatsApp for next steps.</p>
  </div>
</div>

<script>
async function submitIntake(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('intake');
  var data = Object.fromEntries(new FormData(form));

  var params = new URLSearchParams(window.location.search);
  data.lead_id = params.get('lead') || '';

  try {
    var res = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT INTAKE FORM';
    alert('Connection error. Please check your internet and try again.');
  }
}
</script>
</body>
</html>
