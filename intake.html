<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #1a1a1a; color: #fff; }
    .intake-wrap {
      max-width: 600px; margin: 0 auto; padding: 24px;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .intake-header {
      text-align: center; padding: 40px 0 32px;
      border-bottom: 2px solid #B8965A; margin-bottom: 32px;
    }
    .intake-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px;
      color: #B8965A; letter-spacing: 3px; text-transform: uppercase;
    }
    .intake-header p { color: #999; font-size: 14px; margin-top: 8px; }
    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 22px;
      color: #B8965A; margin-bottom: 16px; letter-spacing: 1px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #999; margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid #333; border-radius: 4px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: #fff; background: #222; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #B8965A;
    }
    .field textarea { min-height: 100px; resize: vertical; }
    .field select { appearance: none; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .photo-upload {
      border: 2px dashed #333; border-radius: 8px;
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: #B8965A; }
    .photo-upload p { color: #666; font-size: 13px; }
    .photo-upload input { display: none; }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: 4px; border: 1px solid #333;
    }
    .submit-btn {
      width: 100%; padding: 16px; background: #B8965A;
      color: #fff; border: none; border-radius: 4px;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: #a07a3a; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; color: #B8965A; margin-bottom: 12px;
    }
    .success-msg p { color: #999; font-size: 14px; }
    .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="intake-wrap">
    <div class="intake-header">
      <h1>Fitness by Maddy</h1>
      <p>Client Intake Form</p>
    </div>

    <form id="intakeForm">
      <div class="form-section">
        <div class="form-section-title">Personal Details</div>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Age *</label>
            <input type="number" name="age" min="14" max="80" required>
          </div>
          <div class="field">
            <label>Gender *</label>
            <select name="gender" required>
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Height (cm) *</label>
            <input type="number" name="height" min="100" max="250" required>
          </div>
          <div class="field">
            <label>Current Weight (kg) *</label>
            <input type="number" name="weight" min="30" max="300" step="0.1" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Fitness Profile</div>
        <div class="field">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your main goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength</option>
            <option value="toning">Toning & Definition</option>
            <option value="pcos">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="postpartum">Postpartum Recovery</option>
          </select>
        </div>
        <div class="field">
          <label>Experience Level *</label>
          <select name="experience_level" required>
            <option value="">Select</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
        <div class="field">
          <label>Training Schedule (days per week) *</label>
          <select name="schedule" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Health & Nutrition</div>
        <div class="field">
          <label>Diet Preference *</label>
          <select name="diet_preference" required>
            <option value="">Select</option>
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="jain">Jain</option>
            <option value="keto">Keto</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Any Injuries or Physical Limitations?</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions or Medications</label>
          <textarea name="medical_conditions" placeholder="E.g., thyroid, diabetes, PCOS, any medications..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Starting Photos (Optional)</div>
        <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
          <p>Tap to upload front, side & back photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Thank You!</h2>
      <p>Your intake form has been submitted successfully. Maddy's team will review your information and get your program ready.</p>
    </div>
  </div>

  <script>
    var leadId = new URLSearchParams(window.location.search).get('lead');

    document.getElementById('photoInput').addEventListener('change', function(e) {
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      var files = Array.from(e.target.files).slice(0, 3);
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = document.createElement('img');
          img.src = ev.target.result;
          preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      errEl.style.display = 'none';

      var form = e.target;
      var data = {
        lead_id: leadId,
        name: form.name.value.trim(),
        age: parseInt(form.age.value),
        gender: form.gender.value,
        height: parseFloat(form.height.value),
        weight: parseFloat(form.weight.value),
        goal: form.goal.value,
        experience_level: form.experience_level.value,
        schedule: form.schedule.value,
        diet_preference: form.diet_preference.value,
        injuries: form.injuries.value.trim(),
        medical_conditions: form.medical_conditions.value.trim()
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errEl.textContent = err.message || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Intake Form';
      });
    });
  </script>
</body>
</html>
