<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intake Form | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --accent: #8B6914; --red: #c0392b; --green: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; color: var(--gold);
      font-size: 32px; letter-spacing: 3px;
    }
    .form-header p { color: #ccc; font-size: 14px; margin-top: 8px; }
    .form-wrap {
      max-width: 480px; margin: 0 auto; padding: 24px 20px 60px;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      background: #fff; color: var(--charcoal); transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--charcoal);
      color: #fff; border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: wait; }
    .msg { text-align: center; padding: 16px; border-radius: 4px; margin-top: 16px; font-size: 14px; }
    .msg.ok { background: #e8f5e9; color: var(--green); }
    .msg.err { background: #fdecea; color: var(--red); }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Client Intake Form</h1>
  <p>Tell us about yourself so we can build your perfect program</p>
</div>

<form class="form-wrap" id="intakeForm">
  <input type="hidden" name="lead_id" id="lead_id">

  <div class="field">
    <label>Full Name *</label>
    <input type="text" name="name" required placeholder="Your name">
  </div>

  <div class="field">
    <label>Email *</label>
    <input type="email" name="email" required placeholder="you@email.com">
  </div>

  <div class="row">
    <div class="field">
      <label>Age *</label>
      <input type="number" name="age" required min="14" max="80" placeholder="28">
    </div>
    <div class="field">
      <label>Gender</label>
      <select name="gender">
        <option value="">Select</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Height (cm)</label>
      <input type="number" name="height" placeholder="165" min="100" max="250">
    </div>
    <div class="field">
      <label>Weight (kg) *</label>
      <input type="number" name="weight" required placeholder="65" min="30" max="300" step="0.1">
    </div>
  </div>

  <div class="field">
    <label>Primary Goal *</label>
    <select name="goal" required>
      <option value="">Select your goal</option>
      <option value="fat_loss">Fat Loss</option>
      <option value="muscle_gain">Muscle Gain / Toning</option>
      <option value="strength">Strength</option>
      <option value="pcos">PCOS Management</option>
      <option value="general_fitness">General Fitness</option>
      <option value="postpartum">Postpartum Recovery</option>
      <option value="flexibility">Flexibility & Mobility</option>
    </select>
  </div>

  <div class="field">
    <label>Experience Level *</label>
    <select name="experience_level" required>
      <option value="">Select</option>
      <option value="beginner">Beginner (0-6 months)</option>
      <option value="intermediate">Intermediate (6-24 months)</option>
      <option value="advanced">Advanced (2+ years)</option>
    </select>
  </div>

  <div class="field">
    <label>Training Schedule</label>
    <select name="schedule">
      <option value="">How many days can you train?</option>
      <option value="3">3 days/week</option>
      <option value="4">4 days/week</option>
      <option value="5">5 days/week</option>
      <option value="6">6 days/week</option>
    </select>
  </div>

  <div class="field">
    <label>Diet Preference</label>
    <select name="diet_pref">
      <option value="">Select</option>
      <option value="no_preference">No Preference</option>
      <option value="vegetarian">Vegetarian</option>
      <option value="vegan">Vegan</option>
      <option value="eggetarian">Eggetarian</option>
      <option value="non_veg">Non-Veg</option>
      <option value="keto">Keto</option>
    </select>
  </div>

  <div class="field">
    <label>Injuries or Medical Conditions</label>
    <textarea name="injuries" placeholder="List any injuries, surgeries, or conditions we should know about (e.g., knee injury, back pain, thyroid)"></textarea>
  </div>

  <div class="field">
    <label>Current Medications / Supplements</label>
    <textarea name="medical_conditions" placeholder="Any medications or supplements you're taking"></textarea>
  </div>

  <div class="field">
    <label>Anything Else?</label>
    <textarea name="supplements" placeholder="Anything you'd like Maddy to know before building your program"></textarea>
  </div>

  <button type="submit" class="btn-submit" id="submitBtn">Submit Intake Form</button>
  <div id="formMsg" class="msg" style="display:none"></div>
</form>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('lead_id').value = params.get('lead') || '';

  document.getElementById('intakeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.style.display = 'none';

    var data = {};
    new FormData(this).forEach(function(v, k) { data[k] = v; });

    try {
      var res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      var json = await res.json();
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Thank you! Your info has been saved. Maddy will have your program ready soon! 🎉';
        msg.style.display = 'block';
        btn.textContent = 'SUBMITTED ✓';
      } else {
        throw new Error(json.error || 'Submission failed');
      }
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = 'Something went wrong: ' + err.message + '. Please try again.';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
    }
  });
</script>
</body>
</html>
