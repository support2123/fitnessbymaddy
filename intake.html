<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake — Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #FAF8F4;
      color: #2C2C2C;
      min-height: 100vh;
      padding: 0;
    }
    .header {
      background: #2C2C2C;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: #B8965A;
      font-size: 28px;
      letter-spacing: 2px;
    }
    .header p {
      color: #E8E3DC;
      font-size: 13px;
      margin-top: 4px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .intro {
      background: #F0EAE0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
      color: #6B6B6B;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #B8965A;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #E8E3DC;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      background: #FFFFFF;
      color: #2C2C2C;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #B8965A;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .radio-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid #E8E3DC;
      border-radius: 4px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      text-transform: none;
      color: #2C2C2C;
      font-weight: 400;
      transition: border-color 0.2s, background 0.2s;
    }
    .radio-group input { width: auto; margin: 0; }
    .radio-group input:checked + span { color: #B8965A; font-weight: 500; }
    .radio-group label:has(input:checked) {
      border-color: #B8965A;
      background: #FAF5ED;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2C2C2C;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #B8965A; }
    .btn-submit:disabled { background: #C8B89A; cursor: not-allowed; }
    .success {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: #B8965A;
      font-size: 28px;
      margin-bottom: 12px;
    }
    .success p { color: #6B6B6B; font-size: 15px; line-height: 1.6; }
    .error-msg {
      color: #cc3333;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>New Client Intake Form</p>
  </div>

  <div class="container">
    <div class="intro">
      Fill this out so Maddy can build a program just for you. Be honest — the more detail, the better your results.
    </div>

    <form id="intakeForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your name">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" name="phone" id="phoneInput" required placeholder="+91...">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Age *</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Primary Goal *</label>
        <div class="radio-group">
          <label><input type="radio" name="goal" value="fat_loss" required><span>Fat Loss</span></label>
          <label><input type="radio" name="goal" value="muscle_building"><span>Build Muscle</span></label>
          <label><input type="radio" name="goal" value="pcos"><span>PCOS</span></label>
          <label><input type="radio" name="goal" value="strength"><span>Strength</span></label>
          <label><input type="radio" name="goal" value="general"><span>General Fitness</span></label>
          <label><input type="radio" name="goal" value="40plus"><span>40+ Fitness</span></label>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Current Weight (kg)</label>
          <input type="number" name="current_weight" step="0.1" placeholder="65">
        </div>
        <div class="form-group">
          <label>Target Weight (kg)</label>
          <input type="number" name="target_weight" step="0.1" placeholder="58">
        </div>
      </div>

      <div class="form-group">
        <label>Experience Level *</label>
        <select name="experience_level" required>
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="jain">Jain</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weekly Schedule</label>
        <select name="schedule">
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days" selected>5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <div class="form-group">
        <label>Injuries or Physical Limitations</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
      </div>

      <div class="form-group">
        <label>Medical Conditions / Medications</label>
        <textarea name="medical_conditions" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds..."></textarea>
      </div>

      <p class="error-msg" id="errorMsg"></p>
      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Thanks for filling this out. Maddy will review your info and your personalized program will be ready soon. Check your WhatsApp!</p>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var phone = params.get('phone') || params.get('lead');
      if (phone) document.getElementById('phoneInput').value = decodeURIComponent(phone);

      document.getElementById('intakeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var errEl = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';
        errEl.style.display = 'none';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(v, k) { data[k] = v; });

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          if (result.ok) {
            document.getElementById('intakeForm').style.display = 'none';
            document.querySelector('.intro').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          } else {
            throw new Error(result.error || 'Submission failed');
          }
        })
        .catch(function(err) {
          errEl.textContent = err.message || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
        });
      });
    })();
  </script>
</body>
</html>
