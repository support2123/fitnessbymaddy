<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <meta name="description" content="Complete your intake form to get started with your personalized fitness program.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 32px;
      font-weight: 300; color: var(--white); margin-bottom: 8px;
    }
    .form-header h1 em { color: var(--gold); font-style: italic; }
    .form-header p { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
    .form-brand {
      font-family: 'Cormorant Garamond', serif; font-size: 14px;
      letter-spacing: 3px; text-transform: uppercase; color: var(--gold);
      margin-bottom: 20px;
    }

    .form-container {
      max-width: 560px; margin: 0 auto; padding: 40px 24px 60px;
    }
    .form-section {
      margin-bottom: 32px; padding-bottom: 32px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section:last-of-type { border-bottom: none; }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 22px;
      font-weight: 400; color: var(--charcoal); margin-bottom: 20px;
    }
    .form-section-title em { color: var(--gold); font-style: italic; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--white);
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select { appearance: none; cursor: pointer; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-option {
      padding: 10px 18px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer;
      transition: all 0.2s; background: var(--white);
    }
    .radio-option:hover { border-color: var(--gold); }
    .radio-option.selected { border-color: var(--gold); background: var(--gold); color: var(--white); }
    .radio-option input { display: none; }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-option {
      padding: 10px 18px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer;
      transition: all 0.2s; background: var(--white);
    }
    .checkbox-option:hover { border-color: var(--gold); }
    .checkbox-option.selected { border-color: var(--gold); background: var(--gold); color: var(--white); }
    .checkbox-option input { display: none; }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      color: var(--charcoal); margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); }

    .error-msg {
      background: #FEE; border: 1px solid #E88; color: #933;
      padding: 12px 16px; border-radius: 2px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>

<div class="form-header">
  <div class="form-brand">Fitness by Maddy</div>
  <h1>Client <em>Intake</em> Form</h1>
  <p>Tell us about yourself so we can build your perfect program</p>
</div>

<div class="form-container">
  <div class="error-msg" id="errorMsg"></div>

  <form id="intakeForm">
    <div class="form-section">
      <div class="form-section-title">Personal <em>Details</em></div>
      <div class="field">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Age *</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label>Gender *</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" name="height" placeholder="165">
        </div>
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" step="0.1" placeholder="70">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Your <em>Goals</em></div>
      <div class="field">
        <label>Primary Goal *</label>
        <div class="radio-group" data-name="goal">
          <label class="radio-option"><input type="radio" name="goal" value="fat_loss" required>Fat Loss</label>
          <label class="radio-option"><input type="radio" name="goal" value="muscle_gain">Muscle Gain</label>
          <label class="radio-option"><input type="radio" name="goal" value="strength">Strength</label>
          <label class="radio-option"><input type="radio" name="goal" value="toning">Toning</label>
          <label class="radio-option"><input type="radio" name="goal" value="pcos">PCOS Management</label>
          <label class="radio-option"><input type="radio" name="goal" value="general">General Fitness</label>
        </div>
      </div>
      <div class="field">
        <label>Workout Experience *</label>
        <select name="workout_experience" required>
          <option value="">Select level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="field">
        <label>Available Days Per Week *</label>
        <div class="checkbox-group" data-name="available_days">
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="mon">Mon</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="tue">Tue</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="wed">Wed</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="thu">Thu</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="fri">Fri</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="sat">Sat</label>
          <label class="checkbox-option"><input type="checkbox" name="available_days" value="sun">Sun</label>
        </div>
      </div>
      <div class="field">
        <label>Equipment Access *</label>
        <select name="equipment_access" required>
          <option value="">Select</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home — Basic (dumbbells, bands)</option>
          <option value="home_none">Home — No Equipment</option>
          <option value="mixed">Mix of Gym & Home</option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Health <em>Info</em></div>
      <div class="field">
        <label>Current or Past Injuries</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee surgery (2022), shoulder impingement..."></textarea>
      </div>
      <div class="field">
        <label>Medical Conditions / Medications</label>
        <textarea name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure medication..."></textarea>
      </div>
      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="">Select</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="pescatarian">Pescatarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Anything Else We Should Know?</label>
        <textarea name="additional_notes" placeholder="Work schedule, stress levels, sleep patterns, past dieting experience..."></textarea>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>You're all set!</h2>
    <p>Your intake form has been submitted. We'll use this to build your personalized program. Check your WhatsApp for next steps.</p>
  </div>
</div>

<script>
  document.querySelectorAll('.radio-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      var group = opt.closest('.radio-group');
      group.querySelectorAll('.radio-option').forEach(function(o) { o.classList.remove('selected'); });
      opt.classList.add('selected');
    });
  });

  document.querySelectorAll('.checkbox-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      opt.classList.toggle('selected');
    });
  });

  var form = document.getElementById('intakeForm');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorMsg.style.display = 'none';

    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (!leadId) {
      errorMsg.textContent = 'Invalid form link. Please use the link sent to your WhatsApp.';
      errorMsg.style.display = 'block';
      return;
    }

    var days = [];
    document.querySelectorAll('input[name="available_days"]:checked').forEach(function(cb) {
      days.push(cb.value);
    });

    var data = {
      lead_id: leadId,
      name: form.name.value,
      email: form.email.value,
      age: parseInt(form.age.value, 10),
      gender: form.gender.value,
      height: form.height.value ? parseFloat(form.height.value) : null,
      weight: form.weight.value ? parseFloat(form.weight.value) : null,
      goal: form.goal.value,
      workout_experience: form.workout_experience.value,
      available_days: days.join(','),
      equipment_access: form.equipment_access.value,
      injuries: form.injuries.value,
      medical_conditions: form.medical_conditions.value,
      diet_preference: form.diet_preference.value,
      additional_notes: form.additional_notes.value,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.ok) {
        form.style.display = 'none';
        successMsg.style.display = 'block';
      } else {
        errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Intake Form';
      }
    })
    .catch(function() {
      errorMsg.textContent = 'Network error. Please check your connection and try again.';
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Intake Form';
    });
  });
</script>
</body>
</html>
