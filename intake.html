<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #1a1a1a; --gold: #B8965A; --gold-light: #D4AF7A;
      --cream: #FAF8F4; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --sand: #F0EAE0;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .header {
      background: var(--black); padding: 24px 20px; text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 4px; color: white; margin-bottom: 4px;
    }
    .header p { font-size: 13px; color: var(--gold-light); letter-spacing: 1px; }
    .form-wrap {
      max-width: 480px; margin: 0 auto; padding: 32px 20px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 2px; color: var(--gold); margin: 32px 0 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236B6B6B' stroke-width='1.5' fill='none'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 16px center; }
    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-group label {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 400; text-transform: none;
      letter-spacing: 0; color: var(--charcoal); cursor: pointer;
      background: white; padding: 10px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; transition: all 0.2s; flex: 1; min-width: 120px;
    }
    .radio-group input:checked + span { color: var(--gold); font-weight: 600; }
    .radio-group label:has(input:checked) { border-color: var(--gold); background: #faf6f0; }
    .radio-group input { accent-color: var(--gold); }
    .submit-btn {
      width: 100%; padding: 16px; margin-top: 32px;
      background: var(--charcoal); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 3px; cursor: pointer; border-radius: 3px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 12px;
    }
    .success-msg p { font-size: 15px; color: var(--mid-grey); line-height: 1.7; }
    .error-msg {
      background: #fee; border: 1px solid #fcc; color: #a33;
      padding: 12px 16px; border-radius: 3px; font-size: 14px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Client Onboarding Form</p>
  </div>

  <div class="form-wrap">
    <div id="errorMsg" class="error-msg"></div>

    <form id="intakeForm">
      <input type="hidden" id="leadId" name="lead_id">
      <input type="hidden" id="programField" name="program">

      <div class="section-label">PERSONAL DETAILS</div>

      <div class="field">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Email Address *</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field">
        <label>WhatsApp Number *</label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>
      <div class="field">
        <label>Age</label>
        <input type="number" name="age" min="14" max="80" placeholder="25">
      </div>
      <div class="field">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="female"><span>Female</span></label>
          <label><input type="radio" name="gender" value="male"><span>Male</span></label>
          <label><input type="radio" name="gender" value="other"><span>Other</span></label>
        </div>
      </div>

      <div class="section-label">BODY & FITNESS</div>

      <div class="field">
        <label>Current Weight (kg)</label>
        <input type="number" name="current_weight" step="0.1" placeholder="65">
      </div>
      <div class="field">
        <label>Height (cm)</label>
        <input type="number" name="height" step="0.1" placeholder="165">
      </div>
      <div class="field">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss & Shredding</option>
          <option value="muscle_gain">Muscle Building</option>
          <option value="recomp">Body Recomposition</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="strength">Strength & Performance</option>
          <option value="general">General Health & Fitness</option>
        </select>
      </div>
      <div class="field">
        <label>Training Experience</label>
        <select name="experience">
          <option value="beginner">Beginner (0-1 years)</option>
          <option value="intermediate">Intermediate (1-3 years)</option>
          <option value="advanced">Advanced (3+ years)</option>
        </select>
      </div>
      <div class="field">
        <label>Days Available to Train Per Week</label>
        <select name="schedule">
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5" selected>5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>

      <div class="section-label">HEALTH & DIET</div>

      <div class="field">
        <label>Any Injuries or Physical Limitations?</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
      </div>
      <div class="field">
        <label>Medical Conditions or Medications</label>
        <textarea name="medical_conditions" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure medications..."></textarea>
      </div>
      <div class="field">
        <label>Dietary Preference</label>
        <select name="diet_pref">
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>
      <div class="field">
        <label>Food Allergies or Restrictions</label>
        <input type="text" name="allergies" placeholder="E.g., lactose, gluten, nuts...">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT APPLICATION</button>
    </form>

    <div id="successMsg" class="success-msg">
      <h2>APPLICATION RECEIVED</h2>
      <p>Thank you! Maddy's team will review your details and get back to you within 24 hours on WhatsApp.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    if (params.get('lead')) document.getElementById('leadId').value = params.get('lead');
    if (params.get('program')) document.getElementById('programField').value = params.get('program');

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(v, k) { data[k] = v; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(res.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errEl.textContent = err.message || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT APPLICATION';
      });
    });
  </script>
</body>
</html>
