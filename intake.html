<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #B8965A; --black: #1A1A1A; --cream: #FAF8F4; --grey: #6B6B6B; --light: #E8E3DC; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--black); min-height: 100vh; }
    .top-bar { background: var(--black); padding: 16px 24px; text-align: center; }
    .top-bar a { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: white; text-decoration: none; }
    .form-hero { background: var(--black); padding: 40px 24px 48px; text-align: center; }
    .form-hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: white; letter-spacing: 2px; margin-bottom: 8px; }
    .form-hero p { font-size: 14px; color: rgba(255,255,255,0.6); max-width: 400px; margin: 0 auto; line-height: 1.6; }
    .form-wrap { max-width: 480px; margin: -24px auto 40px; padding: 0 16px; }
    .form-card { background: white; border-radius: 8px; padding: 32px 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
    .form-section { margin-bottom: 24px; }
    .form-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--gold); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--light); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--grey); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light); border-radius: 4px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--black);
      background: var(--cream); outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .submit-btn {
      width: 100%; padding: 14px; background: var(--black); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer; border-radius: 4px; transition: background 0.2s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 8px; }
    .success-msg p { font-size: 14px; color: var(--grey); line-height: 1.6; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="top-bar"><a href="index.html">FITNESS BY MADDY</a></div>

  <div class="form-hero">
    <h1>CLIENT INTAKE FORM</h1>
    <p>Tell us about yourself so Maddy can build the perfect program for you.</p>
  </div>

  <div class="form-wrap">
    <form id="intakeForm" class="form-card">
      <div class="form-section">
        <div class="form-section-title">PERSONAL INFO</div>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email">
        </div>
        <div class="field">
          <label>WhatsApp Number *</label>
          <input type="tel" name="phone" id="phoneField" required placeholder="+91 98765 43210">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Age</label>
            <input type="number" name="age" min="14" max="80">
          </div>
          <div class="field">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" name="height" min="100" max="250" placeholder="170">
          </div>
          <div class="field">
            <label>Weight (kg)</label>
            <input type="number" name="weight" min="30" max="300" placeholder="70">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="field">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option>Fat Loss</option>
            <option>Muscle Building</option>
            <option>Body Recomposition</option>
            <option>PCOS Management</option>
            <option>40+ Fitness</option>
            <option>General Health</option>
            <option>Athletic Performance</option>
          </select>
        </div>
        <div class="field">
          <label>Experience Level</label>
          <select name="experience_level">
            <option>Beginner (0-1 years)</option>
            <option>Intermediate (1-3 years)</option>
            <option>Advanced (3+ years)</option>
          </select>
        </div>
        <div class="field">
          <label>Weekly Schedule (days available)</label>
          <select name="schedule">
            <option>3 days/week</option>
            <option>4 days/week</option>
            <option>5 days/week</option>
            <option>6 days/week</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HEALTH & DIET</div>
        <div class="field">
          <label>Injuries / Physical Limitations</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions</label>
          <textarea name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure..."></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_preference">
            <option>No Preference</option>
            <option>Vegetarian</option>
            <option>Vegan</option>
            <option>Eggetarian</option>
            <option>Non-Vegetarian</option>
            <option>Jain</option>
            <option>Keto</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div id="successMsg" class="success-msg hidden">
      <h2>FORM SUBMITTED!</h2>
      <p>Thanks! Maddy's team will review your info and get your program ready. You'll hear from us on WhatsApp soon.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var phoneParam = params.get('phone');
    if (phoneParam) document.getElementById('phoneField').value = phoneParam;

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) { data[key] = value; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        document.getElementById('intakeForm').classList.add('hidden');
        document.getElementById('successMsg').classList.remove('hidden');
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
        alert('Something went wrong. Please try again.');
      });
    });
  </script>
</body>
</html>
