<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your onboarding form to get started with your fitness program.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --success: #4CAF50;
      --error: #E53935;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 28px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select { appearance: none; cursor: pointer; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center;
      padding: 12px;
      border-radius: 2px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: #E8F5E9; color: var(--success); }
    .status-msg.error { display: block; background: #FFEBEE; color: var(--error); }
    .progress-bar {
      height: 3px;
      background: var(--light-grey);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      transition: width 0.3s;
      width: 0%;
    }
    .required::after { content: ' *'; color: var(--error); }
  </style>
</head>
<body>

<div class="form-header">
  <h1>CLIENT INTAKE FORM</h1>
  <p>Tell us about yourself so we can build your perfect program</p>
</div>
<div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

<div class="form-container">
  <form id="intakeForm" novalidate>
    <input type="hidden" id="leadId" name="lead_id">

    <div class="form-section">
      <div class="form-section-title">PERSONAL DETAILS</div>
      <div class="field">
        <label class="required">Full Name</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="field">
        <label class="required">Email</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Phone (with country code)</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="required">Age</label>
          <input type="number" name="age" required min="14" max="80" placeholder="28">
        </div>
        <div class="field">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">FITNESS GOALS</div>
      <div class="field">
        <label class="required">Primary Goal</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general">General Fitness & Health</option>
          <option value="postpartum">Postpartum Recovery</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Experience Level</label>
        <select name="experience">
          <option value="">Select</option>
          <option value="beginner">Beginner (< 6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>
      <div class="field">
        <label>Current Weight (kg)</label>
        <input type="number" name="current_weight" step="0.1" placeholder="70">
      </div>
      <div class="field">
        <label>Target Weight (kg)</label>
        <input type="number" name="target_weight" step="0.1" placeholder="65">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">HEALTH & LIFESTYLE</div>
      <div class="field">
        <label>Any Injuries or Medical Conditions?</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee injury, thyroid, diabetes... Leave blank if none."></textarea>
      </div>
      <div class="field">
        <label>Current Medications (if any)</label>
        <input type="text" name="medical_conditions" placeholder="Leave blank if none">
      </div>
      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_pref">
          <option value="">Select</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Food Allergies</label>
        <input type="text" name="allergies" placeholder="E.g., dairy, gluten, nuts...">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">SCHEDULE & ACCESS</div>
      <div class="field">
        <label>Available Days per Week for Training</label>
        <select name="schedule">
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>
      <div class="field">
        <label>Do you have gym access?</label>
        <select name="gym_access">
          <option value="">Select</option>
          <option value="full_gym">Full gym with all equipment</option>
          <option value="basic_gym">Basic gym (dumbbells, machines)</option>
          <option value="home">Home workout only</option>
          <option value="home_equipment">Home with some equipment</option>
        </select>
      </div>
      <div class="field">
        <label>Preferred Workout Time</label>
        <select name="workout_time">
          <option value="">Select</option>
          <option value="morning">Morning (6-9am)</option>
          <option value="midday">Midday (11am-2pm)</option>
          <option value="evening">Evening (5-8pm)</option>
          <option value="night">Night (8-11pm)</option>
          <option value="flexible">Flexible</option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">ANYTHING ELSE?</div>
      <div class="field">
        <label>Additional Notes for Maddy</label>
        <textarea name="notes" placeholder="Anything else you'd like us to know about your goals, challenges, or preferences..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  const form = document.getElementById('intakeForm');
  const fields = form.querySelectorAll('input, select, textarea');
  const progressFill = document.getElementById('progressFill');

  function updateProgress() {
    let filled = 0;
    let total = 0;
    fields.forEach(f => {
      if (f.type === 'hidden') return;
      total++;
      if (f.value.trim()) filled++;
    });
    progressFill.style.width = Math.round((filled / total) * 100) + '%';
  }

  fields.forEach(f => f.addEventListener('input', updateProgress));
  fields.forEach(f => f.addEventListener('change', updateProgress));

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.className = 'status-msg';

    const data = Object.fromEntries(new FormData(form));

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      const result = await res.json();

      if (res.ok) {
        msg.className = 'status-msg success';
        msg.textContent = 'Thank you! Your information has been submitted. We\'ll be in touch soon.';
        form.reset();
        progressFill.style.width = '100%';
      } else {
        throw new Error(result.error || 'Submission failed');
      }
    } catch (err) {
      msg.className = 'status-msg error';
      msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
      btn.disabled = false;
      btn.textContent = 'SUBMIT';
    }
  });
</script>
</body>
</html>
