<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #D4AF7A; letter-spacing: 3px; }
    .brand p { color: #999; font-size: 14px; margin-top: 4px; }
    h2 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fff; letter-spacing: 1px; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #B8965A; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; background: #2a2a2a; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #B8965A; }
    textarea { resize: vertical; min-height: 80px; }
    select { appearance: none; cursor: pointer; }
    .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-option { flex: 1; min-width: 100px; }
    .radio-option input { display: none; }
    .radio-option label {
      display: flex; align-items: center; justify-content: center;
      padding: 12px; background: #2a2a2a; border: 1px solid #333;
      border-radius: 8px; cursor: pointer; text-transform: none; font-size: 14px; color: #ccc;
    }
    .radio-option input:checked + label { border-color: #B8965A; color: #D4AF7A; background: #2a2a1a; }
    .btn-submit {
      width: 100%; padding: 16px; background: linear-gradient(135deg, #B8965A, #D4AF7A);
      border: none; border-radius: 8px; color: #1a1a1a; font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; cursor: pointer; margin-top: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184,150,90,0.3); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .success { display: none; text-align: center; padding: 40px 20px; }
    .success h2 { color: #D4AF7A; font-size: 32px; }
    .success p { color: #999; margin-top: 12px; }
    .divider { height: 1px; background: #333; margin: 28px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>New Client Onboarding Form</p>
    </div>

    <form id="intakeForm">
      <input type="hidden" id="lead_id" name="lead_id">

      <h2>ABOUT YOU</h2>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Age *</label>
        <input type="number" name="age" required min="14" max="80" placeholder="Your age">
      </div>
      <div class="form-group">
        <label>Gender *</label>
        <div class="radio-group">
          <div class="radio-option"><input type="radio" name="gender" id="g-f" value="female" required><label for="g-f">Female</label></div>
          <div class="radio-option"><input type="radio" name="gender" id="g-m" value="male"><label for="g-m">Male</label></div>
          <div class="radio-option"><input type="radio" name="gender" id="g-o" value="other"><label for="g-o">Other</label></div>
        </div>
      </div>

      <div class="divider"></div>
      <h2>YOUR GOAL</h2>
      <div class="form-group">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="postpartum">Postpartum Recovery</option>
          <option value="general_fitness">General Fitness & Energy</option>
        </select>
      </div>
      <div class="form-group">
        <label>Current Weight (kg)</label>
        <input type="number" name="current_weight" step="0.1" placeholder="e.g. 68.5">
      </div>
      <div class="form-group">
        <label>Target Weight (kg)</label>
        <input type="number" name="target_weight" step="0.1" placeholder="e.g. 58.0">
      </div>

      <div class="divider"></div>
      <h2>HEALTH & LIFESTYLE</h2>
      <div class="form-group">
        <label>Any injuries or physical limitations?</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
      </div>
      <div class="form-group">
        <label>Medical conditions or medications?</label>
        <textarea name="medical_conditions" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds..."></textarea>
      </div>
      <div class="form-group">
        <label>Diet Preference *</label>
        <select name="diet_preference" required>
          <option value="">Select preference</option>
          <option value="no_preference">No Preference (Eat Everything)</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>
      <div class="form-group">
        <label>Workout Schedule / Availability *</label>
        <select name="schedule" required>
          <option value="">How many days can you train?</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">SUBMIT FORM</button>
    </form>

    <div class="success" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Your info has been submitted. Maddy's team will review and get your program ready. Keep an eye on WhatsApp!</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');
    if (leadId) document.getElementById('lead_id').value = leadId;

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
