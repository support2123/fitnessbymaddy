<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #111111; --gold: #B8965A; --gold-light: #D4AF7A;
      --cream: #FAF8F4; --grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--black);
      color: var(--white); min-height: 100vh;
    }
    .form-header {
      background: linear-gradient(180deg, var(--black) 0%, #1a1a1a 100%);
      padding: 60px 24px 40px; text-align: center;
      border-bottom: 1px solid rgba(184,150,90,0.2);
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 48px;
      letter-spacing: 4px; color: var(--gold);
    }
    .form-header p {
      color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 8px;
    }
    .form-wrap {
      max-width: 560px; margin: 0 auto; padding: 40px 24px 80px;
    }
    .field { margin-bottom: 24px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 2px; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field select { appearance: none; }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .section-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      letter-spacing: 2px; color: var(--gold); margin: 40px 0 20px;
      padding-top: 24px; border-top: 1px solid #333;
    }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--gold);
      color: var(--black); font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px; border: none;
      cursor: pointer; transition: background 0.3s; border-radius: 2px;
      margin-top: 32px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
      max-width: 560px; margin: 0 auto;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px;
    }
    .success-msg p { color: rgba(255,255,255,0.6); margin-top: 12px; }
    .photo-upload { position: relative; }
    .photo-upload input[type="file"] {
      padding: 12px; background: #1a1a1a; border: 1px dashed #444;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so Maddy can build your perfect plan.</p>
  </div>

  <form id="intakeForm" class="form-wrap">
    <input type="hidden" id="leadId" name="lead_id">

    <div class="section-label">Personal Details</div>
    <div class="field">
      <label>Full Name *</label>
      <input type="text" name="name" required placeholder="Your full name">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Age *</label>
        <input type="number" name="age" required min="14" max="80" placeholder="25">
      </div>
      <div class="field">
        <label>Gender</label>
        <select name="gender">
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other / Prefer not to say</option>
        </select>
      </div>
    </div>

    <div class="section-label">Fitness Profile</div>
    <div class="field">
      <label>Primary Goal *</label>
      <select name="goal" required>
        <option value="">Select your goal</option>
        <option value="fat_loss">Fat Loss</option>
        <option value="muscle_gain">Muscle Gain</option>
        <option value="body_recomp">Body Recomposition</option>
        <option value="strength">Strength</option>
        <option value="pcos">PCOS Management</option>
        <option value="general">General Health & Fitness</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Current Weight (kg)</label>
        <input type="number" name="current_weight" step="0.1" placeholder="65">
      </div>
      <div class="field">
        <label>Target Weight (kg)</label>
        <input type="number" name="target_weight" step="0.1" placeholder="58">
      </div>
    </div>
    <div class="field">
      <label>Injuries / Physical Limitations</label>
      <textarea name="injuries" placeholder="e.g. Lower back pain, knee issues, shoulder impingement..."></textarea>
    </div>
    <div class="field">
      <label>Medical Conditions</label>
      <textarea name="medical_conditions" placeholder="e.g. PCOS, thyroid, diabetes, blood pressure..."></textarea>
    </div>

    <div class="section-label">Lifestyle</div>
    <div class="field">
      <label>Dietary Preference</label>
      <select name="diet_pref">
        <option value="no_restriction">No Restrictions</option>
        <option value="vegetarian">Vegetarian</option>
        <option value="vegan">Vegan</option>
        <option value="eggetarian">Eggetarian</option>
        <option value="keto">Keto</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Workout Schedule (days per week)</label>
      <select name="schedule">
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="5" selected>5 days</option>
        <option value="6">6 days</option>
      </select>
    </div>

    <div class="section-label">Photos (Optional)</div>
    <div class="field photo-upload">
      <label>Front / Side / Back Photos</label>
      <input type="file" name="photos" accept="image/*" multiple>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>Intake Received!</h2>
    <p>Maddy's team will review your details. Once payment is confirmed, your personalised program kicks off.</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var leadId = params.get('lead');
      if (leadId) document.getElementById('leadId').value = leadId;

      document.getElementById('intakeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';

        var fd = new FormData(this);
        var data = {};
        fd.forEach(function(val, key) {
          if (key !== 'photos') data[key] = val;
        });

        fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) { return r.json(); })
        .then(function() {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
          alert('Something went wrong. Please try again.');
        });
      });
    })();
  </script>
</body>
</html>
