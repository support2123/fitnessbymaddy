<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --red: #C0392B;
      --green: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 20px 24px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: 2px;
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-upload .icon { font-size: 28px; margin-bottom: 8px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 32px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .success-msg p { color: var(--mid-grey); margin-top: 12px; font-size: 15px; }
    .error-msg {
      background: #fef2f2;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CLIENT INTAKE FORM</h1>
    <p>Fitness by Maddy</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="section-label">PERSONAL DETAILS</div>

      <div class="field">
        <label>Full Name *</label>
        <input type="text" name="name" required>
      </div>

      <div class="field">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>

      <div class="field">
        <label>Phone (WhatsApp)</label>
        <input type="tel" name="phone">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Age *</label>
          <input type="number" name="age" min="14" max="80" required>
        </div>
        <div class="field">
          <label>Gender *</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" name="height" min="100" max="250">
        </div>
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" min="30" max="250" step="0.1">
        </div>
      </div>

      <div class="section-label">FITNESS GOALS</div>

      <div class="field">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Management</option>
          <option value="general_fitness">General Fitness</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
      </div>

      <div class="field">
        <label>Target Weight (kg) — optional</label>
        <input type="number" name="target_weight" min="30" max="250" step="0.1">
      </div>

      <div class="section-label">HEALTH & HISTORY</div>

      <div class="field">
        <label>Any injuries or physical limitations?</label>
        <textarea name="injuries" placeholder="e.g., Lower back pain, knee surgery 2 years ago, etc."></textarea>
      </div>

      <div class="field">
        <label>Current medications or medical conditions?</label>
        <textarea name="medical_conditions" placeholder="e.g., Thyroid medication, PCOS diagnosed, etc."></textarea>
      </div>

      <div class="field">
        <label>Current Fitness Level *</label>
        <select name="current_fitness_level" required>
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="section-label">LIFESTYLE</div>

      <div class="field">
        <label>Diet Preference *</label>
        <select name="diet_preference" required>
          <option value="">Select</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="pescatarian">Pescatarian</option>
        </select>
      </div>

      <div class="field">
        <label>Food allergies or restrictions?</label>
        <input type="text" name="food_allergies" placeholder="e.g., Gluten, dairy, nuts">
      </div>

      <div class="field">
        <label>Workout Schedule Preference *</label>
        <select name="schedule" required>
          <option value="">Select</option>
          <option value="morning">Morning (6-9 AM)</option>
          <option value="afternoon">Afternoon (12-3 PM)</option>
          <option value="evening">Evening (5-8 PM)</option>
          <option value="flexible">Flexible</option>
        </select>
      </div>

      <div class="field">
        <label>Days per week available to train? *</label>
        <select name="training_days" required>
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>

      <div class="field">
        <label>Access to gym equipment? *</label>
        <select name="equipment_access" required>
          <option value="">Select</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home (Basic: dumbbells, bands)</option>
          <option value="home_none">Home (No equipment)</option>
        </select>
      </div>

      <div class="section-label">PHOTOS (OPTIONAL)</div>

      <div class="field">
        <label>Front, Side & Back photos help us track your journey</label>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <div class="icon">📸</div>
          <p id="photoLabel">Tap to upload photos</p>
          <input type="file" id="photos" name="photos" accept="image/*" multiple>
        </div>
      </div>

      <div class="field">
        <label>Anything else we should know?</label>
        <textarea name="notes" placeholder="Any additional information, preferences, or questions..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Your intake form has been submitted. Maddy's team will review your details and your program will begin shortly. Check WhatsApp for updates!</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    document.getElementById('photos').addEventListener('change', function() {
      var count = this.files.length;
      document.getElementById('photoLabel').textContent =
        count > 0 ? count + ' photo(s) selected' : 'Tap to upload photos';
    });

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errorEl.style.display = 'none';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) {
        if (key !== 'photos') data[key] = value;
      });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
