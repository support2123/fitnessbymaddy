<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      padding: 24px;
    }
    .form-container {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      border-radius: 4px;
      padding: 48px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--charcoal);
      line-height: 1.1;
    }
    .form-subtitle {
      font-size: 14px;
      color: var(--mid-grey);
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--light-grey);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: var(--charcoal);
      margin-bottom: 20px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.3s;
      margin-top: 32px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 14px; }
    .error-msg {
      background: #FFF0F0;
      color: #CC3333;
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 480px) {
      .form-container { padding: 32px 20px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="form-brand">FITNESS BY MADDY</div>
      <h1 class="form-title">CLIENT INTAKE FORM</h1>
      <p class="form-subtitle">Tell us about yourself so we can build your perfect program</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-input" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" class="form-input" name="email" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input type="number" class="form-input" name="age" min="16" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label">Gender *</label>
          <select class="form-select" name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Height (cm)</label>
          <input type="number" class="form-input" name="height" min="100" max="250">
        </div>
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input type="number" class="form-input" name="weight" step="0.1" required>
        </div>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">FITNESS GOALS</h3>
        <div class="form-group">
          <label class="form-label">Primary Goal *</label>
          <select class="form-select" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness</option>
            <option value="postpartum">Postpartum Recovery</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Experience Level *</label>
          <select class="form-select" name="experience_level" required>
            <option value="">Select</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">How many days can you train per week? *</label>
          <select class="form-select" name="workout_days" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">HEALTH & DIET</h3>
        <div class="form-group">
          <label class="form-label">Diet Preference *</label>
          <select class="form-select" name="diet_preference" required>
            <option value="">Select</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="flexible">Flexible / No Preference</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Any injuries or physical limitations?</label>
          <textarea class="form-textarea" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Medical conditions or medications?</label>
          <textarea class="form-textarea" name="medical_conditions" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <h3 class="form-section-title">SCHEDULE</h3>
        <div class="form-group">
          <label class="form-label">Preferred workout time</label>
          <select class="form-select" name="schedule_preference">
            <option value="">Select</option>
            <option value="morning">Morning (6-9 AM)</option>
            <option value="midday">Midday (11 AM - 2 PM)</option>
            <option value="evening">Evening (5-8 PM)</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Your intake form has been submitted. We'll get your program ready soon. Check WhatsApp for updates!</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('intakeForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.lead_id = leadId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Submission failed');
        }

        form.style.display = 'none';
        successMsg.style.display = 'block';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT INTAKE FORM';
      }
    });
  </script>
</body>
</html>
