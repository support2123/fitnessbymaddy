<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake — Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --error: #C0392B; --success: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream); color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p {
      color: #ccc; font-size: 14px; margin-top: 8px; max-width: 500px;
      margin-left: auto; margin-right: auto;
    }
    .form-container {
      max-width: 540px; margin: -20px auto 40px; padding: 32px 24px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 8px; background: var(--cream); color: var(--charcoal);
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .required::after { content: ' *'; color: var(--error); }
    .btn-submit {
      width: 100%; padding: 14px; font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--gold); color: #fff; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--charcoal); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .msg.error { display: block; background: #fde8e8; color: var(--error); }
    .msg.success { display: block; background: #e8fde8; color: var(--success); }
    .photo-note { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Welcome Aboard</h1>
    <p>Tell us about yourself so we can build your perfect program. This takes about 3 minutes.</p>
  </div>

  <div class="form-container">
    <div id="msg" class="msg"></div>

    <form id="intakeForm" novalidate>
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="field">
        <label class="required" for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>

      <div class="field">
        <label class="required" for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@email.com">
      </div>

      <div class="field">
        <label for="phone">WhatsApp Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label class="required" for="age">Age</label>
        <input type="number" id="age" name="age" required min="14" max="80" placeholder="28">
      </div>

      <div class="field">
        <label class="required" for="goal">Primary Goal</label>
        <select id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle & Strength</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness</option>
          <option value="endurance">Endurance / Cardio</option>
          <option value="postnatal">Post-natal Recovery</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="injuries">Injuries or Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="List any injuries, surgeries, medical conditions, or medications..."></textarea>
      </div>

      <div class="field">
        <label class="required" for="diet_pref">Diet Preference</label>
        <select id="diet_pref" name="diet_pref" required>
          <option value="">Select diet preference</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label class="required" for="experience_level">Experience Level</label>
        <select id="experience_level" name="experience_level" required>
          <option value="">Select your level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6-24 months)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field">
        <label class="required" for="schedule">How many days can you train?</label>
        <select id="schedule" name="schedule" required>
          <option value="">Select training days</option>
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days">5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <div class="field">
        <label for="photos">Progress Photos (optional)</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple>
        <div class="photo-note">Front, side, and back photos help us track your progress.</div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit & Start Your Journey</button>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('lead_id').value = leadId;

    document.getElementById('intakeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'msg';

      var form = e.target;
      var data = {
        lead_id: form.lead_id.value || undefined,
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value || undefined,
        age: form.age.value,
        goal: form.goal.value,
        injuries: form.injuries.value || undefined,
        diet_pref: form.diet_pref.value,
        experience_level: form.experience_level.value,
        schedule: form.schedule.value,
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(result) {
        if (result.ok && result.data.success) {
          msg.className = 'msg success';
          msg.textContent = 'You\'re all set! We\'ll send your program details on WhatsApp soon.';
          form.style.display = 'none';
        } else {
          throw new Error(result.data.error || 'Something went wrong');
        }
      })
      .catch(function(err) {
        msg.className = 'msg error';
        msg.textContent = err.message || 'Failed to submit. Please try again.';
        btn.disabled = false;
        btn.textContent = 'SUBMIT & START YOUR JOURNEY';
      });
    });
  </script>
</body>
</html>
