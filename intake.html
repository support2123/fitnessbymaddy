<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --red: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 20px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 36px;
      letter-spacing: 3px;
    }
    .form-header p {
      color: #aaa;
      font-size: 14px;
      margin-top: 6px;
    }
    .form-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .field {
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      background: white;
      color: var(--charcoal);
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .field-hint {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .success-msg p {
      color: var(--mid-grey);
      margin-top: 10px;
      font-size: 15px;
    }
    .error-msg {
      background: #fdeaea;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so we can build your perfect program</p>
  </div>

  <div class="form-wrap">
    <div class="error-msg" id="error"></div>

    <form id="intakeForm">
      <div class="field">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your name">
      </div>

      <div class="field">
        <label>Phone Number *</label>
        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Age *</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss / Weight Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="postpartum">Post-Pregnancy Recovery</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Training Experience</label>
        <select name="experience">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field">
        <label>Injuries or Physical Limitations</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee injury, shoulder impingement — or 'None'"></textarea>
        <div class="field-hint">Be honest — this helps us keep you safe</div>
      </div>

      <div class="field">
        <label>Medical Conditions / Medications</label>
        <textarea name="medical" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds — or 'None'"></textarea>
      </div>

      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="">Select</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto / Low Carb</option>
        </select>
      </div>

      <div class="field">
        <label>Weekly Workout Schedule</label>
        <select name="schedule">
          <option value="">Select</option>
          <option value="3_days">3 days per week</option>
          <option value="4_days">4 days per week</option>
          <option value="5_days">5 days per week</option>
          <option value="6_days">6 days per week</option>
          <option value="flexible">Flexible</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Intake Form</button>
    </form>

    <div class="success-msg" id="success">
      <h2>Thank You!</h2>
      <p>Your intake form has been received. Maddy's team will reach out to you on WhatsApp shortly with your program details.</p>
    </div>
  </div>

  <script>
    var form = document.getElementById('intakeForm');
    var errorEl = document.getElementById('error');
    var successEl = document.getElementById('success');
    var submitBtn = document.getElementById('submitBtn');

    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      var data = {
        lead_id: leadId || null,
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        age: form.age.value,
        gender: form.gender.value,
        goal: form.goal.value,
        experience: form.experience.value,
        injuries: form.injuries.value.trim(),
        medical: form.medical.value.trim(),
        diet_preference: form.diet_preference.value,
        schedule: form.schedule.value
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.ok) {
          form.style.display = 'none';
          successEl.style.display = 'block';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errorEl.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
