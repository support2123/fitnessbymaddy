<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake Form | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #1a1a1a; color: #fff; }
    .intake-wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
    .intake-header { text-align: center; padding: 40px 0 32px; border-bottom: 2px solid #B8965A; margin-bottom: 32px; }
    .intake-brand { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 6px; color: #B8965A; text-transform: uppercase; margin-bottom: 8px; }
    .intake-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: #fff; }
    .intake-sub { font-size: 13px; color: #888; margin-top: 8px; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #B8965A; margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; background: #222; border: 1.5px solid #333;
      border-radius: 4px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #B8965A; }
    .field textarea { min-height: 80px; resize: vertical; }
    .field select { appearance: none; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn {
      width: 100%; padding: 16px; background: #B8965A; color: #1a1a1a;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px;
      cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: #D4AF7A; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #B8965A; margin-bottom: 12px; }
    .success-msg p { font-size: 14px; color: #888; }
    .error-msg { background: #4a1c1c; color: #ff6b6b; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; display: none; }
    .required::after { content: ' *'; color: #ff6b6b; }
  </style>
</head>
<body>
<div class="page-wrap" style="padding-top:0">
  <div class="intake-wrap">
    <div class="intake-header">
      <div class="intake-brand">Fitness by Maddy</div>
      <div class="intake-title">Client Intake Form</div>
      <div class="intake-sub">Tell us about yourself so we can build the perfect program for you</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="intakeForm">
      <div class="field">
        <label class="required">Full Name</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="field-row">
        <div class="field">
          <label class="required">Phone (WhatsApp)</label>
          <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="field">
          <label class="required">Email</label>
          <input type="email" name="email" required placeholder="you@email.com">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="required">Age</label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label class="required">Gender</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other / Prefer not to say</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="required">Primary Goal</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Management</option>
          <option value="general_fitness">General Fitness & Toning</option>
          <option value="postnatal">Postnatal Recovery</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="current_weight" step="0.1" placeholder="65">
        </div>
        <div class="field">
          <label>Target Weight (kg)</label>
          <input type="number" name="target_weight" step="0.1" placeholder="58">
        </div>
      </div>

      <div class="field">
        <label class="required">Experience Level</label>
        <select name="experience_level" required>
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field">
        <label>Workout Schedule Preference</label>
        <select name="schedule">
          <option value="3_days">3 days/week</option>
          <option value="4_days">4 days/week</option>
          <option value="5_days" selected>5 days/week</option>
          <option value="6_days">6 days/week</option>
        </select>
      </div>

      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="no_restriction">No restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <div class="field">
        <label>Injuries or Physical Limitations</label>
        <textarea name="injuries" placeholder="List any injuries, surgeries, or limitations (e.g., bad knee, lower back pain)"></textarea>
      </div>

      <div class="field">
        <label>Medical Conditions or Medications</label>
        <textarea name="medical_conditions" placeholder="PCOS, thyroid, diabetes, blood pressure medication, etc."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Form Submitted!</h2>
      <p>Thanks! Maddy's team will review your details and your program will be ready within 24 hours of payment confirmation.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });
    data.lead_id = leadId;

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(result) {
      if (result.ok) {
        document.getElementById('intakeForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        errEl.textContent = result.data.error || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Intake Form';
      }
    })
    .catch(function() {
      errEl.textContent = 'Network error. Please check your connection and try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
    });
  });
})();
</script>
</body>
</html>
