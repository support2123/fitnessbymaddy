<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 20px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Let's Get Started</p>
    <h1 class="section-title">Client <em>Intake</em> Form</h1>
    <p class="section-body" style="margin:12px auto 0">Tell us about yourself so we can build the perfect program for you.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" onsubmit="submitIntake(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" name="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" name="email" type="email" placeholder="your@email.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input class="form-input" name="age" type="number" required min="14" max="80" placeholder="25">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg)</label>
          <input class="form-input" name="current_weight" type="number" step="0.1" placeholder="65">
        </div>
        <div class="form-group">
          <label class="form-label">Height (cm)</label>
          <input class="form-input" name="height" type="number" placeholder="165">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Primary Goal *</label>
        <select class="form-select" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Lean Bulk</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos_management">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Health</option>
          <option value="post_pregnancy">Post-Pregnancy Recovery</option>
          <option value="40plus_fitness">40+ Fitness & Mobility</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Training Experience</label>
        <select class="form-select" name="training_experience">
          <option value="">Select</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Diet Preference</label>
        <select class="form-select" name="diet_preference">
          <option value="">Select</option>
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">How many days/week can you train? *</label>
        <select class="form-select" name="schedule" required>
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Any injuries or medical conditions?</label>
        <textarea class="form-textarea" name="injuries" placeholder="E.g., lower back pain, knee issues, thyroid, PCOS..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Current medications (if any)</label>
        <textarea class="form-textarea" name="medical_conditions" placeholder="List any medications you're currently taking"></textarea>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Thank You!</h2>
    <p>Your intake form has been submitted. We'll start building your personalized program right away.</p>
  </div>
</div>

<script>
async function submitIntake(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (!leadId) {
    errorEl.textContent = 'Invalid form link. Please use the link sent to your WhatsApp.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'SUBMIT INTAKE FORM';
    return;
  }

  const data = Object.fromEntries(new FormData(form));
  data.lead_id = leadId;

  try {
    const resp = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || 'Submission failed');

    document.getElementById('intakeForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'SUBMIT INTAKE FORM';
  }
}
</script>
</body>
</html>
