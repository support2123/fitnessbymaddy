<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; color: var(--white);
      font-size: 32px; font-weight: 600; letter-spacing: 2px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; margin-top: 8px; }
    .form-container {
      max-width: 520px; margin: -20px auto 40px; padding: 0 16px;
    }
    .form-card {
      background: var(--white); border-radius: 4px; padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .form-section { margin-bottom: 28px; }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      font-weight: 600; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-hint { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); border: none; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 3px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px;
      border-radius: 3px; font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fdecea; color: var(--error); }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 4px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .photo-preview img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Let's build your personalised program</p>
  </div>

  <div class="form-container">
    <form class="form-card" id="intakeForm">
      <input type="hidden" name="lead_id" id="leadId">

      <div class="form-section">
        <div class="form-section-title">Personal Details</div>
        <div class="field">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="phone">WhatsApp Number *</label>
          <input type="tel" id="phone" name="phone" required placeholder="+91XXXXXXXXXX">
        </div>
        <div class="field">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" min="14" max="80" required>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Fitness Profile</div>
        <div class="field">
          <label for="goal">Primary Goal *</label>
          <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength Building</option>
            <option value="pcos">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="postpartum">Postpartum Recovery</option>
            <option value="sport_specific">Sport-Specific</option>
          </select>
        </div>
        <div class="field">
          <label for="injuries">Injuries / Medical Conditions</label>
          <textarea id="injuries" name="injuries" placeholder="List any injuries, surgeries, or medical conditions..."></textarea>
          <div class="field-hint">Include current medications if relevant</div>
        </div>
        <div class="field">
          <label for="diet_pref">Dietary Preference</label>
          <select id="diet_pref" name="diet_pref">
            <option value="no_restriction">No Restriction</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="jain">Jain</option>
            <option value="keto">Keto</option>
            <option value="halal">Halal</option>
            <option value="gluten_free">Gluten-Free</option>
          </select>
        </div>
        <div class="field">
          <label for="schedule">Training Schedule</label>
          <select id="schedule" name="schedule">
            <option value="3_days">3 days/week</option>
            <option value="4_days">4 days/week</option>
            <option value="5_days">5 days/week</option>
            <option value="6_days">6 days/week</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
        <div class="field">
          <label for="experience">Training Experience</label>
          <select id="experience" name="experience">
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6-24 months)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Current Stats</div>
        <div class="field">
          <label for="weight">Current Weight (kg)</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250">
        </div>
        <div class="field">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" min="100" max="230">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Progress Photos</div>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side, and back photos</p>
          <input type="file" id="photos" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
        <div class="field-hint">Photos help us track your transformation accurately</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    var photoUpload = document.getElementById('photoUpload');
    var photosInput = document.getElementById('photos');
    var photoPreview = document.getElementById('photoPreview');

    photoUpload.addEventListener('click', function() { photosInput.click(); });

    photosInput.addEventListener('change', function() {
      photoPreview.innerHTML = '';
      var files = photosInput.files;
      for (var i = 0; i < files.length && i < 5; i++) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(files[i]);
        photoPreview.appendChild(img);
      }
    });

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'status-msg';

      var data = {
        lead_id: document.getElementById('leadId').value || undefined,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        age: document.getElementById('age').value,
        goal: document.getElementById('goal').value,
        injuries: document.getElementById('injuries').value,
        diet_pref: document.getElementById('diet_pref').value,
        schedule: document.getElementById('schedule').value,
      };

      try {
        var res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          msg.textContent = "You're all set! We'll send your program via WhatsApp once payment is confirmed.";
          msg.className = 'status-msg success';
          btn.textContent = 'SUBMITTED ✓';
        } else {
          var err = await res.json();
          throw new Error(err.error || 'Submission failed');
        }
      } catch (error) {
        msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        msg.className = 'status-msg error';
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
      }
    });
  </script>
</body>
</html>
