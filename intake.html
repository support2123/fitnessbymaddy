<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0D0D0D;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --error: #D32F2F;
      --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: white;
      min-height: 100vh;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .brand p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
    }
    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%23B8965A' stroke-width='2'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    .form-select option {
      background: var(--charcoal);
      color: white;
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }
    .btn-submit:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status-msg {
      text-align: center;
      padding: 16px;
      border-radius: 4px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: rgba(46,125,50,0.2); color: #81C784; }
    .status-msg.error { display: block; background: rgba(211,47,47,0.2); color: #EF9A9A; }
    .required::after { content: ' *'; color: var(--gold); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Client Onboarding Form</p>
    </div>

    <form id="intakeForm">
      <div class="form-section">
        <div class="form-section-title">PERSONAL INFO</div>
        <div class="form-group">
          <label class="form-label required">Full Name</label>
          <input type="text" class="form-input" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label required">Email</label>
          <input type="email" class="form-input" name="email" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Age</label>
            <input type="number" class="form-input" name="age" min="14" max="80" required>
          </div>
          <div class="form-group">
            <label class="form-label required">Gender</label>
            <select class="form-select" name="gender" required>
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Height (cm)</label>
            <input type="number" class="form-input" name="height" min="100" max="250" required>
          </div>
          <div class="form-group">
            <label class="form-label required">Weight (kg)</label>
            <input type="number" class="form-input" name="weight" min="30" max="300" step="0.1" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="form-group">
          <label class="form-label required">Primary Goal</label>
          <select class="form-select" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength & Performance</option>
            <option value="toning">Toning & Definition</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness</option>
            <option value="sports">Sports Performance</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Injuries / Medical Conditions</label>
          <textarea class="form-textarea" name="injuries" placeholder="List any current injuries, surgeries, or medical conditions..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Current Medications</label>
          <input type="text" class="form-input" name="medical_conditions" placeholder="Any medications you're currently taking">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">LIFESTYLE</div>
        <div class="form-group">
          <label class="form-label required">Diet Preference</label>
          <select class="form-select" name="diet_preference" required>
            <option value="">Select</option>
            <option value="no_restriction">No Restriction</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="pescatarian">Pescatarian</option>
            <option value="jain">Jain</option>
            <option value="halal">Halal</option>
            <option value="keto">Keto</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label required">Days Available to Workout</label>
          <select class="form-select" name="workout_days" required>
            <option value="">Select</option>
            <option value="3">3 days/week</option>
            <option value="4">4 days/week</option>
            <option value="5">5 days/week</option>
            <option value="6">6 days/week</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label required">Equipment Access</label>
          <select class="form-select" name="equipment_access" required>
            <option value="">Select</option>
            <option value="full_gym">Full Gym</option>
            <option value="home_basic">Home (Dumbbells + Bands)</option>
            <option value="home_none">Home (No Equipment)</option>
            <option value="outdoor">Outdoor / Park</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Wake Time</label>
            <input type="time" class="form-input" name="wake_time">
          </div>
          <div class="form-group">
            <label class="form-label">Sleep Time</label>
            <input type="time" class="form-input" name="sleep_time">
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var form = document.getElementById('intakeForm');
    var statusMsg = document.getElementById('statusMsg');
    var submitBtn = document.getElementById('submitBtn');

    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      statusMsg.className = 'status-msg';

      var formData = new FormData(form);
      var data = { lead_id: leadId };
      formData.forEach(function(value, key) { data[key] = value; });

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Form submitted successfully! Maddy\'s team will reach out shortly.';
          form.reset();
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Error: ' + err.message + '. Please try again.';
      })
      .finally(function() {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT INTAKE FORM';
      });
    });
  </script>
</body>
</html>
