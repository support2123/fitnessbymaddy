<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <meta name="description" content="Complete your intake form to get started with your Fitness by Maddy program.">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">
  <div class="form-header">
    <div class="form-header-logo">Fitness by Maddy</div>
    <h1 class="form-header-title">CLIENT INTAKE FORM</h1>
    <p class="form-header-sub">Tell us about yourself so we can build your perfect plan</p>
  </div>

  <div class="form-container">
    <div id="msg" class="msg"></div>

    <form id="intakeForm" novalidate>
      <input type="hidden" id="lead_id" name="lead_id">

      <div class="form-section-title">PERSONAL INFO</div>

      <div class="field">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Age <span class="required">*</span></label>
          <input type="number" name="age" required min="14" max="80" placeholder="25">
        </div>
        <div class="field">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" name="height" placeholder="165">
        </div>
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" step="0.1" placeholder="65">
        </div>
      </div>

      <div class="form-section-title">FITNESS GOALS</div>

      <div class="field">
        <label>Primary Goal <span class="required">*</span></label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Building</option>
          <option value="recomp">Body Recomposition</option>
          <option value="strength">Strength Training</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general">General Fitness</option>
          <option value="40plus">40+ Fitness</option>
        </select>
      </div>

      <div class="field">
        <label>Experience Level <span class="required">*</span></label>
        <select name="experience" required>
          <option value="">Select</option>
          <option value="beginner">Beginner (0-1 years)</option>
          <option value="intermediate">Intermediate (1-3 years)</option>
          <option value="advanced">Advanced (3+ years)</option>
        </select>
      </div>

      <div class="field">
        <label>Where Will You Train?</label>
        <select name="schedule">
          <option value="gym">Gym</option>
          <option value="home">Home</option>
          <option value="both">Both Gym & Home</option>
        </select>
      </div>

      <div class="form-section-title">HEALTH & DIET</div>

      <div class="field">
        <label>Any Injuries or Medical Conditions?</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee surgery, PCOS, thyroid, diabetes..."></textarea>
      </div>

      <div class="field">
        <label>Currently on Any Medication?</label>
        <textarea name="medical" placeholder="List any medications or supplements you're currently taking"></textarea>
      </div>

      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_pref">
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>
  </div>

  <div class="form-footer">
    <a href="https://fitnessbymaddy.com">fitnessbymaddy.com</a> &middot; Your data is safe with us
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');
  if (leadId) document.getElementById('lead_id').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>SUBMITTING...';
    msg.className = 'msg';
    msg.style.display = 'none';

    var fd = new FormData(this);
    var data = {};
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.ok) {
        msg.className = 'msg success';
        msg.textContent = 'Thank you! Your intake form has been submitted. We\'ll be in touch soon on WhatsApp.';
        msg.style.display = 'block';
        btn.innerHTML = 'SUBMITTED ✓';
        document.getElementById('intakeForm').reset();
      } else {
        throw new Error(result.error || 'Something went wrong');
      }
    })
    .catch(function(err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Failed to submit. Please try again.';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'SUBMIT INTAKE FORM';
    });
  });
})();
</script>
</body>
</html>
