<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111111;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --cream: #FAF8F4;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 20px 24px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 4px;
      color: var(--gold);
    }
    .header p {
      font-size: 12px;
      color: #999;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,150,90,0.3);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1.5px solid #333;
      border-radius: 4px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%23999' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    .field textarea {
      resize: vertical;
      min-height: 80px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 32px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold-light); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .success-msg p {
      color: #999;
      margin-top: 12px;
      font-size: 14px;
    }
    .photo-upload {
      border: 2px dashed #333;
      border-radius: 4px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>CLIENT INTAKE FORM</h1>
    <p>FITNESS BY MADDY</p>
  </div>

  <div class="form-container">
    <form id="intakeForm">
      <div class="section-label">PERSONAL DETAILS</div>

      <div class="field">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="field">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="field">
        <label>Phone (with country code) *</label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>

      <div class="row">
        <div class="field">
          <label>Age *</label>
          <input type="number" name="age" required min="16" max="80" placeholder="25">
        </div>
        <div class="field">
          <label>Gender *</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Height (cm) *</label>
          <input type="number" name="height" required min="100" max="250" placeholder="170">
        </div>
        <div class="field">
          <label>Current Weight (kg) *</label>
          <input type="number" name="weight" required min="30" max="300" step="0.1" placeholder="70">
        </div>
      </div>

      <div class="section-label">FITNESS GOALS</div>

      <div class="field">
        <label>Primary Goal *</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option>Fat Loss</option>
          <option>Muscle Building</option>
          <option>Body Recomposition</option>
          <option>Strength Training</option>
          <option>PCOS Management</option>
          <option>General Fitness</option>
          <option>Athletic Performance</option>
        </select>
      </div>

      <div class="field">
        <label>Experience Level *</label>
        <select name="experience_level" required>
          <option value="">Select</option>
          <option>Complete Beginner</option>
          <option>Beginner (0-1 years)</option>
          <option>Intermediate (1-3 years)</option>
          <option>Advanced (3+ years)</option>
        </select>
      </div>

      <div class="field">
        <label>How many days per week can you work out? *</label>
        <select name="workout_schedule" required>
          <option value="">Select</option>
          <option>3 days</option>
          <option>4 days</option>
          <option>5 days</option>
          <option>6 days</option>
        </select>
      </div>

      <div class="section-label">HEALTH & DIET</div>

      <div class="field">
        <label>Diet Preference *</label>
        <select name="diet_preference" required>
          <option value="">Select</option>
          <option>Non-Vegetarian</option>
          <option>Vegetarian</option>
          <option>Vegan</option>
          <option>Eggetarian</option>
          <option>No Preference</option>
        </select>
      </div>

      <div class="field">
        <label>Any injuries? (current or past)</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee surgery in 2022, shoulder impingement..."></textarea>
      </div>

      <div class="field">
        <label>Medical conditions or medications</label>
        <textarea name="medical_conditions" placeholder="E.g., thyroid, diabetes, PCOS, blood pressure meds..."></textarea>
      </div>

      <div class="section-label">PHOTOS (OPTIONAL)</div>
      <div class="field">
        <label>Upload 3 progress photos (front, side, back)</label>
        <input type="file" name="photos" accept="image/*" multiple style="color:#999;">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>FORM SUBMITTED</h2>
      <p>Thanks! Your coach will review this and your program will be customized accordingly. Check WhatsApp for updates.</p>
    </div>
  </div>

  <script>
    var form = document.getElementById('intakeForm');
    var btn = document.getElementById('submitBtn');
    var successMsg = document.getElementById('successMsg');

    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(form);
      var data = {};
      formData.forEach(function(val, key) {
        if (key !== 'photos') data[key] = val;
      });
      data.lead_id = leadId;

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
          alert('Error: ' + (result.error || 'Something went wrong. Please try again.'));
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
        alert('Network error. Please check your connection and try again.');
      });
    });
  </script>
</body>
</html>
