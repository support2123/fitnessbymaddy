<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--black); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 32px 24px;
      background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .form-section { margin-bottom: 28px; }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--charcoal); letter-spacing: 1px; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.2s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 40px 24px;
    }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>CLIENT INTAKE FORM</h1>
    <p>Tell us about yourself so we can build your perfect program</p>
  </div>

  <div class="form-container" id="formContainer">
    <form id="intakeForm">
      <div class="form-section">
        <div class="form-section-title">PERSONAL DETAILS</div>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label>Email *</label>
          <input type="email" name="email" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Age *</label>
            <input type="number" name="age" min="16" max="80" required>
          </div>
          <div class="field">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" name="height" placeholder="165">
          </div>
          <div class="field">
            <label>Current Weight (kg)</label>
            <input type="number" name="weight" placeholder="70">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FITNESS GOALS</div>
        <div class="field">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness & Health</option>
            <option value="post_pregnancy">Post-Pregnancy Recovery</option>
          </select>
        </div>
        <div class="field">
          <label>Experience Level</label>
          <select name="experience_level">
            <option value="beginner">Beginner (0-1 year)</option>
            <option value="intermediate">Intermediate (1-3 years)</option>
            <option value="advanced">Advanced (3+ years)</option>
          </select>
        </div>
        <div class="field">
          <label>How many days/week can you train?</label>
          <select name="schedule">
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5" selected>5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HEALTH & DIET</div>
        <div class="field">
          <label>Injuries or Limitations</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder surgery..."></textarea>
        </div>
        <div class="field">
          <label>Medical Conditions</label>
          <textarea name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure..."></textarea>
        </div>
        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_pref">
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Veg (all foods)</option>
            <option value="keto">Keto</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>FORM SUBMITTED!</h2>
    <p>Thank you! Your intake details have been received. Your coach will review them and your customized program will be prepared shortly.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      data.lead_id = leadId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
        alert('Network error. Please check your connection and try again.');
      }
    });
  </script>
</body>
</html>
