<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 24px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">New Client</p>
      <h1 class="section-title">Intake <em>Form</em></h1>
      <p class="section-body" style="margin:0 auto">Tell us about yourself so we can build your perfect program.</p>
    </div>

    <div class="form-card" id="intakeForm">
      <form id="intake" onsubmit="submitIntake(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Age *</label>
            <input type="number" name="age" min="16" max="80" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phone *</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
          </div>
        </div>

        <div class="form-group">
          <label>Primary Goal *</label>
          <select name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss / Weight Loss</option>
            <option value="muscle_gain">Muscle Gain / Strength</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="40plus">40+ Fitness & Mobility</option>
            <option value="general">General Fitness & Energy</option>
            <option value="sport">Sport-Specific Training</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Current Weight (kg)</label>
            <input type="number" name="current_weight" step="0.1">
          </div>
          <div class="form-group">
            <label>Height (cm)</label>
            <input type="number" name="height" step="0.1">
          </div>
        </div>

        <div class="form-group">
          <label>Experience Level *</label>
          <select name="experience_level" required>
            <option value="">Select level</option>
            <option value="beginner">Beginner (0-1 year)</option>
            <option value="intermediate">Intermediate (1-3 years)</option>
            <option value="advanced">Advanced (3+ years)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Injuries or Medical Conditions</label>
          <textarea name="injuries" placeholder="Any injuries, conditions, or medications we should know about..."></textarea>
        </div>

        <div class="form-group">
          <label>Diet Preference *</label>
          <select name="diet_preference" required>
            <option value="">Select preference</option>
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="keto">Keto</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Weekly Schedule *</label>
          <select name="schedule" required>
            <option value="">How many days can you train?</option>
            <option value="3">3 days/week</option>
            <option value="4">4 days/week</option>
            <option value="5">5 days/week</option>
            <option value="6">6 days/week</option>
          </select>
        </div>

        <div class="form-group">
          <label>Current Photos (optional)</label>
          <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <p>Tap to upload front, side & back photos</p>
          </div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>You're All Set!</h2>
      <p>We've received your details. Your personalized program is being crafted. You'll hear from us on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
async function submitIntake(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('intake');
  var data = Object.fromEntries(new FormData(form));
  var params = new URLSearchParams(window.location.search);
  data.lead_id = params.get('lead');

  try {
    var res = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT INTAKE FORM';
    alert('Network error. Please check your connection.');
  }
}
</script>
</body>
</html>
