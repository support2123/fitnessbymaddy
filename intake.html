<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 24px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Let's Get Started</p>
    <h1 class="section-title">Client <em>Intake</em> Form</h1>
    <p class="section-body" style="margin:12px auto 0">Tell us about yourself so we can build the perfect program for you.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age *</label>
          <input type="number" name="age" class="form-input" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select name="gender" class="form-select">
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Primary Goal *</label>
        <select name="goal" class="form-select" required>
          <option value="">Select your main goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="postpartum">Postpartum Recovery</option>
          <option value="40plus">40+ Fitness & Mobility</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg)</label>
          <input type="number" name="current_weight" class="form-input" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">Target Weight (kg)</label>
          <input type="number" name="target_weight" class="form-input" step="0.1">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Training Days per Week *</label>
        <select name="training_days" class="form-select" required>
          <option value="">How many days can you train?</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Available Equipment</label>
        <select name="equipment" class="form-select">
          <option value="full_gym">Full Gym Access</option>
          <option value="home_basic">Home (Dumbbells + Bands)</option>
          <option value="home_none">Home (No Equipment)</option>
          <option value="outdoor">Outdoor / Bodyweight</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Diet Preference</label>
        <select name="diet_preference" class="form-select">
          <option value="no_preference">No Preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Any Injuries or Physical Limitations?</label>
        <textarea name="injuries" class="form-textarea" placeholder="E.g., lower back pain, knee issues, shoulder impingement..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Medical Conditions / Medications</label>
        <textarea name="medical_conditions" class="form-textarea" placeholder="E.g., thyroid, diabetes, PCOS, blood pressure meds..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Wake Time</label>
          <input type="time" name="wake_time" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Sleep Time</label>
          <input type="time" name="sleep_time" class="form-input">
        </div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>You're All Set!</h2>
    <p>We've received your info. Your personalised program is being prepared. Check WhatsApp for updates!</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');

  document.getElementById('intake').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var fd = new FormData(e.target);
    var data = { lead_id: leadId };
    fd.forEach(function(v, k) { data[k] = v; });

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
