<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 40px; }
    .form-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 12px; }
    .form-hero h1 em { font-style: italic; color: var(--gold); }
    .form-hero p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .intake-form { background: white; padding: 36px 28px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group select { appearance: none; }
    .form-submit { width: 100%; margin-top: 8px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 14px; }
    .form-error { display: none; background: #fff0f0; color: #c00; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <p class="section-eyebrow">New Client</p>
      <h1>Let's Get <em>Started</em></h1>
      <p>Tell us about yourself so Maddy can build the perfect program for you.</p>
    </div>

    <div id="formError" class="form-error"></div>

    <form id="intakeForm" class="intake-form">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label for="goal">Primary Goal *</label>
          <select id="goal" name="goal" required>
            <option value="">Select goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength</option>
            <option value="general_fitness">General Fitness</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="post_pregnancy">Post Pregnancy</option>
            <option value="endurance">Endurance</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="injuries">Injuries / Medical Conditions</label>
        <textarea id="injuries" name="injuries" placeholder="Any past or current injuries, surgeries, conditions..."></textarea>
      </div>

      <div class="form-group">
        <label for="medical_conditions">Current Medications</label>
        <input type="text" id="medical_conditions" name="medical_conditions" placeholder="List any medications you're currently taking">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="diet_preference">Diet Preference</label>
          <select id="diet_preference" name="diet_preference">
            <option value="flexible">Flexible / No restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="keto">Keto</option>
            <option value="halal">Halal</option>
            <option value="jain">Jain</option>
          </select>
        </div>
        <div class="form-group">
          <label for="schedule">Weekly Training Days</label>
          <select id="schedule" name="schedule">
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5" selected>5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Anything Else?</label>
        <textarea id="notes" name="notes" placeholder="Anything you want Maddy to know — schedule constraints, past experience, etc."></textarea>
      </div>

      <button type="submit" class="btn-primary form-submit">Submit Intake Form</button>
    </form>

    <div id="formSuccess" class="form-success">
      <h2>You're all set!</h2>
      <p>We've received your details. Maddy's team will get your program ready. Check WhatsApp for next steps.</p>
    </div>
  </div>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    var form = document.getElementById('intakeForm');
    var errorEl = document.getElementById('formError');
    var successEl = document.getElementById('formSuccess');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.style.display = 'none';

      var data = {
        lead_id: document.getElementById('leadId').value,
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        age: document.getElementById('age').value,
        goal: document.getElementById('goal').value,
        injuries: document.getElementById('injuries').value.trim(),
        medical_conditions: document.getElementById('medical_conditions').value.trim(),
        diet_preference: document.getElementById('diet_preference').value,
        schedule: document.getElementById('schedule').value,
        notes: document.getElementById('notes').value.trim(),
      };

      if (!data.lead_id) {
        errorEl.textContent = 'Invalid link — lead ID missing. Please use the link sent on WhatsApp.';
        errorEl.style.display = 'block';
        return;
      }

      var btn = form.querySelector('button');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          form.style.display = 'none';
          successEl.style.display = 'block';
        } else {
          throw new Error(res.error || 'Something went wrong');
        }
      })
      .catch(function(err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Submit Intake Form';
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
