<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Your Journey | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF; --error: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); color: var(--white); padding: 40px 20px 32px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: var(--gold);
    }
    .form-header p { font-size: 14px; color: var(--sand); margin-top: 8px; max-width: 400px; margin-inline: auto; }

    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 32px 24px;
      background: var(--white); border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      border: 1.5px solid var(--light-grey); border-radius: 4px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-submit {
      width: 100%; padding: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 3px; background: var(--charcoal); color: var(--white);
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-note {
      text-align: center; font-size: 12px; color: var(--mid-grey); margin-top: 16px;
    }

    .success-msg {
      display: none; text-align: center; padding: 40px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }

    .error-text { color: var(--error); font-size: 12px; margin-top: 4px; display: none; }

    @media (max-width: 500px) {
      .form-container { margin: -20px 12px 40px; padding: 24px 16px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>START YOUR JOURNEY</h1>
  <p>Tell us about yourself so Maddy can design the perfect program for you.</p>
</div>

<div class="form-container" id="formContainer">
  <form id="intakeForm">
    <input type="hidden" id="leadId" name="lead_id">

    <div class="form-group">
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" required placeholder="Your name">
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required placeholder="your@email.com">
    </div>

    <div class="form-group">
      <label for="phone">WhatsApp Number *</label>
      <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="age">Age *</label>
        <input type="number" id="age" name="age" required min="14" max="80" placeholder="28">
      </div>
      <div class="form-group">
        <label for="program">Program *</label>
        <select id="program" name="program" required>
          <option value="">Select...</option>
          <option value="6wk_gym">6-Week Burn & Build (Gym)</option>
          <option value="6wk_home">6-Week Burn & Build (Home)</option>
          <option value="12wk">12-Week Flagship Program</option>
          <option value="pcos">PCOS Warrior</option>
          <option value="40plus">40+ Strong</option>
          <option value="zoom_trial">Zoom Trial</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="goal">Primary Goal *</label>
      <select id="goal" name="goal" required>
        <option value="">Select your main goal...</option>
        <option value="fat_loss">Fat Loss</option>
        <option value="muscle_gain">Muscle Building</option>
        <option value="strength">Strength & Performance</option>
        <option value="pcos">PCOS Management</option>
        <option value="toning">Toning & Definition</option>
        <option value="general">General Fitness & Health</option>
        <option value="postpartum">Post-Pregnancy Recovery</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="injuries">Injuries or Medical Conditions</label>
      <textarea id="injuries" name="injuries" placeholder="Any past injuries, surgeries, medical conditions, or medications we should know about? Write 'None' if not applicable."></textarea>
    </div>

    <div class="form-group">
      <label for="diet_pref">Dietary Preferences</label>
      <select id="diet_pref" name="diet_pref">
        <option value="no_preference">No Preference</option>
        <option value="vegetarian">Vegetarian</option>
        <option value="vegan">Vegan</option>
        <option value="eggetarian">Eggetarian</option>
        <option value="non_veg">Non-Vegetarian</option>
        <option value="keto">Keto</option>
        <option value="gluten_free">Gluten-Free</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="schedule">Your Weekly Schedule</label>
      <textarea id="schedule" name="schedule" placeholder="How many days can you train? Morning or evening? Any days that don't work?"></textarea>
    </div>

    <p class="error-text" id="errorMsg"></p>
    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT APPLICATION</button>
    <p class="form-note">Your information is private and only shared with Maddy.</p>
  </form>
</div>

<div class="success-msg" id="successMsg">
  <h2>YOU'RE IN!</h2>
  <p>Thanks for submitting! Maddy's team will reach out on WhatsApp within 24 hours with your next steps.</p>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    var form = document.getElementById('intakeForm');
    var submitBtn = document.getElementById('submitBtn');
    var errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      errorMsg.style.display = 'none';

      var data = {
        lead_id: document.getElementById('leadId').value || undefined,
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        age: document.getElementById('age').value,
        program: document.getElementById('program').value,
        goal: document.getElementById('goal').value,
        injuries: document.getElementById('injuries').value.trim(),
        diet_pref: document.getElementById('diet_pref').value,
        schedule: document.getElementById('schedule').value.trim()
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(resp) { return resp.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT APPLICATION';
        }
      })
      .catch(function() {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT APPLICATION';
      });
    });
  })();
</script>

</body>
</html>
