<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">
  <div class="form-header">
    <a class="form-logo" href="index.html">Fitness by Maddy</a>
    <p class="form-subtitle">Client Onboarding Form</p>
  </div>

  <form id="intakeForm" class="brand-form">
    <input type="hidden" id="leadId" name="lead_id">

    <div class="form-section">
      <h3 class="form-section-title">Personal Details</h3>

      <div class="form-group">
        <label class="form-label" for="name">Full Name *</label>
        <input class="form-input" type="text" id="name" name="name" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="age">Age *</label>
          <input class="form-input" type="number" id="age" name="age" min="16" max="80" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="gender">Gender *</label>
          <select class="form-input" id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="height">Height (cm) *</label>
          <input class="form-input" type="number" id="height" name="height" min="100" max="250" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="current_weight">Current Weight (kg) *</label>
          <input class="form-input" type="number" id="current_weight" name="current_weight" step="0.1" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="target_weight">Target Weight (kg)</label>
        <input class="form-input" type="number" id="target_weight" name="target_weight" step="0.1">
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Goals & Health</h3>

      <div class="form-group">
        <label class="form-label" for="goal">Primary Goal *</label>
        <select class="form-input" id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos">PCOS Management</option>
          <option value="general_fitness">General Fitness</option>
          <option value="body_recomp">Body Recomposition</option>
          <option value="postnatal">Postnatal Recovery</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="injuries">Current/Past Injuries</label>
        <textarea class="form-input" id="injuries" name="injuries" rows="3" placeholder="List any injuries, surgeries, or physical limitations..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="medical_conditions">Medical Conditions / Medications</label>
        <textarea class="form-input" id="medical_conditions" name="medical_conditions" rows="3" placeholder="PCOS, thyroid, diabetes, blood pressure meds, etc."></textarea>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Lifestyle & Preferences</h3>

      <div class="form-group">
        <label class="form-label" for="diet_preference">Diet Preference *</label>
        <select class="form-input" id="diet_preference" name="diet_preference" required>
          <option value="">Select</option>
          <option value="no_preference">No Preference (eat everything)</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="jain">Jain</option>
          <option value="keto">Keto</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="workout_days">How many days/week can you train? *</label>
        <select class="form-input" id="workout_days" name="workout_days" required>
          <option value="">Select</option>
          <option value="3">3 days</option>
          <option value="4">4 days</option>
          <option value="5">5 days</option>
          <option value="6">6 days</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="equipment_access">Equipment Access *</label>
        <select class="form-input" id="equipment_access" name="equipment_access" required>
          <option value="">Select</option>
          <option value="full_gym">Full Gym</option>
          <option value="home_basic">Home (Dumbbells + Bands)</option>
          <option value="home_none">Home (No Equipment)</option>
          <option value="hotel_gym">Hotel/Travel Gym</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="wake_time">Usual Wake Time</label>
          <input class="form-input" type="time" id="wake_time" name="wake_time">
        </div>
        <div class="form-group">
          <label class="form-label" for="sleep_time">Usual Sleep Time</label>
          <input class="form-input" type="time" id="sleep_time" name="sleep_time">
        </div>
      </div>
    </div>

    <button type="submit" class="btn-primary form-submit">Submit Intake Form</button>
    <p class="form-footer-note">Your information is secure and only used to build your personalized program.</p>
  </form>

  <div id="successMessage" class="form-success" style="display:none;">
    <div class="success-icon">✓</div>
    <h3>Form Submitted!</h3>
    <p>Your details have been saved. Once payment is confirmed, your customized program will be created.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intakeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var btn = form.querySelector('.form-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      lead_id: document.getElementById('leadId').value || null,
      name: form.name.value,
      age: form.age.value,
      gender: form.gender.value,
      height: form.height.value,
      current_weight: form.current_weight.value,
      target_weight: form.target_weight.value || null,
      goal: form.goal.value,
      injuries: form.injuries.value || null,
      medical_conditions: form.medical_conditions.value || null,
      diet_preference: form.diet_preference.value,
      workout_days: form.workout_days.value,
      equipment_access: form.equipment_access.value,
      wake_time: form.wake_time.value || null,
      sleep_time: form.sleep_time.value || null
    };

    fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
