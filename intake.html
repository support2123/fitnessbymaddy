<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Welcome Aboard</p>
      <h1 class="section-title">Client <em>Intake</em> Form</h1>
      <p class="section-body" style="margin:0 auto">Tell us about yourself so Maddy can design the perfect program for you.</p>
    </div>

    <div class="form-card" id="intakeForm">
      <form id="intake" onsubmit="submitIntake(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input class="form-input" name="name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input class="form-input" type="email" name="email" required placeholder="you@email.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Age *</label>
            <input class="form-input" type="number" name="age" required min="14" max="80">
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Height (cm)</label>
            <input class="form-input" type="number" name="height" placeholder="165">
          </div>
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input class="form-input" type="number" name="weight" required placeholder="70">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Primary Goal *</label>
          <select class="form-select" name="goal" required>
            <option value="">Select your main goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness & Energy</option>
            <option value="post_pregnancy">Post-Pregnancy Recovery</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Training Experience</label>
          <select class="form-select" name="experience">
            <option value="">Select</option>
            <option value="beginner">Beginner (< 6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">How many days/week can you train?</label>
          <select class="form-select" name="schedule">
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Diet Preference</label>
          <select class="form-select" name="diet_preference">
            <option value="">Select</option>
            <option value="no_preference">No Preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Veg</option>
            <option value="keto">Keto</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Injuries or Physical Limitations</label>
          <textarea class="form-textarea" name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Medical Conditions / Medications</label>
          <textarea class="form-textarea" name="medical_conditions" placeholder="E.g., thyroid, PCOS, diabetes, blood pressure meds..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Intake Form</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>You're All Set!</h2>
      <p>Thanks for submitting your intake form. Maddy will review your details and your custom program will be ready soon.</p>
    </div>
  </div>
</div>

<script>
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function submitIntake(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('intake');
  var data = Object.fromEntries(new FormData(form));
  data.lead_id = getParam('lead');
  data.phone = getParam('phone');

  try {
    var res = await fetch('/api/lead-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT INTAKE FORM';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT INTAKE FORM';
    alert('Network error. Please check your connection.');
  }
}
</script>
</body>
</html>
