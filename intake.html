<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="brand">Fitness by Maddy</div>
      <h1>Welcome Onboard</h1>
      <p>Fill this out so Maddy can build your personalised program. Takes ~3 minutes.</p>
    </div>

    <form id="intakeForm" class="fbm-form">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-section">
        <h2>About You</h2>

        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@email.com">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="14" max="80" required>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Your Goals</h2>

        <div class="field">
          <label for="goal">Primary Goal</label>
          <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="postpartum">Postpartum Recovery</option>
            <option value="mobility">Flexibility & Mobility</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="current_weight">Current Weight (kg)</label>
            <input type="number" id="current_weight" name="current_weight" step="0.1" placeholder="65">
          </div>
          <div class="field">
            <label for="target_weight">Target Weight (kg)</label>
            <input type="number" id="target_weight" name="target_weight" step="0.1" placeholder="58">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Health & Lifestyle</h2>

        <div class="field">
          <label for="injuries">Any injuries, medical conditions, or medications?</label>
          <textarea id="injuries" name="injuries" rows="3" placeholder="E.g., knee pain, thyroid, birth control..."></textarea>
        </div>

        <div class="field">
          <label for="diet_preference">Diet Preference</label>
          <select id="diet_preference" name="diet_preference">
            <option value="">No preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="non_veg">Non-Vegetarian</option>
            <option value="jain">Jain</option>
            <option value="keto">Keto</option>
          </select>
        </div>

        <div class="field">
          <label for="experience_level">Training Experience</label>
          <select id="experience_level" name="experience_level" required>
            <option value="">Select level</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>

        <div class="field">
          <label for="schedule">How many days per week can you train?</label>
          <select id="schedule" name="schedule" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit & Start Your Journey</button>
    </form>

    <div id="successMsg" class="success-msg" style="display:none;">
      <div class="success-icon">✓</div>
      <h2>You're all set!</h2>
      <p>Maddy's team will review your info and your personalized plan will be ready soon. Check WhatsApp for updates!</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          const err = await res.json();
          alert(err.error || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Submit & Start Your Journey';
        }
      } catch {
        alert('Network error. Please check your connection and try again.');
        btn.disabled = false;
        btn.textContent = 'Submit & Start Your Journey';
      }
    });
  </script>
</body>
</html>
