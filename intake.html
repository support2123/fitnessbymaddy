<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 24px 32px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    .form-header p {
      color: #ccc;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .form-container {
      max-width: 480px;
      margin: -20px auto 40px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--charcoal);
    }

    .field label .req { color: var(--gold); }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      background: var(--cream);
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field textarea { resize: vertical; min-height: 80px; }

    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .photo-upload:hover { border-color: var(--gold); }

    .photo-upload input[type="file"] { display: none; }

    .photo-upload p {
      color: var(--mid-grey);
      font-size: 0.85rem;
    }

    .photo-upload .icon { font-size: 1.8rem; margin-bottom: 4px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }

    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2rem;
    }

    .success-msg p {
      color: var(--mid-grey);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Client Intake Form</h1>
    <p>Tell us about yourself so we can build your perfect plan</p>
  </div>

  <div class="form-container" id="formContainer">
    <form id="intakeForm">
      <input type="hidden" id="leadId" name="lead_id">

      <div class="field">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>

      <div class="field">
        <label>Email Address <span class="req">*</span></label>
        <input type="email" name="email" required placeholder="you@email.com">
      </div>

      <div class="field">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label>Age <span class="req">*</span></label>
        <input type="number" name="age" required min="14" max="80" placeholder="28">
      </div>

      <div class="field">
        <label>Primary Goal <span class="req">*</span></label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Strength</option>
          <option value="pcos">PCOS / Hormonal Balance</option>
          <option value="40plus">40+ Fitness</option>
          <option value="general">General Fitness & Health</option>
          <option value="sport">Sport Performance</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
      </div>

      <div class="field">
        <label>Current Training Experience</label>
        <select name="experience">
          <option value="">Select level</option>
          <option value="beginner">Beginner (0-6 months)</option>
          <option value="intermediate">Intermediate (6 months - 2 years)</option>
          <option value="advanced">Advanced (2+ years)</option>
        </select>
      </div>

      <div class="field">
        <label>Any Injuries or Medical Conditions?</label>
        <textarea name="injuries" placeholder="E.g., knee pain, lower back issues, thyroid, PCOS..."></textarea>
      </div>

      <div class="field">
        <label>Diet Preference</label>
        <select name="diet_pref">
          <option value="">Select preference</option>
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Vegetarian</option>
          <option value="keto">Keto</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Weekly Training Schedule</label>
        <select name="schedule">
          <option value="">How many days can you train?</option>
          <option value="3">3 days/week</option>
          <option value="4">4 days/week</option>
          <option value="5">5 days/week</option>
          <option value="6">6 days/week</option>
        </select>
      </div>

      <div class="field">
        <label>Progress Photos (optional)</label>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <div class="icon">📸</div>
          <p>Tap to upload front, side & back photos</p>
          <p id="photoCount"></p>
          <input type="file" id="photos" name="photos" accept="image/*" multiple>
        </div>
      </div>

      <div class="field">
        <label>Anything else we should know?</label>
        <textarea name="notes" placeholder="Medications, lifestyle, schedule constraints..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT INTAKE FORM</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>You're All Set!</h2>
    <p>We've received your info. Maddy's team will reach out on WhatsApp soon.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var leadId = params.get('lead');
    if (leadId) document.getElementById('leadId').value = leadId;

    document.getElementById('photos').addEventListener('change', function () {
      var count = this.files.length;
      document.getElementById('photoCount').textContent = count ? count + ' photo(s) selected' : '';
    });

    document.getElementById('intakeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var form = e.target;
      var data = {
        lead_id: form.lead_id.value || undefined,
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        age: form.age.value,
        goal: form.goal.value,
        injuries: form.injuries.value,
        diet_pref: form.diet_pref.value,
        schedule: form.schedule.value,
      };

      fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(function (res) { return res.json(); })
        .then(function () {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
          alert('Something went wrong. Please try again.');
        });
    });
  </script>
</body>
</html>
