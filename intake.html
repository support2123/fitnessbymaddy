<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .container { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: var(--charcoal); }
    .brand p { font-size: 13px; color: var(--mid-grey); margin-top: 8px; }
    .form-card { background: white; border-radius: 8px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--charcoal); margin-bottom: 8px; }
    .form-subtitle { font-size: 14px; color: var(--mid-grey); margin-bottom: 32px; line-height: 1.6; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 100px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { text-align: center; padding: 60px 20px; }
    .success h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--charcoal); margin-bottom: 12px; }
    .success p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>New Client Intake Form</p>
    </div>

    <div class="form-card" id="formCard">
      <div class="form-title">TELL US ABOUT YOU</div>
      <p class="form-subtitle">This helps us build the perfect program for your body and goals. Be honest — no judgment here.</p>

      <form id="intakeForm">
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="Your name">
        </div>

        <div class="field-row">
          <div class="field">
            <label>Age</label>
            <input type="number" name="age" required min="16" max="80" placeholder="25">
          </div>
          <div class="field">
            <label>Gender</label>
            <select name="gender" required>
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" name="height" required placeholder="165">
          </div>
          <div class="field">
            <label>Current Weight (kg)</label>
            <input type="number" name="weight" required step="0.1" placeholder="70">
          </div>
        </div>

        <div class="field">
          <label>Primary Goal</label>
          <select name="goal" required>
            <option value="">Select your main goal</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain / Toning</option>
            <option value="strength">Strength & Performance</option>
            <option value="pcos">PCOS / Hormonal Balance</option>
            <option value="general_fitness">General Fitness & Energy</option>
            <option value="postpartum">Postpartum Recovery</option>
          </select>
        </div>

        <div class="field">
          <label>Experience Level</label>
          <select name="experience_level" required>
            <option value="">How long have you been training?</option>
            <option value="beginner">Beginner (0-6 months)</option>
            <option value="intermediate">Intermediate (6 months - 2 years)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>

        <div class="field">
          <label>Training Schedule</label>
          <select name="schedule" required>
            <option value="">How many days can you train?</option>
            <option value="3_days">3 days/week</option>
            <option value="4_days">4 days/week</option>
            <option value="5_days">5 days/week</option>
            <option value="6_days">6 days/week</option>
          </select>
        </div>

        <div class="field">
          <label>Diet Preference</label>
          <select name="diet_pref">
            <option value="flexible">Flexible / No restriction</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="keto">Keto / Low Carb</option>
            <option value="jain">Jain</option>
          </select>
        </div>

        <div class="field">
          <label>Injuries or Physical Limitations</label>
          <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder impingement... Write 'None' if nothing."></textarea>
        </div>

        <div class="field">
          <label>Medical Conditions / Medications</label>
          <textarea name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure meds... Write 'None' if nothing."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Intake Form</button>
      </form>
    </div>

    <div class="success hidden" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>We've received your details. Your personalised program is being built — you'll hear from us on WhatsApp soon.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      data.lead_id = leadId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById('formCard').classList.add('hidden');
          document.getElementById('successMsg').classList.remove('hidden');
        } else {
          btn.disabled = false;
          btn.textContent = 'SUBMIT INTAKE FORM';
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SUBMIT INTAKE FORM';
        alert('Network error. Please check your connection and try again.');
      }
    });
  </script>
</body>
</html>
