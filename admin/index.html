<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-nav {
      background: var(--charcoal); padding: 0 40px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: white; letter-spacing: 2px; text-transform: uppercase; }
    .admin-badge { font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }

    .login-screen { max-width: 400px; margin: 120px auto; padding: 0 24px; text-align: center; }
    .login-screen h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 8px; }
    .login-screen p { color: var(--mid-grey); font-size: 14px; margin-bottom: 32px; }
    .login-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--cream); outline: none; margin-bottom: 16px; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; }
    .login-btn:hover { background: var(--gold); }

    .dashboard { display: none; padding: 32px 40px; max-width: 1200px; margin: 0 auto; }
    .dash-header { margin-bottom: 32px; }
    .dash-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400; }
    .dash-header p { color: var(--mid-grey); font-size: 13px; margin-top: 4px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 11px; color: var(--mid-grey); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.gold { border-top: 3px solid var(--gold); }
    .stat-card.alert { border-top: 3px solid #c44; }

    .panels { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
    .panel { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; }
    .panel-body { padding: 20px 24px; }

    .client-list { list-style: none; }
    .client-item { padding: 12px 0; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .client-item:last-child { border-bottom: none; }
    .client-name { font-weight: 500; font-size: 14px; }
    .client-program { font-size: 11px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; }
    .program-tag { display: inline-block; padding: 3px 8px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .program-tag.t-12wk { background: rgba(184,150,90,0.15); color: var(--gold); }
    .program-tag.t-6wk_gym { background: rgba(44,44,44,0.1); color: var(--charcoal); }
    .program-tag.t-pcos { background: rgba(150,90,184,0.15); color: #7B4CA0; }
    .program-tag.t-40plus { background: rgba(90,150,184,0.15); color: #3A7CA5; }
    .program-tag.t-zoom_trial { background: rgba(90,184,130,0.15); color: #2A8A5A; }

    .escalation-list { list-style: none; }
    .escalation-item { padding: 12px 0; border-bottom: 1px solid var(--light-grey); }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-phone { font-size: 12px; color: var(--gold); font-weight: 600; }
    .escalation-body { font-size: 13px; color: var(--charcoal); margin-top: 4px; }
    .escalation-time { font-size: 11px; color: var(--mid-grey); margin-top: 2px; }

    .program-bar { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .program-bar-label { font-size: 12px; min-width: 80px; color: var(--mid-grey); }
    .program-bar-fill { height: 8px; border-radius: 4px; background: var(--gold); transition: width 0.5s; }
    .program-bar-count { font-size: 12px; font-weight: 600; color: var(--charcoal); min-width: 24px; }

    .refresh-btn { font-size: 11px; color: var(--gold); cursor: pointer; background: none; border: 1px solid var(--gold); padding: 4px 12px; border-radius: 2px; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { background: var(--gold); color: white; }

    .empty-state { text-align: center; padding: 32px; color: var(--mid-grey); font-size: 13px; }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .dashboard { padding: 24px 16px; }
      .admin-nav { padding: 0 16px; }
    }
  </style>
</head>
<body>

<div class="admin-nav">
  <span class="admin-logo">Fitness by Maddy</span>
  <span class="admin-badge">Admin Dashboard</span>
</div>

<div id="loginScreen" class="login-screen">
  <h1>Admin Access</h1>
  <p>Enter your admin key to access the dashboard.</p>
  <div class="login-form">
    <input type="password" id="apiKeyInput" class="login-input" placeholder="Admin API Key">
    <button class="login-btn" onclick="login()">Access Dashboard</button>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <div class="dash-header">
    <h1>Operations Dashboard</h1>
    <p id="lastUpdated"></p>
  </div>

  <div class="stats-grid">
    <div class="stat-card gold">
      <div class="stat-card-label">Leads Today</div>
      <div class="stat-card-value" id="leadsToday">—</div>
      <div class="stat-card-sub" id="leadsWeek"></div>
    </div>
    <div class="stat-card gold">
      <div class="stat-card-label">Conversion Rate</div>
      <div class="stat-card-value" id="convRate">—</div>
      <div class="stat-card-sub" id="convSub"></div>
    </div>
    <div class="stat-card gold">
      <div class="stat-card-label">Active Clients</div>
      <div class="stat-card-value" id="activeClients">—</div>
      <div class="stat-card-sub" id="programsGen"></div>
    </div>
    <div class="stat-card alert">
      <div class="stat-card-label">Pending Check-ins</div>
      <div class="stat-card-value" id="pendingCheckins">—</div>
      <div class="stat-card-sub">awaiting submission</div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Active Clients</span>
        <button class="refresh-btn" onclick="loadStats()">Refresh</button>
      </div>
      <div class="panel-body" id="clientList">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:24px">
        <div class="panel-header">
          <span class="panel-title">Programs</span>
        </div>
        <div class="panel-body" id="programBreakdown">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Escalations</span>
        </div>
        <div class="panel-body" id="escalationList">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var adminKey = '';

function login() {
  adminKey = document.getElementById('apiKeyInput').value;
  if (!adminKey) return;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}

function loadStats() {
  fetch('/api/admin/stats', {
    headers: { 'Authorization': 'Bearer ' + adminKey }
  })
  .then(function(r) {
    if (r.status === 401) {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      return null;
    }
    return r.json();
  })
  .then(function(data) {
    if (!data) return;
    render(data);
  })
  .catch(function(err) {
    console.error('Failed to load stats:', err);
  });
}

function render(d) {
  document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  document.getElementById('leadsToday').textContent = d.leads.today;
  document.getElementById('leadsWeek').textContent = d.leads.this_week + ' this week / ' + d.leads.total + ' total';
  document.getElementById('convRate').textContent = d.conversion.rate;
  document.getElementById('convSub').textContent = d.conversion.converted + ' converted / ' + d.leads.dropped + ' dropped';
  document.getElementById('activeClients').textContent = d.clients.active;
  document.getElementById('programsGen').textContent = d.programs.generated_this_week + ' programs this week';
  document.getElementById('pendingCheckins').textContent = d.checkins.pending;

  var clientHtml = '';
  if (d.clients.list && d.clients.list.length > 0) {
    clientHtml = '<ul class="client-list">';
    d.clients.list.forEach(function(c) {
      clientHtml += '<li class="client-item"><div><div class="client-name">' + esc(c.name || 'Unnamed') + '</div><div class="client-program">Started ' + new Date(c.started).toLocaleDateString() + '</div></div><span class="program-tag t-' + c.program + '">' + c.program.replace(/_/g, ' ') + '</span></li>';
    });
    clientHtml += '</ul>';
  } else {
    clientHtml = '<div class="empty-state">No active clients yet</div>';
  }
  document.getElementById('clientList').innerHTML = clientHtml;

  var progHtml = '';
  var programs = d.clients.by_program || {};
  var maxCount = Math.max(1, Math.max.apply(null, Object.values(programs).concat([1])));
  var progNames = { '12wk': '12 Week', '6wk_gym': '6W Gym', '6wk_home': '6W Home', 'pcos': 'PCOS', '40plus': '40+', 'zoom_trial': 'Trial', 'zoom_pack': 'Zoom' };
  for (var key in programs) {
    var pct = (programs[key] / maxCount * 100).toFixed(0);
    progHtml += '<div class="program-bar"><span class="program-bar-label">' + (progNames[key] || key) + '</span><div style="flex:1;background:var(--light-grey);border-radius:4px;overflow:hidden"><div class="program-bar-fill" style="width:' + pct + '%"></div></div><span class="program-bar-count">' + programs[key] + '</span></div>';
  }
  document.getElementById('programBreakdown').innerHTML = progHtml || '<div class="empty-state">No data</div>';

  var escHtml = '';
  if (d.escalations && d.escalations.length > 0) {
    escHtml = '<ul class="escalation-list">';
    d.escalations.forEach(function(e) {
      escHtml += '<li class="escalation-item"><div class="escalation-phone">' + esc(e.phone) + '</div><div class="escalation-body">' + esc(e.body) + '</div><div class="escalation-time">' + new Date(e.at).toLocaleString() + '</div></li>';
    });
    escHtml += '</ul>';
  } else {
    escHtml = '<div class="empty-state">No escalations</div>';
  }
  document.getElementById('escalationList').innerHTML = escHtml;
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
