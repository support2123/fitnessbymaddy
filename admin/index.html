<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="../css/forms.css">
  <style>
    body { background: #1a1a1a; color: #fff; }

    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--charcoal); padding: 48px; border-radius: 4px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold);
      letter-spacing: 3px; margin-bottom: 24px; text-align: center;
    }
    .login-box input {
      background: #333; border-color: #444; color: white;
    }
    .login-box input::placeholder { color: #777; }
    .login-box .btn-submit { background: var(--gold); }
    .login-box .btn-submit:hover { background: var(--gold-light); }

    .dash { display: none; }
    .dash.visible { display: block; }

    .dash-header {
      background: var(--charcoal); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    .dash-logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: var(--gold); letter-spacing: 3px;
    }
    .dash-logout {
      font-size: 12px; color: #999; cursor: pointer;
      letter-spacing: 1px; text-transform: uppercase;
      background: none; border: 1px solid #444; padding: 8px 16px;
      border-radius: 2px; transition: all 0.3s;
    }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px; max-width: 1100px; margin: 0 auto; }

    .dash-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: white; letter-spacing: 2px; margin-bottom: 8px;
    }
    .dash-subtitle { font-size: 13px; color: #666; margin-bottom: 32px; }

    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 40px;
    }
    .stat-card {
      background: var(--charcoal); padding: 24px; border-radius: 4px;
      border: 1px solid #333;
    }
    .stat-card-label {
      font-size: 11px; color: #777; letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 1px;
    }
    .stat-card-sub { font-size: 12px; color: #555; margin-top: 4px; }

    .section-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: white; letter-spacing: 2px; margin: 32px 0 16px;
      padding-bottom: 8px; border-bottom: 1px solid #333;
    }

    .program-list { list-style: none; }
    .program-list li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px;
    }
    .program-list li span:first-child { color: #aaa; }
    .program-list li span:last-child {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold);
    }

    .loading-dash {
      text-align: center; padding: 60px; color: #666;
      font-size: 14px; letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <h2>MADDY'S DASHBOARD</h2>
    <div id="loginMsg" class="msg"></div>
    <form id="loginForm">
      <div class="field">
        <label style="color:#777;">Email</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="field">
        <label style="color:#777;">Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">SIGN IN</button>
    </form>
  </div>
</div>

<div id="dashView" class="dash">
  <div class="dash-header">
    <div class="dash-logo">FITNESS BY MADDY</div>
    <button class="dash-logout" id="logoutBtn">SIGN OUT</button>
  </div>

  <div class="dash-content">
    <h1 class="dash-title">OPERATIONS DASHBOARD</h1>
    <p class="dash-subtitle" id="dashDate"></p>

    <div id="dashLoading" class="loading-dash">Loading dashboard...</div>

    <div id="dashStats" style="display:none;">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-card-label">Leads Today</div>
          <div class="stat-card-value" id="sLeadsToday">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Leads This Week</div>
          <div class="stat-card-value" id="sLeadsWeek">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Conversion Rate</div>
          <div class="stat-card-value" id="sConversion">-</div>
          <div class="stat-card-sub" id="sConversionSub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Active Clients</div>
          <div class="stat-card-value" id="sActive">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Pending Check-ins</div>
          <div class="stat-card-value" id="sPending">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Programs This Week</div>
          <div class="stat-card-value" id="sPrograms">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Escalations</div>
          <div class="stat-card-value" id="sEscalations">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Total Clients</div>
          <div class="stat-card-value" id="sTotal">-</div>
        </div>
      </div>

      <div class="section-label">CLIENTS BY PROGRAM</div>
      <ul class="program-list" id="programList"></ul>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';

  var meta = document.querySelector('meta[name="supabase-url"]');
  if (meta) SUPABASE_URL = meta.content;
  var meta2 = document.querySelector('meta[name="supabase-anon-key"]');
  if (meta2) SUPABASE_ANON_KEY = meta2.content;

  if (!SUPABASE_URL) SUPABASE_URL = window.__SUPABASE_URL || '';
  if (!SUPABASE_ANON_KEY) SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';

  var sb = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  var PROGRAM_NAMES = {
    '6wk_gym': '6-Week Burn & Build (Gym)',
    '6wk_home': '6-Week Burn & Build (Home)',
    '12wk': '12-Week Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
    'unknown': 'Unassigned'
  };

  document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  function showLogin() {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('dashView').className = 'dash';
  }

  function showDash(token) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').className = 'dash visible';
    loadStats(token);
  }

  async function loadStats(token) {
    document.getElementById('dashLoading').style.display = 'block';
    document.getElementById('dashStats').style.display = 'none';

    try {
      var resp = await fetch('/api/admin/stats', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      var data = await resp.json();

      if (resp.status === 401) { showLogin(); return; }

      document.getElementById('sLeadsToday').textContent = data.leads_today;
      document.getElementById('sLeadsWeek').textContent = data.leads_this_week;
      document.getElementById('sConversion').textContent = data.conversion_rate + '%';
      document.getElementById('sConversionSub').textContent = data.total_leads + ' total leads';
      document.getElementById('sActive').textContent = data.active_clients;
      document.getElementById('sPending').textContent = data.pending_checkins;
      document.getElementById('sPrograms').textContent = data.programs_generated_this_week;
      document.getElementById('sEscalations').textContent = data.escalations_this_week;
      document.getElementById('sTotal').textContent = data.total_clients;

      var list = document.getElementById('programList');
      list.innerHTML = '';
      var programs = data.clients_by_program || {};
      Object.keys(programs).forEach(function(key) {
        var li = document.createElement('li');
        li.innerHTML = '<span>' + (PROGRAM_NAMES[key] || key) + '</span><span>' + programs[key] + '</span>';
        list.appendChild(li);
      });

      if (Object.keys(programs).length === 0) {
        list.innerHTML = '<li><span style="color:#555">No active clients yet</span><span>—</span></li>';
      }

      document.getElementById('dashLoading').style.display = 'none';
      document.getElementById('dashStats').style.display = 'block';
    } catch (err) {
      document.getElementById('dashLoading').textContent = 'Failed to load stats. Try refreshing.';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var msg = document.getElementById('loginMsg');

    if (!sb) {
      msg.className = 'msg error';
      msg.textContent = 'Dashboard not configured. Set Supabase credentials.';
      msg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>SIGNING IN...';

    var email = this.email.value;
    var password = this.password.value;

    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });

    if (error) {
      msg.className = 'msg error';
      msg.textContent = error.message;
      msg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'SIGN IN';
      return;
    }

    sessionStorage.setItem('dash_token', data.session.access_token);
    showDash(data.session.access_token);
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    sessionStorage.removeItem('dash_token');
    if (sb) sb.auth.signOut();
    showLogin();
  });

  var savedToken = sessionStorage.getItem('dash_token');
  if (savedToken) {
    showDash(savedToken);
  }
})();
</script>
</body>
</html>
