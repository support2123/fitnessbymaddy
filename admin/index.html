<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0d0d0d;
      --card-bg: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --green: #4CAF50;
      --red: #E57373;
      --mid-grey: #6B6B6B;
      --light-text: #ccc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: #fff;
      min-height: 100vh;
    }
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .dash-header .refresh-btn {
      padding: 10px 20px;
      background: rgba(184,150,90,0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'DM Sans', sans-serif;
    }
    .dash-header .refresh-btn:hover {
      background: rgba(184,150,90,0.25);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 24px;
    }
    .stat-card .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card .stat-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
    }
    .stat-card .stat-sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--gold-light);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,150,90,0.2);
    }
    .table-wrap {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--mid-grey);
      background: rgba(0,0,0,0.3);
    }
    td {
      padding: 12px 16px;
      font-size: 14px;
      border-top: 1px solid rgba(255,255,255,0.04);
      color: var(--light-text);
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .badge-new { background: rgba(33,150,243,0.15); color: #64B5F6; }
    .badge-qualified { background: rgba(255,193,7,0.15); color: #FFD54F; }
    .badge-converted { background: rgba(76,175,80,0.15); color: #81C784; }
    .badge-dropped { background: rgba(229,115,115,0.15); color: #E57373; }
    .badge-active { background: rgba(76,175,80,0.15); color: #81C784; }
    .escalation-item {
      background: var(--card-bg);
      border-left: 3px solid var(--red);
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 0 8px 8px 0;
    }
    .escalation-item .esc-reason {
      font-weight: 500;
      margin-bottom: 4px;
    }
    .escalation-item .esc-detail {
      font-size: 13px;
      color: var(--mid-grey);
    }
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      text-align: center;
      max-width: 360px;
      padding: 40px;
    }
    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 24px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      font-family: 'DM Sans', sans-serif;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .dashboard { padding: 20px 12px; }
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>ADMIN ACCESS</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="doLogin()">ENTER DASHBOARD</button>
    </div>
  </div>

  <div class="dashboard hidden" id="dashboardContent">
    <div class="dash-header">
      <h1>OPS DASHBOARD</h1>
      <button class="refresh-btn" onclick="loadDashboard()">REFRESH</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Leads Today</div>
        <div class="stat-number" id="leadsToday">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Leads This Week</div>
        <div class="stat-number" id="leadsWeek">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Conversion Rate</div>
        <div class="stat-number" id="conversionRate">-</div>
        <div class="stat-sub">lead → paid</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Clients</div>
        <div class="stat-number" id="activeClients">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Check-ins</div>
        <div class="stat-number" id="pendingCheckins">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Programs Generated</div>
        <div class="stat-number" id="programsGenerated">-</div>
        <div class="stat-sub">this week</div>
      </div>
    </div>

    <h3 class="section-title">ACTIVE CLIENTS BY PROGRAM</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Program</th><th>Count</th></tr>
        </thead>
        <tbody id="programBreakdown"></tbody>
      </table>
    </div>

    <h3 class="section-title">RECENT LEADS</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Market</th><th>Interest</th><th>Status</th><th>Created</th></tr>
        </thead>
        <tbody id="recentLeads"></tbody>
      </table>
    </div>

    <h3 class="section-title">ESCALATIONS</h3>
    <div id="escalations">
      <p style="color:var(--mid-grey);font-size:14px;">No pending escalations</p>
    </div>
  </div>

  <script>
    var SUPABASE_URL = '';
    var SUPABASE_ANON_KEY = '';
    var session = null;

    function doLogin() {
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;

      fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.access_token) {
          session = data;
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('dashboardContent').classList.remove('hidden');
          loadDashboard();
        } else {
          alert('Invalid credentials');
        }
      })
      .catch(function() { alert('Login failed'); });
    }

    function sbQuery(table, params) {
      var url = SUPABASE_URL + '/rest/v1/' + table + '?' + params;
      return fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY)
        }
      }).then(function(r) { return r.json(); });
    }

    function sbRpc(fn, body) {
      return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY)
        },
        body: JSON.stringify(body || {})
      }).then(function(r) { return r.json(); });
    }

    function loadDashboard() {
      var today = new Date().toISOString().split('T')[0];
      var weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();

      sbQuery('leads', 'select=id&created_at=gte.' + today + 'T00:00:00')
        .then(function(d) { document.getElementById('leadsToday').textContent = d.length || 0; });

      sbQuery('leads', 'select=id&created_at=gte.' + weekAgo)
        .then(function(d) { document.getElementById('leadsWeek').textContent = d.length || 0; });

      Promise.all([
        sbQuery('leads', 'select=id'),
        sbQuery('leads', 'select=id&status=eq.converted')
      ]).then(function(results) {
        var total = results[0].length || 0;
        var converted = results[1].length || 0;
        var rate = total > 0 ? Math.round((converted / total) * 100) : 0;
        document.getElementById('conversionRate').textContent = rate + '%';
      });

      sbQuery('clients', 'select=id,program&status=eq.active')
        .then(function(clients) {
          document.getElementById('activeClients').textContent = clients.length || 0;
          var breakdown = {};
          (clients || []).forEach(function(c) {
            breakdown[c.program] = (breakdown[c.program] || 0) + 1;
          });
          var tbody = document.getElementById('programBreakdown');
          tbody.innerHTML = '';
          Object.keys(breakdown).forEach(function(prog) {
            tbody.innerHTML += '<tr><td>' + prog + '</td><td>' + breakdown[prog] + '</td></tr>';
          });
        });

      sbQuery('leads', 'select=name,market,program_interest,status,created_at&order=created_at.desc&limit=10')
        .then(function(leads) {
          var tbody = document.getElementById('recentLeads');
          tbody.innerHTML = '';
          (leads || []).forEach(function(l) {
            var badge = 'badge-' + l.status;
            var date = new Date(l.created_at).toLocaleDateString();
            tbody.innerHTML += '<tr><td>' + (l.name || 'Unknown') + '</td><td>' + (l.market || '-') + '</td><td>' + (l.program_interest || '-') + '</td><td><span class="badge ' + badge + '">' + l.status + '</span></td><td>' + date + '</td></tr>';
          });
        });

      sbQuery('programs', 'select=id&generated_at=gte.' + weekAgo)
        .then(function(d) { document.getElementById('programsGenerated').textContent = d.length || 0; });

      document.getElementById('pendingCheckins').textContent = '-';
    }
  </script>
</body>
</html>
