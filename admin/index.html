<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --green: #27ae60; --red: #c0392b; --blue: #2980b9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
    }
    .login-screen h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; letter-spacing: 3px; color: var(--charcoal);
    }
    .login-box {
      background: white; padding: 40px; border-radius: 4px;
      border: 1px solid var(--light-grey); width: 360px; max-width: 90vw;
    }
    .login-box input {
      width: 100%; padding: 12px 14px; margin-bottom: 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: var(--cream); outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%; padding: 14px;
      background: var(--charcoal); color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 2px;
      border: none; border-radius: 2px; cursor: pointer;
    }
    .login-box button:hover { background: var(--gold); }
    .login-error { color: var(--red); font-size: 13px; margin-bottom: 12px; display: none; }

    .dashboard { display: none; }
    .dash-nav {
      background: var(--charcoal); padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .dash-nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; color: var(--gold); letter-spacing: 2px;
    }
    .dash-nav-right { display: flex; align-items: center; gap: 20px; }
    .dash-nav-right span { font-size: 12px; color: rgba(255,255,255,0.6); }
    .dash-nav-right button {
      background: transparent; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7); padding: 6px 14px; font-size: 11px;
      letter-spacing: 1px; cursor: pointer; border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .dash-nav-right button:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: white; border: 1px solid var(--light-grey);
      border-radius: 4px; padding: 24px;
    }
    .stat-card .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px; color: var(--charcoal); line-height: 1;
    }
    .stat-card .stat-label {
      font-size: 11px; color: var(--mid-grey); letter-spacing: 1px;
      text-transform: uppercase; margin-top: 4px;
    }
    .stat-card.gold { border-left: 3px solid var(--gold); }
    .stat-card.green { border-left: 3px solid var(--green); }
    .stat-card.red { border-left: 3px solid var(--red); }
    .stat-card.blue { border-left: 3px solid var(--blue); }

    .dash-section {
      background: white; border: 1px solid var(--light-grey);
      border-radius: 4px; margin-bottom: 24px;
    }
    .dash-section-header {
      padding: 20px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; justify-content: space-between; align-items: center;
    }
    .dash-section-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 2px; color: var(--charcoal);
    }
    .dash-section-header .badge {
      background: var(--gold); color: white;
      font-size: 10px; font-weight: 600; padding: 3px 10px;
      border-radius: 10px; letter-spacing: 1px;
    }

    .dash-table { width: 100%; border-collapse: collapse; }
    .dash-table th {
      text-align: left; padding: 12px 16px;
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey);
      background: var(--cream); border-bottom: 1px solid var(--light-grey);
    }
    .dash-table td {
      padding: 12px 16px; font-size: 13px; color: var(--charcoal);
      border-bottom: 1px solid var(--light-grey);
    }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-table tr:hover { background: rgba(184,150,90,0.03); }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 10px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .status-new { background: #eaf2ff; color: var(--blue); }
    .status-qualified { background: #fef9e7; color: #d4a017; }
    .status-converted { background: #eafaf1; color: var(--green); }
    .status-dropped { background: #fde8e8; color: var(--red); }
    .status-active { background: #eafaf1; color: var(--green); }
    .status-paused { background: #fef9e7; color: #d4a017; }
    .status-completed { background: #eaf2ff; color: var(--blue); }

    .empty-state { padding: 40px; text-align: center; color: var(--mid-grey); font-size: 13px; }
    .refresh-btn {
      background: transparent; border: 1px solid var(--light-grey);
      padding: 6px 14px; font-size: 11px; letter-spacing: 1px;
      color: var(--mid-grey); cursor: pointer; border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr; }
      .dash-content { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <h1>MADDY'S DASHBOARD</h1>
  <div class="login-box">
    <div class="login-error" id="loginError">Invalid credentials</div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn" onclick="doLogin()">SIGN IN</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-nav">
    <div class="dash-nav-logo">FITNESS BY MADDY — OPS</div>
    <div class="dash-nav-right">
      <span id="lastUpdated"></span>
      <button onclick="loadDashboard()">REFRESH</button>
      <button onclick="doLogout()">SIGN OUT</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="two-col">
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>RECENT LEADS</h2>
          <span class="badge" id="leadsCount">0</span>
        </div>
        <div id="leadsTable"></div>
      </div>
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>ACTIVE CLIENTS</h2>
          <span class="badge" id="clientsCount">0</span>
        </div>
        <div id="clientsTable"></div>
      </div>
    </div>

    <div class="two-col">
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>PENDING CHECK-INS</h2>
          <span class="badge" id="pendingCount">0</span>
        </div>
        <div id="pendingTable"></div>
      </div>
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>ESCALATIONS</h2>
          <span class="badge" id="escalationCount" style="background:var(--red)">0</span>
        </div>
        <div id="escalationsTable"></div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-header">
        <h2>PROGRAMS GENERATED THIS WEEK</h2>
        <span class="badge" id="programsCount">0</span>
      </div>
      <div id="programsTable"></div>
    </div>
  </div>
</div>

<script>
  var supabaseUrl = '';
  var supabaseKey = '';
  var session = null;

  function initSupabase() {
    supabaseUrl = localStorage.getItem('sb_url') || '';
    supabaseKey = localStorage.getItem('sb_key') || '';
  }

  function sbFetch(table, query) {
    var url = supabaseUrl + '/rest/v1/' + table + '?' + query;
    return fetch(url, {
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + (session || supabaseKey),
        'Content-Type': 'application/json'
      }
    }).then(function(r) { return r.json(); });
  }

  function doLogin() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');

    supabaseUrl = prompt('Supabase URL (or press OK if already set):', localStorage.getItem('sb_url') || '');
    supabaseKey = prompt('Supabase Anon Key:', localStorage.getItem('sb_key') || '');

    if (supabaseUrl && supabaseKey) {
      localStorage.setItem('sb_url', supabaseUrl);
      localStorage.setItem('sb_key', supabaseKey);
    }
    initSupabase();

    fetch(supabaseUrl + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': supabaseKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        session = data.access_token;
        localStorage.setItem('sb_session', session);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
      } else {
        errEl.textContent = data.error_description || 'Login failed';
        errEl.style.display = 'block';
      }
    })
    .catch(function() {
      errEl.textContent = 'Connection error. Check your Supabase URL.';
      errEl.style.display = 'block';
    });
  }

  function doLogout() {
    session = null;
    localStorage.removeItem('sb_session');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  function loadDashboard() {
    document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();

    var today = new Date();
    var startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - today.getDay());
    var weekStart = startOfWeek.toISOString();
    var todayStart = today.toISOString().split('T')[0] + 'T00:00:00';

    Promise.all([
      sbFetch('leads', 'select=*&order=created_at.desc&limit=20'),
      sbFetch('clients', 'select=*&order=program_started_at.desc'),
      sbFetch('checkins', 'select=*&order=form_submitted_at.desc&limit=20'),
      sbFetch('programs', 'select=*&generated_at=gte.' + weekStart + '&order=generated_at.desc'),
      sbFetch('messages', 'select=*&direction=eq.in&body=ilike.*refund*&order=sent_at.desc&limit=10'),
      sbFetch('leads', 'select=id&created_at=gte.' + todayStart),
      sbFetch('leads', 'select=id&created_at=gte.' + weekStart)
    ]).then(function(results) {
      var leads = results[0] || [];
      var clients = results[1] || [];
      var checkins = results[2] || [];
      var programs = results[3] || [];
      var escalations = results[4] || [];
      var leadsToday = results[5] || [];
      var leadsWeek = results[6] || [];

      var activeClients = clients.filter(function(c) { return c.status === 'active'; });
      var converted = leads.filter(function(l) { return l.status === 'converted'; });
      var convRate = leads.length > 0 ? Math.round((converted.length / leads.length) * 100) : 0;

      var pendingCheckins = [];
      activeClients.forEach(function(c) {
        var start = new Date(c.program_started_at);
        var days = Math.floor((today - start) / (1000*60*60*24));
        var week = Math.ceil(days / 7);
        var hasCheckin = checkins.some(function(ci) { return ci.client_id === c.id && ci.week_no === week; });
        if (!hasCheckin && week >= 1) {
          pendingCheckins.push({ client: c, week: week });
        }
      });

      renderStats(leadsToday.length, leadsWeek.length, convRate, activeClients.length, pendingCheckins.length, programs.length, escalations.length);
      renderLeads(leads.slice(0, 10));
      renderClients(activeClients);
      renderPending(pendingCheckins);
      renderEscalations(escalations);
      renderPrograms(programs);

      document.getElementById('leadsCount').textContent = leads.length;
      document.getElementById('clientsCount').textContent = activeClients.length;
      document.getElementById('pendingCount').textContent = pendingCheckins.length;
      document.getElementById('escalationCount').textContent = escalations.length;
      document.getElementById('programsCount').textContent = programs.length;
    });
  }

  function renderStats(today, week, convRate, active, pending, programs, escalations) {
    document.getElementById('statsGrid').innerHTML =
      statCard(today, 'Leads Today', 'gold') +
      statCard(week, 'Leads This Week', 'gold') +
      statCard(convRate + '%', 'Conversion Rate', 'green') +
      statCard(active, 'Active Clients', 'green') +
      statCard(pending, 'Pending Check-ins', 'blue') +
      statCard(programs, 'Programs This Week', 'blue') +
      statCard(escalations, 'Escalations', 'red');
  }

  function statCard(value, label, color) {
    return '<div class="stat-card ' + color + '"><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>';
  }

  function renderLeads(leads) {
    if (!leads.length) { document.getElementById('leadsTable').innerHTML = '<div class="empty-state">No leads yet</div>'; return; }
    var html = '<table class="dash-table"><thead><tr><th>Name</th><th>Phone</th><th>Interest</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    leads.forEach(function(l) {
      html += '<tr><td>' + (l.name || '—') + '</td><td>' + maskPhone(l.phone) + '</td><td>' + (l.program_interest || '—') + '</td><td><span class="status-badge status-' + l.status + '">' + l.status + '</span></td><td>' + fmtDate(l.created_at) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('leadsTable').innerHTML = html;
  }

  function renderClients(clients) {
    if (!clients.length) { document.getElementById('clientsTable').innerHTML = '<div class="empty-state">No active clients</div>'; return; }
    var html = '<table class="dash-table"><thead><tr><th>Name</th><th>Program</th><th>Started</th><th>Status</th></tr></thead><tbody>';
    clients.forEach(function(c) {
      html += '<tr><td>' + (c.name || '—') + '</td><td>' + (c.program || '—') + '</td><td>' + fmtDate(c.program_started_at) + '</td><td><span class="status-badge status-' + c.status + '">' + c.status + '</span></td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('clientsTable').innerHTML = html;
  }

  function renderPending(pending) {
    if (!pending.length) { document.getElementById('pendingTable').innerHTML = '<div class="empty-state">All check-ins submitted</div>'; return; }
    var html = '<table class="dash-table"><thead><tr><th>Client</th><th>Week</th><th>Program</th></tr></thead><tbody>';
    pending.forEach(function(p) {
      html += '<tr><td>' + (p.client.name || '—') + '</td><td>Week ' + p.week + '</td><td>' + (p.client.program || '—') + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('pendingTable').innerHTML = html;
  }

  function renderEscalations(messages) {
    if (!messages.length) { document.getElementById('escalationsTable').innerHTML = '<div class="empty-state">No escalations</div>'; return; }
    var html = '<table class="dash-table"><thead><tr><th>Phone</th><th>Message</th><th>Time</th></tr></thead><tbody>';
    messages.forEach(function(m) {
      html += '<tr><td>' + maskPhone(m.phone) + '</td><td>' + truncate(m.body, 60) + '</td><td>' + fmtDate(m.sent_at) + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('escalationsTable').innerHTML = html;
  }

  function renderPrograms(programs) {
    if (!programs.length) { document.getElementById('programsTable').innerHTML = '<div class="empty-state">No programs generated this week</div>'; return; }
    var html = '<table class="dash-table"><thead><tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>PDF</th></tr></thead><tbody>';
    programs.forEach(function(p) {
      var sent = p.whatsapp_sent_at ? '<span class="status-badge status-active">Sent</span>' : '<span class="status-badge status-new">Pending</span>';
      var pdf = p.pdf_url ? '<a href="' + escHtml(p.pdf_url) + '" target="_blank" style="color:var(--gold)">View</a>' : '—';
      html += '<tr><td>' + (p.client_id || '—') + '</td><td>Week ' + p.week_no + '</td><td>' + fmtDate(p.generated_at) + '</td><td>' + sent + '</td><td>' + pdf + '</td></tr>';
    });
    html += '</tbody></table>';
    document.getElementById('programsTable').innerHTML = html;
  }

  function maskPhone(p) {
    if (!p || p.length < 6) return '***';
    return p.slice(0, 3) + 'XXX...' + p.slice(-3);
  }
  function fmtDate(d) {
    if (!d) return '—';
    var dt = new Date(d);
    return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  }
  function truncate(s, n) {
    if (!s) return '—';
    return s.length > n ? escHtml(s.slice(0, n)) + '...' : escHtml(s);
  }
  function escHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  initSupabase();
  var savedSession = localStorage.getItem('sb_session');
  if (savedSession && localStorage.getItem('sb_url')) {
    session = savedSession;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }
</script>

</body>
</html>
