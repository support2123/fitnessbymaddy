<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #27AE60;
      --red: #C0392B;
      --blue: #2980B9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--cream);
      min-height: 100vh;
    }
    .dash-header {
      padding: 28px 32px;
      border-bottom: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .dash-header .refresh-btn {
      background: none;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.3s;
    }
    .dash-header .refresh-btn:hover {
      background: var(--gold);
      color: var(--charcoal);
    }
    .dash-body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    /* Stat cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #363636;
      border-radius: 8px;
      padding: 20px;
      border-left: 3px solid var(--gold);
    }
    .stat-card .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .stat-card .stat-sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 2px;
    }

    /* Sections */
    .section {
      margin-bottom: 32px;
    }
    .section h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--cream);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #444;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      border-bottom: 1px solid #444;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      color: #ccc;
    }
    tr:hover td { background: #3a3a3a; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-new { background: var(--blue); color: white; }
    .badge-qualified { background: var(--gold); color: white; }
    .badge-converted { background: var(--green); color: white; }
    .badge-dropped { background: var(--red); color: white; }

    /* Program pills */
    .program-dist {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .program-pill {
      background: #363636;
      border-radius: 6px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
    }
    .program-pill .count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
    }
    .program-pill .label {
      font-size: 11px;
      color: var(--mid-grey);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Escalation */
    .escalation-item {
      background: #3a2020;
      border-left: 3px solid var(--red);
      border-radius: 4px;
      padding: 14px 18px;
      margin-bottom: 10px;
    }
    .escalation-item .esc-phone {
      font-weight: 600;
      color: var(--cream);
      font-size: 13px;
    }
    .escalation-item .esc-body {
      color: #ccc;
      font-size: 13px;
      margin-top: 4px;
    }
    .escalation-item .esc-flags {
      margin-top: 6px;
    }
    .escalation-item .esc-flag {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .escalation-item .esc-time {
      font-size: 11px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .empty-state {
      color: var(--mid-grey);
      font-size: 14px;
      padding: 20px 0;
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--mid-grey);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="dash-header">
    <h1>Maddy's Dashboard</h1>
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
  </div>

  <div class="dash-body" id="dashBody">
    <div class="loading" id="loadingState">Loading dashboard data...</div>
  </div>

  <script>
    var PROGRAM_NAMES = {
      '6wk_gym': '6-Wk Gym',
      '6wk_home': '6-Wk Home',
      '12wk': '12-Week',
      'pcos': 'PCOS',
      '40plus': '40+',
      'zoom_trial': 'Zoom Trial',
      'zoom_pack': 'Zoom Pack'
    };

    function loadDashboard() {
      var body = document.getElementById('dashBody');
      body.innerHTML = '<div class="loading">Loading dashboard data...</div>';

      fetch('/api/admin/stats')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          body.innerHTML = buildDashboard(d);
        })
        .catch(function(err) {
          body.innerHTML = '<div class="loading">Failed to load data. Check your connection and Supabase config.</div>';
        });
    }

    function buildDashboard(d) {
      var html = '';

      // Stat cards
      html += '<div class="stats-grid">';
      html += statCard('Leads Today', d.leads_today, '');
      html += statCard('Leads This Week', d.leads_this_week, '');
      html += statCard('Conversion Rate', d.conversion_rate + '%', d.converted_leads + ' of ' + d.total_leads);
      html += statCard('Active Clients', d.active_clients, '');
      html += statCard('Programs This Week', d.programs_generated_this_week, '');
      html += statCard('Pending Check-ins', d.pending_checkins.length, '');
      html += '</div>';

      // Clients by program
      html += '<div class="section">';
      html += '<h2>Active Clients by Program</h2>';
      html += '<div class="program-dist">';
      var programs = d.clients_by_program || {};
      var keys = Object.keys(programs);
      if (keys.length === 0) {
        html += '<div class="empty-state">No active clients yet</div>';
      } else {
        keys.forEach(function(k) {
          html += '<div class="program-pill"><span class="count">' + programs[k] + '</span><span class="label">' + (PROGRAM_NAMES[k] || k) + '</span></div>';
        });
      }
      html += '</div></div>';

      // Escalations
      html += '<div class="section">';
      html += '<h2>Escalations Awaiting Review</h2>';
      if (d.escalations.length === 0) {
        html += '<div class="empty-state">No escalations — all clear</div>';
      } else {
        d.escalations.forEach(function(e) {
          html += '<div class="escalation-item">';
          html += '<div class="esc-phone">' + e.phone + '</div>';
          html += '<div class="esc-body">"' + escHtml(e.body || '') + '"</div>';
          html += '<div class="esc-flags">' + e.flags.map(function(f) { return '<span class="esc-flag">' + f + '</span>'; }).join('') + '</div>';
          html += '<div class="esc-time">' + new Date(e.sent_at).toLocaleString() + '</div>';
          html += '</div>';
        });
      }
      html += '</div>';

      // Pending check-ins
      html += '<div class="section">';
      html += '<h2>Pending Check-ins</h2>';
      if (d.pending_checkins.length === 0) {
        html += '<div class="empty-state">All check-ins submitted</div>';
      } else {
        html += '<div class="table-wrap"><table>';
        html += '<tr><th>Name</th><th>Program</th><th>Week</th></tr>';
        d.pending_checkins.forEach(function(p) {
          html += '<tr><td>' + escHtml(p.name || 'Unknown') + '</td><td>' + (PROGRAM_NAMES[p.program] || p.program) + '</td><td>Week ' + p.week + '</td></tr>';
        });
        html += '</table></div>';
      }
      html += '</div>';

      // Recent leads
      html += '<div class="section">';
      html += '<h2>Recent Leads</h2>';
      if (d.recent_leads.length === 0) {
        html += '<div class="empty-state">No leads yet</div>';
      } else {
        html += '<div class="table-wrap"><table>';
        html += '<tr><th>Name</th><th>Market</th><th>Interest</th><th>Status</th><th>Date</th></tr>';
        d.recent_leads.forEach(function(l) {
          var badgeClass = 'badge-' + l.status;
          html += '<tr>';
          html += '<td>' + escHtml(l.name || 'Unknown') + '</td>';
          html += '<td>' + (l.market || '—') + '</td>';
          html += '<td>' + (PROGRAM_NAMES[l.program_interest] || l.program_interest || '—') + '</td>';
          html += '<td><span class="badge ' + badgeClass + '">' + l.status + '</span></td>';
          html += '<td>' + new Date(l.created_at).toLocaleDateString() + '</td>';
          html += '</tr>';
        });
        html += '</table></div>';
      }
      html += '</div>';

      return html;
    }

    function statCard(label, value, sub) {
      return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-num">' + value + '</div>' + (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
    }

    function escHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    loadDashboard();
  </script>
</body>
</html>
