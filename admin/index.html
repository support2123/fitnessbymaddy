<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --cream:#FAF8F4; --gold:#B8965A; --gold-light:#D4AF7A; --charcoal:#2C2C2C; --mid-grey:#6B6B6B; --light-grey:#E8E3DC; --sand:#F0EAE0; --green:#27ae60; --red:#c0392b; --blue:#2980b9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--charcoal); }

    /* Auth screen */
    .auth-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-box { background:white; padding:48px 40px; border-radius:4px; box-shadow:0 8px 40px rgba(0,0,0,0.06); text-align:center; width:100%; max-width:400px; }
    .auth-box h1 { font-family:'Cormorant Garamond',serif; font-size:28px; margin-bottom:8px; }
    .auth-box p { color:var(--mid-grey); font-size:13px; margin-bottom:32px; }
    .auth-input { width:100%; padding:14px 16px; border:1.5px solid var(--light-grey); border-radius:2px; font-size:14px; font-family:'DM Sans',sans-serif; margin-bottom:16px; outline:none; background:var(--cream); }
    .auth-input:focus { border-color:var(--gold); }
    .auth-btn { width:100%; padding:14px; background:var(--charcoal); color:white; border:none; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:background 0.3s; }
    .auth-btn:hover { background:var(--gold); }
    .auth-error { color:var(--red); font-size:12px; margin-top:8px; display:none; }

    /* Dashboard */
    .dashboard { display:none; }
    .dash-nav { background:var(--charcoal); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; }
    .dash-nav h1 { font-family:'Cormorant Garamond',serif; color:white; font-size:20px; letter-spacing:2px; }
    .dash-nav button { background:transparent; border:1px solid rgba(255,255,255,0.3); color:rgba(255,255,255,0.7); padding:8px 16px; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border-radius:2px; font-family:'DM Sans',sans-serif; }
    .dash-nav button:hover { border-color:var(--gold); color:var(--gold); }

    .dash-content { padding:32px; max-width:1200px; margin:0 auto; }

    /* Stats cards */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:32px; }
    .stat-card { background:white; padding:24px; border-radius:4px; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
    .stat-card .label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--mid-grey); margin-bottom:8px; }
    .stat-card .value { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:600; color:var(--charcoal); line-height:1; }
    .stat-card .sub { font-size:12px; color:var(--mid-grey); margin-top:4px; }
    .stat-card.gold .value { color:var(--gold); }
    .stat-card.green .value { color:var(--green); }
    .stat-card.red .value { color:var(--red); }

    /* Sections */
    .dash-section { background:white; border-radius:4px; box-shadow:0 2px 12px rgba(0,0,0,0.04); margin-bottom:24px; overflow:hidden; }
    .dash-section-header { padding:20px 24px; border-bottom:1px solid var(--light-grey); display:flex; align-items:center; justify-content:space-between; }
    .dash-section-header h2 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:400; }
    .dash-section-header .badge { background:var(--gold); color:white; font-size:10px; font-weight:600; letter-spacing:1px; padding:4px 10px; border-radius:2px; }

    /* Tables */
    .dash-table { width:100%; border-collapse:collapse; }
    .dash-table th { text-align:left; font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--mid-grey); padding:12px 16px; border-bottom:1px solid var(--light-grey); }
    .dash-table td { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--light-grey); }
    .dash-table tr:last-child td { border-bottom:none; }
    .dash-table tr:hover { background:var(--cream); }

    .status-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:10px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
    .status-new { background:#e8f5e9; color:#2e7d32; }
    .status-qualified { background:#e3f2fd; color:#1565c0; }
    .status-converted { background:#fff3e0; color:#e65100; }
    .status-dropped { background:#fce4ec; color:#c62828; }
    .status-active { background:#e8f5e9; color:#2e7d32; }
    .status-paused { background:#fff3e0; color:#e65100; }
    .status-completed { background:#e3f2fd; color:#1565c0; }

    .empty-state { padding:48px; text-align:center; color:var(--mid-grey); font-size:14px; }

    .tabs { display:flex; gap:0; border-bottom:1px solid var(--light-grey); }
    .tab { padding:12px 24px; font-size:12px; font-weight:500; letter-spacing:1px; text-transform:uppercase; color:var(--mid-grey); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.3s; }
    .tab:hover { color:var(--charcoal); }
    .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

    .refresh-btn { background:var(--cream); border:1px solid var(--light-grey); padding:6px 14px; font-size:11px; letter-spacing:1px; cursor:pointer; border-radius:2px; font-family:'DM Sans',sans-serif; transition:all 0.3s; }
    .refresh-btn:hover { border-color:var(--gold); color:var(--gold); }

    @media (max-width:768px) {
      .dash-content { padding:16px; }
      .stats-grid { grid-template-columns:repeat(2, 1fr); }
      .dash-table { font-size:12px; }
      .dash-table th, .dash-table td { padding:8px 10px; }
    }
  </style>
</head>
<body>

<!-- Auth -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard — Sign in to continue</p>
    <input class="auth-input" type="email" id="authEmail" placeholder="Email">
    <input class="auth-input" type="password" id="authPassword" placeholder="Password">
    <button class="auth-btn" onclick="signIn()">Sign In</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-nav">
    <h1>FBM DASHBOARD</h1>
    <div style="display:flex;gap:12px;align-items:center">
      <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
      <button onclick="signOut()">Sign Out</button>
    </div>
  </div>

  <div class="dash-content">
    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Leads Today</div><div class="value" id="leadsToday">-</div></div>
      <div class="stat-card"><div class="label">Leads This Week</div><div class="value" id="leadsWeek">-</div></div>
      <div class="stat-card gold"><div class="label">Conversion Rate</div><div class="value" id="convRate">-</div></div>
      <div class="stat-card green"><div class="label">Active Clients</div><div class="value" id="activeClients">-</div></div>
      <div class="stat-card"><div class="label">Pending Check-ins</div><div class="value" id="pendingCheckins">-</div></div>
      <div class="stat-card"><div class="label">Programs This Week</div><div class="value" id="programsWeek">-</div></div>
    </div>

    <!-- Escalations -->
    <div class="dash-section" id="escalationsSection">
      <div class="dash-section-header">
        <h2>Escalations</h2>
        <span class="badge" id="escBadge">0</span>
      </div>
      <table class="dash-table">
        <thead><tr><th>Time</th><th>Phone</th><th>Reason</th><th>Message</th></tr></thead>
        <tbody id="escalationsBody"></tbody>
      </table>
    </div>

    <!-- Tabs for Leads / Clients -->
    <div class="dash-section">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('leads',this)">Recent Leads</div>
        <div class="tab" onclick="switchTab('clients',this)">Active Clients</div>
        <div class="tab" onclick="switchTab('programs',this)">Programs</div>
      </div>
      <div id="tabContent">
        <table class="dash-table">
          <thead id="tabHead"></thead>
          <tbody id="tabBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';
  var supabase = null;
  var currentTab = 'leads';

  function initSupabase() {
    SUPABASE_URL = localStorage.getItem('fbm_sb_url') || prompt('Enter Supabase URL:');
    SUPABASE_ANON_KEY = localStorage.getItem('fbm_sb_key') || prompt('Enter Supabase Anon Key:');
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      localStorage.setItem('fbm_sb_url', SUPABASE_URL);
      localStorage.setItem('fbm_sb_key', SUPABASE_ANON_KEY);
    }
  }

  async function sbFetch(table, query) {
    var url = SUPABASE_URL + '/rest/v1/' + table + '?' + (query || '');
    var res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + (sessionStorage.getItem('fbm_token') || SUPABASE_ANON_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'count=exact'
      }
    });
    var count = res.headers.get('content-range');
    var data = await res.json();
    return { data: data, count: count ? parseInt(count.split('/')[1]) : data.length };
  }

  async function signIn() {
    initSupabase();
    var email = document.getElementById('authEmail').value;
    var password = document.getElementById('authPassword').value;
    var errEl = document.getElementById('authError');

    if (!email || !password) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }

    try {
      var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await res.json();
      if (data.access_token) {
        sessionStorage.setItem('fbm_token', data.access_token);
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
      } else {
        errEl.textContent = data.error_description || 'Invalid credentials';
        errEl.style.display = 'block';
      }
    } catch (e) {
      errEl.textContent = 'Connection failed. Check Supabase URL.';
      errEl.style.display = 'block';
    }
  }

  function signOut() {
    sessionStorage.removeItem('fbm_token');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
  }

  async function loadDashboard() {
    var today = new Date(); today.setHours(0,0,0,0);
    var weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);

    try {
      var [leadsAll, leadsToday, leadsWeekData, clients, escalations, programs] = await Promise.all([
        sbFetch('leads', 'select=id,status&limit=1000'),
        sbFetch('leads', 'select=id&created_at=gte.' + today.toISOString()),
        sbFetch('leads', 'select=id&created_at=gte.' + weekAgo.toISOString()),
        sbFetch('clients', 'select=id,status,program'),
        sbFetch('escalations', 'select=*&resolved=eq.false&order=created_at.desc&limit=20'),
        sbFetch('programs', 'select=id&created_at=gte.' + weekAgo.toISOString())
      ]);

      document.getElementById('leadsToday').textContent = leadsToday.data.length;
      document.getElementById('leadsWeek').textContent = leadsWeekData.data.length;

      var totalLeads = leadsAll.data.length;
      var converted = leadsAll.data.filter(function(l) { return l.status === 'converted'; }).length;
      document.getElementById('convRate').textContent = totalLeads ? Math.round((converted / totalLeads) * 100) + '%' : '0%';

      var active = clients.data.filter(function(c) { return c.status === 'active'; });
      document.getElementById('activeClients').textContent = active.length;

      document.getElementById('programsWeek').textContent = programs.data.length;

      // Pending check-ins (approximate)
      document.getElementById('pendingCheckins').textContent = '-';

      // Escalations
      var escBody = document.getElementById('escalationsBody');
      var escBadge = document.getElementById('escBadge');
      escBadge.textContent = escalations.data.length;
      escBody.innerHTML = '';
      if (!escalations.data.length) {
        escBody.innerHTML = '<tr><td colspan="4" class="empty-state">No open escalations</td></tr>';
      } else {
        escalations.data.forEach(function(e) {
          var tr = document.createElement('tr');
          var time = new Date(e.created_at).toLocaleString();
          var phone = e.phone ? e.phone.slice(0,3) + 'XXX...' + e.phone.slice(-3) : '-';
          tr.innerHTML = '<td>' + time + '</td><td>' + phone + '</td><td>' + e.reason + '</td><td>' + (e.message_body || '-').substring(0, 80) + '</td>';
          escBody.appendChild(tr);
        });
      }

      switchTab(currentTab);
    } catch (e) {
      console.error('Dashboard load error:', e);
    }
  }

  async function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    if (el) el.classList.add('active');
    else document.querySelector('.tab:first-child').classList.add('active');

    var head = document.getElementById('tabHead');
    var body = document.getElementById('tabBody');

    if (tab === 'leads') {
      head.innerHTML = '<tr><th>Name</th><th>Phone</th><th>Source</th><th>Interest</th><th>Status</th><th>Created</th></tr>';
      var result = await sbFetch('leads', 'select=*&order=created_at.desc&limit=50');
      body.innerHTML = '';
      result.data.forEach(function(l) {
        var phone = l.phone ? l.phone.slice(0,3) + 'XXX...' + l.phone.slice(-3) : '-';
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (l.name || '-') + '</td><td>' + phone + '</td><td>' + (l.source || '-') + '</td><td>' + (l.program_interest || '-') + '</td><td><span class="status-pill status-' + l.status + '">' + l.status + '</span></td><td>' + new Date(l.created_at).toLocaleDateString() + '</td>';
        body.appendChild(tr);
      });
      if (!result.data.length) body.innerHTML = '<tr><td colspan="6" class="empty-state">No leads yet</td></tr>';
    }

    if (tab === 'clients') {
      head.innerHTML = '<tr><th>Name</th><th>Phone</th><th>Program</th><th>Started</th><th>Status</th></tr>';
      var result = await sbFetch('clients', 'select=*&order=created_at.desc&limit=50');
      body.innerHTML = '';
      result.data.forEach(function(c) {
        var phone = c.phone ? c.phone.slice(0,3) + 'XXX...' + c.phone.slice(-3) : '-';
        var programNames = {
          '6wk_gym':'6W Gym','6wk_home':'6W Home','12wk':'12W Custom',
          'pcos':'PCOS','40plus':'40+','zoom_trial':'Zoom Trial','zoom_pack':'Zoom Pack'
        };
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (c.name || '-') + '</td><td>' + phone + '</td><td>' + (programNames[c.program] || c.program) + '</td><td>' + new Date(c.program_started_at).toLocaleDateString() + '</td><td><span class="status-pill status-' + c.status + '">' + c.status + '</span></td>';
        body.appendChild(tr);
      });
      if (!result.data.length) body.innerHTML = '<tr><td colspan="5" class="empty-state">No clients yet</td></tr>';
    }

    if (tab === 'programs') {
      head.innerHTML = '<tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>PDF</th></tr>';
      var result = await sbFetch('programs', 'select=*&order=generated_at.desc&limit=50');
      body.innerHTML = '';
      result.data.forEach(function(p) {
        var tr = document.createElement('tr');
        var sent = p.whatsapp_sent_at ? new Date(p.whatsapp_sent_at).toLocaleString() : 'Not sent';
        var pdf = p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">Download</a>' : '-';
        tr.innerHTML = '<td>' + (p.client_id || '-').substring(0,8) + '...</td><td>Week ' + p.week_no + '</td><td>' + new Date(p.generated_at).toLocaleString() + '</td><td>' + sent + '</td><td>' + pdf + '</td>';
        body.appendChild(tr);
      });
      if (!result.data.length) body.innerHTML = '<tr><td colspan="5" class="empty-state">No programs generated yet</td></tr>';
    }
  }

  // Auto-sign in if token exists
  if (sessionStorage.getItem('fbm_token')) {
    initSupabase();
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }
</script>
</body>
</html>
