<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC; --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    /* Login */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--charcoal); padding: 24px;
    }
    .login-card {
      background: var(--white); padding: 48px 40px; border-radius: 4px; width: 100%;
      max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .login-card h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400;
      text-align: center; margin-bottom: 8px;
    }
    .login-card h1 em { color: var(--gold); }
    .login-subtitle { text-align: center; font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-group { margin-bottom: 20px; }
    .login-label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px;
    }
    .login-input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .login-btn:hover { background: var(--gold); }
    .login-error { color: #c0392b; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-nav {
      background: var(--charcoal); padding: 0 32px; display: flex;
      align-items: center; justify-content: space-between; height: 64px;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;
      letter-spacing: 2px; color: white; text-transform: uppercase;
    }
    .dash-nav-right { display: flex; align-items: center; gap: 16px; }
    .dash-refresh {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
      padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; transition: all 0.3s; font-family: 'DM Sans', sans-serif;
    }
    .dash-refresh:hover { border-color: var(--gold); color: var(--gold); }
    .dash-logout {
      background: transparent; border: none; color: rgba(255,255,255,0.4);
      font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .dash-logout:hover { color: var(--gold-light); }

    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--white); padding: 24px; border-radius: 4px;
      border-top: 3px solid var(--light-grey); transition: border-color 0.3s;
    }
    .stat-card:hover { border-top-color: var(--gold); }
    .stat-card .label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--light-grey); margin-bottom: 24px; }
    .tab {
      padding: 12px 24px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.3s; background: none; border-top: none; border-left: none; border-right: none;
      font-family: 'DM Sans', sans-serif;
    }
    .tab:hover { color: var(--charcoal); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Tables */
    .table-wrap { background: var(--white); border-radius: 4px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 14px 16px; font-size: 11px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey);
      background: var(--sand); border-bottom: 1px solid var(--light-grey);
    }
    td { padding: 14px 16px; font-size: 13px; border-bottom: 1px solid var(--light-grey); }
    tr:hover td { background: var(--cream); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .status-new { background: #E8F4FD; color: #2980b9; }
    .status-qualified { background: #FFF3E0; color: #e67e22; }
    .status-converted { background: #E8F5E9; color: #27ae60; }
    .status-dropped { background: #FFEBEE; color: #c0392b; }
    .status-active { background: #E8F5E9; color: #27ae60; }
    .status-paused { background: #FFF3E0; color: #e67e22; }
    .status-completed { background: #E8F4FD; color: #2980b9; }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Escalation cards */
    .esc-card {
      background: var(--white); border-left: 4px solid #c0392b; padding: 20px 24px;
      margin-bottom: 12px; border-radius: 0 4px 4px 0;
    }
    .esc-card .esc-reason { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .esc-card .esc-meta { font-size: 12px; color: var(--mid-grey); }
    .esc-resolve {
      margin-top: 8px; padding: 6px 16px; background: transparent; border: 1px solid var(--light-grey);
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      border-radius: 2px; font-family: 'DM Sans', sans-serif; color: var(--mid-grey); transition: all 0.3s;
    }
    .esc-resolve:hover { border-color: var(--gold); color: var(--gold); }

    .empty-state { text-align: center; padding: 60px 24px; color: var(--mid-grey); font-size: 14px; }

    .filter-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .filter-select {
      padding: 8px 16px; border: 1px solid var(--light-grey); border-radius: 2px;
      font-size: 12px; font-family: 'DM Sans', sans-serif; background: var(--white);
      outline: none; color: var(--charcoal); appearance: none;
    }

    @media (max-width: 768px) {
      .dash-content { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .tabs { overflow-x: auto; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <h1>Fitness by <em>Maddy</em></h1>
    <p class="login-subtitle">Admin Dashboard</p>
    <form id="login-form">
      <div class="login-group">
        <label class="login-label">Email</label>
        <input type="email" class="login-input" id="login-email" required placeholder="maddy@fitnessbymaddy.com">
      </div>
      <div class="login-group">
        <label class="login-label">Password</label>
        <input type="password" class="login-input" id="login-password" required placeholder="Enter password">
      </div>
      <button type="submit" class="login-btn">Sign In</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-nav">
    <span class="dash-logo">FBM Admin</span>
    <div class="dash-nav-right">
      <button class="dash-refresh" onclick="loadDashboard()">Refresh</button>
      <button class="dash-logout" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="stats-grid" id="stats-grid"></div>

    <div class="tabs">
      <button class="tab active" data-panel="leads-panel">Leads</button>
      <button class="tab" data-panel="clients-panel">Clients</button>
      <button class="tab" data-panel="escalations-panel">Escalations</button>
      <button class="tab" data-panel="programs-panel">Programs</button>
    </div>

    <!-- LEADS PANEL -->
    <div class="panel active" id="leads-panel">
      <div class="filter-row">
        <select class="filter-select" id="leads-status-filter">
          <option value="">All Statuses</option>
          <option value="new">New</option>
          <option value="qualified">Qualified</option>
          <option value="converted">Converted</option>
          <option value="dropped">Dropped</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Program Interest</th><th>Market</th><th>Created</th></tr></thead>
          <tbody id="leads-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- CLIENTS PANEL -->
    <div class="panel" id="clients-panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Program</th><th>Status</th><th>Started</th><th>Paid</th></tr></thead>
          <tbody id="clients-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ESCALATIONS PANEL -->
    <div class="panel" id="escalations-panel">
      <div id="escalations-list"></div>
    </div>

    <!-- PROGRAMS PANEL -->
    <div class="panel" id="programs-panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>Flagged</th><th>PDF</th></tr></thead>
          <tbody id="programs-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';

  var metaUrl = document.querySelector('meta[name="supabase-url"]');
  var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
  if (metaUrl) SUPABASE_URL = metaUrl.content;
  if (metaKey) SUPABASE_ANON_KEY = metaKey.content;

  if (!SUPABASE_URL) SUPABASE_URL = window.__SUPABASE_URL__ || '';
  if (!SUPABASE_ANON_KEY) SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || '';

  var sb = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 6) return phone || '—';
    return phone.slice(0, 4) + '***' + phone.slice(-3);
  }

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusBadge(status) {
    return '<span class="status-badge status-' + (status || 'new') + '">' + (status || 'new') + '</span>';
  }

  // Tab switching
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
    });
  });

  // Login
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!sb) {
      errEl.textContent = 'Supabase not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY.';
      errEl.style.display = 'block';
      return;
    }

    var email = document.getElementById('login-email').value;
    var password = document.getElementById('login-password').value;

    var result = await sb.auth.signInWithPassword({ email: email, password: password });
    if (result.error) {
      errEl.textContent = result.error.message;
      errEl.style.display = 'block';
      return;
    }

    showDashboard();
  });

  // Check existing session
  async function checkSession() {
    if (!sb) return;
    var session = await sb.auth.getSession();
    if (session.data.session) showDashboard();
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  // Logout
  document.getElementById('logout-btn').addEventListener('click', async function() {
    if (sb) await sb.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  });

  // Load dashboard data
  window.loadDashboard = async function() {
    if (!sb) return;

    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    var weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

    // Fetch all data in parallel
    var results = await Promise.all([
      sb.from('leads').select('*').order('created_at', { ascending: false }),
      sb.from('clients').select('*').order('created_at', { ascending: false }),
      sb.from('checkins').select('*').order('form_submitted_at', { ascending: false }).limit(50),
      sb.from('programs').select('*').order('generated_at', { ascending: false }).limit(50),
      sb.from('messages').select('*').eq('template_name', 'escalation_alert').order('sent_at', { ascending: false }).limit(20)
    ]);

    var leads = results[0].data || [];
    var clients = results[1].data || [];
    var checkins = results[2].data || [];
    var programs = results[3].data || [];
    var escalations = results[4].data || [];

    var leadsToday = leads.filter(function(l) { return l.created_at >= todayStart; }).length;
    var leadsWeek = leads.filter(function(l) { return l.created_at >= weekStart; }).length;
    var activeClients = clients.filter(function(c) { return c.status === 'active'; }).length;
    var converted = leads.filter(function(l) { return l.status === 'converted'; }).length;
    var convRate = leads.length > 0 ? Math.round((converted / leads.length) * 100) : 0;
    var programsWeek = programs.filter(function(p) { return p.generated_at >= weekStart; }).length;

    // Stats
    document.getElementById('stats-grid').innerHTML =
      statCard('New Leads Today', leadsToday, '') +
      statCard('Leads This Week', leadsWeek, '') +
      statCard('Conversion Rate', convRate + '%', converted + ' of ' + leads.length) +
      statCard('Active Clients', activeClients, '') +
      statCard('Programs This Week', programsWeek, '') +
      statCard('Escalations', escalations.length, 'pending review');

    // Leads table
    renderLeads(leads);

    // Leads filter
    document.getElementById('leads-status-filter').onchange = function() {
      var val = this.value;
      var filtered = val ? leads.filter(function(l) { return l.status === val; }) : leads;
      renderLeads(filtered);
    };

    // Clients table
    var clientRows = clients.map(function(c) {
      return '<tr><td>' + (c.name || '—') + '</td><td>' + (c.program || '—') + '</td><td>' +
        statusBadge(c.status) + '</td><td>' + fmtDate(c.program_started_at) + '</td><td>' +
        (c.paid_amount ? '$' + c.paid_amount : '—') + '</td></tr>';
    }).join('');
    document.getElementById('clients-tbody').innerHTML = clientRows || '<tr><td colspan="5" class="empty-state">No clients yet</td></tr>';

    // Escalations
    var escHtml = escalations.length === 0
      ? '<div class="empty-state">No escalations pending</div>'
      : escalations.map(function(e) {
          return '<div class="esc-card"><div class="esc-reason">' + (e.body || 'Escalation alert') +
            '</div><div class="esc-meta">' + maskPhone(e.phone) + ' &middot; ' + fmtDate(e.sent_at) +
            '</div><button class="esc-resolve">Mark Resolved</button></div>';
        }).join('');
    document.getElementById('escalations-list').innerHTML = escHtml;

    // Programs table
    var progRows = programs.map(function(p) {
      var clientName = clients.find(function(c) { return c.id === p.client_id; });
      return '<tr><td>' + (clientName ? clientName.name : p.client_id.slice(0,8)) + '</td><td>Week ' + p.week_no +
        '</td><td>' + fmtDate(p.generated_at) + '</td><td>' + (p.whatsapp_sent_at ? fmtDate(p.whatsapp_sent_at) : 'Not sent') +
        '</td><td>' + (p.safety_flagged ? '<span style="color:#c0392b">YES</span>' : '—') +
        '</td><td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">View</a>' : '—') + '</td></tr>';
    }).join('');
    document.getElementById('programs-tbody').innerHTML = progRows || '<tr><td colspan="6" class="empty-state">No programs generated yet</td></tr>';
  };

  function renderLeads(leads) {
    var rows = leads.map(function(l) {
      return '<tr><td>' + (l.name || '—') + '</td><td>' + maskPhone(l.phone) + '</td><td>' +
        statusBadge(l.status) + '</td><td>' + (l.program_interest || '—') + '</td><td>' +
        (l.market || '—') + '</td><td>' + fmtDate(l.created_at) + '</td></tr>';
    }).join('');
    document.getElementById('leads-tbody').innerHTML = rows || '<tr><td colspan="6" class="empty-state">No leads yet</td></tr>';
  }

  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' +
      value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  checkSession();
})();
</script>
</body>
</html>
