<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF; --green: #4CAF50; --red: #E53935;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .login-screen, .dashboard { display: none; }
    .login-screen.active, .dashboard.active { display: block; }

    /* Login */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--charcoal);
    }
    .login-screen.active { display: flex; }
    .login-box {
      background: var(--white); padding: 48px; border-radius: 4px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-box h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 8px;
    }
    .login-box p { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 16px;
      background: var(--cream); outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
    }
    .login-box button:hover { background: var(--gold); }
    .login-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dash-header {
      background: var(--charcoal); padding: 20px 40px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 18px; color: white;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .dash-user { font-size: 12px; color: var(--gold-light); }
    .dash-logout {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
      padding: 6px 16px; font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px;
      margin-left: 16px;
    }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-body { padding: 40px; max-width: 1200px; margin: 0 auto; }
    .dash-title {
      font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 8px;
    }
    .dash-subtitle { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }

    /* Stat Cards */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 40px;
    }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      border: 1px solid var(--light-grey);
    }
    .stat-card-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600;
      color: var(--charcoal); line-height: 1;
    }
    .stat-card-sub { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.gold { border-left: 3px solid var(--gold); }
    .stat-card.green { border-left: 3px solid var(--green); }
    .stat-card.red { border-left: 3px solid var(--red); }

    /* Tables */
    .section-block { margin-bottom: 40px; }
    .section-block h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 16px;
    }
    .data-table {
      width: 100%; background: white; border-collapse: collapse;
      border: 1px solid var(--light-grey); border-radius: 4px; overflow: hidden;
    }
    .data-table th {
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); padding: 12px 16px; text-align: left;
      background: var(--sand); border-bottom: 1px solid var(--light-grey);
    }
    .data-table td {
      font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--light-grey);
      color: var(--charcoal);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 10px;
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-new { background: #E3F2FD; color: #1565C0; }
    .badge-qualified { background: #FFF3E0; color: #E65100; }
    .badge-converted { background: #E8F5E9; color: #2E7D32; }
    .badge-dropped { background: #FFEBEE; color: #C62828; }
    .badge-active { background: #E8F5E9; color: #2E7D32; }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); font-size: 14px; }

    @media (max-width: 768px) {
      .dash-body { padding: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen active" id="loginScreen">
    <div class="login-box">
      <h1>Dashboard</h1>
      <p>Fitness by Maddy — Admin Access</p>
      <input type="email" id="loginEmail" placeholder="Email address">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="handleLogin()">Sign In</button>
      <div class="login-error" id="loginError">Invalid email or password.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <div class="dash-logo">Fitness by Maddy</div>
      <div>
        <span class="dash-user" id="dashUser"></span>
        <button class="dash-logout" onclick="handleLogout()">Logout</button>
      </div>
    </div>
    <div class="dash-body">
      <h1 class="dash-title">Daily Operations</h1>
      <p class="dash-subtitle" id="dashDate"></p>

      <!-- Stats Grid -->
      <div class="stats-grid" id="statsGrid">
        <div class="loading">Loading dashboard...</div>
      </div>

      <!-- Escalations -->
      <div class="section-block" id="escalationsBlock" style="display:none">
        <h3>Escalations Awaiting Review</h3>
        <table class="data-table">
          <thead><tr><th>Time</th><th>Details</th></tr></thead>
          <tbody id="escalationsBody"></tbody>
        </table>
      </div>

      <!-- Recent Leads -->
      <div class="section-block">
        <h3>Recent Leads</h3>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Phone</th><th>Source</th><th>Status</th><th>Interest</th><th>Date</th></tr></thead>
          <tbody id="leadsBody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
        </table>
      </div>

      <!-- Recent Clients -->
      <div class="section-block">
        <h3>Active Clients</h3>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Program</th><th>Status</th><th>Started</th><th>Ends</th></tr></thead>
          <tbody id="clientsBody"><tr><td colspan="5" class="loading">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = '%%SUPABASE_URL%%';
const API_BASE = '';
let authToken = null;

function init() {
  const saved = localStorage.getItem('fbm_token');
  if (saved) {
    authToken = saved;
    showDashboard();
    loadStats();
  }
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': '%%SUPABASE_ANON_KEY%%',
      },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok || !data.access_token) throw new Error(data.error_description || 'Login failed');
    authToken = data.access_token;
    localStorage.setItem('fbm_token', authToken);
    showDashboard();
    loadStats();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function handleLogout() {
  authToken = null;
  localStorage.removeItem('fbm_token');
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('dashboard').classList.remove('active');
}

function showDashboard() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('dashboard').classList.add('active');
  document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-GB', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

async function loadStats() {
  try {
    const res = await fetch(API_BASE + '/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + authToken },
    });
    if (res.status === 401) { handleLogout(); return; }
    const data = await res.json();
    renderStats(data);
  } catch (e) {
    console.error('Failed to load stats:', e);
  }
}

function renderStats(data) {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-card gold">
      <div class="stat-card-label">Leads Today</div>
      <div class="stat-card-value">${data.leads.today}</div>
      <div class="stat-card-sub">${data.leads.week} this week</div>
    </div>
    <div class="stat-card green">
      <div class="stat-card-label">Conversion Rate</div>
      <div class="stat-card-value">${data.leads.conversionRate}%</div>
      <div class="stat-card-sub">${data.leads.converted} of ${data.leads.total} leads</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Active Clients</div>
      <div class="stat-card-value">${data.clients.active}</div>
      <div class="stat-card-sub">${Object.entries(data.clients.byProgram).map(([k,v]) => k + ': ' + v).join(', ') || 'None yet'}</div>
    </div>
    <div class="stat-card ${data.checkins.pending > 0 ? 'red' : ''}">
      <div class="stat-card-label">Pending Check-ins</div>
      <div class="stat-card-value">${data.checkins.pending}</div>
      <div class="stat-card-sub">${data.checkins.doneThisWeek} done this week</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Programs Generated</div>
      <div class="stat-card-value">${data.programs.generatedThisWeek}</div>
      <div class="stat-card-sub">This week</div>
    </div>
    <div class="stat-card ${data.escalations.length > 0 ? 'red' : ''}">
      <div class="stat-card-label">Escalations</div>
      <div class="stat-card-value">${data.escalations.length}</div>
      <div class="stat-card-sub">Awaiting review</div>
    </div>
  `;

  // Escalations
  if (data.escalations.length > 0) {
    document.getElementById('escalationsBlock').style.display = 'block';
    document.getElementById('escalationsBody').innerHTML = data.escalations.map(e => `
      <tr>
        <td>${new Date(e.sent_at).toLocaleString('en-GB')}</td>
        <td>${escapeHtml(e.body || '')}</td>
      </tr>
    `).join('');
  }

  // Recent leads
  document.getElementById('leadsBody').innerHTML = (data.recentLeads || []).map(l => `
    <tr>
      <td>${escapeHtml(l.name || '-')}</td>
      <td>${maskPhone(l.phone)}</td>
      <td>${escapeHtml(l.source || '-')}</td>
      <td><span class="badge badge-${l.status}">${l.status}</span></td>
      <td>${escapeHtml(l.program_interest || '-')}</td>
      <td>${new Date(l.created_at).toLocaleDateString('en-GB')}</td>
    </tr>
  `).join('') || '<tr><td colspan="6">No leads yet</td></tr>';

  // Recent clients
  document.getElementById('clientsBody').innerHTML = (data.recentClients || []).map(c => `
    <tr>
      <td>${escapeHtml(c.name || '-')}</td>
      <td>${escapeHtml(c.program || '-')}</td>
      <td><span class="badge badge-${c.status}">${c.status}</span></td>
      <td>${c.program_started_at ? new Date(c.program_started_at).toLocaleDateString('en-GB') : '-'}</td>
      <td>${c.program_ends_at ? new Date(c.program_ends_at).toLocaleDateString('en-GB') : '-'}</td>
    </tr>
  `).join('') || '<tr><td colspan="5">No clients yet</td></tr>';
}

function maskPhone(phone) {
  if (!phone || phone.length < 6) return '***';
  return phone.slice(0, 3) + 'XXX...' + phone.slice(-3);
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
