<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #4CAF50;
      --red: #E53935;
      --orange: #FF9800;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
    }
    .admin-header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      color: var(--gold);
    }
    .admin-badge {
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }
    #loginScreen {
      max-width: 400px;
      margin: 120px auto;
      padding: 48px;
      background: white;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    #loginScreen h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    #loginScreen input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px;
      outline: none;
    }
    #loginScreen input:focus { border-color: var(--gold); }
    #loginScreen button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 2px;
    }
    #loginScreen button:hover { background: var(--gold); }
    .dashboard { display: none; padding: 32px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card-sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) {
      .section-grid { grid-template-columns: 1fr; }
      .dashboard { padding: 16px; }
    }
    .panel {
      background: white;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--light-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--charcoal);
    }
    .panel-body {
      padding: 16px 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--light-grey);
    }
    td {
      font-size: 13px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--light-grey);
      color: var(--charcoal);
    }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .badge-new { background: #E3F2FD; color: #1565C0; }
    .badge-qualified { background: #FFF3E0; color: #E65100; }
    .badge-converted { background: #E8F5E9; color: #2E7D32; }
    .badge-dropped { background: #FFEBEE; color: #C62828; }
    .badge-active { background: #E8F5E9; color: #2E7D32; }
    .badge-paused { background: #FFF3E0; color: #E65100; }
    .badge-completed { background: #F3E5F5; color: #6A1B9A; }
    .escalation-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--light-grey);
    }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--red);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .escalation-detail {
      font-size: 13px;
      color: var(--mid-grey);
      line-height: 1.5;
    }
    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--mid-grey);
      font-size: 13px;
    }
    .refresh-btn {
      background: none;
      border: 1px solid var(--light-grey);
      padding: 6px 12px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      color: var(--mid-grey);
      transition: all 0.3s;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
  <div class="admin-header">
    <div class="admin-logo">FITNESS BY MADDY</div>
    <div class="admin-badge">Operations Dashboard</div>
  </div>

  <div id="loginScreen">
    <h2>ADMIN LOGIN</h2>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">SIGN IN</button>
    <p id="loginError" style="color:var(--red);font-size:12px;margin-top:12px;display:none"></p>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section-grid">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">RECENT LEADS</div>
          <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
        </div>
        <div class="panel-body" id="leadsTable"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">ACTIVE CLIENTS</div>
        </div>
        <div class="panel-body" id="clientsTable"></div>
      </div>
    </div>
    <div class="section-grid">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">PENDING CHECK-INS</div>
        </div>
        <div class="panel-body" id="pendingCheckins"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">ESCALATIONS</div>
        </div>
        <div class="panel-body" id="escalations"></div>
      </div>
    </div>
    <div class="section-grid">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">PROGRAMS GENERATED THIS WEEK</div>
        </div>
        <div class="panel-body" id="programsGenerated"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">RECENT MESSAGES</div>
        </div>
        <div class="panel-body" id="recentMessages"></div>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = '';
    var SUPABASE_ANON_KEY = '';
    var supabase = null;

    function initSupabase() {
      SUPABASE_URL = localStorage.getItem('sb_url') || prompt('Enter Supabase URL:');
      SUPABASE_ANON_KEY = localStorage.getItem('sb_key') || prompt('Enter Supabase anon key:');
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        localStorage.setItem('sb_url', SUPABASE_URL);
        localStorage.setItem('sb_key', SUPABASE_ANON_KEY);
      }
    }

    async function sbFetch(table, query) {
      var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
      var res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + (sessionStorage.getItem('sb_token') || SUPABASE_ANON_KEY)
        }
      });
      return res.json();
    }

    async function login() {
      initSupabase();
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var errEl = document.getElementById('loginError');

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ email: email, password: password })
        });
        var data = await res.json();
        if (data.access_token) {
          sessionStorage.setItem('sb_token', data.access_token);
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadDashboard();
        } else {
          errEl.textContent = 'Invalid credentials';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
      }
    }

    async function loadDashboard() {
      try {
        var now = new Date();
        var weekAgo = new Date(now - 7 * 86400000).toISOString();
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();

        var [leads, clients, checkins, programs, messages] = await Promise.all([
          sbFetch('leads', 'select=*&order=created_at.desc&limit=50'),
          sbFetch('clients', 'select=*&order=created_at.desc'),
          sbFetch('checkins', 'select=*&order=form_submitted_at.desc&limit=20'),
          sbFetch('programs', 'select=*&order=generated_at.desc&limit=20'),
          sbFetch('messages', 'select=*&order=sent_at.desc&limit=30')
        ]);

        if (!Array.isArray(leads)) leads = [];
        if (!Array.isArray(clients)) clients = [];
        if (!Array.isArray(checkins)) checkins = [];
        if (!Array.isArray(programs)) programs = [];
        if (!Array.isArray(messages)) messages = [];

        var leadsToday = leads.filter(function(l) { return l.created_at >= todayStart; }).length;
        var leadsWeek = leads.filter(function(l) { return l.created_at >= weekAgo; }).length;
        var activeClients = clients.filter(function(c) { return c.status === 'active'; });
        var converted = leads.filter(function(l) { return l.status === 'converted'; }).length;
        var convRate = leads.length > 0 ? Math.round((converted / leads.length) * 100) : 0;
        var programsWeek = programs.filter(function(p) { return p.generated_at >= weekAgo; }).length;

        renderStats(leadsToday, leadsWeek, activeClients.length, convRate, programsWeek);
        renderLeads(leads.slice(0, 15));
        renderClients(activeClients);
        renderPendingCheckins(activeClients, checkins);
        renderEscalations(messages);
        renderPrograms(programs.filter(function(p) { return p.generated_at >= weekAgo; }));
        renderMessages(messages.slice(0, 15));
      } catch (e) {
        console.error('Dashboard load error:', e);
      }
    }

    function renderStats(today, week, active, convRate, programs) {
      document.getElementById('statsGrid').innerHTML =
        statCard('New Leads Today', today, '') +
        statCard('Leads This Week', week, '') +
        statCard('Active Clients', active, '') +
        statCard('Conversion Rate', convRate + '%', 'lead to paid') +
        statCard('Programs This Week', programs, 'generated');
    }

    function statCard(label, value, sub) {
      return '<div class="stat-card"><div class="stat-card-label">' + label + '</div><div class="stat-card-value">' + value + '</div>' + (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') + '</div>';
    }

    function maskPhone(p) {
      if (!p || p.length < 6) return '***';
      return p.slice(0, 4) + '***' + p.slice(-3);
    }

    function renderLeads(leads) {
      if (!leads.length) {
        document.getElementById('leadsTable').innerHTML = '<div class="empty-state">No leads yet</div>';
        return;
      }
      var html = '<table><thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Interest</th></tr></thead><tbody>';
      leads.forEach(function(l) {
        html += '<tr><td>' + maskPhone(l.phone) + '</td><td>' + (l.name || '-') + '</td><td><span class="badge badge-' + l.status + '">' + l.status + '</span></td><td>' + (l.program_interest || '-') + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('leadsTable').innerHTML = html;
    }

    function renderClients(clients) {
      if (!clients.length) {
        document.getElementById('clientsTable').innerHTML = '<div class="empty-state">No active clients</div>';
        return;
      }
      var html = '<table><thead><tr><th>Name</th><th>Program</th><th>Status</th><th>Started</th></tr></thead><tbody>';
      clients.forEach(function(c) {
        var started = c.program_started_at ? new Date(c.program_started_at).toLocaleDateString() : '-';
        html += '<tr><td>' + (c.name || maskPhone(c.phone)) + '</td><td>' + (c.program || '-') + '</td><td><span class="badge badge-' + c.status + '">' + c.status + '</span></td><td>' + started + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('clientsTable').innerHTML = html;
    }

    function renderPendingCheckins(clients, checkins) {
      var now = new Date();
      var pending = clients.filter(function(c) {
        var start = new Date(c.program_started_at);
        var week = Math.ceil((now - start) / (7 * 86400000));
        return week > 0 && !checkins.some(function(ci) { return ci.client_id === c.id && ci.week_no === week; });
      });

      if (!pending.length) {
        document.getElementById('pendingCheckins').innerHTML = '<div class="empty-state">All check-ins up to date</div>';
        return;
      }
      var html = '<table><thead><tr><th>Client</th><th>Week</th></tr></thead><tbody>';
      pending.forEach(function(c) {
        var start = new Date(c.program_started_at);
        var week = Math.ceil((now - start) / (7 * 86400000));
        html += '<tr><td>' + (c.name || maskPhone(c.phone)) + '</td><td>Week ' + week + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('pendingCheckins').innerHTML = html;
    }

    function renderEscalations(messages) {
      var keywords = ['refund', 'pain', 'injury', 'complaint', 'lawyer', 'side effect', 'dizziness', 'pregnant'];
      var flagged = messages.filter(function(m) {
        if (m.direction !== 'in') return false;
        var lower = (m.body || '').toLowerCase();
        return keywords.some(function(kw) { return lower.includes(kw); });
      });

      if (!flagged.length) {
        document.getElementById('escalations').innerHTML = '<div class="empty-state">No escalations</div>';
        return;
      }
      var html = '';
      flagged.forEach(function(m) {
        html += '<div class="escalation-item"><div class="escalation-label">FLAGGED MESSAGE</div><div class="escalation-detail">' + maskPhone(m.phone) + ': ' + (m.body || '').slice(0, 120) + '</div></div>';
      });
      document.getElementById('escalations').innerHTML = html;
    }

    function renderPrograms(programs) {
      if (!programs.length) {
        document.getElementById('programsGenerated').innerHTML = '<div class="empty-state">No programs generated this week</div>';
        return;
      }
      var html = '<table><thead><tr><th>Client</th><th>Week</th><th>Generated</th></tr></thead><tbody>';
      programs.forEach(function(p) {
        var date = p.generated_at ? new Date(p.generated_at).toLocaleDateString() : '-';
        html += '<tr><td>' + (p.client_id || '-').slice(0, 8) + '...</td><td>Week ' + p.week_no + '</td><td>' + date + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('programsGenerated').innerHTML = html;
    }

    function renderMessages(messages) {
      if (!messages.length) {
        document.getElementById('recentMessages').innerHTML = '<div class="empty-state">No messages</div>';
        return;
      }
      var html = '<table><thead><tr><th>Phone</th><th>Dir</th><th>Message</th></tr></thead><tbody>';
      messages.forEach(function(m) {
        var dir = m.direction === 'in' ? '←' : '→';
        var body = (m.body || '').slice(0, 60);
        html += '<tr><td>' + maskPhone(m.phone) + '</td><td>' + dir + '</td><td>' + body + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('recentMessages').innerHTML = html;
    }

    if (sessionStorage.getItem('sb_token') && localStorage.getItem('sb_url')) {
      SUPABASE_URL = localStorage.getItem('sb_url');
      SUPABASE_ANON_KEY = localStorage.getItem('sb_key');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }
  </script>
</body>
</html>
