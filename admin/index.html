<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --gold: #B8965A; --charcoal: #2C2C2C; --bg: #111; --card: #1a1a1a; --border: #2a2a2a; --muted: #888; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: var(--card); padding: 48px 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 16px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #111; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .login-btn:hover { background: #D4AF7A; }

    .dashboard { display: none; }
    .dash-nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .dash-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 3px; }
    .dash-logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 4px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 2px; margin-bottom: 16px; margin-top: 32px; }

    .data-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .data-table th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
    .data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .data-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .badge-new { background: rgba(184,150,90,0.15); color: var(--gold); }
    .badge-active { background: rgba(76,175,80,0.15); color: #4CAF50; }
    .badge-qualified { background: rgba(33,150,243,0.15); color: #2196F3; }
    .badge-dropped { background: rgba(244,67,54,0.15); color: #F44336; }
    .badge-converted { background: rgba(76,175,80,0.15); color: #4CAF50; }
    .badge-completed { background: rgba(158,158,158,0.15); color: #9E9E9E; }

    .escalation-card { background: var(--card); border: 1px solid #F44336; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
    .escalation-card .esc-reason { color: #F44336; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .escalation-card .esc-details { color: var(--muted); font-size: 12px; }

    .empty-state { text-align: center; padding: 48px; color: var(--muted); }
    .empty-state p { font-size: 14px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .tab { padding: 8px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--muted); cursor: pointer; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }
    .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .refresh-btn { background: var(--card); border: 1px solid var(--border); color: var(--gold); padding: 8px 16px; border-radius: 4px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { background: var(--gold); color: #111; }

    @media (max-width: 600px) {
      .dash-content { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>FITNESS BY MADDY</h1>
    <p>Admin Dashboard</p>
    <input class="login-input" type="email" id="loginEmail" placeholder="Email">
    <input class="login-input" type="password" id="loginPassword" placeholder="Password">
    <button class="login-btn" id="loginBtn">Sign In</button>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <nav class="dash-nav">
    <span class="dash-logo">FITNESS BY MADDY — OPS</span>
    <div style="display:flex; gap:12px; align-items:center;">
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
      <button class="dash-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="dash-content">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="tabs">
      <div class="tab active" data-tab="leads">Leads</div>
      <div class="tab" data-tab="clients">Clients</div>
      <div class="tab" data-tab="checkins">Check-Ins</div>
      <div class="tab" data-tab="programs">Programs</div>
      <div class="tab" data-tab="escalations">Escalations</div>
    </div>

    <div id="leadsPanel" class="tab-panel active"></div>
    <div id="clientsPanel" class="tab-panel"></div>
    <div id="checkinsPanel" class="tab-panel"></div>
    <div id="programsPanel" class="tab-panel"></div>
    <div id="escalationsPanel" class="tab-panel"></div>
  </div>
</div>

<script>
(function() {
  var supabaseUrl, supabaseKey, supabase;

  var SUPA_URL = '';
  var SUPA_ANON = '';

  function initSupabase(url, key) {
    supabaseUrl = url;
    supabaseKey = key;
  }

  async function query(table, opts) {
    var url = supabaseUrl + '/rest/v1/' + table;
    var params = new URLSearchParams();
    if (opts.select) params.set('select', opts.select);
    if (opts.order) params.set('order', opts.order);
    if (opts.limit) params.set('limit', opts.limit);
    if (opts.filters) {
      opts.filters.forEach(function(f) { params.set(f[0], f[1]); });
    }

    var res = await fetch(url + '?' + params.toString(), {
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey,
        'Content-Type': 'application/json',
      },
    });
    return res.json();
  }

  document.getElementById('loginBtn').addEventListener('click', async function() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;

    try {
      var url = document.getElementById('loginEmail').dataset.url || prompt('Supabase URL (e.g. https://xxx.supabase.co):');
      var key = prompt('Supabase anon key:');

      if (!url || !key) return alert('Supabase credentials required');

      var res = await fetch(url + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': key,
        },
        body: JSON.stringify({ email: email, password: password }),
      });
      var data = await res.json();

      if (data.access_token) {
        initSupabase(url, data.access_token);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
      } else {
        alert('Login failed: ' + (data.error_description || data.msg || 'Invalid credentials'));
      }
    } catch (e) {
      alert('Connection error: ' + e.message);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  });

  document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');
    });
  });

  async function loadDashboard() {
    try {
      var leads = await query('leads', { select: '*', order: 'created_at.desc', limit: '100' });
      var clients = await query('clients', { select: '*', order: 'created_at.desc', limit: '100' });
      var checkins = await query('checkins', { select: '*,clients(name,phone)', order: 'created_at.desc', limit: '50' });
      var programs = await query('programs', { select: '*,clients(name)', order: 'created_at.desc', limit: '50' });

      var today = new Date(); today.setHours(0,0,0,0);
      var weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);

      var leadsToday = leads.filter(function(l) { return new Date(l.created_at) >= today; }).length;
      var leadsWeek = leads.filter(function(l) { return new Date(l.created_at) >= weekAgo; }).length;
      var converted = leads.filter(function(l) { return l.status === 'converted'; }).length;
      var convRate = leads.length > 0 ? Math.round((converted / leads.length) * 100) : 0;
      var activeClients = clients.filter(function(c) { return c.status === 'active'; }).length;
      var pendingCheckins = clients.filter(function(c) { return c.status === 'active'; }).length;
      var programsWeek = programs.filter(function(p) { return new Date(p.created_at) >= weekAgo; }).length;

      document.getElementById('statsGrid').innerHTML =
        statCard('New Leads Today', leadsToday, 'This week: ' + leadsWeek) +
        statCard('Conversion Rate', convRate + '%', converted + ' of ' + leads.length + ' leads') +
        statCard('Active Clients', activeClients, byProgram(clients)) +
        statCard('Pending Check-Ins', pendingCheckins, 'Active clients awaiting') +
        statCard('Programs This Week', programsWeek, 'Generated & sent') +
        statCard('Total Revenue', '$' + clients.reduce(function(s,c) { return s + (c.paid_amount || 0); }, 0), 'Lifetime');

      document.getElementById('leadsPanel').innerHTML = renderLeadsTable(leads);
      document.getElementById('clientsPanel').innerHTML = renderClientsTable(clients);
      document.getElementById('checkinsPanel').innerHTML = renderCheckinsTable(checkins);
      document.getElementById('programsPanel').innerHTML = renderProgramsTable(programs);
      document.getElementById('escalationsPanel').innerHTML = renderEscalations(leads, clients);

    } catch (e) {
      console.error('Dashboard load error:', e);
    }
  }

  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + (sub || '') + '</div></div>';
  }

  function byProgram(clients) {
    var counts = {};
    clients.filter(function(c) { return c.status === 'active'; }).forEach(function(c) {
      counts[c.program] = (counts[c.program] || 0) + 1;
    });
    return Object.entries(counts).map(function(e) { return e[0] + ': ' + e[1]; }).join(', ') || 'None';
  }

  function badge(status) {
    return '<span class="badge badge-' + status + '">' + status + '</span>';
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 6) return '***';
    return phone.slice(0, 4) + '***' + phone.slice(-3);
  }

  function fmtDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
  }

  function renderLeadsTable(leads) {
    if (!leads.length) return '<div class="empty-state"><p>No leads yet</p></div>';
    var rows = leads.map(function(l) {
      return '<tr><td>' + (l.name || '-') + '</td><td>' + maskPhone(l.phone) + '</td><td>' + badge(l.status) + '</td><td>' + (l.program_interest || '-') + '</td><td>' + (l.market || '-') + '</td><td>' + fmtDate(l.created_at) + '</td></tr>';
    }).join('');
    return '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderClientsTable(clients) {
    if (!clients.length) return '<div class="empty-state"><p>No clients yet</p></div>';
    var rows = clients.map(function(c) {
      return '<tr><td>' + (c.name || '-') + '</td><td>' + maskPhone(c.phone) + '</td><td>' + badge(c.status) + '</td><td>' + (c.program || '-') + '</td><td>$' + (c.paid_amount || 0) + '</td><td>' + fmtDate(c.program_started_at) + '</td></tr>';
    }).join('');
    return '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Program</th><th>Paid</th><th>Started</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderCheckinsTable(checkins) {
    if (!checkins.length) return '<div class="empty-state"><p>No check-ins yet</p></div>';
    var rows = checkins.map(function(c) {
      var name = c.clients ? c.clients.name : '-';
      return '<tr><td>' + name + '</td><td>W' + c.week_no + '</td><td>' + (c.weight || '-') + '</td><td>' + (c.waist || '-') + '</td><td>' + (c.compliance_score || '-') + '/10</td><td>' + (c.energy || '-') + '/10</td><td>' + fmtDate(c.form_submitted_at) + '</td></tr>';
    }).join('');
    return '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Weight</th><th>Waist</th><th>Compliance</th><th>Energy</th><th>Submitted</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderProgramsTable(programs) {
    if (!programs.length) return '<div class="empty-state"><p>No programs generated yet</p></div>';
    var rows = programs.map(function(p) {
      var name = p.clients ? p.clients.name : '-';
      var sent = p.whatsapp_sent_at ? '<span style="color:#4CAF50">Sent</span>' : '<span style="color:#F44336">Pending</span>';
      return '<tr><td>' + name + '</td><td>W' + p.week_no + '</td><td>' + sent + '</td><td>' + fmtDate(p.generated_at) + '</td><td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">View</a>' : '-') + '</td></tr>';
    }).join('');
    return '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>WA Sent</th><th>Generated</th><th>PDF</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderEscalations(leads, clients) {
    var items = [];
    leads.filter(function(l) { return l.status === 'new' && l.first_msg; }).forEach(function(l) {
      var lower = (l.first_msg || '').toLowerCase();
      var flags = ['injury','pregnant','medication','pain','refund','medical'];
      var found = flags.filter(function(f) { return lower.includes(f); });
      if (found.length) {
        items.push({ reason: 'Lead flagged: ' + found.join(', '), details: 'Phone: ' + maskPhone(l.phone) + ' | Message: ' + (l.first_msg || '').substring(0, 100), date: l.created_at });
      }
    });

    if (!items.length) return '<div class="empty-state"><p>No escalations pending. All clear!</p></div>';

    return items.map(function(e) {
      return '<div class="escalation-card"><div class="esc-reason">' + e.reason + '</div><div class="esc-details">' + e.details + ' | ' + fmtDate(e.date) + '</div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
