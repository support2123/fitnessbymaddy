<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root {
      --bg: #0a0a0a; --surface: #141414; --border: #222;
      --gold: #B8965A; --gold-light: #D4AF7A;
      --text: #e5e5e5; --text-muted: #777;
      --green: #4ade80; --red: #f87171; --amber: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 48px 40px; max-width: 400px; width: 100%; text-align: center; }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
    .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 16px; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #0a0a0a; border: none; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif; }
    .login-btn:hover { background: var(--gold-light); }

    .dashboard { display: none; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 3px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .refresh-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; font-size: 12px; cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
    .logout-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: 'DM Sans', sans-serif; }

    .content { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .panel-list { list-style: none; }
    .panel-list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .panel-list li:last-child { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .badge-green { background: rgba(74,222,128,0.15); color: var(--green); }
    .badge-amber { background: rgba(251,191,36,0.15); color: var(--amber); }
    .badge-red { background: rgba(248,113,113,0.15); color: var(--red); }

    .escalation-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-item .esc-body { font-size: 13px; color: var(--text); line-height: 1.5; }
    .escalation-item .esc-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .content { padding: 16px; }
      .topbar { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard</p>
    <input type="password" class="login-input" id="apiKeyInput" placeholder="Enter admin API key">
    <button class="login-btn" id="loginBtn">Access Dashboard</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="topbar">
    <h1>Fitness by Maddy — Ops Dashboard</h1>
    <div class="topbar-right">
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="label">Leads Today</div>
        <div class="value" id="leadsToday">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Leads This Week</div>
        <div class="value" id="leadsWeek">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Conversion Rate</div>
        <div class="value" id="convRate">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Clients</div>
        <div class="value" id="activeClients">—</div>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 32px;">
      <div class="stat-card">
        <div class="label">Pending Check-ins</div>
        <div class="value" id="pendingCheckins">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Programs Generated (Week)</div>
        <div class="value" id="programsWeek">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Leads</div>
        <div class="value" id="totalLeads">—</div>
        <div class="sub" id="convertedLeads"></div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title">Active Clients by Program</div>
        <ul class="panel-list" id="programList">
          <li class="empty-state">Loading...</li>
        </ul>
      </div>

      <div class="panel">
        <div class="panel-title">Recent Escalations</div>
        <div id="escalationList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var apiKey = localStorage.getItem('fbm_admin_key') || '';

  if (apiKey) {
    showDashboard();
    loadStats();
  }

  document.getElementById('loginBtn').addEventListener('click', function() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) return;
    localStorage.setItem('fbm_admin_key', apiKey);
    showDashboard();
    loadStats();
  });

  document.getElementById('apiKeyInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadStats);
  document.getElementById('logoutBtn').addEventListener('click', function() {
    localStorage.removeItem('fbm_admin_key');
    apiKey = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  function loadStats() {
    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + apiKey },
    })
    .then(function(r) {
      if (r.status === 401) {
        localStorage.removeItem('fbm_admin_key');
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        alert('Invalid API key.');
        throw new Error('Unauthorized');
      }
      return r.json();
    })
    .then(function(data) {
      document.getElementById('leadsToday').textContent = data.leads.today;
      document.getElementById('leadsWeek').textContent = data.leads.this_week;
      document.getElementById('convRate').textContent = data.leads.conversion_rate;
      document.getElementById('activeClients').textContent = data.clients.active;
      document.getElementById('pendingCheckins').textContent = data.checkins.pending;
      document.getElementById('programsWeek').textContent = data.programs.generated_this_week;
      document.getElementById('totalLeads').textContent = data.leads.total;
      document.getElementById('convertedLeads').textContent = data.leads.converted + ' converted';

      var programNames = {
        '6wk_gym': '6-Week Burn & Build (Gym)',
        '6wk_home': '6-Week Burn & Build (Home)',
        '12wk': '12-Week Flagship',
        'pcos': 'PCOS Warrior',
        '40plus': '40+ Strong',
        'zoom_trial': 'Zoom Trial',
        'zoom_pack': 'Zoom Pack',
      };

      var programList = document.getElementById('programList');
      var programs = data.clients.by_program;
      if (Object.keys(programs).length === 0) {
        programList.innerHTML = '<li class="empty-state">No active clients yet</li>';
      } else {
        programList.innerHTML = '';
        for (var key in programs) {
          var li = document.createElement('li');
          li.innerHTML = '<span>' + (programNames[key] || key) + '</span><span class="badge badge-green">' + programs[key] + '</span>';
          programList.appendChild(li);
        }
      }

      var escList = document.getElementById('escalationList');
      if (!data.escalations || data.escalations.length === 0) {
        escList.innerHTML = '<div class="empty-state">No recent escalations</div>';
      } else {
        escList.innerHTML = '';
        data.escalations.forEach(function(esc) {
          var div = document.createElement('div');
          div.className = 'escalation-item';
          div.innerHTML = '<div class="esc-body">' + escapeHtml(esc.body || '') + '</div><div class="esc-time">' + new Date(esc.sent_at).toLocaleString() + '</div>';
          escList.appendChild(div);
        });
      }
    })
    .catch(function(err) {
      if (err.message !== 'Unauthorized') console.error('Stats load error:', err);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
