<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a; --gold: #B8965A; --gold-light: #D4AF7A; --text: #e5e5e5; --muted: #777; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--card); padding: 48px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 3px; text-align: center; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; border-radius: 4px; margin-bottom: 16px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
    .login-btn:hover { background: var(--gold-light); }

    .dashboard { display: none; }
    .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 3px; }
    .topbar-actions { display: flex; gap: 12px; align-items: center; }
    .topbar-btn { padding: 8px 16px; background: var(--border); color: var(--muted); border: none; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif; }
    .topbar-btn:hover { color: var(--gold); }
    .last-updated { font-size: 11px; color: var(--muted); }

    .content { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .section { margin-bottom: 32px; }
    .section-header { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .program-bars { display: flex; flex-direction: column; gap: 8px; }
    .program-bar { display: flex; align-items: center; gap: 16px; }
    .program-bar .name { font-size: 13px; color: var(--text); min-width: 180px; }
    .program-bar .bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .program-bar .bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar .count { font-size: 13px; color: var(--muted); min-width: 30px; text-align: right; }

    .escalation-list { display: flex; flex-direction: column; gap: 8px; }
    .escalation-item { background: var(--card); border: 1px solid var(--border); border-left: 3px solid #c0392b; padding: 16px; border-radius: 4px; }
    .escalation-item .phone { font-size: 12px; color: var(--gold); letter-spacing: 1px; }
    .escalation-item .body { font-size: 13px; color: var(--text); margin-top: 4px; }
    .escalation-item .time { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>FITNESS BY MADDY</h1>
    <input class="login-input" type="email" id="loginEmail" placeholder="Email">
    <input class="login-input" type="password" id="loginPassword" placeholder="Password">
    <button class="login-btn" onclick="handleLogin()">Sign In</button>
    <p style="font-size:11px; color:var(--muted); text-align:center; margin-top:16px;">Admin access only</p>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="topbar">
    <h1>FITNESS BY MADDY — DASHBOARD</h1>
    <div class="topbar-actions">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="topbar-btn" onclick="loadStats()">Refresh</button>
      <button class="topbar-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Leads Today</div>
        <div class="value" id="leadsToday">—</div>
        <div class="sub" id="leadsWeek">— this week</div>
      </div>
      <div class="stat-card">
        <div class="label">Conversion Rate</div>
        <div class="value" id="conversionRate">—</div>
        <div class="sub" id="conversionSub">— of — leads</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Clients</div>
        <div class="value" id="activeClients">—</div>
        <div class="sub" id="pendingCheckins">— pending check-ins</div>
      </div>
      <div class="stat-card">
        <div class="label">Programs Generated</div>
        <div class="value" id="programsGenerated">—</div>
        <div class="sub">this week</div>
      </div>
    </div>

    <div class="two-col">
      <div class="section">
        <div class="section-header">CLIENTS BY PROGRAM</div>
        <div class="program-bars" id="programBars">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">ESCALATIONS AWAITING MADDY</div>
        <div class="escalation-list" id="escalationList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_KEY = '';
var session = null;

function handleLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  if (!email || !password) return;

  SUPABASE_URL = prompt('Supabase URL:') || localStorage.getItem('sb_url') || '';
  SUPABASE_KEY = prompt('Supabase Anon Key:') || localStorage.getItem('sb_key') || '';

  localStorage.setItem('sb_url', SUPABASE_URL);
  localStorage.setItem('sb_key', SUPABASE_KEY);

  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.access_token) {
      session = data;
      localStorage.setItem('sb_session', JSON.stringify(data));
      showDashboard();
    } else {
      alert('Login failed. Check your credentials.');
    }
  })
  .catch(function() { alert('Login failed. Check connection.'); });
}

function handleLogout() {
  session = null;
  localStorage.removeItem('sb_session');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}

function loadStats() {
  if (!session) return;

  fetch('/api/admin/stats', {
    headers: { 'Authorization': 'Bearer ' + session.access_token }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) { alert('Error: ' + data.error); return; }

    document.getElementById('leadsToday').textContent = data.leads.today;
    document.getElementById('leadsWeek').textContent = data.leads.this_week + ' this week';
    document.getElementById('conversionRate').textContent = data.leads.conversion_rate;
    document.getElementById('conversionSub').textContent = data.leads.converted + ' of ' + data.leads.total + ' leads';
    document.getElementById('activeClients').textContent = data.clients.active;
    document.getElementById('pendingCheckins').textContent = data.checkins.pending + ' pending check-ins';
    document.getElementById('programsGenerated').textContent = data.programs.generated_this_week;

    var bars = document.getElementById('programBars');
    var programs = data.clients.by_program || {};
    var maxCount = Math.max(1, Math.max.apply(null, Object.values(programs).concat([1])));
    var programNames = {
      '6wk_gym': '6 Week Burn (Gym)', '6wk_home': '6 Week Burn (Home)',
      '12wk': '12 Week Custom', 'pcos': 'PCOS Warrior',
      '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
    };

    if (Object.keys(programs).length === 0) {
      bars.innerHTML = '<div class="empty-state">No active clients yet</div>';
    } else {
      bars.innerHTML = '';
      for (var key in programs) {
        var pct = Math.round((programs[key] / maxCount) * 100);
        bars.innerHTML += '<div class="program-bar">' +
          '<div class="name">' + (programNames[key] || key) + '</div>' +
          '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="count">' + programs[key] + '</div></div>';
      }
    }

    var escList = document.getElementById('escalationList');
    if (!data.escalations || data.escalations.length === 0) {
      escList.innerHTML = '<div class="empty-state">No escalations — all clear</div>';
    } else {
      escList.innerHTML = '';
      data.escalations.forEach(function(e) {
        escList.innerHTML += '<div class="escalation-item">' +
          '<div class="phone">' + e.phone + '</div>' +
          '<div class="body">' + (e.body || '').slice(0, 120) + '</div>' +
          '<div class="time">' + new Date(e.sent_at).toLocaleString() + '</div></div>';
      });
    }

    document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  })
  .catch(function(err) { console.error('Stats load error:', err); });
}

(function() {
  var saved = localStorage.getItem('sb_session');
  SUPABASE_URL = localStorage.getItem('sb_url') || '';
  SUPABASE_KEY = localStorage.getItem('sb_key') || '';
  if (saved) {
    try {
      session = JSON.parse(saved);
      showDashboard();
    } catch(e) {}
  }
})();
</script>
</body>
</html>
