<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="../css/forms.css">
  <style>
    body { background: #1a1a1a; color: #FAF8F4; }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 32px; border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 32px;
    }
    .admin-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: #B8965A;
    }
    .admin-subtitle { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .admin-logout {
      background: none; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5);
      padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif;
    }

    .login-card {
      max-width: 400px; margin: 120px auto;
      background: #2C2C2C; padding: 48px 36px; border-radius: 4px; text-align: center;
    }
    .login-card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 400; color: #FAF8F4; margin-bottom: 24px;
    }
    .login-card input {
      width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.1);
      background: #1a1a1a; color: #FAF8F4; border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none;
    }
    .login-card input:focus { border-color: #B8965A; }
    .login-card button {
      width: 100%; padding: 14px; background: #B8965A; border: none; color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif;
    }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 40px;
    }
    .stat-card {
      background: #2C2C2C; padding: 24px; border-radius: 4px;
      border-left: 3px solid #B8965A;
    }
    .stat-card-label {
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.4); margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 600; color: #B8965A; line-height: 1;
    }

    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: #B8965A; margin: 32px 0 16px;
    }

    .data-table {
      width: 100%; border-collapse: collapse; background: #2C2C2C;
      border-radius: 4px; overflow: hidden;
    }
    .data-table th {
      text-align: left; padding: 12px 16px;
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .data-table td {
      padding: 12px 16px; font-size: 13px; color: rgba(255,255,255,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-new { background: rgba(184,150,90,0.15); color: #D4AF7A; }
    .badge-qualified { background: rgba(33,150,243,0.15); color: #64B5F6; }
    .badge-converted { background: rgba(76,175,80,0.15); color: #81C784; }
    .badge-dropped { background: rgba(229,57,53,0.15); color: #EF9A9A; }
    .badge-active { background: rgba(76,175,80,0.15); color: #81C784; }

    .escalation-card {
      background: #2C2C2C; border-left: 3px solid #E53935;
      padding: 16px 20px; border-radius: 4px; margin-bottom: 12px;
    }
    .escalation-card .esc-reason {
      font-size: 13px; color: #EF9A9A; font-weight: 500; margin-bottom: 4px;
    }
    .escalation-card .esc-detail {
      font-size: 12px; color: rgba(255,255,255,0.5);
    }

    .empty-state {
      text-align: center; padding: 48px; color: rgba(255,255,255,0.3);
      font-size: 14px;
    }

    .refresh-btn {
      background: none; border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); padding: 6px 14px; font-size: 11px;
      letter-spacing: 1px; cursor: pointer; border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .refresh-btn:hover { border-color: #B8965A; color: #B8965A; }
  </style>
</head>
<body>

<div id="loginView" class="login-card">
  <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#B8965A;margin-bottom:24px;">Fitness by Maddy</div>
  <h2>Admin Access</h2>
  <input type="email" id="loginEmail" placeholder="Email address">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn" onclick="doLogin()">Sign In</button>
  <div id="loginError" style="color:#EF9A9A;font-size:12px;margin-top:12px;display:none;"></div>
</div>

<div id="dashView" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <div>
      <div class="admin-logo">Fitness by Maddy</div>
      <div class="admin-subtitle">Operations Dashboard</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
      <button class="admin-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="section-label">Escalations Awaiting Review</div>
  <div id="escalations"></div>

  <div class="section-label">Recent Leads</div>
  <div style="overflow-x:auto;">
    <table class="data-table" id="leadsTable">
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Created</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section-label">Active Clients</div>
  <div style="overflow-x:auto;">
    <table class="data-table" id="clientsTable">
      <thead>
        <tr><th>Name</th><th>Program</th><th>Started</th><th>Ends</th><th>Status</th><th>Paid</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section-label">Pending Check-Ins This Week</div>
  <div id="pendingCheckins"></div>

  <div class="section-label">Programs Generated This Week</div>
  <div id="recentPrograms"></div>
</div>

<script>
var SUPABASE_URL, SUPABASE_KEY, supabase;

function doLogin() {
  var email = document.getElementById('loginEmail').value;
  var pw = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!window._supabaseClient) {
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    script.onload = function() { attemptLogin(email, pw); };
    document.head.appendChild(script);
  } else {
    attemptLogin(email, pw);
  }
}

function attemptLogin(email, pw) {
  SUPABASE_URL = localStorage.getItem('sb_url') || prompt('Supabase URL:');
  SUPABASE_KEY = localStorage.getItem('sb_anon') || prompt('Supabase anon key:');
  localStorage.setItem('sb_url', SUPABASE_URL);
  localStorage.setItem('sb_anon', SUPABASE_KEY);

  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  supabase.auth.signInWithPassword({ email: email, password: pw })
    .then(function(res) {
      if (res.error) throw res.error;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashView').style.display = 'block';
      loadDashboard();
    })
    .catch(function(err) {
      var errEl = document.getElementById('loginError');
      errEl.textContent = err.message || 'Login failed';
      errEl.style.display = 'block';
    });
}

function doLogout() {
  if (supabase) supabase.auth.signOut();
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('dashView').style.display = 'none';
}

function loadDashboard() {
  if (!supabase) return;

  var now = new Date();
  var weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();

  Promise.all([
    supabase.from('leads').select('*', { count: 'exact' }).gte('created_at', today),
    supabase.from('leads').select('*', { count: 'exact' }).gte('created_at', weekAgo),
    supabase.from('leads').select('*', { count: 'exact' }).eq('status', 'converted'),
    supabase.from('leads').select('*', { count: 'exact' }),
    supabase.from('clients').select('*').eq('status', 'active'),
    supabase.from('leads').select('*').order('created_at', { ascending: false }).limit(20),
    supabase.from('programs').select('*').gte('generated_at', weekAgo).order('generated_at', { ascending: false }),
    supabase.from('checkins').select('*').gte('form_submitted_at', weekAgo)
  ]).then(function(results) {
    var leadsToday = results[0].count || 0;
    var leadsWeek = results[1].count || 0;
    var converted = results[2].count || 0;
    var totalLeads = results[3].count || 1;
    var activeClients = results[4].data || [];
    var recentLeads = results[5].data || [];
    var weekPrograms = results[6].data || [];
    var weekCheckins = results[7].data || [];

    var convRate = totalLeads > 0 ? ((converted / totalLeads) * 100).toFixed(1) : '0';

    var programCounts = {};
    activeClients.forEach(function(c) {
      programCounts[c.program] = (programCounts[c.program] || 0) + 1;
    });

    document.getElementById('statsGrid').innerHTML =
      statCard('Leads Today', leadsToday) +
      statCard('Leads This Week', leadsWeek) +
      statCard('Conversion Rate', convRate + '%') +
      statCard('Active Clients', activeClients.length) +
      statCard('Programs This Week', weekPrograms.length) +
      statCard('Check-Ins This Week', weekCheckins.length);

    var tbody = document.querySelector('#leadsTable tbody');
    tbody.innerHTML = recentLeads.map(function(l) {
      var masked = l.phone ? l.phone.slice(0, 4) + 'XXX...' + l.phone.slice(-3) : '-';
      return '<tr><td>' + (l.name || '-') + '</td><td>' + masked +
        '</td><td><span class="badge badge-' + l.status + '">' + l.status +
        '</span></td><td>' + (l.program_interest || '-') +
        '</td><td>' + (l.market || '-') +
        '</td><td>' + new Date(l.created_at).toLocaleDateString() + '</td></tr>';
    }).join('');

    var ctbody = document.querySelector('#clientsTable tbody');
    ctbody.innerHTML = activeClients.map(function(c) {
      return '<tr><td>' + (c.name || '-') + '</td><td>' + c.program +
        '</td><td>' + new Date(c.program_started_at).toLocaleDateString() +
        '</td><td>' + (c.program_ends_at ? new Date(c.program_ends_at).toLocaleDateString() : '-') +
        '</td><td><span class="badge badge-active">active</span></td><td>$' +
        (c.paid_amount || 0) + '</td></tr>';
    }).join('');

    var pendingEl = document.getElementById('pendingCheckins');
    var activeIds = activeClients.map(function(c) { return c.id; });
    var checkedIn = weekCheckins.map(function(ci) { return ci.client_id; });
    var pending = activeClients.filter(function(c) { return checkedIn.indexOf(c.id) === -1; });
    pendingEl.innerHTML = pending.length
      ? pending.map(function(c) {
          return '<div style="background:#2C2C2C;padding:12px 16px;border-radius:4px;margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.6)">' +
            (c.name || 'Unknown') + ' (' + c.program + ')</div>';
        }).join('')
      : '<div class="empty-state">All clients checked in this week</div>';

    document.getElementById('recentPrograms').innerHTML = weekPrograms.length
      ? weekPrograms.map(function(p) {
          return '<div style="background:#2C2C2C;padding:12px 16px;border-radius:4px;margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.6)">Week ' +
            p.week_no + ' — ' + new Date(p.generated_at).toLocaleDateString() +
            (p.whatsapp_sent_at ? ' <span style="color:#81C784">Sent</span>' : ' <span style="color:#D4AF7A">Pending send</span>') +
            '</div>';
        }).join('')
      : '<div class="empty-state">No programs generated this week</div>';

    document.getElementById('escalations').innerHTML =
      '<div class="empty-state">No pending escalations</div>';
  });
}

function statCard(label, value) {
  return '<div class="stat-card"><div class="stat-card-label">' + label +
    '</div><div class="stat-card-value">' + value + '</div></div>';
}
</script>

</body>
</html>
