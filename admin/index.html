<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    /* Login */
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-box { background: white; padding: 48px 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .login-sub { font-size: 12px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none; background: var(--cream); transition: border-color 0.3s; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .login-btn:hover { background: var(--gold); }
    .login-error { color: #c0392b; font-size: 12px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header { background: var(--charcoal); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .dash-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: white; letter-spacing: 2px; text-transform: uppercase; }
    .dash-badge { font-size: 10px; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase; }
    .dash-logout { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); padding: 8px 16px; font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; transition: all 0.3s; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.alert { border-left: 3px solid #e74c3c; }
    .stat-card.gold { border-left: 3px solid var(--gold); }

    /* Sections */
    .dash-section { margin-bottom: 32px; }
    .dash-section-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; margin-bottom: 16px; }
    .dash-section-title em { color: var(--gold); font-style: italic; }

    /* Tables */
    .dash-table { width: 100%; background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .dash-table thead { background: var(--charcoal); }
    .dash-table th { padding: 12px 16px; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); text-align: left; }
    .dash-table td { padding: 12px 16px; font-size: 13px; color: var(--charcoal); border-bottom: 1px solid var(--light-grey); }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-table tr:hover td { background: var(--cream); }

    /* Status badges */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .badge-new { background: #eaf4fc; color: #2980b9; }
    .badge-qualified { background: #fef9e7; color: #b8860b; }
    .badge-converted { background: #eafaf1; color: #27ae60; }
    .badge-dropped { background: #fdf2f2; color: #c0392b; }
    .badge-active { background: #eafaf1; color: #27ae60; }
    .badge-urgent { background: #c0392b; color: white; }

    /* Program chips */
    .program-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--sand); border-radius: 2px; font-size: 11px; color: var(--charcoal); margin: 2px; }
    .program-chip .count { font-weight: 600; color: var(--gold); }

    .loading { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-body { padding: 20px 16px; }
      .dash-table { font-size: 12px; }
      .dash-table th, .dash-table td { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Fitness by Maddy</div>
    <div class="login-sub">Operations Dashboard</div>
    <form id="loginForm">
      <input class="login-input" type="email" id="loginEmail" placeholder="Email" required>
      <input class="login-input" type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div class="login-error" id="loginError">Invalid credentials. Please try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div>
      <div class="dash-logo">Fitness by Maddy</div>
      <div class="dash-badge">Operations Dashboard</div>
    </div>
    <button class="dash-logout" onclick="logout()">Sign Out</button>
  </div>

  <div class="dash-body">
    <div class="loading" id="loadingState">Loading dashboard...</div>

    <div id="dashContent" style="display:none">
      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Programs by type -->
      <div class="dash-section">
        <h2 class="dash-section-title">Active Clients by <em>Program</em></h2>
        <div id="programChips" style="margin-bottom: 16px;"></div>
      </div>

      <!-- Escalations -->
      <div class="dash-section" id="escalationSection" style="display:none">
        <h2 class="dash-section-title">Open <em>Escalations</em></h2>
        <table class="dash-table">
          <thead><tr><th>Time</th><th>Phone</th><th>Reason</th><th>Message</th></tr></thead>
          <tbody id="escalationBody"></tbody>
        </table>
      </div>

      <!-- Recent Leads -->
      <div class="dash-section">
        <h2 class="dash-section-title">Recent <em>Leads</em></h2>
        <table class="dash-table">
          <thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Interest</th><th>Status</th></tr></thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var session = null;

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;

  fetch((SUPABASE_URL || localStorage.getItem('sbUrl') || prompt('Enter Supabase URL:')) + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY || localStorage.getItem('sbKey') || prompt('Enter Supabase anon key:')
    },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.access_token) {
      session = data;
      localStorage.setItem('dashSession', JSON.stringify(data));
      showDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  })
  .catch(function() {
    document.getElementById('loginError').style.display = 'block';
  });
});

function logout() {
  session = null;
  localStorage.removeItem('dashSession');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}

function loadStats() {
  var token = session ? session.access_token : '';

  fetch('/api/admin-stats', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('dashContent').style.display = 'block';
    renderStats(data);
    renderPrograms(data.clients_by_program);
    renderEscalations(data.escalations);
    renderLeads(data.recent_leads);
  })
  .catch(function() {
    document.getElementById('loadingState').textContent = 'Failed to load data. Check your connection.';
  });
}

function renderStats(d) {
  var grid = document.getElementById('statsGrid');
  var cards = [
    { label: 'Leads Today', value: d.leads_today, sub: d.leads_this_week + ' this week', cls: 'gold' },
    { label: 'Conversion Rate', value: d.conversion_rate + '%', sub: d.leads_total + ' total leads', cls: 'gold' },
    { label: 'Active Clients', value: d.active_clients, sub: d.programs_this_week + ' programs this week', cls: 'gold' },
    { label: 'Pending Check-ins', value: d.pending_checkins, sub: '', cls: d.pending_checkins > 5 ? 'alert' : '' },
    { label: 'Open Escalations', value: d.open_escalations, sub: 'Awaiting Maddy', cls: d.open_escalations > 0 ? 'alert' : '' },
    { label: 'Programs Generated', value: d.programs_this_week, sub: 'This week', cls: 'gold' }
  ];
  grid.innerHTML = cards.map(function(c) {
    return '<div class="stat-card ' + c.cls + '"><div class="stat-card-label">' + c.label + '</div><div class="stat-card-value">' + c.value + '</div>' + (c.sub ? '<div class="stat-card-sub">' + c.sub + '</div>' : '') + '</div>';
  }).join('');
}

function renderPrograms(programs) {
  var container = document.getElementById('programChips');
  var names = {
    '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
    'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
  };
  if (!programs || Object.keys(programs).length === 0) {
    container.innerHTML = '<span style="color:var(--mid-grey); font-size:13px;">No active clients yet</span>';
    return;
  }
  container.innerHTML = Object.keys(programs).map(function(k) {
    return '<span class="program-chip"><span class="count">' + programs[k] + '</span> ' + (names[k] || k) + '</span>';
  }).join('');
}

function renderEscalations(esc) {
  var section = document.getElementById('escalationSection');
  var tbody = document.getElementById('escalationBody');
  if (!esc || esc.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  tbody.innerHTML = esc.filter(function(e) { return !e.resolved; }).map(function(e) {
    var date = new Date(e.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    return '<tr><td>' + date + '</td><td>' + maskPhone(e.phone) + '</td><td><span class="badge badge-urgent">' + (e.reason || '').substring(0, 40) + '</span></td><td>' + ((e.message_body || '').substring(0, 60)) + '</td></tr>';
  }).join('');
}

function renderLeads(leads) {
  var tbody = document.getElementById('leadsBody');
  if (!leads || leads.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--mid-grey);">No leads yet</td></tr>';
    return;
  }
  tbody.innerHTML = leads.map(function(l) {
    var date = new Date(l.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    var badgeCls = 'badge-' + l.status;
    return '<tr><td>' + date + '</td><td>' + (l.name || '—') + '</td><td>' + maskPhone(l.phone) + '</td><td>' + (l.program_interest || '—') + '</td><td><span class="badge ' + badgeCls + '">' + l.status + '</span></td></tr>';
  }).join('');
}

function maskPhone(phone) {
  if (!phone || phone.length < 6) return '***';
  return phone.slice(0, 4) + 'XXX...' + phone.slice(-3);
}

// Auto-login from stored session
(function() {
  var stored = localStorage.getItem('dashSession');
  if (stored) {
    try {
      session = JSON.parse(stored);
      showDashboard();
    } catch(e) {}
  }
})();
</script>
</body>
</html>
