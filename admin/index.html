<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    /* Login */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); max-width: 380px; width: 100%; text-align: center; }
    .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .login-sub { font-size: 12px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none; background: var(--cream); }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; }
    .login-btn:hover { background: var(--gold); }
    .login-error { color: #c0392b; font-size: 12px; margin-top: 8px; display: none; }

    /* Dashboard */
    .dash { display: none; }
    .dash-nav { background: var(--charcoal); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .dash-nav-logo { font-family: 'Cormorant Garamond', serif; color: white; font-size: 18px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    .dash-nav-right { display: flex; gap: 16px; align-items: center; }
    .dash-nav-badge { font-size: 11px; color: var(--gold-light); letter-spacing: 1px; text-transform: uppercase; }
    .dash-logout { background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dash-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; margin-bottom: 8px; }
    .dash-subtitle { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 11px; color: var(--mid-grey); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; line-height: 1; }
    .stat-card-change { font-size: 11px; color: var(--gold); margin-top: 4px; }

    .panels { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
    .panel { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); padding: 24px; }
    .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
    .panel-empty { font-size: 13px; color: var(--mid-grey); text-align: center; padding: 24px; }

    .program-bars { }
    .program-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .program-bar-label { font-size: 12px; min-width: 140px; color: var(--mid-grey); }
    .program-bar-track { flex: 1; height: 8px; background: var(--sand); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar-count { font-size: 13px; font-weight: 600; min-width: 30px; text-align: right; }

    .esc-item { padding: 12px 0; border-bottom: 1px solid var(--light-grey); }
    .esc-item:last-child { border-bottom: none; }
    .esc-item-body { font-size: 13px; color: var(--charcoal); margin-bottom: 4px; }
    .esc-item-time { font-size: 11px; color: var(--mid-grey); }
    .esc-badge { display: inline-block; background: #c0392b; color: white; font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 2px; letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; }

    .loading { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }
    .refresh-btn { background: none; border: 1px solid var(--light-grey); color: var(--mid-grey); padding: 6px 12px; font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px; float: right; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .panels { grid-template-columns: 1fr; }
      .dash-body { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">Fitness by Maddy</div>
    <div class="login-sub">Admin Dashboard</div>
    <form id="loginForm">
      <input class="login-input" type="email" name="email" placeholder="Email" required>
      <input class="login-input" type="password" name="password" placeholder="Password" required>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="dashView" class="dash">
  <div class="dash-nav">
    <div class="dash-nav-logo">Fitness by Maddy</div>
    <div class="dash-nav-right">
      <span class="dash-nav-badge">Admin</span>
      <button class="dash-logout" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <div class="dash-body">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div class="dash-title">Dashboard</div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="dash-subtitle" id="lastUpdated">Loading...</div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-card-label">Leads Today</div><div class="stat-card-value" id="leadsToday">-</div></div>
      <div class="stat-card"><div class="stat-card-label">Leads This Week</div><div class="stat-card-value" id="leadsWeek">-</div></div>
      <div class="stat-card"><div class="stat-card-label">Active Clients</div><div class="stat-card-value" id="activeClients">-</div></div>
      <div class="stat-card"><div class="stat-card-label">Conversion Rate</div><div class="stat-card-value" id="conversionRate">-</div><div class="stat-card-change" id="conversionSub"></div></div>
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
      <div class="stat-card"><div class="stat-card-label">Pending Check-Ins</div><div class="stat-card-value" id="pendingCheckins">-</div></div>
      <div class="stat-card"><div class="stat-card-label">Programs Generated</div><div class="stat-card-value" id="programsGenerated">-</div><div class="stat-card-change">This week</div></div>
      <div class="stat-card"><div class="stat-card-label">Total Leads</div><div class="stat-card-value" id="totalLeads">-</div></div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title">Active Clients by Program</div>
        <div class="program-bars" id="programBars">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Recent Escalations</div>
        <div id="escalations">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';
  var session = null;

  function init() {
    var stored = localStorage.getItem('fbm_admin_token');
    if (stored) {
      session = JSON.parse(stored);
      showDashboard();
      loadStats();
    }
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = this.email.value;
    var password = this.password.value;
    var errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    fetch((SUPABASE_URL || '/api/admin') + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY || 'anon'
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        session = { token: data.access_token, email: email };
        localStorage.setItem('fbm_admin_token', JSON.stringify(session));
        showDashboard();
        loadStats();
      } else {
        throw new Error(data.error_description || data.msg || 'Login failed');
      }
    })
    .catch(function(err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    session = null;
    localStorage.removeItem('fbm_admin_token');
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('dashView').style.display = 'none';
  });

  document.getElementById('refreshBtn').addEventListener('click', function() {
    loadStats();
  });

  function showDashboard() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
  }

  function loadStats() {
    if (!session) return;

    document.getElementById('lastUpdated').textContent = 'Updating...';

    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + session.token }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('leadsToday').textContent = data.leads_today || 0;
      document.getElementById('leadsWeek').textContent = data.leads_this_week || 0;
      document.getElementById('activeClients').textContent = data.active_clients || 0;
      document.getElementById('conversionRate').textContent = (data.conversion_rate || 0) + '%';
      document.getElementById('conversionSub').textContent = data.converted_leads + ' of ' + data.total_leads + ' leads';
      document.getElementById('pendingCheckins').textContent = data.pending_checkins || 0;
      document.getElementById('programsGenerated').textContent = data.programs_generated_this_week || 0;
      document.getElementById('totalLeads').textContent = data.total_leads || 0;

      renderProgramBars(data.clients_by_program || {}, data.active_clients || 0);
      renderEscalations(data.escalations || []);

      document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    })
    .catch(function(err) {
      document.getElementById('lastUpdated').textContent = 'Failed to load — ' + err.message;
    });
  }

  function renderProgramBars(programs, total) {
    var container = document.getElementById('programBars');
    var names = {
      '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
      'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
    };
    var keys = Object.keys(programs);

    if (keys.length === 0) {
      container.innerHTML = '<div class="panel-empty">No active clients yet</div>';
      return;
    }

    var html = '';
    keys.sort(function(a, b) { return programs[b] - programs[a]; });
    keys.forEach(function(key) {
      var count = programs[key];
      var pct = total > 0 ? Math.round((count / total) * 100) : 0;
      html += '<div class="program-bar">'
        + '<div class="program-bar-label">' + (names[key] || key) + '</div>'
        + '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>'
        + '<div class="program-bar-count">' + count + '</div>'
        + '</div>';
    });
    container.innerHTML = html;
  }

  function renderEscalations(escalations) {
    var container = document.getElementById('escalations');
    if (escalations.length === 0) {
      container.innerHTML = '<div class="panel-empty">No escalations this week</div>';
      return;
    }

    var html = '';
    escalations.forEach(function(esc) {
      var time = new Date(esc.sent_at).toLocaleString();
      var body = esc.body || '';
      if (body.length > 120) body = body.slice(0, 120) + '...';
      html += '<div class="esc-item">'
        + '<div class="esc-item-body">' + escapeHtml(body) + '<span class="esc-badge">Action Needed</span></div>'
        + '<div class="esc-item-time">' + time + '</div>'
        + '</div>';
    });
    container.innerHTML = html;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
})();
</script>
</body>
</html>
