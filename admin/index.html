<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111111;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --card-bg: #1a1a1a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--gold);
    }
    .header .refresh-btn {
      background: none;
      border: 1px solid #444;
      color: #999;
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.3s;
    }
    .header .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    .login-screen {
      max-width: 380px;
      margin: 80px auto;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #333;
      text-align: center;
    }
    .login-screen h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 24px;
    }
    .login-screen input {
      width: 100%;
      padding: 14px 16px;
      background: #111;
      border: 1.5px solid #333;
      border-radius: 4px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-screen input:focus { border-color: var(--gold); }
    .login-screen button {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .dashboard { display: none; padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
    }
    .stat-card .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,150,90,0.2);
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666;
      border-bottom: 1px solid #333;
    }
    td {
      padding: 12px 16px;
      font-size: 13px;
      color: #ccc;
      border-bottom: 1px solid #222;
    }
    tr:last-child td { border-bottom: none; }

    .program-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .program-badge {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px 24px;
      text-align: center;
    }
    .program-badge .badge-name {
      font-size: 11px;
      color: #999;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .program-badge .badge-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-top: 4px;
    }

    .escalation-card {
      background: #1a1515;
      border: 1px solid #442222;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .escalation-card .esc-time {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    .escalation-card .esc-body {
      font-size: 13px;
      color: #cc8888;
      white-space: pre-line;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #444;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .dashboard { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-card { padding: 16px; }
      .stat-card .stat-value { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MADDY OPS DASHBOARD</h1>
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
  </div>

  <div class="login-screen" id="loginScreen">
    <h2>ADMIN LOGIN</h2>
    <input type="password" id="apiKeyInput" placeholder="Enter admin API key">
    <button onclick="login()">ACCESS DASHBOARD</button>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">ACTIVE CLIENTS BY PROGRAM</div>
    <div class="program-badges" id="programBadges"></div>

    <div class="section-title">PENDING CHECK-INS</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Program</th>
            <th>Current Week</th>
            <th>Last Submitted</th>
          </tr>
        </thead>
        <tbody id="checkinsBody"></tbody>
      </table>
    </div>

    <div class="section-title">RECENT ESCALATIONS</div>
    <div id="escalations"></div>
  </div>

  <script>
    var apiKey = '';

    function login() {
      apiKey = document.getElementById('apiKeyInput').value;
      if (!apiKey) return;
      localStorage.setItem('fbm_admin_key', apiKey);
      loadDashboard();
    }

    function loadDashboard() {
      if (!apiKey) {
        apiKey = localStorage.getItem('fbm_admin_key');
        if (!apiKey) return;
      }

      fetch('/api/admin', {
        headers: { 'Authorization': 'Bearer ' + apiKey },
      })
      .then(function(r) {
        if (r.status === 401) {
          alert('Invalid API key');
          localStorage.removeItem('fbm_admin_key');
          apiKey = '';
          return null;
        }
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderDashboard(data);
      });
    }

    function renderDashboard(data) {
      var s = data.stats;
      var statsHTML = [
        { label: 'Leads Today', value: s.leads_today },
        { label: 'Leads This Week', value: s.leads_this_week },
        { label: 'Total Leads', value: s.total_leads },
        { label: 'Total Clients', value: s.total_clients },
        { label: 'Active Clients', value: s.active_clients },
        { label: 'Conversion Rate', value: s.conversion_rate },
        { label: 'Programs This Week', value: s.programs_generated_this_week },
      ].map(function(item) {
        return '<div class="stat-card"><div class="stat-label">' + item.label + '</div><div class="stat-value">' + item.value + '</div></div>';
      }).join('');
      document.getElementById('statsGrid').innerHTML = statsHTML;

      var programs = data.active_by_program || {};
      var badgesHTML = Object.keys(programs).map(function(p) {
        return '<div class="program-badge"><div class="badge-name">' + p + '</div><div class="badge-count">' + programs[p] + '</div></div>';
      }).join('');
      document.getElementById('programBadges').innerHTML = badgesHTML || '<div class="empty-state">No active clients yet</div>';

      var checkins = data.pending_checkins || [];
      var checkinsHTML = checkins.length > 0
        ? checkins.map(function(c) {
            return '<tr><td>' + (c.name || 'Unknown') + '</td><td>' + c.program + '</td><td>Week ' + c.current_week + '</td><td>Week ' + c.last_submitted + '</td></tr>';
          }).join('')
        : '<tr><td colspan="4" class="empty-state">All check-ins up to date</td></tr>';
      document.getElementById('checkinsBody').innerHTML = checkinsHTML;

      var escalations = data.recent_escalations || [];
      var escHTML = escalations.length > 0
        ? escalations.map(function(e) {
            return '<div class="escalation-card"><div class="esc-time">' + new Date(e.sent_at).toLocaleString() + '</div><div class="esc-body">' + (e.body || '').replace(/</g, '&lt;') + '</div></div>';
          }).join('')
        : '<div class="empty-state">No recent escalations</div>';
      document.getElementById('escalations').innerHTML = escHTML;
    }

    // Auto-login if key is stored
    var storedKey = localStorage.getItem('fbm_admin_key');
    if (storedKey) {
      apiKey = storedKey;
      loadDashboard();
    }
  </script>
</body>
</html>
