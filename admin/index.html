<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --dark: #1a1a1a; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --green: #4CAF50; --red: #e53935; --blue: #2196F3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: white; min-height: 100vh; }

    /* Login */
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-box {
      background: var(--charcoal); padding: 48px 40px; border-radius: 4px;
      width: 100%; max-width: 400px; text-align: center;
    }
    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold);
      letter-spacing: 4px; margin-bottom: 8px;
    }
    .login-box p { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: white; background: rgba(255,255,255,0.05); outline: none;
      margin-bottom: 12px; transition: border-color 0.3s;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box input::placeholder { color: rgba(255,255,255,0.3); }
    .login-box button {
      width: 100%; padding: 14px; background: var(--gold); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: opacity 0.3s; margin-top: 8px;
    }
    .login-box button:hover { opacity: 0.9; }
    .login-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal); padding: 20px 32px; display: flex;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold);
      letter-spacing: 3px;
    }
    .dash-header .logout-btn {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5);
      padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif;
    }
    .dash-header .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--charcoal); padding: 24px; border-radius: 4px;
      border-left: 3px solid var(--gold);
    }
    .stat-card .stat-label {
      font-size: 10px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold);
      line-height: 1;
    }
    .stat-card .stat-sub {
      font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px;
    }

    /* Sections */
    .dash-section {
      background: var(--charcoal); border-radius: 4px; padding: 24px;
      margin-bottom: 24px;
    }
    .dash-section h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold);
      letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* Program breakdown */
    .program-bar {
      display: flex; align-items: center; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .program-bar:last-child { border-bottom: none; }
    .program-bar .prog-name { font-size: 13px; color: rgba(255,255,255,0.7); width: 180px; flex-shrink: 0; }
    .program-bar .prog-bar-bg {
      flex: 1; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden;
    }
    .program-bar .prog-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar .prog-count { font-size: 14px; font-weight: 700; color: var(--gold); width: 32px; text-align: right; }

    /* Escalations */
    .escalation-item {
      padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-item .esc-body { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .escalation-item .esc-meta { font-size: 11px; color: rgba(255,255,255,0.3); }

    .empty-state { text-align: center; padding: 24px; color: rgba(255,255,255,0.3); font-size: 13px; }

    .refresh-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); padding: 8px 20px; font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      border-radius: 2px; font-family: 'DM Sans', sans-serif; float: right;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    .loading { text-align: center; padding: 40px; color: var(--gold); font-size: 14px; }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 16px; }
      .stat-card .stat-value { font-size: 28px; }
      .dash-body { padding: 16px; }
      .program-bar .prog-name { width: 120px; font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>FITNESS BY MADDY</h1>
    <p>Admin Dashboard — Log in to continue</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">LOG IN</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>FITNESS BY MADDY — OPS DASHBOARD</h1>
    <button class="logout-btn" onclick="doLogout()">LOG OUT</button>
  </div>

  <div class="dash-body">
    <button class="refresh-btn" onclick="loadStats()">REFRESH</button>
    <div style="clear:both;margin-bottom:16px;"></div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">Leads Today</div><div class="stat-value" id="leadsToday">—</div></div>
      <div class="stat-card"><div class="stat-label">Leads This Week</div><div class="stat-value" id="leadsWeek">—</div></div>
      <div class="stat-card"><div class="stat-label">Conversion Rate</div><div class="stat-value" id="convRate">—</div></div>
      <div class="stat-card"><div class="stat-label">Active Clients</div><div class="stat-value" id="activeClients">—</div></div>
      <div class="stat-card"><div class="stat-label">Pending Check-ins</div><div class="stat-value" id="pendingCheckins">—</div></div>
      <div class="stat-card"><div class="stat-label">Programs This Week</div><div class="stat-value" id="programsWeek">—</div></div>
    </div>

    <div class="dash-section">
      <h2>ACTIVE CLIENTS BY PROGRAM</h2>
      <div id="programBreakdown"><div class="loading">Loading...</div></div>
    </div>

    <div class="dash-section">
      <h2>RECENT ESCALATIONS</h2>
      <div id="escalationsList"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var authToken = null;

function initSupabase() {
  var meta = document.querySelector('meta[name="supabase-url"]');
  if (meta) SUPABASE_URL = meta.content;
}

function doLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!email || !password) {
    errEl.textContent = 'Please enter email and password.';
    errEl.style.display = 'block';
    return;
  }

  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) {
      errEl.textContent = data.error;
      errEl.style.display = 'block';
      return;
    }
    authToken = data.access_token;
    sessionStorage.setItem('adminToken', authToken);
    showDashboard();
  })
  .catch(function() {
    errEl.textContent = 'Login failed. Check your credentials.';
    errEl.style.display = 'block';
  });
}

function doLogout() {
  authToken = null;
  sessionStorage.removeItem('adminToken');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}

function loadStats() {
  if (!authToken) return;

  fetch('/api/admin/stats', {
    headers: { 'Authorization': 'Bearer ' + authToken }
  })
  .then(function(r) {
    if (r.status === 401) { doLogout(); throw new Error('Session expired'); }
    return r.json();
  })
  .then(function(data) {
    document.getElementById('leadsToday').textContent = data.leads.today;
    document.getElementById('leadsWeek').textContent = data.leads.this_week;
    document.getElementById('convRate').textContent = data.leads.conversion_rate;
    document.getElementById('activeClients').textContent = data.clients.active_total;
    document.getElementById('pendingCheckins').textContent = data.checkins.pending;
    document.getElementById('programsWeek').textContent = data.programs.generated_this_week;

    renderProgramBreakdown(data.clients.active_by_program, data.clients.active_total);
    renderEscalations(data.escalations);
  })
  .catch(function(err) {
    console.error('Stats load error:', err);
  });
}

var PROGRAM_LABELS = {
  '6wk_gym': '6-Week Burn & Build (Gym)',
  '6wk_home': '6-Week Burn & Build (Home)',
  '12wk': '12-Week Custom Flagship',
  'pcos': 'PCOS Warrior',
  '40plus': '40+ Strong',
  'zoom_trial': 'Zoom Trial',
  'zoom_pack': 'Zoom Pack'
};

function renderProgramBreakdown(programs, total) {
  var container = document.getElementById('programBreakdown');
  if (!programs || Object.keys(programs).length === 0) {
    container.innerHTML = '<div class="empty-state">No active clients yet</div>';
    return;
  }

  var html = '';
  var maxCount = Math.max.apply(null, Object.values(programs));

  for (var key in programs) {
    var count = programs[key];
    var pct = maxCount > 0 ? (count / maxCount) * 100 : 0;
    var label = PROGRAM_LABELS[key] || key;
    html += '<div class="program-bar">' +
      '<div class="prog-name">' + label + '</div>' +
      '<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="prog-count">' + count + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
}

function renderEscalations(escalations) {
  var container = document.getElementById('escalationsList');
  if (!escalations || escalations.length === 0) {
    container.innerHTML = '<div class="empty-state">No escalations — all clear!</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < escalations.length; i++) {
    var e = escalations[i];
    var date = new Date(e.sent_at).toLocaleString();
    html += '<div class="escalation-item">' +
      '<div class="esc-body">' + escapeHtml(e.body) + '</div>' +
      '<div class="esc-meta">' + date + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

(function() {
  var saved = sessionStorage.getItem('adminToken');
  if (saved) {
    authToken = saved;
    showDashboard();
  }

  document.getElementById('loginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
})();
</script>

</body>
</html>
