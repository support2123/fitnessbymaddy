<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #333;
      --gold: #B8965A;
      --gold-dim: rgba(184,150,90,0.15);
      --text: #e8e8e8;
      --text2: #888;
      --success: #27AE60;
      --danger: #C0392B;
      --warning: #F39C12;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--surface); padding: 48px 40px; border-radius: 8px; text-align: center; max-width: 360px; width: 100%; }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
    .login-box p { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: inherit; font-size: 14px; margin-bottom: 16px; }
    .login-box input:focus { outline: none; border-color: var(--gold); }
    .login-box button { width: 100%; padding: 12px; background: var(--gold); color: #000; border: none; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }

    #dashboard { display: none; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); }
    .dash-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 3px; }
    .dash-header button { background: none; border: 1px solid var(--border); color: var(--text2); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }

    .dash-body { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border-radius: 8px; padding: 20px; border: 1px solid var(--border); }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); }
    .stat-card .sub { font-size: 12px; color: var(--text2); margin-top: 4px; }

    .section { margin-bottom: 32px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
    th { text-align: left; padding: 12px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); background: var(--surface2); border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(51,51,51,0.5); }
    tr:hover td { background: rgba(184,150,90,0.04); }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .badge-new { background: var(--gold-dim); color: var(--gold); }
    .badge-qualified { background: rgba(39,174,96,0.15); color: var(--success); }
    .badge-converted { background: rgba(39,174,96,0.25); color: var(--success); }
    .badge-dropped { background: rgba(192,57,43,0.15); color: var(--danger); }
    .badge-active { background: rgba(39,174,96,0.15); color: var(--success); }
    .badge-paused { background: rgba(243,156,18,0.15); color: var(--warning); }

    .escalation-card { background: var(--surface); border: 1px solid var(--danger); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .escalation-card .esc-title { color: var(--danger); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .escalation-card .esc-body { color: var(--text2); font-size: 13px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }

    @media (max-width: 768px) {
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat-card .value { font-size: 28px; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>FITNESS BY MADDY</h1>
    <p>Admin Dashboard</p>
    <input type="password" id="passwordInput" placeholder="Enter admin password" autofocus>
    <button onclick="login()">Access Dashboard</button>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <h1>FITNESS BY MADDY — OPS</h1>
    <div>
      <button onclick="loadDashboard()">Refresh</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="dash-body">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="section" id="escalationsSection">
      <div class="section-title">ESCALATIONS AWAITING REVIEW</div>
      <div id="escalationsList"></div>
    </div>

    <div class="section">
      <div class="section-title">RECENT LEADS</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Phone</th><th>Status</th><th>Program</th><th>Market</th><th>Created</th></tr>
          </thead>
          <tbody id="leadsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">ACTIVE CLIENTS</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Program</th><th>Started</th><th>Ends</th><th>Paid</th><th>Status</th></tr>
          </thead>
          <tbody id="clientsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">PENDING CHECK-INS</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Client</th><th>Week</th><th>Due Since</th><th>Status</th></tr>
          </thead>
          <tbody id="pendingCheckinsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">PROGRAMS GENERATED THIS WEEK</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>Link</th></tr>
          </thead>
          <tbody id="programsTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  var API_BASE = '/api/admin';
  var token = '';

  function login() {
    token = document.getElementById('passwordInput').value;
    if (!token) return;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  document.getElementById('passwordInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  function logout() {
    token = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
  }

  async function apiFetch(endpoint) {
    var res = await fetch(API_BASE + '?action=' + endpoint, {
      headers: { 'x-admin-token': token }
    });
    if (res.status === 401) { logout(); return null; }
    return res.json();
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 6) return '***';
    return phone.slice(0, 3) + 'XXX...' + phone.slice(-3);
  }

  function badge(status) {
    var cls = 'badge-' + status;
    return '<span class="badge ' + cls + '">' + status + '</span>';
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function loadDashboard() {
    var data = await apiFetch('dashboard');
    if (!data) return;

    document.getElementById('statsGrid').innerHTML =
      statCard('Leads Today', data.leads_today, 'this week: ' + data.leads_this_week) +
      statCard('Conversion Rate', data.conversion_rate + '%', data.total_converted + ' converted') +
      statCard('Active Clients', data.active_clients, 'by program below') +
      statCard('Pending Check-ins', data.pending_checkins, 'this week') +
      statCard('Programs Generated', data.programs_this_week, 'this week') +
      statCard('Escalations', data.escalation_count, 'awaiting review');

    var escHtml = '';
    if (data.escalations && data.escalations.length > 0) {
      data.escalations.forEach(function(e) {
        escHtml += '<div class="escalation-card"><div class="esc-title">' + e.template_name + '</div><div class="esc-body">' + maskPhone(e.phone) + ' — ' + (e.body || '').slice(0, 150) + '</div></div>';
      });
    } else {
      escHtml = '<div class="empty-state">No escalations pending</div>';
    }
    document.getElementById('escalationsList').innerHTML = escHtml;

    var leadsHtml = '';
    if (data.recent_leads) {
      data.recent_leads.forEach(function(l) {
        leadsHtml += '<tr><td>' + (l.name || '—') + '</td><td>' + maskPhone(l.phone) + '</td><td>' + badge(l.status) + '</td><td>' + (l.program_interest || '—') + '</td><td>' + (l.market || '—') + '</td><td>' + formatDate(l.created_at) + '</td></tr>';
      });
    }
    document.getElementById('leadsTable').innerHTML = leadsHtml || '<tr><td colspan="6" class="empty-state">No leads yet</td></tr>';

    var clientsHtml = '';
    if (data.active_clients_list) {
      data.active_clients_list.forEach(function(c) {
        clientsHtml += '<tr><td>' + (c.name || '—') + '</td><td>' + (c.program || '—') + '</td><td>' + formatDate(c.program_started_at) + '</td><td>' + formatDate(c.program_ends_at) + '</td><td>$' + (c.paid_amount || 0) + '</td><td>' + badge(c.status) + '</td></tr>';
      });
    }
    document.getElementById('clientsTable').innerHTML = clientsHtml || '<tr><td colspan="6" class="empty-state">No active clients</td></tr>';

    var pendingHtml = '';
    if (data.pending_checkins_list) {
      data.pending_checkins_list.forEach(function(p) {
        pendingHtml += '<tr><td>' + (p.name || '—') + '</td><td>Week ' + p.week + '</td><td>' + formatDate(p.due_since) + '</td><td>' + badge('paused') + '</td></tr>';
      });
    }
    document.getElementById('pendingCheckinsTable').innerHTML = pendingHtml || '<tr><td colspan="4" class="empty-state">All check-ins submitted</td></tr>';

    var progsHtml = '';
    if (data.programs_list) {
      data.programs_list.forEach(function(p) {
        progsHtml += '<tr><td>' + (p.client_name || '—') + '</td><td>Week ' + p.week_no + '</td><td>' + formatDate(p.generated_at) + '</td><td>' + (p.whatsapp_sent_at ? 'Yes' : 'No') + '</td><td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">View</a>' : '—') + '</td></tr>';
      });
    }
    document.getElementById('programsTable').innerHTML = progsHtml || '<tr><td colspan="5" class="empty-state">No programs generated this week</td></tr>';
  }

  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div>';
  }
</script>

</body>
</html>
