<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 48px 40px;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
    }
    .login-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      margin-bottom: 8px;
    }
    .login-box p {
      font-size: 13px;
      color: var(--mid-grey);
      margin-bottom: 32px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px;
      outline: none;
      background: var(--cream);
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }
    .login-box button:hover { background: var(--gold); }
    .login-error {
      color: #991b1b;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }

    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .dash-user {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
    .dash-logout {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
      margin-left: 16px;
    }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 40px; max-width: 1200px; margin: 0 auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 28px 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card-sub {
      font-size: 12px;
      color: var(--gold);
      margin-top: 4px;
    }

    .section-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      margin-top: 40px;
    }

    .data-table {
      width: 100%;
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      border-collapse: collapse;
    }
    .data-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      padding: 14px 16px;
      border-bottom: 1px solid var(--light-grey);
      background: var(--sand);
    }
    .data-table td {
      font-size: 13px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--light-grey);
      color: var(--charcoal);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--cream); }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 2px;
    }
    .badge-new { background: #dbeafe; color: #1e40af; }
    .badge-qualified { background: #fef3c7; color: #92400e; }
    .badge-converted { background: #d1fae5; color: #065f46; }
    .badge-dropped { background: #fee2e2; color: #991b1b; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-paused { background: #fef3c7; color: #92400e; }
    .badge-completed { background: #e0e7ff; color: #3730a3; }

    .escalation-card {
      background: #fef2f2;
      border-left: 3px solid #ef4444;
      padding: 16px 20px;
      margin-bottom: 12px;
      border-radius: 0 4px 4px 0;
    }
    .escalation-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #991b1b;
      margin-bottom: 4px;
    }
    .escalation-card-body {
      font-size: 12px;
      color: #6b7280;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--mid-grey);
      font-size: 13px;
    }

    .refresh-btn {
      background: var(--sand);
      border: 1px solid var(--light-grey);
      padding: 8px 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
      color: var(--charcoal);
      float: right;
    }
    .refresh-btn:hover { border-color: var(--gold); }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--mid-grey);
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .dash-content { padding: 20px; }
      .dash-header { padding: 16px 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 12px; }
    }
  </style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-box">
    <h2>Dashboard</h2>
    <p>Fitness by Maddy — Admin Access</p>
    <div id="login-error" class="login-error"></div>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" onclick="handleLogin()">Sign In</button>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <div class="dash-header">
    <div class="dash-logo">Fitness by Maddy</div>
    <div>
      <span class="dash-user" id="dash-user"></span>
      <button class="dash-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

  <div class="dash-content">
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
    <div id="loading" class="loading">Loading dashboard...</div>

    <div id="dash-data" style="display:none">
      <div class="stats-grid" id="stats-grid"></div>

      <div class="section-header">Escalations Awaiting Review</div>
      <div id="escalations"></div>

      <div class="section-header">Recent Leads</div>
      <div id="leads-table-wrap"></div>

      <div class="section-header">Active Clients</div>
      <div id="clients-table-wrap"></div>

      <div class="section-header">Pending Check-ins</div>
      <div id="checkins-table-wrap"></div>

      <div class="section-header">Programs Generated This Week</div>
      <div id="programs-table-wrap"></div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var session = null;

async function getConfig() {
  if (SUPABASE_URL) return;
  try {
    var resp = await fetch('/api/admin-config');
    var cfg = await resp.json();
    SUPABASE_URL = cfg.supabaseUrl || '';
    SUPABASE_ANON_KEY = cfg.supabaseAnonKey || '';
  } catch (e) {
    console.error('Failed to load config:', e);
  }
}

function supabaseHeaders() {
  var h = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY)
  };
  return h;
}

async function supabaseQuery(table, query) {
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var resp = await fetch(url, { headers: supabaseHeaders() });
  return resp.json();
}

async function handleLogin() {
  await getConfig();
  var email = document.getElementById('login-email').value;
  var password = document.getElementById('login-password').value;
  var errorEl = document.getElementById('login-error');

  if (!SUPABASE_URL) {
    errorEl.textContent = 'Dashboard not configured. Set Supabase credentials.';
    errorEl.style.display = 'block';
    return;
  }

  try {
    var resp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await resp.json();
    if (data.access_token) {
      session = data;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('dash-user').textContent = email;
      localStorage.setItem('fbm_session', JSON.stringify(data));
      loadDashboard();
    } else {
      errorEl.textContent = data.error_description || 'Invalid credentials';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Connection error. Try again.';
    errorEl.style.display = 'block';
  }
}

function handleLogout() {
  session = null;
  localStorage.removeItem('fbm_session');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function loadDashboard() {
  var loading = document.getElementById('loading');
  var dashData = document.getElementById('dash-data');
  loading.style.display = 'block';
  dashData.style.display = 'none';

  try {
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    var weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();

    var [allLeads, weekLeads, todayLeads, allClients, activeClients, pendingCheckins, weekPrograms] = await Promise.all([
      supabaseQuery('leads', 'select=id,status'),
      supabaseQuery('leads', 'select=id&created_at=gte.' + weekAgo),
      supabaseQuery('leads', 'select=id&created_at=gte.' + todayStart),
      supabaseQuery('clients', 'select=id,status'),
      supabaseQuery('clients', 'select=*&status=eq.active&order=created_at.desc'),
      supabaseQuery('checkins', 'select=*&order=created_at.desc&limit=20'),
      supabaseQuery('programs', 'select=*&generated_at=gte.' + weekAgo + '&order=generated_at.desc')
    ]);

    var converted = (allLeads || []).filter(function(l) { return l.status === 'converted'; }).length;
    var totalLeads = (allLeads || []).length;
    var conversionRate = totalLeads > 0 ? Math.round((converted / totalLeads) * 100) : 0;

    var activeByProgram = {};
    (activeClients || []).forEach(function(c) {
      activeByProgram[c.program] = (activeByProgram[c.program] || 0) + 1;
    });

    var statsHtml = '' +
      statCard('Leads Today', (todayLeads || []).length, 'new this session') +
      statCard('Leads This Week', (weekLeads || []).length, 'last 7 days') +
      statCard('Conversion Rate', conversionRate + '%', converted + ' of ' + totalLeads) +
      statCard('Active Clients', (activeClients || []).length, Object.keys(activeByProgram).length + ' programs') +
      statCard('Programs This Week', (weekPrograms || []).length, 'generated');

    document.getElementById('stats-grid').innerHTML = statsHtml;

    var recentLeads = await supabaseQuery('leads', 'select=*&order=created_at.desc&limit=15');
    document.getElementById('leads-table-wrap').innerHTML = leadsTable(recentLeads || []);

    document.getElementById('clients-table-wrap').innerHTML = clientsTable(activeClients || []);

    document.getElementById('checkins-table-wrap').innerHTML = checkinsTable(pendingCheckins || []);

    document.getElementById('programs-table-wrap').innerHTML = programsTable(weekPrograms || []);

    var escalationMsgs = await supabaseQuery('messages', 'select=*&direction=eq.out&body=like.*Escalation*&order=sent_at.desc&limit=10');
    document.getElementById('escalations').innerHTML = escalationsHtml(escalationMsgs || []);

    loading.style.display = 'none';
    dashData.style.display = 'block';
  } catch (err) {
    loading.textContent = 'Error loading dashboard: ' + err.message;
  }
}

function statCard(label, value, sub) {
  return '<div class="stat-card">' +
    '<div class="stat-card-label">' + label + '</div>' +
    '<div class="stat-card-value">' + value + '</div>' +
    '<div class="stat-card-sub">' + (sub || '') + '</div></div>';
}

function badge(status) {
  return '<span class="badge badge-' + status + '">' + status + '</span>';
}

function maskPhone(phone) {
  if (!phone || phone.length < 6) return '***';
  return phone.slice(0, 3) + 'XXX...' + phone.slice(-3);
}

function shortDate(d) {
  if (!d) return '-';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function leadsTable(leads) {
  if (!leads.length) return '<div class="empty-state">No leads yet</div>';
  var html = '<table class="data-table"><thead><tr>' +
    '<th>Phone</th><th>Name</th><th>Status</th><th>Interest</th><th>Market</th><th>Created</th>' +
    '</tr></thead><tbody>';
  leads.forEach(function(l) {
    html += '<tr><td>' + maskPhone(l.phone) + '</td><td>' + (l.name || '-') + '</td>' +
      '<td>' + badge(l.status) + '</td><td>' + (l.program_interest || '-') + '</td>' +
      '<td>' + (l.market || '-') + '</td><td>' + shortDate(l.created_at) + '</td></tr>';
  });
  return html + '</tbody></table>';
}

function clientsTable(clients) {
  if (!clients.length) return '<div class="empty-state">No active clients</div>';
  var html = '<table class="data-table"><thead><tr>' +
    '<th>Name</th><th>Program</th><th>Status</th><th>Started</th><th>Ends</th>' +
    '</tr></thead><tbody>';
  clients.forEach(function(c) {
    html += '<tr><td>' + (c.name || maskPhone(c.phone)) + '</td>' +
      '<td>' + (c.program || '-') + '</td>' +
      '<td>' + badge(c.status) + '</td>' +
      '<td>' + shortDate(c.program_started_at) + '</td>' +
      '<td>' + shortDate(c.program_ends_at) + '</td></tr>';
  });
  return html + '</tbody></table>';
}

function checkinsTable(checkins) {
  if (!checkins.length) return '<div class="empty-state">No check-ins yet</div>';
  var html = '<table class="data-table"><thead><tr>' +
    '<th>Client</th><th>Week</th><th>Weight</th><th>Compliance</th><th>Energy</th><th>Submitted</th>' +
    '</tr></thead><tbody>';
  checkins.forEach(function(c) {
    html += '<tr><td>' + (c.client_id || '-').slice(0, 8) + '...</td>' +
      '<td>' + c.week_no + '</td>' +
      '<td>' + (c.weight || '-') + ' kg</td>' +
      '<td>' + (c.compliance_score || '-') + '/10</td>' +
      '<td>' + (c.energy || '-') + '/10</td>' +
      '<td>' + shortDate(c.form_submitted_at) + '</td></tr>';
  });
  return html + '</tbody></table>';
}

function programsTable(programs) {
  if (!programs.length) return '<div class="empty-state">No programs generated this week</div>';
  var html = '<table class="data-table"><thead><tr>' +
    '<th>Client</th><th>Week</th><th>Generated</th><th>WA Sent</th><th>PDF</th>' +
    '</tr></thead><tbody>';
  programs.forEach(function(p) {
    html += '<tr><td>' + (p.client_id || '-').slice(0, 8) + '...</td>' +
      '<td>' + p.week_no + '</td>' +
      '<td>' + shortDate(p.generated_at) + '</td>' +
      '<td>' + (p.whatsapp_sent_at ? shortDate(p.whatsapp_sent_at) : 'Pending') + '</td>' +
      '<td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">View</a>' : '-') + '</td></tr>';
  });
  return html + '</tbody></table>';
}

function escalationsHtml(messages) {
  if (!messages.length) return '<div class="empty-state">No escalations</div>';
  var html = '';
  messages.forEach(function(m) {
    html += '<div class="escalation-card">' +
      '<div class="escalation-card-title">' + maskPhone(m.phone) + '</div>' +
      '<div class="escalation-card-body">' + (m.body || '') + ' &mdash; ' + shortDate(m.sent_at) + '</div></div>';
  });
  return html;
}

(async function() {
  await getConfig();
  var saved = localStorage.getItem('fbm_session');
  if (saved) {
    try {
      session = JSON.parse(saved);
      var exp = new Date(session.expires_at * 1000);
      if (exp > new Date()) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('dash-user').textContent = session.user?.email || 'Admin';
        loadDashboard();
        return;
      }
    } catch (e) {}
    localStorage.removeItem('fbm_session');
  }
})();
</script>
</body>
</html>
