<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --sand: #F0EAE0; --light-grey: #E8E3DC; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #111; color: #fff; min-height: 100vh; }

    /* Login */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: #1a1a1a; padding: 48px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; }
    .login-box p { font-size: 13px; color: #888; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: #222; border: 1px solid #333; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; border-radius: 4px; margin-bottom: 12px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #111; border: none; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; cursor: pointer; border-radius: 4px; margin-top: 8px; }
    .login-btn:hover { background: var(--gold-light); }
    .login-error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header { background: #1a1a1a; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .dash-brand { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--gold); }
    .dash-logout { background: none; border: 1px solid #555; color: #888; padding: 8px 16px; font-size: 12px; letter-spacing: 1px; cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dash-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: #1a1a1a; padding: 24px; border-radius: 8px; border: 1px solid #222; }
    .stat-card-value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-card-label { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--gold); margin: 32px 0 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); padding: 10px 12px; border-bottom: 1px solid #333; }
    .data-table td { padding: 12px; font-size: 14px; color: #ccc; border-bottom: 1px solid #1a1a1a; }
    .data-table tr:hover td { background: #1a1a1a; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; letter-spacing: 0.5px; font-weight: 500; }
    .badge-new { background: rgba(52,152,219,0.15); color: #3498db; }
    .badge-qualified { background: rgba(241,196,15,0.15); color: #f1c40f; }
    .badge-converted { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .badge-dropped { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .badge-active { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .empty-state { text-align: center; padding: 40px; color: #555; font-size: 14px; }
    .refresh-btn { background: none; border: 1px solid #333; color: #888; padding: 8px 16px; font-size: 12px; cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
    .loading { text-align: center; padding: 40px; color: #555; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard</p>
    <input class="login-input" type="email" id="loginEmail" placeholder="Email address">
    <input class="login-input" type="password" id="loginPassword" placeholder="Password">
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">LOGIN</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-brand">Fitness by Maddy — Admin</div>
    <div>
      <button class="refresh-btn" onclick="loadDashboard()" style="margin-right:8px">Refresh</button>
      <button class="dash-logout" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="dash-title">Dashboard Overview</div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-card-value" id="leadsToday">-</div><div class="stat-card-label">Leads Today</div></div>
      <div class="stat-card"><div class="stat-card-value" id="leadsWeek">-</div><div class="stat-card-label">Leads This Week</div></div>
      <div class="stat-card"><div class="stat-card-value" id="conversionRate">-</div><div class="stat-card-label">Conversion Rate</div></div>
      <div class="stat-card"><div class="stat-card-value" id="activeClients">-</div><div class="stat-card-label">Active Clients</div></div>
      <div class="stat-card"><div class="stat-card-value" id="pendingCheckins">-</div><div class="stat-card-label">Pending Check-ins</div></div>
      <div class="stat-card"><div class="stat-card-value" id="programsGenerated">-</div><div class="stat-card-label">Programs This Week</div></div>
    </div>

    <div class="section-title">Active Clients by Program</div>
    <div id="clientsByProgram"><div class="loading">Loading...</div></div>

    <div class="section-title">Recent Leads</div>
    <div id="recentLeads"><div class="loading">Loading...</div></div>

    <div class="section-title">Escalations</div>
    <div id="escalations"><div class="loading">Loading...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';

// Read from meta tags or inline config
var metaUrl = document.querySelector('meta[name="supabase-url"]');
var metaKey = document.querySelector('meta[name="supabase-key"]');
if (metaUrl) SUPABASE_URL = metaUrl.content;
if (metaKey) SUPABASE_ANON_KEY = metaKey.content;

// Fallback: try loading from /api/config (a simple endpoint that returns public keys)
var sb = null;

async function initSupabase() {
  if (!SUPABASE_URL) {
    try {
      var res = await fetch('/api/admin-config');
      var config = await res.json();
      SUPABASE_URL = config.supabase_url;
      SUPABASE_ANON_KEY = config.supabase_anon_key;
    } catch (e) {
      console.error('Failed to load config');
    }
  }
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var session = await sb.auth.getSession();
    if (session.data.session) {
      showDashboard();
    }
  }
}

async function handleLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  var errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';

  if (!sb) { errorEl.textContent = 'System not configured'; errorEl.style.display = 'block'; return; }

  var result = await sb.auth.signInWithPassword({ email: email, password: password });
  if (result.error) {
    errorEl.textContent = result.error.message;
    errorEl.style.display = 'block';
  } else {
    showDashboard();
  }
}

async function handleLogout() {
  if (sb) await sb.auth.signOut();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

async function loadDashboard() {
  if (!sb) return;
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
  var weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

  // Leads today
  var r1 = await sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', todayStart);
  document.getElementById('leadsToday').textContent = r1.count || 0;

  // Leads this week
  var r2 = await sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', weekStart);
  document.getElementById('leadsWeek').textContent = r2.count || 0;

  // Conversion rate
  var r3 = await sb.from('leads').select('id', { count: 'exact', head: true });
  var r4 = await sb.from('leads').select('id', { count: 'exact', head: true }).eq('status', 'converted');
  var total = r3.count || 0;
  var converted = r4.count || 0;
  document.getElementById('conversionRate').textContent = total > 0 ? Math.round((converted / total) * 100) + '%' : '0%';

  // Active clients
  var r5 = await sb.from('clients').select('id', { count: 'exact', head: true }).eq('status', 'active');
  document.getElementById('activeClients').textContent = r5.count || 0;

  // Pending check-ins (active clients who haven't submitted this week)
  var r6 = await sb.from('clients').select('id, program_started_at').eq('status', 'active');
  var activeList = r6.data || [];
  var pendingCount = 0;
  for (var i = 0; i < activeList.length; i++) {
    var cl = activeList[i];
    var wk = Math.ceil((now - new Date(cl.program_started_at)) / (7 * 24 * 60 * 60 * 1000));
    var r7 = await sb.from('checkins').select('id', { count: 'exact', head: true }).eq('client_id', cl.id).eq('week_no', wk);
    if (!r7.count) pendingCount++;
  }
  document.getElementById('pendingCheckins').textContent = pendingCount;

  // Programs generated this week
  var r8 = await sb.from('programs').select('id', { count: 'exact', head: true }).gte('generated_at', weekStart);
  document.getElementById('programsGenerated').textContent = r8.count || 0;

  // Active clients by program
  var r9 = await sb.from('clients').select('program').eq('status', 'active');
  var programCounts = {};
  (r9.data || []).forEach(function(c) {
    programCounts[c.program] = (programCounts[c.program] || 0) + 1;
  });
  var programLabels = {
    '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
    'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
  };
  var progHTML = '<table class="data-table"><thead><tr><th>Program</th><th>Active Clients</th></tr></thead><tbody>';
  var progKeys = Object.keys(programCounts);
  if (progKeys.length === 0) {
    progHTML = '<div class="empty-state">No active clients yet</div>';
  } else {
    progKeys.forEach(function(k) {
      progHTML += '<tr><td>' + (programLabels[k] || k) + '</td><td>' + programCounts[k] + '</td></tr>';
    });
    progHTML += '</tbody></table>';
  }
  document.getElementById('clientsByProgram').innerHTML = progHTML;

  // Recent leads
  var r10 = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(15);
  var leads = r10.data || [];
  var leadsHTML = '';
  if (leads.length === 0) {
    leadsHTML = '<div class="empty-state">No leads yet</div>';
  } else {
    leadsHTML = '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Source</th><th>Program</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    leads.forEach(function(l) {
      var ph = l.phone || '';
      var masked = ph.length > 6 ? ph.slice(0, 4) + 'XXX...' + ph.slice(-3) : '***';
      var statusClass = 'badge-' + (l.status || 'new');
      leadsHTML += '<tr><td>' + (l.name || '-') + '</td><td>' + masked + '</td><td>' + (l.source || '-') + '</td><td>' + (l.program_interest || '-') + '</td><td><span class="badge ' + statusClass + '">' + (l.status || 'new') + '</span></td><td>' + new Date(l.created_at).toLocaleDateString() + '</td></tr>';
    });
    leadsHTML += '</tbody></table>';
  }
  document.getElementById('recentLeads').innerHTML = leadsHTML;

  // Escalations (messages to Maddy containing ESCALATION)
  var r11 = await sb.from('messages').select('*').like('body', '%ESCALATION%').order('sent_at', { ascending: false }).limit(10);
  var escs = r11.data || [];
  var escHTML = '';
  if (escs.length === 0) {
    escHTML = '<div class="empty-state">No escalations</div>';
  } else {
    escHTML = '<table class="data-table"><thead><tr><th>Date</th><th>Details</th></tr></thead><tbody>';
    escs.forEach(function(e) {
      escHTML += '<tr><td>' + new Date(e.sent_at).toLocaleString() + '</td><td style="white-space:pre-wrap;max-width:600px">' + (e.body || '') + '</td></tr>';
    });
    escHTML += '</tbody></table>';
  }
  document.getElementById('escalations').innerHTML = escHTML;
}

initSupabase();
</script>
</body>
</html>
