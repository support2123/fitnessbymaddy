<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --taupe: #C8B89A;
      --gold: #B8965A; --gold-light: #D4AF7A; --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-nav {
      background: var(--charcoal); padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; }
    .admin-badge { font-size: 10px; background: var(--gold); color: white; padding: 4px 10px; border-radius: 2px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

    .login-screen { max-width: 400px; margin: 120px auto; text-align: center; padding: 0 24px; }
    .login-screen h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 8px; }
    .login-screen p { font-size: 14px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: white; margin-bottom: 16px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
    .login-btn:hover { background: var(--gold); }

    .dashboard { display: none; padding: 40px; max-width: 1200px; margin: 0 auto; }
    .dash-header { margin-bottom: 40px; }
    .dash-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; }
    .dash-header p { font-size: 13px; color: var(--mid-grey); margin-top: 4px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: white; padding: 28px 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--gold); margin-top: 4px; }
    .stat-card.gold { background: var(--charcoal); }
    .stat-card.gold .stat-card-label { color: var(--taupe); }
    .stat-card.gold .stat-card-value { color: var(--gold-light); }
    .stat-card.gold .stat-card-sub { color: rgba(255,255,255,0.5); }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--light-grey); display: flex; align-items: center; justify-content: space-between; }
    .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; }
    .panel-badge { font-size: 10px; background: var(--sand); color: var(--mid-grey); padding: 4px 10px; border-radius: 2px; font-weight: 600; letter-spacing: 1px; }
    .panel-body { padding: 20px 24px; }

    .program-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--light-grey); }
    .program-row:last-child { border-bottom: none; }
    .program-name { font-size: 13px; font-weight: 500; }
    .program-count { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--gold); }

    .escalation-item { padding: 14px 0; border-bottom: 1px solid var(--light-grey); }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-phone { font-size: 12px; color: var(--mid-grey); font-weight: 500; letter-spacing: 0.5px; }
    .escalation-body { font-size: 13px; color: var(--charcoal); margin-top: 4px; line-height: 1.5; }
    .escalation-time { font-size: 11px; color: var(--taupe); margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--mid-grey); font-size: 13px; }

    .refresh-btn { background: none; border: 1px solid var(--light-grey); padding: 6px 14px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 2px; color: var(--mid-grey); transition: all 0.2s; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .dashboard { padding: 24px; }
      .admin-nav { padding: 0 20px; }
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="admin-nav">
  <a class="admin-logo" href="/admin">Fitness by Maddy</a>
  <span class="admin-badge">Admin</span>
</nav>

<div class="login-screen" id="loginScreen">
  <h1>Dashboard Login</h1>
  <p>Enter your admin key to access the dashboard.</p>
  <input type="password" class="login-input" id="adminKey" placeholder="Admin API Key" onkeydown="if(event.key==='Enter')login()">
  <button class="login-btn" onclick="login()">Access Dashboard</button>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>Daily Operations</h1>
        <p id="dashDate"></p>
      </div>
      <button class="refresh-btn" onclick="loadStats()">Refresh</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-card-label">Leads Today</div>
      <div class="stat-card-value" id="leadsToday">—</div>
      <div class="stat-card-sub" id="leadsWeek">— this week</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Conversion Rate</div>
      <div class="stat-card-value" id="convRate">—%</div>
      <div class="stat-card-sub" id="totalLeads">— total leads</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-card-label">Active Clients</div>
      <div class="stat-card-value" id="activeClients">—</div>
      <div class="stat-card-sub" id="pendingCheckins">— pending check-ins</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Programs Generated</div>
      <div class="stat-card-value" id="programsWeek">—</div>
      <div class="stat-card-sub">this week</div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Clients by Program</div>
      </div>
      <div class="panel-body" id="programsPanel">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Recent Escalations</div>
        <span class="panel-badge" id="escCount">0</span>
      </div>
      <div class="panel-body" id="escalationsPanel">
        <div class="empty-state">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
var apiKey = '';
var PROGRAM_LABELS = {
  '6wk_gym': '6-Week Burn & Build (Gym)',
  '6wk_home': '6-Week Burn & Build (Home)',
  '12wk': '12-Week Flagship',
  'pcos': 'PCOS Warrior',
  '40plus': '40+ Strong',
  'zoom_trial': 'Zoom Trial',
  'zoom_pack': 'Zoom Pack',
};

function login() {
  apiKey = document.getElementById('adminKey').value;
  if (!apiKey) return;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  loadStats();
}

async function loadStats() {
  try {
    var res = await fetch('/api/admin-stats', {
      headers: { 'Authorization': 'Bearer ' + apiKey },
    });
    if (!res.ok) {
      if (res.status === 401) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'block';
        alert('Invalid admin key. Please try again.');
        return;
      }
      throw new Error('API error');
    }
    var data = await res.json();
    renderStats(data);
  } catch (e) {
    console.error('Failed to load stats:', e);
  }
}

function renderStats(data) {
  document.getElementById('leadsToday').textContent = data.leads_today;
  document.getElementById('leadsWeek').textContent = data.leads_this_week + ' this week';
  document.getElementById('convRate').textContent = data.conversion_rate + '%';
  document.getElementById('totalLeads').textContent = data.total_leads + ' total leads';
  document.getElementById('activeClients').textContent = data.active_clients;
  document.getElementById('pendingCheckins').textContent = data.pending_checkins + ' pending check-ins';
  document.getElementById('programsWeek').textContent = data.programs_generated_this_week;

  var programsHtml = '';
  var programs = data.clients_by_program || {};
  var keys = Object.keys(programs);
  if (keys.length === 0) {
    programsHtml = '<div class="empty-state">No active clients yet</div>';
  } else {
    for (var i = 0; i < keys.length; i++) {
      var label = PROGRAM_LABELS[keys[i]] || keys[i];
      programsHtml += '<div class="program-row"><span class="program-name">' + label + '</span><span class="program-count">' + programs[keys[i]] + '</span></div>';
    }
  }
  document.getElementById('programsPanel').innerHTML = programsHtml;

  var escalations = data.recent_escalations || [];
  document.getElementById('escCount').textContent = escalations.length;
  if (escalations.length === 0) {
    document.getElementById('escalationsPanel').innerHTML = '<div class="empty-state">No escalations. All clear!</div>';
  } else {
    var escHtml = '';
    for (var j = 0; j < escalations.length; j++) {
      var e = escalations[j];
      var timeStr = e.time ? new Date(e.time).toLocaleString('en-IN') : '';
      escHtml += '<div class="escalation-item"><div class="escalation-phone">' + e.phone + '</div><div class="escalation-body">' + (e.body || '').replace(/</g, '&lt;') + '</div><div class="escalation-time">' + timeStr + '</div></div>';
    }
    document.getElementById('escalationsPanel').innerHTML = escHtml;
  }
}
</script>
</body>
</html>
