<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #4A9B6B;
      --red: #C4544A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box {
      background: white; padding: 48px; border-radius: 4px; width: 100%; max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 2px; margin-bottom: 24px; text-align: center;
    }
    .login-box input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%; padding: 14px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
    }
    .login-box button:hover { background: var(--gold); }

    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      color: white; letter-spacing: 2px;
    }
    .dash-header button {
      background: transparent; border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7); padding: 8px 16px; font-size: 11px;
      letter-spacing: 1px; cursor: pointer; border-radius: 2px;
    }
    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); border-top: 3px solid var(--light-grey);
    }
    .stat-card.highlight { border-top-color: var(--gold); }
    .stat-card .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--charcoal); }
    .stat-card .sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    .section-block { background: white; border-radius: 4px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .section-block h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 1.5px; color: var(--gold); margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey);
      padding: 8px 12px; border-bottom: 1px solid var(--light-grey);
    }
    td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--light-grey); }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-new { background: #E3F2FD; color: #1565C0; }
    .badge-qualified { background: #FFF3E0; color: #E65100; }
    .badge-converted { background: #E8F5E9; color: #2E7D32; }
    .badge-dropped { background: #FAFAFA; color: #999; }
    .badge-active { background: #E8F5E9; color: #2E7D32; }
    .badge-escalation { background: #FFEBEE; color: #C62828; }

    .empty-state { text-align: center; padding: 32px; color: var(--mid-grey); font-size: 14px; }
    .refresh-btn {
      background: var(--sand); border: none; padding: 8px 16px;
      font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px;
      float: right; margin-top: -36px;
    }
    .refresh-btn:hover { background: var(--gold); color: white; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>Admin Login</h1>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="login()">Sign In</button>
      <p id="loginError" style="color:var(--red);font-size:12px;margin-top:12px;text-align:center;display:none;"></p>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>FitnessByMaddy Ops</h1>
      <button onclick="logout()">Logout</button>
    </div>
    <div class="dash-content">
      <div class="stats-grid" id="statsGrid"></div>

      <div class="section-block">
        <h2>Recent Leads</h2>
        <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Program</th><th>Time</th></tr></thead>
          <tbody id="leadsTable"></tbody>
        </table>
      </div>

      <div class="section-block">
        <h2>Active Clients</h2>
        <table>
          <thead><tr><th>Name</th><th>Program</th><th>Started</th><th>Status</th></tr></thead>
          <tbody id="clientsTable"></tbody>
        </table>
      </div>

      <div class="section-block">
        <h2>Pending Check-Ins (This Week)</h2>
        <table>
          <thead><tr><th>Client</th><th>Program</th><th>Week</th><th>Status</th></tr></thead>
          <tbody id="checkinsTable"></tbody>
        </table>
      </div>

      <div class="section-block">
        <h2>Escalations</h2>
        <div id="escalationsContent"></div>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = '';
    var SUPABASE_ANON_KEY = '';
    var session = null;

    function getConfig() {
      SUPABASE_URL = localStorage.getItem('sbUrl') || prompt('Supabase URL:');
      SUPABASE_ANON_KEY = localStorage.getItem('sbKey') || prompt('Supabase Anon Key:');
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        localStorage.setItem('sbUrl', SUPABASE_URL);
        localStorage.setItem('sbKey', SUPABASE_ANON_KEY);
      }
    }

    function sbFetch(path, opts) {
      opts = opts || {};
      var headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + (session || SUPABASE_ANON_KEY),
        'Content-Type': 'application/json'
      };
      return fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({ headers: headers }, opts))
        .then(function(r) { return r.json(); });
    }

    function login() {
      getConfig();
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;

      fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.access_token) {
          session = data.access_token;
          localStorage.setItem('session', session);
          showDashboard();
        } else {
          document.getElementById('loginError').textContent = 'Invalid credentials';
          document.getElementById('loginError').style.display = 'block';
        }
      })
      .catch(function() {
        document.getElementById('loginError').textContent = 'Connection error';
        document.getElementById('loginError').style.display = 'block';
      });
    }

    function logout() {
      session = null;
      localStorage.removeItem('session');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    function loadDashboard() {
      Promise.all([
        sbFetch('leads?select=*&order=created_at.desc&limit=20'),
        sbFetch('clients?select=*&order=created_at.desc'),
        sbFetch('checkins?select=*&order=form_submitted_at.desc&limit=20'),
        sbFetch('programs?select=*&order=generated_at.desc&limit=10'),
        sbFetch('messages?select=*&template_name=eq.escalation_alert&order=sent_at.desc&limit=10')
      ]).then(function(results) {
        var leads = results[0] || [];
        var clients = results[1] || [];
        var checkins = results[2] || [];
        var programs = results[3] || [];
        var escalations = results[4] || [];

        renderStats(leads, clients, checkins, programs);
        renderLeads(leads);
        renderClients(clients);
        renderCheckins(clients, checkins);
        renderEscalations(escalations);
      });
    }

    function renderStats(leads, clients, checkins, programs) {
      var today = new Date().toISOString().split('T')[0];
      var thisWeekStart = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

      var leadsToday = leads.filter(function(l) { return l.created_at && l.created_at.startsWith(today); }).length;
      var leadsWeek = leads.filter(function(l) { return l.created_at >= thisWeekStart; }).length;
      var converted = leads.filter(function(l) { return l.status === 'converted'; }).length;
      var rate = leads.length ? Math.round((converted / leads.length) * 100) : 0;
      var activeClients = clients.filter(function(c) { return c.status === 'active'; }).length;
      var programsThisWeek = programs.filter(function(p) { return p.generated_at >= thisWeekStart; }).length;

      document.getElementById('statsGrid').innerHTML =
        '<div class="stat-card highlight"><div class="label">Leads Today</div><div class="value">' + leadsToday + '</div><div class="sub">' + leadsWeek + ' this week</div></div>' +
        '<div class="stat-card"><div class="label">Conversion Rate</div><div class="value">' + rate + '%</div><div class="sub">' + converted + ' of ' + leads.length + '</div></div>' +
        '<div class="stat-card highlight"><div class="label">Active Clients</div><div class="value">' + activeClients + '</div></div>' +
        '<div class="stat-card"><div class="label">Programs Generated</div><div class="value">' + programsThisWeek + '</div><div class="sub">this week</div></div>' +
        '<div class="stat-card"><div class="label">Check-Ins</div><div class="value">' + checkins.length + '</div><div class="sub">total submitted</div></div>';
    }

    function renderLeads(leads) {
      var html = '';
      leads.slice(0, 15).forEach(function(l) {
        var maskedPhone = l.phone ? l.phone.slice(0, 4) + '***' + l.phone.slice(-3) : '-';
        var badge = '<span class="badge badge-' + l.status + '">' + l.status + '</span>';
        var time = l.created_at ? new Date(l.created_at).toLocaleDateString() : '-';
        html += '<tr><td>' + (l.name || '-') + '</td><td>' + maskedPhone + '</td><td>' + badge + '</td><td>' + (l.program_interest || '-') + '</td><td>' + time + '</td></tr>';
      });
      document.getElementById('leadsTable').innerHTML = html || '<tr><td colspan="5" class="empty-state">No leads yet</td></tr>';
    }

    function renderClients(clients) {
      var html = '';
      clients.forEach(function(c) {
        var badge = '<span class="badge badge-' + c.status + '">' + c.status + '</span>';
        var started = c.program_started_at ? new Date(c.program_started_at).toLocaleDateString() : '-';
        html += '<tr><td>' + (c.name || '-') + '</td><td>' + (c.program || '-') + '</td><td>' + started + '</td><td>' + badge + '</td></tr>';
      });
      document.getElementById('clientsTable').innerHTML = html || '<tr><td colspan="4" class="empty-state">No clients yet</td></tr>';
    }

    function renderCheckins(clients, checkins) {
      var html = '';
      var activeClients = clients.filter(function(c) { return c.status === 'active'; });
      activeClients.forEach(function(c) {
        var startDate = new Date(c.program_started_at);
        var weekNo = Math.ceil((Date.now() - startDate) / (7 * 24 * 60 * 60 * 1000));
        var hasCheckin = checkins.some(function(ci) { return ci.client_id === c.id && ci.week_no === weekNo; });
        var status = hasCheckin ? '<span class="badge badge-active">Submitted</span>' : '<span class="badge badge-new">Pending</span>';
        html += '<tr><td>' + (c.name || '-') + '</td><td>' + (c.program || '-') + '</td><td>Week ' + weekNo + '</td><td>' + status + '</td></tr>';
      });
      document.getElementById('checkinsTable').innerHTML = html || '<tr><td colspan="4" class="empty-state">No pending check-ins</td></tr>';
    }

    function renderEscalations(escalations) {
      if (!escalations.length) {
        document.getElementById('escalationsContent').innerHTML = '<div class="empty-state">No escalations</div>';
        return;
      }
      var html = '<table><thead><tr><th>Time</th><th>Message</th></tr></thead><tbody>';
      escalations.forEach(function(e) {
        var time = e.sent_at ? new Date(e.sent_at).toLocaleString() : '-';
        html += '<tr><td>' + time + '</td><td><span class="badge badge-escalation">' + (e.body || '').slice(0, 100) + '</span></td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('escalationsContent').innerHTML = html;
    }

    // Auto-login if session exists
    (function() {
      var saved = localStorage.getItem('session');
      var url = localStorage.getItem('sbUrl');
      var key = localStorage.getItem('sbKey');
      if (saved && url && key) {
        session = saved;
        SUPABASE_URL = url;
        SUPABASE_ANON_KEY = key;
        showDashboard();
      }
    })();
  </script>
</body>
</html>
