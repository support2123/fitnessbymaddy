<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --darker: #111111;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --white: #ffffff;
      --grey: #2a2a2a;
      --light-text: #aaaaaa;
      --green: #4CAF50;
      --red: #e74c3c;
      --blue: #3498db;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--darker);
      color: var(--white);
      min-height: 100vh;
    }
    .header {
      background: var(--black);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a2a;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 3px;
    }
    .header .date { color: var(--light-text); font-size: 13px; }
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: var(--black);
      padding: 48px 36px;
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 28px;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: var(--grey);
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      color: var(--white);
      font-size: 15px;
      margin-bottom: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .dashboard { display: none; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .card {
      background: var(--black);
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #2a2a2a;
    }
    .card-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--light-text);
      margin-bottom: 8px;
    }
    .card-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
    }
    .card-sub { font-size: 12px; color: var(--light-text); margin-top: 4px; }
    .section {
      padding: 0 32px 24px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-top: 16px;
      border-top: 1px solid #2a2a2a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--black);
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--light-text);
      background: var(--grey);
    }
    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #2a2a2a;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-new { background: rgba(52,152,219,0.2); color: var(--blue); }
    .badge-qualified { background: rgba(184,150,90,0.2); color: var(--gold); }
    .badge-converted { background: rgba(76,175,80,0.2); color: var(--green); }
    .badge-dropped { background: rgba(231,76,60,0.2); color: var(--red); }
    .badge-active { background: rgba(76,175,80,0.2); color: var(--green); }
    .escalation-item {
      background: var(--black);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .escalation-item .reason { color: var(--red); font-weight: 600; font-size: 14px; }
    .escalation-item .detail { color: var(--light-text); font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>ADMIN LOGIN</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="doLogin()">ENTER DASHBOARD</button>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>FITNESS BY MADDY — OPS</h1>
      <div class="date" id="todayDate"></div>
    </div>

    <div class="grid" id="statsGrid"></div>

    <div class="section">
      <div class="section-title">ESCALATIONS AWAITING REVIEW</div>
      <div id="escalations"></div>
    </div>

    <div class="section">
      <div class="section-title">RECENT LEADS</div>
      <table>
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Status</th><th>Program</th><th>When</th></tr>
        </thead>
        <tbody id="leadsTable"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title">ACTIVE CLIENTS</div>
      <table>
        <thead>
          <tr><th>Name</th><th>Program</th><th>Week</th><th>Status</th><th>Started</th></tr>
        </thead>
        <tbody id="clientsTable"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabase;

    async function doLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      supabase = window.supabase.createClient(
        window.__SUPABASE_URL || 'https://placeholder.supabase.co',
        window.__SUPABASE_ANON_KEY || 'placeholder'
      );

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Login failed: ' + error.message);
        return;
      }

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    async function loadDashboard() {
      document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

      const [leads, clients, checkins, programs] = await Promise.all([
        supabase.from('leads').select('*').order('created_at', { ascending: false }).limit(50),
        supabase.from('clients').select('*').order('program_started_at', { ascending: false }),
        supabase.from('checkins').select('*').gte('form_submitted_at', weekAgo.toISOString()),
        supabase.from('programs').select('*').gte('generated_at', weekAgo.toISOString())
      ]);

      const allLeads = leads.data || [];
      const allClients = clients.data || [];
      const todayLeads = allLeads.filter(l => new Date(l.created_at) >= today);
      const weekLeads = allLeads.filter(l => new Date(l.created_at) >= weekAgo);
      const activeClients = allClients.filter(c => c.status === 'active');
      const converted = allLeads.filter(l => l.status === 'converted').length;
      const convRate = allLeads.length > 0 ? ((converted / allLeads.length) * 100).toFixed(1) : 0;

      const pendingCheckins = activeClients.length - (checkins.data || []).length;

      document.getElementById('statsGrid').innerHTML = `
        <div class="card"><div class="card-label">Leads Today</div><div class="card-value">${todayLeads.length}</div><div class="card-sub">${weekLeads.length} this week</div></div>
        <div class="card"><div class="card-label">Conversion Rate</div><div class="card-value">${convRate}%</div><div class="card-sub">${converted} of ${allLeads.length} leads</div></div>
        <div class="card"><div class="card-label">Active Clients</div><div class="card-value">${activeClients.length}</div><div class="card-sub">across all programs</div></div>
        <div class="card"><div class="card-label">Pending Check-ins</div><div class="card-value">${Math.max(0, pendingCheckins)}</div><div class="card-sub">this week</div></div>
        <div class="card"><div class="card-label">Programs Generated</div><div class="card-value">${(programs.data || []).length}</div><div class="card-sub">this week</div></div>
      `;

      const leadsHtml = allLeads.slice(0, 20).map(l => `
        <tr>
          <td>${l.name || '—'}</td>
          <td>${maskPhone(l.phone)}</td>
          <td><span class="badge badge-${l.status}">${l.status}</span></td>
          <td>${l.program_interest || '—'}</td>
          <td>${timeAgo(l.created_at)}</td>
        </tr>
      `).join('');
      document.getElementById('leadsTable').innerHTML = leadsHtml || '<tr><td colspan="5">No leads yet</td></tr>';

      const clientsHtml = activeClients.map(c => {
        const week = Math.ceil((Date.now() - new Date(c.program_started_at)) / (7*24*60*60*1000));
        return `
          <tr>
            <td>${c.name || '—'}</td>
            <td>${c.program}</td>
            <td>Week ${week}</td>
            <td><span class="badge badge-active">${c.status}</span></td>
            <td>${new Date(c.program_started_at).toLocaleDateString('en-IN')}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('clientsTable').innerHTML = clientsHtml || '<tr><td colspan="5">No active clients</td></tr>';

      document.getElementById('escalations').innerHTML = '<p style="color:#aaa;font-size:13px;">No pending escalations</p>';
    }

    function maskPhone(p) {
      if (!p || p.length < 6) return '***';
      return p.slice(0, 4) + '••••' + p.slice(-3);
    }

    function timeAgo(date) {
      const diff = Date.now() - new Date(date).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }
  </script>
</body>
</html>
