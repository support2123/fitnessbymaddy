<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .topbar {
      background: var(--charcoal); color: white; padding: 20px 40px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .topbar h1 span { color: var(--gold); }
    .topbar .refresh-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white;
      padding: 8px 20px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s; font-family: 'DM Sans', sans-serif;
    }
    .topbar .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    .dashboard { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--light-grey);
    }
    .stat-card.gold::before { background: var(--gold); }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .panel {
      background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .panel-header {
      padding: 20px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--charcoal); }
    .panel-body { padding: 0; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--cream); padding: 12px 16px; text-align: left;
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey);
    }
    tbody td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--light-grey); }
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .status-new { background: #e8f4fd; color: #1a73e8; }
    .status-qualified { background: #fef3e2; color: #e67e22; }
    .status-converted { background: #e8f8e8; color: #27ae60; }
    .status-dropped { background: #fde8e8; color: #c0392b; }

    .program-bars { padding: 20px 24px; }
    .program-bar { margin-bottom: 16px; }
    .program-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--mid-grey); margin-bottom: 6px; }
    .program-bar-track { height: 8px; background: var(--light-grey); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.6s ease; }

    .escalation-list { padding: 16px 24px; }
    .escalation-item { padding: 12px 0; border-bottom: 1px solid var(--light-grey); }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-phone { font-size: 12px; font-weight: 600; color: var(--charcoal); }
    .escalation-text { font-size: 12px; color: var(--mid-grey); margin-top: 4px; line-height: 1.5; }
    .escalation-time { font-size: 10px; color: var(--gold); margin-top: 4px; letter-spacing: 0.5px; }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); font-size: 14px; }
    .empty { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .dashboard { padding: 24px 16px; }
      .topbar { padding: 16px 20px; }
    }
    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Fitness by <span>Maddy</span> &middot; Dashboard</h1>
  <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
</div>

<div class="dashboard">
  <div class="loading" id="loading">Loading dashboard...</div>

  <div id="dashboardContent" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Recent Leads</span>
        </div>
        <div class="panel-body">
          <table>
            <thead>
              <tr>
                <th>Phone</th>
                <th>Name</th>
                <th>Interest</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="leadsTable"></tbody>
          </table>
        </div>
      </div>

      <div>
        <div class="panel" style="margin-bottom:24px">
          <div class="panel-header">
            <span class="panel-title">Clients by Program</span>
          </div>
          <div class="program-bars" id="programBars"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Escalations</span>
          </div>
          <div class="escalation-list" id="escalationList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var PROGRAM_LABELS = {
  '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
  'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
};

function loadDashboard() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboardContent').style.display = 'none';

  fetch('/api/admin-stats')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderStats(data);
      renderLeads(data.recent_leads);
      renderPrograms(data.clients_by_program, data.active_clients);
      renderEscalations(data.escalations);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
    })
    .catch(function(err) {
      document.getElementById('loading').textContent = 'Failed to load dashboard. Check API connection.';
    });
}

function renderStats(data) {
  var grid = document.getElementById('statsGrid');
  grid.innerHTML = [
    statCard('Leads Today', data.leads.today, 'today', true),
    statCard('Leads This Week', data.leads.week, 'this week'),
    statCard('Conversion Rate', data.conversion_rate + '%', 'lead to paid', true),
    statCard('Active Clients', data.active_clients, 'total'),
    statCard('Pending Check-ins', data.pending_checkins, 'awaiting', true),
    statCard('Programs Generated', data.programs_this_week, 'this week'),
  ].join('');
}

function statCard(label, value, sub, gold) {
  return '<div class="stat-card' + (gold ? ' gold' : '') + '">' +
    '<div class="stat-label">' + label + '</div>' +
    '<div class="stat-num">' + value + '</div>' +
    '<div class="stat-sub">' + sub + '</div>' +
  '</div>';
}

function renderLeads(leads) {
  var tbody = document.getElementById('leadsTable');
  if (!leads || leads.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No leads yet</td></tr>';
    return;
  }
  tbody.innerHTML = leads.map(function(l) {
    var d = new Date(l.created_at);
    var dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    return '<tr>' +
      '<td style="font-family:monospace;font-size:12px">' + l.phone + '</td>' +
      '<td>' + (l.name || '—') + '</td>' +
      '<td>' + (PROGRAM_LABELS[l.program_interest] || l.program_interest || '—') + '</td>' +
      '<td><span class="status-badge status-' + l.status + '">' + l.status + '</span></td>' +
      '<td style="font-size:12px;color:var(--mid-grey)">' + dateStr + '</td>' +
    '</tr>';
  }).join('');
}

function renderPrograms(programs, total) {
  var container = document.getElementById('programBars');
  if (!programs || Object.keys(programs).length === 0) {
    container.innerHTML = '<div class="empty">No active clients</div>';
    return;
  }
  var max = Math.max.apply(null, Object.values(programs));
  container.innerHTML = Object.entries(programs).map(function(entry) {
    var pct = max > 0 ? (entry[1] / max * 100) : 0;
    return '<div class="program-bar">' +
      '<div class="program-bar-label"><span>' + (PROGRAM_LABELS[entry[0]] || entry[0]) + '</span><span>' + entry[1] + '</span></div>' +
      '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');
}

function renderEscalations(escalations) {
  var container = document.getElementById('escalationList');
  if (!escalations || escalations.length === 0) {
    container.innerHTML = '<div class="empty">No escalations</div>';
    return;
  }
  container.innerHTML = escalations.map(function(e) {
    var d = new Date(e.sent_at);
    var timeStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    return '<div class="escalation-item">' +
      '<div class="escalation-phone">' + e.phone + '</div>' +
      '<div class="escalation-text">' + (e.body || '—') + '</div>' +
      '<div class="escalation-time">' + timeStr + '</div>' +
    '</div>';
  }).join('');
}

loadDashboard();
</script>

</body>
</html>
