<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --bg: #0a0a0a; --card: #141414; --border: #222; --gold: #B8965A; --gold-light: #D4AF7A; --text: #e0e0e0; --text-dim: #888; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--card); border: 1px solid var(--border); padding: 48px 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; }
    .login-box p { font-size: 14px; color: var(--text-dim); margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; border-radius: 4px; margin-bottom: 16px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #000; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; border: none; cursor: pointer; border-radius: 4px; transition: opacity 0.2s; }
    .login-btn:hover { opacity: 0.9; }
    .login-error { color: #ef5350; font-size: 13px; margin-top: 12px; display: none; }
    .dashboard { display: none; }
    .dash-header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .dash-brand { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 3px; }
    .dash-logout { font-size: 12px; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--border); padding: 8px 16px; border-radius: 4px; background: none; transition: border-color 0.2s; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dash-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: white; letter-spacing: 1px; margin-bottom: 8px; }
    .dash-subtitle { font-size: 14px; color: var(--text-dim); margin-bottom: 32px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .stat-card-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card-value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .section-header { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: white; letter-spacing: 1px; margin: 40px 0 16px; padding-top: 24px; border-top: 1px solid var(--border); }
    .program-bars { display: flex; flex-direction: column; gap: 8px; }
    .program-bar { display: flex; align-items: center; gap: 16px; }
    .program-bar-name { font-size: 13px; color: var(--text-dim); min-width: 200px; }
    .program-bar-track { flex: 1; height: 28px; background: var(--bg); border-radius: 4px; overflow: hidden; position: relative; }
    .program-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 4px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 600; color: #000; min-width: 32px; }
    .escalation-list { display: flex; flex-direction: column; gap: 12px; }
    .escalation-item { background: var(--card); border: 1px solid var(--border); border-left: 3px solid #ef5350; border-radius: 4px; padding: 16px; }
    .escalation-item .esc-phone { font-size: 12px; color: var(--gold); letter-spacing: 1px; margin-bottom: 4px; }
    .escalation-item .esc-body { font-size: 14px; color: var(--text); line-height: 1.5; }
    .escalation-item .esc-time { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
    .empty-state { color: var(--text-dim); font-size: 14px; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; text-align: center; }
    .loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 14px; }
    @media (max-width: 640px) { .dash-body { padding: 20px 16px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .program-bar-name { min-width: 120px; font-size: 11px; } }
  </style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard</p>
    <input class="login-input" type="password" id="api-key" placeholder="Enter API key">
    <button class="login-btn" id="login-btn">Access Dashboard</button>
    <div class="login-error" id="login-error">Invalid API key. Please try again.</div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-brand">Fitness by Maddy — Admin</div>
    <button class="dash-logout" id="logout-btn">Logout</button>
  </div>

  <div class="dash-body">
    <div class="dash-title">Operations Dashboard</div>
    <div class="dash-subtitle" id="dash-date"></div>

    <div class="loading" id="loading">Loading dashboard data...</div>

    <div id="dash-content" style="display:none">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-label">Leads Today</div>
          <div class="stat-card-value" id="stat-leads-today">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Leads This Week</div>
          <div class="stat-card-value" id="stat-leads-week">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Conversion Rate</div>
          <div class="stat-card-value" id="stat-conversion">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Active Clients</div>
          <div class="stat-card-value" id="stat-active">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Pending Check-Ins</div>
          <div class="stat-card-value" id="stat-checkins">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Programs This Week</div>
          <div class="stat-card-value" id="stat-programs">—</div>
        </div>
      </div>

      <div class="section-header">Active Clients by Program</div>
      <div class="program-bars" id="program-bars"></div>

      <div class="section-header">Recent Escalations</div>
      <div class="escalation-list" id="escalation-list"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var apiKey = localStorage.getItem('fbm_admin_key');

  if (apiKey) {
    showDashboard(apiKey);
  }

  document.getElementById('login-btn').addEventListener('click', function() {
    var key = document.getElementById('api-key').value.trim();
    if (!key) return;
    localStorage.setItem('fbm_admin_key', key);
    showDashboard(key);
  });

  document.getElementById('api-key').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', function() {
    localStorage.removeItem('fbm_admin_key');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  });

  function showDashboard(key) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('dash-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    loadData(key);
  }

  function loadData(key) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('dash-content').style.display = 'none';

    fetch('/api/admin/dashboard', {
      headers: { 'Authorization': 'Bearer ' + key },
    })
    .then(function(res) {
      if (res.status === 401) {
        localStorage.removeItem('fbm_admin_key');
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-error').style.display = 'block';
        throw new Error('Unauthorized');
      }
      return res.json();
    })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dash-content').style.display = 'block';

      document.getElementById('stat-leads-today').textContent = data.leads_today;
      document.getElementById('stat-leads-week').textContent = data.leads_this_week;
      document.getElementById('stat-conversion').textContent = data.conversion_rate;
      document.getElementById('stat-active').textContent = data.active_clients;
      document.getElementById('stat-checkins').textContent = data.pending_checkins;
      document.getElementById('stat-programs').textContent = data.programs_generated_this_week;

      renderProgramBars(data.clients_by_program, data.active_clients);
      renderEscalations(data.recent_escalations);
    })
    .catch(function(err) {
      if (err.message !== 'Unauthorized') {
        document.getElementById('loading').textContent = 'Failed to load data. Please refresh.';
      }
    });
  }

  var PROGRAM_LABELS = {
    '6wk_gym': '6 Week Burn & Build (Gym)',
    '6wk_home': '6 Week Burn & Build (Home)',
    '12wk': '12-Week Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
  };

  function renderProgramBars(programs, total) {
    var container = document.getElementById('program-bars');
    container.innerHTML = '';
    if (!programs || Object.keys(programs).length === 0) {
      container.innerHTML = '<div class="empty-state">No active clients yet</div>';
      return;
    }
    var max = Math.max.apply(null, Object.values(programs));
    Object.keys(programs).forEach(function(key) {
      var count = programs[key];
      var pct = max > 0 ? (count / max) * 100 : 0;
      var row = document.createElement('div');
      row.className = 'program-bar';
      row.innerHTML =
        '<div class="program-bar-name">' + (PROGRAM_LABELS[key] || key) + '</div>' +
        '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + Math.max(pct, 10) + '%">' + count + '</div></div>';
      container.appendChild(row);
    });
  }

  function renderEscalations(escalations) {
    var container = document.getElementById('escalation-list');
    container.innerHTML = '';
    if (!escalations || escalations.length === 0) {
      container.innerHTML = '<div class="empty-state">No recent escalations</div>';
      return;
    }
    escalations.forEach(function(esc) {
      var item = document.createElement('div');
      item.className = 'escalation-item';
      item.innerHTML =
        '<div class="esc-phone">' + esc.phone + '</div>' +
        '<div class="esc-body">' + (esc.body || 'No details') + '</div>' +
        '<div class="esc-time">' + new Date(esc.sent_at).toLocaleString('en-IN') + '</div>';
      container.appendChild(item);
    });
  }
})();
</script>
</body>
</html>
