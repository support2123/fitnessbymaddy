<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }
    .dash-nav {
      background: var(--charcoal); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 18px;
      font-weight: 600; color: var(--gold-light); letter-spacing: 2px;
      text-transform: uppercase;
    }
    .dash-nav-right { display: flex; gap: 16px; align-items: center; }
    .dash-nav-right span { font-size: 12px; color: rgba(255,255,255,0.5); }
    .dash-refresh {
      padding: 8px 16px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 1px; cursor: pointer;
      border-radius: 2px; font-family: 'DM Sans', sans-serif; text-transform: uppercase;
    }
    .dash-refresh:hover { border-color: var(--gold); color: var(--gold); }
    .dash-container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .dash-header { margin-bottom: 32px; }
    .dash-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px;
      font-weight: 300; margin-bottom: 8px;
    }
    .dash-header h1 em { font-style: italic; color: var(--gold); }
    .dash-header p { font-size: 13px; color: var(--mid-grey); }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif; font-size: 36px;
      font-weight: 600; color: var(--charcoal); line-height: 1;
    }
    .stat-card-sub { font-size: 11px; color: var(--gold); margin-top: 4px; }
    .dash-section { margin-bottom: 32px; }
    .dash-section-title {
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 16px;
    }
    .program-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: white; border-radius: 4px;
      margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .program-bar-name { font-size: 13px; font-weight: 500; min-width: 140px; }
    .program-bar-fill {
      flex: 1; height: 8px; background: var(--light-grey); border-radius: 4px;
      overflow: hidden;
    }
    .program-bar-fill div { height: 100%; background: var(--gold); border-radius: 4px; }
    .program-bar-count { font-size: 13px; font-weight: 600; min-width: 30px; text-align: right; }
    .escalation-list { list-style: none; }
    .escalation-item {
      padding: 16px; background: white; border-radius: 4px;
      margin-bottom: 8px; border-left: 3px solid #e74c3c;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .escalation-item p { font-size: 13px; color: var(--charcoal); margin-bottom: 4px; }
    .escalation-item small { font-size: 11px; color: var(--mid-grey); }
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--cream);
    }
    .auth-card {
      background: white; padding: 48px 40px; border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08); text-align: center;
      max-width: 400px; width: 100%;
    }
    .auth-card h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      margin-bottom: 24px;
    }
    .auth-card input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px; outline: none; text-align: center;
      letter-spacing: 4px;
    }
    .auth-card input:focus { border-color: var(--gold); }
    .auth-card button {
      width: 100%; padding: 14px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
    }
    .auth-card button:hover { background: var(--gold); }
    .loading { text-align: center; padding: 60px; color: var(--mid-grey); font-size: 14px; }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .dash-container { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h2>Admin Access</h2>
    <p style="font-size:13px;color:var(--mid-grey);margin-bottom:24px">Enter your admin key to access the dashboard.</p>
    <input type="password" id="apiKey" placeholder="API Key" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">ACCESS DASHBOARD</button>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="dash-nav">
    <div class="dash-logo">Fitness by Maddy</div>
    <div class="dash-nav-right">
      <span id="lastUpdated"></span>
      <button class="dash-refresh" onclick="loadDashboard()">Refresh</button>
    </div>
  </div>

  <div class="dash-container">
    <div class="dash-header">
      <h1>Operations <em>Dashboard</em></h1>
      <p>Real-time overview of leads, clients, and coaching pipeline.</p>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="loading">Loading data...</div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title">Active Clients by Program</div>
      <div id="programBars"><div class="loading">Loading...</div></div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title">Recent Escalations</div>
      <ul class="escalation-list" id="escalationList">
        <li class="loading">Loading...</li>
      </ul>
    </div>
  </div>
</div>

<script>
var token = '';

function login() {
  token = document.getElementById('apiKey').value;
  if (!token) return;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

var PROGRAM_LABELS = {
  '6wk_gym': '6-Week Burn & Build',
  '6wk_home': '6-Week Home',
  '12wk': '12-Week Flagship',
  pcos: 'PCOS Warrior',
  '40plus': '40+ Strong',
  zoom_trial: 'Zoom Trial',
  zoom_pack: 'Zoom Pack'
};

async function loadDashboard() {
  try {
    var res = await fetch('/api/admin/dashboard', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 401) {
      alert('Invalid API key');
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      return;
    }
    var data = await res.json();
    renderStats(data);
    renderPrograms(data.clients_by_program, data.active_clients);
    renderEscalations(data.recent_escalations);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('statsGrid').innerHTML = '<div class="loading">Failed to load. Check your connection.</div>';
  }
}

function renderStats(d) {
  var cards = [
    { label: 'Leads Today', value: d.leads_today, sub: '' },
    { label: 'Leads This Week', value: d.leads_this_week, sub: '' },
    { label: 'Total Leads', value: d.total_leads, sub: '' },
    { label: 'Conversion Rate', value: d.conversion_rate, sub: d.converted_leads + ' converted' },
    { label: 'Active Clients', value: d.active_clients, sub: '' },
    { label: 'Programs This Week', value: d.programs_generated_this_week, sub: '' }
  ];
  var html = '';
  cards.forEach(function(c) {
    html += '<div class="stat-card">' +
      '<div class="stat-card-label">' + c.label + '</div>' +
      '<div class="stat-card-value">' + c.value + '</div>' +
      (c.sub ? '<div class="stat-card-sub">' + c.sub + '</div>' : '') +
      '</div>';
  });
  document.getElementById('statsGrid').innerHTML = html;
}

function renderPrograms(byProgram, total) {
  if (!byProgram || !total) {
    document.getElementById('programBars').innerHTML = '<div class="loading">No active clients yet.</div>';
    return;
  }
  var html = '';
  var max = Math.max.apply(null, Object.values(byProgram).concat([1]));
  Object.keys(byProgram).forEach(function(key) {
    var count = byProgram[key];
    var pct = Math.round((count / max) * 100);
    html += '<div class="program-bar">' +
      '<span class="program-bar-name">' + (PROGRAM_LABELS[key] || key) + '</span>' +
      '<div class="program-bar-fill"><div style="width:' + pct + '%"></div></div>' +
      '<span class="program-bar-count">' + count + '</span></div>';
  });
  document.getElementById('programBars').innerHTML = html;
}

function renderEscalations(list) {
  if (!list || list.length === 0) {
    document.getElementById('escalationList').innerHTML = '<li class="loading">No escalations. All clear.</li>';
    return;
  }
  var html = '';
  list.forEach(function(e) {
    html += '<li class="escalation-item">' +
      '<p>' + (e.body || 'No details') + '</p>' +
      '<small>' + new Date(e.sent_at).toLocaleString() + '</small></li>';
  });
  document.getElementById('escalationList').innerHTML = html;
}
</script>
</body>
</html>
