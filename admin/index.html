<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: white; padding: 48px 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
    .login-box h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 8px; }
    .login-box p { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-box input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none; background: var(--cream); }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; }
    .login-box button:hover { background: var(--gold); }
    .login-error { color: #c00; font-size: 12px; margin-bottom: 12px; display: none; }

    .dashboard { display: none; }
    .dash-nav { background: var(--charcoal); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .dash-nav h1 { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: white; letter-spacing: 2px; text-transform: uppercase; }
    .dash-nav button { background: none; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; }
    .dash-nav button:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px 40px; max-width: 1200px; margin: 0 auto; }
    .dash-date { font-size: 12px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 24px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card .label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card .sub { font-size: 11px; color: var(--gold); margin-top: 4px; }

    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; margin-bottom: 16px; }
    .section-title em { font-style: italic; color: var(--gold); }

    .programs-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 40px; }
    .prog-item { background: white; padding: 16px; border-radius: 4px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .prog-item .prog-name { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 4px; }
    .prog-item .prog-count { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; }

    .escalations-list { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .esc-item { padding: 16px 20px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .esc-item:last-child { border-bottom: none; }
    .esc-reason { font-size: 13px; font-weight: 500; color: var(--charcoal); }
    .esc-detail { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .esc-time { font-size: 11px; color: var(--mid-grey); white-space: nowrap; }
    .esc-empty { padding: 40px; text-align: center; color: var(--mid-grey); font-size: 13px; }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 600px) {
      .dash-content { padding: 24px 16px; }
      .dash-nav { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard</p>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <div class="dash-nav">
    <h1>Fitness by Maddy</h1>
    <button id="logoutBtn">Log Out</button>
  </div>

  <div class="dash-content">
    <div class="dash-date" id="dashDate"></div>

    <div id="statsGrid" class="stats-grid">
      <div class="loading">Loading dashboard...</div>
    </div>

    <h2 class="section-title">Active Clients by <em>Program</em></h2>
    <div id="programsBreakdown" class="programs-breakdown"></div>

    <h2 class="section-title">Open <em>Escalations</em></h2>
    <div id="escalationsList" class="escalations-list">
      <div class="loading">Loading...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  var SUPABASE_URL = 'SUPABASE_URL_PLACEHOLDER';
  var SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY_PLACEHOLDER';

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var session = null;

  var loginScreen = document.getElementById('loginScreen');
  var dashboard = document.getElementById('dashboard');

  supabase.auth.getSession().then(function(result) {
    if (result.data.session) {
      session = result.data.session;
      showDashboard();
    }
  });

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    supabase.auth.signInWithPassword({ email: email, password: password })
      .then(function(result) {
        if (result.error) throw result.error;
        session = result.data.session;
        showDashboard();
      })
      .catch(function(err) {
        errorEl.textContent = err.message || 'Login failed';
        errorEl.style.display = 'block';
      });
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    supabase.auth.signOut().then(function() {
      session = null;
      dashboard.style.display = 'none';
      loginScreen.style.display = 'flex';
    });
  });

  function showDashboard() {
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';

    var now = new Date();
    document.getElementById('dashDate').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    loadStats();
  }

  function loadStats() {
    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderStats(data);
      renderPrograms(data.clients_by_program);
      renderEscalations(data.escalations);
    })
    .catch(function(err) {
      document.getElementById('statsGrid').innerHTML =
        '<div class="loading">Failed to load dashboard. Please try again.</div>';
    });
  }

  function renderStats(data) {
    var html = '';
    var cards = [
      { label: 'Leads Today', value: data.leads_today },
      { label: 'Leads This Week', value: data.leads_this_week },
      { label: 'Conversion Rate', value: data.conversion_rate + '%', sub: data.converted_leads + ' of ' + data.total_leads + ' leads' },
      { label: 'Active Clients', value: data.active_clients },
      { label: 'Pending Check-Ins', value: data.pending_checkins },
      { label: 'Programs Generated', value: data.programs_generated_this_week, sub: 'this week' },
    ];

    cards.forEach(function(card) {
      html += '<div class="stat-card"><div class="label">' + card.label + '</div><div class="value">' + card.value + '</div>';
      if (card.sub) html += '<div class="sub">' + card.sub + '</div>';
      html += '</div>';
    });

    document.getElementById('statsGrid').innerHTML = html;
  }

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Wk Gym', '6wk_home': '6-Wk Home', '12wk': '12-Week',
    'pcos': 'PCOS', '40plus': '40+', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
  };

  function renderPrograms(programData) {
    var container = document.getElementById('programsBreakdown');
    if (!programData || Object.keys(programData).length === 0) {
      container.innerHTML = '<div class="prog-item"><div class="prog-name">No active clients</div><div class="prog-count">0</div></div>';
      return;
    }
    var html = '';
    Object.keys(programData).forEach(function(key) {
      html += '<div class="prog-item"><div class="prog-name">' + (PROGRAM_LABELS[key] || key) + '</div><div class="prog-count">' + programData[key] + '</div></div>';
    });
    container.innerHTML = html;
  }

  function renderEscalations(escalations) {
    var container = document.getElementById('escalationsList');
    if (!escalations || escalations.length === 0) {
      container.innerHTML = '<div class="esc-empty">No open escalations. All clear!</div>';
      return;
    }
    var html = '';
    escalations.forEach(function(esc) {
      var time = new Date(esc.created_at).toLocaleString();
      var maskedPhone = esc.phone ? esc.phone.slice(0, 4) + 'XXX...' + esc.phone.slice(-3) : '';
      html += '<div class="esc-item"><div><div class="esc-reason">' + esc.reason + '</div><div class="esc-detail">' + maskedPhone + ' — ' + (esc.message_body || '').slice(0, 80) + '</div></div><div class="esc-time">' + time + '</div></div>';
    });
    container.innerHTML = html;
  }
})();
</script>
</body>
</html>
