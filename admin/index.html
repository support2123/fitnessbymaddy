<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --red: #C0392B;
      --green: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* Auth */
    .auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-box {
      background: white;
      padding: 48px;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .auth-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .auth-sub {
      font-size: 12px;
      color: var(--mid-grey);
      letter-spacing: 1px;
      margin-bottom: 32px;
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      margin-bottom: 16px;
    }
    .auth-input:focus { border-color: var(--gold); }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .auth-btn:hover { background: var(--gold); }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: white;
    }
    .dash-refresh {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .dash-refresh:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stat cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card-sub {
      font-size: 12px;
      color: var(--gold);
      margin-top: 4px;
    }

    /* Sections */
    .dash-section {
      background: white;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .dash-section-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--light-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .dash-section-badge {
      font-size: 11px;
      background: var(--gold);
      color: white;
      padding: 3px 10px;
      border-radius: 10px;
      font-weight: 600;
    }
    .dash-table {
      width: 100%;
      border-collapse: collapse;
    }
    .dash-table th {
      text-align: left;
      padding: 12px 24px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      background: var(--cream);
      border-bottom: 1px solid var(--light-grey);
    }
    .dash-table td {
      padding: 14px 24px;
      font-size: 13px;
      border-bottom: 1px solid var(--light-grey);
    }
    .dash-table tr:last-child td { border-bottom: none; }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-active { background: #E8F5E9; color: var(--green); }
    .status-paused { background: #FFF3E0; color: #E67E22; }
    .status-alert { background: #FFEBEE; color: var(--red); }
    .program-counts {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 20px 24px;
    }
    .program-count-item {
      padding: 12px 20px;
      background: var(--cream);
      border-radius: 4px;
      text-align: center;
    }
    .program-count-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
    }
    .program-count-label {
      font-size: 11px;
      color: var(--mid-grey);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .empty-state {
      padding: 40px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--mid-grey);
    }
    .loading {
      text-align: center;
      padding: 60px;
      font-size: 13px;
      color: var(--mid-grey);
    }

    @media (max-width: 600px) {
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-table { font-size: 12px; }
      .dash-table th, .dash-table td { padding: 10px 12px; }
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- AUTH -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <div class="auth-logo">Fitness by Maddy</div>
      <div class="auth-sub">Admin Dashboard</div>
      <input type="password" class="auth-input" id="authKey" placeholder="Enter admin key">
      <button class="auth-btn" id="authBtn">Access Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <div class="dash-logo">Fitness by Maddy — Ops</div>
      <button class="dash-refresh" id="refreshBtn">Refresh</button>
    </div>

    <div class="dash-body">
      <div class="loading" id="loadingState">Loading dashboard...</div>

      <div id="dashContent" class="hidden">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Clients by program -->
        <div class="dash-section">
          <div class="dash-section-header">
            <div class="dash-section-title">Active Clients by Program</div>
          </div>
          <div class="program-counts" id="programCounts"></div>
        </div>

        <!-- Active clients -->
        <div class="dash-section">
          <div class="dash-section-header">
            <div class="dash-section-title">Active Clients</div>
            <div class="dash-section-badge" id="clientCount">0</div>
          </div>
          <div id="clientsTable"></div>
        </div>

        <!-- Escalations -->
        <div class="dash-section">
          <div class="dash-section-header">
            <div class="dash-section-title">Recent Escalations</div>
            <div class="dash-section-badge status-alert" id="escCount">0</div>
          </div>
          <div id="escalationsTable"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function() {
  var apiKey = '';

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Week Gym',
    '6wk_home': '6-Week Home',
    '12wk': '12-Week Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack'
  };

  document.getElementById('authBtn').addEventListener('click', function() {
    apiKey = document.getElementById('authKey').value;
    if (!apiKey) return;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  });

  document.getElementById('authKey').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('authBtn').click();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

  function loadDashboard() {
    document.getElementById('loadingState').classList.remove('hidden');
    document.getElementById('dashContent').classList.add('hidden');

    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + apiKey }
    })
    .then(function(r) {
      if (!r.ok) throw new Error('Unauthorized');
      return r.json();
    })
    .then(function(data) {
      renderStats(data);
      renderProgramCounts(data.clients_by_program);
      renderClients(data.active_clients);
      renderEscalations(data.escalations);
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('dashContent').classList.remove('hidden');
    })
    .catch(function(err) {
      document.getElementById('loadingState').textContent = 'Failed to load. Check your admin key.';
    });
  }

  function renderStats(data) {
    var grid = document.getElementById('statsGrid');
    grid.innerHTML = [
      statCard('Leads Today', data.leads.today, 'This week: ' + data.leads.week),
      statCard('Total Leads', data.leads.total, ''),
      statCard('Conversion Rate', data.conversion_rate + '%', 'Lead → Paid'),
      statCard('Active Clients', data.active_clients.length, ''),
      statCard('Pending Check-ins', data.pending_checkins, ''),
      statCard('Programs This Week', data.programs_this_week, 'Generated')
    ].join('');
  }

  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="stat-card-label">' + label + '</div><div class="stat-card-value">' + value + '</div>' + (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') + '</div>';
  }

  function renderProgramCounts(counts) {
    var el = document.getElementById('programCounts');
    if (!counts || Object.keys(counts).length === 0) {
      el.innerHTML = '<div class="empty-state">No active clients yet</div>';
      return;
    }
    el.innerHTML = Object.keys(counts).map(function(key) {
      return '<div class="program-count-item"><div class="program-count-num">' + counts[key] + '</div><div class="program-count-label">' + (PROGRAM_LABELS[key] || key) + '</div></div>';
    }).join('');
  }

  function renderClients(clients) {
    var el = document.getElementById('clientsTable');
    document.getElementById('clientCount').textContent = clients.length;
    if (!clients || clients.length === 0) {
      el.innerHTML = '<div class="empty-state">No active clients</div>';
      return;
    }
    var rows = clients.map(function(c) {
      var started = new Date(c.program_started_at).toLocaleDateString();
      return '<tr><td>' + (c.name || '—') + '</td><td>' + maskPhone(c.phone) + '</td><td>' + (PROGRAM_LABELS[c.program] || c.program) + '</td><td>' + started + '</td><td><span class="status-badge status-active">Active</span></td></tr>';
    }).join('');
    el.innerHTML = '<table class="dash-table"><thead><tr><th>Name</th><th>Phone</th><th>Program</th><th>Started</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderEscalations(escalations) {
    var el = document.getElementById('escalationsTable');
    document.getElementById('escCount').textContent = escalations.length;
    if (!escalations || escalations.length === 0) {
      el.innerHTML = '<div class="empty-state">No recent escalations</div>';
      return;
    }
    var rows = escalations.map(function(e) {
      var time = new Date(e.sent_at).toLocaleString();
      return '<tr><td>' + time + '</td><td>' + (e.body || '—') + '</td><td><span class="status-badge status-alert">Alert</span></td></tr>';
    }).join('');
    el.innerHTML = '<table class="dash-table"><thead><tr><th>Time</th><th>Details</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function maskPhone(phone) {
    if (!phone || phone.length < 6) return '***';
    return '+' + phone.substring(0, 2) + 'XXX...' + phone.slice(-3);
  }
})();
</script>
</body>
</html>
