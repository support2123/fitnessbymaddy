<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --text: #FAF8F4;
      --muted: #888;
      --success: #27AE60;
      --warning: #F39C12;
      --danger: #E74C3C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .admin-header {
      padding: 20px 32px;
      border-bottom: 1px solid rgba(184,150,90,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .admin-header .status {
      font-size: 12px;
      color: var(--success);
    }
    .dashboard {
      padding: 24px 32px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid rgba(184,150,90,0.15);
      border-radius: 8px;
      padding: 20px;
    }
    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
    }
    .stat-card .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      margin-bottom: 12px;
    }
    .table-wrap {
      background: var(--card);
      border: 1px solid rgba(184,150,90,0.15);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      background: rgba(184,150,90,0.08);
      color: var(--gold-light);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-new { background: rgba(52,152,219,0.2); color: #3498DB; }
    .badge-qualified { background: rgba(243,156,18,0.2); color: #F39C12; }
    .badge-converted { background: rgba(39,174,96,0.2); color: #27AE60; }
    .badge-dropped { background: rgba(231,76,60,0.2); color: #E74C3C; }
    .badge-active { background: rgba(39,174,96,0.2); color: #27AE60; }
    .escalation-item {
      background: var(--card);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 10px;
    }
    .escalation-item .reason {
      font-weight: 500;
      color: var(--danger);
      margin-bottom: 4px;
    }
    .escalation-item .detail {
      font-size: 12px;
      color: var(--muted);
    }
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      text-align: center;
      width: 300px;
    }
    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 28px;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      background: var(--card);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      cursor: pointer;
    }
    .loading { text-align: center; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="adminPassword" placeholder="Enter admin password">
      <button onclick="login()">Enter</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <header class="admin-header">
      <h1>FitnessByMaddy Ops</h1>
      <span class="status" id="lastUpdated">Loading...</span>
    </header>

    <div class="dashboard">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="label">New Leads Today</div><div class="value" id="leadsToday">—</div></div>
        <div class="stat-card"><div class="label">Leads This Week</div><div class="value" id="leadsWeek">—</div></div>
        <div class="stat-card"><div class="label">Conversion Rate</div><div class="value" id="convRate">—</div><div class="sub">lead → paid</div></div>
        <div class="stat-card"><div class="label">Active Clients</div><div class="value" id="activeClients">—</div></div>
        <div class="stat-card"><div class="label">Pending Check-ins</div><div class="value" id="pendingCheckins">—</div></div>
        <div class="stat-card"><div class="label">Programs This Week</div><div class="value" id="programsWeek">—</div></div>
      </div>

      <h3 class="section-title">Active Clients by Program</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Program</th><th>Count</th></tr></thead>
          <tbody id="programBreakdown"></tbody>
        </table>
      </div>

      <h3 class="section-title">Recent Leads</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Date</th></tr></thead>
          <tbody id="recentLeads"></tbody>
        </table>
      </div>

      <h3 class="section-title">Escalations Awaiting Review</h3>
      <div id="escalations"></div>
    </div>
  </div>

  <script>
    let token = '';

    function login() {
      token = document.getElementById('adminPassword').value;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadDashboard();
    }

    async function apiCall(endpoint) {
      const res = await fetch(endpoint, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
        return null;
      }
      return res.json();
    }

    async function loadDashboard() {
      const data = await apiCall('/api/admin/stats');
      if (!data) return;

      document.getElementById('leadsToday').textContent = data.leads_today || 0;
      document.getElementById('leadsWeek').textContent = data.leads_week || 0;
      document.getElementById('convRate').textContent = (data.conversion_rate || 0) + '%';
      document.getElementById('activeClients').textContent = data.active_clients || 0;
      document.getElementById('pendingCheckins').textContent = data.pending_checkins || 0;
      document.getElementById('programsWeek').textContent = data.programs_week || 0;

      const breakdown = document.getElementById('programBreakdown');
      breakdown.innerHTML = (data.program_breakdown || []).map(p =>
        `<tr><td>${p.program}</td><td>${p.count}</td></tr>`
      ).join('');

      const leads = document.getElementById('recentLeads');
      leads.innerHTML = (data.recent_leads || []).map(l =>
        `<tr><td>${l.name || '—'}</td><td>${l.phone_masked}</td><td><span class="badge badge-${l.status}">${l.status}</span></td><td>${l.program_interest || '—'}</td><td>${new Date(l.created_at).toLocaleDateString()}</td></tr>`
      ).join('');

      const esc = document.getElementById('escalations');
      if (data.escalations && data.escalations.length > 0) {
        esc.innerHTML = data.escalations.map(e =>
          `<div class="escalation-item"><div class="reason">${e.reason}</div><div class="detail">${e.detail} — ${new Date(e.created_at).toLocaleString()}</div></div>`
        ).join('');
      } else {
        esc.innerHTML = '<p style="color:var(--muted);font-size:13px">No escalations pending.</p>';
      }

      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    setInterval(loadDashboard, 60000);
  </script>
</body>
</html>
