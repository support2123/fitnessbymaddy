<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    /* Auth screen */
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .auth-card { background: white; padding: 48px 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); max-width: 400px; width: 100%; text-align: center; }
    .auth-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 8px; }
    .auth-card p { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .auth-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none; background: var(--cream); }
    .auth-input:focus { border-color: var(--gold); }
    .auth-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; }
    .auth-btn:hover { background: var(--gold); }
    .auth-error { color: #c0392b; font-size: 12px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header { background: var(--charcoal); padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; }
    .dash-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: white; letter-spacing: 2px; }
    .dash-logout { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); padding: 8px 16px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dash-title { padding: 40px 40px 0; }
    .dash-title h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; }
    .dash-title p { font-size: 13px; color: var(--mid-grey); margin-top: 4px; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 32px 40px; }
    .stat-card { background: white; padding: 28px 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.gold { border-left: 3px solid var(--gold); }
    .stat-card.alert { border-left: 3px solid #e74c3c; }

    /* Sections */
    .dash-section { padding: 0 40px 32px; }
    .dash-section h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 16px; color: var(--charcoal); }
    .program-bar { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--light-grey); }
    .program-bar-label { font-size: 13px; color: var(--mid-grey); min-width: 180px; }
    .program-bar-fill { height: 8px; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar-count { font-size: 13px; font-weight: 600; color: var(--charcoal); min-width: 30px; }
    .escalation-item { background: white; padding: 16px 20px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #e74c3c; box-shadow: 0 1px 8px rgba(0,0,0,0.04); }
    .escalation-item .esc-phone { font-size: 12px; color: var(--gold); font-weight: 600; }
    .escalation-item .esc-body { font-size: 13px; color: var(--mid-grey); margin-top: 4px; }
    .escalation-item .esc-time { font-size: 11px; color: var(--light-grey); margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }

    .loading { text-align: center; padding: 60px; font-size: 13px; color: var(--mid-grey); }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); padding: 24px 16px; }
      .dash-header { padding: 16px; }
      .dash-title { padding: 24px 16px 0; }
      .dash-section { padding: 0 16px 24px; }
    }
  </style>
</head>
<body>

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <h2>Maddy's Dashboard</h2>
    <p>Sign in with your admin credentials</p>
    <input class="auth-input" type="email" id="auth-email" placeholder="Email">
    <input class="auth-input" type="password" id="auth-password" placeholder="Password">
    <button class="auth-btn" onclick="login()">Sign In</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">FITNESS BY MADDY</div>
    <button class="dash-logout" onclick="logout()">Sign Out</button>
  </div>

  <div class="dash-title">
    <h1>Operations Dashboard</h1>
    <p id="dash-date"></p>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="loading">Loading dashboard...</div>
  </div>

  <div class="dash-section">
    <h3>Clients by Program</h3>
    <div id="program-breakdown"><div class="empty-state">Loading...</div></div>
  </div>

  <div class="dash-section">
    <h3>Recent Escalations</h3>
    <div id="escalations"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var session = null;

function initSupabase() {
  var meta = document.querySelector('meta[name="supabase-url"]');
  SUPABASE_URL = meta ? meta.content : (window.__SUPABASE_URL || '');
  var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
  SUPABASE_ANON_KEY = metaKey ? metaKey.content : (window.__SUPABASE_ANON_KEY || '');
}

async function login() {
  var email = document.getElementById('auth-email').value;
  var password = document.getElementById('auth-password').value;
  var errorEl = document.getElementById('auth-error');

  if (!email || !password) {
    errorEl.textContent = 'Please enter email and password';
    errorEl.style.display = 'block';
    return;
  }

  try {
    var resp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await resp.json();

    if (data.access_token) {
      session = data;
      localStorage.setItem('fbm_session', JSON.stringify(data));
      showDashboard();
    } else {
      errorEl.textContent = data.error_description || 'Invalid credentials';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Connection error. Please try again.';
    errorEl.style.display = 'block';
  }
}

function logout() {
  session = null;
  localStorage.removeItem('fbm_session');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('dash-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  loadStats();
}

async function loadStats() {
  try {
    var resp = await fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    });
    var data = await resp.json();

    if (data.error) {
      if (data.error === 'unauthorized') return logout();
      return;
    }

    var grid = document.getElementById('stats-grid');
    grid.innerHTML = '' +
      statCard('Leads Today', data.leads_today, '', 'gold') +
      statCard('Leads This Week', data.leads_this_week) +
      statCard('Conversion Rate', data.conversion_rate + '%', 'of ' + data.total_leads + ' total leads', 'gold') +
      statCard('Active Clients', data.active_clients, '', 'gold') +
      statCard('Pending Check-ins', data.pending_checkins, 'awaiting submission', data.pending_checkins > 0 ? 'alert' : '') +
      statCard('Programs Generated', data.programs_generated_this_week, 'this week');

    var programDiv = document.getElementById('program-breakdown');
    var programs = data.clients_by_program || {};
    var maxCount = Math.max(...Object.values(programs), 1);
    var programLabels = {
      '6wk_gym': '6-Week Burn (Gym)', '6wk_home': '6-Week Burn (Home)',
      '12wk': '12-Week Custom', 'pcos': 'PCOS Warrior',
      '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
    };

    if (Object.keys(programs).length === 0) {
      programDiv.innerHTML = '<div class="empty-state">No active clients yet</div>';
    } else {
      programDiv.innerHTML = Object.entries(programs).map(function(entry) {
        var pct = Math.round((entry[1] / maxCount) * 100);
        return '<div class="program-bar">' +
          '<div class="program-bar-label">' + (programLabels[entry[0]] || entry[0]) + '</div>' +
          '<div style="flex:1"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="program-bar-count">' + entry[1] + '</div></div>';
      }).join('');
    }

    var escDiv = document.getElementById('escalations');
    var escs = data.recent_escalations || [];
    if (escs.length === 0) {
      escDiv.innerHTML = '<div class="empty-state">No recent escalations</div>';
    } else {
      escDiv.innerHTML = escs.map(function(e) {
        return '<div class="escalation-item">' +
          '<div class="esc-phone">' + e.phone + '</div>' +
          '<div class="esc-body">' + e.body + '</div>' +
          '<div class="esc-time">' + new Date(e.sent_at).toLocaleString('en-IN') + '</div></div>';
      }).join('');
    }
  } catch (err) {
    console.error('Stats load error:', err);
  }
}

function statCard(label, value, sub, cls) {
  return '<div class="stat-card ' + (cls || '') + '">' +
    '<div class="stat-card-label">' + label + '</div>' +
    '<div class="stat-card-value">' + value + '</div>' +
    (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') + '</div>';
}

// Init
(function() {
  initSupabase();
  var saved = localStorage.getItem('fbm_session');
  if (saved) {
    try {
      session = JSON.parse(saved);
      var exp = session.expires_at ? session.expires_at * 1000 : 0;
      if (exp > Date.now()) {
        showDashboard();
        return;
      }
    } catch (e) {}
    localStorage.removeItem('fbm_session');
  }
})();
</script>
</body>
</html>
