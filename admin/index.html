<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    /* Login */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--charcoal) 0%, #1a1a1a 100%);
    }
    .login-box {
      background: white; padding: 48px; border-radius: 4px; width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-box h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400;
      margin-bottom: 8px; color: var(--charcoal);
    }
    .login-box p { font-size: 13px; color: var(--mid-grey); margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 12px; background: var(--cream); outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%; padding: 14px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; margin-top: 8px;
    }
    .login-box button:hover { background: var(--gold); }
    .login-error { color: #c62828; font-size: 12px; margin-top: 8px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-nav {
      background: var(--charcoal); padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-nav-brand {
      font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;
      color: var(--gold); letter-spacing: 2px; text-transform: uppercase;
    }
    .dash-nav-right { display: flex; align-items: center; gap: 16px; }
    .dash-nav-right span { font-size: 12px; color: rgba(255,255,255,0.5); }
    .dash-logout {
      font-size: 11px; color: rgba(255,255,255,0.6); background: none; border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 16px; cursor: pointer; border-radius: 2px; letter-spacing: 1px; text-transform: uppercase;
    }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dash-header { margin-bottom: 32px; }
    .dash-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300;
    }
    .dash-header h1 em { font-style: italic; color: var(--gold); }
    .dash-header p { font-size: 13px; color: var(--mid-grey); margin-top: 4px; }

    /* Stat Cards */
    .stat-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--light-grey);
    }
    .stat-card.highlight::before { background: var(--gold); }
    .stat-card-label {
      font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600;
      color: var(--charcoal); line-height: 1;
    }
    .stat-card-sub { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }

    /* Panels */
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
    .panel {
      background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .panel-header {
      padding: 20px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400;
    }
    .panel-badge {
      background: var(--gold); color: white; font-size: 10px; font-weight: 600;
      letter-spacing: 1px; padding: 3px 10px; border-radius: 2px;
    }
    .panel-body { padding: 0; }
    .panel-empty {
      padding: 40px 24px; text-align: center; color: var(--mid-grey); font-size: 13px;
    }

    /* Table rows */
    .panel-row {
      padding: 14px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px;
    }
    .panel-row:last-child { border-bottom: none; }
    .panel-row-left { display: flex; flex-direction: column; gap: 2px; }
    .panel-row-name { font-weight: 500; color: var(--charcoal); }
    .panel-row-sub { font-size: 11px; color: var(--mid-grey); }
    .panel-row-badge {
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 2px;
    }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .badge-alert { background: #fce4ec; color: #c62828; }
    .badge-program { background: var(--sand); color: var(--charcoal); }

    /* Program breakdown */
    .program-bar {
      padding: 12px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; align-items: center; gap: 16px;
    }
    .program-bar:last-child { border-bottom: none; }
    .program-bar-fill {
      flex: 1; height: 8px; background: var(--light-grey); border-radius: 4px; overflow: hidden;
    }
    .program-bar-inner { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar-label { font-size: 12px; color: var(--charcoal); min-width: 120px; }
    .program-bar-count { font-size: 12px; color: var(--mid-grey); min-width: 30px; text-align: right; }

    .loading-spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid var(--light-grey); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .dash-content { padding: 16px; }
    }
    @media (max-width: 500px) {
      .stat-grid { grid-template-columns: 1fr; }
      .login-box { width: 90%; padding: 32px 24px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <div class="login-box">
    <h1>Dashboard</h1>
    <p>Sign in to the FitnessByMaddy admin panel</p>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardView">
  <div class="dash-nav">
    <div class="dash-nav-brand">FitnessByMaddy</div>
    <div class="dash-nav-right">
      <span id="userEmail"></span>
      <button class="dash-logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="dash-header">
      <h1>Daily <em>Ops</em></h1>
      <p id="dashDate"></p>
    </div>

    <!-- STATS -->
    <div class="stat-grid">
      <div class="stat-card highlight">
        <div class="stat-card-label">Leads Today</div>
        <div class="stat-card-value" id="leadsToday">—</div>
        <div class="stat-card-sub" id="leadsWeek">This week: —</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Conversion Rate</div>
        <div class="stat-card-value" id="conversionRate">—</div>
        <div class="stat-card-sub">Lead → Paid</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-card-label">Active Clients</div>
        <div class="stat-card-value" id="activeClients">—</div>
        <div class="stat-card-sub" id="totalClients">Total: —</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Programs This Week</div>
        <div class="stat-card-value" id="programsWeek">—</div>
        <div class="stat-card-sub">Generated &amp; sent</div>
      </div>
    </div>

    <!-- PANELS -->
    <div class="panels">
      <!-- Pending Check-ins -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Pending Check-ins</div>
          <div class="panel-badge" id="pendingCount">0</div>
        </div>
        <div class="panel-body" id="pendingList">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>

      <!-- Escalations -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Escalations</div>
          <div class="panel-badge" id="escalationCount" style="background:#c62828">0</div>
        </div>
        <div class="panel-body" id="escalationList">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Clients by Program -->
    <div class="panel" style="margin-bottom:32px">
      <div class="panel-header">
        <div class="panel-title">Active Clients by Program</div>
      </div>
      <div class="panel-body" id="programBreakdown">
        <div class="panel-empty">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';
  var session = null;

  var loginView = document.getElementById('loginView');
  var dashboardView = document.getElementById('dashboardView');

  var saved = localStorage.getItem('fbm_admin_session');
  if (saved) {
    try {
      session = JSON.parse(saved);
      showDashboard();
    } catch(e) { localStorage.removeItem('fbm_admin_session'); }
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    var meta = document.querySelector('meta[name="supabase-url"]');
    var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
    SUPABASE_URL = meta ? meta.content : '';
    SUPABASE_ANON_KEY = metaKey ? metaKey.content : '';

    fetch((SUPABASE_URL || '') + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY || '',
      },
      body: JSON.stringify({ email: email, password: password }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        session = { token: data.access_token, email: email };
        localStorage.setItem('fbm_admin_session', JSON.stringify(session));
        showDashboard();
      } else {
        errEl.textContent = data.error_description || 'Login failed';
        errEl.style.display = 'block';
      }
    })
    .catch(function() {
      errEl.textContent = 'Network error — try again';
      errEl.style.display = 'block';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    session = null;
    localStorage.removeItem('fbm_admin_session');
    loginView.style.display = 'flex';
    dashboardView.style.display = 'none';
  });

  function showDashboard() {
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
    document.getElementById('userEmail').textContent = session.email || '';
    document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    });
    loadData();
  }

  function loadData() {
    fetch('/api/admin-data', {
      headers: { 'Authorization': 'Bearer ' + session.token },
    })
    .then(function(r) {
      if (r.status === 401) {
        session = null;
        localStorage.removeItem('fbm_admin_session');
        loginView.style.display = 'flex';
        dashboardView.style.display = 'none';
        return null;
      }
      return r.json();
    })
    .then(function(d) {
      if (!d) return;
      document.getElementById('leadsToday').textContent = d.leads_today;
      document.getElementById('leadsWeek').textContent = 'This week: ' + d.leads_week;
      document.getElementById('conversionRate').textContent = d.conversion_rate + '%';
      document.getElementById('activeClients').textContent = d.active_clients;
      document.getElementById('totalClients').textContent = 'Total: ' + d.total_clients;
      document.getElementById('programsWeek').textContent = d.programs_generated_week;

      renderPendingCheckins(d.pending_checkins || []);
      renderEscalations(d.escalations || []);
      renderProgramBreakdown(d.clients_by_program || {}, d.active_clients || 0);
    })
    .catch(function() {});
  }

  function renderPendingCheckins(list) {
    var el = document.getElementById('pendingList');
    document.getElementById('pendingCount').textContent = list.length;
    if (list.length === 0) {
      el.innerHTML = '<div class="panel-empty">All clients checked in this week!</div>';
      return;
    }
    el.innerHTML = list.map(function(c) {
      return '<div class="panel-row">' +
        '<div class="panel-row-left">' +
          '<span class="panel-row-name">' + esc(c.name) + '</span>' +
          '<span class="panel-row-sub">' + esc(c.phone) + ' · ' + esc(c.program) + '</span>' +
        '</div>' +
        '<span class="panel-row-badge badge-pending">Week ' + c.week + '</span>' +
      '</div>';
    }).join('');
  }

  function renderEscalations(list) {
    var el = document.getElementById('escalationList');
    document.getElementById('escalationCount').textContent = list.length;
    if (list.length === 0) {
      el.innerHTML = '<div class="panel-empty">No escalations — all clear!</div>';
      return;
    }
    el.innerHTML = list.map(function(e) {
      var date = new Date(e.sent_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      return '<div class="panel-row">' +
        '<div class="panel-row-left">' +
          '<span class="panel-row-name">' + esc(e.phone) + '</span>' +
          '<span class="panel-row-sub">' + esc(e.body.slice(0, 80)) + '</span>' +
        '</div>' +
        '<span class="panel-row-badge badge-alert">' + date + '</span>' +
      '</div>';
    }).join('');
  }

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Wk Burn (Gym)',
    '6wk_home': '6-Wk Burn (Home)',
    '12wk': '12-Wk Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
  };

  function renderProgramBreakdown(counts, total) {
    var el = document.getElementById('programBreakdown');
    var keys = Object.keys(counts);
    if (keys.length === 0) {
      el.innerHTML = '<div class="panel-empty">No active clients yet</div>';
      return;
    }
    el.innerHTML = keys.map(function(k) {
      var pct = total > 0 ? Math.round((counts[k] / total) * 100) : 0;
      return '<div class="program-bar">' +
        '<span class="program-bar-label">' + (PROGRAM_LABELS[k] || k) + '</span>' +
        '<div class="program-bar-fill"><div class="program-bar-inner" style="width:' + pct + '%"></div></div>' +
        '<span class="program-bar-count">' + counts[k] + '</span>' +
      '</div>';
    }).join('');
  }

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
