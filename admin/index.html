<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .dash-nav {
      background: var(--charcoal); padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: white; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; }
    .dash-nav-tag { font-size: 10px; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase; }
    .dash-nav-right { display: flex; align-items: center; gap: 20px; }
    .dash-nav-link { font-size: 12px; color: rgba(255,255,255,0.6); text-decoration: none; letter-spacing: 1px; transition: color 0.2s; }
    .dash-nav-link:hover { color: var(--gold-light); }
    .refresh-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 16px; font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 2px; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .dash-header { margin-bottom: 32px; }
    .dash-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; }
    .dash-header h1 em { font-style: italic; color: var(--gold); }
    .dash-date { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.gold { border-left: 3px solid var(--gold); }

    .dash-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .dash-section { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .dash-section-header { padding: 20px 24px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .dash-section-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; }
    .dash-section-count { background: var(--sand); padding: 4px 12px; border-radius: 2px; font-size: 11px; font-weight: 600; color: var(--charcoal); }
    .dash-section-body { padding: 0; max-height: 400px; overflow-y: auto; }

    .list-item { padding: 16px 24px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .list-item:last-child { border-bottom: none; }
    .list-item-main { flex: 1; }
    .list-item-name { font-size: 14px; font-weight: 500; color: var(--charcoal); }
    .list-item-sub { font-size: 11px; color: var(--mid-grey); margin-top: 2px; }
    .list-item-badge { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; }
    .badge-urgent { background: #FDEDEC; color: #C0392B; }
    .badge-pending { background: #FEF9E7; color: #B8860B; }
    .badge-ok { background: #E8F5E9; color: #2E7D32; }

    .program-bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--light-grey); }
    .program-bar:last-child { border-bottom: none; }
    .program-bar-label { font-size: 12px; color: var(--charcoal); min-width: 140px; font-weight: 500; }
    .program-bar-track { flex: 1; height: 8px; background: var(--light-grey); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar-count { font-size: 13px; font-weight: 600; color: var(--charcoal); min-width: 30px; text-align: right; }

    .empty-state { padding: 40px; text-align: center; color: var(--mid-grey); font-size: 13px; }
    .loading { text-align: center; padding: 60px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-sections { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
      .dash-content { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="dash-nav">
  <div>
    <a class="dash-nav-brand" href="/index.html">Fitness by Maddy</a>
    <div class="dash-nav-tag">Operations Dashboard</div>
  </div>
  <div class="dash-nav-right">
    <a class="dash-nav-link" href="/index.html">Website</a>
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
  </div>
</div>

<div class="dash-content">
  <div class="dash-header">
    <h1>Daily <em>Operations</em></h1>
    <div class="dash-date" id="dashDate"></div>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-card-label">Leads Today</div><div class="stat-card-value" id="leadsToday">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Leads This Week</div><div class="stat-card-value" id="leadsWeek">—</div></div>
    <div class="stat-card gold"><div class="stat-card-label">Conversion Rate</div><div class="stat-card-value" id="convRate">—</div><div class="stat-card-sub" id="convSub"></div></div>
    <div class="stat-card"><div class="stat-card-label">Active Clients</div><div class="stat-card-value" id="activeClients">—</div></div>
  </div>

  <div class="dash-sections">
    <div class="dash-section">
      <div class="dash-section-header">
        <div class="dash-section-title">Clients by Program</div>
      </div>
      <div class="dash-section-body" id="programBars">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-header">
        <div class="dash-section-title">Pending Check-ins</div>
        <div class="dash-section-count" id="pendingCount">0</div>
      </div>
      <div class="dash-section-body" id="pendingList">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="dash-section" style="grid-column: 1 / -1;">
      <div class="dash-section-header">
        <div class="dash-section-title">Escalations Awaiting Review</div>
        <div class="dash-section-count" id="escCount">0</div>
      </div>
      <div class="dash-section-body" id="escalationList">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
var PROGRAM_LABELS = {
  '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
  'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
};

function loadDashboard() {
  document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  fetch('/api/admin/stats')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('leadsToday').textContent = d.leads_today;
      document.getElementById('leadsWeek').textContent = d.leads_this_week;
      document.getElementById('convRate').textContent = d.conversion_rate + '%';
      document.getElementById('convSub').textContent = d.converted + ' of ' + d.total_leads + ' leads';
      document.getElementById('activeClients').textContent = d.active_clients;

      var programBars = document.getElementById('programBars');
      var programs = d.clients_by_program || {};
      var maxCount = Math.max(1, ...Object.values(programs));
      if (Object.keys(programs).length === 0) {
        programBars.innerHTML = '<div class="empty-state">No active clients yet</div>';
      } else {
        programBars.innerHTML = Object.keys(programs).map(function(key) {
          var pct = (programs[key] / maxCount * 100).toFixed(0);
          return '<div class="program-bar">' +
            '<div class="program-bar-label">' + (PROGRAM_LABELS[key] || key) + '</div>' +
            '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="program-bar-count">' + programs[key] + '</div></div>';
        }).join('');
      }

      var pending = d.pending_checkins || [];
      document.getElementById('pendingCount').textContent = pending.length;
      var pendingList = document.getElementById('pendingList');
      if (pending.length === 0) {
        pendingList.innerHTML = '<div class="empty-state">All caught up!</div>';
      } else {
        pendingList.innerHTML = pending.map(function(p) {
          return '<div class="list-item"><div class="list-item-main"><div class="list-item-name">' + (p.name || 'Client') + '</div>' +
            '<div class="list-item-sub">Week ' + p.week_no + ' check-in pending</div></div>' +
            '<div class="list-item-badge badge-pending">Pending</div></div>';
        }).join('');
      }

      var escalations = d.escalations || [];
      document.getElementById('escCount').textContent = escalations.length;
      var escList = document.getElementById('escalationList');
      if (escalations.length === 0) {
        escList.innerHTML = '<div class="empty-state">No open escalations</div>';
      } else {
        escList.innerHTML = escalations.map(function(e) {
          var ts = new Date(e.created_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          return '<div class="list-item"><div class="list-item-main"><div class="list-item-name">' + e.reason + '</div>' +
            '<div class="list-item-sub">' + (e.message_body || '').slice(0, 100) + ' — ' + ts + '</div></div>' +
            '<div class="list-item-badge badge-urgent">Action Needed</div></div>';
        }).join('');
      }
    })
    .catch(function(err) {
      console.error('Dashboard load error:', err);
      document.getElementById('programBars').innerHTML = '<div class="empty-state">Failed to load data. Check API connection.</div>';
    });
}

loadDashboard();
</script>

</body>
</html>
