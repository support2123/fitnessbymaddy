<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --white: #FFFFFF; --green: #27ae60; --red: #c0392b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--charcoal); color: var(--white); min-height: 100vh; }
    .topbar { background: #111; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .topbar-brand { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 4px; color: var(--gold); }
    .topbar-user { font-size: 12px; color: var(--mid-grey); }
    .topbar-logout { background: none; border: 1px solid #555; color: #aaa; padding: 6px 16px; font-size: 11px; cursor: pointer; letter-spacing: 1px; border-radius: 2px; }
    .topbar-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dashboard { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; margin-bottom: 24px; color: var(--white); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 24px; }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); line-height: 1; }
    .stat-sub { font-size: 12px; color: #666; margin-top: 4px; }
    .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 24px; margin-bottom: 24px; }
    .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--gold); margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--mid-grey); padding: 8px 12px; border-bottom: 1px solid #333; }
    td { padding: 10px 12px; font-size: 13px; color: #ccc; border-bottom: 1px solid #222; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .badge-green { background: rgba(39,174,96,0.15); color: var(--green); }
    .badge-red { background: rgba(192,57,43,0.15); color: var(--red); }
    .badge-gold { background: rgba(184,150,90,0.15); color: var(--gold); }
    .program-bars { display: flex; flex-direction: column; gap: 8px; }
    .program-bar { display: flex; align-items: center; gap: 12px; }
    .program-bar-label { font-size: 12px; color: #aaa; min-width: 120px; }
    .program-bar-fill { height: 8px; background: var(--gold); border-radius: 4px; min-width: 4px; }
    .program-bar-count { font-size: 12px; color: var(--gold); font-weight: 600; }

    /* Login */
    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 48px; width: 100%; max-width: 380px; text-align: center; }
    .login-box h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--gold); margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 14px 16px; background: #111; border: 1px solid #333; color: var(--white); font-size: 14px; font-family: 'DM Sans', sans-serif; border-radius: 2px; margin-bottom: 12px; outline: none; }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button { width: 100%; padding: 14px; background: var(--gold); color: var(--charcoal); border: none; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; cursor: pointer; border-radius: 2px; margin-top: 8px; }
    .login-box button:hover { background: var(--gold-light); }
    .login-error { color: var(--red); font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
    .loading { text-align: center; padding: 60px; color: var(--mid-grey); }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-page">
    <div class="login-box">
      <div style="font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:4px; color:var(--gold); margin-bottom:4px;">FITNESS BY MADDY</div>
      <h2>Admin Dashboard</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <div id="loginError" class="login-error hidden"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardScreen" class="hidden">
    <div class="topbar">
      <div class="topbar-brand">FITNESS BY MADDY</div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span class="topbar-user" id="userEmail"></span>
        <button class="topbar-logout" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="dashboard">
      <h1>Daily Operations</h1>

      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-label">Leads Today</div>
          <div class="stat-value" id="leadsToday">-</div>
          <div class="stat-sub" id="leadsWeek">- this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Conversion Rate</div>
          <div class="stat-value" id="convRate">-</div>
          <div class="stat-sub">lead to paid</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Clients</div>
          <div class="stat-value" id="activeClients">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Check-ins</div>
          <div class="stat-value" id="pendingCheckins">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Programs This Week</div>
          <div class="stat-value" id="programsWeek">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Escalations</div>
          <div class="stat-value" id="escalationCount">-</div>
          <div class="stat-sub" style="color:var(--red)">needs attention</div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
        <div class="panel">
          <div class="panel-title">Active Clients by Program</div>
          <div class="program-bars" id="programBars"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Escalations Awaiting Review</div>
          <table id="escalationTable">
            <thead><tr><th>Date</th><th>Reason</th><th>Status</th></tr></thead>
            <tbody id="escalationBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:54321'
      : (document.querySelector('meta[name="supabase-url"]')?.content || '');
    const SUPABASE_ANON = document.querySelector('meta[name="supabase-anon"]')?.content || '';

    let session = null;

    // Check for stored session
    const stored = localStorage.getItem('fbm_admin_token');
    if (stored) {
      session = JSON.parse(stored);
      showDashboard();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        session = { token: data.token, email };
        localStorage.setItem('fbm_admin_token', JSON.stringify(session));
        showDashboard();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      session = null;
      localStorage.removeItem('fbm_admin_token');
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    });

    async function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      document.getElementById('userEmail').textContent = session.email;
      await loadStats();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', {
          headers: { 'Authorization': 'Bearer ' + session.token }
        });
        if (!res.ok) {
          if (res.status === 401) {
            session = null;
            localStorage.removeItem('fbm_admin_token');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            return;
          }
          throw new Error('Failed to load stats');
        }
        const data = await res.json();
        renderStats(data);
      } catch (err) {
        console.error('Stats load error:', err);
      }
    }

    function renderStats(data) {
      document.getElementById('leadsToday').textContent = data.leads.today;
      document.getElementById('leadsWeek').textContent = data.leads.week + ' this week';
      document.getElementById('convRate').textContent = data.conversion_rate + '%';
      document.getElementById('activeClients').textContent = data.active_clients.total;
      document.getElementById('pendingCheckins').textContent = data.pending_checkins;
      document.getElementById('programsWeek').textContent = data.programs_generated_week;
      document.getElementById('escalationCount').textContent = data.escalations.length;

      // Program bars
      const barsEl = document.getElementById('programBars');
      const programs = data.active_clients.by_program;
      const maxCount = Math.max(...Object.values(programs), 1);
      const LABELS = {
        '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
        'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
      };
      barsEl.innerHTML = '';
      for (const [prog, count] of Object.entries(programs)) {
        const pct = (count / maxCount) * 100;
        barsEl.innerHTML += `
          <div class="program-bar">
            <div class="program-bar-label">${LABELS[prog] || prog}</div>
            <div class="program-bar-fill" style="width:${pct}%"></div>
            <div class="program-bar-count">${count}</div>
          </div>`;
      }
      if (!Object.keys(programs).length) {
        barsEl.innerHTML = '<div style="color:#666; font-size:13px;">No active clients yet</div>';
      }

      // Escalations table
      const tbody = document.getElementById('escalationBody');
      tbody.innerHTML = '';
      for (const esc of data.escalations) {
        const d = new Date(esc.created_at);
        const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        tbody.innerHTML += `
          <tr>
            <td>${dateStr}</td>
            <td>${esc.reason}</td>
            <td><span class="badge badge-red">Open</span></td>
          </tr>`;
      }
      if (!data.escalations.length) {
        tbody.innerHTML = '<tr><td colspan="3" style="color:#666;">All clear</td></tr>';
      }
    }

    // Auto-refresh every 60 seconds
    setInterval(() => { if (session) loadStats(); }, 60000);
  </script>
</body>
</html>
