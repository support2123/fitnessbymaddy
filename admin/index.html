<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #2D8B4E;
      --red: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
    }

    /* Auth Screen */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--charcoal);
    }
    .auth-box {
      background: white;
      padding: 48px 40px;
      border-radius: 2px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-box h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .auth-box p {
      color: var(--mid-grey);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .auth-box input {
      width: 100%;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      background: var(--cream);
      margin-bottom: 12px;
    }
    .auth-box input:focus { outline: none; border-color: var(--gold); }
    .auth-box button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }
    .auth-box button:hover { background: var(--gold); }
    .auth-error { color: var(--red); font-size: 13px; margin-bottom: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal);
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
    }
    .dash-header .logout {
      font-size: 12px;
      color: var(--gold-light);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 2px;
      border-top: 3px solid var(--gold);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card .stat-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--charcoal);
    }

    /* Section */
    .dash-section {
      background: white;
      border-radius: 2px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }
    .dash-section-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--light-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-section-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .dash-section-header .badge {
      background: var(--gold);
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 2px;
    }

    /* Table */
    .dash-table {
      width: 100%;
      border-collapse: collapse;
    }
    .dash-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      padding: 12px 16px;
      border-bottom: 1px solid var(--light-grey);
    }
    .dash-table td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #f5f3ef;
    }
    .dash-table tr:last-child td { border-bottom: none; }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 2px;
    }
    .status-new { background: #e8f4fd; color: #1565C0; }
    .status-qualified { background: #fff3e0; color: #E65100; }
    .status-converted { background: #e8f5e9; color: #2E7D32; }
    .status-dropped { background: #fce4ec; color: #C62828; }
    .status-active { background: #e8f5e9; color: #2E7D32; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--mid-grey);
      font-size: 14px;
    }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); }

    @media (max-width: 768px) {
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .dash-table { font-size: 13px; }
      .dash-table th, .dash-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard — Sign in to continue</p>
    <div class="auth-error" id="authError">Invalid credentials</div>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <button id="authBtn">Sign In</button>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>Ops Dashboard</h1>
    <span class="logout" id="logoutBtn">Sign Out</span>
  </div>

  <div class="dash-body">
    <div class="loading" id="loadingState">Loading dashboard data...</div>

    <div id="dashContent" style="display:none;">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Leads Today</div>
          <div class="stat-num" id="leadsToday">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Leads This Week</div>
          <div class="stat-num" id="leadsWeek">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Conversion Rate</div>
          <div class="stat-num" id="conversionRate">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Clients</div>
          <div class="stat-num" id="activeClients">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Check-Ins</div>
          <div class="stat-num" id="pendingCheckins">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Programs This Week</div>
          <div class="stat-num" id="programsWeek">0</div>
        </div>
      </div>

      <!-- Active Clients -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Active Clients by Program</h2>
        </div>
        <div id="clientsByProgram"></div>
      </div>

      <!-- Recent Leads -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Recent Leads</h2>
          <span class="badge" id="leadsBadge">0</span>
        </div>
        <div id="leadsTable"></div>
      </div>

      <!-- Escalations -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Escalations</h2>
          <span class="badge" id="escalationBadge" style="background:var(--red)">0</span>
        </div>
        <div id="escalationsTable"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';
  var session = null;

  function getConfigFromMeta() {
    var el = document.querySelector('meta[name="supabase-url"]');
    if (el) SUPABASE_URL = el.content;
    el = document.querySelector('meta[name="supabase-anon-key"]');
    if (el) SUPABASE_ANON_KEY = el.content;
  }

  async function supabaseQuery(table, params) {
    var url = SUPABASE_URL + '/rest/v1/' + table;
    var queryParts = [];
    if (params) {
      Object.keys(params).forEach(function(k) {
        queryParts.push(k + '=' + encodeURIComponent(params[k]));
      });
    }
    if (queryParts.length) url += '?' + queryParts.join('&');

    var headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'count=exact',
    };
    if (session) {
      headers['Authorization'] = 'Bearer ' + session.access_token;
    }

    var res = await fetch(url, { headers: headers });
    var count = res.headers.get('content-range');
    var data = await res.json();
    return { data: data, count: count ? parseInt(count.split('/')[1]) : data.length };
  }

  async function signIn(email, password) {
    var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email: email, password: password }),
    });
    if (!res.ok) throw new Error('Invalid credentials');
    return await res.json();
  }

  function showDashboard() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  async function loadDashboard() {
    try {
      var now = new Date();
      var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      var weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

      var [leadsAll, leadsToday, leadsThisWeek, clients, checkins, programs] = await Promise.all([
        supabaseQuery('leads', { select: 'id,phone,name,status,program_interest,market,created_at', order: 'created_at.desc', limit: '50' }),
        supabaseQuery('leads', { select: 'id', 'created_at': 'gte.' + todayStart }),
        supabaseQuery('leads', { select: 'id', 'created_at': 'gte.' + weekStart }),
        supabaseQuery('clients', { select: 'id,name,phone,program,status,created_at', 'status': 'eq.active' }),
        supabaseQuery('checkins', { select: 'id', 'form_submitted_at': 'gte.' + weekStart }),
        supabaseQuery('programs', { select: 'id', 'generated_at': 'gte.' + weekStart }),
      ]);

      var totalLeads = leadsAll.count || leadsAll.data.length;
      var converted = leadsAll.data.filter(function(l) { return l.status === 'converted'; }).length;
      var rate = totalLeads > 0 ? Math.round((converted / totalLeads) * 100) : 0;

      document.getElementById('leadsToday').textContent = leadsToday.data.length;
      document.getElementById('leadsWeek').textContent = leadsThisWeek.data.length;
      document.getElementById('conversionRate').textContent = rate + '%';
      document.getElementById('activeClients').textContent = clients.data.length;
      document.getElementById('pendingCheckins').textContent = Math.max(0, clients.data.length - checkins.data.length);
      document.getElementById('programsWeek').textContent = programs.data.length;

      // Clients by program
      var byProgram = {};
      clients.data.forEach(function(c) {
        var p = c.program || 'unknown';
        byProgram[p] = (byProgram[p] || 0) + 1;
      });
      var programLabels = {
        '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
        'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
      };
      var programHtml = '<table class="dash-table"><tr><th>Program</th><th>Active</th></tr>';
      Object.keys(byProgram).forEach(function(p) {
        programHtml += '<tr><td>' + (programLabels[p] || p) + '</td><td>' + byProgram[p] + '</td></tr>';
      });
      if (Object.keys(byProgram).length === 0) {
        programHtml += '<tr><td colspan="2" class="empty-state">No active clients yet</td></tr>';
      }
      programHtml += '</table>';
      document.getElementById('clientsByProgram').innerHTML = programHtml;

      // Recent leads table
      var leadsHtml = '<table class="dash-table"><tr><th>Name</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr>';
      var recentLeads = leadsAll.data.slice(0, 20);
      document.getElementById('leadsBadge').textContent = recentLeads.length;
      recentLeads.forEach(function(l) {
        var date = new Date(l.created_at).toLocaleDateString();
        leadsHtml += '<tr><td>' + (l.name || 'Unknown') + '</td><td><span class="status-badge status-' + l.status + '">' + l.status + '</span></td><td>' + (l.program_interest || '—') + '</td><td>' + (l.market || '—') + '</td><td>' + date + '</td></tr>';
      });
      if (recentLeads.length === 0) {
        leadsHtml += '<tr><td colspan="5" class="empty-state">No leads yet</td></tr>';
      }
      leadsHtml += '</table>';
      document.getElementById('leadsTable').innerHTML = leadsHtml;

      // Escalations (messages containing escalation keywords sent to Maddy)
      var escalationResult = await supabaseQuery('messages', {
        select: 'id,phone,body,sent_at',
        'template_name': 'eq.escalation_alert',
        order: 'sent_at.desc',
        limit: '10',
      });
      document.getElementById('escalationBadge').textContent = escalationResult.data.length;
      var escHtml = '<table class="dash-table"><tr><th>Phone</th><th>Issue</th><th>When</th></tr>';
      escalationResult.data.forEach(function(m) {
        var date = new Date(m.sent_at).toLocaleString();
        escHtml += '<tr><td>' + m.phone + '</td><td>' + (m.body || '').substring(0, 100) + '</td><td>' + date + '</td></tr>';
      });
      if (escalationResult.data.length === 0) {
        escHtml += '<tr><td colspan="3" class="empty-state">No escalations — all clear!</td></tr>';
      }
      escHtml += '</table>';
      document.getElementById('escalationsTable').innerHTML = escHtml;

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('dashContent').style.display = 'block';

    } catch (err) {
      document.getElementById('loadingState').textContent = 'Error loading data: ' + err.message;
    }
  }

  async function init() {
    getConfigFromMeta();

    if (!SUPABASE_URL) {
      try {
        var cfgRes = await fetch('/api/admin-config');
        var cfg = await cfgRes.json();
        SUPABASE_URL = cfg.supabaseUrl || '';
        SUPABASE_ANON_KEY = cfg.supabaseAnonKey || '';
      } catch (e) {
        SUPABASE_URL = window.__SUPABASE_URL || '';
        SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';
      }
    }

    var stored = localStorage.getItem('fbm_session');
    if (stored) {
      try {
        session = JSON.parse(stored);
        showDashboard();
      } catch (e) {
        localStorage.removeItem('fbm_session');
      }
    }
  }

  init();

  document.getElementById('authBtn').addEventListener('click', async function() {
    var email = document.getElementById('authEmail').value;
    var password = document.getElementById('authPassword').value;
    var errorEl = document.getElementById('authError');
    errorEl.style.display = 'none';

    if (!email || !password) {
      errorEl.textContent = 'Please enter email and password';
      errorEl.style.display = 'block';
      return;
    }

    try {
      session = await signIn(email, password);
      localStorage.setItem('fbm_session', JSON.stringify(session));
      showDashboard();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    }
  });

  document.getElementById('authPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('authBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    session = null;
    localStorage.removeItem('fbm_session');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
  });
})();
</script>

</body>
</html>
