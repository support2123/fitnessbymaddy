<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-nav {
      background: var(--charcoal); padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-nav h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      color: var(--gold); letter-spacing: 2px; font-weight: 600;
    }
    .admin-nav .status { font-size: 12px; color: rgba(255,255,255,0.5); }

    .admin-login {
      max-width: 400px; margin: 120px auto; padding: 40px; background: white;
      border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center;
    }
    .admin-login h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      margin-bottom: 24px; color: var(--charcoal);
    }
    .admin-login input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px; outline: none;
    }
    .admin-login input:focus { border-color: var(--gold); }
    .admin-login button {
      width: 100%; padding: 14px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
    }
    .admin-login button:hover { background: var(--gold); }

    .dashboard { display: none; padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dashboard.active { display: block; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); border-top: 3px solid var(--light-grey);
    }
    .stat-card.highlight { border-top-color: var(--gold); }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .value {
      font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600;
      color: var(--charcoal); line-height: 1;
    }
    .stat-card .sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    .section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400;
      color: var(--charcoal); margin-bottom: 16px; margin-top: 32px;
    }

    .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .data-table th {
      background: var(--charcoal); color: rgba(255,255,255,0.8); padding: 12px 16px;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; text-align: left;
    }
    .data-table td { padding: 12px 16px; border-bottom: 1px solid var(--light-grey); font-size: 13px; }
    .data-table tr:hover td { background: rgba(184,150,90,0.04); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-new { background: #E8F4FD; color: #1976D2; }
    .badge-qualified { background: #FFF3E0; color: #E65100; }
    .badge-converted { background: #E8F5E9; color: #2E7D32; }
    .badge-dropped { background: #FFEBEE; color: #C62828; }

    .programs-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .program-badge-card {
      background: white; padding: 16px; border-radius: 4px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .program-badge-card .count {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--gold);
    }
    .program-badge-card .name { font-size: 11px; color: var(--mid-grey); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    .escalation-list { list-style: none; }
    .escalation-list li {
      background: white; padding: 16px; margin-bottom: 8px; border-radius: 4px;
      border-left: 4px solid #F44336; font-size: 13px; line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .escalation-list .time { font-size: 11px; color: var(--mid-grey); margin-top: 6px; }
    .empty-state { color: var(--mid-grey); font-size: 14px; padding: 24px; text-align: center; background: white; border-radius: 4px; }

    .refresh-btn {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
      padding: 6px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dashboard { padding: 16px; }
      .admin-nav { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<div class="admin-nav">
  <h1>FITNESS BY MADDY — OPS</h1>
  <div>
    <span class="status" id="last-refresh">—</span>
    <button class="refresh-btn" onclick="loadDashboard()" style="margin-left:12px">Refresh</button>
  </div>
</div>

<!-- LOGIN -->
<div class="admin-login" id="login-screen">
  <h2>Admin Access</h2>
  <input type="password" id="admin-key" placeholder="Enter admin key">
  <button onclick="authenticate()">Enter Dashboard</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card highlight">
      <div class="label">Leads Today</div>
      <div class="value" id="s-leads-today">—</div>
    </div>
    <div class="stat-card highlight">
      <div class="label">Leads This Week</div>
      <div class="value" id="s-leads-week">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Conversion Rate</div>
      <div class="value" id="s-conversion">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Active Clients</div>
      <div class="value" id="s-active">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Pending Check-Ins</div>
      <div class="value" id="s-pending">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Programs Generated (Week)</div>
      <div class="value" id="s-programs">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Messages Today</div>
      <div class="value" id="s-messages">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Leads</div>
      <div class="value" id="s-total-leads">—</div>
    </div>
  </div>

  <h3 class="section-title">Active Clients by Program</h3>
  <div class="programs-row" id="programs-row"></div>

  <h3 class="section-title">Escalations Awaiting Maddy</h3>
  <ul class="escalation-list" id="escalation-list"></ul>

  <h3 class="section-title">Recent Leads</h3>
  <table class="data-table" id="leads-table">
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Time</th></tr>
    </thead>
    <tbody id="leads-body"></tbody>
  </table>
</div>

<script>
var adminKey = '';

function authenticate() {
  adminKey = document.getElementById('admin-key').value;
  if (!adminKey) return;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  loadDashboard();
}

function loadDashboard() {
  document.getElementById('last-refresh').textContent = 'Loading...';

  fetch('/api/admin-stats', {
    headers: { 'Authorization': 'Bearer ' + adminKey }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('Auth failed');
    return r.json();
  })
  .then(function(d) {
    document.getElementById('s-leads-today').textContent = d.leads.today;
    document.getElementById('s-leads-week').textContent = d.leads.this_week;
    document.getElementById('s-conversion').textContent = d.leads.conversion_rate;
    document.getElementById('s-active').textContent = d.clients.active;
    document.getElementById('s-pending').textContent = d.checkins.pending;
    document.getElementById('s-programs').textContent = d.programs_generated_this_week;
    document.getElementById('s-messages').textContent = d.messages_today;
    document.getElementById('s-total-leads').textContent = d.leads.total;

    // Programs breakdown
    var progRow = document.getElementById('programs-row');
    progRow.innerHTML = '';
    var labels = {
      '6wk_gym': '6WK Gym', '6wk_home': '6WK Home', '12wk': '12 Week',
      'pcos': 'PCOS', '40plus': '40+', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
    };
    var progs = d.clients.by_program || {};
    Object.keys(labels).forEach(function(k) {
      var card = document.createElement('div');
      card.className = 'program-badge-card';
      card.innerHTML = '<div class="count">' + (progs[k] || 0) + '</div><div class="name">' + labels[k] + '</div>';
      progRow.appendChild(card);
    });

    // Escalations
    var escList = document.getElementById('escalation-list');
    escList.innerHTML = '';
    if (d.escalations.length === 0) {
      escList.innerHTML = '<li class="empty-state">No pending escalations</li>';
    } else {
      d.escalations.forEach(function(e) {
        var li = document.createElement('li');
        li.innerHTML = e.body + '<div class="time">' + new Date(e.sent_at).toLocaleString() + '</div>';
        escList.appendChild(li);
      });
    }

    // Recent leads
    var tbody = document.getElementById('leads-body');
    tbody.innerHTML = '';
    (d.recent_leads || []).forEach(function(l) {
      var tr = document.createElement('tr');
      var badgeClass = 'badge-' + (l.status || 'new');
      tr.innerHTML =
        '<td>' + (l.name || '—') + '</td>' +
        '<td style="font-family:monospace;font-size:12px">' + l.phone + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + (l.status || 'new') + '</span></td>' +
        '<td>' + (l.program_interest || '—') + '</td>' +
        '<td>' + (l.market || '—') + '</td>' +
        '<td style="font-size:12px;color:#6B6B6B">' + new Date(l.created_at).toLocaleString() + '</td>';
      tbody.appendChild(tr);
    });

    document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  })
  .catch(function(err) {
    document.getElementById('last-refresh').textContent = 'Error: ' + err.message;
  });
}

document.getElementById('admin-key').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') authenticate();
});
</script>
</body>
</html>
