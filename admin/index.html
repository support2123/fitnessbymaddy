<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --green: #2D8A4E; --red: #C0392B; --blue: #2980B9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-nav {
      background: var(--charcoal); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase; }
    .admin-subtitle { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; }
    .admin-nav-right { display: flex; align-items: center; gap: 16px; }
    .admin-refresh { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); padding: 6px 16px; border-radius: 2px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
    .admin-refresh:hover { border-color: var(--gold); color: var(--gold); }

    .admin-body { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    .login-screen { max-width: 400px; margin: 120px auto; text-align: center; }
    .login-card { background: white; padding: 48px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 24px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: inherit; margin-bottom: 16px; outline: none; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-family: inherit; }
    .login-btn:hover { background: var(--gold); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; line-height: 1; }
    .stat-card-sub { font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .stat-gold { color: var(--gold); }
    .stat-green { color: var(--green); }
    .stat-red { color: var(--red); }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; margin-top: 32px; }
    .section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; }
    .section-badge { background: var(--gold); color: white; font-size: 10px; font-weight: 600; letter-spacing: 1px; padding: 4px 10px; border-radius: 2px; }

    .data-table { width: 100%; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .data-table th { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); padding: 14px 16px; text-align: left; background: var(--sand); border-bottom: 1px solid var(--light-grey); }
    .data-table td { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--light-grey); color: var(--charcoal); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(184,150,90,0.04); }

    .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; }
    .badge-new { background: #EBF5FB; color: var(--blue); }
    .badge-qualified { background: #FEF9E7; color: #B7950B; }
    .badge-converted { background: #EAFAF1; color: var(--green); }
    .badge-dropped { background: #FDEDEC; color: var(--red); }
    .badge-active { background: #EAFAF1; color: var(--green); }
    .badge-paused { background: #FEF9E7; color: #B7950B; }

    .escalation-card { background: white; border-left: 3px solid var(--red); padding: 16px 20px; border-radius: 0 4px 4px 0; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .escalation-time { font-size: 10px; color: var(--mid-grey); letter-spacing: 0.5px; }
    .escalation-text { font-size: 13px; margin-top: 4px; }

    .empty-state { text-align: center; padding: 48px; color: var(--mid-grey); font-size: 13px; }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .admin-body { padding: 20px 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<div class="admin-nav">
  <div>
    <div class="admin-logo">Fitness by Maddy</div>
    <div class="admin-subtitle">Operations Dashboard</div>
  </div>
  <div class="admin-nav-right" id="navRight" class="hidden">
    <button class="admin-refresh" onclick="loadDashboard()">Refresh</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2 class="login-title">Admin Login</h2>
    <input class="login-input" type="text" id="supabaseUrl" placeholder="Supabase URL">
    <input class="login-input" type="password" id="supabaseKey" placeholder="Supabase Service Key">
    <button class="login-btn" onclick="doLogin()">Access Dashboard</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="admin-body hidden">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="section-header">
    <h2>Escalations</h2>
    <span class="section-badge" id="escalationCount">0</span>
  </div>
  <div id="escalationsList"></div>

  <div class="section-header">
    <h2>Recent Leads</h2>
  </div>
  <div id="leadsTable"></div>

  <div class="section-header">
    <h2>Active Clients</h2>
  </div>
  <div id="clientsTable"></div>

  <div class="section-header">
    <h2>Pending Check-Ins</h2>
  </div>
  <div id="pendingCheckins"></div>

  <div class="section-header">
    <h2>Programs Generated This Week</h2>
  </div>
  <div id="recentPrograms"></div>

</div>

<script>
var db = null;

function doLogin() {
  var url = document.getElementById('supabaseUrl').value.trim();
  var key = document.getElementById('supabaseKey').value.trim();
  if (!url || !key) { alert('Both fields required'); return; }

  sessionStorage.setItem('sb_url', url);
  sessionStorage.setItem('sb_key', key);
  initDashboard(url, key);
}

function initDashboard(url, key) {
  db = { url: url, key: key };
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('navRight').classList.remove('hidden');
  loadDashboard();
}

async function query(table, params) {
  var qs = '';
  if (params) {
    var parts = [];
    for (var k in params) parts.push(k + '=' + encodeURIComponent(params[k]));
    qs = '?' + parts.join('&');
  }
  var res = await fetch(db.url + '/rest/v1/' + table + qs, {
    headers: {
      'apikey': db.key,
      'Authorization': 'Bearer ' + db.key,
      'Content-Type': 'application/json',
      'Prefer': 'count=exact',
    },
  });
  var count = res.headers.get('content-range');
  var data = await res.json();
  return { data: data, count: count ? parseInt(count.split('/')[1]) : data.length };
}

async function loadDashboard() {
  try {
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    var weekStart = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();

    var [allLeads, todayLeads, weekLeads, activeClients, allClients, weekPrograms, recentLeads, clientsList] = await Promise.all([
      query('leads', { select: 'id,status', limit: '10000' }),
      query('leads', { select: 'id', 'created_at': 'gte.' + todayStart, limit: '10000' }),
      query('leads', { select: 'id', 'created_at': 'gte.' + weekStart, limit: '10000' }),
      query('clients', { select: '*', status: 'eq.active', order: 'created_at.desc' }),
      query('clients', { select: 'id', limit: '10000' }),
      query('programs', { select: '*', 'generated_at': 'gte.' + weekStart, order: 'generated_at.desc' }),
      query('leads', { select: '*', order: 'created_at.desc', limit: '20' }),
      query('clients', { select: '*', order: 'created_at.desc', limit: '20' }),
    ]);

    var totalLeads = allLeads.data.length;
    var converted = allLeads.data.filter(function(l) { return l.status === 'converted'; }).length;
    var convRate = totalLeads > 0 ? Math.round((converted / totalLeads) * 100) : 0;

    var byProgram = {};
    activeClients.data.forEach(function(c) {
      byProgram[c.program] = (byProgram[c.program] || 0) + 1;
    });

    document.getElementById('statsGrid').innerHTML =
      statCard('Leads Today', todayLeads.data.length, '', 'stat-gold') +
      statCard('Leads This Week', weekLeads.data.length, '', 'stat-gold') +
      statCard('Conversion Rate', convRate + '%', converted + ' of ' + totalLeads, convRate > 20 ? 'stat-green' : 'stat-red') +
      statCard('Active Clients', activeClients.data.length, '', 'stat-green') +
      statCard('Programs This Week', weekPrograms.data.length, '', 'stat-gold') +
      statCard('Total Clients', allClients.data.length, '', '');

    renderLeadsTable(recentLeads.data);
    renderClientsTable(clientsList.data);
    renderPrograms(weekPrograms.data);
    await loadEscalations();
    await loadPendingCheckins(activeClients.data);
  } catch(e) {
    console.error(e);
    alert('Failed to load data. Check credentials.');
  }
}

function statCard(label, value, sub, cls) {
  return '<div class="stat-card"><div class="stat-card-label">' + label + '</div><div class="stat-card-value ' + cls + '">' + value + '</div>' + (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') + '</div>';
}

function renderLeadsTable(leads) {
  if (!leads || leads.length === 0) { document.getElementById('leadsTable').innerHTML = '<div class="empty-state">No leads yet</div>'; return; }
  var html = '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr></thead><tbody>';
  leads.forEach(function(l) {
    var phone = l.phone ? (l.phone.slice(0,3) + 'XXX...' + l.phone.slice(-3)) : '—';
    html += '<tr><td>' + (l.name || '—') + '</td><td>' + phone + '</td><td><span class="badge badge-' + l.status + '">' + l.status + '</span></td><td>' + (l.program_interest || '—') + '</td><td>' + (l.market || '—') + '</td><td>' + new Date(l.created_at).toLocaleDateString() + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('leadsTable').innerHTML = html;
}

function renderClientsTable(clients) {
  if (!clients || clients.length === 0) { document.getElementById('clientsTable').innerHTML = '<div class="empty-state">No clients yet</div>'; return; }
  var html = '<table class="data-table"><thead><tr><th>Name</th><th>Program</th><th>Status</th><th>Paid</th><th>Started</th></tr></thead><tbody>';
  clients.forEach(function(c) {
    html += '<tr><td>' + (c.name || '—') + '</td><td>' + (c.program || '—') + '</td><td><span class="badge badge-' + c.status + '">' + c.status + '</span></td><td>$' + (c.paid_amount || 0) + '</td><td>' + new Date(c.program_started_at).toLocaleDateString() + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('clientsTable').innerHTML = html;
}

function renderPrograms(programs) {
  if (!programs || programs.length === 0) { document.getElementById('recentPrograms').innerHTML = '<div class="empty-state">No programs generated this week</div>'; return; }
  var html = '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>PDF</th></tr></thead><tbody>';
  programs.forEach(function(p) {
    html += '<tr><td>' + (p.client_id ? p.client_id.slice(0,8) + '...' : '—') + '</td><td>Week ' + p.week_no + '</td><td>' + new Date(p.generated_at).toLocaleDateString() + '</td><td>' + (p.whatsapp_sent_at ? 'Yes' : 'No') + '</td><td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold)">View</a>' : '—') + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('recentPrograms').innerHTML = html;
}

async function loadEscalations() {
  var weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
  var result = await query('messages', {
    select: '*',
    direction: 'eq.out',
    'body': 'like.*ESCALATION*',
    'sent_at': 'gte.' + weekAgo,
    order: 'sent_at.desc',
    limit: '10',
  });

  var el = document.getElementById('escalationsList');
  var badge = document.getElementById('escalationCount');
  badge.textContent = result.data.length;

  if (!result.data || result.data.length === 0) {
    el.innerHTML = '<div class="empty-state">No escalations this week</div>';
    return;
  }

  var html = '';
  result.data.forEach(function(m) {
    html += '<div class="escalation-card"><div class="escalation-time">' + new Date(m.sent_at).toLocaleString() + '</div><div class="escalation-text">' + (m.body || '').replace(/</g, '&lt;') + '</div></div>';
  });
  el.innerHTML = html;
}

async function loadPendingCheckins(activeClients) {
  var el = document.getElementById('pendingCheckins');
  if (!activeClients || activeClients.length === 0) {
    el.innerHTML = '<div class="empty-state">No active clients</div>';
    return;
  }

  var now = new Date();
  var pending = [];

  for (var i = 0; i < activeClients.length; i++) {
    var c = activeClients[i];
    var start = new Date(c.program_started_at);
    var daysSince = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    var currentWeek = Math.ceil(daysSince / 7);
    if (currentWeek < 1) continue;

    var result = await query('checkins', {
      select: 'id',
      client_id: 'eq.' + c.id,
      week_no: 'eq.' + currentWeek,
      limit: '1',
    });

    if (result.data.length === 0) {
      pending.push({ name: c.name || c.id.slice(0,8), program: c.program, week: currentWeek });
    }
  }

  if (pending.length === 0) {
    el.innerHTML = '<div class="empty-state">All check-ins submitted</div>';
    return;
  }

  var html = '<table class="data-table"><thead><tr><th>Client</th><th>Program</th><th>Pending Week</th></tr></thead><tbody>';
  pending.forEach(function(p) {
    html += '<tr><td>' + p.name + '</td><td>' + p.program + '</td><td>Week ' + p.week + '</td></tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

(function() {
  var url = sessionStorage.getItem('sb_url');
  var key = sessionStorage.getItem('sb_key');
  if (url && key) initDashboard(url, key);
})();
</script>
</body>
</html>
