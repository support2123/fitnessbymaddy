<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0F0F0F;--card:#1A1A1A;--border:#2A2A2A;--gold:#B8965A;--gold-light:#D4AF7A;--white:#FFFFFF;--muted:#888;--green:#4ADE80;--red:#F87171;--blue:#60A5FA;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}

    .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    .login-box{background:var(--card);padding:48px 40px;border-radius:8px;width:100%;max-width:400px;border:1px solid var(--border);}
    .login-box h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;}
    .login-box p{color:var(--muted);font-size:13px;margin-bottom:32px;}
    .login-box input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--white);font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;outline:none;}
    .login-box input:focus{border-color:var(--gold);}
    .login-box button{width:100%;padding:14px;background:var(--gold);color:var(--bg);border:none;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:opacity 0.2s;}
    .login-box button:hover{opacity:0.9;}
    .login-error{color:var(--red);font-size:12px;margin-bottom:12px;display:none;}

    .dashboard{display:none;}
    .dash-header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;}
    .dash-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold);}
    .dash-user{display:flex;align-items:center;gap:12px;}
    .dash-user span{font-size:13px;color:var(--muted);}
    .dash-user button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:4px;font-family:'DM Sans',sans-serif;}

    .dash-content{padding:32px;max-width:1200px;margin:0 auto;}
    .dash-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--white);margin-bottom:24px;}

    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;}
    .stat-card .label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .stat-card .value{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--white);line-height:1;}
    .stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
    .stat-card.gold .value{color:var(--gold);}
    .stat-card.green .value{color:var(--green);}
    .stat-card.red .value{color:var(--red);}

    .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px;}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .panel-header h3{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
    .panel-header .badge{background:var(--gold);color:var(--bg);padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;}
    .panel-body{padding:16px 20px;max-height:400px;overflow-y:auto;}

    .list-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .list-item:last-child{border-bottom:none;}
    .list-item .name{font-size:14px;font-weight:500;}
    .list-item .detail{font-size:12px;color:var(--muted);}
    .list-item .status{font-size:11px;padding:4px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
    .status-new{background:rgba(96,165,250,0.15);color:var(--blue);}
    .status-active{background:rgba(74,222,128,0.15);color:var(--green);}
    .status-dropped{background:rgba(248,113,113,0.15);color:var(--red);}
    .status-converted{background:rgba(184,150,90,0.15);color:var(--gold);}
    .status-pending{background:rgba(251,191,36,0.15);color:#FBBF24;}

    .empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

    .escalation-item{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:6px;padding:12px 16px;margin-bottom:8px;}
    .escalation-item .esc-reason{font-size:13px;font-weight:500;color:var(--red);margin-bottom:4px;}
    .escalation-item .esc-detail{font-size:12px;color:var(--muted);}

    .loading{text-align:center;padding:60px;color:var(--muted);}
    .loading::after{content:'';display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin-left:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:800px){
      .section-grid{grid-template-columns:1fr;}
      .stats-grid{grid-template-columns:repeat(2,1fr);}
      .dash-content{padding:20px;}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>FITNESS BY MADDY</h1>
    <p>Admin Dashboard — Sign in to continue</p>
    <div class="login-error" id="loginError">Invalid credentials. Try again.</div>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="handleLogin()">Sign In</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">FITNESS BY MADDY</div>
    <div class="dash-user">
      <span id="userEmail"></span>
      <button onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="dash-title">OPERATIONS DASHBOARD</div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Loading...</div><div class="value">-</div></div>
    </div>

    <div class="section-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>Recent Leads</h3>
          <span class="badge" id="leadsCount">0</span>
        </div>
        <div class="panel-body" id="leadsList">
          <div class="loading">Loading</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Active Clients</h3>
          <span class="badge" id="clientsCount">0</span>
        </div>
        <div class="panel-body" id="clientsList">
          <div class="loading">Loading</div>
        </div>
      </div>
    </div>

    <div class="section-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>Pending Check-Ins</h3>
          <span class="badge" id="pendingCount">0</span>
        </div>
        <div class="panel-body" id="pendingList">
          <div class="loading">Loading</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Escalations</h3>
          <span class="badge" id="escalationsCount" style="background:var(--red);">0</span>
        </div>
        <div class="panel-body" id="escalationsList">
          <div class="loading">Loading</div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:32px;">
      <div class="panel-header">
        <h3>Programs Generated This Week</h3>
        <span class="badge" id="programsCount">0</span>
      </div>
      <div class="panel-body" id="programsList">
        <div class="loading">Loading</div>
      </div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var supabase = null;
var session = null;

function initSupabase() {
  if (window._supabaseClient) return;
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  script.onload = function() {
    SUPABASE_URL = document.querySelector('meta[name="supabase-url"]')?.content || prompt('Enter Supabase URL:');
    SUPABASE_ANON_KEY = document.querySelector('meta[name="supabase-key"]')?.content || prompt('Enter Supabase Anon Key:');
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    checkSession();
  };
  document.head.appendChild(script);
}

async function checkSession() {
  var stored = localStorage.getItem('fbm_admin_session');
  if (stored) {
    try {
      var parsed = JSON.parse(stored);
      var { data } = await supabase.auth.setSession(parsed);
      if (data.session) {
        session = data.session;
        showDashboard();
        return;
      }
    } catch(e) {}
  }
  document.getElementById('loginScreen').style.display = 'flex';
}

async function handleLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  if (!email || !password) return;

  var { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
  if (error) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  session = data.session;
  localStorage.setItem('fbm_admin_session', JSON.stringify({
    access_token: session.access_token,
    refresh_token: session.refresh_token,
  }));
  showDashboard();
}

function handleLogout() {
  localStorage.removeItem('fbm_admin_session');
  supabase.auth.signOut();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('userEmail').textContent = session.user?.email || '';
  loadDashboardData();
}

async function loadDashboardData() {
  var now = new Date();
  var startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  startOfWeek.setHours(0,0,0,0);
  var weekStart = startOfWeek.toISOString();

  var startOfDay = new Date(now);
  startOfDay.setHours(0,0,0,0);
  var dayStart = startOfDay.toISOString();

  var [leadsToday, leadsWeek, allLeads, activeClients, programs, recentMsgs] = await Promise.all([
    supabase.from('leads').select('*', { count: 'exact' }).gte('created_at', dayStart),
    supabase.from('leads').select('*', { count: 'exact' }).gte('created_at', weekStart),
    supabase.from('leads').select('*').order('created_at', { ascending: false }).limit(20),
    supabase.from('clients').select('*').eq('status', 'active'),
    supabase.from('programs').select('*, clients(name, phone)').gte('generated_at', weekStart).order('generated_at', { ascending: false }),
    supabase.from('messages').select('*').order('sent_at', { ascending: false }).limit(50),
  ]);

  var convertedCount = allLeads.data ? allLeads.data.filter(function(l) { return l.status === 'converted'; }).length : 0;
  var totalLeads = allLeads.count || allLeads.data?.length || 0;
  var conversionRate = totalLeads > 0 ? Math.round((convertedCount / totalLeads) * 100) : 0;

  var clientsByProgram = {};
  if (activeClients.data) {
    activeClients.data.forEach(function(c) {
      clientsByProgram[c.program] = (clientsByProgram[c.program] || 0) + 1;
    });
  }

  var escalations = recentMsgs.data ? recentMsgs.data.filter(function(m) {
    return m.template_name === 'escalation_alert';
  }) : [];

  // Stats
  var statsHtml = ''
    + statCard('New Leads Today', leadsToday.count || 0, '', '')
    + statCard('Leads This Week', leadsWeek.count || 0, '', '')
    + statCard('Conversion Rate', conversionRate + '%', '', 'gold')
    + statCard('Active Clients', activeClients.data?.length || 0, '', 'green')
    + statCard('Programs This Week', programs.data?.length || 0, '', '')
    + statCard('Escalations', escalations.length, '', escalations.length > 0 ? 'red' : '');
  document.getElementById('statsGrid').innerHTML = statsHtml;

  // Leads
  document.getElementById('leadsCount').textContent = allLeads.data?.length || 0;
  if (allLeads.data && allLeads.data.length > 0) {
    document.getElementById('leadsList').innerHTML = allLeads.data.map(function(l) {
      return '<div class="list-item"><div><div class="name">' + (l.name || maskPhone(l.phone)) + '</div><div class="detail">' + l.market + ' &bull; ' + (l.program_interest || 'No interest yet') + ' &bull; ' + timeAgo(l.created_at) + '</div></div><span class="status status-' + l.status + '">' + l.status + '</span></div>';
    }).join('');
  } else {
    document.getElementById('leadsList').innerHTML = '<div class="empty">No leads yet</div>';
  }

  // Clients
  document.getElementById('clientsCount').textContent = activeClients.data?.length || 0;
  if (activeClients.data && activeClients.data.length > 0) {
    document.getElementById('clientsList').innerHTML = activeClients.data.map(function(c) {
      return '<div class="list-item"><div><div class="name">' + (c.name || maskPhone(c.phone)) + '</div><div class="detail">' + c.program + ' &bull; Started ' + timeAgo(c.program_started_at) + '</div></div><span class="status status-active">active</span></div>';
    }).join('');
  } else {
    document.getElementById('clientsList').innerHTML = '<div class="empty">No active clients</div>';
  }

  // Pending check-ins
  if (activeClients.data && activeClients.data.length > 0) {
    var pending = [];
    for (var i = 0; i < activeClients.data.length; i++) {
      var client = activeClients.data[i];
      var startDate = new Date(client.program_started_at);
      var daysSince = Math.floor((now - startDate) / (1000*60*60*24));
      var expectedWeek = Math.ceil(daysSince / 7);
      if (expectedWeek < 1) continue;
      var { data: lastCheckin } = await supabase.from('checkins').select('week_no').eq('client_id', client.id).order('week_no', { ascending: false }).limit(1);
      var lastWeek = lastCheckin && lastCheckin.length > 0 ? lastCheckin[0].week_no : 0;
      if (lastWeek < expectedWeek) {
        pending.push({ name: client.name || maskPhone(client.phone), expected: expectedWeek, last: lastWeek });
      }
    }
    document.getElementById('pendingCount').textContent = pending.length;
    if (pending.length > 0) {
      document.getElementById('pendingList').innerHTML = pending.map(function(p) {
        return '<div class="list-item"><div><div class="name">' + p.name + '</div><div class="detail">Expected Week ' + p.expected + ' &bull; Last submitted: Week ' + p.last + '</div></div><span class="status status-pending">overdue</span></div>';
      }).join('');
    } else {
      document.getElementById('pendingList').innerHTML = '<div class="empty">All check-ins up to date</div>';
    }
  } else {
    document.getElementById('pendingCount').textContent = '0';
    document.getElementById('pendingList').innerHTML = '<div class="empty">No active clients</div>';
  }

  // Escalations
  document.getElementById('escalationsCount').textContent = escalations.length;
  if (escalations.length > 0) {
    document.getElementById('escalationsList').innerHTML = escalations.map(function(e) {
      return '<div class="escalation-item"><div class="esc-reason">' + (e.body || 'Alert') + '</div><div class="esc-detail">' + timeAgo(e.sent_at) + '</div></div>';
    }).join('');
  } else {
    document.getElementById('escalationsList').innerHTML = '<div class="empty">No escalations — all clear</div>';
  }

  // Programs
  document.getElementById('programsCount').textContent = programs.data?.length || 0;
  if (programs.data && programs.data.length > 0) {
    document.getElementById('programsList').innerHTML = programs.data.map(function(p) {
      var clientName = p.clients?.name || 'Client';
      return '<div class="list-item"><div><div class="name">' + clientName + ' — Week ' + p.week_no + '</div><div class="detail">' + timeAgo(p.generated_at) + (p.whatsapp_sent_at ? ' &bull; Sent via WhatsApp' : ' &bull; Not yet sent') + '</div></div>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:var(--gold);font-size:12px;text-decoration:none;">View PDF</a>' : '') + '</div>';
    }).join('');
  } else {
    document.getElementById('programsList').innerHTML = '<div class="empty">No programs generated this week</div>';
  }
}

function statCard(label, value, sub, color) {
  return '<div class="stat-card ' + (color || '') + '"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}

function maskPhone(phone) {
  if (!phone || phone.length < 6) return '***';
  return phone.slice(0, 4) + 'XXX...' + phone.slice(-3);
}

function timeAgo(dateStr) {
  var d = new Date(dateStr);
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

initSupabase();
</script>
</body>
</html>
