<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <meta name="description" content="Admin dashboard for managing leads, clients, and programs at Fitness by Maddy.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --warm-white: #FFFFFF;
      --sand: #F0EAE0;
      --taupe: #C8B89A;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --accent: #8B6914;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* ===================== LOGIN SCREEN ===================== */
    .login-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--charcoal);
      padding: 24px;
    }
    .login-card {
      background: var(--warm-white);
      padding: 56px 48px;
      border-radius: 4px;
      width: 100%; max-width: 420px;
      box-shadow: 0 16px 60px rgba(0,0,0,0.3);
    }
    .login-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      text-align: center; color: var(--charcoal);
      margin-bottom: 4px;
    }
    .login-brand em { font-style: italic; color: var(--gold); }
    .login-subtitle {
      text-align: center; font-size: 11px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 40px;
    }
    .login-group { margin-bottom: 20px; }
    .login-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .login-input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      background: var(--cream); color: var(--charcoal);
      outline: none; transition: border-color 0.3s;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 16px;
      background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer;
      border-radius: 2px; transition: background 0.3s;
      font-family: 'DM Sans', sans-serif;
      margin-top: 8px;
    }
    .login-btn:hover { background: var(--gold); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: #8B3A3A; font-size: 13px;
      text-align: center; margin-top: 16px; display: none;
      background: #FFF5F5; padding: 10px; border-radius: 2px;
      border: 1px solid #E8B4B4;
    }

    /* ===================== DASHBOARD ===================== */
    .dashboard { display: none; }

    /* Dashboard Nav */
    .dash-nav {
      background: var(--charcoal);
      padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky; top: 0; z-index: 100;
    }
    .dash-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: white;
    }
    .dash-logo span { color: var(--gold-light); }
    .dash-nav-right { display: flex; align-items: center; gap: 16px; }
    .dash-refresh {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      padding: 8px 20px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
      transition: all 0.3s;
      font-family: 'DM Sans', sans-serif;
    }
    .dash-refresh:hover { border-color: var(--gold); color: var(--gold); }
    .dash-logout {
      background: transparent; border: none;
      color: rgba(255,255,255,0.4);
      font-size: 12px; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    .dash-logout:hover { color: var(--gold-light); }

    .dash-content {
      padding: 32px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: var(--warm-white);
      padding: 24px;
      border-radius: 4px;
      border-top: 3px solid var(--light-grey);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover {
      border-top-color: var(--gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .stat-card .stat-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 600;
      color: var(--charcoal); line-height: 1;
    }
    .stat-card .stat-sub {
      font-size: 12px; color: var(--mid-grey); margin-top: 4px;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--light-grey);
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .tab {
      padding: 14px 28px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey);
      cursor: pointer;
      border: none;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      background: none;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    .tab:hover { color: var(--charcoal); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Filter Row */
    .filter-row {
      display: flex; gap: 12px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-select {
      padding: 10px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 2px;
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      background: var(--warm-white);
      outline: none; color: var(--charcoal);
      appearance: none; cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B6B6B' stroke-width='1.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
      transition: border-color 0.3s;
    }
    .filter-select:focus { border-color: var(--gold); }
    .filter-search {
      padding: 10px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 2px;
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      background: var(--warm-white);
      outline: none; color: var(--charcoal);
      min-width: 200px;
      transition: border-color 0.3s;
    }
    .filter-search:focus { border-color: var(--gold); }

    /* Tables */
    .table-wrap {
      background: var(--warm-white);
      border-radius: 4px;
      overflow-x: auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey);
      background: var(--sand);
      border-bottom: 1px solid var(--light-grey);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.3s;
    }
    th:hover { color: var(--gold); }
    th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.4; }
    th.sorted .sort-arrow { opacity: 1; color: var(--gold); }
    td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--light-grey);
      white-space: nowrap;
    }
    tr:hover td { background: var(--cream); }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 2px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .status-new { background: #E8F4FD; color: #2980b9; }
    .status-qualified { background: #FFF3E0; color: #e67e22; }
    .status-contacted { background: #F3E5F5; color: #8e24aa; }
    .status-converted { background: #E8F5E9; color: #27ae60; }
    .status-dropped { background: #FFEBEE; color: #c0392b; }
    .status-active { background: #E8F5E9; color: #27ae60; }
    .status-paused { background: #FFF3E0; color: #e67e22; }
    .status-completed { background: #E8F4FD; color: #2980b9; }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Escalation Cards */
    .esc-list { display: flex; flex-direction: column; gap: 12px; }
    .esc-card {
      background: var(--warm-white);
      border-left: 4px solid #c0392b;
      padding: 20px 24px;
      border-radius: 0 4px 4px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .esc-card .esc-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; margin-bottom: 8px;
    }
    .esc-card .esc-reason {
      font-size: 14px; font-weight: 500;
      color: var(--charcoal);
    }
    .esc-card .esc-priority {
      font-size: 10px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 8px; border-radius: 2px;
      background: #FFEBEE; color: #c0392b;
    }
    .esc-card .esc-meta {
      font-size: 12px; color: var(--mid-grey);
      margin-bottom: 12px;
    }
    .esc-resolve {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--light-grey);
      font-size: 11px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      color: var(--mid-grey);
      transition: all 0.3s;
    }
    .esc-resolve:hover { border-color: var(--gold); color: var(--gold); }

    /* Quick Actions */
    .quick-actions {
      display: flex; gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 20px;
      background: var(--warm-white);
      border: 1px solid var(--light-grey);
      font-size: 11px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      transition: all 0.3s;
    }
    .action-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(184,150,90,0.04);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--mid-grey);
      font-size: 14px;
    }
    .empty-state .empty-icon {
      font-size: 32px; margin-bottom: 12px;
      opacity: 0.3;
    }

    /* Loading */
    .loading {
      text-align: center; padding: 40px;
      color: var(--mid-grey); font-size: 13px;
      letter-spacing: 1px;
    }
    .loading::after {
      content: ''; display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--light-grey);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--charcoal); color: white;
      padding: 14px 24px; border-radius: 4px;
      font-size: 13px; z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(100px);
      opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-left: 4px solid #27ae60; }
    .toast.error { border-left: 4px solid #c0392b; }

    /* Responsive */
    @media (max-width: 768px) {
      .dash-nav { padding: 0 16px; }
      .dash-content { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 16px; }
      .stat-card .stat-value { font-size: 28px; }
      .tabs { gap: 0; }
      .tab { padding: 12px 16px; font-size: 11px; }
      .login-card { padding: 40px 28px; }
      .quick-actions { gap: 8px; }
      .action-btn { font-size: 10px; padding: 8px 14px; }
    }
  </style>
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <h1 class="login-brand">Fitness by <em>Maddy</em></h1>
    <p class="login-subtitle">Admin Dashboard</p>
    <form id="login-form">
      <div class="login-group">
        <label class="login-label">Email</label>
        <input type="email" class="login-input" id="login-email" required placeholder="maddy@fitnessbymaddy.com" autocomplete="email">
      </div>
      <div class="login-group">
        <label class="login-label">Password</label>
        <input type="password" class="login-input" id="login-password" required placeholder="Enter password" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div class="dashboard" id="dashboard">
  <nav class="dash-nav">
    <span class="dash-logo">FBM <span>Admin</span></span>
    <div class="dash-nav-right">
      <button class="dash-refresh" id="refresh-btn">Refresh</button>
      <button class="dash-logout" id="logout-btn">Sign Out</button>
    </div>
  </nav>

  <div class="dash-content">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">Loading...</div><div class="stat-value">--</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-panel="leads-panel">Leads</button>
      <button class="tab" data-panel="clients-panel">Active Clients</button>
      <button class="tab" data-panel="escalations-panel">Escalations</button>
    </div>

    <!-- LEADS PANEL -->
    <div class="panel active" id="leads-panel">
      <div class="filter-row">
        <select class="filter-select" id="leads-status-filter">
          <option value="">All Statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="converted">Converted</option>
          <option value="dropped">Dropped</option>
        </select>
        <input type="text" class="filter-search" id="leads-search" placeholder="Search by name or phone...">
      </div>
      <div class="table-wrap">
        <table id="leads-table">
          <thead>
            <tr>
              <th data-sort="name">Name <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="phone">Phone <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="status">Status <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="program_interest">Program Interest <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="market">Market <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="created_at">Created <span class="sort-arrow">&#9650;</span></th>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <tr><td colspan="6" class="loading">Loading leads</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CLIENTS PANEL -->
    <div class="panel" id="clients-panel">
      <div class="table-wrap">
        <table id="clients-table">
          <thead>
            <tr>
              <th data-sort="name">Name <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="program_type">Program <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="current_week">Week <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="last_checkin">Last Check-in <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="status">Status <span class="sort-arrow">&#9650;</span></th>
            </tr>
          </thead>
          <tbody id="clients-tbody">
            <tr><td colspan="5" class="loading">Loading clients</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ESCALATIONS PANEL -->
    <div class="panel" id="escalations-panel">
      <div class="quick-actions">
        <button class="action-btn" id="btn-nudge-lead">Send Nudge to Lead</button>
        <button class="action-btn" id="btn-view-folder">View Client Folder</button>
        <button class="action-btn" id="btn-resolve-all">Mark All Resolved</button>
      </div>
      <div class="esc-list" id="escalations-list">
        <div class="loading">Loading escalations</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  // ===================== SUPABASE INIT =====================
  // Configure via meta tags or window globals
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';

  var metaUrl = document.querySelector('meta[name="supabase-url"]');
  var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
  if (metaUrl) SUPABASE_URL = metaUrl.content;
  if (metaKey) SUPABASE_ANON_KEY = metaKey.content;
  if (!SUPABASE_URL) SUPABASE_URL = window.__SUPABASE_URL__ || '';
  if (!SUPABASE_ANON_KEY) SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || '';

  var sb = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  // ===================== UTILITY FUNCTIONS =====================
  function maskPhone(phone) {
    if (!phone || phone.length < 6) return phone || '--';
    return phone.slice(0, 4) + '****' + phone.slice(-3);
  }

  function fmtDate(d) {
    if (!d) return '--';
    return new Date(d).toLocaleDateString('en-IN', {
      day: 'numeric', month: 'short', year: 'numeric'
    });
  }

  function fmtDateShort(d) {
    if (!d) return '--';
    return new Date(d).toLocaleDateString('en-IN', {
      day: 'numeric', month: 'short'
    });
  }

  function timeAgo(d) {
    if (!d) return '--';
    var diff = Date.now() - new Date(d).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  function statusBadge(status) {
    var s = (status || 'new').toLowerCase();
    return '<span class="status-badge status-' + s + '">' + s + '</span>';
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + (type || 'success') + ' show';
    setTimeout(function() { toast.classList.remove('show'); }, 3500);
  }

  // ===================== TAB SWITCHING =====================
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
    });
  });

  // ===================== AUTH: LOGIN =====================
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errEl = document.getElementById('login-error');
    var loginBtn = document.getElementById('login-btn');
    errEl.style.display = 'none';

    if (!sb) {
      errEl.textContent = 'Supabase is not configured. Please set SUPABASE_URL and SUPABASE_ANON_KEY.';
      errEl.style.display = 'block';
      return;
    }

    var email = document.getElementById('login-email').value;
    var password = document.getElementById('login-password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
      var result = await sb.auth.signInWithPassword({ email: email, password: password });
      if (result.error) {
        errEl.textContent = result.error.message;
        errEl.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        return;
      }
      showDashboard();
    } catch (err) {
      errEl.textContent = 'Connection error. Please try again.';
      errEl.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });

  // ===================== AUTH: SESSION CHECK =====================
  async function checkSession() {
    if (!sb) return;
    try {
      var session = await sb.auth.getSession();
      if (session.data && session.data.session) {
        showDashboard();
      }
    } catch (err) {
      // No valid session
    }
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  // ===================== AUTH: LOGOUT =====================
  document.getElementById('logout-btn').addEventListener('click', async function() {
    if (sb) await sb.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = 'Sign In';
    showToast('Signed out successfully');
  });

  // ===================== REFRESH =====================
  document.getElementById('refresh-btn').addEventListener('click', function() {
    loadDashboard();
    showToast('Dashboard refreshed');
  });

  // ===================== DATA STORAGE =====================
  var allLeads = [];
  var allClients = [];
  var allCheckins = [];
  var allEscalations = [];
  var leadsSortCol = 'created_at';
  var leadsSortAsc = false;
  var clientsSortCol = 'name';
  var clientsSortAsc = true;

  // ===================== LOAD DASHBOARD =====================
  async function loadDashboard() {
    if (!sb) return;

    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    var weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

    try {
      var results = await Promise.all([
        sb.from('leads').select('*').order('created_at', { ascending: false }),
        sb.from('clients').select('*').order('created_at', { ascending: false }),
        sb.from('checkins').select('*').order('submitted_at', { ascending: false }).limit(200),
        sb.from('escalations').select('*').eq('resolved', false).order('created_at', { ascending: false }).limit(50)
      ]);

      allLeads = results[0].data || [];
      allClients = results[1].data || [];
      allCheckins = results[2].data || [];
      allEscalations = results[3].data || [];

      // If escalations table doesn't exist, try messages table
      if (results[3].error && results[3].error.message) {
        try {
          var escFallback = await sb.from('messages')
            .select('*')
            .eq('template_name', 'escalation_alert')
            .order('sent_at', { ascending: false })
            .limit(20);
          allEscalations = (escFallback.data || []).map(function(m) {
            return {
              id: m.id,
              reason: m.body || 'Escalation alert',
              client_name: '',
              phone: m.phone,
              created_at: m.sent_at,
              resolved: false
            };
          });
        } catch (ignored) {}
      }

      // Calculate stats
      var leadsToday = allLeads.filter(function(l) { return l.created_at >= todayStart; }).length;
      var leadsWeek = allLeads.filter(function(l) { return l.created_at >= weekStart; }).length;
      var activeClients = allClients.filter(function(c) { return c.status === 'active'; }).length;
      var convertedLeads = allLeads.filter(function(l) { return l.status === 'converted'; }).length;
      var convRate = allLeads.length > 0 ? Math.round((convertedLeads / allLeads.length) * 100) : 0;

      // Pending check-ins: active clients who haven't checked in this week
      var clientsCheckedIn = {};
      allCheckins.forEach(function(ch) {
        if (ch.submitted_at >= weekStart) {
          clientsCheckedIn[ch.client_id] = true;
        }
      });
      var pendingCheckins = allClients.filter(function(c) {
        return c.status === 'active' && !clientsCheckedIn[c.id];
      }).length;

      // Render stats
      document.getElementById('stats-grid').innerHTML =
        renderStatCard('New Leads Today', leadsToday, '') +
        renderStatCard('Leads This Week', leadsWeek, '') +
        renderStatCard('Conversion Rate', convRate + '%', convertedLeads + ' of ' + allLeads.length) +
        renderStatCard('Active Clients', activeClients, allClients.length + ' total') +
        renderStatCard('Pending Check-ins', pendingCheckins, 'this week') +
        renderStatCard('Escalations', allEscalations.length, 'need attention');

      // Render tables
      renderLeads();
      renderClients();
      renderEscalations();

    } catch (err) {
      showToast('Failed to load data: ' + err.message, 'error');
    }
  }

  function renderStatCard(label, value, sub) {
    return '<div class="stat-card">' +
      '<div class="stat-label">' + escapeHtml(label) + '</div>' +
      '<div class="stat-value">' + value + '</div>' +
      (sub ? '<div class="stat-sub">' + escapeHtml(sub) + '</div>' : '') +
      '</div>';
  }

  // ===================== LEADS TABLE =====================
  function renderLeads() {
    var statusFilter = document.getElementById('leads-status-filter').value;
    var searchTerm = document.getElementById('leads-search').value.toLowerCase();

    var filtered = allLeads.filter(function(l) {
      if (statusFilter && l.status !== statusFilter) return false;
      if (searchTerm) {
        var name = (l.name || '').toLowerCase();
        var phone = (l.phone || '').toLowerCase();
        if (name.indexOf(searchTerm) === -1 && phone.indexOf(searchTerm) === -1) return false;
      }
      return true;
    });

    // Sort
    filtered.sort(function(a, b) {
      var aVal = a[leadsSortCol] || '';
      var bVal = b[leadsSortCol] || '';
      if (typeof aVal === 'string') aVal = aVal.toLowerCase();
      if (typeof bVal === 'string') bVal = bVal.toLowerCase();
      if (aVal < bVal) return leadsSortAsc ? -1 : 1;
      if (aVal > bVal) return leadsSortAsc ? 1 : -1;
      return 0;
    });

    if (filtered.length === 0) {
      document.getElementById('leads-tbody').innerHTML =
        '<tr><td colspan="6" class="empty-state"><div class="empty-icon">--</div>No leads found</td></tr>';
      return;
    }

    var rows = filtered.map(function(l) {
      var interest = '';
      if (l.program_interest) {
        interest = l.program_interest;
      } else if (l.metadata && l.metadata.goal) {
        interest = l.metadata.goal;
      }
      return '<tr>' +
        '<td><strong>' + escapeHtml(l.name || '--') + '</strong></td>' +
        '<td>' + escapeHtml(maskPhone(l.phone)) + '</td>' +
        '<td>' + statusBadge(l.status) + '</td>' +
        '<td>' + escapeHtml(interest || '--') + '</td>' +
        '<td>' + escapeHtml(l.market || l.source || '--') + '</td>' +
        '<td>' + fmtDate(l.created_at) + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('leads-tbody').innerHTML = rows;
  }

  // Leads filter events
  document.getElementById('leads-status-filter').addEventListener('change', renderLeads);
  document.getElementById('leads-search').addEventListener('input', renderLeads);

  // Leads table sort
  document.querySelectorAll('#leads-table th[data-sort]').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.dataset.sort;
      if (leadsSortCol === col) {
        leadsSortAsc = !leadsSortAsc;
      } else {
        leadsSortCol = col;
        leadsSortAsc = true;
      }
      // Update sort arrows
      document.querySelectorAll('#leads-table th').forEach(function(h) { h.classList.remove('sorted'); });
      th.classList.add('sorted');
      th.querySelector('.sort-arrow').innerHTML = leadsSortAsc ? '&#9650;' : '&#9660;';
      renderLeads();
    });
  });

  // ===================== CLIENTS TABLE =====================
  function renderClients() {
    var activeOnly = allClients.filter(function(c) { return c.status === 'active'; });

    // Enrich with last check-in data
    var clientCheckins = {};
    allCheckins.forEach(function(ch) {
      if (!clientCheckins[ch.client_id] || ch.submitted_at > clientCheckins[ch.client_id].submitted_at) {
        clientCheckins[ch.client_id] = ch;
      }
    });

    // Sort
    activeOnly.sort(function(a, b) {
      var aVal = a[clientsSortCol] || '';
      var bVal = b[clientsSortCol] || '';
      if (clientsSortCol === 'current_week') {
        aVal = a.current_week || 0;
        bVal = b.current_week || 0;
      }
      if (clientsSortCol === 'last_checkin') {
        aVal = clientCheckins[a.id] ? clientCheckins[a.id].submitted_at : '';
        bVal = clientCheckins[b.id] ? clientCheckins[b.id].submitted_at : '';
      }
      if (typeof aVal === 'string') aVal = aVal.toLowerCase();
      if (typeof bVal === 'string') bVal = bVal.toLowerCase();
      if (aVal < bVal) return clientsSortAsc ? -1 : 1;
      if (aVal > bVal) return clientsSortAsc ? 1 : -1;
      return 0;
    });

    if (activeOnly.length === 0) {
      document.getElementById('clients-tbody').innerHTML =
        '<tr><td colspan="5" class="empty-state"><div class="empty-icon">--</div>No active clients</td></tr>';
      return;
    }

    var rows = activeOnly.map(function(c) {
      var lastCheckin = clientCheckins[c.id];
      var programLabel = (c.program_type || c.program || '--').replace(/_/g, ' ');
      var weekNum = c.current_week || '--';
      var lastCheckinDate = lastCheckin ? timeAgo(lastCheckin.submitted_at) : 'No check-in';

      return '<tr>' +
        '<td><strong>' + escapeHtml(c.name || '--') + '</strong></td>' +
        '<td>' + escapeHtml(programLabel) + '</td>' +
        '<td>Week ' + weekNum + '</td>' +
        '<td>' + lastCheckinDate + '</td>' +
        '<td>' + statusBadge(c.status) + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('clients-tbody').innerHTML = rows;
  }

  // Clients table sort
  document.querySelectorAll('#clients-table th[data-sort]').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.dataset.sort;
      if (clientsSortCol === col) {
        clientsSortAsc = !clientsSortAsc;
      } else {
        clientsSortCol = col;
        clientsSortAsc = true;
      }
      document.querySelectorAll('#clients-table th').forEach(function(h) { h.classList.remove('sorted'); });
      th.classList.add('sorted');
      th.querySelector('.sort-arrow').innerHTML = clientsSortAsc ? '&#9650;' : '&#9660;';
      renderClients();
    });
  });

  // ===================== ESCALATIONS =====================
  function renderEscalations() {
    var container = document.getElementById('escalations-list');

    if (allEscalations.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div>No escalations pending. All clear!</div>';
      return;
    }

    var html = allEscalations.map(function(esc, idx) {
      var reason = esc.reason || esc.trigger || esc.body || 'Escalation requires attention';
      var clientName = esc.client_name || '';
      var phone = esc.phone || '';
      var meta = [];
      if (clientName) meta.push(clientName);
      if (phone) meta.push(maskPhone(phone));
      meta.push(timeAgo(esc.created_at));

      return '<div class="esc-card" data-idx="' + idx + '">' +
        '<div class="esc-header">' +
          '<div class="esc-reason">' + escapeHtml(reason) + '</div>' +
          '<span class="esc-priority">Needs Action</span>' +
        '</div>' +
        '<div class="esc-meta">' + escapeHtml(meta.join(' · ')) + '</div>' +
        '<button class="esc-resolve" data-id="' + (esc.id || '') + '">Mark Resolved</button>' +
        '</div>';
    }).join('');

    container.innerHTML = html;

    // Attach resolve handlers
    container.querySelectorAll('.esc-resolve').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var escId = btn.dataset.id;
        if (!escId || !sb) return;

        btn.disabled = true;
        btn.textContent = 'Resolving...';

        try {
          // Try escalations table first
          var result = await sb.from('escalations')
            .update({ resolved: true, resolved_at: new Date().toISOString() })
            .eq('id', escId);

          if (result.error) {
            // Fallback: try deleting from messages
            await sb.from('messages').delete().eq('id', escId);
          }

          btn.closest('.esc-card').style.opacity = '0.3';
          btn.textContent = 'Resolved';
          showToast('Escalation marked as resolved');

          // Remove from data
          allEscalations = allEscalations.filter(function(e) { return e.id !== escId; });

          // Update stats count
          setTimeout(loadDashboard, 1000);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Mark Resolved';
          showToast('Failed to resolve: ' + err.message, 'error');
        }
      });
    });
  }

  // ===================== QUICK ACTIONS =====================
  document.getElementById('btn-nudge-lead').addEventListener('click', function() {
    var leadName = prompt('Enter the lead name or phone number to nudge:');
    if (!leadName) return;

    var lead = allLeads.find(function(l) {
      return (l.name && l.name.toLowerCase().indexOf(leadName.toLowerCase()) !== -1) ||
             (l.phone && l.phone.indexOf(leadName) !== -1);
    });

    if (!lead) {
      showToast('Lead not found: ' + leadName, 'error');
      return;
    }

    showToast('Nudge sent to ' + (lead.name || maskPhone(lead.phone)));
    // In production, this would call the send-whatsapp API
  });

  document.getElementById('btn-view-folder').addEventListener('click', function() {
    var clientName = prompt('Enter client name to view folder:');
    if (!clientName) return;

    var client = allClients.find(function(c) {
      return c.name && c.name.toLowerCase().indexOf(clientName.toLowerCase()) !== -1;
    });

    if (!client) {
      showToast('Client not found: ' + clientName, 'error');
      return;
    }

    showToast('Opening folder for ' + client.name + '...');
    // In production, this would open the client's folder/detail view
  });

  document.getElementById('btn-resolve-all').addEventListener('click', async function() {
    if (allEscalations.length === 0) {
      showToast('No escalations to resolve');
      return;
    }

    if (!confirm('Mark all ' + allEscalations.length + ' escalations as resolved?')) return;

    try {
      if (sb) {
        var ids = allEscalations.map(function(e) { return e.id; }).filter(Boolean);
        if (ids.length > 0) {
          await sb.from('escalations')
            .update({ resolved: true, resolved_at: new Date().toISOString() })
            .in('id', ids);
        }
      }
      allEscalations = [];
      renderEscalations();
      showToast('All escalations resolved');
      setTimeout(loadDashboard, 500);
    } catch (err) {
      showToast('Error resolving escalations', 'error');
    }
  });

  // ===================== INIT =====================
  checkSession();
})();
</script>
</body>
</html>
