<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="../css/forms.css">
  <style>
    body { background: #1a1a1a; color: #E8E3DC; }

    .admin-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 24px;
      border-bottom: 1px solid #333;
      margin-bottom: 32px;
    }

    .admin-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #B8965A;
      text-decoration: none;
    }

    .admin-subtitle {
      font-size: 11px;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-section {
      max-width: 380px;
      margin: 80px auto;
      text-align: center;
    }

    .login-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: #E8E3DC;
      margin-bottom: 24px;
    }

    .login-input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #333;
      border-radius: 2px;
      background: #222;
      color: #E8E3DC;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 12px;
      outline: none;
    }

    .login-input:focus { border-color: #B8965A; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #B8965A;
      color: #1a1a1a;
      border: none;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .login-btn:hover { background: #D4AF7A; }

    .dashboard { display: none; }
    .dashboard.visible { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 20px;
      text-align: center;
    }

    .stat-card .num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      color: #B8965A;
      line-height: 1;
    }

    .stat-card .label {
      font-size: 10px;
      color: #888;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .section-heading {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #B8965A;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
    }

    .data-table th {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
    }

    .data-table td {
      font-size: 13px;
      padding: 10px 12px;
      border-bottom: 1px solid #2a2a2a;
      color: #ccc;
    }

    .data-table tr:hover td { background: #252525; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge-new { background: #2C3E50; color: #5DADE2; }
    .badge-qualified { background: #1E3A2F; color: #27AE60; }
    .badge-converted { background: #3D2E14; color: #B8965A; }
    .badge-dropped { background: #3D1F1F; color: #E74C3C; }
    .badge-active { background: #1E3A2F; color: #27AE60; }

    .escalation-card {
      background: #2a1a1a;
      border: 1px solid #4a2020;
      border-radius: 4px;
      padding: 14px 16px;
      margin-bottom: 8px;
    }

    .escalation-card .esc-reason {
      font-size: 13px;
      color: #E74C3C;
      margin-bottom: 4px;
    }

    .escalation-card .esc-meta {
      font-size: 11px;
      color: #777;
    }

    .program-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .program-pill {
      background: #222;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      color: #ccc;
    }

    .program-pill strong {
      color: #B8965A;
      margin-left: 6px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }

    .refresh-btn:hover { border-color: #B8965A; color: #B8965A; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 11px; }
      .data-table th, .data-table td { padding: 6px 8px; }
    }
  </style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-header">
    <div>
      <a href="/" class="admin-logo">Fitness by Maddy</a>
      <div class="admin-subtitle">Operations Dashboard</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" style="display:none" onclick="loadDashboard()">Refresh</button>
  </div>

  <div class="login-section" id="loginSection">
    <h2>Admin Access</h2>
    <input type="password" class="login-input" id="apiKeyInput" placeholder="Enter admin API key">
    <button class="login-btn" id="loginBtn">Access Dashboard</button>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-heading">Clients by Program</div>
    <div class="program-pills" id="programPills"></div>

    <div class="section-heading">Open Escalations</div>
    <div id="escalations"></div>

    <div class="section-heading">Recent Leads</div>
    <table class="data-table" id="leadsTable">
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="section-heading">Recent Clients</div>
    <table class="data-table" id="clientsTable">
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Program</th><th>Status</th><th>Paid</th><th>Started</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  var apiKey = localStorage.getItem('fbm_admin_key') || '';

  if (apiKey) {
    showDashboard();
    loadDashboard();
  }

  document.getElementById('loginBtn').addEventListener('click', function() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) return;
    localStorage.setItem('fbm_admin_key', apiKey);
    showDashboard();
    loadDashboard();
  });

  document.getElementById('apiKeyInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  function showDashboard() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboard').classList.add('visible');
    document.getElementById('refreshBtn').style.display = 'inline-block';
  }

  window.loadDashboard = function() {
    var grid = document.getElementById('statsGrid');
    grid.innerHTML = '<div class="loading">Loading...</div>';

    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + apiKey }
    })
    .then(function(res) {
      if (res.status === 401) {
        localStorage.removeItem('fbm_admin_key');
        location.reload();
        return;
      }
      return res.json();
    })
    .then(function(data) {
      if (!data) return;
      renderStats(data.summary);
      renderPrograms(data.clients_by_program);
      renderEscalations(data.escalations);
      renderLeads(data.recent_leads);
      renderClients(data.recent_clients);
    })
    .catch(function(err) {
      grid.innerHTML = '<div class="loading">Failed to load data. Check your API key.</div>';
    });
  };

  function renderStats(s) {
    var items = [
      { num: s.leads_today, label: 'Leads Today' },
      { num: s.leads_this_week, label: 'Leads This Week' },
      { num: s.conversion_rate, label: 'Conversion Rate' },
      { num: s.active_clients, label: 'Active Clients' },
      { num: s.pending_checkins, label: 'Pending Check-ins' },
      { num: s.programs_generated_this_week, label: 'Programs This Week' },
      { num: s.open_escalations, label: 'Escalations' }
    ];
    var html = '';
    items.forEach(function(item) {
      html += '<div class="stat-card"><div class="num">' + item.num + '</div><div class="label">' + item.label + '</div></div>';
    });
    document.getElementById('statsGrid').innerHTML = html;
  }

  function renderPrograms(progs) {
    var html = '';
    var labels = {
      '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
      'pcos': 'PCOS', '40plus': '40+', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
    };
    Object.keys(progs).forEach(function(key) {
      html += '<div class="program-pill">' + (labels[key] || key) + '<strong>' + progs[key] + '</strong></div>';
    });
    document.getElementById('programPills').innerHTML = html || '<div style="color:#666;font-size:13px">No active clients yet.</div>';
  }

  function renderEscalations(escs) {
    var html = '';
    if (!escs || escs.length === 0) {
      html = '<div style="color:#666;font-size:13px;margin-bottom:24px">No open escalations.</div>';
    } else {
      escs.forEach(function(e) {
        html += '<div class="escalation-card"><div class="esc-reason">' + esc(e.reason) + '</div>' +
          '<div class="esc-meta">' + esc(e.phone) + ' &middot; ' + formatDate(e.created_at) + '</div></div>';
      });
    }
    document.getElementById('escalations').innerHTML = html;
  }

  function renderLeads(leads) {
    var tbody = document.querySelector('#leadsTable tbody');
    var html = '';
    (leads || []).forEach(function(l) {
      html += '<tr><td>' + esc(l.name || '—') + '</td><td>' + esc(l.phone) + '</td>' +
        '<td><span class="badge badge-' + l.status + '">' + l.status + '</span></td>' +
        '<td>' + esc(l.program_interest || '—') + '</td>' +
        '<td>' + esc(l.market || '—') + '</td>' +
        '<td>' + formatDate(l.created_at) + '</td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="6" style="color:#666">No leads yet.</td></tr>';
  }

  function renderClients(clients) {
    var tbody = document.querySelector('#clientsTable tbody');
    var html = '';
    (clients || []).forEach(function(c) {
      var paid = c.paid_amount ? '$' + (c.paid_amount / 100).toFixed(0) : '—';
      html += '<tr><td>' + esc(c.name || '—') + '</td><td>' + esc(c.phone) + '</td>' +
        '<td>' + esc(c.program) + '</td>' +
        '<td><span class="badge badge-' + c.status + '">' + c.status + '</span></td>' +
        '<td>' + paid + '</td>' +
        '<td>' + formatDate(c.program_started_at) + '</td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="6" style="color:#666">No clients yet.</td></tr>';
  }

  function formatDate(d) {
    if (!d) return '—';
    var dt = new Date(d);
    return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function esc(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
