<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root { --bg: #0a0a0a; --card: #141414; --border: #222; --gold: #B8965A; --gold-light: #D4AF7A; --text: #e0e0e0; --muted: #888; --green: #27ae60; --red: #e74c3c; --blue: #3498db; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 48px; max-width: 400px; width: 100%; text-align: center; }
    .login-card h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 14px 16px; background: #1a1a1a; border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 16px; }
    .login-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #0a0a0a; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer; }
    .login-btn:hover { background: var(--gold-light); }
    .login-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

    .dashboard { display: none; }
    .dash-header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .dash-logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); letter-spacing: 2px; }
    .dash-user { font-size: 13px; color: var(--muted); }
    .dash-logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 4px; margin-left: 16px; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; margin: 32px 0 16px; }
    .data-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .data-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); padding: 12px 16px; border-bottom: 1px solid var(--border); background: #0f0f0f; }
    .data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #1a1a1a; }
    .data-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-radius: 3px; }
    .badge-new { background: rgba(52,152,219,0.15); color: var(--blue); }
    .badge-qualified { background: rgba(212,175,122,0.15); color: var(--gold-light); }
    .badge-converted { background: rgba(39,174,96,0.15); color: var(--green); }
    .badge-dropped { background: rgba(231,76,60,0.15); color: var(--red); }
    .badge-active { background: rgba(39,174,96,0.15); color: var(--green); }
    .badge-paused { background: rgba(212,175,122,0.15); color: var(--gold-light); }
    .badge-completed { background: rgba(136,136,136,0.15); color: var(--muted); }

    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tab { padding: 10px 20px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; background: var(--card); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--muted); transition: all 0.3s; }
    .tab.active { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }

    .escalation-card { background: #1a1208; border: 1px solid rgba(184,150,90,0.3); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .escalation-card .esc-title { font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 4px; }
    .escalation-card .esc-detail { font-size: 12px; color: var(--muted); }

    .empty-state { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-content { padding: 16px; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>FITNESS BY MADDY</h1>
    <p>Admin Dashboard</p>
    <input class="login-input" type="email" id="loginEmail" placeholder="Email">
    <input class="login-input" type="password" id="loginPassword" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="loginError">Invalid credentials</div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">FITNESS BY MADDY — OPS</div>
    <div>
      <span class="dash-user" id="dashUser"></span>
      <button class="dash-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('leads')">Leads</div>
      <div class="tab" onclick="switchTab('clients')">Clients</div>
      <div class="tab" onclick="switchTab('checkins')">Check-ins</div>
      <div class="tab" onclick="switchTab('escalations')">Escalations</div>
    </div>

    <div id="tabContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb = null;
var currentTab = 'leads';

async function doLogin() {
  var email = document.getElementById('loginEmail').value;
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  try {
    sb = window.supabase.createClient(
      document.querySelector('meta[name="sb-url"]')?.content || localStorage.getItem('sb_url') || '',
      document.querySelector('meta[name="sb-anon"]')?.content || localStorage.getItem('sb_anon') || ''
    );
    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error) throw error;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('dashUser').textContent = data.user.email;
    loadDashboard();
  } catch (err) {
    errEl.textContent = err.message || 'Invalid credentials';
    errEl.style.display = 'block';
  }
}

function doLogout() {
  if (sb) sb.auth.signOut();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function loadDashboard() {
  await loadStats();
  switchTab(currentTab);
}

async function loadStats() {
  var grid = document.getElementById('statsGrid');
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
  var weekStart = new Date(now.getTime() - 7 * 86400000).toISOString();

  var [leadsToday, leadsWeek, allLeads, activeClients, allClients, pendingCheckins, programsWeek] = await Promise.all([
    sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', todayStart),
    sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', weekStart),
    sb.from('leads').select('id, status', { count: 'exact' }),
    sb.from('clients').select('id', { count: 'exact', head: true }).eq('status', 'active'),
    sb.from('clients').select('id', { count: 'exact' }),
    sb.from('clients').select('id', { count: 'exact', head: true }).eq('status', 'active'),
    sb.from('programs').select('id', { count: 'exact', head: true }).gte('generated_at', weekStart),
  ]);

  var convertedCount = 0;
  var totalLeads = 0;
  if (allLeads.data) {
    totalLeads = allLeads.data.length;
    convertedCount = allLeads.data.filter(function(l) { return l.status === 'converted'; }).length;
  }
  var convRate = totalLeads > 0 ? Math.round((convertedCount / totalLeads) * 100) : 0;

  grid.innerHTML = ''
    + statCard('Leads Today', leadsToday.count || 0)
    + statCard('Leads This Week', leadsWeek.count || 0)
    + statCard('Conversion Rate', convRate + '%', convertedCount + ' of ' + totalLeads)
    + statCard('Active Clients', activeClients.count || 0)
    + statCard('Total Clients', allClients.count || 0)
    + statCard('Programs Generated', programsWeek.count || 0, 'This week');
}

function statCard(label, value, sub) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t) { if (t.textContent.toLowerCase() === tab) t.classList.add('active'); });
  if (tab === 'leads') loadLeads();
  else if (tab === 'clients') loadClients();
  else if (tab === 'checkins') loadCheckins();
  else if (tab === 'escalations') loadEscalations();
}

async function loadLeads() {
  var { data } = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(50);
  if (!data || data.length === 0) { document.getElementById('tabContent').innerHTML = '<div class="empty-state">No leads yet</div>'; return; }
  var rows = data.map(function(l) {
    return '<tr><td>' + (l.name || '—') + '</td><td>' + maskPhone(l.phone) + '</td><td><span class="badge badge-' + l.status + '">' + l.status + '</span></td><td>' + (l.program_interest || '—') + '</td><td>' + (l.market || '—') + '</td><td>' + fmtDate(l.created_at) + '</td></tr>';
  }).join('');
  document.getElementById('tabContent').innerHTML = '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function loadClients() {
  var { data } = await sb.from('clients').select('*').order('program_started_at', { ascending: false }).limit(50);
  if (!data || data.length === 0) { document.getElementById('tabContent').innerHTML = '<div class="empty-state">No clients yet</div>'; return; }
  var rows = data.map(function(c) {
    return '<tr><td>' + (c.name || '—') + '</td><td>' + maskPhone(c.phone) + '</td><td>' + (c.program || '—') + '</td><td><span class="badge badge-' + c.status + '">' + c.status + '</span></td><td>' + (c.paid_amount ? '$' + c.paid_amount : '—') + '</td><td>' + fmtDate(c.program_started_at) + '</td></tr>';
  }).join('');
  document.getElementById('tabContent').innerHTML = '<table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Program</th><th>Status</th><th>Paid</th><th>Started</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function loadCheckins() {
  var { data } = await sb.from('checkins').select('*, clients(name, phone)').order('form_submitted_at', { ascending: false }).limit(50);
  if (!data || data.length === 0) { document.getElementById('tabContent').innerHTML = '<div class="empty-state">No check-ins yet</div>'; return; }
  var rows = data.map(function(ci) {
    var name = ci.clients ? ci.clients.name : '—';
    return '<tr><td>' + name + '</td><td>Week ' + ci.week_no + '</td><td>' + (ci.weight ? ci.weight + 'kg' : '—') + '</td><td>' + (ci.compliance_score || '—') + '/10</td><td>' + (ci.energy || '—') + '/10</td><td>' + fmtDate(ci.form_submitted_at) + '</td></tr>';
  }).join('');
  document.getElementById('tabContent').innerHTML = '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Weight</th><th>Compliance</th><th>Energy</th><th>Submitted</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function loadEscalations() {
  var { data } = await sb.from('messages').select('*').eq('direction', 'out').like('body', '%ESCALATION%').order('sent_at', { ascending: false }).limit(20);
  if (!data || data.length === 0) { document.getElementById('tabContent').innerHTML = '<div class="empty-state">No escalations — all clear!</div>'; return; }
  var cards = data.map(function(m) {
    return '<div class="escalation-card"><div class="esc-title">' + maskPhone(m.phone) + '</div><div class="esc-detail">' + m.body + '</div><div class="esc-detail" style="margin-top:4px;color:#555">' + fmtDate(m.sent_at) + '</div></div>';
  }).join('');
  document.getElementById('tabContent').innerHTML = cards;
}

function maskPhone(phone) {
  if (!phone || phone.length < 6) return '***';
  return phone.slice(0, 4) + 'XXX...' + phone.slice(-3);
}

function fmtDate(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
</script>
</body>
</html>
