<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0D0D0D;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: white;
      min-height: 100vh;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 40px 20px 60px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
    .brand p { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 8px; }
    .week-badge {
      display: inline-block;
      background: rgba(184,150,90,0.15);
      color: var(--gold);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 8px 20px;
      border-radius: 4px;
      border: 1px solid rgba(184,150,90,0.3);
      margin-bottom: 32px;
    }
    .form-section { margin-bottom: 32px; }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slider-group { margin-bottom: 24px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
    }
    .slider {
      width: 100%;
      height: 6px;
      appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: none;
    }
    .photo-upload {
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload-icon { font-size: 32px; margin-bottom: 8px; }
    .photo-upload-text { font-size: 13px; color: rgba(255,255,255,0.5); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }
    .btn-submit:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status-msg {
      text-align: center;
      padding: 16px;
      border-radius: 4px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: rgba(46,125,50,0.2); color: #81C784; }
    .status-msg.error { display: block; background: rgba(211,47,47,0.2); color: #EF9A9A; }
    .required::after { content: ' *'; color: var(--gold); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Weekly Progress Check-In</p>
    </div>

    <div style="text-align:center">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
    </div>

    <form id="checkinForm">
      <div class="form-section">
        <div class="form-section-title">MEASUREMENTS</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Weight (kg)</label>
            <input type="number" class="form-input" name="weight" step="0.1" min="30" max="300" required>
          </div>
          <div class="form-group">
            <label class="form-label">Waist (inches)</label>
            <input type="number" class="form-input" name="waist" step="0.1" min="20" max="60">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">SELF ASSESSMENT</div>
        <div class="slider-group">
          <div class="slider-header">
            <label class="form-label">Plan Compliance</label>
            <span class="slider-value" id="complianceValue">7</span>
          </div>
          <input type="range" class="slider" name="compliance_score" min="1" max="10" value="7" id="complianceSlider">
        </div>
        <div class="slider-group">
          <div class="slider-header">
            <label class="form-label">Energy Level</label>
            <span class="slider-value" id="energyValue">7</span>
          </div>
          <input type="range" class="slider" name="energy" min="1" max="10" value="7" id="energySlider">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">NOTES</div>
        <div class="form-group">
          <label class="form-label">Issues / Challenges This Week</label>
          <textarea class="form-textarea" name="issues" placeholder="Any pain, soreness, schedule conflicts, diet struggles..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">PROGRESS PHOTOS</div>
        <div class="photo-upload" id="photoUpload">
          <div class="photo-upload-icon">📷</div>
          <div class="photo-upload-text">Tap to upload 3 photos (front, side, back)</div>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    var complianceSlider = document.getElementById('complianceSlider');
    var energySlider = document.getElementById('energySlider');
    complianceSlider.addEventListener('input', function() {
      document.getElementById('complianceValue').textContent = this.value;
    });
    energySlider.addEventListener('input', function() {
      document.getElementById('energyValue').textContent = this.value;
    });

    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photoInput');
    var photoPreview = document.getElementById('photoPreview');
    var uploadedPhotos = [];

    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function(e) {
      var files = Array.from(e.target.files).slice(0, 3);
      photoPreview.innerHTML = '';
      uploadedPhotos = [];
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = document.createElement('img');
          img.src = ev.target.result;
          photoPreview.appendChild(img);
          uploadedPhotos.push(ev.target.result);
        };
        reader.readAsDataURL(file);
      });
    });

    var form = document.getElementById('checkinForm');
    var statusMsg = document.getElementById('statusMsg');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!clientId) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      statusMsg.className = 'status-msg';

      var formData = new FormData(form);
      var data = {
        client_id: clientId,
        week_no: parseInt(weekNo),
        weight: parseFloat(formData.get('weight')),
        waist: formData.get('waist') ? parseFloat(formData.get('waist')) : null,
        compliance_score: parseInt(formData.get('compliance_score')),
        energy: parseInt(formData.get('energy')),
        issues: formData.get('issues') || '',
        photos_urls: uploadedPhotos
      };

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Check-in submitted! Your updated program will be sent shortly.';
          form.reset();
          photoPreview.innerHTML = '';
          document.getElementById('complianceValue').textContent = '7';
          document.getElementById('energyValue').textContent = '7';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Error: ' + err.message + '. Please try again.';
      })
      .finally(function() {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
