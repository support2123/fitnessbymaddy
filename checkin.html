<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header { background: var(--charcoal); padding: 40px 24px; text-align: center; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold-light); letter-spacing: 3px; margin-bottom: 4px; }
    .form-header .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      padding: 4px 14px; border-radius: 2px; margin-top: 8px;
    }
    .form-header p { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 8px; }

    .form-container { max-width: 520px; margin: -20px auto 40px; padding: 0 16px; }
    .form-card { background: white; border-radius: 8px; padding: 32px 28px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }

    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      color: var(--gold); margin: 24px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .required::after { content: ' *'; color: var(--error); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .slider-field { margin-bottom: 18px; }
    .slider-field label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 10px;
    }
    .slider-wrap { display: flex; align-items: center; gap: 12px; }
    .slider-wrap input[type="range"] {
      flex: 1; appearance: none; height: 6px; background: var(--light-grey);
      border-radius: 3px; outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 20px; height: 20px; background: var(--gold);
      border-radius: 50%; cursor: pointer;
    }
    .slider-val {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      background: var(--charcoal); color: var(--gold-light); font-weight: 600;
      font-size: 14px; border-radius: 4px;
    }

    .photo-upload { margin-bottom: 18px; }
    .photo-upload label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .photo-zone {
      border: 2px dashed var(--light-grey); border-radius: 8px; padding: 32px 16px;
      text-align: center; cursor: pointer; transition: border-color 0.3s;
    }
    .photo-zone:hover { border-color: var(--gold); }
    .photo-zone p { font-size: 13px; color: var(--mid-grey); }
    .photo-zone .icon { font-size: 28px; margin-bottom: 8px; }
    .photo-zone input { display: none; }
    .photo-previews { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-previews img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 2px solid var(--light-grey); }

    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 4px;
      transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status { text-align: center; padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 14px; display: none; }
    .status.error { display: block; background: #fdeaea; color: var(--error); }
    .status.success { display: block; background: #eafde7; color: var(--success); }

    .brand-footer { text-align: center; padding: 24px; font-size: 12px; color: var(--mid-grey); }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>FITNESS BY MADDY</h1>
    <div class="week-badge" id="weekBadge">WEEK —</div>
    <p>Weekly Progress Check-In</p>
  </div>

  <div class="form-container">
    <div class="form-card">
      <form id="checkinForm">
        <input type="hidden" id="client_id" name="client_id">
        <input type="hidden" id="week_no" name="week_no">

        <div class="form-section-title">BODY METRICS</div>

        <div class="row">
          <div class="field">
            <label class="required">Weight (kg)</label>
            <input type="number" id="weight" name="weight" required step="0.1" min="30" max="200" placeholder="65.0">
          </div>
          <div class="field">
            <label>Waist (cm)</label>
            <input type="number" id="waist" name="waist" step="0.1" min="40" max="200" placeholder="76.0">
          </div>
        </div>

        <div class="form-section-title">WEEKLY REVIEW</div>

        <div class="slider-field">
          <label class="required">Compliance — How well did you follow the plan? (1-10)</label>
          <div class="slider-wrap">
            <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
            <div class="slider-val" id="complianceVal">7</div>
          </div>
        </div>

        <div class="slider-field">
          <label class="required">Energy Level — How did you feel this week? (1-10)</label>
          <div class="slider-wrap">
            <input type="range" id="energy" name="energy" min="1" max="10" value="7">
            <div class="slider-val" id="energyVal">7</div>
          </div>
        </div>

        <div class="field">
          <label>Issues or Concerns</label>
          <textarea id="issues" name="issues" placeholder="Any pain, soreness, digestive issues, sleep problems, stress..."></textarea>
        </div>

        <div class="form-section-title">PROGRESS PHOTOS</div>

        <div class="photo-upload">
          <label>Upload up to 3 photos (front, side, back)</label>
          <div class="photo-zone" id="photoZone">
            <div class="icon">+</div>
            <p>Tap to upload photos</p>
            <input type="file" id="photoInput" accept="image/*" multiple>
          </div>
          <div class="photo-previews" id="photoPreviews"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <div class="brand-footer">fitnessbymaddy.com</div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var weekNo = params.get('w');

      if (clientId) document.getElementById('client_id').value = clientId;
      if (weekNo) {
        document.getElementById('week_no').value = weekNo;
        document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;
      }

      var compliance = document.getElementById('compliance');
      var energy = document.getElementById('energy');
      compliance.addEventListener('input', function() {
        document.getElementById('complianceVal').textContent = this.value;
      });
      energy.addEventListener('input', function() {
        document.getElementById('energyVal').textContent = this.value;
      });

      var photoZone = document.getElementById('photoZone');
      var photoInput = document.getElementById('photoInput');
      var previews = document.getElementById('photoPreviews');
      var selectedFiles = [];

      photoZone.addEventListener('click', function() { photoInput.click(); });
      photoInput.addEventListener('change', function() {
        var files = Array.from(this.files).slice(0, 3);
        selectedFiles = files;
        previews.innerHTML = '';
        files.forEach(function(file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = document.createElement('img');
            img.src = e.target.result;
            previews.appendChild(img);
          };
          reader.readAsDataURL(file);
        });
      });

      document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var status = document.getElementById('status');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';
        status.className = 'status';
        status.style.display = 'none';

        var data = {
          client_id: document.getElementById('client_id').value,
          week_no: document.getElementById('week_no').value,
          weight: document.getElementById('weight').value,
          waist: document.getElementById('waist').value,
          compliance_score: document.getElementById('compliance').value,
          energy: document.getElementById('energy').value,
          issues: document.getElementById('issues').value,
          photo_urls: [],
        };

        fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(result) {
          if (result.ok) {
            status.className = 'status success';
            status.textContent = 'Check-in submitted! Your updated program will be sent shortly.';
            btn.textContent = 'SUBMITTED';
          } else {
            throw new Error(result.data.error || 'Submission failed');
          }
        })
        .catch(function(err) {
          status.className = 'status error';
          status.textContent = err.message || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        });
      });
    })();
  </script>
</body>
</html>
