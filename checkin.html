<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #1a1a1a; color: #fff; }
    .checkin-wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
    .checkin-header { text-align: center; padding: 40px 0 32px; border-bottom: 2px solid #B8965A; margin-bottom: 32px; }
    .checkin-brand { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 6px; color: #B8965A; text-transform: uppercase; margin-bottom: 8px; }
    .checkin-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: #fff; }
    .checkin-sub { font-size: 13px; color: #888; margin-top: 8px; }
    .week-badge { display: inline-block; background: #B8965A; color: #1a1a1a; font-size: 12px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 4px; margin-top: 12px; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #B8965A; margin-bottom: 8px; }
    .field input, .field textarea {
      width: 100%; padding: 14px 16px; background: #222; border: 1.5px solid #333;
      border-radius: 4px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.3s;
    }
    .field input:focus, .field textarea:focus { border-color: #B8965A; }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .slider-wrap { padding: 8px 0; }
    .slider-wrap input[type="range"] {
      width: 100%; -webkit-appearance: none; background: #333; height: 6px; border-radius: 3px; outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #B8965A; border-radius: 50%; cursor: pointer; }
    .slider-val { text-align: center; font-size: 24px; font-weight: 600; color: #B8965A; margin-top: 8px; }
    .photo-upload { border: 2px dashed #333; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: #B8965A; }
    .photo-upload input { display: none; }
    .photo-upload-text { font-size: 13px; color: #888; }
    .photo-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .photo-preview img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; }
    .submit-btn {
      width: 100%; padding: 16px; background: #B8965A; color: #1a1a1a;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px;
      cursor: pointer; transition: background 0.3s; margin-top: 8px;
    }
    .submit-btn:hover { background: #D4AF7A; }
    .submit-btn:disabled { background: #555; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #B8965A; margin-bottom: 12px; }
    .success-msg p { font-size: 14px; color: #888; }
    .error-msg { background: #4a1c1c; color: #ff6b6b; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; display: none; }
  </style>
</head>
<body>
<div class="page-wrap" style="padding-top:0">
  <div class="checkin-wrap">
    <div class="checkin-header">
      <div class="checkin-brand">Fitness by Maddy</div>
      <div class="checkin-title">Weekly Check-in</div>
      <div class="checkin-sub">Track your progress — every number matters</div>
      <div class="week-badge" id="weekBadge">Week —</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" step="0.1" placeholder="65.0">
        </div>
        <div class="field">
          <label>Waist (inches)</label>
          <input type="number" name="waist" step="0.1" placeholder="30.5">
        </div>
      </div>

      <div class="field">
        <label>Compliance Score (1 = didn't follow, 10 = perfect)</label>
        <div class="slider-wrap">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="compSlider">
          <div class="slider-val" id="compVal">7</div>
        </div>
      </div>

      <div class="field">
        <label>Energy Level (1 = exhausted, 10 = amazing)</label>
        <div class="slider-wrap">
          <input type="range" name="energy" min="1" max="10" value="7" id="energySlider">
          <div class="slider-val" id="energyVal">7</div>
        </div>
      </div>

      <div class="field">
        <label>Issues / Notes</label>
        <textarea name="issues" placeholder="Any pain, soreness, sleep issues, stress, or anything you want to flag?"></textarea>
      </div>

      <div class="field">
        <label>Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <input type="file" accept="image/*" multiple id="photoInput" max="3">
          <div class="photo-upload-text">Tap to upload front, side & back photos</div>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-in</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-in Received!</h2>
      <p>Great work staying consistent. Your updated plan will be ready soon.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';
  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  document.getElementById('compSlider').addEventListener('input', function() {
    document.getElementById('compVal').textContent = this.value;
  });
  document.getElementById('energySlider').addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value;
  });

  var selectedFiles = [];
  document.getElementById('photoUpload').addEventListener('click', function() {
    document.getElementById('photoInput').click();
  });
  document.getElementById('photoInput').addEventListener('change', function(e) {
    selectedFiles = Array.from(e.target.files).slice(0, 3);
    var preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    selectedFiles.forEach(function(f) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = document.createElement('img');
        img.src = ev.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(f);
    });
  });

  function fileToBase64(file) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function() {
        resolve({
          base64: reader.result.split(',')[1],
          filename: file.name,
          contentType: file.type
        });
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var fd = new FormData(this);
    var data = { client_id: clientId, week_no: weekNo };
    fd.forEach(function(v, k) { data[k] = v; });

    Promise.all(selectedFiles.map(fileToBase64))
      .then(function(photos) {
        data.photos = photos;
        return fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(result) {
        if (result.ok) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errEl.textContent = result.data.error || 'Something went wrong.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Submit Check-in';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Check-in';
      });
  });
})();
</script>
</body>
</html>
