<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1A1A1A;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --error: #D32F2F;
      --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--cream);
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      color: var(--mid-grey);
      font-size: 14px;
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 8px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .slider-group {
      margin-bottom: 24px;
    }
    .slider-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 12px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      height: 6px;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      min-width: 30px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed rgba(184,150,90,0.4);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p {
      color: var(--mid-grey);
      font-size: 13px;
      margin-top: 8px;
    }
    .photo-preview {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .photo-preview img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--gold);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 16px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-message {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .form-message.success {
      display: block;
      background: rgba(46,125,50,0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .form-message.error {
      display: block;
      background: rgba(211,47,47,0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .required::after { content: ' *'; color: var(--error); }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <span class="week-badge" id="weekBadge">WEEK 1</span>
      <h1>Weekly Check-In</h1>
      <p>Quick update so we can optimise your next week</p>
    </div>

    <form id="checkinForm">
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="form-row">
        <div class="form-group">
          <label class="required">Weight (kg)</label>
          <input type="number" name="weight" required step="0.1" min="30" max="200" placeholder="65.5">
        </div>
        <div class="form-group">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" min="40" max="200" placeholder="72">
        </div>
      </div>

      <div class="slider-group">
        <label class="required">Program Compliance (1 = skipped most, 10 = nailed it)</label>
        <div class="slider-wrap">
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <span class="slider-val">7</span>
        </div>
      </div>

      <div class="slider-group">
        <label class="required">Energy Level (1 = exhausted, 10 = unstoppable)</label>
        <div class="slider-wrap">
          <input type="range" name="energy" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <span class="slider-val">7</span>
        </div>
      </div>

      <div class="form-group">
        <label>Issues / Notes</label>
        <textarea name="issues" placeholder="Any pain, sleep issues, cravings, schedule conflicts, questions..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos (front, side, back)</label>
        <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
          <p>Tap to upload up to 3 photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit">SUBMIT CHECK-IN</button>
      <div id="formMessage" class="form-message"></div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';

    document.getElementById('client_id').value = clientId || '';
    document.getElementById('week_no').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('photoInput').addEventListener('change', function() {
      const preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      Array.from(this.files).slice(0, 3).forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      const msg = document.getElementById('formMessage');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'form-message';
      msg.style.display = 'none';

      const formData = new FormData(this);
      const data = {
        client_id: document.getElementById('client_id').value,
        week_no: document.getElementById('week_no').value,
        weight: formData.get('weight'),
        waist: formData.get('waist') || null,
        compliance_score: formData.get('compliance_score'),
        energy: formData.get('energy'),
        issues: formData.get('issues') || null,
        photos_urls: []
      };

      try {
        const res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          msg.className = 'form-message success';
          msg.textContent = 'Check-in recorded! Your updated program is on the way.';
          msg.style.display = 'block';
          this.reset();
          document.getElementById('photoPreview').innerHTML = '';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      } catch (err) {
        msg.className = 'form-message error';
        msg.textContent = err.message;
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
