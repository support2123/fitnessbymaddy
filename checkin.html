<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly check-in to keep your program on track.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 40px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: white;
      letter-spacing: 3px;
    }
    .form-header p {
      color: var(--gold-light);
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 2px;
      margin-top: 12px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--charcoal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .slider-field {
      margin-bottom: 20px;
    }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--charcoal);
      min-width: 32px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      padding: 24px;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload span {
      font-size: 13px;
      color: var(--mid-grey);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <p>Track your progress, stay accountable</p>
    <div class="week-badge" id="weekBadge">Week 1</div>
  </div>

  <div class="form-container" id="formWrap">
    <form id="checkinForm">
      <input type="hidden" name="client_id" id="client_id">
      <input type="hidden" name="week_no" id="week_no">

      <div class="form-section">
        <div class="form-section-title">Body Stats</div>
        <div class="field-row">
          <div class="field">
            <label>Current Weight (kg) *</label>
            <input type="number" name="weight" required step="0.1" placeholder="70.5">
          </div>
          <div class="field">
            <label>Waist (cm)</label>
            <input type="number" name="waist" step="0.1" placeholder="80">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Self Assessment</div>
        <div class="slider-field">
          <label>Plan Compliance (how closely did you follow the plan?)</label>
          <div class="slider-wrap">
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span class="slider-val" id="compVal">7</span>
            <span style="font-size:11px;color:var(--mid-grey)">/10</span>
          </div>
        </div>
        <div class="slider-field">
          <label>Energy Level (how do you feel overall?)</label>
          <div class="slider-wrap">
            <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <span class="slider-val" id="energyVal">7</span>
            <span style="font-size:11px;color:var(--mid-grey)">/10</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Notes</div>
        <div class="field">
          <label>Any issues, challenges, or wins this week?</label>
          <textarea name="issues" placeholder="Missed 1 workout due to travel. Felt great on the nutrition plan. Sleep improved a lot."></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Progress Photos</div>
        <div class="field">
          <div class="photo-upload" onclick="document.getElementById('photos').click()">
            <input type="file" id="photos" name="photos" multiple accept="image/*">
            <span id="photoLabel">Tap to upload front, side, and back photos</span>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Check-In Submitted!</h2>
    <p>Great work staying consistent. Your coach will review this and your updated program will be sent via WhatsApp.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('client_id').value = clientId || '';
    document.getElementById('week_no').value = weekNo;
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

    document.getElementById('photos').addEventListener('change', function() {
      var count = this.files.length;
      document.getElementById('photoLabel').textContent =
        count > 0 ? count + ' photo(s) selected' : 'Tap to upload front, side, and back photos';
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var form = e.target;
      var data = {};
      var inputs = form.querySelectorAll('input, select, textarea');
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].name && inputs[i].type !== 'file') {
          data[inputs[i].name] = inputs[i].value;
        }
      }

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function() {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        alert('Something went wrong. Please try again.');
      });
    });
  </script>
</body>
</html>
