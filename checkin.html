<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      color: white;
      text-align: center;
      padding: 48px 24px 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      padding: 6px 20px;
      border-radius: 2px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 520px;
      margin: -20px auto 60px;
      background: white;
      border-radius: 2px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      padding: 40px 32px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      border-bottom: 1px solid var(--light-grey);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      background: var(--cream);
      color: var(--charcoal);
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .range-field { margin-bottom: 20px; }
    .range-field input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--light-grey);
      border: none;
      border-radius: 3px;
      padding: 0;
    }
    .range-field input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--gold);
      border-radius: 50%;
      cursor: pointer;
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .range-value {
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin: 8px 0;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
      border-radius: 2px;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p {
      font-size: 13px;
      color: var(--mid-grey);
    }
    .photo-preview {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .photo-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid var(--light-grey);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      background: #fff0f0;
      color: #c00;
      padding: 12px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    @media (max-width: 560px) {
      .form-container { margin: -20px 12px 40px; padding: 28px 20px; }
      .form-header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Weekly Check-In</h1>
  <div class="week-badge" id="weekBadge">WEEK 1</div>
</div>

<div class="form-container">
  <div class="error-msg" id="errorMsg"></div>

  <form id="checkinForm">
    <div class="form-section">
      <div class="form-section-title">Body Stats</div>
      <div class="field">
        <label for="weight">Current Weight (kg) *</label>
        <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
      </div>
      <div class="field">
        <label for="waist">Waist Measurement (inches)</label>
        <input type="number" id="waist" name="waist" step="0.1" min="15" max="70">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Weekly Ratings</div>
      <div class="range-field">
        <label>Program Compliance</label>
        <div class="range-value" id="complianceVal">7</div>
        <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
        <div class="range-labels"><span>1 — Barely followed</span><span>10 — Nailed it</span></div>
      </div>
      <div class="range-field">
        <label>Energy Levels</label>
        <div class="range-value" id="energyVal">7</div>
        <input type="range" id="energy" name="energy" min="1" max="10" value="7">
        <div class="range-labels"><span>1 — Exhausted</span><span>10 — Unstoppable</span></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Progress Photos</div>
      <div class="photo-upload" id="photoUpload">
        <p>Tap to upload front, side &amp; back photos</p>
        <input type="file" id="photos" name="photos" accept="image/*" multiple>
      </div>
      <div class="photo-preview" id="photoPreview"></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Notes</div>
      <div class="field">
        <label for="issues">Any issues, concerns, or wins this week?</label>
        <textarea id="issues" name="issues" placeholder="E.g., struggled with cravings, knee felt sore during squats, hit a new PR on deadlifts..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Check-In</button>
  </form>

  <div class="success-msg" id="successMsg">
    <h2>Check-In Received!</h2>
    <p>Great work staying consistent. Your updated program will be sent to you on WhatsApp shortly!</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  document.getElementById('compliance').addEventListener('input', function() {
    document.getElementById('complianceVal').textContent = this.value;
  });
  document.getElementById('energy').addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value;
  });

  document.getElementById('photoUpload').addEventListener('click', function() {
    document.getElementById('photos').click();
  });

  document.getElementById('photos').addEventListener('change', function() {
    var preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    var files = this.files;
    for (var i = 0; i < files.length && i < 5; i++) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(files[i]);
      preview.appendChild(img);
    }
  });

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var formData = {
      client_id: clientId,
      week_no: weekNo,
      weight: document.getElementById('weight').value,
      waist: document.getElementById('waist').value,
      compliance_score: document.getElementById('compliance').value,
      energy: document.getElementById('energy').value,
      issues: document.getElementById('issues').value,
      photos_urls: [],
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData),
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(result) {
      if (!result.ok) {
        throw new Error(result.data.error || 'Something went wrong');
      }
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    });
  });
})();
</script>

</body>
</html>
