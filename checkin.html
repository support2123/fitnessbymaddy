<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly check-in to track progress with Fitness by Maddy.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      text-align: center;
      padding: 48px 20px 32px;
      border-bottom: 1px solid var(--light-grey);
    }

    .form-header .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--charcoal);
      text-decoration: none;
      display: block;
      margin-bottom: 24px;
    }

    .form-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      color: var(--charcoal);
      margin-bottom: 8px;
    }

    .form-header .week-badge {
      display: inline-block;
      background: var(--sand);
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 12px;
    }

    .form-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .field-group {
      margin-bottom: 24px;
    }

    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .field-group label .required {
      color: var(--gold);
    }

    .field-group label .unit {
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--mid-grey);
    }

    .field-group input[type="number"],
    .field-group textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      background: #fff;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.3s;
      -webkit-appearance: none;
      appearance: none;
    }

    .field-group input:focus,
    .field-group textarea:focus {
      border-color: var(--gold);
    }

    .field-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Range slider */
    .slider-wrap {
      margin-top: 4px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .slider-value {
      text-align: center;
      font-size: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 8px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--light-grey);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    /* File upload */
    .file-upload-area {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
    }

    .file-upload-area:hover {
      border-color: var(--gold-light);
      background: rgba(184, 150, 90, 0.03);
    }

    .file-upload-area .upload-icon {
      font-size: 32px;
      color: var(--light-grey);
      margin-bottom: 8px;
    }

    .file-upload-area p {
      font-size: 14px;
      color: var(--mid-grey);
    }

    .file-upload-area p span {
      color: var(--gold);
      font-weight: 500;
    }

    .file-upload-area .hint {
      font-size: 12px;
      color: var(--light-grey);
      margin-top: 4px;
    }

    .file-upload-area input[type="file"] {
      display: none;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--sand);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(44, 44, 44, 0.7);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .btn-submit {
      width: 100%;
      background: var(--charcoal);
      color: #fff;
      padding: 16px 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 16px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--gold);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success-message {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }

    .success-message .check-icon {
      width: 64px;
      height: 64px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--gold);
      font-size: 28px;
    }

    .success-message h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .success-message p {
      font-size: 15px;
      color: var(--mid-grey);
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto;
    }

    .error-message {
      display: none;
      background: #fdf2f2;
      border: 1px solid #e8c4c4;
      color: #8b3a3a;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    @media (min-width: 600px) {
      .form-header {
        padding: 64px 20px 40px;
      }

      .form-header h1 {
        font-size: 40px;
      }

      .form-container {
        padding: 40px 20px 80px;
      }
    }
  </style>
</head>
<body>

  <div class="form-header">
    <a class="logo" href="index.html">Fitness by Maddy</a>
    <h1>Weekly Check-in</h1>
    <div class="week-badge" id="weekBadge">Week 1</div>
  </div>

  <div class="form-container">
    <div class="error-message" id="errorMsg"></div>

    <form id="checkinForm" novalidate>
      <div class="field-group">
        <label for="weight">Current Weight <span class="unit">(kg)</span> <span class="required">*</span></label>
        <input type="number" id="weight" name="weight_kg" required min="20" max="300" step="0.1" placeholder="65.5">
      </div>

      <div class="field-group">
        <label for="waist">Waist Measurement <span class="unit">(cm or inches)</span></label>
        <input type="number" id="waist" name="waist_measurement" min="0" max="200" step="0.1" placeholder="32">
      </div>

      <div class="field-group">
        <label>How well did you follow the plan?</label>
        <div class="slider-wrap">
          <div class="slider-value" id="adherenceValue">5</div>
          <input type="range" id="adherence" name="plan_adherence" min="1" max="10" value="5">
          <div class="slider-labels">
            <span>1 &mdash; Barely</span>
            <span>10 &mdash; Perfectly</span>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label>Energy Level This Week</label>
        <div class="slider-wrap">
          <div class="slider-value" id="energyValue">5</div>
          <input type="range" id="energy" name="energy_level" min="1" max="10" value="5">
          <div class="slider-labels">
            <span>1 &mdash; Exhausted</span>
            <span>10 &mdash; Energized</span>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="concerns">Any issues, pain, or concerns?</label>
        <textarea id="concerns" name="concerns" placeholder="Mention anything that came up this week"></textarea>
      </div>

      <div class="field-group">
        <label>Progress Photos <span class="unit">(max 3)</span></label>
        <div class="file-upload-area" id="uploadArea">
          <div class="upload-icon">&#128247;</div>
          <p><span>Tap to upload</span> or drag photos here</p>
          <p class="hint">JPG, PNG up to 5MB each</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Check-in</button>
    </form>

    <div class="success-message" id="successMsg">
      <div class="check-icon">&#10003;</div>
      <h2>Check-in Submitted!</h2>
      <p>Great work staying consistent. Maddy will review your progress and update your plan if needed.</p>
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('c') || params.get('client_id') || '';
      const weekNo = params.get('w') || params.get('week_no') || '1';

      document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

      // Slider interactivity
      var adherenceSlider = document.getElementById('adherence');
      var adherenceValue = document.getElementById('adherenceValue');
      adherenceSlider.addEventListener('input', function() {
        adherenceValue.textContent = this.value;
      });

      var energySlider = document.getElementById('energy');
      var energyValue = document.getElementById('energyValue');
      energySlider.addEventListener('input', function() {
        energyValue.textContent = this.value;
      });

      // Photo upload handling
      var uploadArea = document.getElementById('uploadArea');
      var photoInput = document.getElementById('photoInput');
      var previewGrid = document.getElementById('previewGrid');
      var selectedFiles = [];
      var MAX_FILES = 3;
      var MAX_SIZE = 5 * 1024 * 1024; // 5MB

      uploadArea.addEventListener('click', function() {
        photoInput.click();
      });

      uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        uploadArea.style.borderColor = 'var(--gold)';
      });

      uploadArea.addEventListener('dragleave', function() {
        uploadArea.style.borderColor = '';
      });

      uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        uploadArea.style.borderColor = '';
        handleFiles(e.dataTransfer.files);
      });

      photoInput.addEventListener('change', function() {
        handleFiles(this.files);
        this.value = '';
      });

      function handleFiles(files) {
        var newFiles = Array.from(files).filter(function(f) {
          return f.type.startsWith('image/') && f.size <= MAX_SIZE;
        });

        var remaining = MAX_FILES - selectedFiles.length;
        newFiles = newFiles.slice(0, remaining);
        selectedFiles = selectedFiles.concat(newFiles);
        renderPreviews();
      }

      function renderPreviews() {
        previewGrid.innerHTML = '';
        selectedFiles.forEach(function(file, idx) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = '<img src="' + e.target.result + '" alt="Preview">' +
              '<button type="button" class="remove-btn" data-idx="' + idx + '">&times;</button>';
            previewGrid.appendChild(item);

            item.querySelector('.remove-btn').addEventListener('click', function() {
              selectedFiles.splice(parseInt(this.getAttribute('data-idx')), 1);
              renderPreviews();
            });
          };
          reader.readAsDataURL(file);
        });

        if (selectedFiles.length >= MAX_FILES) {
          uploadArea.style.display = 'none';
        } else {
          uploadArea.style.display = '';
        }
      }

      // Convert files to base64
      function filesToBase64(files) {
        return Promise.all(files.map(function(file) {
          return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function() { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }));
      }

      // Form submission
      var form = document.getElementById('checkinForm');
      var submitBtn = document.getElementById('submitBtn');
      var errorMsg = document.getElementById('errorMsg');
      var successMsg = document.getElementById('successMsg');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorMsg.style.display = 'none';

        var weightVal = form.weight_kg.value;
        if (!weightVal) {
          errorMsg.textContent = 'Please enter your current weight.';
          errorMsg.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Uploading...';

        try {
          var photosData = [];
          if (selectedFiles.length > 0) {
            photosData = await filesToBase64(selectedFiles);
          }

          var payload = {
            client_id: clientId,
            week_no: parseInt(weekNo, 10),
            weight_kg: parseFloat(weightVal),
            waist_measurement: form.waist_measurement.value ? parseFloat(form.waist_measurement.value) : null,
            plan_adherence: parseInt(adherenceSlider.value, 10),
            energy_level: parseInt(energySlider.value, 10),
            concerns: form.concerns.value.trim(),
            photos_data: photosData
          };

          var res = await fetch('/api/checkin-submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            var data = await res.json().catch(function() { return {}; });
            throw new Error(data.error || 'Something went wrong. Please try again.');
          }

          form.style.display = 'none';
          successMsg.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Check-in';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    })();
  </script>

</body>
</html>
