<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 12px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 16px; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-value { min-width: 24px; text-align: center; font-weight: 600; color: var(--gold); }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 24px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Weekly Progress</p>
      <h1 class="section-title">Check-in <em>Week <span id="weekDisplay">-</span></em></h1>
      <p class="section-body" style="margin: 16px auto 0;">Track your progress. Be honest — that's how we optimise your next week.</p>
    </div>

    <div class="form-card" id="checkinForm">
      <form id="checkin" onsubmit="submitCheckin(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input class="form-input" type="number" name="weight" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Waist (inches)</label>
            <input class="form-input" type="number" name="waist" step="0.1">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Workout Compliance (1-10) *</label>
          <div class="range-group">
            <span style="font-size:12px; color:var(--mid-grey)">Low</span>
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span style="font-size:12px; color:var(--mid-grey)">High</span>
            <span class="range-value" id="compVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Energy Level (1-10) *</label>
          <div class="range-group">
            <span style="font-size:12px; color:var(--mid-grey)">Low</span>
            <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <span style="font-size:12px; color:var(--mid-grey)">High</span>
            <span class="range-value" id="energyVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Issues / Concerns This Week</label>
          <textarea class="form-textarea" name="issues" placeholder="Any struggles, soreness, sleep issues, stress, diet slip-ups..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Progress Photos (Front, Side, Back)</label>
          <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
            <p style="font-size:13px; color:var(--mid-grey);">Click to upload up to 3 photos</p>
            <input type="file" id="photoInput" accept="image/*" multiple onchange="previewPhotos(this)">
          </div>
          <div class="photo-preview" id="photoPreview"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Check-in</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Check-in Submitted!</h2>
      <p class="section-body">Your coach will review your progress and your next week's plan will be sent via WhatsApp.</p>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w');
  document.getElementById('weekDisplay').textContent = weekNo || '-';

  function previewPhotos(input) {
    var preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    var files = Array.from(input.files).slice(0, 3);
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.createElement('img');
        img.src = e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitCheckin(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = document.getElementById('checkin');
    var formData = Object.fromEntries(new FormData(form));

    var photoFiles = document.getElementById('photoInput').files;
    var photoUrls = [];

    if (photoFiles.length > 0) {
      for (var i = 0; i < Math.min(photoFiles.length, 3); i++) {
        var file = photoFiles[i];
        var uploadData = new FormData();
        uploadData.append('file', file);
        uploadData.append('client_id', clientId);
        uploadData.append('week_no', weekNo);
        try {
          var uploadRes = await fetch('/api/upload-photo', { method: 'POST', body: uploadData });
          if (uploadRes.ok) {
            var result = await uploadRes.json();
            photoUrls.push(result.url);
          }
        } catch (err) { /* continue without photo */ }
      }
    }

    var payload = {
      client_id: clientId,
      week_no: weekNo,
      weight: formData.weight,
      waist: formData.waist,
      compliance_score: formData.compliance_score,
      energy: formData.energy,
      issues: formData.issues,
      photos_urls: photoUrls,
    };

    try {
      var res = await fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        document.getElementById('checkinForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Check-in';
        alert('Something went wrong. Please try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Submit Check-in';
      alert('Network error. Please check your connection.');
    }
  }
</script>
</body>
</html>
