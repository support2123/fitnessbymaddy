<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly progress check-in for Fitness by Maddy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 2px;
      margin-top: 10px;
    }
    .form-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--charcoal);
      letter-spacing: 2px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .required::after { content: ' *'; color: var(--gold); }
    .slider-field { margin-bottom: 24px; }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      height: 6px;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      min-width: 36px;
      text-align: center;
    }
    .photo-upload {
      margin-bottom: 20px;
    }
    .photo-upload label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .photo-drop {
      border: 2px dashed var(--light-grey);
      border-radius: 4px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-drop:hover { border-color: var(--gold); }
    .photo-drop p { font-size: 13px; color: var(--mid-grey); }
    .photo-drop input { display: none; }
    .photo-preview {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .photo-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid var(--light-grey);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>WEEKLY CHECK-IN</h1>
    <div class="week-badge" id="weekBadge">WEEK —</div>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <div class="form-section-title">BODY METRICS</div>
      <div class="field-row">
        <div class="field">
          <label class="required">Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required placeholder="e.g. 72.5">
        </div>
        <div class="field">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" placeholder="e.g. 82">
        </div>
      </div>

      <div class="form-section-title" style="margin-top:32px">SELF-ASSESSMENT</div>
      <div class="slider-field">
        <label class="required">Compliance Score — how well did you follow the plan?</label>
        <div class="slider-row">
          <span style="font-size:11px;color:var(--mid-grey)">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:11px;color:var(--mid-grey)">Perfect</span>
          <span class="slider-val" id="compVal">7</span>
        </div>
      </div>
      <div class="slider-field">
        <label class="required">Energy Level — how did you feel this week?</label>
        <div class="slider-row">
          <span style="font-size:11px;color:var(--mid-grey)">Drained</span>
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:11px;color:var(--mid-grey)">Amazing</span>
          <span class="slider-val" id="energyVal">7</span>
        </div>
      </div>

      <div class="form-section-title" style="margin-top:32px">NOTES</div>
      <div class="field">
        <label>Any issues, struggles, or wins this week?</label>
        <textarea name="issues" placeholder="Tell us how the week went — struggles, wins, anything you want us to know..."></textarea>
      </div>

      <div class="form-section-title" style="margin-top:32px">PROGRESS PHOTOS</div>
      <div class="photo-upload">
        <label>Upload up to 3 photos (front, side, back)</label>
        <div class="photo-drop" id="photoDrop">
          <p>Tap to upload or drag photos here</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Great job staying consistent. Your coach will review your progress and your updated plan will be sent shortly.</p>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var weekNo = params.get('w');

      if (weekNo) {
        document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;
      }

      var photoDrop = document.getElementById('photoDrop');
      var photoInput = document.getElementById('photoInput');
      var photoPreview = document.getElementById('photoPreview');
      var selectedFiles = [];

      photoDrop.addEventListener('click', function() { photoInput.click(); });
      photoDrop.addEventListener('dragover', function(e) { e.preventDefault(); photoDrop.style.borderColor = '#B8965A'; });
      photoDrop.addEventListener('dragleave', function() { photoDrop.style.borderColor = '#E8E3DC'; });
      photoDrop.addEventListener('drop', function(e) {
        e.preventDefault();
        photoDrop.style.borderColor = '#E8E3DC';
        handleFiles(e.dataTransfer.files);
      });
      photoInput.addEventListener('change', function() { handleFiles(this.files); });

      function handleFiles(files) {
        for (var i = 0; i < Math.min(files.length, 3 - selectedFiles.length); i++) {
          selectedFiles.push(files[i]);
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = document.createElement('img');
            img.src = e.target.result;
            photoPreview.appendChild(img);
          };
          reader.readAsDataURL(files[i]);
        }
      }

      document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var errEl = document.getElementById('errorMsg');
        errEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';

        var fd = new FormData(this);
        var data = {
          client_id: clientId,
          week_no: weekNo,
          weight: fd.get('weight'),
          waist: fd.get('waist'),
          compliance_score: fd.get('compliance_score'),
          energy: fd.get('energy'),
          issues: fd.get('issues'),
          photos_urls: []
        };

        fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, body: j }; }); })
        .then(function(res) {
          if (res.ok) {
            document.getElementById('checkinForm').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          } else {
            errEl.textContent = res.body.error || 'Something went wrong. Please try again.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'SUBMIT CHECK-IN';
          }
        })
        .catch(function() {
          errEl.textContent = 'Network error. Please check your connection and try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        });
      });
    })();
  </script>
</body>
</html>
