<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Weekly check-in form for Fitness by Maddy coaching clients.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkin-wrap { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .checkin-header { text-align: center; margin-bottom: 48px; }
    .checkin-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6B6B; margin-bottom: 8px; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 14px 16px; border: 1.5px solid #E8E3DC; border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: #2C2C2C;
      background: #FAF8F4; transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #B8965A; }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select { appearance: none; }
    .range-group { display: flex; align-items: center; gap: 16px; }
    .range-input { flex: 1; accent-color: #B8965A; }
    .range-value { font-size: 20px; font-weight: 600; color: #2C2C2C; min-width: 32px; text-align: center; }
    .photo-upload { border: 2px dashed #E8E3DC; border-radius: 4px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: #B8965A; }
    .photo-upload input { display: none; }
    .photo-upload-text { font-size: 13px; color: #6B6B6B; }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .submit-btn {
      width: 100%; padding: 16px; background: #2C2C2C; color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .submit-btn:hover { background: #B8965A; }
    .submit-btn:disabled { background: #C8B89A; cursor: not-allowed; }
    .week-badge {
      display: inline-block; background: #B8965A; color: white;
      font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
    }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #2C2C2C; margin-bottom: 12px; }
    .success-msg p { color: #6B6B6B; font-size: 15px; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="checkin-wrap">
  <div class="checkin-header">
    <div class="week-badge" id="weekBadge">Week —</div>
    <h1 class="section-title">Weekly <em>Check-In</em></h1>
    <p class="section-body" style="margin:0 auto">Track your progress, share your wins, and let us know how you're feeling.</p>
  </div>

  <form id="checkinForm" class="checkin-form">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="weight">Current Weight (kg) *</label>
        <input class="form-input" type="number" id="weight" name="weight" step="0.1" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="waist">Waist Measurement (cm)</label>
        <input class="form-input" type="number" id="waist" name="waist" step="0.1">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Program Compliance (1 = barely followed, 10 = perfect) *</label>
      <div class="range-group">
        <input class="range-input" type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
        <span class="range-value" id="complianceValue">7</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Energy Level (1 = exhausted, 10 = full of energy) *</label>
      <div class="range-group">
        <input class="range-input" type="range" id="energy" name="energy" min="1" max="10" value="7">
        <span class="range-value" id="energyValue">7</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="issues">Issues, Challenges, or Wins This Week</label>
      <textarea class="form-textarea" id="issues" name="issues" placeholder="What went well? What was tough? Any pain, soreness, or life changes?"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Progress Photos (Front, Side, Back — up to 3)</label>
      <div class="photo-upload" id="photoUpload">
        <input type="file" id="photoInput" accept="image/*" multiple>
        <p class="photo-upload-text">Tap to upload photos (max 3)</p>
      </div>
      <div class="photo-preview" id="photoPreview"></div>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
  </form>

  <div id="successMsg" class="success-msg">
    <h2>Check-In Complete!</h2>
    <p>Great work staying consistent. Your updated program will be sent to your WhatsApp shortly.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w');
  var selectedFiles = [];

  if (weekNo) {
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;
  }

  document.getElementById('compliance').addEventListener('input', function() {
    document.getElementById('complianceValue').textContent = this.value;
  });
  document.getElementById('energy').addEventListener('input', function() {
    document.getElementById('energyValue').textContent = this.value;
  });

  document.getElementById('photoUpload').addEventListener('click', function() {
    document.getElementById('photoInput').click();
  });

  document.getElementById('photoInput').addEventListener('change', function(e) {
    var files = Array.from(e.target.files).slice(0, 3);
    selectedFiles = files;
    var preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = document.createElement('img');
        img.src = ev.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  function fileToBase64(file) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function() {
        var base64 = reader.result.split(',')[1];
        resolve({ base64: base64, name: file.name, type: file.type });
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errorEl = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    errorEl.style.display = 'none';

    Promise.all(selectedFiles.map(fileToBase64)).then(function(photos) {
      var data = {
        client_id: clientId,
        week_no: weekNo,
        weight: document.getElementById('weight').value,
        waist: document.getElementById('waist').value,
        compliance_score: document.getElementById('compliance').value,
        energy: document.getElementById('energy').value,
        issues: document.getElementById('issues').value,
        photos: photos
      };

      return fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    })
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.success) {
        document.getElementById('checkinForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        errorEl.textContent = result.error || 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    })
    .catch(function() {
      errorEl.textContent = 'Network error. Please check your connection and try again.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    });
  });
})();
</script>
<script src="js/nav.js"></script>
</body>
</html>
