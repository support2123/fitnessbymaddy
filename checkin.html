<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #B8965A; --charcoal: #2C2C2C; --cream: #FAF8F4; --mid-grey: #6B6B6B; --light-grey: #E8E3DC; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header { background: var(--charcoal); padding: 40px 24px; text-align: center; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); letter-spacing: 3px; }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; padding: 4px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px; margin-top: 12px; }
    .form-wrap { max-width: 520px; margin: 0 auto; padding: 40px 24px 60px; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; outline: none; transition: border-color 0.3s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-section { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 2px; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--light-grey); }
    .range-group { position: relative; }
    .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--mid-grey); margin-top: 4px; }
    .range-value { text-align: center; font-size: 28px; font-weight: 600; color: var(--gold); margin-bottom: 8px; font-family: 'Bebas Neue', sans-serif; }
    input[type="range"] {
      width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
      background: var(--light-grey); border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: var(--gold); cursor: pointer; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-upload .icon { font-size: 32px; margin-bottom: 8px; }
    .photo-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-previews img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 2px solid var(--light-grey); }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg { background: #fef2f2; color: #991b1b; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <p>Let's see how your week went</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-wrap" id="formContainer">
    <div class="error-msg" id="errorMsg"></div>
    <form id="checkinForm" novalidate>

      <div class="form-section">Body Stats</div>

      <div class="form-group">
        <label class="form-label">Current Weight (kg) *</label>
        <input class="form-input" type="number" name="weight" step="0.1" min="30" max="300" required>
      </div>
      <div class="form-group">
        <label class="form-label">Waist Measurement (cm)</label>
        <input class="form-input" type="number" name="waist" step="0.1" min="40" max="200">
      </div>

      <div class="form-section">Self Assessment</div>

      <div class="form-group range-group">
        <label class="form-label">How well did you follow the plan? *</label>
        <div class="range-value" id="complianceVal">7</div>
        <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceRange">
        <div class="range-labels"><span>1 — Barely</span><span>10 — Perfectly</span></div>
      </div>
      <div class="form-group range-group">
        <label class="form-label">Energy Level This Week *</label>
        <div class="range-value" id="energyVal">7</div>
        <input type="range" name="energy" min="1" max="10" value="7" id="energyRange">
        <div class="range-labels"><span>1 — Exhausted</span><span>10 — Energised</span></div>
      </div>

      <div class="form-section">Notes</div>

      <div class="form-group">
        <label class="form-label">Any Issues or Challenges?</label>
        <textarea class="form-textarea" name="issues" placeholder="Missed sessions, felt sore, had cravings, any pain..."></textarea>
      </div>

      <div class="form-section">Progress Photos</div>

      <div class="form-group">
        <label class="photo-upload" id="photoLabel">
          <div class="icon">+</div>
          <p>Tap to upload 3 progress photos<br>(front, side, back)</p>
          <input type="file" name="photos" accept="image/*" multiple style="display:none" id="photoInput">
        </label>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Check-In</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Check-In Submitted!</h2>
    <p>Great work staying consistent. Maddy will review your progress and your updated program will be on its way soon.</p>
  </div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';
  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  document.getElementById('complianceRange').addEventListener('input', function() {
    document.getElementById('complianceVal').textContent = this.value;
  });
  document.getElementById('energyRange').addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value;
  });

  document.getElementById('photoInput').addEventListener('change', function() {
    var container = document.getElementById('photoPreviews');
    container.innerHTML = '';
    for (var i = 0; i < this.files.length && i < 3; i++) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(this.files[i]);
      container.appendChild(img);
    }
  });

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var data = {
      client_id: clientId,
      week_no: weekNo,
      weight: this.weight.value,
      waist: this.waist.value,
      compliance_score: this.compliance_score.value,
      energy: this.energy.value,
      issues: this.issues.value,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, body: j }; }); })
    .then(function(res) {
      if (!res.ok) throw new Error(res.body.error || 'Submission failed');
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    });
  });
})();
</script>
</body>
</html>
