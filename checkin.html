<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">
  <div class="form-header">
    <a class="form-logo" href="index.html">Fitness by Maddy</a>
    <p class="form-subtitle">Weekly Check-In</p>
  </div>

  <form id="checkinForm" class="brand-form">
    <input type="hidden" id="clientId" name="client_id">
    <input type="hidden" id="weekNo" name="week_no">

    <div class="form-week-badge" id="weekBadge">Week —</div>

    <div class="form-section">
      <h3 class="form-section-title">Body Metrics</h3>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="weight">Weight (kg) *</label>
          <input class="form-input" type="number" id="weight" name="weight" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="waist">Waist (cm)</label>
          <input class="form-input" type="number" id="waist" name="waist" step="0.1">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Self-Assessment</h3>

      <div class="form-group">
        <label class="form-label">Compliance (how well did you follow the plan?) *</label>
        <div class="rating-group" id="complianceRating">
          <button type="button" class="rating-btn" data-value="1">1</button>
          <button type="button" class="rating-btn" data-value="2">2</button>
          <button type="button" class="rating-btn" data-value="3">3</button>
          <button type="button" class="rating-btn" data-value="4">4</button>
          <button type="button" class="rating-btn" data-value="5">5</button>
          <button type="button" class="rating-btn" data-value="6">6</button>
          <button type="button" class="rating-btn" data-value="7">7</button>
          <button type="button" class="rating-btn" data-value="8">8</button>
          <button type="button" class="rating-btn" data-value="9">9</button>
          <button type="button" class="rating-btn" data-value="10">10</button>
        </div>
        <input type="hidden" id="compliance_score" name="compliance_score" required>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level *</label>
        <div class="rating-group" id="energyRating">
          <button type="button" class="rating-btn" data-value="1">1</button>
          <button type="button" class="rating-btn" data-value="2">2</button>
          <button type="button" class="rating-btn" data-value="3">3</button>
          <button type="button" class="rating-btn" data-value="4">4</button>
          <button type="button" class="rating-btn" data-value="5">5</button>
          <button type="button" class="rating-btn" data-value="6">6</button>
          <button type="button" class="rating-btn" data-value="7">7</button>
          <button type="button" class="rating-btn" data-value="8">8</button>
          <button type="button" class="rating-btn" data-value="9">9</button>
          <button type="button" class="rating-btn" data-value="10">10</button>
        </div>
        <input type="hidden" id="energy" name="energy" required>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Notes & Photos</h3>

      <div class="form-group">
        <label class="form-label" for="issues">Any issues, concerns, or feedback?</label>
        <textarea class="form-input" id="issues" name="issues" rows="4" placeholder="Soreness, sleep issues, motivation, schedule changes, etc."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (front, side, back)</label>
        <div class="photo-upload-grid">
          <label class="photo-upload-box">
            <input type="file" accept="image/*" data-slot="front" class="photo-input">
            <span class="photo-placeholder">Front</span>
          </label>
          <label class="photo-upload-box">
            <input type="file" accept="image/*" data-slot="side" class="photo-input">
            <span class="photo-placeholder">Side</span>
          </label>
          <label class="photo-upload-box">
            <input type="file" accept="image/*" data-slot="back" class="photo-input">
            <span class="photo-placeholder">Back</span>
          </label>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-primary form-submit">Submit Check-In</button>
    <p class="form-footer-note">Your check-in helps us optimize your next week's program.</p>
  </form>

  <div id="successMessage" class="form-success" style="display:none;">
    <div class="success-icon">✓</div>
    <h3>Check-In Submitted!</h3>
    <p>Your data has been recorded. Your updated program will be sent shortly via WhatsApp.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w');

  if (clientId) document.getElementById('clientId').value = clientId;
  if (weekNo) {
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;
  }

  function setupRating(containerId, hiddenId) {
    var container = document.getElementById(containerId);
    var hidden = document.getElementById(hiddenId);
    container.addEventListener('click', function(e) {
      if (e.target.classList.contains('rating-btn')) {
        container.querySelectorAll('.rating-btn').forEach(function(b) { b.classList.remove('active'); });
        e.target.classList.add('active');
        hidden.value = e.target.getAttribute('data-value');
      }
    });
  }

  setupRating('complianceRating', 'compliance_score');
  setupRating('energyRating', 'energy');

  document.querySelectorAll('.photo-input').forEach(function(input) {
    input.addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        var box = e.target.closest('.photo-upload-box');
        box.classList.add('has-photo');
        box.querySelector('.photo-placeholder').textContent = file.name.slice(0, 15);
      }
    });
  });

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var btn = form.querySelector('.form-submit');

    if (!document.getElementById('compliance_score').value || !document.getElementById('energy').value) {
      alert('Please rate your compliance and energy level.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      client_id: document.getElementById('clientId').value,
      week_no: document.getElementById('weekNo').value,
      weight: document.getElementById('weight').value,
      waist: document.getElementById('waist').value || null,
      compliance_score: document.getElementById('compliance_score').value,
      energy: document.getElementById('energy').value,
      issues: document.getElementById('issues').value || null,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      form.style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Check-In';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
