<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-container { max-width: 520px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 2px; color: var(--charcoal); line-height: 1.1; }
    .form-header .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 20px; margin-bottom: 12px; }
    .form-header p { font-size: 14px; color: var(--mid-grey); margin-top: 12px; line-height: 1.6; }
    .brand-bar { width: 48px; height: 3px; background: var(--gold); margin: 16px auto 0; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .slider-group { margin-bottom: 24px; }
    .slider-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-value { font-size: 20px; font-weight: 600; color: var(--gold); }
    .slider { width: 100%; height: 6px; appearance: none; background: var(--light-grey); border-radius: 3px; outline: none; }
    .slider::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--gold); border-radius: 50%; cursor: pointer; }
    .slider::-moz-range-thumb { width: 22px; height: 22px; background: var(--gold); border-radius: 50%; cursor: pointer; border: none; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); margin-top: 8px; }
    .photo-upload .icon { font-size: 32px; margin-bottom: 8px; }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; margin-top: 16px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .hidden { display: none; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <h1>WEEKLY CHECK-IN</h1>
      <p>Track your progress. This data helps us fine-tune your program.</p>
      <div class="brand-bar"></div>
    </div>

    <form id="checkinForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input type="number" class="form-input" name="weight" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist (inches)</label>
          <input type="number" class="form-input" name="waist" step="0.1">
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <label class="form-label" style="margin:0">Plan Compliance</label>
          <span class="slider-value" id="complianceVal">7</span><span class="form-label" style="margin:0">/10</span>
        </div>
        <input type="range" class="slider" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('complianceVal').textContent=this.value">
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <label class="form-label" style="margin:0">Energy Level</label>
          <span class="slider-value" id="energyVal">7</span><span class="form-label" style="margin:0">/10</span>
        </div>
        <input type="range" class="slider" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
      </div>

      <div class="form-group">
        <label class="form-label">Any issues or concerns this week?</label>
        <textarea class="form-textarea" name="issues" placeholder="Pain, sleep issues, stress, cravings, missed sessions..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (Front, Side, Back)</label>
        <div class="photo-upload" id="photoUpload">
          <div class="icon">📸</div>
          <p>Tap to upload 1-3 photos</p>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg hidden" id="successMsg">
      <h2>CHECK-IN COMPLETE!</h2>
      <p>Great job staying consistent! Your coach will review your data and your updated plan will be sent via WhatsApp soon.</p>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var weekNo = params.get('w') || '1';

      document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

      var photoUpload = document.getElementById('photoUpload');
      var photoInput = document.getElementById('photoInput');
      var photoPreview = document.getElementById('photoPreview');

      photoUpload.addEventListener('click', function() { photoInput.click(); });
      photoInput.addEventListener('change', function() {
        photoPreview.innerHTML = '';
        var files = Array.from(photoInput.files).slice(0, 3);
        files.forEach(function(file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = document.createElement('img');
            img.src = e.target.result;
            photoPreview.appendChild(img);
          };
          reader.readAsDataURL(file);
        });
      });

      document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';

        var form = e.target;
        var data = {
          client_id: clientId,
          week_no: weekNo,
          weight: form.weight.value,
          waist: form.waist.value,
          compliance_score: form.compliance_score.value,
          energy: form.energy.value,
          issues: form.issues.value,
          photos_urls: []
        };

        fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          if (result.error) throw new Error(result.error);
          form.classList.add('hidden');
          document.getElementById('successMsg').classList.remove('hidden');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert(err.message || 'Something went wrong. Please try again.');
        });
      });
    })();
  </script>
</body>
</html>
