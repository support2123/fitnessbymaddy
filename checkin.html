<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .slider-group { display: flex; align-items: center; gap: 16px; }
    .slider-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .slider-val { font-size: 20px; font-weight: 600; color: var(--charcoal); min-width: 30px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 14px; border-radius: 2px; margin-bottom: 8px; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h3 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <div class="week-badge" id="weekBadge">WEEK 1</div>
    <h1 class="section-title">Weekly <em>Check-In</em></h1>
    <p class="section-body" style="margin:0 auto">Track your progress so Maddy can optimize your next week's plan.</p>
  </div>

  <div class="form-card" id="checkinForm">
    <form id="checkin" onsubmit="submitCheckin(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input class="form-input" type="number" name="weight" required step="0.1" min="30" max="250" placeholder="72.5">
        </div>
        <div class="form-group">
          <label class="form-label">Waist (cm)</label>
          <input class="form-input" type="number" name="waist" step="0.1" min="40" max="200" placeholder="82">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Compliance Score (how well did you follow the plan?)</label>
        <div class="slider-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">Perfect</span>
          <span class="slider-val" id="compVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level</label>
        <div class="slider-group">
          <span style="font-size:12px;color:var(--mid-grey)">Drained</span>
          <input type="range" name="energy" min="1" max="10" value="6" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">Energised</span>
          <span class="slider-val" id="energyVal">6</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Any issues or challenges this week?</label>
        <textarea class="form-textarea" name="issues" placeholder="Soreness, missed sessions, sleep issues, cravings, travel, stress..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (front, side, back)</label>
        <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
          <p>Tap to upload photos (max 3)</p>
          <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(this)">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h3>Check-in received!</h3>
    <p>Great job staying accountable. Your updated plan will be ready within 24 hours.</p>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var clientId = params.get('c');
var weekNo = params.get('w') || '1';
document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

var uploadedPhotos = [];

function handlePhotos(input) {
  var preview = document.getElementById('photoPreview');
  preview.innerHTML = '';
  uploadedPhotos = [];
  var files = Array.from(input.files).slice(0, 3);
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
      uploadedPhotos.push(e.target.result);
    };
    reader.readAsDataURL(file);
  });
}

async function submitCheckin(e) {
  e.preventDefault();
  if (!clientId) { alert('Invalid check-in link. Please use the link sent to your WhatsApp.'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var form = document.getElementById('checkin');
  var data = Object.fromEntries(new FormData(form));
  data.client_id = clientId;
  data.week_no = weekNo;
  data.photos_urls = uploadedPhotos;

  try {
    var res = await fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    if (res.ok) {
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'Submit Check-In';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Submit Check-In';
    alert('Network error. Please check your connection and try again.');
  }
}
</script>
</body>
</html>
