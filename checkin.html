<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
      color: var(--gold-light); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p { color: #aaa; font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white; padding: 4px 16px;
      border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px; margin-top: 12px;
    }
    .form-container { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
    .form-section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--light-grey); }
    .form-section:last-of-type { border-bottom: none; }
    .section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
      color: var(--charcoal); margin-bottom: 16px; letter-spacing: 1px;
    }
    label {
      display: block; font-size: 12px; font-weight: 500; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    input, textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      color: var(--charcoal); background: var(--white); transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .slider-group { margin-bottom: 20px; }
    .slider-group .slider-labels {
      display: flex; justify-content: space-between; font-size: 11px; color: var(--mid-grey); margin-bottom: 4px;
    }
    .slider-value {
      text-align: center; font-size: 28px; font-weight: 600; color: var(--gold); margin-bottom: 8px;
      font-family: 'Cormorant Garamond', serif;
    }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px;
      background: var(--light-grey); outline: none; padding: 0; margin-bottom: 4px; border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: var(--charcoal); cursor: pointer; border: 3px solid var(--gold);
    }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 8px; padding: 24px;
      text-align: center; cursor: pointer; transition: border-color 0.3s; margin-bottom: 16px;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .submit-btn {
      width: 100%; padding: 18px; background: var(--charcoal); color: white;
      border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px; border-radius: 4px;
      font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fbe9e7; color: var(--error); }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Fitness by Maddy</h1>
    <p>Weekly Check-in</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <form id="checkinForm">
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="form-section">
        <div class="section-title">Body Stats</div>
        <label for="weight">Current Weight (kg) *</label>
        <input type="number" id="weight" name="weight" step="0.1" min="30" max="300" required>
        <label for="waist">Waist Measurement (inches)</label>
        <input type="number" id="waist" name="waist" step="0.1" min="15" max="80">
      </div>

      <div class="form-section">
        <div class="section-title">Self-Assessment</div>
        <div class="slider-group">
          <label>Program Compliance (how closely did you follow the plan?)</label>
          <div class="slider-value" id="complianceVal">7</div>
          <input type="range" id="compliance_score" name="compliance_score" min="1" max="10" value="7">
          <div class="slider-labels"><span>Barely followed</span><span>Nailed it</span></div>
        </div>
        <div class="slider-group">
          <label>Energy Level (how did you feel this week?)</label>
          <div class="slider-value" id="energyVal">7</div>
          <input type="range" id="energy" name="energy" min="1" max="10" value="7">
          <div class="slider-labels"><span>Exhausted</span><span>Unstoppable</span></div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Notes & Issues</div>
        <label for="issues">Any issues, struggles, or questions this week?</label>
        <textarea id="issues" name="issues" placeholder="E.g., knee pain during squats, struggled with meal prep on weekdays, felt low energy on Day 4..."></textarea>
      </div>

      <div class="form-section">
        <div class="section-title">Progress Photos</div>
        <p style="font-size: 13px; color: var(--mid-grey); margin-bottom: 12px;">Upload up to 3 progress photos (front, side, back)</p>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none" max="3">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-in</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    document.getElementById('client_id').value = params.get('c') || '';
    document.getElementById('week_no').value = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + (params.get('w') || '1');

    document.getElementById('compliance_score').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    var photoFiles = [];
    document.getElementById('photoUpload').addEventListener('click', function() {
      document.getElementById('photoInput').click();
    });
    document.getElementById('photoInput').addEventListener('change', function(e) {
      var files = Array.from(e.target.files).slice(0, 3);
      photoFiles = files;
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      files.forEach(function(f) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        preview.appendChild(img);
      });
    });

    function fileToBase64(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function() {
          resolve({ data: reader.result.split(',')[1], type: file.type });
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'status-msg';

      var promises = photoFiles.map(fileToBase64);
      Promise.all(promises).then(function(photos) {
        var data = {
          client_id: document.getElementById('client_id').value,
          week_no: document.getElementById('week_no').value,
          weight: document.getElementById('weight').value,
          waist: document.getElementById('waist').value,
          compliance_score: document.getElementById('compliance_score').value,
          energy: document.getElementById('energy').value,
          issues: document.getElementById('issues').value,
          photos: photos
        };

        return fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      })
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
      .then(function(res) {
        if (res.ok) {
          msg.className = 'status-msg success';
          msg.textContent = 'Check-in submitted! Your updated program will be sent shortly.';
          btn.textContent = 'SUBMITTED ✓';
        } else {
          throw new Error(res.data.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        msg.className = 'status-msg error';
        msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
