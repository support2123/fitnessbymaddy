<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in — Fitness by Maddy</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .checkin-page { padding-top: 72px; min-height: 100vh; background: var(--cream); }
    .checkin-container { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
    .checkin-header { text-align: center; margin-bottom: 48px; }
    .checkin-header .section-eyebrow { margin-bottom: 12px; }
    .checkin-header .section-title { font-size: 36px; margin-bottom: 12px; }
    .checkin-header p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
    }
    .checkin-form { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .slider-group { margin-bottom: 20px; }
    .slider-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-value {
      background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 2px;
    }
    .form-slider {
      width: 100%; height: 4px; appearance: none; background: var(--light-grey);
      border-radius: 2px; outline: none;
    }
    .form-slider::-webkit-slider-thumb {
      appearance: none; width: 20px; height: 20px;
      background: var(--gold); border-radius: 50%; cursor: pointer;
    }
    .photo-upload { margin-bottom: 20px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
    .photo-box {
      aspect-ratio: 3/4; border: 2px dashed var(--light-grey); border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 0.3s; position: relative; overflow: hidden;
      background: var(--cream);
    }
    .photo-box:hover { border-color: var(--gold); }
    .photo-box span { font-size: 24px; color: var(--taupe); }
    .photo-box p { font-size: 10px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
    .photo-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .form-submit { width: 100%; margin-top: 12px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .checkin-form { padding: 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Fitness by Maddy</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
    </ul>
  </nav>

  <div class="checkin-page">
    <div class="checkin-container">
      <div class="checkin-header">
        <span class="week-badge" id="weekBadge">Week 1</span>
        <h1 class="section-title">Weekly <em>Check-in</em></h1>
        <p>Track your progress — it takes just 2 minutes.</p>
      </div>

      <form class="checkin-form" id="checkinForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="weight">Current Weight (kg) *</label>
            <input class="form-input" type="number" id="weight" name="weight" min="30" max="300" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="waist">Waist (inches)</label>
            <input class="form-input" type="number" id="waist" name="waist" min="20" max="60" step="0.1">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <label class="form-label">Program Compliance *</label>
            <span class="slider-value" id="complianceVal">5</span>
          </div>
          <input class="form-slider" type="range" id="compliance" name="compliance_score" min="1" max="10" value="5" required>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mid-grey);margin-top:4px;">
            <span>Barely followed</span><span>Followed perfectly</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <label class="form-label">Energy Level *</label>
            <span class="slider-value" id="energyVal">5</span>
          </div>
          <input class="form-slider" type="range" id="energy" name="energy" min="1" max="10" value="5" required>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mid-grey);margin-top:4px;">
            <span>Very low</span><span>Amazing</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="issues">Challenges or Issues This Week</label>
          <textarea class="form-input" id="issues" name="issues" placeholder="Any pain, soreness, schedule issues, cravings, sleep problems..."></textarea>
        </div>

        <div class="photo-upload">
          <label class="form-label">Progress Photos (Front, Side, Back)</label>
          <div class="photo-grid">
            <label class="photo-box" id="photoBox0">
              <span>+</span>
              <p>Front</p>
              <input type="file" accept="image/*" data-index="0">
            </label>
            <label class="photo-box" id="photoBox1">
              <span>+</span>
              <p>Side</p>
              <input type="file" accept="image/*" data-index="1">
            </label>
            <label class="photo-box" id="photoBox2">
              <span>+</span>
              <p>Back</p>
              <input type="file" accept="image/*" data-index="2">
            </label>
          </div>
        </div>

        <button type="submit" class="btn-primary form-submit">Submit Check-in</button>
      </form>

      <div class="form-success" id="successMsg">
        <h2>Check-in Complete!</h2>
        <p>Great job staying on track. Your coach will review this and your next week's program will be ready soon.</p>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

    document.getElementById('compliance').addEventListener('input', function(e) {
      document.getElementById('complianceVal').textContent = e.target.value;
    });
    document.getElementById('energy').addEventListener('input', function(e) {
      document.getElementById('energyVal').textContent = e.target.value;
    });

    var photoFiles = [null, null, null];
    document.querySelectorAll('.photo-box input').forEach(function(input) {
      input.addEventListener('change', function(e) {
        var idx = parseInt(e.target.dataset.index);
        var file = e.target.files[0];
        if (!file) return;
        photoFiles[idx] = file;
        var box = document.getElementById('photoBox' + idx);
        var existing = box.querySelector('img');
        if (existing) existing.remove();
        var img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        box.appendChild(img);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!clientId) { alert('Missing client ID. Please use the link from your WhatsApp message.'); return; }

      var form = e.target;
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var data = {
        client_id: clientId,
        week_no: weekNo,
        weight: form.weight.value,
        waist: form.waist.value || null,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value || null,
        photos_urls: []
      };

      try {
        var res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          form.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          var err = await res.json();
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert(err.error || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        alert('Network error. Please check your connection and try again.');
      }
    });
  </script>
</body>
</html>
