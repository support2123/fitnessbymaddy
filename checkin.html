<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in — Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --error: #C0392B; --success: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream); color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; text-transform: uppercase;
    }
    .form-header p {
      color: #ccc; font-size: 14px; margin-top: 8px;
    }
    .week-badge {
      display: inline-block; background: var(--gold); color: #fff;
      padding: 4px 16px; border-radius: 20px; font-size: 13px;
      font-weight: 600; margin-top: 10px;
    }
    .form-container {
      max-width: 540px; margin: -20px auto 40px; padding: 32px 24px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 8px; background: var(--cream); color: var(--charcoal);
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .required::after { content: ' *'; color: var(--error); }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] {
      flex: 1; padding: 0; height: 6px; -webkit-appearance: none;
      background: var(--light-grey); border-radius: 3px; border: none;
    }
    .range-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      border-radius: 50%; background: var(--gold); cursor: pointer;
    }
    .range-value {
      font-size: 20px; font-weight: 600; color: var(--gold);
      min-width: 30px; text-align: center;
    }
    .btn-submit {
      width: 100%; padding: 14px; font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--gold); color: #fff; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--charcoal); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .msg.error { display: block; background: #fde8e8; color: var(--error); }
    .msg.success { display: block; background: #e8fde8; color: var(--success); }
    .row { display: flex; gap: 16px; }
    .row .field { flex: 1; }
    .photo-note { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .mood-select { display: flex; gap: 8px; flex-wrap: wrap; }
    .mood-select label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; text-transform: none; font-weight: 400;
      cursor: pointer; color: var(--charcoal);
    }
    .mood-select input { width: auto; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-in</h1>
    <p>Quick update so we can fine-tune your program.</p>
    <div class="week-badge" id="weekBadge">Week —</div>
  </div>

  <div class="form-container">
    <div id="msg" class="msg"></div>

    <form id="checkinForm" novalidate>
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="row">
        <div class="field">
          <label class="required" for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required placeholder="65.5">
        </div>
        <div class="field">
          <label for="waist">Waist (cm)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="40" max="200" placeholder="76.0">
        </div>
      </div>

      <div class="field">
        <label class="required">Compliance — How well did you follow the plan?</label>
        <div class="range-group">
          <input type="range" id="compliance_score" name="compliance_score" min="1" max="10" value="7">
          <span class="range-value" id="complianceVal">7</span>
          <span style="font-size:12px;color:var(--mid-grey)">/10</span>
        </div>
      </div>

      <div class="field">
        <label class="required">Energy Level This Week</label>
        <div class="range-group">
          <input type="range" id="energy" name="energy" min="1" max="10" value="7">
          <span class="range-value" id="energyVal">7</span>
          <span style="font-size:12px;color:var(--mid-grey)">/10</span>
        </div>
      </div>

      <div class="field">
        <label for="issues">Any Issues or Concerns?</label>
        <textarea id="issues" name="issues" placeholder="Missed sessions, soreness, sleep trouble, bloating, anything..."></textarea>
      </div>

      <div class="field">
        <label for="next_week_focus">What do you want to focus on next week?</label>
        <textarea id="next_week_focus" name="next_week_focus" rows="2" placeholder="e.g. better sleep, more protein, consistency..."></textarea>
      </div>

      <div class="field">
        <label for="photos">Progress Photos</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple>
        <div class="photo-note">Front, side, and back — same lighting & angles as last time.</div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Check-in</button>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('client_id').value = clientId;
    document.getElementById('week_no').value = weekNo;
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

    document.getElementById('compliance_score').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'msg';

      var form = e.target;
      var data = {
        client_id: form.client_id.value,
        week_no: form.week_no.value,
        weight: form.weight.value || undefined,
        waist: form.waist.value || undefined,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value || undefined,
        next_week_focus: form.next_week_focus.value || undefined,
        photos_urls: [],
      };

      if (!data.client_id) {
        msg.className = 'msg error';
        msg.textContent = 'Invalid check-in link. Please use the link from your WhatsApp message.';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        return;
      }

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(result) {
        if (result.ok && result.data.success) {
          msg.className = 'msg success';
          msg.textContent = 'Check-in submitted! Your updated program will be sent on WhatsApp.';
          form.style.display = 'none';
        } else {
          throw new Error(result.data.error || 'Something went wrong');
        }
      })
      .catch(function(err) {
        msg.className = 'msg error';
        msg.textContent = err.message || 'Failed to submit. Please try again.';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
