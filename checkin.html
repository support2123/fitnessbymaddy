<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in — Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 20px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .form-header .week-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 20px;
      background: var(--gold);
      color: #fff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .form-container {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .form-section {
      margin-bottom: 32px;
    }

    .form-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--mid-grey);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--charcoal);
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    textarea { resize: vertical; min-height: 80px; }

    .slider-field { margin-bottom: 24px; }

    .slider-field .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .slider-field .slider-value {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--gold);
      min-width: 30px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      border: none;
      padding: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: none;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--mid-grey);
      margin-top: 4px;
    }

    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { color: var(--mid-grey); font-size: 0.9rem; }
    .photo-upload .icon { font-size: 2rem; margin-bottom: 8px; }

    .photo-preview {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .photo-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid var(--light-grey);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .success-msg p { color: var(--mid-grey); }

    @media (max-width: 600px) {
      .form-header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-in</h1>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-section">
        <h2>Body Metrics</h2>
        <div class="field">
          <label for="weight">Current Weight (kg)</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field">
          <label for="waist">Waist Measurement (inches)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="15" max="80">
        </div>
      </div>

      <div class="form-section">
        <h2>Self Assessment</h2>
        <div class="slider-field">
          <div class="slider-header">
            <label for="compliance">Plan Compliance</label>
            <span class="slider-value" id="complianceVal">5</span>
          </div>
          <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="5">
          <div class="slider-labels">
            <span>Barely followed</span>
            <span>Nailed it</span>
          </div>
        </div>
        <div class="slider-field">
          <div class="slider-header">
            <label for="energy">Energy Level</label>
            <span class="slider-value" id="energyVal">5</span>
          </div>
          <input type="range" id="energy" name="energy" min="1" max="10" value="5">
          <div class="slider-labels">
            <span>Exhausted</span>
            <span>Energized</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Notes</h2>
        <div class="field">
          <label for="issues">Any Issues or Concerns?</label>
          <textarea id="issues" name="issues" placeholder="Soreness, schedule conflicts, cravings, questions for Maddy..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <h2>Progress Photos</h2>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <input type="file" id="photos" accept="image/*" multiple>
          <div class="icon">+</div>
          <p>Front, side, and back — same lighting as last week</p>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Check-in</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-in Received!</h2>
      <p>Your updated program will be sent to your WhatsApp shortly. Keep crushing it!</p>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var weekNo = params.get('w') || '1';

      document.getElementById('clientId').value = clientId || '';
      document.getElementById('weekNo').value = weekNo;
      document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

      document.getElementById('compliance').addEventListener('input', function () {
        document.getElementById('complianceVal').textContent = this.value;
      });
      document.getElementById('energy').addEventListener('input', function () {
        document.getElementById('energyVal').textContent = this.value;
      });

      document.getElementById('photos').addEventListener('change', function () {
        var preview = document.getElementById('photoPreview');
        preview.innerHTML = '';
        for (var i = 0; i < this.files.length; i++) {
          var img = document.createElement('img');
          img.src = URL.createObjectURL(this.files[i]);
          preview.appendChild(img);
        }
      });

      var form = document.getElementById('checkinForm');
      var btn = document.getElementById('submitBtn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!clientId) {
          alert('Missing client ID. Please use the link sent to your WhatsApp.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Submitting...';

        var data = {
          client_id: clientId,
          week_no: weekNo,
          weight: document.getElementById('weight').value,
          waist: document.getElementById('waist').value,
          compliance_score: document.getElementById('compliance').value,
          energy: document.getElementById('energy').value,
          issues: document.getElementById('issues').value,
          photos_urls: [],
        };

        fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
          .then(function (r) { return r.json(); })
          .then(function (result) {
            if (result.ok) {
              form.style.display = 'none';
              document.getElementById('successMsg').style.display = 'block';
            } else {
              alert(result.error || 'Something went wrong.');
              btn.disabled = false;
              btn.textContent = 'Submit Check-in';
            }
          })
          .catch(function () {
            alert('Network error. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Submit Check-in';
          });
      });
    })();
  </script>
</body>
</html>
