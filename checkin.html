<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: #D4AF7A;
      margin-bottom: 8px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: #1A1A1A;
      border: 1px solid #D4AF7A;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #D4AF7A;
      margin-bottom: 12px;
    }
    .form-header p {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D4AF7A;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      background: #1A1A1A;
      border: 1px solid #333;
      border-radius: 4px;
      color: #FFF;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #D4AF7A;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .slider-group {
      margin-bottom: 24px;
    }
    .slider-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #D4AF7A;
      margin-bottom: 12px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      appearance: none;
      height: 6px;
      background: #333;
      border-radius: 3px;
      outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: #D4AF7A;
      border-radius: 50%;
      cursor: pointer;
    }
    .slider-val {
      font-size: 18px;
      font-weight: 600;
      color: #D4AF7A;
      min-width: 30px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
      margin-bottom: 12px;
    }
    .photo-upload:hover {
      border-color: #D4AF7A;
    }
    .photo-upload p {
      font-size: 13px;
      color: #888;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: #D4AF7A;
      color: #0A0A0A;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 20px;
    }
    .btn-submit:hover {
      background: #B8965A;
    }
    .btn-submit:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #D4AF7A;
      margin-bottom: 12px;
    }
    .success-msg p {
      color: #888;
      font-size: 14px;
      line-height: 1.6;
    }
    .brand-footer {
      text-align: center;
      margin-top: 40px;
      font-size: 11px;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <h1>WEEKLY CHECK-IN</h1>
      <p>Track your progress. Be honest — this data helps Maddy optimise your program.</p>
    </div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-group">
        <label>Current Weight (kg)</label>
        <input type="number" name="weight" step="0.1" required placeholder="65.0">
      </div>

      <div class="form-group">
        <label>Waist Measurement (cm)</label>
        <input type="number" name="waist" step="0.1" placeholder="78.0">
      </div>

      <div class="slider-group">
        <label>Program Compliance (1 = skipped most, 10 = perfect)</label>
        <div class="slider-wrap">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="compSlider">
          <span class="slider-val" id="compVal">7</span>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level (1 = exhausted, 10 = amazing)</label>
        <div class="slider-wrap">
          <input type="range" name="energy" min="1" max="10" value="6" id="energySlider">
          <span class="slider-val" id="energyVal">6</span>
        </div>
      </div>

      <div class="form-group">
        <label>Any Issues This Week?</label>
        <textarea name="issues" placeholder="Pain, soreness, sleep problems, stress, cravings..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos (front, side, back)</label>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <p id="photosLabel">📷 Tap to upload photos (up to 3)</p>
          <input type="file" id="photos" accept="image/*" multiple style="display:none">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN RECEIVED!</h2>
      <p>Maddy will review your progress and your updated program will be sent via WhatsApp within 24-48 hours. Keep pushing! 💪</p>
    </div>

    <div class="brand-footer">Fitness by Maddy</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';

    document.getElementById('clientId').value = clientId || '';
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compSlider').addEventListener('input', function() {
      document.getElementById('compVal').textContent = this.value;
    });
    document.getElementById('energySlider').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    document.getElementById('photos').addEventListener('change', function() {
      const count = this.files.length;
      document.getElementById('photosLabel').textContent = '✅ ' + count + ' photo' + (count > 1 ? 's' : '') + ' selected';
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      delete data.photos;
      data.photos_urls = [];

      try {
        const res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
