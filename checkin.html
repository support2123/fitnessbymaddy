<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: #fff;
      min-height: 100vh;
    }
    .form-header {
      background: linear-gradient(135deg, #1a1a1a 0%, var(--charcoal) 100%);
      padding: 48px 24px 32px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 6px; color: var(--gold); margin-bottom: 8px; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff; letter-spacing: 2px; }
    .week-badge {
      display: inline-block; background: var(--gold);
      color: var(--charcoal); font-family: 'Bebas Neue', sans-serif;
      font-size: 14px; letter-spacing: 3px;
      padding: 6px 20px; border-radius: 2px; margin-top: 12px;
    }
    .form-body { max-width: 500px; margin: 0 auto; padding: 32px 24px 60px; }
    .field { margin-bottom: 24px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 8px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px; font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: #fff; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,0.3); }
    .field select option { background: var(--charcoal); color: #fff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .slider-group { margin-bottom: 24px; }
    .slider-group label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 12px;
    }
    .slider-row { display: flex; align-items: center; gap: 16px; }
    .slider-row input[type="range"] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 6px; background: rgba(255,255,255,0.12);
      border-radius: 3px; outline: none; border: none; padding: 0;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      background: var(--gold); border-radius: 50%; cursor: pointer;
    }
    .slider-value {
      width: 40px; text-align: center; font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; color: var(--gold);
    }
    .photo-upload { margin-bottom: 24px; }
    .photo-upload label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 12px;
    }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .photo-slot {
      aspect-ratio: 3/4;
      background: rgba(255,255,255,0.04);
      border: 1.5px dashed rgba(255,255,255,0.15);
      border-radius: 4px; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 6px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: border-color 0.3s;
    }
    .photo-slot:hover { border-color: var(--gold); }
    .photo-slot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-slot .icon { font-size: 24px; color: var(--mid-grey); }
    .photo-slot .label { font-size: 10px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; }
    .photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .submit-btn {
      width: 100%; padding: 16px;
      background: var(--gold); color: var(--charcoal);
      border: none; border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px;
      cursor: pointer; transition: all 0.3s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="form-header">
    <div class="brand">FITNESS BY MADDY</div>
    <h1>WEEKLY CHECK-IN</h1>
    <div class="week-badge" id="weekBadge">WEEK —</div>
  </div>

  <div class="form-body" id="formContainer">
    <form id="checkinForm" novalidate>
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg) *</label>
          <input type="number" name="weight" placeholder="65.5" step="0.1" required>
        </div>
        <div class="field">
          <label>Waist (inches)</label>
          <input type="number" name="waist" placeholder="30" step="0.1">
        </div>
      </div>

      <div class="slider-group">
        <label>Program Compliance (1 = skipped most, 10 = followed 100%)</label>
        <div class="slider-row">
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <div class="slider-value">7</div>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level (1 = exhausted, 10 = full of energy)</label>
        <div class="slider-row">
          <input type="range" name="energy" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <div class="slider-value">7</div>
        </div>
      </div>

      <div class="field">
        <label>Issues or Challenges This Week</label>
        <textarea name="issues" placeholder="Any pain, schedule disruptions, cravings, sleep issues, etc."></textarea>
      </div>

      <div class="photo-upload">
        <label>Progress Photos (Front, Side, Back)</label>
        <div class="photo-grid">
          <div class="photo-slot">
            <input type="file" accept="image/*" data-slot="0" onchange="previewPhoto(this)">
            <div class="icon">📸</div>
            <div class="label">Front</div>
          </div>
          <div class="photo-slot">
            <input type="file" accept="image/*" data-slot="1" onchange="previewPhoto(this)">
            <div class="icon">📸</div>
            <div class="label">Side</div>
          </div>
          <div class="photo-slot">
            <input type="file" accept="image/*" data-slot="2" onchange="previewPhoto(this)">
            <div class="icon">📸</div>
            <div class="label">Back</div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>How Are You Feeling Overall?</label>
        <select name="mood">
          <option value="">Select</option>
          <option value="amazing">Amazing — crushing it!</option>
          <option value="good">Good — staying consistent</option>
          <option value="okay">Okay — some ups and downs</option>
          <option value="struggling">Struggling — need more support</option>
          <option value="bad">Not great — might need to talk</option>
        </select>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>CHECK-IN SUBMITTED!</h2>
    <p>Great job staying accountable. Your coach will review your progress and your updated program will be sent via WhatsApp. Keep pushing! 💪</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w');
    if (clientId) document.getElementById('clientId').value = clientId;
    if (weekNo) {
      document.getElementById('weekNo').value = weekNo;
      document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;
    }

    function previewPhoto(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var slot = input.parentElement;
          var existing = slot.querySelector('img');
          if (existing) existing.remove();
          var img = document.createElement('img');
          img.src = e.target.result;
          slot.appendChild(img);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');

      var data = {
        client_id: form.client_id.value,
        week_no: form.week_no.value,
        weight: form.weight.value,
        waist: form.waist.value,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value.trim(),
        photos_urls: [],
      };

      if (!data.client_id || !data.week_no || !data.weight) {
        errEl.textContent = 'Please fill in your weight at minimum.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.ok) {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errEl.textContent = result.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
