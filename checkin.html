<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --white: #FFFFFF; --error: #c0392b; --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif; color: var(--white);
      font-size: 32px; font-weight: 600; letter-spacing: 2px;
    }
    .form-header p { color: var(--gold-light); font-size: 14px; margin-top: 8px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: var(--white);
      padding: 4px 16px; border-radius: 20px; font-size: 12px;
      font-weight: 600; letter-spacing: 1px; margin-top: 12px;
    }
    .form-container {
      max-width: 520px; margin: -20px auto 40px; padding: 0 16px;
    }
    .form-card {
      background: var(--white); border-radius: 4px; padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .form-section { margin-bottom: 28px; }
    .form-section-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      font-weight: 600; color: var(--charcoal); margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .slider-group { margin-bottom: 18px; }
    .slider-group label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 10px;
    }
    .slider-wrap { display: flex; align-items: center; gap: 12px; }
    .slider-wrap input[type="range"] {
      flex: 1; -webkit-appearance: none; height: 6px;
      background: var(--light-grey); border-radius: 3px; outline: none;
      border: none; padding: 0;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      background: var(--gold); border-radius: 50%; cursor: pointer;
    }
    .slider-val {
      min-width: 36px; text-align: center; font-size: 18px;
      font-weight: 600; color: var(--gold);
    }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 4px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .photo-preview img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 3px;
    }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: var(--white); border: none; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 3px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center; padding: 12px; margin-top: 16px;
      border-radius: 3px; font-size: 14px; display: none;
    }
    .status-msg.success { display: block; background: #e8f5e9; color: var(--success); }
    .status-msg.error { display: block; background: #fdecea; color: var(--error); }
    .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .mood-option {
      text-align: center; padding: 10px 4px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 11px;
    }
    .mood-option:hover { border-color: var(--gold); }
    .mood-option.selected { border-color: var(--gold); background: rgba(184,150,90,0.08); }
    .mood-option .mood-emoji { font-size: 24px; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <p>Track your progress, stay accountable</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <form class="form-card" id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-section">
        <div class="form-section-title">Body Stats</div>
        <div class="field">
          <label for="weight">Current Weight (kg) *</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field">
          <label for="waist">Waist Measurement (cm)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="40" max="200">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Self-Assessment</div>
        <div class="slider-group">
          <label>Compliance Score (how well did you follow the plan?)</label>
          <div class="slider-wrap">
            <span style="font-size:12px;color:var(--mid-grey)">Low</span>
            <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
            <span style="font-size:12px;color:var(--mid-grey)">Perfect</span>
            <span class="slider-val" id="complianceVal">7</span>
          </div>
        </div>
        <div class="slider-group">
          <label>Energy Level (overall this week)</label>
          <div class="slider-wrap">
            <span style="font-size:12px;color:var(--mid-grey)">Drained</span>
            <input type="range" id="energy" name="energy" min="1" max="10" value="6">
            <span style="font-size:12px;color:var(--mid-grey)">Energised</span>
            <span class="slider-val" id="energyVal">6</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Notes</div>
        <div class="field">
          <label for="issues">Any issues, struggles, or questions?</label>
          <textarea id="issues" name="issues" placeholder="Missed sessions, cravings, soreness, travel plans, questions for Maddy..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Progress Photos</div>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload 3 photos (front, side, back)</p>
          <input type="file" id="photos" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    document.getElementById('clientId').value = params.get('c') || '';
    document.getElementById('weekNo').value = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + (params.get('w') || '1');

    document.getElementById('compliance').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    var photoUpload = document.getElementById('photoUpload');
    var photosInput = document.getElementById('photos');
    photoUpload.addEventListener('click', function() { photosInput.click(); });
    photosInput.addEventListener('change', function() {
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      for (var i = 0; i < photosInput.files.length && i < 5; i++) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(photosInput.files[i]);
        preview.appendChild(img);
      }
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      msg.className = 'status-msg';

      var data = {
        client_id: document.getElementById('clientId').value,
        week_no: document.getElementById('weekNo').value,
        weight: document.getElementById('weight').value,
        waist: document.getElementById('waist').value,
        compliance_score: document.getElementById('compliance').value,
        energy: document.getElementById('energy').value,
        issues: document.getElementById('issues').value,
        photos_urls: [],
      };

      try {
        var res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          msg.textContent = "Check-in submitted! Your updated program will be sent via WhatsApp soon.";
          msg.className = 'status-msg success';
          btn.textContent = 'SUBMITTED ✓';
        } else {
          var err = await res.json();
          throw new Error(err.error || 'Submission failed');
        }
      } catch (error) {
        msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
        msg.className = 'status-msg error';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
