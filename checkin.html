<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --red: #c0392b; --green: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--cream);
      color: var(--charcoal); min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 32px 20px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; color: var(--gold);
      font-size: 32px; letter-spacing: 3px;
    }
    .form-header p { color: #ccc; font-size: 14px; margin-top: 8px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: #fff;
      padding: 4px 16px; border-radius: 20px; font-size: 13px;
      font-weight: 600; margin-top: 10px;
    }
    .form-wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--light-grey);
      border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      background: #fff; color: var(--charcoal); transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }
    .range-wrap {
      display: flex; align-items: center; gap: 12px;
    }
    .range-wrap input[type="range"] {
      flex: 1; padding: 0; height: 6px; -webkit-appearance: none;
      background: var(--light-grey); border-radius: 3px; border: none;
    }
    .range-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      background: var(--gold); border-radius: 50%; cursor: pointer;
    }
    .range-val {
      min-width: 32px; text-align: center; font-weight: 600;
      font-size: 18px; color: var(--gold);
    }
    .photo-upload { display: flex; gap: 8px; flex-wrap: wrap; }
    .photo-upload label {
      width: 100px; height: 100px; border: 2px dashed var(--light-grey);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 28px;
      color: var(--mid-grey); transition: border-color 0.2s;
      text-transform: none;
    }
    .photo-upload label:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-preview {
      width: 100px; height: 100px; border-radius: 8px;
      object-fit: cover; border: 2px solid var(--gold);
    }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--charcoal);
      color: #fff; border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: wait; }
    .msg { text-align: center; padding: 16px; border-radius: 4px; margin-top: 16px; font-size: 14px; }
    .msg.ok { background: #e8f5e9; color: var(--green); }
    .msg.err { background: #fdecea; color: var(--red); }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
  </style>
</head>
<body>

<div class="form-header">
  <h1>Weekly Check-In</h1>
  <p>Let's see how your week went!</p>
  <div class="week-badge" id="weekBadge">Week —</div>
</div>

<form class="form-wrap" id="checkinForm">
  <input type="hidden" name="client_id" id="client_id">
  <input type="hidden" name="week_no" id="week_no">

  <div class="row">
    <div class="field">
      <label>Current Weight (kg) *</label>
      <input type="number" name="weight" required step="0.1" min="30" max="300" placeholder="65.5">
    </div>
    <div class="field">
      <label>Waist (cm)</label>
      <input type="number" name="waist" step="0.1" min="40" max="200" placeholder="78">
    </div>
  </div>

  <div class="field">
    <label>Workout Compliance (1-10)</label>
    <div class="range-wrap">
      <input type="range" name="compliance_score" min="1" max="10" value="7" id="compRange">
      <span class="range-val" id="compVal">7</span>
    </div>
  </div>

  <div class="field">
    <label>Energy Levels (1-10)</label>
    <div class="range-wrap">
      <input type="range" name="energy" min="1" max="10" value="7" id="energyRange">
      <span class="range-val" id="energyVal">7</span>
    </div>
  </div>

  <div class="field">
    <label>Issues / Challenges This Week</label>
    <textarea name="issues" placeholder="Any pain, soreness, missed sessions, diet struggles, stress, sleep issues?"></textarea>
  </div>

  <div class="field">
    <label>Progress Photos (up to 3)</label>
    <div class="photo-upload" id="photoUpload">
      <label><input type="file" accept="image/*" class="photo-input">+</label>
      <label><input type="file" accept="image/*" class="photo-input">+</label>
      <label><input type="file" accept="image/*" class="photo-input">+</label>
    </div>
  </div>

  <button type="submit" class="btn-submit" id="submitBtn">Submit Check-In</button>
  <div id="formMsg" class="msg" style="display:none"></div>
</form>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c') || '';
  var weekNo = params.get('w') || '1';
  document.getElementById('client_id').value = clientId;
  document.getElementById('week_no').value = weekNo;
  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  document.getElementById('compRange').addEventListener('input', function() {
    document.getElementById('compVal').textContent = this.value;
  });
  document.getElementById('energyRange').addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value;
  });

  document.querySelectorAll('.photo-input').forEach(function(input) {
    input.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        var reader = new FileReader();
        var label = this.parentElement;
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'photo-preview';
          label.parentElement.replaceChild(img, label);
        };
        reader.readAsDataURL(this.files[0]);
      }
    });
  });

  document.getElementById('checkinForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('formMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.style.display = 'none';

    var data = {};
    new FormData(this).forEach(function(v, k) {
      if (k !== 'photos') data[k] = v;
    });
    data.photos_urls = [];

    try {
      var res = await fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      var json = await res.json();
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Check-in submitted! Your updated program will be sent shortly. Keep crushing it! 💪';
        msg.style.display = 'block';
        btn.textContent = 'SUBMITTED ✓';
      } else {
        throw new Error(json.error || 'Submission failed');
      }
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = 'Something went wrong: ' + err.message;
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    }
  });
</script>
</body>
</html>
