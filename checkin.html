<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
      color: var(--cream);
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header p {
      font-size: 14px;
      color: var(--mid-grey);
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 4px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .range-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .range-group input[type="range"] {
      flex: 1;
      padding: 0;
      border: none;
      background: none;
      accent-color: var(--gold);
      height: 6px;
    }
    .range-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      min-width: 30px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed rgba(184,150,90,0.3);
      border-radius: 4px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-count { color: var(--gold); font-size: 13px; margin-top: 8px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--charcoal);
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <span class="week-badge" id="weekBadge">WEEK 1</span>
      <h1>Weekly Check-in</h1>
      <p>Track your progress — this takes 2 minutes</p>
    </div>

    <form id="checkinForm">
      <div class="row">
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" name="weight" step="0.1" placeholder="65.0">
        </div>
        <div class="form-group">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" placeholder="72">
        </div>
      </div>

      <div class="form-group">
        <label>Program Compliance (1-10)</label>
        <div class="range-group">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceRange">
          <span class="range-val" id="complianceVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label>Energy Level (1-10)</label>
        <div class="range-group">
          <input type="range" name="energy" min="1" max="10" value="7" id="energyRange">
          <span class="range-val" id="energyVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label>Issues or Concerns</label>
        <textarea name="issues" placeholder="Any pain, soreness, schedule issues, diet struggles..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side, back photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
          <div class="photo-count" id="photoCount"></div>
        </div>
      </div>

      <button type="submit" class="btn-submit">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-in Complete!</h2>
      <p>Your coach will review and your updated program will be sent within 24 hours.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';

    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('complianceRange').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energyRange').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    const photoUpload = document.getElementById('photoUpload');
    const photoInput = document.getElementById('photoInput');
    photoUpload.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', function() {
      const count = this.files.length;
      document.getElementById('photoCount').textContent = count > 0 ? count + ' photo(s) selected' : '';
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = new FormData(this);
      const data = {
        client_id: clientId,
        week_no: weekNo,
        weight: formData.get('weight') || null,
        waist: formData.get('waist') || null,
        compliance_score: parseInt(formData.get('compliance_score')),
        energy: parseInt(formData.get('energy')),
        issues: formData.get('issues') || null,
        photos_urls: [],
      };

      try {
        const res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          this.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          const err = await res.json();
          alert(err.error || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      } catch {
        alert('Network error. Please check your connection.');
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
