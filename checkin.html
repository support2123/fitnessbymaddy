<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #1a1a1a; --gold: #B8965A; --gold-light: #D4AF7A;
      --cream: #FAF8F4; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --sand: #F0EAE0;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .header {
      background: var(--black); padding: 24px 20px; text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      letter-spacing: 4px; color: white; margin-bottom: 4px;
    }
    .header p { font-size: 13px; color: var(--gold-light); letter-spacing: 1px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 14px;
      letter-spacing: 2px; padding: 4px 14px; border-radius: 2px; margin-top: 8px;
    }
    .form-wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
    .section-label {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 2px; color: var(--gold); margin: 32px 0 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { resize: vertical; min-height: 80px; }
    .range-wrap { display: flex; align-items: center; gap: 12px; }
    .range-wrap input[type="range"] {
      flex: 1; padding: 0; height: 6px; border: none;
      accent-color: var(--gold); background: var(--light-grey); border-radius: 3px;
    }
    .range-val {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      color: var(--gold); min-width: 40px; text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 6px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color 0.3s; position: relative;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-upload .icon { font-size: 32px; margin-bottom: 8px; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 4px;
      border: 2px solid var(--light-grey);
    }
    .submit-btn {
      width: 100%; padding: 16px; margin-top: 32px;
      background: var(--charcoal); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 3px; cursor: pointer; border-radius: 3px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 20px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 12px;
    }
    .success-msg p { font-size: 15px; color: var(--mid-grey); line-height: 1.7; }
    .error-msg {
      background: #fee; border: 1px solid #fcc; color: #a33;
      padding: 12px 16px; border-radius: 3px; font-size: 14px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Weekly Progress Check-In</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-wrap">
    <div id="errorMsg" class="error-msg"></div>

    <form id="checkinForm">
      <div class="section-label">BODY STATS</div>

      <div class="field">
        <label>Current Weight (kg) *</label>
        <input type="number" name="weight" step="0.1" required placeholder="65.5">
      </div>
      <div class="field">
        <label>Waist Measurement (inches)</label>
        <input type="number" name="waist" step="0.1" placeholder="30">
      </div>

      <div class="section-label">SELF ASSESSMENT</div>

      <div class="field">
        <label>Workout Compliance (1 = skipped most, 10 = followed perfectly)</label>
        <div class="range-wrap">
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <div class="range-val" id="compVal">7</div>
        </div>
      </div>
      <div class="field">
        <label>Energy Level (1 = exhausted, 10 = great)</label>
        <div class="range-wrap">
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
          <div class="range-val" id="energyVal">7</div>
        </div>
      </div>

      <div class="section-label">NOTES & ISSUES</div>

      <div class="field">
        <label>Any issues, pain, or concerns this week?</label>
        <textarea name="issues" placeholder="Describe anything — soreness, sleep, stress, missed sessions, digestion..."></textarea>
      </div>

      <div class="section-label">PROGRESS PHOTOS</div>

      <div class="field">
        <label>Upload 1-3 photos (front, side, back)</label>
        <div class="photo-upload" id="photoUpload">
          <div class="icon">+</div>
          <p>Tap to upload photos</p>
          <input type="file" accept="image/*" multiple id="photoInput">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div id="successMsg" class="success-msg">
      <h2>CHECK-IN RECEIVED</h2>
      <p>Great work staying consistent! Your updated program will be sent within 24-48 hours.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c') || '';
    var weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    var photoFiles = [];
    document.getElementById('photoInput').addEventListener('change', function(e) {
      var files = Array.from(e.target.files).slice(0, 3);
      photoFiles = files;
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      files.forEach(function(f) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        preview.appendChild(img);
      });
    });

    function fileToBase64(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!clientId) {
        var errEl = document.getElementById('errorMsg');
        errEl.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        errEl.style.display = 'block';
        return;
      }

      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var fd = new FormData(this);
      var data = { client_id: clientId, week_no: weekNo };
      fd.forEach(function(v, k) { data[k] = v; });

      var photoPromises = photoFiles.map(fileToBase64);
      Promise.all(photoPromises).then(function(base64Photos) {
        data.photos = base64Photos;
        return fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(res.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errEl.textContent = err.message || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
