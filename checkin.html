<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .header {
      background: var(--charcoal);
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 4px; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 2px;
      margin-top: 8px;
    }
    .form-wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--charcoal);
      letter-spacing: 2px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 3px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { min-height: 80px; resize: vertical; }
    .slider-group { margin-bottom: 24px; }
    .slider-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: var(--light-grey);
      border-radius: 3px;
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--charcoal);
      min-width: 32px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 3px;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 3px; }
    .success-msg p { font-size: 15px; color: var(--mid-grey); margin-top: 12px; line-height: 1.6; }
    .error-msg { background: #fee; color: #c33; padding: 12px 16px; border-radius: 3px; font-size: 13px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FITNESS BY MADDY</h1>
    <p>Weekly Check-in</p>
    <div class="week-badge" id="week-label">WEEK —</div>
  </div>

  <div class="form-wrap">
    <div class="error-msg" id="error"></div>

    <form id="checkin-form">
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="section-label">BODY STATS</div>
      <div class="field">
        <label>Current Weight (kg) *</label>
        <input type="number" name="weight" step="0.1" required placeholder="e.g. 72.5">
      </div>
      <div class="field">
        <label>Waist Measurement (cm)</label>
        <input type="number" name="waist" step="0.1" placeholder="e.g. 82.0">
      </div>

      <div class="section-label">HOW DID THIS WEEK GO?</div>
      <div class="slider-group">
        <label>Program Compliance (1 = barely followed, 10 = perfect)</label>
        <div class="slider-row">
          <span style="font-size:12px;color:var(--mid-grey)">1</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('comp-val').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">10</span>
          <span class="slider-val" id="comp-val">7</span>
        </div>
      </div>
      <div class="slider-group">
        <label>Energy Level (1 = exhausted, 10 = amazing)</label>
        <div class="slider-row">
          <span style="font-size:12px;color:var(--mid-grey)">1</span>
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energy-val').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">10</span>
          <span class="slider-val" id="energy-val">7</span>
        </div>
      </div>
      <div class="field">
        <label>Any issues, struggles, or things to flag?</label>
        <textarea name="issues" placeholder="Missed sessions, sleep issues, cravings, pain, questions for Maddy..."></textarea>
      </div>

      <div class="section-label">PROGRESS PHOTOS</div>
      <div class="photo-upload" onclick="this.querySelector('input').click()">
        <div style="font-size:24px;margin-bottom:8px">+</div>
        <p>Tap to upload front, side & back photos</p>
        <input type="file" name="photos" multiple accept="image/*">
      </div>
      <p id="photo-count" style="font-size:12px;color:var(--mid-grey);margin-top:8px"></p>

      <button type="submit" class="submit-btn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="success">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Great work staying consistent. Maddy will review your progress and your updated program will be sent via WhatsApp.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w');

    if (clientId) document.getElementById('client_id').value = clientId;
    if (weekNo) {
      document.getElementById('week_no').value = weekNo;
      document.getElementById('week-label').textContent = 'WEEK ' + weekNo;
    }

    document.querySelector('input[name="photos"]').addEventListener('change', function(e) {
      var count = e.target.files.length;
      document.getElementById('photo-count').textContent = count ? count + ' photo(s) selected' : '';
    });

    document.getElementById('checkin-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var btn = form.querySelector('.submit-btn');
      var errEl = document.getElementById('error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var data = {
        client_id: form.client_id.value,
        week_no: form.week_no.value,
        weight: form.weight.value,
        waist: form.waist.value || null,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value || null,
        photos_urls: []
      };

      if (!data.client_id || !data.week_no) {
        errEl.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        return;
      }

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.ok) {
          form.style.display = 'none';
          document.getElementById('success').style.display = 'block';
        } else {
          errEl.textContent = result.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
