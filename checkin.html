<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; color: var(--charcoal); }
    .form-success p { color: var(--mid-grey); line-height: 1.7; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }
    .slider-group { position: relative; }
    .slider-value { position: absolute; right: 0; top: 0; font-size: 11px; font-weight: 600; color: var(--gold); letter-spacing: 1px; }
    input[type="range"] {
      width: 100%; height: 4px; border-radius: 2px; background: var(--light-grey);
      outline: none; appearance: none; cursor: pointer; margin-top: 8px;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: var(--gold); cursor: pointer;
    }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 24px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; margin-bottom: 8px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <div class="week-badge" id="weekBadge">WEEK 1</div>
    <h1 class="section-title">Weekly<br><em>Check-In</em></h1>
    <p class="section-body" style="margin: 16px auto 0;">Track your progress so we can optimize your next week.</p>
  </div>

  <div class="form-card" id="checkinForm">
    <form id="checkin" novalidate>
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="weight">Current Weight (kg)</label>
          <input class="form-input" type="number" id="weight" name="weight" step="0.1" placeholder="e.g. 72.5">
        </div>
        <div class="form-group">
          <label class="form-label" for="waist">Waist (inches)</label>
          <input class="form-input" type="number" id="waist" name="waist" step="0.1" placeholder="e.g. 32">
        </div>
      </div>

      <div class="form-group slider-group">
        <label class="form-label" for="compliance">Program Compliance</label>
        <span class="slider-value" id="complianceVal">5 / 10</span>
        <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="5">
      </div>

      <div class="form-group slider-group">
        <label class="form-label" for="energy">Energy Level</label>
        <span class="slider-value" id="energyVal">5 / 10</span>
        <input type="range" id="energy" name="energy" min="1" max="10" value="5">
      </div>

      <div class="form-group">
        <label class="form-label" for="issues">Any Issues or Notes This Week?</label>
        <textarea class="form-textarea" id="issues" name="issues" placeholder="Missed sessions, felt sore, sleep quality, stress levels, etc."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (optional, up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <input type="file" id="photos" accept="image/*" multiple>
          <p>Tap to upload front / side / back photos</p>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Check-In Received!</h2>
    <p>Great job staying consistent. Your updated program will be sent to your WhatsApp shortly.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';
  document.getElementById('client_id').value = clientId || '';
  document.getElementById('week_no').value = weekNo;
  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  var compSlider = document.getElementById('compliance');
  var energySlider = document.getElementById('energy');
  compSlider.addEventListener('input', function() {
    document.getElementById('complianceVal').textContent = this.value + ' / 10';
  });
  energySlider.addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value + ' / 10';
  });

  var photoUpload = document.getElementById('photoUpload');
  var photoInput = document.getElementById('photos');
  var photoPreview = document.getElementById('photoPreview');
  photoUpload.addEventListener('click', function() { photoInput.click(); });
  photoInput.addEventListener('change', function() {
    photoPreview.innerHTML = '';
    var files = Array.from(this.files).slice(0, 3);
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.createElement('img');
        img.src = e.target.result;
        photoPreview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('checkin').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var data = {
      client_id: document.getElementById('client_id').value,
      week_no: document.getElementById('week_no').value,
      weight: document.getElementById('weight').value || null,
      waist: document.getElementById('waist').value || null,
      compliance_score: document.getElementById('compliance').value,
      energy: document.getElementById('energy').value,
      issues: document.getElementById('issues').value.trim(),
      photos_urls: []
    };

    if (!data.client_id) {
      errEl.textContent = 'Invalid check-in link. Please use the link from your WhatsApp message.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
      return;
    }

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        document.getElementById('checkinForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        throw new Error(res.error || 'Submission failed');
      }
    })
    .catch(function(err) {
      errEl.textContent = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    });
  });
})();
</script>
</body>
</html>
