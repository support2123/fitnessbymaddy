<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --sand: #F0EAE0;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream); color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 300; color: var(--gold);
    }
    .form-header .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      padding: 4px 16px; border-radius: 2px; margin-top: 12px;
      text-transform: uppercase;
    }
    .form-container {
      max-width: 480px; margin: 0 auto; padding: 40px 24px 60px;
    }
    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-input, .form-textarea {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white;
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .slider-group { margin-bottom: 28px; }
    .slider-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .slider-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 600; color: var(--gold);
    }
    .slider-track {
      width: 100%; -webkit-appearance: none; appearance: none;
      height: 6px; border-radius: 3px; background: var(--light-grey);
      outline: none;
    }
    .slider-track::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px;
      border-radius: 50%; background: var(--gold); cursor: pointer;
      border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .slider-labels {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--mid-grey); margin-top: 6px;
    }
    .metrics-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .file-upload {
      border: 2px dashed var(--light-grey); border-radius: 4px;
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color 0.3s; background: white;
    }
    .file-upload:hover { border-color: var(--gold); }
    .file-upload p { font-size: 13px; color: var(--mid-grey); }
    .file-upload input { display: none; }
    .file-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .file-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--light-grey); }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: white; border: none; font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; border-radius: 2px;
      margin-top: 16px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none; text-align: center; padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; color: var(--gold); margin-bottom: 12px;
    }
    .success-msg p { font-size: 14px; color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      background: #FFF0F0; border: 1px solid #FFD0D0; color: #CC3333;
      padding: 12px 16px; border-radius: 4px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .mood-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .mood-option {
      text-align: center; padding: 12px 8px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
      font-size: 24px; background: white;
    }
    .mood-option:hover { border-color: var(--gold); }
    .mood-option.selected { border-color: var(--gold); background: rgba(184,150,90,0.1); }
    .mood-option span { display: block; font-size: 10px; color: var(--mid-grey); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-in</h1>
    <div class="week-badge" id="weekBadge">Week 1</div>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="metrics-row">
        <div class="form-group">
          <label class="form-label">Weight (kg)</label>
          <input type="number" class="form-input" name="weight" step="0.1" placeholder="65.0">
        </div>
        <div class="form-group">
          <label class="form-label">Waist (cm)</label>
          <input type="number" class="form-input" name="waist" step="0.1" placeholder="78.0">
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <label class="form-label" style="margin:0">Compliance — How well did you follow the plan?</label>
          <div class="slider-value" id="complianceValue">5</div>
        </div>
        <input type="range" class="slider-track" name="compliance_score" min="1" max="10" value="5" id="complianceSlider">
        <div class="slider-labels"><span>Barely followed</span><span>Perfectly followed</span></div>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <label class="form-label" style="margin:0">Energy Level — How did you feel this week?</label>
          <div class="slider-value" id="energyValue">5</div>
        </div>
        <input type="range" class="slider-track" name="energy" min="1" max="10" value="5" id="energySlider">
        <div class="slider-labels"><span>Very low</span><span>Incredible</span></div>
      </div>

      <div class="form-group">
        <label class="form-label">Issues, Challenges, or Feedback</label>
        <textarea class="form-textarea" name="issues" placeholder="Anything we should know? Pain, sleep issues, motivation, schedule conflicts..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos</label>
        <p style="font-size:12px; color:var(--mid-grey); margin-bottom:12px;">Front, side, back — same lighting, same time of day ideally.</p>
        <div class="file-upload" id="photoUpload">
          <p>Tap to upload photos (max 3)</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="file-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Check-in</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-in Complete!</h2>
      <p>Thank you for your honesty. Your updated program will be sent to you on WhatsApp shortly. Keep pushing!</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c') || '';
    var weekNo = params.get('w') || '1';
    document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

    var complianceSlider = document.getElementById('complianceSlider');
    var energySlider = document.getElementById('energySlider');
    complianceSlider.addEventListener('input', function() {
      document.getElementById('complianceValue').textContent = this.value;
    });
    energySlider.addEventListener('input', function() {
      document.getElementById('energyValue').textContent = this.value;
    });

    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photoInput');
    var photoPreview = document.getElementById('photoPreview');
    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function() {
      photoPreview.innerHTML = '';
      var files = Array.from(photoInput.files).slice(0, 3);
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          photoPreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorMsg = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errorMsg.style.display = 'none';

      var formData = new FormData(this);
      var data = {
        client_id: formData.get('client_id'),
        week_no: formData.get('week_no'),
        weight: formData.get('weight'),
        waist: formData.get('waist'),
        compliance_score: formData.get('compliance_score'),
        energy: formData.get('energy'),
        issues: formData.get('issues'),
        photos_urls: []
      };

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errorMsg.textContent = err.message || 'Something went wrong. Please try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
