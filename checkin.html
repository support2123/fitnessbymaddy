<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly progress check-in for Fitness by Maddy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header {
      background: var(--charcoal); padding: 40px 24px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: white;
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .form-header p { font-size: 14px; color: var(--gold-light); letter-spacing: 1px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px;
      padding: 6px 20px; border-radius: 4px; margin-top: 12px;
    }
    .form-wrap {
      max-width: 520px; margin: -20px auto 40px; padding: 40px 28px;
      background: white; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
      color: var(--gold); margin: 32px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .form-section-title:first-child { margin-top: 0; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .slider-wrap { display: flex; align-items: center; gap: 16px; }
    .slider-wrap input[type="range"] {
      flex: 1; padding: 0; height: 6px; appearance: none; background: var(--light-grey);
      border-radius: 3px; border: none; outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: var(--gold); cursor: pointer;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--charcoal);
      min-width: 36px; text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 8px;
      padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); margin-top: 8px; }
    .photo-upload input { display: none; }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 4px;
      border: 2px solid var(--light-grey);
    }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold);
      letter-spacing: 2px; margin-bottom: 12px;
    }
    .success-msg p { font-size: 15px; color: var(--mid-grey); line-height: 1.6; }
    .error-msg {
      display: none; background: #fee; color: #c00; padding: 12px 16px;
      border-radius: 4px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <p>Track your progress — every number matters</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-wrap">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <div class="form-section-title">Body Stats</div>

      <div class="field">
        <label for="weight">Current Weight (kg) *</label>
        <input type="number" id="weight" name="weight" required step="0.1" min="30" max="250" placeholder="72.5">
      </div>
      <div class="field">
        <label for="waist">Waist Measurement (cm)</label>
        <input type="number" id="waist" name="waist" step="0.1" min="40" max="200" placeholder="82">
      </div>

      <div class="form-section-title">Self-Assessment</div>

      <div class="field">
        <label>Compliance Score — How well did you follow the plan?</label>
        <div class="slider-wrap">
          <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
          <div class="slider-val" id="complianceVal">7</div>
        </div>
      </div>
      <div class="field">
        <label>Energy Level — How's your energy this week?</label>
        <div class="slider-wrap">
          <input type="range" id="energy" name="energy" min="1" max="10" value="7">
          <div class="slider-val" id="energyVal">7</div>
        </div>
      </div>

      <div class="form-section-title">Notes & Issues</div>

      <div class="field">
        <label for="issues">Any issues, struggles, or wins this week?</label>
        <textarea id="issues" name="issues" placeholder="Missed a session, felt great on legs day, sleep was bad..."></textarea>
      </div>

      <div class="form-section-title">Progress Photos</div>

      <div class="field">
        <label>Upload 3 photos: Front, Side, Back</label>
        <div class="photo-upload" id="photoUpload">
          <div style="font-size:32px;">📸</div>
          <p>Tap to upload photos (max 3)</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-In Submitted!</h2>
      <p>Great work staying consistent! Maddy will review your progress and your updated program will be sent soon.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compliance').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    const photoUpload = document.getElementById('photoUpload');
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    let selectedFiles = [];

    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function() {
      const files = Array.from(this.files).slice(0, 3);
      selectedFiles = files;
      photoPreview.innerHTML = '';
      files.forEach(function(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          photoPreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    const form = document.getElementById('checkinForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!clientId) {
        errorMsg.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';

      var photosB64 = [];
      for (var i = 0; i < selectedFiles.length; i++) {
        var b64 = await fileToBase64(selectedFiles[i]);
        photosB64.push(b64);
      }

      var data = {
        client_id: clientId,
        week_no: weekNo,
        weight: form.weight.value,
        waist: form.waist.value || null,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value.trim(),
        photos_urls: photosB64
      };

      try {
        var resp = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        var result = await resp.json();

        if (resp.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT CHECK-IN';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT CHECK-IN';
      }
    });

    function fileToBase64(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
