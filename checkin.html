<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .range-group { display: flex; align-items: center; gap: 16px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-val { font-size: 18px; font-weight: 600; color: var(--gold); min-width: 30px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <h1 class="section-title">Weekly <em>Check-In</em></h1>
      <p class="section-body" style="margin:0 auto">Share your progress so we can optimise your next week.</p>
    </div>

    <div class="form-card" id="checkinForm">
      <form id="checkin" onsubmit="submitCheckin(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input class="form-input" type="number" step="0.1" name="weight" required placeholder="70.5">
          </div>
          <div class="form-group">
            <label class="form-label">Waist Measurement (inches)</label>
            <input class="form-input" type="number" step="0.1" name="waist" placeholder="32">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Workout Compliance (1 = missed everything, 10 = perfect) *</label>
          <div class="range-group">
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span class="range-val" id="compVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Energy Level (1 = exhausted, 10 = amazing) *</label>
          <div class="range-group">
            <input type="range" name="energy" min="1" max="10" value="6" oninput="document.getElementById('energyVal').textContent=this.value">
            <span class="range-val" id="energyVal">6</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Any issues, pain, or concerns?</label>
          <textarea class="form-textarea" name="issues" placeholder="Anything we should know — sleep issues, cravings, soreness, life stress..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Progress Photos (front, side, back)</label>
          <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
            <p>Tap to upload up to 3 photos</p>
            <input type="file" id="photoInput" accept="image/*" multiple onchange="previewPhotos(this)">
          </div>
          <div class="photo-preview" id="photoPreview"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>Check-In Received!</h2>
      <p>Great work this week. Your updated program will be sent to you on WhatsApp within 24 hours.</p>
    </div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var clientId = params.get('c');
var weekNo = params.get('w') || '1';

document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

function previewPhotos(input) {
  var preview = document.getElementById('photoPreview');
  preview.innerHTML = '';
  var files = Array.from(input.files).slice(0, 3);
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

async function submitCheckin(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var photoUrls = [];
  var photoInput = document.getElementById('photoInput');

  if (photoInput.files.length > 0) {
    var files = Array.from(photoInput.files).slice(0, 3);
    for (var i = 0; i < files.length; i++) {
      var formData = new FormData();
      formData.append('file', files[i]);
      formData.append('client_id', clientId);
      formData.append('week_no', weekNo);
      // Photos uploaded inline as base64 for simplicity
      var reader = new FileReader();
      var base64 = await new Promise(function(resolve) {
        reader.onload = function(ev) { resolve(ev.target.result); };
        reader.readAsDataURL(files[i]);
      });
      photoUrls.push(base64);
    }
  }

  var form = document.getElementById('checkin');
  var data = Object.fromEntries(new FormData(form));
  data.client_id = clientId;
  data.week_no = weekNo;
  data.photos_urls = photoUrls;

  delete data[''];

  try {
    var res = await fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT CHECK-IN';
    alert('Network error. Please check your connection.');
  }
}
</script>
</body>
</html>
