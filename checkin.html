<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: white;
    }
    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 2px;
      margin-top: 10px;
    }
    .form-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      min-height: 80px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .slider-field {
      margin-bottom: 20px;
    }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      height: 6px;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      min-width: 36px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 4px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload .upload-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .photo-upload p {
      font-size: 12px;
      color: var(--mid-grey);
      letter-spacing: 0.5px;
    }
    .photo-previews {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .photo-previews img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid var(--light-grey);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 16px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 15px;
      line-height: 1.6;
    }
    .error-msg {
      background: #FFF0F0;
      color: #CC3333;
      padding: 12px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .required::after { content: ' *'; color: var(--gold); }
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .mood-option {
      text-align: center;
      padding: 10px 4px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 20px;
    }
    .mood-option:hover { border-color: var(--gold); }
    .mood-option.selected {
      border-color: var(--gold);
      background: rgba(184,150,90,0.1);
    }
    .mood-option span {
      display: block;
      font-size: 9px;
      color: var(--mid-grey);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>WEEKLY CHECK-IN</h1>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-section">
        <div class="form-section-title">BODY STATS</div>
        <div class="row">
          <div class="field">
            <label class="required">Current Weight (kg)</label>
            <input type="number" name="weight" required min="30" max="250" step="0.1" placeholder="65.0">
          </div>
          <div class="field">
            <label>Waist (cm)</label>
            <input type="number" name="waist" min="40" max="200" step="0.1" placeholder="76.0">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">SELF ASSESSMENT</div>
        <div class="slider-field">
          <label class="required">Compliance Score — how well did you follow the plan?</label>
          <div class="slider-wrap">
            <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceSlider">
            <div class="slider-val" id="complianceVal">7</div>
          </div>
        </div>
        <div class="slider-field">
          <label class="required">Energy Level — how did you feel this week?</label>
          <div class="slider-wrap">
            <input type="range" name="energy" min="1" max="10" value="7" id="energySlider">
            <div class="slider-val" id="energyVal">7</div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">FEEDBACK</div>
        <div class="field">
          <label>Issues, Challenges, or Questions</label>
          <textarea name="issues" placeholder="Anything you struggled with this week, questions about exercises, or things you want adjusted..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">PROGRESS PHOTOS</div>
        <div class="photo-upload" id="photoUpload">
          <div class="upload-icon">+</div>
          <p>Tap to upload up to 3 photos (front, side, back)</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Great work staying consistent! Your coach will review your progress and your updated program will be sent to WhatsApp shortly.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('complianceSlider').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energySlider').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photoInput');
    var photoPreviews = document.getElementById('photoPreviews');
    var selectedFiles = [];

    photoUpload.addEventListener('click', function() { photoInput.click(); });

    photoInput.addEventListener('change', function() {
      var files = Array.from(this.files).slice(0, 3);
      selectedFiles = files;
      photoPreviews.innerHTML = '';
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          photoPreviews.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var fd = new FormData(this);
      var data = {};
      fd.forEach(function(v, k) { data[k] = v; });
      data.photos_urls = [];

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (res.ok) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errEl.textContent = res.data.error || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
