<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkin-page { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .checkin-header { text-align: center; margin-bottom: 48px; }
    .checkin-week { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px; }
    .checkin-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-val { font-size: 20px; font-weight: 600; color: var(--charcoal); min-width: 30px; text-align: center; font-family: 'Cormorant Garamond', serif; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--light-grey); }
    .checkin-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 8px;
    }
    .checkin-submit:hover { background: var(--gold); }
    .checkin-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); line-height: 1.7; }
    .hidden { display: none; }
    @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="checkin-page">
    <div class="checkin-header">
      <div class="checkin-week" id="weekBadge">Week —</div>
      <p class="section-eyebrow">Weekly Check-in</p>
      <h1 class="section-title">How Was Your <em>Week?</em></h1>
      <p class="section-body" style="margin: 0 auto;">Quick update so we can fine-tune your next week's plan.</p>
    </div>

    <form id="checkinForm" class="checkin-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input type="number" name="weight" class="form-input" step="0.1" min="30" max="300" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist (inches)</label>
          <input type="number" name="waist" class="form-input" step="0.1" min="15" max="80">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Workout Compliance (1 = skipped most, 10 = followed 100%) *</label>
        <div class="range-group">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceRange">
          <span class="range-val" id="complianceVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level (1 = exhausted, 10 = amazing) *</label>
        <div class="range-group">
          <input type="range" name="energy" min="1" max="10" value="6" id="energyRange">
          <span class="range-val" id="energyVal">6</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Any Issues or Notes?</label>
        <textarea name="issues" class="form-textarea" placeholder="Sore joints, sleep trouble, cravings, schedule changes, anything you want Maddy to know..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side &amp; back photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="checkin-submit" id="submitBtn">Submit Check-in</button>
    </form>

    <div id="successMsg" class="success-msg hidden">
      <h2>Check-in Received!</h2>
      <p>Your updated program will be ready within 24 hours. Keep pushing!</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';
  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  var complianceRange = document.getElementById('complianceRange');
  var complianceVal = document.getElementById('complianceVal');
  complianceRange.addEventListener('input', function() { complianceVal.textContent = this.value; });

  var energyRange = document.getElementById('energyRange');
  var energyVal = document.getElementById('energyVal');
  energyRange.addEventListener('input', function() { energyVal.textContent = this.value; });

  var photoUpload = document.getElementById('photoUpload');
  var photoInput = document.getElementById('photoInput');
  var photoPreview = document.getElementById('photoPreview');
  var selectedFiles = [];

  photoUpload.addEventListener('click', function() { photoInput.click(); });
  photoInput.addEventListener('change', function() {
    var files = Array.from(this.files).slice(0, 3);
    selectedFiles = files;
    photoPreview.innerHTML = '';
    files.forEach(function(f) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      photoPreview.appendChild(img);
    });
  });

  var form = document.getElementById('checkinForm');
  var submitBtn = document.getElementById('submitBtn');
  var successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!clientId) { alert('Invalid check-in link. Please use the link sent to your WhatsApp.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    var data = {
      client_id: clientId,
      week_no: weekNo,
      weight: form.weight.value,
      waist: form.waist.value || null,
      compliance_score: form.compliance_score.value,
      energy: form.energy.value,
      issues: form.issues.value.trim(),
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.ok || result.checkin_id) {
        form.classList.add('hidden');
        successMsg.classList.remove('hidden');
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Check-in';
        alert(result.error || 'Something went wrong. Please try again.');
      }
    })
    .catch(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Check-in';
      alert('Network error. Please check your connection and try again.');
    });
  });
})();
</script>

</body>
</html>
