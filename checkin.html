<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; line-height: 1.7; }
    .slider-group { display: flex; align-items: center; gap: 16px; }
    .slider-group input[type="range"] { flex: 1; accent-color: var(--gold); padding: 0; border: none; background: transparent; }
    .slider-value { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--charcoal); min-width: 36px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 24px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; text-transform: uppercase; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">Week 1</div>
      <h1 class="section-title">Weekly <em>Check-In</em></h1>
      <p class="section-body" style="margin:0 auto">Track your progress so we can optimize your next week.</p>
    </div>

    <div class="form-card" id="checkinForm">
      <form id="checkin" onsubmit="submitCheckin(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Current Weight (kg) *</label>
            <input type="number" name="weight" step="0.1" required>
          </div>
          <div class="form-group">
            <label>Waist (cm)</label>
            <input type="number" name="waist" step="0.1">
          </div>
        </div>

        <div class="form-group">
          <label>Compliance Score — How well did you follow the plan?</label>
          <div class="slider-group">
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span class="slider-value" id="compVal">7</span>
            <span style="font-size:11px;color:var(--mid-grey)">/10</span>
          </div>
        </div>

        <div class="form-group">
          <label>Energy Level — How do you feel overall?</label>
          <div class="slider-group">
            <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <span class="slider-value" id="energyVal">7</span>
            <span style="font-size:11px;color:var(--mid-grey)">/10</span>
          </div>
        </div>

        <div class="form-group">
          <label>Issues / Challenges This Week</label>
          <textarea name="issues" placeholder="Any pain, soreness, schedule issues, cravings, sleep problems..."></textarea>
        </div>

        <div class="form-group">
          <label>Progress Photos (front, side, back)</label>
          <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <p>Tap to upload 3 progress photos</p>
          </div>
          <div id="photoPreview" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Check-In Complete!</h2>
      <p>Great work staying consistent. Your updated program will be sent to you on WhatsApp within 24 hours.</p>
    </div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var clientId = params.get('c');
var weekNo = params.get('w') || '1';
document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

document.getElementById('photoInput').addEventListener('change', function(e) {
  var preview = document.getElementById('photoPreview');
  preview.innerHTML = '';
  Array.from(e.target.files).forEach(function(file) {
    var div = document.createElement('div');
    div.style.cssText = 'width:60px;height:60px;background:var(--sand);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mid-grey)';
    div.textContent = file.name.slice(0, 8);
    preview.appendChild(div);
  });
});

async function submitCheckin(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('checkin');
  var data = Object.fromEntries(new FormData(form));
  data.client_id = clientId;
  data.week_no = weekNo;
  data.photos_urls = [];

  try {
    var res = await fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT CHECK-IN';
    alert('Network error. Please check your connection.');
  }
}
</script>
</body>
</html>
