<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111111;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 20px 24px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 4px;
      color: var(--gold);
    }
    .header p {
      font-size: 12px;
      color: #999;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 2px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,150,90,0.3);
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1.5px solid #333;
      border-radius: 4px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      resize: vertical;
      min-height: 80px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .slider-field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-field .slider-val {
      font-size: 18px;
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      letter-spacing: 1px;
    }
    .slider-field input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      border: none;
      padding: 0;
    }
    .slider-field input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--gold);
      border-radius: 50%;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 32px;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold-light); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .success-msg p {
      color: #999;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WEEKLY CHECK-IN</h1>
    <p>FITNESS BY MADDY</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <form id="checkinForm">
      <div class="section-label">BODY STATS</div>

      <div class="row">
        <div class="field">
          <label>Current Weight (kg) *</label>
          <input type="number" name="weight" required min="30" max="300" step="0.1" placeholder="70.5">
        </div>
        <div class="field">
          <label>Waist (cm)</label>
          <input type="number" name="waist" min="40" max="200" step="0.1" placeholder="80">
        </div>
      </div>

      <div class="section-label">SELF ASSESSMENT</div>

      <div class="field slider-field">
        <label>
          Workout Compliance
          <span class="slider-val" id="complianceVal">5/10</span>
        </label>
        <input type="range" name="compliance_score" min="1" max="10" value="5" id="complianceSlider">
      </div>

      <div class="field slider-field">
        <label>
          Energy Levels
          <span class="slider-val" id="energyVal">5/10</span>
        </label>
        <input type="range" name="energy" min="1" max="10" value="5" id="energySlider">
      </div>

      <div class="section-label">NOTES</div>

      <div class="field">
        <label>Any issues, concerns, or wins this week?</label>
        <textarea name="issues" placeholder="E.g., felt low energy on leg day, hit a PR on bench, shoulder felt tight during OHP..."></textarea>
      </div>

      <div class="section-label">PROGRESS PHOTOS</div>
      <div class="field">
        <label>Upload 3 photos (front, side, back)</label>
        <input type="file" name="photos" accept="image/*" multiple style="color:#999;">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED</h2>
      <p>Great work staying consistent! Your coach will review this and your updated program will arrive on WhatsApp.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    var complianceSlider = document.getElementById('complianceSlider');
    var complianceVal = document.getElementById('complianceVal');
    complianceSlider.addEventListener('input', function() {
      complianceVal.textContent = this.value + '/10';
    });

    var energySlider = document.getElementById('energySlider');
    var energyVal = document.getElementById('energyVal');
    energySlider.addEventListener('input', function() {
      energyVal.textContent = this.value + '/10';
    });

    var form = document.getElementById('checkinForm');
    var btn = document.getElementById('submitBtn');
    var successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!clientId) {
        alert('Invalid check-in link. Please use the link sent to your WhatsApp.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(form);
      var data = {
        client_id: clientId,
        week_no: parseInt(weekNo),
        weight: formData.get('weight'),
        waist: formData.get('waist'),
        compliance_score: formData.get('compliance_score'),
        energy: formData.get('energy'),
        issues: formData.get('issues'),
        photos_urls: [],
      };

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert('Error: ' + (result.error || 'Something went wrong'));
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        alert('Network error. Please try again.');
      });
    });
  </script>
</body>
</html>
