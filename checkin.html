<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --cream: #FAF8F4;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: rgba(184,150,90,0.15);
      border: 1px solid var(--gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--gold-light);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .form-header p {
      color: var(--mid-grey);
      font-size: 14px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(184,150,90,0.3);
      border-radius: 4px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .slider-group {
      margin-bottom: 24px;
    }
    .slider-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 12px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      appearance: none;
      height: 6px;
      background: rgba(184,150,90,0.2);
      border-radius: 3px;
      outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--gold);
      border-radius: 50%;
      cursor: pointer;
    }
    .slider-value {
      min-width: 32px;
      text-align: center;
      font-weight: 600;
      color: var(--gold);
      font-size: 18px;
    }
    .photo-upload {
      margin-bottom: 24px;
    }
    .photo-upload label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .photo-upload .upload-area {
      border: 2px dashed rgba(184,150,90,0.3);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload .upload-area:hover {
      border-color: var(--gold);
    }
    .photo-upload .upload-area p {
      color: var(--mid-grey);
      font-size: 13px;
      margin-top: 8px;
    }
    .photo-upload input[type="file"] {
      display: none;
    }
    .photo-previews {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .photo-previews img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--gold);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 16px;
    }
    .btn-submit:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .form-container { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <h1>WEEKLY CHECK-IN</h1>
      <p>Quick progress update — takes 2 minutes. Your next week's plan depends on this!</p>
    </div>

    <form id="checkinForm">
      <div class="form-row">
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required placeholder="64.5">
        </div>
        <div class="form-group">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" placeholder="72">
        </div>
      </div>

      <div class="slider-group">
        <label>Compliance Score (how well did you follow the plan?)</label>
        <div class="slider-wrap">
          <span style="font-size:12px;color:var(--mid-grey)">1</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceSlider">
          <span style="font-size:12px;color:var(--mid-grey)">10</span>
          <span class="slider-value" id="complianceValue">7</span>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level (average this week)</label>
        <div class="slider-wrap">
          <span style="font-size:12px;color:var(--mid-grey)">1</span>
          <input type="range" name="energy" min="1" max="10" value="6" id="energySlider">
          <span style="font-size:12px;color:var(--mid-grey)">10</span>
          <span class="slider-value" id="energyValue">6</span>
        </div>
      </div>

      <div class="form-group">
        <label>Issues / Notes</label>
        <textarea name="issues" placeholder="Any pain, soreness, sleep issues, stress, missed meals, schedule problems..."></textarea>
      </div>

      <div class="photo-upload">
        <label>Progress Photos (front, side, back)</label>
        <div class="upload-area" id="uploadArea">
          <div style="font-size:32px">📸</div>
          <p>Tap to upload (max 3 photos)</p>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <button type="submit" class="btn-submit">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Nice work staying consistent. Your updated program will be sent via WhatsApp within 24 hours.</p>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var clientId = params.get('c');
      var weekNo = params.get('w') || '1';

      document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

      var compSlider = document.getElementById('complianceSlider');
      var compValue = document.getElementById('complianceValue');
      compSlider.addEventListener('input', function() { compValue.textContent = this.value; });

      var energySlider = document.getElementById('energySlider');
      var energyValue = document.getElementById('energyValue');
      energySlider.addEventListener('input', function() { energyValue.textContent = this.value; });

      var uploadArea = document.getElementById('uploadArea');
      var photoInput = document.getElementById('photoInput');
      var previews = document.getElementById('photoPreviews');
      var selectedFiles = [];

      uploadArea.addEventListener('click', function() { photoInput.click(); });
      photoInput.addEventListener('change', function() {
        var files = Array.from(this.files).slice(0, 3);
        selectedFiles = files;
        previews.innerHTML = '';
        files.forEach(function(file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var img = document.createElement('img');
            img.src = e.target.result;
            previews.appendChild(img);
          };
          reader.readAsDataURL(file);
        });
      });

      var form = document.getElementById('checkinForm');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = form.querySelector('.btn-submit');
        btn.disabled = true;
        btn.textContent = 'SUBMITTING...';

        var data = {
          client_id: clientId,
          week_no: weekNo,
          weight: form.weight.value,
          waist: form.waist.value || null,
          compliance_score: form.compliance_score.value,
          energy: form.energy.value,
          issues: form.issues.value || null,
          photos_urls: []
        };

        fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.success) {
            form.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          } else {
            btn.disabled = false;
            btn.textContent = 'SUBMIT CHECK-IN';
            alert(result.error || 'Something went wrong. Please try again.');
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert('Network error. Please check your connection.');
        });
      });
    })();
  </script>
</body>
</html>
