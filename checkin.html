<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-val { font-size: 18px; font-weight: 600; min-width: 28px; text-align: center; color: var(--charcoal); }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-previews { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-previews img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; margin-bottom: 8px; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <span class="week-badge" id="weekBadge">WEEK --</span>
    <h1 class="section-title">Weekly <em>Check-in</em></h1>
    <p class="section-body" style="margin:12px auto 0">Track your progress so we can optimise your next week.</p>
  </div>

  <div class="form-card" id="checkinForm">
    <form id="checkin" onsubmit="submitCheckin(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input class="form-input" name="weight" type="number" step="0.1" required placeholder="e.g. 72.5">
        </div>
        <div class="form-group">
          <label class="form-label">Waist (cm)</label>
          <input class="form-input" name="waist" type="number" step="0.1" placeholder="e.g. 82">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Compliance Score (how well did you follow the plan?)</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">Perfect</span>
          <span class="range-val" id="compVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level This Week</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Drained</span>
          <input type="range" name="energy" min="1" max="10" value="6" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">Charged</span>
          <span class="range-val" id="energyVal">6</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Any Issues or Challenges?</label>
        <textarea class="form-textarea" name="issues" placeholder="Missed sessions, sleep issues, cravings, soreness, life stress..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (front, side, back)</label>
        <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
          <p>Tap to upload up to 3 photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple onchange="previewPhotos(this)">
        </div>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Check-in</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Check-in Complete!</h2>
    <p>Your data has been recorded. Your updated program will be sent via WhatsApp within 24 hours.</p>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var clientId = params.get('c');
var weekNo = params.get('w');
document.getElementById('weekBadge').textContent = 'WEEK ' + (weekNo || '--');

function previewPhotos(input) {
  var container = document.getElementById('photoPreviews');
  container.innerHTML = '';
  var files = Array.from(input.files).slice(0, 3);
  files.forEach(function(file) {
    var img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    container.appendChild(img);
  });
}

async function submitCheckin(e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  var form = document.getElementById('checkin');
  var formData = Object.fromEntries(new FormData(form));

  var data = {
    client_id: clientId,
    week_no: weekNo,
    weight: formData.weight,
    waist: formData.waist || null,
    compliance_score: formData.compliance_score,
    energy: formData.energy,
    issues: formData.issues || null,
    photos_urls: []
  };

  try {
    var res = await fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
      alert('Something went wrong. Please try again.');
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SUBMIT CHECK-IN';
    alert('Connection error. Please check your internet and try again.');
  }
}
</script>
</body>
</html>
