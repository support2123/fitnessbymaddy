<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkin-wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; }
    .checkin-header { text-align: center; margin-bottom: 48px; }
    .checkin-form { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .range-group { display: flex; align-items: center; gap: 16px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-val { min-width: 32px; text-align: center; font-weight: 600; font-size: 18px; color: var(--charcoal); }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 32px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); margin: 0; }
    .week-badge {
      display: inline-block; background: var(--charcoal); color: white;
      font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
    }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 60px 24px; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="checkin-wrap">
    <div class="checkin-header">
      <span class="week-badge" id="weekBadge">Week 1</span>
      <h1 class="section-title">Weekly <em>Check-In</em></h1>
      <p class="section-body" style="margin:0 auto">Track your progress so Maddy can optimize your next week's plan.</p>
    </div>

    <form id="checkinForm" class="checkin-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input class="form-input" type="number" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist Measurement (cm)</label>
          <input class="form-input" type="number" name="waist" step="0.1" min="40" max="200">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Plan Compliance (1 = barely followed, 10 = nailed it)</label>
        <div class="range-group">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceRange">
          <span class="range-val" id="complianceVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level (1 = exhausted, 10 = unstoppable)</label>
        <div class="range-group">
          <input type="range" name="energy" min="1" max="10" value="7" id="energyRange">
          <span class="range-val" id="energyVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Issues, Questions, or Notes</label>
        <textarea class="form-textarea" name="issues" placeholder="Anything Maddy should know? Soreness, schedule problems, questions about form..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (Front, Side, Back)</label>
        <label class="photo-upload">
          <input type="file" name="photos" accept="image/*" multiple id="photoInput">
          <p id="photoLabel">Tap to upload 3 progress photos</p>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-In Submitted!</h2>
      <p>Great work staying on track. Your updated program will be sent via WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  var complianceRange = document.getElementById('complianceRange');
  var complianceVal = document.getElementById('complianceVal');
  complianceRange.addEventListener('input', function() { complianceVal.textContent = this.value; });

  var energyRange = document.getElementById('energyRange');
  var energyVal = document.getElementById('energyVal');
  energyRange.addEventListener('input', function() { energyVal.textContent = this.value; });

  var photoInput = document.getElementById('photoInput');
  var photoLabel = document.getElementById('photoLabel');
  photoInput.addEventListener('change', function() {
    var count = this.files.length;
    photoLabel.textContent = count > 0 ? count + ' photo(s) selected' : 'Tap to upload 3 progress photos';
  });

  var form = document.getElementById('checkinForm');
  var btn = document.getElementById('submitBtn');
  var success = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!clientId) { alert('Missing client ID. Please use the link sent to your WhatsApp.'); return; }

    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';

    var data = {
      client_id: clientId,
      week_no: weekNo,
      weight: form.weight.value,
      waist: form.waist.value || null,
      compliance_score: form.compliance_score.value,
      energy: form.energy.value,
      issues: form.issues.value || null,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.error) throw new Error(res.error);
      form.style.display = 'none';
      success.style.display = 'block';
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
      alert('Something went wrong: ' + err.message);
    });
  });
})();
</script>

</body>
</html>
