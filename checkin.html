<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-value { min-width: 28px; text-align: center; font-weight: 600; color: var(--charcoal); }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .form-submit { width: 100%; padding: 16px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; margin-top: 8px; }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 2px; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>
<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Progress Tracker</p>
      <h1 class="section-title">Weekly <em>Check-In</em></h1>
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <p class="section-body" style="margin:0 auto">Track your progress so we can optimise next week's plan for you.</p>
    </div>

    <div class="form-card" id="formCard">
      <form id="checkinForm">
        <input type="hidden" id="clientId" name="client_id">
        <input type="hidden" id="weekNo" name="week_no">

        <div class="form-row">
          <div class="form-group">
            <label>Current Weight (kg)</label>
            <input type="number" name="weight" step="0.1" placeholder="e.g. 72.5">
          </div>
          <div class="form-group">
            <label>Waist (inches)</label>
            <input type="number" name="waist" step="0.1" placeholder="e.g. 32">
          </div>
        </div>

        <div class="form-group">
          <label>Workout Compliance (1-10)</label>
          <div class="range-group">
            <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceRange">
            <span class="range-value" id="complianceVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label>Energy Level (1-10)</label>
          <div class="range-group">
            <input type="range" name="energy" min="1" max="10" value="7" id="energyRange">
            <span class="range-value" id="energyVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label>Any Issues or Challenges This Week?</label>
          <textarea name="issues" placeholder="E.g., felt tired on Day 3, couldn't complete all sets, had a social event..."></textarea>
        </div>

        <div class="form-group">
          <label>Progress Photos (Front, Side, Back)</label>
          <div class="photo-upload" id="photoUpload">
            <p>Tap to upload up to 3 photos</p>
            <input type="file" accept="image/*" multiple id="photoInput" max="3">
          </div>
          <div class="photo-preview" id="photoPreview"></div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
      </form>
    </div>

    <div class="success-msg" id="successMsg">
      <h2>Check-In Complete!</h2>
      <p>Great job staying consistent. Your updated plan for next week will be sent via WhatsApp.</p>
    </div>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('c');
  const weekNo = params.get('w') || '1';

  document.getElementById('clientId').value = clientId || '';
  document.getElementById('weekNo').value = weekNo;
  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  document.getElementById('complianceRange').addEventListener('input', function() {
    document.getElementById('complianceVal').textContent = this.value;
  });
  document.getElementById('energyRange').addEventListener('input', function() {
    document.getElementById('energyVal').textContent = this.value;
  });

  var selectedFiles = [];
  document.getElementById('photoUpload').addEventListener('click', function() {
    document.getElementById('photoInput').click();
  });
  document.getElementById('photoInput').addEventListener('change', function() {
    var preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    selectedFiles = Array.from(this.files).slice(0, 3);
    selectedFiles.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.createElement('img');
        img.src = e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('checkinForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var formData = new FormData(this);
    var data = Object.fromEntries(formData.entries());
    data.photos_urls = [];

    try {
      var res = await fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Check-In';
        alert('Something went wrong. Please try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Submit Check-In';
      alert('Network error. Please check your connection.');
    }
  });
})();
</script>
</body>
</html>
