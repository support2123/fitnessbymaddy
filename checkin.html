<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --warm-white: #FFFFFF;
      --sand: #F0EAE0;
      --taupe: #C8B89A;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --accent: #8B6914;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .brand-header a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--charcoal);
      text-decoration: none;
    }

    .form-card {
      background: var(--warm-white);
      border-radius: 8px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
      max-width: 540px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .week-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--warm-white);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      margin: 0 auto 12px;
    }

    .form-title-wrapper {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 4px;
    }

    .form-subtitle {
      color: var(--mid-grey);
      font-size: 14px;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .form-group label .required {
      color: var(--gold);
    }

    .form-group input[type="number"],
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--light-grey);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184, 150, 90, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .slider-wrapper {
      position: relative;
      padding: 0 4px;
    }

    .slider-wrapper input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .slider-wrapper input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(184, 150, 90, 0.4);
    }

    .slider-wrapper input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(184, 150, 90, 0.4);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--mid-grey);
    }

    .slider-value {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--gold);
      margin-top: 4px;
    }

    .file-input-wrapper {
      margin-top: 4px;
    }

    .file-input-wrapper input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--taupe);
      border-radius: 6px;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--mid-grey);
      cursor: pointer;
    }

    .section-divider {
      border: none;
      border-top: 1px solid var(--light-grey);
      margin: 24px 0;
    }

    .section-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--warm-white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(184, 150, 90, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      text-align: center;
      padding: 16px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      display: block;
      background: #f0f9f0;
      color: #2d6b2d;
      border: 1px solid #c8e6c8;
    }

    .message.error {
      display: block;
      background: #fdf0f0;
      color: #8b2d2d;
      border: 1px solid #e6c8c8;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 768px) {
      body { padding: 40px 24px; }
      .form-card { padding: 40px 36px; }
      .form-title { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="brand-header">
    <a href="/">Fitness by Maddy</a>
  </div>

  <div class="form-card">
    <div class="form-title-wrapper">
      <div class="week-badge" id="weekBadge">Week 1</div>
      <h1 class="form-title" id="formTitle">Weekly Check-in</h1>
      <p class="form-subtitle">Progress is progress, no matter how small</p>
    </div>

    <form id="checkinForm" novalidate>
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-group">
        <label>Current Weight (kg) <span class="required">*</span></label>
        <input type="number" name="weight" required min="30" max="200" step="0.1" placeholder="65.0">
      </div>

      <div class="form-group">
        <label>Waist Measurement (cm)</label>
        <input type="number" name="waist" min="40" max="200" step="0.5" placeholder="Optional but helpful">
      </div>

      <hr class="section-divider">

      <div class="slider-group">
        <label>How closely did you follow the plan? <span class="required">*</span></label>
        <div class="slider-wrapper">
          <input type="range" name="compliance" min="1" max="10" value="7" id="complianceSlider">
          <div class="slider-labels">
            <span>Barely</span>
            <span>Perfectly</span>
          </div>
          <div class="slider-value" id="complianceValue">7</div>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy levels this week</label>
        <div class="slider-wrapper">
          <input type="range" name="energy" min="1" max="10" value="6" id="energySlider">
          <div class="slider-labels">
            <span>Exhausted</span>
            <span>Unstoppable</span>
          </div>
          <div class="slider-value" id="energyValue">6</div>
        </div>
      </div>

      <hr class="section-divider">

      <div class="form-group">
        <label>Any issues or concerns?</label>
        <textarea name="issues" placeholder="Soreness, cravings, scheduling conflicts..."></textarea>
      </div>

      <div class="form-group">
        <label>What went well this week?</label>
        <textarea name="wins" placeholder="Celebrate your wins - big or small!"></textarea>
      </div>

      <hr class="section-divider">
      <h2 class="section-heading">Progress Photos</h2>
      <p style="font-size: 13px; color: var(--mid-grey); margin-bottom: 16px;">Same lighting, same time of day for best comparison.</p>

      <div class="form-group">
        <label>Front Photo</label>
        <div class="file-input-wrapper">
          <input type="file" name="photo_front" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label>Side Photo</label>
        <div class="file-input-wrapper">
          <input type="file" name="photo_side" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label>Back Photo</label>
        <div class="file-input-wrapper">
          <input type="file" name="photo_back" accept="image/*">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-in</button>

      <div id="formMessage" class="message"></div>
    </form>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('c');
      const weekNo = params.get('w') || '1';

      document.getElementById('clientId').value = clientId || '';
      document.getElementById('weekNo').value = weekNo;
      document.getElementById('weekBadge').textContent = 'Week ' + weekNo;
      document.getElementById('formTitle').textContent = 'Week ' + weekNo + ' Check-in';

      // Slider interactivity
      const complianceSlider = document.getElementById('complianceSlider');
      const complianceValue = document.getElementById('complianceValue');
      complianceSlider.addEventListener('input', function() {
        complianceValue.textContent = this.value;
      });

      const energySlider = document.getElementById('energySlider');
      const energyValue = document.getElementById('energyValue');
      energySlider.addEventListener('input', function() {
        energyValue.textContent = this.value;
      });

      const form = document.getElementById('checkinForm');
      const submitBtn = document.getElementById('submitBtn');
      const messageEl = document.getElementById('formMessage');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';
        messageEl.className = 'message';
        messageEl.style.display = 'none';

        try {
          const formData = new FormData(form);

          const response = await fetch('/api/checkin-submit', {
            method: 'POST',
            body: formData
          });

          if (!response.ok) {
            throw new Error('Submission failed. Please try again.');
          }

          messageEl.textContent = 'Check-in submitted! Your updated program will be sent within 24 hours. 🎯';
          messageEl.className = 'message success';
          form.reset();
          complianceValue.textContent = '7';
          energyValue.textContent = '6';
        } catch (error) {
          messageEl.textContent = error.message || 'Something went wrong. Please try again.';
          messageEl.className = 'message error';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Submit Check-in';
        }
      });
    })();
  </script>
</body>
</html>
