<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In — FitnessByMaddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: white;
      letter-spacing: 3px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      padding: 4px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 12px;
      border-radius: 2px;
    }
    .form-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--charcoal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .slider-field {
      margin-bottom: 24px;
    }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 12px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: var(--light-grey);
      border-radius: 3px;
      outline: none;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--gold);
      border-radius: 50%;
      cursor: pointer;
    }
    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      min-width: 36px;
      text-align: center;
    }
    .photo-upload {
      margin-bottom: 16px;
    }
    .photo-upload label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .photo-drop {
      border: 2px dashed var(--light-grey);
      border-radius: 4px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-drop:hover { border-color: var(--gold); }
    .photo-drop p { font-size: 14px; color: var(--mid-grey); }
    .photo-drop .icon { font-size: 32px; margin-bottom: 8px; }
    .photo-preview {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .photo-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid var(--light-grey);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 24px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--mid-grey); font-size: 15px; line-height: 1.6; }
    .required::after { content: ' *'; color: var(--gold); }
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .mood-option input { display: none; }
    .mood-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
      color: var(--mid-grey);
    }
    .mood-option label .emoji { font-size: 24px; margin-bottom: 4px; }
    .mood-option input:checked + label {
      border-color: var(--gold);
      background: var(--gold);
      color: white;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>WEEKLY CHECK-IN</h1>
    <div class="week-badge" id="weekBadge">WEEK —</div>
  </div>

  <div class="form-container" id="formWrap">
    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-section">
        <div class="form-section-title">MEASUREMENTS</div>
        <div class="field">
          <label class="required">Current Weight (kg)</label>
          <input type="number" name="weight" min="30" max="300" step="0.1" required>
        </div>
        <div class="field">
          <label>Waist (inches)</label>
          <input type="number" name="waist" min="20" max="80" step="0.1">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">HOW DID THIS WEEK GO?</div>
        <div class="slider-field">
          <label class="required">Compliance Score — How well did you follow the plan?</label>
          <div class="slider-wrap">
            <input type="range" name="compliance_score" min="1" max="10" value="7" id="compSlider">
            <span class="slider-val" id="compVal">7</span>
          </div>
        </div>
        <div class="slider-field">
          <label class="required">Energy Level — How's your energy been?</label>
          <div class="slider-wrap">
            <input type="range" name="energy" min="1" max="10" value="7" id="energySlider">
            <span class="slider-val" id="energyVal">7</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">MOOD CHECK</div>
        <div class="mood-grid">
          <div class="mood-option">
            <input type="radio" name="mood" id="m1" value="struggling">
            <label for="m1"><span class="emoji">😔</span>Tough</label>
          </div>
          <div class="mood-option">
            <input type="radio" name="mood" id="m2" value="meh">
            <label for="m2"><span class="emoji">😐</span>Meh</label>
          </div>
          <div class="mood-option">
            <input type="radio" name="mood" id="m3" value="okay" checked>
            <label for="m3"><span class="emoji">🙂</span>Okay</label>
          </div>
          <div class="mood-option">
            <input type="radio" name="mood" id="m4" value="good">
            <label for="m4"><span class="emoji">😊</span>Good</label>
          </div>
          <div class="mood-option">
            <input type="radio" name="mood" id="m5" value="amazing">
            <label for="m5"><span class="emoji">🔥</span>Fire!</label>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">NOTES & ISSUES</div>
        <div class="field">
          <label>Any issues, pain, or concerns this week?</label>
          <textarea name="issues" placeholder="E.g., left knee hurting during squats, sleep was bad, felt dizzy during cardio..." maxlength="1000"></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">PROGRESS PHOTOS</div>
        <div class="photo-upload">
          <label>Upload up to 3 photos (front, side, back)</label>
          <div class="photo-drop" id="photoDrop">
            <div class="icon">📸</div>
            <p>Tap to upload photos</p>
          </div>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none" max="3">
          <div class="photo-preview" id="photoPreview"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>CHECK-IN RECEIVED!</h2>
    <p>Great work staying accountable. Your updated program will be sent via WhatsApp soon.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compSlider').addEventListener('input', function() {
      document.getElementById('compVal').textContent = this.value;
    });
    document.getElementById('energySlider').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    var photoDrop = document.getElementById('photoDrop');
    var photoInput = document.getElementById('photoInput');
    var photoPreview = document.getElementById('photoPreview');
    var selectedFiles = [];

    photoDrop.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function(e) {
      var files = Array.from(e.target.files).slice(0, 3);
      selectedFiles = files;
      photoPreview.innerHTML = '';
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = document.createElement('img');
          img.src = ev.target.result;
          photoPreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) { data[key] = value; });
      data.photos_urls = [];

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('formWrap').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert(result.error || 'Something went wrong. Please try again.');
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        alert('Network error. Please check your connection and try again.');
      });
    });
  </script>
</body>
</html>
