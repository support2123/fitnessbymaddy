<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 24px 32px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    .form-header p {
      color: #ccc;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      padding: 4px 16px;
      border-radius: 20px;
      margin-top: 12px;
      letter-spacing: 1px;
    }

    .form-container {
      max-width: 480px;
      margin: -20px auto 40px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--charcoal);
    }

    .field label .req { color: var(--gold); }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--light-grey);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      background: var(--cream);
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field textarea { resize: vertical; min-height: 80px; }

    .slider-group { margin-bottom: 20px; }

    .slider-group label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      height: 6px;
    }

    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--gold);
      min-width: 30px;
      text-align: center;
    }

    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input[type="file"] { display: none; }
    .photo-upload p { color: var(--mid-grey); font-size: 0.85rem; }
    .photo-upload .icon { font-size: 1.8rem; margin-bottom: 4px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }

    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 2rem;
    }

    .success-msg p {
      color: var(--mid-grey);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <p>Let us know how your week went</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container" id="formContainer">
    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="field">
        <label>Current Weight (kg) <span class="req">*</span></label>
        <input type="number" name="weight" required step="0.1" min="30" max="250" placeholder="65.5">
      </div>

      <div class="field">
        <label>Waist Measurement (cm)</label>
        <input type="number" name="waist" step="0.1" min="40" max="200" placeholder="76.2">
      </div>

      <div class="slider-group">
        <label>Program Compliance (how well did you follow the plan?)</label>
        <div class="slider-row">
          <span style="font-size:0.75rem;color:var(--mid-grey)">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:0.75rem;color:var(--mid-grey)">High</span>
          <span class="slider-val" id="compVal">7</span>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level</label>
        <div class="slider-row">
          <span style="font-size:0.75rem;color:var(--mid-grey)">Low</span>
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:0.75rem;color:var(--mid-grey)">High</span>
          <span class="slider-val" id="energyVal">7</span>
        </div>
      </div>

      <div class="field">
        <label>Any Issues or Concerns?</label>
        <textarea name="issues" placeholder="Soreness, sleep issues, cravings, schedule conflicts..."></textarea>
      </div>

      <div class="field">
        <label>Progress Photos (front, side, back)</label>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <div class="icon">📸</div>
          <p>Tap to upload your progress photos</p>
          <p id="photoCount"></p>
          <input type="file" id="photos" name="photos" accept="image/*" multiple>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Check-In Submitted!</h2>
    <p>Thanks for checking in. Your updated program will be sent via WhatsApp soon.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('clientId').value = clientId || '';
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('photos').addEventListener('change', function () {
      var count = this.files.length;
      document.getElementById('photoCount').textContent = count ? count + ' photo(s) selected' : '';
    });

    document.getElementById('checkinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var form = e.target;
      var data = {
        client_id: form.client_id.value,
        week_no: form.week_no.value,
        weight: form.weight.value,
        waist: form.waist.value,
        compliance_score: form.compliance_score.value,
        energy: form.energy.value,
        issues: form.issues.value,
        photos_urls: [],
      };

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.success) {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
          } else {
            throw new Error(result.error || 'Failed');
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
          alert('Something went wrong. Please try again.');
        });
    });
  </script>
</body>
</html>
