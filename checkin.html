<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .form-header { background: var(--charcoal); padding: 40px 24px; text-align: center; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); letter-spacing: 3px; }
    .form-header p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-family: 'Bebas Neue', sans-serif; font-size: 16px;
      padding: 4px 16px; border-radius: 4px; margin-top: 12px; letter-spacing: 2px;
    }
    .form-container {
      max-width: 600px; margin: -20px auto 40px; padding: 40px 24px;
      background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      position: relative;
    }
    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); margin-bottom: 8px;
    }
    .form-label .required { color: #e74c3c; }
    .form-input, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .slider-group { margin-bottom: 24px; }
    .slider-label {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold);
    }
    input[type="range"] {
      width: 100%; height: 6px; appearance: none; background: var(--light-grey);
      border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: var(--gold); cursor: pointer;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 8px;
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { color: var(--mid-grey); font-size: 13px; }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--charcoal);
      color: white; border: none; font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px; cursor: pointer;
      border-radius: 4px; transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); }
    .success-msg p { color: var(--mid-grey); margin-top: 12px; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>WEEKLY CHECK-IN</h1>
    <p>Track your progress — it takes 2 minutes</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>
  <div class="form-container">
    <form id="checkinForm">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) <span class="required">*</span></label>
          <input type="number" class="form-input" name="weight" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist (cm)</label>
          <input type="number" class="form-input" name="waist" step="0.1">
        </div>
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <label class="form-label" style="margin-bottom:0">Program Compliance <span class="required">*</span></label>
          <span class="slider-value" id="complianceVal">7</span>
        </div>
        <input type="range" name="compliance_score" min="1" max="10" value="7"
          oninput="document.getElementById('complianceVal').textContent=this.value">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mid-grey);margin-top:4px">
          <span>Barely followed</span><span>Followed perfectly</span>
        </div>
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <label class="form-label" style="margin-bottom:0">Energy Level</label>
          <span class="slider-value" id="energyVal">5</span>
        </div>
        <input type="range" name="energy" min="1" max="10" value="5"
          oninput="document.getElementById('energyVal').textContent=this.value">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mid-grey);margin-top:4px">
          <span>Very low</span><span>Energized</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Issues or Concerns This Week</label>
        <textarea class="form-textarea" name="issues" placeholder="Any pain, soreness, difficulty with exercises, nutrition challenges..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Focus for Next Week</label>
        <textarea class="form-textarea" name="next_week_focus" placeholder="What do you want to improve or focus on?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side, and back photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
          <div class="photo-preview" id="photoPreview"></div>
        </div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Great work staying accountable. Your updated program will be sent shortly.</p>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;
    var uploadedPhotos = [];
    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photoInput');
    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function(e) {
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      var files = Array.from(e.target.files).slice(0, 3);
      files.forEach(function(f) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = document.createElement('img');
          img.src = ev.target.result;
          preview.appendChild(img);
          uploadedPhotos.push(ev.target.result);
        };
        reader.readAsDataURL(f);
      });
    });
    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!clientId) {
        var el = document.getElementById('errorMsg');
        el.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        el.style.display = 'block';
        return;
      }
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      var fd = new FormData(this);
      var data = { client_id: clientId, week_no: weekNo };
      fd.forEach(function(v, k) { if (v) data[k] = v; });
      if (uploadedPhotos.length > 0) data.photos_urls = uploadedPhotos;
      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(d.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        var el = document.getElementById('errorMsg');
        el.textContent = err.message;
        el.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
