<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #111; color: #fff; min-height: 100vh; }
    .form-container { max-width: 420px; margin: 0 auto; padding: 40px 20px 60px; }
    .form-header { text-align: center; margin-bottom: 32px; }
    .form-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: #B8965A; }
    .form-header p { font-size: 14px; color: #999; margin-top: 8px; }
    .week-badge { display: inline-block; background: #B8965A; color: #111; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; padding: 6px 20px; border-radius: 3px; margin-bottom: 12px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #B8965A; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 14px 16px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 4px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #B8965A; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .slider-group { margin-bottom: 24px; }
    .slider-group label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #B8965A; margin-bottom: 10px; }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row input[type="range"] { flex: 1; accent-color: #B8965A; height: 6px; }
    .slider-val { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #B8965A; min-width: 32px; text-align: center; }
    .photo-upload { border: 2px dashed #333; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .photo-upload:hover { border-color: #B8965A; }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 14px; color: #666; }
    .photo-upload .icon { font-size: 28px; margin-bottom: 8px; }
    .btn-submit {
      width: 100%; padding: 16px; background: #B8965A; color: #111;
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s;
      margin-top: 12px;
    }
    .btn-submit:hover { background: #D4AF7A; }
    .btn-submit:disabled { background: #555; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 60px 20px; }
    .success-msg h2 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #B8965A; }
    .success-msg p { color: #999; margin-top: 12px; font-size: 15px; }
    .error-msg { background: #3a1111; border: 1px solid #ff4444; padding: 12px; border-radius: 4px; font-size: 14px; color: #ff6666; margin-bottom: 16px; display: none; }
    .brand-footer { text-align: center; margin-top: 40px; font-size: 12px; color: #444; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">WEEK 1</div>
      <h1>WEEKLY CHECK-IN</h1>
      <p>Track your progress to keep your plan optimized</p>
    </div>

    <div id="error" class="error-msg"></div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-row">
        <div class="form-group">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required placeholder="65.0">
        </div>
        <div class="form-group">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" placeholder="76.0">
        </div>
      </div>

      <div class="slider-group">
        <label>Compliance Score — How well did you follow the plan?</label>
        <div class="slider-row">
          <span style="font-size:12px;color:#666;">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="compSlider">
          <span style="font-size:12px;color:#666;">Perfect</span>
          <div class="slider-val" id="compVal">7</div>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level — How did you feel this week?</label>
        <div class="slider-row">
          <span style="font-size:12px;color:#666;">Low</span>
          <input type="range" name="energy" min="1" max="10" value="7" id="energySlider">
          <span style="font-size:12px;color:#666;">High</span>
          <div class="slider-val" id="energyVal">7</div>
        </div>
      </div>

      <div class="form-group">
        <label>Any Issues or Concerns?</label>
        <textarea name="issues" placeholder="E.g., sore shoulders, sleep was bad, cravings, missed 2 sessions..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos</label>
        <label class="photo-upload" id="photoUpload">
          <div class="icon">📷</div>
          <p>Front, side & back — same lighting as last week</p>
          <input type="file" name="photos" multiple accept="image/*" id="photoInput">
        </label>
        <p id="photoCount" style="font-size:12px;color:#666;margin-top:6px;"></p>
      </div>

      <div class="form-group">
        <label>Wins This Week (optional)</label>
        <textarea name="wins" placeholder="Celebrate something! PR, stuck to plan, better sleep..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div id="successMsg" class="success-msg" style="display:none;">
      <h2>CHECK-IN RECEIVED!</h2>
      <p>Your coach will review your progress and your updated plan will be sent via WhatsApp.</p>
    </div>

    <div class="brand-footer">Fitness by Maddy</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compSlider').addEventListener('input', function() {
      document.getElementById('compVal').textContent = this.value;
    });
    document.getElementById('energySlider').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    document.getElementById('photoInput').addEventListener('change', function() {
      const count = this.files.length;
      document.getElementById('photoCount').textContent = count > 0 ? count + ' photo(s) selected' : '';
    });

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errorEl.style.display = 'none';

      try {
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());
        delete data.photos;
        delete data.wins;

        data.compliance_score = parseInt(data.compliance_score);
        data.energy = parseInt(data.energy);
        data.weight = parseFloat(data.weight);
        if (data.waist) data.waist = parseFloat(data.waist);

        const res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Submission failed');
        }

        document.getElementById('checkinForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
