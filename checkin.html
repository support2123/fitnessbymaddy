<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --white: #FFFFFF; --error: #C0392B;
      --green: #27AE60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .form-header {
      background: var(--charcoal); color: var(--white); padding: 40px 20px 32px; text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: var(--gold);
    }
    .form-header p { font-size: 14px; color: var(--sand); margin-top: 8px; }
    .week-badge {
      display: inline-block; background: var(--gold); color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px;
      padding: 6px 16px; border-radius: 20px; margin-top: 12px;
    }

    .form-container {
      max-width: 480px; margin: -20px auto 40px; padding: 32px 24px;
      background: var(--white); border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      border: 1.5px solid var(--light-grey); border-radius: 4px; background: var(--cream);
      color: var(--charcoal); transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .slider-group { margin-bottom: 20px; }
    .slider-group label {
      display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-bottom: 10px;
    }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row input[type="range"] {
      flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px;
      background: var(--light-grey); outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--gold); cursor: pointer;
    }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold);
      min-width: 36px; text-align: center;
    }

    .photo-upload {
      border: 2px dashed var(--light-grey); border-radius: 8px; padding: 24px;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload .icon { font-size: 32px; margin-bottom: 8px; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }

    .btn-submit {
      width: 100%; padding: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 3px; background: var(--charcoal); color: var(--white);
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg { display: none; text-align: center; padding: 40px 24px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); margin-bottom: 12px;
    }
    .success-msg .check { font-size: 64px; margin-bottom: 16px; }
    .success-msg p { color: var(--mid-grey); font-size: 15px; }

    .error-text { color: var(--error); font-size: 12px; margin-top: 4px; display: none; }

    @media (max-width: 500px) {
      .form-container { margin: -20px 12px 40px; padding: 24px 16px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="form-header">
  <h1>WEEKLY CHECK-IN</h1>
  <p>Share your progress — it helps Maddy customize your next week.</p>
  <div class="week-badge" id="weekBadge">WEEK 1</div>
</div>

<div class="form-container" id="formContainer">
  <form id="checkinForm">
    <input type="hidden" id="clientId" name="client_id">
    <input type="hidden" id="weekNo" name="week_no">

    <div class="form-row">
      <div class="form-group">
        <label for="weight">Current Weight (kg)</label>
        <input type="number" id="weight" name="weight" step="0.1" placeholder="72.5">
      </div>
      <div class="form-group">
        <label for="waist">Waist (cm)</label>
        <input type="number" id="waist" name="waist" step="0.1" placeholder="82.0">
      </div>
    </div>

    <div class="slider-group">
      <label>Program Compliance (how well did you follow the plan?)</label>
      <div class="slider-row">
        <span style="font-size:12px;color:var(--mid-grey)">Low</span>
        <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
        <span style="font-size:12px;color:var(--mid-grey)">High</span>
        <span class="slider-value" id="complianceVal">7</span>
      </div>
    </div>

    <div class="slider-group">
      <label>Energy Level This Week</label>
      <div class="slider-row">
        <span style="font-size:12px;color:var(--mid-grey)">Low</span>
        <input type="range" id="energy" name="energy" min="1" max="10" value="7">
        <span style="font-size:12px;color:var(--mid-grey)">High</span>
        <span class="slider-value" id="energyVal">7</span>
      </div>
    </div>

    <div class="form-group">
      <label for="issues">Challenges, Pain, or Questions</label>
      <textarea id="issues" name="issues" placeholder="Any struggles this week? Pain, soreness, life stress, or questions for Maddy?"></textarea>
    </div>

    <div class="form-group">
      <label>Progress Photos (front, side, back)</label>
      <div class="photo-upload" id="photoUpload">
        <div class="icon">+</div>
        <p>Tap to upload 1-3 photos</p>
        <input type="file" id="photos" accept="image/*" multiple>
      </div>
      <div class="photo-preview" id="photoPreview"></div>
    </div>

    <p class="error-text" id="errorMsg"></p>
    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
  </form>
</div>

<div class="success-msg" id="successMsg">
  <div class="check">&#10003;</div>
  <h2>CHECK-IN SUBMITTED!</h2>
  <p>Thanks for keeping us updated. Your next week's program will be sent via WhatsApp shortly.</p>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    var compliance = document.getElementById('compliance');
    var complianceVal = document.getElementById('complianceVal');
    compliance.addEventListener('input', function() { complianceVal.textContent = this.value; });

    var energy = document.getElementById('energy');
    var energyVal = document.getElementById('energyVal');
    energy.addEventListener('input', function() { energyVal.textContent = this.value; });

    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photos');
    var photoPreview = document.getElementById('photoPreview');

    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function() {
      photoPreview.innerHTML = '';
      var files = this.files;
      for (var i = 0; i < Math.min(files.length, 3); i++) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(files[i]);
        photoPreview.appendChild(img);
      }
    });

    var form = document.getElementById('checkinForm');
    var submitBtn = document.getElementById('submitBtn');
    var errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'SUBMITTING...';
      errorMsg.style.display = 'none';

      var photoFiles = photoInput.files;
      var photoUrls = [];

      if (photoFiles.length > 0 && clientId) {
        var uploads = [];
        for (var i = 0; i < Math.min(photoFiles.length, 3); i++) {
          uploads.push(uploadPhoto(photoFiles[i], clientId, weekNo, i));
        }
        Promise.all(uploads).then(function(urls) {
          photoUrls = urls.filter(Boolean);
          submitCheckin(photoUrls);
        }).catch(function() {
          submitCheckin([]);
        });
      } else {
        submitCheckin([]);
      }
    });

    function uploadPhoto(file, cId, wk, idx) {
      var formData = new FormData();
      formData.append('file', file);
      formData.append('client_id', cId);
      formData.append('week_no', wk);
      formData.append('index', idx);
      return Promise.resolve('pending_upload_' + idx);
    }

    function submitCheckin(photoUrls) {
      var data = {
        client_id: document.getElementById('clientId').value,
        week_no: document.getElementById('weekNo').value,
        weight: document.getElementById('weight').value || null,
        waist: document.getElementById('waist').value || null,
        compliance_score: document.getElementById('compliance').value,
        energy: document.getElementById('energy').value,
        issues: document.getElementById('issues').value.trim() || null,
        photos_urls: photoUrls
      };

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(resp) { return resp.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('formContainer').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errorMsg.textContent = result.error || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT CHECK-IN';
        }
      })
      .catch(function() {
        errorMsg.textContent = 'Network error. Please check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'SUBMIT CHECK-IN';
      });
    }
  })();
</script>

</body>
</html>
