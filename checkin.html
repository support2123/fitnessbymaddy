<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly check-in to track your progress.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --success: #4CAF50;
      --error: #E53935;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .form-header p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 2px;
      margin-top: 12px;
    }
    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 28px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .slider-field {
      margin-bottom: 20px;
    }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--charcoal);
      min-width: 32px;
      text-align: center;
    }
    .photo-upload {
      margin-bottom: 16px;
    }
    .photo-upload label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .photo-slot {
      aspect-ratio: 3/4;
      border: 2px dashed var(--light-grey);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.3s;
      overflow: hidden;
      position: relative;
    }
    .photo-slot:hover { border-color: var(--gold); }
    .photo-slot.has-photo { border-style: solid; border-color: var(--gold); }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-slot .placeholder {
      font-size: 24px;
      color: var(--light-grey);
    }
    .photo-slot .photo-label {
      font-size: 9px;
      color: var(--mid-grey);
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .photo-slot input { display: none; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      margin-top: 12px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .status-msg {
      text-align: center;
      padding: 12px;
      border-radius: 2px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success { display: block; background: #E8F5E9; color: var(--success); }
    .status-msg.error { display: block; background: #FFEBEE; color: var(--error); }
    .emoji-scale {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--mid-grey);
      margin-top: 4px;
      padding: 0 4px;
    }
    .required::after { content: ' *'; color: var(--error); }
  </style>
</head>
<body>

<div class="form-header">
  <h1>WEEKLY CHECK-IN</h1>
  <p>Let's track your progress this week</p>
  <div class="week-badge" id="weekBadge">WEEK 1</div>
</div>

<div class="form-container">
  <form id="checkinForm" novalidate>
    <input type="hidden" id="clientId" name="client_id">
    <input type="hidden" id="weekNo" name="week_no">

    <div class="form-section">
      <div class="form-section-title">BODY METRICS</div>
      <div class="field-row">
        <div class="field">
          <label class="required">Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required placeholder="70.5">
        </div>
        <div class="field">
          <label>Waist (cm)</label>
          <input type="number" name="waist" step="0.1" placeholder="82">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">HOW DID THIS WEEK GO?</div>

      <div class="slider-field">
        <label class="required">Program Compliance (did you follow the plan?)</label>
        <div class="slider-row">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="complianceSlider">
          <span class="slider-value" id="complianceValue">7</span>
        </div>
        <div class="emoji-scale"><span>Barely followed</span><span>Nailed it!</span></div>
      </div>

      <div class="slider-field">
        <label class="required">Energy Level This Week</label>
        <div class="slider-row">
          <input type="range" name="energy" min="1" max="10" value="6" id="energySlider">
          <span class="slider-value" id="energyValue">6</span>
        </div>
        <div class="emoji-scale"><span>Very low</span><span>Fully charged</span></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">NOTES & ISSUES</div>
      <div class="field">
        <label>Any issues, challenges, or concerns this week?</label>
        <textarea name="issues" placeholder="E.g., shoulder felt tight during presses, had trouble sleeping, couldn't meal prep on Thursday..."></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">PROGRESS PHOTOS</div>
      <p style="font-size:12px; color:var(--mid-grey); margin-bottom:12px;">
        Take photos in the same lighting & pose each week for best comparison.
      </p>
      <div class="photo-upload">
        <div class="photo-grid">
          <div class="photo-slot" onclick="this.querySelector('input').click()">
            <span class="placeholder">+</span>
            <span class="photo-label">FRONT</span>
            <input type="file" accept="image/*" data-slot="0" onchange="handlePhoto(this)">
          </div>
          <div class="photo-slot" onclick="this.querySelector('input').click()">
            <span class="placeholder">+</span>
            <span class="photo-label">SIDE</span>
            <input type="file" accept="image/*" data-slot="1" onchange="handlePhoto(this)">
          </div>
          <div class="photo-slot" onclick="this.querySelector('input').click()">
            <span class="placeholder">+</span>
            <span class="photo-label">BACK</span>
            <input type="file" accept="image/*" data-slot="2" onchange="handlePhoto(this)">
          </div>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('c');
  const weekNo = params.get('w') || '1';

  document.getElementById('clientId').value = clientId || '';
  document.getElementById('weekNo').value = weekNo;
  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  document.getElementById('complianceSlider').addEventListener('input', function() {
    document.getElementById('complianceValue').textContent = this.value;
  });
  document.getElementById('energySlider').addEventListener('input', function() {
    document.getElementById('energyValue').textContent = this.value;
  });

  var photoData = [null, null, null];

  function handlePhoto(input) {
    var slot = parseInt(input.dataset.slot);
    var file = input.files[0];
    if (!file) return;

    var parent = input.parentElement;
    var reader = new FileReader();

    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      photoData[slot] = { data: base64, name: file.name, type: file.type };

      parent.classList.add('has-photo');
      var existing = parent.querySelector('img');
      if (existing) existing.remove();

      var img = document.createElement('img');
      img.src = e.target.result;
      parent.insertBefore(img, parent.firstChild);

      var placeholder = parent.querySelector('.placeholder');
      if (placeholder) placeholder.style.display = 'none';
      var label = parent.querySelector('.photo-label');
      if (label) label.style.display = 'none';
    };

    reader.readAsDataURL(file);
  }

  document.getElementById('checkinForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    if (!clientId) {
      var msg = document.getElementById('statusMsg');
      msg.className = 'status-msg error';
      msg.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
      return;
    }

    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    msg.className = 'status-msg';

    var formData = Object.fromEntries(new FormData(this));
    formData.photos = photoData.filter(Boolean);

    try {
      var res = await fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData),
      });

      var result = await res.json();

      if (res.ok) {
        msg.className = 'status-msg success';
        msg.textContent = 'Check-in submitted! Your updated program will be sent to your WhatsApp soon.';
        btn.textContent = 'SUBMITTED ✓';
      } else {
        throw new Error(result.error || 'Failed');
      }
    } catch (err) {
      msg.className = 'status-msg error';
      msg.textContent = 'Something went wrong. Please try again or message us on WhatsApp.';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    }
  });
</script>
</body>
</html>
