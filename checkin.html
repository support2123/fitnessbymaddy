<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 600px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-value { min-width: 24px; text-align: center; font-weight: 600; color: var(--gold); }
    .photo-upload { display: flex; gap: 12px; flex-wrap: wrap; }
    .photo-box {
      width: 100px; height: 100px; border: 2px dashed var(--light-grey);
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.3s;
    }
    .photo-box:hover { border-color: var(--gold); }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
    .photo-box input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .photo-box span { font-size: 24px; color: var(--light-grey); }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { background: var(--mid-grey); cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 20px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="form-page">
  <div class="form-header">
    <p class="section-eyebrow">Weekly Progress</p>
    <h1 class="section-title">Check-in <em>Form</em></h1>
    <div class="week-badge" id="weekBadge">WEEK —</div>
    <p class="section-body" style="margin:12px auto 0">Track your progress and help us optimize your next week.</p>
  </div>

  <div class="form-card" id="checkinForm">
    <form id="checkin" onsubmit="submitCheckin(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input class="form-input" name="weight" type="number" step="0.1" required placeholder="65.5">
        </div>
        <div class="form-group">
          <label class="form-label">Waist (inches)</label>
          <input class="form-input" name="waist" type="number" step="0.1" placeholder="30">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Workout Compliance (1-10) *</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">High</span>
          <span class="range-value" id="compVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Energy Level (1-10) *</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:12px;color:var(--mid-grey)">High</span>
          <span class="range-value" id="energyVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Any issues or challenges this week?</label>
        <textarea class="form-textarea" name="issues" placeholder="Missed workouts, hunger, fatigue, soreness, schedule issues..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (Front, Side, Back)</label>
        <div class="photo-upload">
          <div class="photo-box" id="photo1">
            <span>+</span>
            <input type="file" accept="image/*" onchange="previewPhoto(this, 'photo1')">
          </div>
          <div class="photo-box" id="photo2">
            <span>+</span>
            <input type="file" accept="image/*" onchange="previewPhoto(this, 'photo2')">
          </div>
          <div class="photo-box" id="photo3">
            <span>+</span>
            <input type="file" accept="image/*" onchange="previewPhoto(this, 'photo3')">
          </div>
        </div>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="form-submit" id="submitBtn">Submit Check-in</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Check-in Complete!</h2>
    <p>Your progress has been logged. Your updated program will be sent to your WhatsApp shortly.</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const clientId = params.get('c');
const weekNo = params.get('w');
document.getElementById('weekBadge').textContent = 'WEEK ' + (weekNo || '—');

const photoData = [null, null, null];

function previewPhoto(input, boxId) {
  const file = input.files[0];
  if (!file) return;
  const idx = parseInt(boxId.replace('photo', '')) - 1;
  const reader = new FileReader();
  reader.onload = function(e) {
    photoData[idx] = e.target.result;
    const box = document.getElementById(boxId);
    let img = box.querySelector('img');
    if (!img) { img = document.createElement('img'); box.appendChild(img); }
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitCheckin(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';

  if (!clientId || !weekNo) {
    errorEl.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  const data = Object.fromEntries(new FormData(form));
  data.client_id = clientId;
  data.week_no = weekNo;
  data.photos = photoData.filter(Boolean);

  try {
    const resp = await fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || 'Submission failed');

    document.getElementById('checkinForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'SUBMIT CHECK-IN';
  }
}
</script>
</body>
</html>
