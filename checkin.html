<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .form-header {
      background: var(--charcoal);
      padding: 32px 24px;
      text-align: center;
    }
    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .form-header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 300;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--charcoal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      transition: border-color 0.3s;
      outline: none;
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea {
      min-height: 100px;
      resize: vertical;
    }
    .slider-field {
      margin-bottom: 24px;
    }
    .slider-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      min-width: 36px;
      text-align: center;
    }
    .photo-upload {
      margin-bottom: 18px;
    }
    .photo-upload label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .photo-slot {
      aspect-ratio: 3/4;
      border: 2px dashed var(--light-grey);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.3s;
      overflow: hidden;
      position: relative;
    }
    .photo-slot:hover { border-color: var(--gold); }
    .photo-slot.has-photo { border-style: solid; border-color: var(--gold); }
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-slot .photo-label {
      font-size: 10px;
      color: var(--mid-grey);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .photo-slot .photo-icon {
      font-size: 24px;
      color: var(--light-grey);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled {
      background: var(--mid-grey);
      cursor: not-allowed;
    }
    .success-msg {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .success-msg p {
      color: var(--mid-grey);
      font-size: 15px;
      line-height: 1.7;
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>Weekly Check-In</h1>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
    <p>Track your progress — every data point drives your next week's program</p>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-section">
        <div class="form-section-title">Body Metrics</div>
        <div class="field">
          <label for="weight">Current Weight (kg) *</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field">
          <label for="waist">Waist Measurement (cm)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="40" max="200">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Self Assessment</div>
        <div class="slider-field">
          <label>Program Compliance (1 = didn't follow, 10 = perfect) *</label>
          <div class="slider-row">
            <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <div class="slider-value" id="compVal">7</div>
          </div>
        </div>
        <div class="slider-field">
          <label>Energy Level (1 = exhausted, 10 = energised) *</label>
          <div class="slider-row">
            <input type="range" id="energy" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <div class="slider-value" id="energyVal">7</div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Progress Photos</div>
        <div class="photo-upload">
          <label>Upload 3 photos (front, side, back)</label>
          <div class="photo-grid">
            <div class="photo-slot" onclick="document.getElementById('photo1').click()">
              <div class="photo-icon" id="icon1">+</div>
              <div class="photo-label">Front</div>
              <input type="file" id="photo1" accept="image/*" style="display:none" onchange="previewPhoto(this, 'slot1', 'icon1')">
              <img id="slot1" style="display:none">
            </div>
            <div class="photo-slot" onclick="document.getElementById('photo2').click()">
              <div class="photo-icon" id="icon2">+</div>
              <div class="photo-label">Side</div>
              <input type="file" id="photo2" accept="image/*" style="display:none" onchange="previewPhoto(this, 'slot2', 'icon2')">
              <img id="slot2" style="display:none">
            </div>
            <div class="photo-slot" onclick="document.getElementById('photo3').click()">
              <div class="photo-icon" id="icon3">+</div>
              <div class="photo-label">Back</div>
              <input type="file" id="photo3" accept="image/*" style="display:none" onchange="previewPhoto(this, 'slot3', 'icon3')">
              <img id="slot3" style="display:none">
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Notes</div>
        <div class="field">
          <label for="issues">Challenges, concerns, or anything to flag</label>
          <textarea id="issues" name="issues" placeholder="e.g. struggled with meal prep, knee felt sore during squats, work stress affecting sleep..."></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Check-In</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>Check-In Complete!</h2>
      <p>Great job staying consistent. Your updated program will be sent to your WhatsApp within 24 hours.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    function previewPhoto(input, imgId, iconId) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.getElementById(imgId);
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById(iconId).style.display = 'none';
          input.parentElement.classList.add('has-photo');
          input.parentElement.querySelector('.photo-label').style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) { data[key] = value; });
      data.photo_urls = [];

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errorEl.textContent = result.error || 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      })
      .catch(function() {
        errorEl.textContent = 'Network error. Please check your connection and try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
