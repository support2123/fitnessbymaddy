<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 24px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .range-group { position: relative; }
    .range-value { position: absolute; right: 0; top: 0; font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 1px; }
    .form-range { width: 100%; -webkit-appearance: none; height: 4px; background: var(--light-grey); border-radius: 2px; outline: none; margin-top: 8px; }
    .form-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--gold); border-radius: 50%; cursor: pointer; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .success-msg { text-align: center; padding: 40px; display: none; }
    .success-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .success-msg p { color: var(--mid-grey); }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 2px; margin-bottom: 8px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <div class="week-badge" id="weekBadge">WEEK 1</div>
    <h1 class="section-title">Weekly <em>Check-in</em></h1>
    <p class="section-body" style="margin:12px auto 0">Track your progress so we can optimise your next week.</p>
  </div>

  <div class="form-card" id="checkinForm">
    <form id="checkin" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input type="number" name="weight" class="form-input" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist (inches)</label>
          <input type="number" name="waist" class="form-input" step="0.1">
        </div>
      </div>

      <div class="form-group range-group">
        <label class="form-label">Compliance Score</label>
        <span class="range-value" id="compVal">7/10</span>
        <input type="range" name="compliance_score" class="form-range" min="1" max="10" value="7" id="compRange">
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--mid-grey); margin-top:4px;">
          <span>Barely followed</span><span>Perfect adherence</span>
        </div>
      </div>

      <div class="form-group range-group">
        <label class="form-label">Energy Level</label>
        <span class="range-value" id="energyVal">7/10</span>
        <input type="range" name="energy" class="form-range" min="1" max="10" value="7" id="energyRange">
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--mid-grey); margin-top:4px;">
          <span>Exhausted</span><span>Fully energised</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Any Issues or Concerns?</label>
        <textarea name="issues" class="form-textarea" placeholder="Soreness, sleep issues, hunger, motivation, schedule problems..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (Front, Side, Back)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload up to 3 photos</p>
          <input type="file" accept="image/*" multiple id="photoInput" max="3">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Submit Check-in</button>
    </form>
  </div>

  <div class="success-msg" id="successMsg">
    <h2>Check-in Received!</h2>
    <p>Your coach is reviewing your progress. Updated program coming to WhatsApp soon.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

  var compRange = document.getElementById('compRange');
  var energyRange = document.getElementById('energyRange');
  compRange.addEventListener('input', function() { document.getElementById('compVal').textContent = this.value + '/10'; });
  energyRange.addEventListener('input', function() { document.getElementById('energyVal').textContent = this.value + '/10'; });

  var photoUpload = document.getElementById('photoUpload');
  var photoInput = document.getElementById('photoInput');
  var photoPreview = document.getElementById('photoPreview');
  var selectedFiles = [];

  photoUpload.addEventListener('click', function() { photoInput.click(); });
  photoInput.addEventListener('change', function() {
    selectedFiles = Array.from(this.files).slice(0, 3);
    photoPreview.innerHTML = '';
    selectedFiles.forEach(function(f) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      photoPreview.appendChild(img);
    });
  });

  document.getElementById('checkin').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      client_id: clientId,
      week_no: parseInt(weekNo),
      weight: parseFloat(document.querySelector('[name=weight]').value) || null,
      waist: parseFloat(document.querySelector('[name=waist]').value) || null,
      compliance_score: parseInt(compRange.value),
      energy: parseInt(energyRange.value),
      issues: document.querySelector('[name=issues]').value,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Check-in';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
