<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In — Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --white: #FFFFFF;
      --error: #C0392B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    .form-header {
      background: var(--charcoal);
      padding: 40px 20px 30px;
      text-align: center;
    }

    .form-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 3px;
    }

    .form-header .week-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 6px 20px;
      border-radius: 2px;
      margin-top: 12px;
    }

    .form-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .field-group {
      margin-bottom: 24px;
    }

    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .field-group input,
    .field-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--light-grey);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--white);
      transition: border-color 0.3s;
    }

    .field-group input:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .field-group textarea { min-height: 80px; resize: vertical; }

    .field-group .hint {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      height: 6px;
    }

    .slider-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      min-width: 36px;
      text-align: center;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mid-grey);
      margin-top: 4px;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .mood-grid label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 4px;
      border: 1px solid var(--light-grey);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--charcoal);
    }

    .mood-grid label:has(input:checked) {
      border-color: var(--gold);
      background: rgba(184, 150, 90, 0.1);
    }

    .mood-grid input { display: none; }
    .mood-grid .emoji { font-size: 24px; }

    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload .upload-text { font-size: 14px; color: var(--mid-grey); }
    .photo-upload .upload-icon { font-size: 28px; margin-bottom: 8px; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 16px;
    }

    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { background: var(--mid-grey); cursor: not-allowed; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg .check { font-size: 48px; }

    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      margin: 16px 0 8px;
    }

    .success-msg p { color: var(--mid-grey); font-size: 15px; }

    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-header">
    <h1>WEEKLY CHECK-IN</h1>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="stats-row">
        <div class="field-group">
          <label for="weight">Weight (kg) *</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="250" required>
        </div>
        <div class="field-group">
          <label for="waist">Waist (cm)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="40" max="200">
        </div>
      </div>

      <div class="slider-group">
        <label>Program Compliance</label>
        <div class="slider-wrap">
          <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
          <div class="slider-val" id="complianceVal">7</div>
        </div>
        <div class="slider-labels">
          <span>Struggled</span>
          <span>Crushed it</span>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level</label>
        <div class="slider-wrap">
          <input type="range" id="energy" name="energy" min="1" max="10" value="7">
          <div class="slider-val" id="energyVal">7</div>
        </div>
        <div class="slider-labels">
          <span>Drained</span>
          <span>Energized</span>
        </div>
      </div>

      <div class="field-group">
        <label>How are you feeling?</label>
        <div class="mood-grid">
          <label><input type="radio" name="mood" value="great"><span class="emoji">🔥</span>Great</label>
          <label><input type="radio" name="mood" value="good"><span class="emoji">💪</span>Good</label>
          <label><input type="radio" name="mood" value="okay"><span class="emoji">😊</span>Okay</label>
          <label><input type="radio" name="mood" value="tired"><span class="emoji">😴</span>Tired</label>
          <label><input type="radio" name="mood" value="struggling"><span class="emoji">😓</span>Struggling</label>
        </div>
      </div>

      <div class="field-group">
        <label for="issues">Issues or Notes</label>
        <textarea id="issues" name="issues" placeholder="Any pain, discomfort, schedule challenges, or things you want to share..."></textarea>
      </div>

      <div class="field-group">
        <label>Progress Photos</label>
        <div class="photo-upload" id="photoDropzone">
          <div class="upload-icon">📸</div>
          <div class="upload-text">Tap to upload 3 photos (front, side, back)</div>
          <input type="file" id="photos" accept="image/*" multiple>
        </div>
        <div class="hint">Same lighting & angle as last week for best comparison</div>
        <div id="photoPreview"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <div class="check">✅</div>
      <h2>CHECK-IN RECEIVED!</h2>
      <p>Your coach will review your progress and your updated program will be sent shortly. Keep pushing! 💪</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('clientId').value = clientId || '';
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compliance').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    document.getElementById('photoDropzone').addEventListener('click', function() {
      document.getElementById('photos').click();
    });

    document.getElementById('photos').addEventListener('change', function(e) {
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      Array.from(e.target.files).slice(0, 3).forEach(function(f) {
        var span = document.createElement('span');
        span.style.cssText = 'display:inline-block;margin:4px;padding:4px 8px;background:var(--sand);border-radius:4px;font-size:12px;';
        span.textContent = f.name;
        preview.appendChild(span);
      });
    });

    function fileToBase64(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result.split(',')[1]); };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      if (!clientId) {
        errEl.textContent = 'Invalid check-in link. Please use the link sent to your WhatsApp.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
        return;
      }

      var data = {
        client_id: clientId,
        week_no: weekNo,
        weight: document.getElementById('weight').value,
        waist: document.getElementById('waist').value,
        compliance_score: document.getElementById('compliance').value,
        energy: document.getElementById('energy').value,
        issues: document.getElementById('issues').value,
        photos: [],
      };

      var photoFiles = document.getElementById('photos').files;
      for (var i = 0; i < Math.min(photoFiles.length, 3); i++) {
        var b64 = await fileToBase64(photoFiles[i]);
        data.photos.push({ name: photoFiles[i].name, data: b64 });
      }

      try {
        var resp = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (!resp.ok) {
          var err = await resp.json();
          throw new Error(err.error || 'Submission failed');
        }

        document.getElementById('checkinForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
