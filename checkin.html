<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s;
      margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 60px 24px; display: none; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); }
    .slider-group { margin-bottom: 20px; }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--gold); }
    .slider-val { font-size: 20px; font-weight: 600; color: var(--charcoal); min-width: 28px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); border-radius: 4px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .week-badge { display: inline-block; background: var(--gold); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px; border-radius: 2px; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-header">
    <div class="week-badge" id="weekBadge">Week 1</div>
    <h1 class="section-title">Weekly <em>Check-in</em></h1>
    <p class="section-body" style="margin:0 auto">Track your progress so Maddy can optimise your next week.</p>
  </div>

  <div id="formContainer">
    <form id="checkinForm" class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg) *</label>
          <input type="number" name="weight" class="form-input" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Waist (inches)</label>
          <input type="number" name="waist" class="form-input" step="0.1">
        </div>
      </div>

      <div class="slider-group">
        <label class="form-label">Workout Compliance (1-10) *</label>
        <div class="slider-row">
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <span class="slider-val">7</span>
        </div>
      </div>

      <div class="slider-group">
        <label class="form-label">Energy Level (1-10) *</label>
        <div class="slider-row">
          <input type="range" name="energy" min="1" max="10" value="7" oninput="this.nextElementSibling.textContent=this.value">
          <span class="slider-val">7</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Issues / Challenges This Week</label>
        <textarea name="issues" class="form-textarea" placeholder="Any pain, soreness, sleep issues, stress, missed sessions..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side & back photos</p>
          <input type="file" accept="image/*" multiple id="photoInput">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="form-submit">Submit Check-in</button>
    </form>
  </div>

  <div class="form-success" id="successMsg">
    <h2>Check-in Received!</h2>
    <p>Maddy will review your progress and your updated program will be sent shortly.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  var photoInput = document.getElementById('photoInput');
  var photoUpload = document.getElementById('photoUpload');
  var photoPreview = document.getElementById('photoPreview');

  photoUpload.addEventListener('click', function() { photoInput.click(); });

  photoInput.addEventListener('change', function() {
    photoPreview.innerHTML = '';
    var files = Array.from(this.files).slice(0, 3);
    files.forEach(function(file) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      photoPreview.appendChild(img);
    });
  });

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = this.querySelector('.form-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var data = {
      client_id: clientId,
      week_no: parseInt(weekNo),
      weight: parseFloat(this.weight.value) || null,
      waist: parseFloat(this.waist.value) || null,
      compliance_score: parseInt(this.compliance_score.value),
      energy: parseInt(this.energy.value),
      issues: this.issues.value || null,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Check-in';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
