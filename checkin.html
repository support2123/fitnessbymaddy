<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <meta name="description" content="Submit your weekly progress check-in for your Fitness by Maddy program.">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="form-page">
  <div class="form-header">
    <div class="form-header-logo">Fitness by Maddy</div>
    <h1 class="form-header-title">WEEKLY CHECK-IN</h1>
    <p class="form-header-sub" id="weekLabel">Week Progress Update</p>
  </div>

  <div class="form-container">
    <div id="msg" class="msg"></div>

    <form id="checkinForm" novalidate>
      <input type="hidden" id="client_id" name="client_id">
      <input type="hidden" id="week_no" name="week_no">

      <div class="form-section-title">MEASUREMENTS</div>

      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg) <span class="required">*</span></label>
          <input type="number" name="weight" step="0.1" required placeholder="65.5">
        </div>
        <div class="field">
          <label>Waist (inches)</label>
          <input type="number" name="waist" step="0.1" placeholder="30">
        </div>
      </div>

      <div class="form-section-title">HOW'S IT GOING?</div>

      <div class="field">
        <label>Compliance Score (1-10) <span class="required">*</span></label>
        <p style="font-size:12px;color:var(--mid-grey);margin-bottom:8px;">How well did you follow the plan this week?</p>
        <div class="rating-group" id="complianceGroup">
          <input type="radio" name="compliance_score" value="1" id="c1"><label for="c1" class="rating-btn">1</label>
          <input type="radio" name="compliance_score" value="2" id="c2"><label for="c2" class="rating-btn">2</label>
          <input type="radio" name="compliance_score" value="3" id="c3"><label for="c3" class="rating-btn">3</label>
          <input type="radio" name="compliance_score" value="4" id="c4"><label for="c4" class="rating-btn">4</label>
          <input type="radio" name="compliance_score" value="5" id="c5"><label for="c5" class="rating-btn">5</label>
          <input type="radio" name="compliance_score" value="6" id="c6"><label for="c6" class="rating-btn">6</label>
          <input type="radio" name="compliance_score" value="7" id="c7"><label for="c7" class="rating-btn">7</label>
          <input type="radio" name="compliance_score" value="8" id="c8"><label for="c8" class="rating-btn">8</label>
          <input type="radio" name="compliance_score" value="9" id="c9"><label for="c9" class="rating-btn">9</label>
          <input type="radio" name="compliance_score" value="10" id="c10"><label for="c10" class="rating-btn">10</label>
        </div>
      </div>

      <div class="field">
        <label>Energy Level (1-10) <span class="required">*</span></label>
        <p style="font-size:12px;color:var(--mid-grey);margin-bottom:8px;">How's your energy been this week?</p>
        <div class="rating-group" id="energyGroup">
          <input type="radio" name="energy" value="1" id="e1"><label for="e1" class="rating-btn">1</label>
          <input type="radio" name="energy" value="2" id="e2"><label for="e2" class="rating-btn">2</label>
          <input type="radio" name="energy" value="3" id="e3"><label for="e3" class="rating-btn">3</label>
          <input type="radio" name="energy" value="4" id="e4"><label for="e4" class="rating-btn">4</label>
          <input type="radio" name="energy" value="5" id="e5"><label for="e5" class="rating-btn">5</label>
          <input type="radio" name="energy" value="6" id="e6"><label for="e6" class="rating-btn">6</label>
          <input type="radio" name="energy" value="7" id="e7"><label for="e7" class="rating-btn">7</label>
          <input type="radio" name="energy" value="8" id="e8"><label for="e8" class="rating-btn">8</label>
          <input type="radio" name="energy" value="9" id="e9"><label for="e9" class="rating-btn">9</label>
          <input type="radio" name="energy" value="10" id="e10"><label for="e10" class="rating-btn">10</label>
        </div>
      </div>

      <div class="field">
        <label>Any Issues or Concerns?</label>
        <textarea name="issues" placeholder="Pain, soreness, bloating, sleep problems, motivation..."></textarea>
      </div>

      <div class="form-section-title">PROGRESS PHOTOS</div>

      <div class="field">
        <label>Upload 3 Photos (Front, Side, Back)</label>
        <div class="photo-upload" id="photoDropZone">
          <div class="photo-upload-icon">📸</div>
          <div class="photo-upload-text">Tap to select photos (max 3)</div>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none" max="3">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
  </div>

  <div class="form-footer">
    <a href="https://fitnessbymaddy.com">fitnessbymaddy.com</a> &middot; Your progress, our priority
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  if (clientId) document.getElementById('client_id').value = clientId;
  document.getElementById('week_no').value = weekNo;
  document.getElementById('weekLabel').textContent = 'Week ' + weekNo + ' Progress Update';

  var photoFiles = [];
  var photoDropZone = document.getElementById('photoDropZone');
  var photoInput = document.getElementById('photoInput');
  var photoPreview = document.getElementById('photoPreview');

  photoDropZone.addEventListener('click', function() { photoInput.click(); });

  photoInput.addEventListener('change', function(e) {
    var files = Array.from(e.target.files).slice(0, 3);
    photoFiles = files;
    photoPreview.innerHTML = '';
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = document.createElement('img');
        img.src = ev.target.result;
        photoPreview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
    photoDropZone.querySelector('.photo-upload-text').textContent = files.length + ' photo(s) selected';
  });

  function resizeImage(file, maxW, maxH) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var w = img.width, h = img.height;
          if (w > maxW) { h = h * (maxW / w); w = maxW; }
          if (h > maxH) { w = w * (maxH / h); h = maxH; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob) { resolve(blob); }, 'image/jpeg', 0.8);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    var compliance = document.querySelector('input[name="compliance_score"]:checked');
    var energy = document.querySelector('input[name="energy"]:checked');

    if (!compliance || !energy) {
      msg.className = 'msg error';
      msg.textContent = 'Please rate both compliance and energy levels.';
      msg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>SUBMITTING...';
    msg.className = 'msg';
    msg.style.display = 'none';

    var fd = new FormData(this);
    var data = {
      client_id: fd.get('client_id'),
      week_no: fd.get('week_no'),
      weight: fd.get('weight'),
      waist: fd.get('waist'),
      compliance_score: fd.get('compliance_score'),
      energy: fd.get('energy'),
      issues: fd.get('issues'),
      photos_urls: []
    };

    var uploadPromises = photoFiles.map(function(file, i) {
      return resizeImage(file, 1200, 1200).then(function(blob) {
        var uploadData = new FormData();
        uploadData.append('file', blob, 'photo_' + i + '.jpg');
        return 'photo_placeholder_' + i;
      });
    });

    Promise.all(uploadPromises).then(function(urls) {
      data.photos_urls = urls;

      return fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.ok) {
        msg.className = 'msg success';
        msg.textContent = 'Check-in submitted! Your updated program will be sent via WhatsApp soon.';
        msg.style.display = 'block';
        btn.innerHTML = 'SUBMITTED ✓';
        document.getElementById('checkinForm').reset();
        photoPreview.innerHTML = '';
        photoFiles = [];
      } else {
        throw new Error(result.error || 'Something went wrong');
      }
    })
    .catch(function(err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Failed to submit. Please try again.';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'SUBMIT CHECK-IN';
    });
  });
})();
</script>
</body>
</html>
