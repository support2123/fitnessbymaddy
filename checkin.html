<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 520px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 40px; }
    .form-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 12px; }
    .form-hero h1 em { font-style: italic; color: var(--gold); }
    .form-hero p { font-size: 14px; color: var(--mid-grey); line-height: 1.7; }
    .week-badge { display: inline-block; background: var(--charcoal); color: white; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px; }
    .checkin-form { background: white; padding: 36px 28px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); padding: 0; border: none; background: transparent; }
    .range-val { font-size: 20px; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--charcoal); min-width: 28px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 24px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    .form-submit { width: 100%; margin-top: 8px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 14px; }
    .form-error { display: none; background: #fff0f0; color: #c00; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <div class="week-badge" id="weekBadge">Week 1</div>
      <h1>Weekly <em>Check-In</em></h1>
      <p>Quick update so we can dial in your next week's program.</p>
    </div>

    <div id="formError" class="form-error"></div>

    <form id="checkinForm" class="checkin-form">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="form-row">
        <div class="form-group">
          <label for="weight">Current Weight (kg)</label>
          <input type="number" id="weight" name="weight" step="0.1" min="30" max="300" placeholder="e.g. 72.5">
        </div>
        <div class="form-group">
          <label for="waist">Waist (cm)</label>
          <input type="number" id="waist" name="waist" step="0.1" min="40" max="200" placeholder="e.g. 82">
        </div>
      </div>

      <div class="form-group">
        <label>How well did you follow the plan? (1-10)</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" id="compliance" name="compliance_score" min="1" max="10" value="7">
          <span style="font-size:12px;color:var(--mid-grey)">Perfect</span>
          <span class="range-val" id="complianceVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label>Energy levels this week (1-10)</label>
        <div class="range-group">
          <span style="font-size:12px;color:var(--mid-grey)">Low</span>
          <input type="range" id="energy" name="energy" min="1" max="10" value="7">
          <span style="font-size:12px;color:var(--mid-grey)">High</span>
          <span class="range-val" id="energyVal">7</span>
        </div>
      </div>

      <div class="form-group">
        <label for="issues">Any issues, pain, or struggles?</label>
        <textarea id="issues" name="issues" placeholder="Mention any discomfort, missed sessions, diet struggles..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos (optional, up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front, side, and back photos</p>
          <input type="file" id="photos" accept="image/*" multiple>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-primary form-submit">Submit Check-In</button>
    </form>

    <div id="formSuccess" class="form-success">
      <h2>Check-in received!</h2>
      <p>Your updated program will be sent on WhatsApp soon. Keep pushing!</p>
    </div>
  </div>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    document.getElementById('clientId').value = clientId || '';
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

    document.getElementById('compliance').addEventListener('input', function() {
      document.getElementById('complianceVal').textContent = this.value;
    });
    document.getElementById('energy').addEventListener('input', function() {
      document.getElementById('energyVal').textContent = this.value;
    });

    var photoUpload = document.getElementById('photoUpload');
    var photoInput = document.getElementById('photos');
    var photoPreview = document.getElementById('photoPreview');

    photoUpload.addEventListener('click', function() { photoInput.click(); });
    photoInput.addEventListener('change', function() {
      photoPreview.innerHTML = '';
      var files = Array.from(this.files).slice(0, 3);
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          photoPreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    var form = document.getElementById('checkinForm');
    var errorEl = document.getElementById('formError');
    var successEl = document.getElementById('formSuccess');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.style.display = 'none';

      if (!clientId) {
        errorEl.textContent = 'Invalid link — client ID missing. Please use the link sent on WhatsApp.';
        errorEl.style.display = 'block';
        return;
      }

      var data = {
        client_id: clientId,
        week_no: parseInt(weekNo),
        weight: document.getElementById('weight').value || null,
        waist: document.getElementById('waist').value || null,
        compliance_score: parseInt(document.getElementById('compliance').value),
        energy: parseInt(document.getElementById('energy').value),
        issues: document.getElementById('issues').value.trim(),
        photos_urls: [],
      };

      var btn = form.querySelector('button');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          form.style.display = 'none';
          successEl.style.display = 'block';
        } else {
          throw new Error(res.error || 'Something went wrong');
        }
      })
      .catch(function(err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Submit Check-In';
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
