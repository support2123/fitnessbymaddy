<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }
    .header {
      background: var(--charcoal);
      padding: 20px 24px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .header p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .week-badge {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: 2px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-grey);
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 4px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      background: white;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--gold);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slider-group {
      margin-bottom: 20px;
    }
    .slider-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--light-grey);
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
    }
    .slider-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--charcoal);
      min-width: 36px;
      text-align: center;
    }
    .photo-upload {
      border: 2px dashed var(--light-grey);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .photo-upload .icon { font-size: 28px; margin-bottom: 8px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--charcoal);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 32px;
    }
    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .success-msg p { color: var(--mid-grey); margin-top: 12px; font-size: 15px; }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #C0392B;
      color: #C0392B;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WEEKLY CHECK-IN</h1>
    <p>Fitness by Maddy</p>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>

  <div class="form-container">
    <div class="error-msg" id="errorMsg"></div>

    <form id="checkinForm">
      <input type="hidden" id="clientId" name="client_id">
      <input type="hidden" id="weekNo" name="week_no">

      <div class="section-label">BODY METRICS</div>

      <div class="field-row">
        <div class="field">
          <label>Current Weight (kg) *</label>
          <input type="number" name="weight" min="30" max="250" step="0.1" required>
        </div>
        <div class="field">
          <label>Waist (cm)</label>
          <input type="number" name="waist" min="40" max="200" step="0.1">
        </div>
      </div>

      <div class="section-label">HOW DID THIS WEEK GO?</div>

      <div class="slider-group">
        <label>Compliance Score — How well did you follow the plan?</label>
        <div class="slider-row">
          <span style="font-size:11px;color:var(--mid-grey)">1</span>
          <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
          <span style="font-size:11px;color:var(--mid-grey)">10</span>
          <div class="slider-value" id="compVal">7</div>
        </div>
      </div>

      <div class="slider-group">
        <label>Energy Level — How's your energy been?</label>
        <div class="slider-row">
          <span style="font-size:11px;color:var(--mid-grey)">1</span>
          <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
          <span style="font-size:11px;color:var(--mid-grey)">10</span>
          <div class="slider-value" id="energyVal">7</div>
        </div>
      </div>

      <div class="field">
        <label>Any issues, struggles, or concerns?</label>
        <textarea name="issues" placeholder="e.g., Shoulder pain during overhead press, cravings at night, sleep issues..."></textarea>
      </div>

      <div class="section-label">PROGRESS PHOTOS</div>

      <div class="field">
        <label>Front, Side & Back — Track your transformation</label>
        <div class="photo-upload" onclick="document.getElementById('photos').click()">
          <div class="icon">📸</div>
          <p id="photoLabel">Tap to upload 3 photos</p>
          <input type="file" id="photos" name="photos" accept="image/*" multiple>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN SUBMITTED!</h2>
      <p>Great work this week! Your coach will review your progress and your updated program will be sent via WhatsApp.</p>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';

    if (clientId) document.getElementById('clientId').value = clientId;
    document.getElementById('weekNo').value = weekNo;
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('photos').addEventListener('change', function() {
      var count = this.files.length;
      document.getElementById('photoLabel').textContent =
        count > 0 ? count + ' photo(s) selected' : 'Tap to upload 3 photos';
    });

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errorEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errorEl.style.display = 'none';

      var formData = new FormData(this);
      var data = {};
      formData.forEach(function(value, key) {
        if (key !== 'photos') data[key] = value;
      });
      data.photos_urls = [];

      fetch('/api/checkin-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.success) {
          document.getElementById('checkinForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      })
      .catch(function(err) {
        errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      });
    });
  </script>
</body>
</html>
