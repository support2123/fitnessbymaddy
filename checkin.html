<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); background: var(--cream);
      transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit {
      width: 100%; padding: 16px; margin-top: 12px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; transition: background 0.3s;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-success { display: none; text-align: center; padding: 60px 20px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); line-height: 1.7; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
    }
    .range-group { display: flex; align-items: center; gap: 12px; }
    .range-group input[type="range"] { flex: 1; accent-color: var(--gold); }
    .range-val { min-width: 28px; text-align: center; font-weight: 600; color: var(--charcoal); }
    .photo-upload-area {
      border: 2px dashed var(--light-grey); border-radius: 4px; padding: 32px;
      text-align: center; cursor: pointer; transition: border-color 0.3s;
    }
    .photo-upload-area:hover { border-color: var(--gold); }
    .photo-upload-area p { font-size: 13px; color: var(--mid-grey); }
    .photo-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .photo-previews img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-hero">
      <div class="week-badge animate-1" id="weekBadge">Week Check-in</div>
      <h1 class="section-title animate-2">Weekly <em>Progress</em> Update</h1>
      <p class="section-body animate-3" style="margin:0 auto">Track your progress so we can optimize your next week's program.</p>
    </div>

    <div class="form-card" id="checkinForm">
      <form id="checkin" onsubmit="return submitCheckin(event)">
        <input type="hidden" id="client_id" name="client_id">
        <input type="hidden" id="week_no" name="week_no">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input class="form-input" type="number" name="weight" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Waist (inches)</label>
            <input class="form-input" type="number" name="waist" step="0.1">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Workout Compliance (1-10) *</label>
          <div class="range-group">
            <span style="font-size:12px;color:var(--mid-grey)">Low</span>
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span style="font-size:12px;color:var(--mid-grey)">High</span>
            <span class="range-val" id="compVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Energy Level (1-10) *</label>
          <div class="range-group">
            <span style="font-size:12px;color:var(--mid-grey)">Low</span>
            <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <span style="font-size:12px;color:var(--mid-grey)">High</span>
            <span class="range-val" id="energyVal">7</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">How was your week? Any issues or concerns?</label>
          <textarea class="form-textarea" name="issues" placeholder="E.g., felt tired on leg days, cravings were tough, shoulder felt sore..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Progress Photos (front, side, back)</label>
          <div class="photo-upload-area" onclick="document.getElementById('photoInput').click()">
            <p>Tap to upload up to 3 photos</p>
            <input type="file" id="photoInput" name="photos" accept="image/*" multiple style="display:none" onchange="previewPhotos(this)">
          </div>
          <div class="photo-previews" id="photoPreviews"></div>
        </div>

        <div class="form-error" id="formError"></div>
        <button type="submit" class="form-submit" id="submitBtn">Submit Check-in</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Check-in Received!</h2>
      <p>Your updated program will be sent to you on WhatsApp shortly. Keep crushing it!</p>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = params.get('w') || '1';

  if (clientId) document.getElementById('client_id').value = clientId;
  document.getElementById('week_no').value = weekNo;
  document.getElementById('weekBadge').textContent = 'Week ' + weekNo + ' Check-in';

  function previewPhotos(input) {
    var container = document.getElementById('photoPreviews');
    container.innerHTML = '';
    var files = Array.from(input.files).slice(0, 3);
    files.forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.createElement('img');
        img.src = e.target.result;
        container.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  function submitCheckin(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var errEl = document.getElementById('formError');
    btn.disabled = true;
    btn.textContent = 'SUBMITTING...';
    errEl.style.display = 'none';

    var form = document.getElementById('checkin');
    var data = {};
    new FormData(form).forEach(function(v, k) {
      if (k !== 'photos') data[k] = v;
    });

    // Photos would be uploaded separately to Supabase Storage in production
    // For now, submit without photo URLs
    data.photo_urls = [];

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.error) throw new Error(res.error);
      document.getElementById('checkinForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function(err) {
      errEl.textContent = err.message || 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'SUBMIT CHECK-IN';
    });
    return false;
  }
</script>
</body>
</html>
