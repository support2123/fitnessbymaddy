<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#FAF8F4;--sand:#F0EAE0;--gold:#B8965A;--gold-light:#D4AF7A;--charcoal:#2C2C2C;--mid-grey:#6B6B6B;--light-grey:#E8E3DC}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh}
    .header{background:var(--charcoal);padding:24px;text-align:center}
    .header h1{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);letter-spacing:4px}
    .header p{color:rgba(255,255,255,.6);font-size:13px;margin-top:4px}
    .week-badge{display:inline-block;background:var(--gold);color:white;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;padding:6px 16px;border-radius:4px;margin-top:8px}
    .container{max-width:480px;margin:0 auto;padding:32px 20px 60px}
    .intro{text-align:center;margin-bottom:32px}
    .intro h2{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--charcoal);letter-spacing:2px}
    .intro p{color:var(--mid-grey);font-size:14px;margin-top:8px;line-height:1.6}
    .form-group{margin-bottom:20px}
    .form-label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid-grey);margin-bottom:8px}
    .form-input,.form-textarea{width:100%;padding:14px 16px;border:1.5px solid var(--light-grey);border-radius:4px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--charcoal);background:white;outline:none;transition:border-color .3s}
    .form-input:focus,.form-textarea:focus{border-color:var(--gold)}
    .form-textarea{resize:vertical;min-height:80px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .slider-group{margin-bottom:20px}
    .slider-row{display:flex;align-items:center;gap:12px}
    .slider-row input[type=range]{flex:1;accent-color:var(--gold);height:6px}
    .slider-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);min-width:32px;text-align:center}
    .photo-upload{border:2px dashed var(--light-grey);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color .3s}
    .photo-upload:hover{border-color:var(--gold)}
    .photo-upload input{display:none}
    .photo-upload p{color:var(--mid-grey);font-size:13px}
    .photo-preview{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .photo-preview img{width:80px;height:80px;object-fit:cover;border-radius:4px;border:1px solid var(--light-grey)}
    .btn-submit{width:100%;padding:16px;background:var(--charcoal);color:white;border:none;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;border-radius:4px;transition:background .3s;margin-top:8px}
    .btn-submit:hover{background:var(--gold)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed}
    .success{display:none;text-align:center;padding:60px 20px}
    .success h2{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);letter-spacing:2px}
    .success p{color:var(--mid-grey);font-size:14px;margin-top:12px;line-height:1.6}
    .error-msg{color:#c0392b;font-size:13px;margin-top:8px;display:none}
  </style>
</head>
<body>
  <div class="header">
    <h1>Fitness by Maddy</h1>
    <p>Weekly Check-In</p>
    <div class="week-badge" id="weekBadge">WEEK —</div>
  </div>
  <div class="container">
    <div class="intro">
      <h2>How Was Your Week?</h2>
      <p>Honest check-ins = better results. Fill this out so your program stays dialed in.</p>
    </div>
    <form id="checkinForm">
      <div class="row">
        <div class="form-group">
          <label class="form-label">Current Weight (kg)</label>
          <input class="form-input" type="number" name="weight" step="0.1" placeholder="65.0">
        </div>
        <div class="form-group">
          <label class="form-label">Waist (cm)</label>
          <input class="form-input" type="number" name="waist" step="0.1" placeholder="78">
        </div>
      </div>
      <div class="slider-group">
        <label class="form-label">Program Compliance (1 = skipped most, 10 = nailed it)</label>
        <div class="slider-row">
          <input type="range" name="compliance_score" min="1" max="10" value="7" id="compSlider">
          <div class="slider-val" id="compVal">7</div>
        </div>
      </div>
      <div class="slider-group">
        <label class="form-label">Energy Level (1 = exhausted, 10 = unstoppable)</label>
        <div class="slider-row">
          <input type="range" name="energy" min="1" max="10" value="7" id="energySlider">
          <div class="slider-val" id="energyVal">7</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Any Issues or Concerns This Week?</label>
        <textarea class="form-textarea" name="issues" placeholder="E.g., sore knee, couldn't sleep, had a stressful week, missed 2 sessions..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Progress Photos (up to 3)</label>
        <div class="photo-upload" id="photoUpload">
          <p>Tap to upload front / side / back photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple>
          <div class="photo-preview" id="photoPreview"></div>
        </div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn-submit" id="submitBtn">SUBMIT CHECK-IN</button>
    </form>
    <div class="success" id="successMsg">
      <h2>Check-In Submitted!</h2>
      <p>Great work this week. Your updated program will be sent to you on WhatsApp shortly.</p>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('c');
    var weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = 'WEEK ' + weekNo;

    document.getElementById('compSlider').oninput = function() { document.getElementById('compVal').textContent = this.value; };
    document.getElementById('energySlider').oninput = function() { document.getElementById('energyVal').textContent = this.value; };

    var selectedFiles = [];
    document.getElementById('photoUpload').addEventListener('click', function() {
      document.getElementById('photoInput').click();
    });
    document.getElementById('photoInput').addEventListener('change', function(e) {
      var files = Array.from(e.target.files).slice(0, 3);
      selectedFiles = files;
      var preview = document.getElementById('photoPreview');
      preview.innerHTML = '';
      files.forEach(function(file) {
        var img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      });
    });

    function fileToBase64(file) {
      return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result.split(',')[1]); };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';
      errEl.style.display = 'none';

      var fd = new FormData(this);
      var data = { client_id: clientId, week_no: weekNo };
      fd.forEach(function(v, k) { data[k] = v; });

      var photos = [];
      for (var i = 0; i < selectedFiles.length; i++) {
        var b64 = await fileToBase64(selectedFiles[i]);
        photos.push({ base64: b64, name: selectedFiles[i].name, type: selectedFiles[i].type });
      }
      data.photos = photos;

      try {
        var r = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        var body = await r.json();
        if (r.ok) {
          document.getElementById('checkinForm').style.display = 'none';
          document.querySelector('.intro').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          errEl.textContent = body.error || 'Something went wrong.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SUBMIT CHECK-IN';
        }
      } catch(ex) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SUBMIT CHECK-IN';
      }
    });
  </script>
</body>
</html>
