<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 100px 24px 60px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
    .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 400; }
    .admin-header h1 em { color: var(--gold); }
    .login-card { max-width: 400px; margin: 120px auto; background: white; padding: 48px 32px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; }
    .login-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 24px; }
    .login-card .form-input { margin-bottom: 16px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 48px; }
    .stat-card { background: white; padding: 28px 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border-top: 3px solid var(--light-grey); }
    .stat-card.highlight { border-top-color: var(--gold); }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; color: var(--charcoal); line-height: 1; margin-bottom: 4px; }
    .stat-card-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); }
    .section-card { background: white; padding: 32px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px; }
    .section-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 20px; color: var(--charcoal); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); padding: 12px 16px; border-bottom: 1px solid var(--light-grey); }
    .data-table td { padding: 12px 16px; font-size: 13px; color: var(--charcoal); border-bottom: 1px solid var(--light-grey); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-new { background: #e3f2fd; color: #1565c0; }
    .badge-qualified { background: #fff3e0; color: #e65100; }
    .badge-dropped { background: #fce4ec; color: #c62828; }
    .badge-converted { background: #e8f5e9; color: #2e7d32; }
    .escalation-item { padding: 16px; border-left: 3px solid #c62828; background: #fce4ec22; margin-bottom: 12px; border-radius: 0 4px 4px 0; }
    .escalation-item p { font-size: 13px; color: var(--charcoal); margin-bottom: 4px; }
    .escalation-item .time { font-size: 11px; color: var(--mid-grey); }
    .logout-btn { font-size: 12px; padding: 8px 20px; background: transparent; border: 1px solid var(--light-grey); color: var(--mid-grey); cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; }
    .logout-btn:hover { border-color: var(--charcoal); color: var(--charcoal); }
    .empty-state { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 14px; }
    #dashboard { display: none; }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr 1fr; } .data-table { font-size: 12px; } .data-table th, .data-table td { padding: 8px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="admin.html" class="active">Dashboard</a></li>
  </ul>
</nav>

<!-- Login -->
<div id="loginSection">
  <div class="login-card">
    <h2>Admin Login</h2>
    <input class="form-input" type="email" id="loginEmail" placeholder="Email">
    <input class="form-input" type="password" id="loginPassword" placeholder="Password">
    <button class="form-submit" onclick="login()" style="width:100%; font-family:'DM Sans',sans-serif;">Sign In</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="admin-wrap">
  <div class="admin-header">
    <h1>Ops <em>Dashboard</em></h1>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card highlight">
      <div class="stat-card-value" id="statLeadsToday">-</div>
      <div class="stat-card-label">Leads Today</div>
    </div>
    <div class="stat-card highlight">
      <div class="stat-card-value" id="statLeadsWeek">-</div>
      <div class="stat-card-label">Leads This Week</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-value" id="statConversion">-</div>
      <div class="stat-card-label">Conversion Rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-value" id="statActiveClients">-</div>
      <div class="stat-card-label">Active Clients</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-value" id="statPendingCheckins">-</div>
      <div class="stat-card-label">Pending Check-ins</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-value" id="statProgramsGenerated">-</div>
      <div class="stat-card-label">Programs This Week</div>
    </div>
  </div>

  <!-- Active Clients by Program -->
  <div class="section-card">
    <h3>Active Clients by Program</h3>
    <table class="data-table">
      <thead><tr><th>Program</th><th>Count</th></tr></thead>
      <tbody id="programBreakdown"></tbody>
    </table>
  </div>

  <!-- Recent Leads -->
  <div class="section-card">
    <h3>Recent Leads</h3>
    <table class="data-table">
      <thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Interest</th><th>Time</th></tr></thead>
      <tbody id="recentLeads"></tbody>
    </table>
  </div>

  <!-- Escalations -->
  <div class="section-card">
    <h3>Escalations</h3>
    <div id="escalations"><div class="empty-state">No pending escalations</div></div>
  </div>
</div>

<script>
  const SUPABASE_URL = '';
  const SUPABASE_ANON_KEY = '';
  let supabase;
  let session = null;

  async function initSupabase() {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    script.onload = () => {
      const url = document.querySelector('meta[name="supabase-url"]')?.content || SUPABASE_URL;
      const key = document.querySelector('meta[name="supabase-key"]')?.content || SUPABASE_ANON_KEY;
      if (url && key) {
        supabase = window.supabase.createClient(url, key);
        checkAuth();
      }
    };
    document.head.appendChild(script);
  }

  async function checkAuth() {
    const { data } = await supabase.auth.getSession();
    if (data.session) {
      session = data.session;
      showDashboard();
    }
  }

  async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if (!supabase) { alert('Dashboard not configured yet.'); return; }
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { alert(error.message); return; }
    session = data.session;
    showDashboard();
  }

  function logout() {
    if (supabase) supabase.auth.signOut();
    session = null;
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }

  async function showDashboard() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadStats();
  }

  async function loadStats() {
    if (!supabase) return;

    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const weekStart = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();

    // Leads today
    const { count: leadsToday } = await supabase.from('leads').select('*', { count: 'exact', head: true }).gte('created_at', todayStart);
    document.getElementById('statLeadsToday').textContent = leadsToday || 0;

    // Leads this week
    const { count: leadsWeek } = await supabase.from('leads').select('*', { count: 'exact', head: true }).gte('created_at', weekStart);
    document.getElementById('statLeadsWeek').textContent = leadsWeek || 0;

    // Conversion rate
    const { count: totalLeads } = await supabase.from('leads').select('*', { count: 'exact', head: true });
    const { count: converted } = await supabase.from('leads').select('*', { count: 'exact', head: true }).eq('status', 'converted');
    const rate = totalLeads > 0 ? Math.round((converted / totalLeads) * 100) : 0;
    document.getElementById('statConversion').textContent = rate + '%';

    // Active clients
    const { count: activeClients } = await supabase.from('clients').select('*', { count: 'exact', head: true }).eq('status', 'active');
    document.getElementById('statActiveClients').textContent = activeClients || 0;

    // Programs generated this week
    const { count: programs } = await supabase.from('programs').select('*', { count: 'exact', head: true }).gte('generated_at', weekStart);
    document.getElementById('statProgramsGenerated').textContent = programs || 0;

    // Pending check-ins (active clients without this week's check-in)
    document.getElementById('statPendingCheckins').textContent = '-';

    // Program breakdown
    const { data: clients } = await supabase.from('clients').select('program').eq('status', 'active');
    const breakdown = {};
    (clients || []).forEach(c => { breakdown[c.program] = (breakdown[c.program] || 0) + 1; });
    const programNames = { '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Flagship', 'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack' };
    const tbody = document.getElementById('programBreakdown');
    tbody.innerHTML = Object.entries(breakdown).map(([k, v]) => `<tr><td>${programNames[k] || k}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan="2" class="empty-state">No active clients yet</td></tr>';

    // Recent leads
    const { data: leads } = await supabase.from('leads').select('*').order('created_at', { ascending: false }).limit(10);
    const leadsBody = document.getElementById('recentLeads');
    leadsBody.innerHTML = (leads || []).map(l => {
      const masked = l.phone ? l.phone.slice(0, 4) + '***' + l.phone.slice(-3) : '-';
      const badge = `<span class="badge badge-${l.status}">${l.status}</span>`;
      const time = new Date(l.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `<tr><td>${masked}</td><td>${l.name || '-'}</td><td>${badge}</td><td>${l.program_interest || '-'}</td><td>${time}</td></tr>`;
    }).join('') || '<tr><td colspan="5" class="empty-state">No leads yet</td></tr>';
  }

  initSupabase();
</script>

</body>
</html>
