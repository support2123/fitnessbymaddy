<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
      --sand: #F0EAE0; --red: #D94F4F; --green: #4CAF50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    /* Login */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--charcoal);
    }
    .login-box {
      background: white; padding: 48px; border-radius: 8px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px;
      text-align: center; margin-bottom: 8px;
    }
    .login-subtitle { font-size: 13px; color: var(--mid-grey); text-align: center; margin-bottom: 32px; }
    .login-input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px; outline: none;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px; background: var(--charcoal); color: white;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px;
      cursor: pointer; transition: background 0.3s;
    }
    .login-btn:hover { background: var(--gold); }
    .login-error { font-size: 12px; color: var(--red); text-align: center; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal); padding: 16px 32px; display: flex;
      align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold);
    }
    .dash-logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: white; letter-spacing: 3px;
    }
    .dash-meta { display: flex; align-items: center; gap: 16px; }
    .dash-refresh {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white;
      padding: 8px 16px; border-radius: 4px; font-size: 12px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; letter-spacing: 1px;
    }
    .dash-refresh:hover { border-color: var(--gold); color: var(--gold); }
    .dash-time { font-size: 12px; color: var(--gold-light); }

    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stat Cards */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: white; padding: 24px; border-radius: 8px;
      border: 1px solid var(--light-grey); position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--light-grey);
    }
    .stat-card.highlight::before { background: var(--gold); }
    .stat-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    /* Section */
    .dash-section { margin-bottom: 32px; }
    .dash-section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
      color: var(--charcoal); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .badge {
      background: var(--red); color: white; font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    }
    .badge-green { background: var(--green); }

    /* Tables */
    .table-wrap { background: white; border-radius: 8px; border: 1px solid var(--light-grey); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 16px; font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey);
      background: var(--sand); border-bottom: 1px solid var(--light-grey);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--light-grey); color: var(--charcoal); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(184,150,90,0.04); }

    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    }
    .status-new { background: #4CAF50; }
    .status-qualified { background: var(--gold); }
    .status-converted { background: #2196F3; }
    .status-dropped { background: var(--red); }
    .status-active { background: #4CAF50; }

    /* Program pills */
    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px;
      font-weight: 600; letter-spacing: 0.5px;
    }
    .pill-gym { background: #E3F2FD; color: #1565C0; }
    .pill-home { background: #F3E5F5; color: #7B1FA2; }
    .pill-12wk { background: #FFF3E0; color: #E65100; }
    .pill-pcos { background: #FCE4EC; color: #C62828; }
    .pill-40plus { background: #E8F5E9; color: #2E7D32; }
    .pill-zoom { background: #F1F8E9; color: #558B2F; }

    .empty-state { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }

    /* Program bar chart */
    .program-bars { display: flex; flex-direction: column; gap: 12px; }
    .program-bar-row { display: flex; align-items: center; gap: 12px; }
    .program-bar-label { font-size: 12px; font-weight: 500; min-width: 120px; color: var(--charcoal); }
    .program-bar-track { flex: 1; height: 24px; background: var(--sand); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; display: flex; align-items: center; padding-left: 8px; }
    .program-bar-count { font-size: 11px; font-weight: 600; color: white; }

    @media (max-width: 768px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-body { padding: 16px; }
      .dash-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-title">Fitness by Maddy</div>
      <div class="login-subtitle">Admin Dashboard</div>
      <input class="login-input" type="password" id="apiKey" placeholder="Enter admin key">
      <button class="login-btn" onclick="login()">Access Dashboard</button>
      <div class="login-error" id="loginError">Invalid key. Please try again.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <div class="dash-logo">Fitness by Maddy — Ops</div>
      <div class="dash-meta">
        <div class="dash-time" id="lastUpdated"></div>
        <button class="dash-refresh" onclick="loadStats()">Refresh</button>
      </div>
    </div>

    <div class="dash-body">
      <!-- Stat Cards -->
      <div class="stat-grid" id="statGrid"></div>

      <!-- Program Distribution -->
      <div class="dash-section">
        <div class="dash-section-title">Active Clients by Program</div>
        <div class="table-wrap" style="padding: 24px;">
          <div class="program-bars" id="programBars"></div>
        </div>
      </div>

      <!-- Pending Check-ins -->
      <div class="dash-section">
        <div class="dash-section-title">
          Pending Check-ins
          <span class="badge" id="pendingBadge" style="display:none">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Client</th><th>Program</th><th>Week</th></tr></thead>
            <tbody id="pendingBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Recent Leads -->
      <div class="dash-section">
        <div class="dash-section-title">Recent Leads</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr></thead>
            <tbody id="leadsBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Recent Messages -->
      <div class="dash-section">
        <div class="dash-section-title">Message Log (Last 20)</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Phone</th><th>Dir</th><th>Message</th><th>Time</th></tr></thead>
            <tbody id="messagesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    var adminKey = '';

    function login() {
      adminKey = document.getElementById('apiKey').value;
      if (!adminKey) return;

      fetch('/api/admin-stats', {
        headers: { 'Authorization': 'Bearer ' + adminKey },
      })
      .then(function(r) {
        if (!r.ok) throw new Error('Unauthorized');
        return r.json();
      })
      .then(function(data) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderDashboard(data);
      })
      .catch(function() {
        document.getElementById('loginError').style.display = 'block';
      });
    }

    document.getElementById('apiKey').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });

    function loadStats() {
      fetch('/api/admin-stats', {
        headers: { 'Authorization': 'Bearer ' + adminKey },
      })
      .then(function(r) { return r.json(); })
      .then(renderDashboard);
    }

    function renderDashboard(data) {
      document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();

      var s = data.stats;
      var grid = document.getElementById('statGrid');
      grid.innerHTML = [
        card('Leads Today', s.leadsToday, '', true),
        card('Leads This Week', s.leadsWeek, ''),
        card('Total Leads', s.leadsTotal, ''),
        card('Conversion Rate', s.conversionRate, '', true),
        card('Active Clients', s.activeClients, '', true),
        card('Pending Check-ins', s.pendingCheckins, '', s.pendingCheckins > 0),
        card('Programs Generated', s.programsGeneratedWeek, 'this week'),
      ].join('');

      // Program bars
      var bars = document.getElementById('programBars');
      var pc = data.programCounts || {};
      var maxCount = Math.max(1, ...Object.values(pc));
      var programNames = {
        '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
        'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack',
      };

      if (Object.keys(pc).length === 0) {
        bars.innerHTML = '<div class="empty-state">No active clients yet</div>';
      } else {
        bars.innerHTML = Object.entries(pc).map(function(entry) {
          var pct = Math.round((entry[1] / maxCount) * 100);
          return '<div class="program-bar-row">' +
            '<div class="program-bar-label">' + (programNames[entry[0]] || entry[0]) + '</div>' +
            '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"><span class="program-bar-count">' + entry[1] + '</span></div></div>' +
            '</div>';
        }).join('');
      }

      // Pending check-ins
      var pendingBadge = document.getElementById('pendingBadge');
      var pendingBody = document.getElementById('pendingBody');
      if (data.pendingCheckins.length > 0) {
        pendingBadge.style.display = 'inline';
        pendingBadge.textContent = data.pendingCheckins.length;
        pendingBody.innerHTML = data.pendingCheckins.map(function(p) {
          return '<tr><td>' + (p.name || 'Unknown') + '</td><td>' + programPill(p.program) + '</td><td>Week ' + p.week_no + '</td></tr>';
        }).join('');
      } else {
        pendingBadge.style.display = 'none';
        pendingBody.innerHTML = '<tr><td colspan="3" class="empty-state">All check-ins submitted!</td></tr>';
      }

      // Recent leads
      var leadsBody = document.getElementById('leadsBody');
      leadsBody.innerHTML = (data.recentLeads || []).map(function(l) {
        return '<tr>' +
          '<td>' + l.phone + '</td>' +
          '<td>' + (l.name || '—') + '</td>' +
          '<td><span class="status-dot status-' + l.status + '"></span>' + l.status + '</td>' +
          '<td>' + (l.program_interest || '—') + '</td>' +
          '<td>' + l.market + '</td>' +
          '<td>' + new Date(l.created_at).toLocaleDateString() + '</td>' +
          '</tr>';
      }).join('');

      // Messages
      var messagesBody = document.getElementById('messagesBody');
      messagesBody.innerHTML = (data.recentMessages || []).map(function(m) {
        var dir = m.direction === 'in' ? '📥' : '📤';
        var body = (m.body || '').substring(0, 80) + ((m.body || '').length > 80 ? '...' : '');
        return '<tr>' +
          '<td>' + m.phone + '</td>' +
          '<td>' + dir + '</td>' +
          '<td>' + body + '</td>' +
          '<td>' + new Date(m.sent_at).toLocaleString() + '</td>' +
          '</tr>';
      }).join('');
    }

    function card(label, value, sub, highlight) {
      return '<div class="stat-card' + (highlight ? ' highlight' : '') + '">' +
        '<div class="stat-card-label">' + label + '</div>' +
        '<div class="stat-card-value">' + value + '</div>' +
        (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') +
        '</div>';
    }

    function programPill(program) {
      var cls = {
        '6wk_gym': 'pill-gym', '6wk_home': 'pill-home', '12wk': 'pill-12wk',
        'pcos': 'pill-pcos', '40plus': 'pill-40plus',
        'zoom_trial': 'pill-zoom', 'zoom_pack': 'pill-zoom',
      };
      return '<span class="pill ' + (cls[program] || '') + '">' + program + '</span>';
    }
  </script>
</body>
</html>
