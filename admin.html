<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --dark: #1a1a1a;
      --green: #4CAF50;
      --red: #e74c3c;
      --orange: #f39c12;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--cream);
      min-height: 100vh;
    }

    /* Login */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-box {
      background: var(--charcoal);
      padding: 48px 40px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border-top: 3px solid var(--gold);
    }
    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .login-box p { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--charcoal);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold);
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .dash-header button {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.5);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .stat-card {
      background: var(--charcoal);
      border-radius: 8px;
      padding: 24px;
      border-left: 3px solid var(--gold);
    }
    .stat-card .label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      color: var(--gold);
      line-height: 1;
    }
    .stat-card .sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }

    /* Sections */
    .dash-section {
      padding: 24px 32px;
    }
    .dash-section h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--charcoal);
      border-radius: 8px;
      overflow: hidden;
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      background: rgba(184,150,90,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .data-table td {
      padding: 12px 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-new { background: rgba(52,152,219,0.2); color: #3498db; }
    .status-qualified { background: rgba(243,156,18,0.2); color: #f39c12; }
    .status-converted { background: rgba(76,175,80,0.2); color: #4CAF50; }
    .status-dropped { background: rgba(231,76,60,0.2); color: #e74c3c; }
    .status-active { background: rgba(76,175,80,0.2); color: #4CAF50; }

    .escalation-card {
      background: var(--charcoal);
      border-left: 3px solid var(--red);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .escalation-card .esc-type {
      font-size: 11px;
      color: var(--red);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .escalation-card .esc-detail {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--mid-grey);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
      .dash-section { padding: 16px; }
      .dash-header { padding: 16px; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>FBM Admin</h1>
    <p>Enter your admin credentials to access the dashboard.</p>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">ACCESS DASHBOARD</button>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>FitnessByMaddy Ops</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="dash-section">
    <h2>Recent Leads</h2>
    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Date</th></tr>
      </thead>
      <tbody id="leadsTable"></tbody>
    </table>
  </div>

  <div class="dash-section">
    <h2>Active Clients</h2>
    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Program</th><th>Started</th><th>Status</th></tr>
      </thead>
      <tbody id="clientsTable"></tbody>
    </table>
  </div>

  <div class="dash-section">
    <h2>Pending Check-ins</h2>
    <div id="pendingCheckins"></div>
  </div>

  <div class="dash-section">
    <h2>Escalations</h2>
    <div id="escalations"></div>
  </div>
</div>

<script>
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';
  var session = null;

  function login() {
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ email: email, password: password }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        session = data;
        localStorage.setItem('fbm_session', JSON.stringify(data));
        showDashboard();
      } else {
        alert('Invalid credentials');
      }
    })
    .catch(function() { alert('Login failed'); });
  }

  function logout() {
    session = null;
    localStorage.removeItem('fbm_session');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStats();
    loadLeads();
    loadClients();
    loadPendingCheckins();
  }

  function dbFetch(table, query) {
    var url = SUPABASE_URL + '/rest/v1/' + table + '?' + (query || '');
    return fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + session.access_token,
        'Prefer': 'count=exact',
      },
    });
  }

  function loadStats() {
    var today = new Date();
    today.setHours(0,0,0,0);
    var weekAgo = new Date(today.getTime() - 7 * 86400000);

    Promise.all([
      dbFetch('leads', 'select=id&created_at=gte.' + today.toISOString()),
      dbFetch('leads', 'select=id&created_at=gte.' + weekAgo.toISOString()),
      dbFetch('leads', 'select=id&status=eq.converted'),
      dbFetch('leads', 'select=id'),
      dbFetch('clients', 'select=id&status=eq.active'),
      dbFetch('programs', 'select=id&generated_at=gte.' + weekAgo.toISOString()),
    ]).then(function(responses) {
      return Promise.all(responses.map(function(r) {
        var count = r.headers.get('content-range');
        return count ? parseInt(count.split('/')[1]) || 0 : 0;
      }));
    }).then(function(counts) {
      var convRate = counts[3] > 0 ? Math.round((counts[2] / counts[3]) * 100) : 0;
      var grid = document.getElementById('statsGrid');
      grid.innerHTML =
        statCard('Leads Today', counts[0], '') +
        statCard('Leads This Week', counts[1], '') +
        statCard('Conversion Rate', convRate + '%', counts[2] + ' converted / ' + counts[3] + ' total') +
        statCard('Active Clients', counts[4], '') +
        statCard('Programs This Week', counts[5], '');
    });
  }

  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  function loadLeads() {
    dbFetch('leads', 'select=*&order=created_at.desc&limit=20')
    .then(function(r) { return r.json(); })
    .then(function(leads) {
      var tbody = document.getElementById('leadsTable');
      if (!leads.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No leads yet</td></tr>'; return; }
      tbody.innerHTML = leads.map(function(l) {
        var phone = l.phone ? l.phone.slice(0,3) + 'XXX...' + l.phone.slice(-3) : '-';
        var date = new Date(l.created_at).toLocaleDateString();
        return '<tr><td>' + (l.name || '-') + '</td><td>' + phone + '</td>' +
          '<td><span class="status-badge status-' + l.status + '">' + l.status + '</span></td>' +
          '<td>' + (l.program_interest || '-') + '</td><td>' + date + '</td></tr>';
      }).join('');
    });
  }

  function loadClients() {
    dbFetch('clients', 'select=*&status=eq.active&order=program_started_at.desc')
    .then(function(r) { return r.json(); })
    .then(function(clients) {
      var tbody = document.getElementById('clientsTable');
      if (!clients.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No active clients</td></tr>'; return; }
      tbody.innerHTML = clients.map(function(c) {
        var started = new Date(c.program_started_at).toLocaleDateString();
        return '<tr><td>' + (c.name || '-') + '</td><td>' + (c.program || '-') + '</td>' +
          '<td>' + started + '</td><td><span class="status-badge status-active">active</span></td></tr>';
      }).join('');
    });
  }

  function loadPendingCheckins() {
    dbFetch('clients', 'select=id,name,phone,program,program_started_at&status=eq.active')
    .then(function(r) { return r.json(); })
    .then(function(clients) {
      var container = document.getElementById('pendingCheckins');
      if (!clients.length) { container.innerHTML = '<div class="empty-state">No active clients</div>'; return; }

      var pending = [];
      var checks = clients.map(function(c) {
        var weekNo = Math.ceil((Date.now() - new Date(c.program_started_at).getTime()) / (7 * 86400000));
        return dbFetch('checkins', 'select=id&client_id=eq.' + c.id + '&week_no=eq.' + weekNo)
          .then(function(r) { return r.json(); })
          .then(function(checkins) {
            if (!checkins.length) {
              pending.push({ name: c.name, program: c.program, week: weekNo });
            }
          });
      });

      Promise.all(checks).then(function() {
        if (!pending.length) { container.innerHTML = '<div class="empty-state">All check-ins submitted</div>'; return; }
        container.innerHTML = pending.map(function(p) {
          return '<div class="escalation-card" style="border-left-color: var(--orange);">' +
            '<div class="esc-type" style="color: var(--orange);">Pending - Week ' + p.week + '</div>' +
            '<div class="esc-detail">' + (p.name || 'Unknown') + ' &middot; ' + p.program + '</div></div>';
        }).join('');
      });
    });
  }

  // Check for stored session on load
  var stored = localStorage.getItem('fbm_session');
  if (stored) {
    try {
      session = JSON.parse(stored);
      showDashboard();
    } catch(e) {
      localStorage.removeItem('fbm_session');
    }
  }
</script>

</body>
</html>
