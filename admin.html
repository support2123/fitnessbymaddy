<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    :root {
      --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a;
      --gold: #B8965A; --gold-light: #D4AF7A; --text: #e0e0e0;
      --text-dim: #888; --green: #4ade80; --red: #f87171; --blue: #60a5fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-box {
      background: var(--card); padding: 48px; border-radius: 8px;
      max-width: 400px; width: 100%; border: 1px solid var(--border);
    }
    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 28px;
      letter-spacing: 2px; color: var(--gold); margin-bottom: 8px;
    }
    .login-box p { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }
    .login-input {
      width: 100%; padding: 14px 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif;
      outline: none; margin-bottom: 16px;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px; background: var(--gold); color: #1a1a1a;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; border: none; cursor: pointer;
      border-radius: 4px; font-family: 'DM Sans', sans-serif;
    }
    .login-btn:hover { background: var(--gold-light); }
    .login-error { color: var(--red); font-size: 12px; margin-bottom: 12px; display: none; }
    .dashboard { display: none; }
    .dash-header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .dash-brand {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 3px; color: var(--gold);
    }
    .dash-nav { display: flex; gap: 16px; align-items: center; }
    .dash-nav button {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 8px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 4px; font-family: 'DM Sans', sans-serif;
    }
    .dash-nav button:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 24px;
    }
    .stat-card .label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); line-height: 1;
    }
    .stat-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      letter-spacing: 2px; color: var(--gold); margin-bottom: 16px;
    }
    .data-table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
    .data-table th {
      text-align: left; font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); padding: 12px 16px;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    .data-table td {
      padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-new { background: rgba(96,165,250,0.15); color: var(--blue); }
    .badge-qualified { background: rgba(212,175,122,0.15); color: var(--gold-light); }
    .badge-converted { background: rgba(74,222,128,0.15); color: var(--green); }
    .badge-dropped { background: rgba(248,113,113,0.15); color: var(--red); }
    .badge-active { background: rgba(74,222,128,0.15); color: var(--green); }
    .badge-paused { background: rgba(212,175,122,0.15); color: var(--gold-light); }
    .badge-completed { background: rgba(96,165,250,0.15); color: var(--blue); }
    .escalation-card {
      background: var(--card); border: 1px solid var(--red);
      border-radius: 8px; padding: 16px; margin-bottom: 12px;
    }
    .escalation-card .esc-reason { font-weight: 600; color: var(--red); font-size: 13px; margin-bottom: 4px; }
    .escalation-card .esc-detail { font-size: 12px; color: var(--text-dim); }
    .empty-state { text-align: center; padding: 48px; color: var(--text-dim); font-size: 13px; }
    .refresh-note { font-size: 11px; color: var(--text-dim); text-align: right; margin-bottom: 16px; }
    @media (max-width: 768px) {
      .dash-header { padding: 12px 16px; }
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px; }
    }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Fitness by Maddy</h1>
    <p>Admin Dashboard — enter your Supabase credentials to continue.</p>
    <div class="login-error" id="loginError">Invalid credentials</div>
    <input class="login-input" type="text" id="supabaseUrl" placeholder="Supabase URL">
    <input class="login-input" type="password" id="supabaseKey" placeholder="Supabase Service Key">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Access Dashboard</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-brand">Fitness by Maddy — Ops Dashboard</div>
    <div class="dash-nav">
      <button onclick="loadDashboard()">Refresh</button>
      <button onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="dash-body">
    <div class="refresh-note" id="refreshNote"></div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">Recent Leads</div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th><th>Phone</th><th>Source</th><th>Market</th>
          <th>Interest</th><th>Status</th><th>Created</th>
        </tr>
      </thead>
      <tbody id="leadsTable"></tbody>
    </table>

    <div class="section-title">Active Clients</div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th><th>Program</th><th>Started</th>
          <th>Ends</th><th>Paid</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="clientsTable"></tbody>
    </table>

    <div class="section-title">Pending Check-Ins</div>
    <div id="pendingCheckins"></div>

    <div class="section-title">Programs Generated This Week</div>
    <div id="programsGenerated"></div>

    <div class="section-title">Escalations</div>
    <div id="escalations"></div>
  </div>
</div>

<script>
var db = null;

function doLogin() {
  var url = document.getElementById('supabaseUrl').value.trim();
  var key = document.getElementById('supabaseKey').value.trim();
  if (!url || !key) {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginError').textContent = 'Both fields are required';
    return;
  }
  sessionStorage.setItem('sb_url', url);
  sessionStorage.setItem('sb_key', key);
  initDashboard();
}

function doLogout() {
  sessionStorage.clear();
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function initDashboard() {
  var url = sessionStorage.getItem('sb_url');
  var key = sessionStorage.getItem('sb_key');
  if (!url || !key) return;

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

async function sbQuery(table, query) {
  var url = sessionStorage.getItem('sb_url');
  var key = sessionStorage.getItem('sb_key');
  var endpoint = url + '/rest/v1/' + table + '?' + query;
  var res = await fetch(endpoint, {
    headers: {
      'apikey': key,
      'Authorization': 'Bearer ' + key,
      'Content-Type': 'application/json',
      'Prefer': 'count=exact'
    }
  });
  var count = res.headers.get('content-range');
  var data = await res.json();
  return { data: data, count: count ? parseInt(count.split('/')[1]) : data.length };
}

function maskPhone(p) {
  if (!p || p.length < 6) return '***';
  return p.slice(0, 3) + 'XXX...' + p.slice(-3);
}

function fmtDate(d) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' });
}

function badge(status) {
  return '<span class="badge badge-' + status + '">' + status + '</span>';
}

async function loadDashboard() {
  document.getElementById('refreshNote').textContent = 'Last refresh: ' + new Date().toLocaleTimeString();

  try {
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    var weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

    var [allLeads, todayLeads, weekLeads, activeClients, allClients, weekPrograms] = await Promise.all([
      sbQuery('leads', 'select=id&limit=1'),
      sbQuery('leads', 'select=id&created_at=gte.' + todayStart),
      sbQuery('leads', 'select=id&created_at=gte.' + weekStart),
      sbQuery('clients', 'select=id&status=eq.active'),
      sbQuery('clients', 'select=id'),
      sbQuery('programs', 'select=id&generated_at=gte.' + weekStart),
    ]);

    var convertedLeads = await sbQuery('leads', 'select=id&status=eq.converted');
    var convRate = allLeads.count > 0 ? Math.round((convertedLeads.count / allLeads.count) * 100) : 0;

    document.getElementById('statsGrid').innerHTML =
      statCard('New Leads Today', todayLeads.count, '') +
      statCard('New Leads This Week', weekLeads.count, '') +
      statCard('Conversion Rate', convRate + '%', 'lead to paid') +
      statCard('Active Clients', activeClients.count, 'across all programs') +
      statCard('Programs Generated', weekPrograms.count, 'this week') +
      statCard('Total Clients', allClients.count, 'all time');

    var leads = await sbQuery('leads', 'select=*&order=created_at.desc&limit=20');
    var leadsHtml = '';
    (leads.data || []).forEach(function(l) {
      leadsHtml += '<tr>' +
        '<td>' + (l.name || '-') + '</td>' +
        '<td>' + maskPhone(l.phone) + '</td>' +
        '<td>' + (l.source || '-') + '</td>' +
        '<td>' + (l.market || '-') + '</td>' +
        '<td>' + (l.program_interest || '-') + '</td>' +
        '<td>' + badge(l.status) + '</td>' +
        '<td>' + fmtDate(l.created_at) + '</td>' +
        '</tr>';
    });
    document.getElementById('leadsTable').innerHTML = leadsHtml || '<tr><td colspan="7" class="empty-state">No leads yet</td></tr>';

    var clients = await sbQuery('clients', 'select=*&status=eq.active&order=created_at.desc&limit=20');
    var clientsHtml = '';
    (clients.data || []).forEach(function(c) {
      clientsHtml += '<tr>' +
        '<td>' + (c.name || '-') + '</td>' +
        '<td>' + (c.program || '-') + '</td>' +
        '<td>' + fmtDate(c.program_started_at) + '</td>' +
        '<td>' + fmtDate(c.program_ends_at) + '</td>' +
        '<td>$' + ((c.paid_amount || 0) / 100).toFixed(0) + '</td>' +
        '<td>' + badge(c.status) + '</td>' +
        '</tr>';
    });
    document.getElementById('clientsTable').innerHTML = clientsHtml || '<tr><td colspan="6" class="empty-state">No active clients</td></tr>';

    var programs = await sbQuery('programs', 'select=*,clients(name,phone)&generated_at=gte.' + weekStart + '&order=generated_at.desc&limit=10');
    var progHtml = '';
    (programs.data || []).forEach(function(p) {
      progHtml += '<div class="escalation-card" style="border-color: var(--border)">' +
        '<div class="esc-reason" style="color: var(--gold)">Week ' + p.week_no + ' — ' + (p.clients?.name || 'Client') + '</div>' +
        '<div class="esc-detail">Generated: ' + fmtDate(p.generated_at) + (p.whatsapp_sent_at ? ' | Sent: ' + fmtDate(p.whatsapp_sent_at) : ' | Not sent yet') + '</div>' +
        '</div>';
    });
    document.getElementById('programsGenerated').innerHTML = progHtml || '<div class="empty-state">No programs generated this week</div>';

    document.getElementById('pendingCheckins').innerHTML = '<div class="empty-state">Check-in tracking updates every Sunday</div>';
    document.getElementById('escalations').innerHTML = '<div class="empty-state">No escalations pending</div>';

  } catch (err) {
    document.getElementById('statsGrid').innerHTML = '<div class="empty-state" style="grid-column: 1/-1">Error loading data: ' + err.message + '. Check your credentials.</div>';
  }
}

function statCard(label, value, sub) {
  return '<div class="stat-card">' +
    '<div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div>' +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>';
}

if (sessionStorage.getItem('sb_url')) {
  initDashboard();
}
</script>

</body>
</html>
