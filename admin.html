<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .admin-header { margin-bottom: 40px; }
    .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; }

    .login-box { max-width: 400px; margin: 120px auto; text-align: center; }
    .login-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 24px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: white; padding: 28px 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border-left: 3px solid var(--gold); }
    .stat-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }

    .section-block { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); padding: 28px; margin-bottom: 24px; }
    .section-block h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; margin-bottom: 20px; color: var(--charcoal); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--light-grey); }
    .data-table td { font-size: 13px; color: var(--charcoal); padding: 10px 12px; border-bottom: 1px solid var(--light-grey); }
    .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; border-radius: 2px; }
    .badge-gold { background: rgba(184,150,90,0.15); color: var(--gold); }
    .badge-red { background: rgba(200,50,50,0.1); color: #c03232; }
    .badge-green { background: rgba(50,160,80,0.1); color: #2a8a3e; }

    .program-bars { display: flex; flex-direction: column; gap: 12px; }
    .program-bar { display: flex; align-items: center; gap: 12px; }
    .program-bar-label { font-size: 12px; color: var(--mid-grey); min-width: 140px; }
    .program-bar-track { flex: 1; height: 8px; background: var(--light-grey); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }
    .program-bar-count { font-size: 13px; font-weight: 600; color: var(--charcoal); min-width: 30px; text-align: right; }

    .loading { text-align: center; padding: 60px; color: var(--mid-grey); }
    #dashboard { display: none; }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr 1fr; } .data-table { font-size: 12px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shred.html">6 Week Shred</a></li>
    <li><a href="custom.html">12 Week Program</a></li>
    <li><a href="vip.html">1-on-1 Coaching</a></li>
  </ul>
</nav>

<div class="page-wrap">

  <div id="loginScreen" class="login-box">
    <p class="section-eyebrow">Admin Access</p>
    <h2>Dashboard <em>Login</em></h2>
    <div class="form-group" style="margin-top:24px;">
      <input class="form-input" type="password" id="tokenInput" placeholder="Enter admin token" style="text-align:center;">
    </div>
    <button class="btn-primary" onclick="loginAdmin()" style="width:100%;margin-top:12px;">Access Dashboard</button>
    <p id="loginError" style="color:#c03232;font-size:12px;margin-top:12px;display:none;">Invalid token. Try again.</p>
  </div>

  <div id="dashboard" class="admin-wrap">
    <div class="admin-header">
      <p class="section-eyebrow">Daily Operations</p>
      <h1>Maddy's <em>Dashboard</em></h1>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-block">
      <h3>Active Clients by Program</h3>
      <div class="program-bars" id="programBars"><p class="loading">Loading...</p></div>
    </div>

    <div class="section-block">
      <h3>Pending Check-Ins</h3>
      <div id="pendingCheckins"><p class="loading">Loading...</p></div>
    </div>

    <div class="section-block">
      <h3>Escalations Awaiting Review</h3>
      <div id="escalations"><p class="loading">Loading...</p></div>
    </div>
  </div>

</div>

<script>
var adminToken = '';

function loginAdmin() {
  adminToken = document.getElementById('tokenInput').value.trim();
  if (!adminToken) return;

  fetch('/api/admin', {
    headers: { 'Authorization': 'Bearer ' + adminToken },
  })
  .then(function(r) {
    if (!r.ok) throw new Error('Unauthorized');
    return r.json();
  })
  .then(function(data) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderDashboard(data);
  })
  .catch(function() {
    document.getElementById('loginError').style.display = 'block';
  });
}

document.getElementById('tokenInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') loginAdmin();
});

function renderDashboard(data) {
  var statsGrid = document.getElementById('statsGrid');
  var stats = [
    { label: 'Leads Today', value: data.leads_today, sub: data.leads_this_week + ' this week' },
    { label: 'Conversion Rate', value: data.conversion_rate, sub: data.total_leads + ' total leads' },
    { label: 'Active Clients', value: data.active_clients, sub: data.total_clients + ' total' },
    { label: 'Pending Check-Ins', value: data.pending_checkins.length, sub: 'awaiting submission' },
    { label: 'Programs Generated', value: data.programs_generated_this_week, sub: 'this week' },
    { label: 'Escalations', value: data.escalations.length, sub: 'needs attention' },
  ];

  statsGrid.innerHTML = stats.map(function(s) {
    return '<div class="stat-card"><div class="stat-card-label">' + s.label + '</div><div class="stat-card-value">' + s.value + '</div><div class="stat-card-sub">' + s.sub + '</div></div>';
  }).join('');

  var programNames = {
    '6wk_gym': '6-Week Burn & Build',
    '6wk_home': '6-Week Home Shred',
    '12wk': '12-Week Custom',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
  };

  var programs = data.clients_by_program || {};
  var maxClients = Math.max(1, Math.max.apply(null, Object.values(programs).concat([1])));
  var barsHtml = '';

  Object.keys(programs).forEach(function(key) {
    var count = programs[key];
    var pct = (count / maxClients) * 100;
    barsHtml += '<div class="program-bar"><span class="program-bar-label">' + (programNames[key] || key) + '</span><div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div><span class="program-bar-count">' + count + '</span></div>';
  });

  document.getElementById('programBars').innerHTML = barsHtml || '<p style="color:var(--mid-grey);font-size:13px;">No active clients yet.</p>';

  var checkinHtml = '';
  if (data.pending_checkins.length > 0) {
    checkinHtml = '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Status</th></tr></thead><tbody>';
    data.pending_checkins.forEach(function(c) {
      checkinHtml += '<tr><td>' + (c.name || 'Unknown') + '</td><td>Week ' + c.week_no + '</td><td><span class="badge badge-gold">Pending</span></td></tr>';
    });
    checkinHtml += '</tbody></table>';
  } else {
    checkinHtml = '<p style="color:var(--mid-grey);font-size:13px;">All check-ins submitted. Nice!</p>';
  }
  document.getElementById('pendingCheckins').innerHTML = checkinHtml;

  var escHtml = '';
  if (data.escalations.length > 0) {
    escHtml = '<table class="data-table"><thead><tr><th>Phone</th><th>Message</th><th>Time</th></tr></thead><tbody>';
    data.escalations.forEach(function(e) {
      var maskedPhone = e.phone ? (e.phone.slice(0,3) + 'XXX...' + e.phone.slice(-3)) : '***';
      var time = new Date(e.sent_at).toLocaleString();
      escHtml += '<tr><td>' + maskedPhone + '</td><td>' + (e.body || '').slice(0, 100) + '</td><td>' + time + '</td></tr>';
    });
    escHtml += '</tbody></table>';
  } else {
    escHtml = '<p style="color:var(--mid-grey);font-size:13px;">No escalations. All clear!</p>';
  }
  document.getElementById('escalations').innerHTML = escHtml;
}
</script>
</body>
</html>
