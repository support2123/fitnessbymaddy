<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A; --gold-light: #D4AF7A;
      --charcoal: #2C2C2C; --mid-grey: #6B6B6B; --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    /* Login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: white; padding: 48px 40px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); max-width: 400px; width: 100%; text-align: center; }
    .login-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--mid-grey); margin-bottom: 32px; }
    .login-card input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 16px; outline: none; background: var(--cream); }
    .login-card input:focus { border-color: var(--gold); }
    .login-card button { width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.3s; }
    .login-card button:hover { background: var(--gold); }
    .login-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header { background: var(--charcoal); padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .dash-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: white; letter-spacing: 2px; text-transform: uppercase; }
    .dash-user { display: flex; align-items: center; gap: 16px; }
    .dash-user span { font-size: 13px; color: rgba(255,255,255,0.6); }
    .dash-logout { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); padding: 6px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card .label { font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.gold .value { color: var(--gold); }

    /* Sections */
    .dash-section { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px; overflow: hidden; }
    .dash-section-header { padding: 20px 24px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .dash-section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; }
    .dash-section-header .badge { background: var(--gold); color: white; padding: 3px 10px; border-radius: 2px; font-size: 11px; font-weight: 600; }

    /* Tables */
    .dash-table { width: 100%; border-collapse: collapse; }
    .dash-table th { text-align: left; padding: 12px 16px; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); background: var(--cream); border-bottom: 1px solid var(--light-grey); }
    .dash-table td { padding: 12px 16px; font-size: 13px; color: var(--charcoal); border-bottom: 1px solid var(--light-grey); }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-table tr:hover td { background: rgba(184,150,90,0.04); }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .status-new { background: #e8f4fd; color: #2980b9; }
    .status-qualified { background: #fef5e7; color: #f39c12; }
    .status-converted { background: #e8f8f5; color: #27ae60; }
    .status-dropped { background: #fde8e8; color: #c0392b; }
    .status-active { background: #e8f8f5; color: #27ae60; }

    /* Programs breakdown */
    .program-bars { padding: 16px 24px; }
    .program-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .program-bar .name { font-size: 13px; min-width: 140px; }
    .program-bar .bar { flex: 1; height: 24px; background: var(--cream); border-radius: 2px; overflow: hidden; }
    .program-bar .bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s; }
    .program-bar .count { font-size: 13px; font-weight: 600; min-width: 30px; text-align: right; }

    /* Escalations */
    .escalation-item { padding: 16px 24px; border-bottom: 1px solid var(--light-grey); }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-item .esc-time { font-size: 11px; color: var(--mid-grey); margin-bottom: 4px; }
    .escalation-item .esc-body { font-size: 13px; color: var(--charcoal); }

    .loading { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 14px; }
    .empty { text-align: center; padding: 32px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 700px) {
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat-card { padding: 16px; }
      .stat-card .value { font-size: 28px; }
      .dash-table { font-size: 12px; }
      .dash-table th, .dash-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-section">
  <div class="login-card">
    <h1>Dashboard</h1>
    <p>Fitness by Maddy — Admin Access</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <div class="login-error" id="login-error">Invalid email or password</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard-section">
  <div class="dash-header">
    <div class="dash-logo">Fitness by Maddy</div>
    <div class="dash-user">
      <span id="user-email"></span>
      <button class="dash-logout" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <div class="dash-body">
    <div class="loading" id="loading">Loading dashboard data...</div>

    <div id="dash-content" style="display:none">
      <!-- Top Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Two columns: Programs + Pending -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px;" class="two-col">
        <!-- Active Clients by Program -->
        <div class="dash-section">
          <div class="dash-section-header">
            <h2>Active Clients by Program</h2>
          </div>
          <div class="program-bars" id="program-bars"></div>
        </div>

        <!-- Pending Check-ins -->
        <div class="dash-section">
          <div class="dash-section-header">
            <h2>Pending Check-Ins</h2>
            <span class="badge" id="pending-count">0</span>
          </div>
          <div id="pending-list"></div>
        </div>
      </div>

      <!-- Escalations -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Escalations</h2>
        </div>
        <div id="escalation-list"></div>
      </div>

      <!-- Recent Leads -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Recent Leads</h2>
        </div>
        <div style="overflow-x:auto">
          <table class="dash-table">
            <thead>
              <tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr>
            </thead>
            <tbody id="leads-table"></tbody>
          </table>
        </div>
      </div>

      <!-- Recent Clients -->
      <div class="dash-section">
        <div class="dash-section-header">
          <h2>Recent Clients</h2>
        </div>
        <div style="overflow-x:auto">
          <table class="dash-table">
            <thead>
              <tr><th>Name</th><th>Phone</th><th>Program</th><th>Status</th><th>Paid</th><th>Started</th></tr>
            </thead>
            <tbody id="clients-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SUPABASE_URL = 'https://placeholder.supabase.co';
  var SUPABASE_ANON_KEY = 'placeholder-anon-key';

  var metaUrl = document.querySelector('meta[name="supabase-url"]');
  var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
  if (metaUrl) SUPABASE_URL = metaUrl.content;
  if (metaKey) SUPABASE_ANON_KEY = metaKey.content;

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Flagship',
    'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
  };

  function formatDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function maskPhone(p) {
    if (!p || p.length < 6) return '***';
    return p.slice(0, 3) + 'XXX...' + p.slice(-3);
  }

  async function checkSession() {
    var { data: { session } } = await sb.auth.getSession();
    if (session) {
      showDashboard(session);
    }
  }

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value;
    var password = document.getElementById('login-password').value;

    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error) {
      document.getElementById('login-error').style.display = 'block';
      return;
    }
    showDashboard(data.session);
  });

  document.getElementById('logout-btn').addEventListener('click', async function() {
    await sb.auth.signOut();
    document.getElementById('dashboard-section').style.display = 'none';
    document.getElementById('login-section').style.display = 'flex';
  });

  async function showDashboard(session) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard-section').style.display = 'block';
    document.getElementById('user-email').textContent = session.user.email;

    try {
      var res = await fetch('/api/admin/stats', {
        headers: { 'Authorization': 'Bearer ' + session.access_token }
      });
      var data = await res.json();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('dash-content').style.display = 'block';

      renderStats(data);
      renderPrograms(data.active_clients_by_program);
      renderPending(data.pending_checkins);
      renderEscalations(data.escalations);
      renderLeads(data.recent_leads);
      renderClients(data.recent_clients);
    } catch (err) {
      document.getElementById('loading').textContent = 'Failed to load dashboard data.';
    }
  }

  function renderStats(d) {
    var grid = document.getElementById('stats-grid');
    var cards = [
      { label: 'Leads Today', value: d.leads_today, sub: '' },
      { label: 'Leads This Week', value: d.leads_this_week, sub: '' },
      { label: 'Conversion Rate', value: d.conversion_rate + '%', sub: d.converted_leads + ' of ' + d.total_leads + ' leads', gold: true },
      { label: 'Programs This Week', value: d.programs_generated_this_week, sub: 'generated' },
      { label: 'Pending Check-Ins', value: d.pending_checkins.length, sub: 'awaiting submission' },
      { label: 'Escalations', value: d.escalations.length, sub: 'recent', gold: d.escalations.length > 0 },
    ];
    grid.innerHTML = cards.map(function(c) {
      return '<div class="stat-card' + (c.gold ? ' gold' : '') + '"><div class="label">' + c.label + '</div><div class="value">' + c.value + '</div>' + (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') + '</div>';
    }).join('');
  }

  function renderPrograms(programs) {
    var container = document.getElementById('program-bars');
    var keys = Object.keys(programs);
    if (keys.length === 0) {
      container.innerHTML = '<div class="empty">No active clients yet</div>';
      return;
    }
    var maxVal = Math.max.apply(null, keys.map(function(k) { return programs[k]; }));
    container.innerHTML = keys.map(function(k) {
      var pct = maxVal > 0 ? ((programs[k] / maxVal) * 100) : 0;
      return '<div class="program-bar"><span class="name">' + (PROGRAM_LABELS[k] || k) + '</span><div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="count">' + programs[k] + '</span></div>';
    }).join('');
  }

  function renderPending(list) {
    document.getElementById('pending-count').textContent = list.length;
    var container = document.getElementById('pending-list');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty">All check-ins submitted</div>';
      return;
    }
    var html = '<table class="dash-table"><thead><tr><th>Name</th><th>Week</th><th>Program</th></tr></thead><tbody>';
    list.forEach(function(item) {
      html += '<tr><td>' + (item.name || 'Unknown') + '</td><td>Week ' + item.week + '</td><td>' + (PROGRAM_LABELS[item.program] || item.program) + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderEscalations(list) {
    var container = document.getElementById('escalation-list');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty">No recent escalations</div>';
      return;
    }
    container.innerHTML = list.map(function(e) {
      return '<div class="escalation-item"><div class="esc-time">' + formatDate(e.sent_at) + ' &middot; ' + maskPhone(e.phone) + '</div><div class="esc-body">' + (e.body || '').replace(/</g, '&lt;') + '</div></div>';
    }).join('');
  }

  function renderLeads(list) {
    var tbody = document.getElementById('leads-table');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No leads yet</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function(l) {
      return '<tr><td>' + (l.name || '-') + '</td><td>' + maskPhone(l.phone) + '</td><td><span class="status-badge status-' + l.status + '">' + l.status + '</span></td><td>' + (PROGRAM_LABELS[l.program_interest] || l.program_interest || '-') + '</td><td>' + (l.market || '-') + '</td><td>' + formatDate(l.created_at) + '</td></tr>';
    }).join('');
  }

  function renderClients(list) {
    var tbody = document.getElementById('clients-table');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No clients yet</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function(c) {
      return '<tr><td>' + (c.name || '-') + '</td><td>' + maskPhone(c.phone) + '</td><td>' + (PROGRAM_LABELS[c.program] || c.program) + '</td><td><span class="status-badge status-' + c.status + '">' + c.status + '</span></td><td>' + (c.paid_amount ? '$' + c.paid_amount : '-') + '</td><td>' + formatDate(c.program_started_at) + '</td></tr>';
    }).join('');
  }

  checkSession();
})();
</script>
</body>
</html>
