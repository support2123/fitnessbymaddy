<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap');

    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --green: #27ae60;
      --red: #c0392b;
      --blue: #2980b9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-nav {
      background: var(--charcoal);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-nav h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: white;
      font-weight: 400;
      letter-spacing: 2px;
    }
    .admin-nav h1 em { color: var(--gold-light); font-style: italic; }
    .admin-nav .nav-status {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }

    #loginScreen {
      max-width: 400px;
      margin: 120px auto;
      text-align: center;
      padding: 0 24px;
    }
    #loginScreen h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 24px;
    }
    #loginScreen input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: white;
      margin-bottom: 16px;
      outline: none;
    }
    #loginScreen input:focus { border-color: var(--gold); }
    #loginScreen button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.3s;
    }
    #loginScreen button:hover { background: var(--gold); }

    #dashboard { display: none; }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 32px;
    }

    .stat-card {
      background: white;
      padding: 28px 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card .stat-sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }
    .stat-card.gold { border-top: 3px solid var(--gold); }
    .stat-card.green { border-top: 3px solid var(--green); }
    .stat-card.blue { border-top: 3px solid var(--blue); }
    .stat-card.red { border-top: 3px solid var(--red); }

    .dash-section {
      padding: 0 32px 32px;
    }
    .dash-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 16px;
    }
    .dash-section h2 em { color: var(--gold); font-style: italic; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      background: var(--sand);
      border-bottom: 1px solid var(--light-grey);
    }
    .data-table td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--light-grey);
      color: var(--charcoal);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover { background: rgba(184,150,90,0.03); }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-new { background: #e8f5e9; color: #2e7d32; }
    .badge-qualified { background: #e3f2fd; color: #1565c0; }
    .badge-converted { background: #fff3e0; color: #e65100; }
    .badge-dropped { background: #fce4ec; color: #c62828; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-completed { background: #e3f2fd; color: #1565c0; }

    .dash-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
    }
    .dash-tab {
      padding: 10px 24px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1.5px solid var(--light-grey);
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      border-right: none;
    }
    .dash-tab:last-child { border-right: 1.5px solid var(--light-grey); }
    .dash-tab.active {
      background: var(--charcoal);
      color: white;
      border-color: var(--charcoal);
    }

    .phone-mask { font-family: monospace; font-size: 12px; }

    .refresh-btn {
      padding: 8px 20px;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--gold-light); color: var(--gold-light); }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--mid-grey);
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .dash-grid { grid-template-columns: repeat(2, 1fr); padding: 16px; }
      .dash-section { padding: 0 16px 24px; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 10px; }
      .admin-nav { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<div class="admin-nav">
  <h1>Fitness by Maddy — <em>Admin</em></h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="nav-status" id="lastRefresh"></span>
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
  </div>
</div>

<div id="loginScreen">
  <h2>Admin Login</h2>
  <input type="password" id="adminPassword" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Access Dashboard</button>
  <p id="loginError" style="color:#c0392b;font-size:13px;margin-top:12px;"></p>
</div>

<div id="dashboard">
  <div class="dash-grid" id="statsGrid"></div>

  <div class="dash-section">
    <h2>Recent <em>Leads</em></h2>
    <div id="leadsTable"></div>
  </div>

  <div class="dash-section">
    <h2>Active <em>Clients</em></h2>
    <div id="clientsTable"></div>
  </div>

  <div class="dash-section">
    <h2>Pending <em>Check-Ins</em></h2>
    <div id="checkinsTable"></div>
  </div>

  <div class="dash-section">
    <h2>Programs <em>Generated</em></h2>
    <div id="programsTable"></div>
  </div>

  <div class="dash-section">
    <h2>Escalations <em>Awaiting Review</em></h2>
    <div id="escalationsTable"></div>
  </div>
</div>

<script>
var API_BASE = '';
var token = '';

function maskPhone(p) {
  if (!p || p.length < 6) return '***';
  return p.slice(0, 3) + 'XXX...' + p.slice(-3);
}

function fmtDate(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' +
         dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function badge(status) {
  return '<span class="badge badge-' + status + '">' + status + '</span>';
}

function doLogin() {
  var pw = document.getElementById('adminPassword').value;
  if (!pw) return;
  token = pw;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

async function apiFetch(path) {
  var resp = await fetch(API_BASE + path, {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  return resp.json();
}

async function loadDashboard() {
  try {
    var data = await apiFetch('/api/admin/stats');
    if (data.error) {
      alert('Auth failed');
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      return;
    }
    renderStats(data);
    renderLeads(data.recent_leads || []);
    renderClients(data.active_clients || []);
    renderCheckins(data.pending_checkins || []);
    renderPrograms(data.recent_programs || []);
    renderEscalations(data.escalations || []);
    document.getElementById('lastRefresh').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error(e);
  }
}

function renderStats(d) {
  var grid = document.getElementById('statsGrid');
  grid.innerHTML = [
    statCard('New Leads Today', d.leads_today || 0, 'This week: ' + (d.leads_week || 0), 'gold'),
    statCard('Conversion Rate', (d.conversion_rate || 0) + '%', 'Lead → Paid', 'green'),
    statCard('Active Clients', d.active_count || 0, byProgram(d.by_program), 'blue'),
    statCard('Pending Check-Ins', d.pending_checkins_count || 0, 'This week', 'gold'),
    statCard('Programs Generated', d.programs_week || 0, 'This week', 'green'),
    statCard('Escalations', d.escalation_count || 0, 'Awaiting review', 'red'),
  ].join('');
}

function statCard(label, value, sub, color) {
  return '<div class="stat-card ' + color + '"><div class="stat-label">' + label +
    '</div><div class="stat-value">' + value + '</div><div class="stat-sub">' + sub + '</div></div>';
}

function byProgram(obj) {
  if (!obj) return '';
  return Object.entries(obj).map(function(e) { return e[0] + ': ' + e[1]; }).join(', ');
}

function renderLeads(leads) {
  if (!leads.length) { document.getElementById('leadsTable').innerHTML = '<div class="empty-state">No recent leads</div>'; return; }
  var rows = leads.map(function(l) {
    return '<tr><td class="phone-mask">' + maskPhone(l.phone) + '</td><td>' + (l.name || '—') + '</td><td>' +
      badge(l.status) + '</td><td>' + (l.program_interest || '—') + '</td><td>' + (l.market || '—') +
      '</td><td>' + fmtDate(l.created_at) + '</td></tr>';
  }).join('');
  document.getElementById('leadsTable').innerHTML =
    '<table class="data-table"><thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Interest</th><th>Market</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderClients(clients) {
  if (!clients.length) { document.getElementById('clientsTable').innerHTML = '<div class="empty-state">No active clients</div>'; return; }
  var rows = clients.map(function(c) {
    return '<tr><td>' + (c.name || '—') + '</td><td>' + (c.program || '—') + '</td><td>' +
      badge(c.status) + '</td><td>' + fmtDate(c.program_started_at) + '</td><td>' +
      fmtDate(c.program_ends_at) + '</td></tr>';
  }).join('');
  document.getElementById('clientsTable').innerHTML =
    '<table class="data-table"><thead><tr><th>Name</th><th>Program</th><th>Status</th><th>Started</th><th>Ends</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderCheckins(checkins) {
  if (!checkins.length) { document.getElementById('checkinsTable').innerHTML = '<div class="empty-state">All check-ins submitted</div>'; return; }
  var rows = checkins.map(function(c) {
    return '<tr><td>' + (c.client_name || '—') + '</td><td>Week ' + c.week_no + '</td><td>' +
      (c.form_submitted_at ? fmtDate(c.form_submitted_at) : '<span style="color:var(--red)">Pending</span>') + '</td></tr>';
  }).join('');
  document.getElementById('checkinsTable').innerHTML =
    '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Submitted</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderPrograms(programs) {
  if (!programs.length) { document.getElementById('programsTable').innerHTML = '<div class="empty-state">No programs generated this week</div>'; return; }
  var rows = programs.map(function(p) {
    return '<tr><td>' + (p.client_name || '—') + '</td><td>Week ' + p.week_no + '</td><td>' +
      fmtDate(p.generated_at) + '</td><td>' + (p.whatsapp_sent_at ? 'Sent' : 'Not sent') + '</td></tr>';
  }).join('');
  document.getElementById('programsTable').innerHTML =
    '<table class="data-table"><thead><tr><th>Client</th><th>Week</th><th>Generated</th><th>WA Sent</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderEscalations(escalations) {
  if (!escalations.length) { document.getElementById('escalationsTable').innerHTML = '<div class="empty-state">No pending escalations</div>'; return; }
  var rows = escalations.map(function(e) {
    return '<tr><td class="phone-mask">' + maskPhone(e.phone) + '</td><td>' + (e.body || '—').slice(0, 100) + '</td><td>' +
      fmtDate(e.sent_at) + '</td></tr>';
  }).join('');
  document.getElementById('escalationsTable').innerHTML =
    '<table class="data-table"><thead><tr><th>Phone</th><th>Message</th><th>Time</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
</script>

</body>
</html>
