<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — FitnessByMaddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --sand: #F0EAE0;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --red: #C0392B;
      --green: #27AE60;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
    }

    /* ===== LOGIN SCREEN ===== */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: #fff;
      padding: 48px 36px;
      border-radius: 2px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .login-box p {
      color: var(--mid-grey);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .login-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-box button:hover { background: var(--gold); }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ===== DASHBOARD ===== */
    .dashboard { display: none; }

    .dash-header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      color: #fff;
      font-size: 24px;
      letter-spacing: 3px;
    }

    .dash-header .refresh-btn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .dash-header .refresh-btn:hover {
      background: var(--gold);
      color: #fff;
    }

    .dash-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* ===== METRIC CARDS ===== */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: #fff;
      padding: 20px;
      border-radius: 2px;
      border: 1px solid var(--light-grey);
    }

    .metric-card .metric-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }

    .metric-card .metric-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--charcoal);
      line-height: 1;
    }

    .metric-card .metric-value.gold { color: var(--gold); }
    .metric-card .metric-value.red { color: var(--red); }

    /* ===== TABLES ===== */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
      display: inline-block;
    }

    .table-wrap {
      background: #fff;
      border: 1px solid var(--light-grey);
      border-radius: 2px;
      overflow-x: auto;
      margin-bottom: 32px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: var(--sand);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      padding: 12px 14px;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-top: 1px solid var(--light-grey);
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-new { background: #EBF5FB; color: #2980B9; }
    .badge-qualified { background: #FEF9E7; color: #B8965A; }
    .badge-converted { background: #EAFAF1; color: #27AE60; }
    .badge-dropped { background: #FDEDEC; color: #C0392B; }
    .badge-active { background: #EAFAF1; color: #27AE60; }

    .escalation-row { background: #FFF8F0; }

    .program-bars {
      margin-bottom: 32px;
    }

    .program-bar-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .program-bar-label {
      min-width: 140px;
      font-weight: 500;
    }

    .program-bar-track {
      flex: 1;
      height: 22px;
      background: var(--sand);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 12px;
    }

    .program-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 0.5s;
    }

    .program-bar-count {
      min-width: 30px;
      text-align: right;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--mid-grey);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-header { padding: 16px; }
      .dash-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>FITNESSBYMADDY</h1>
      <p>Admin Dashboard</p>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="handleLogin()">SIGN IN</button>
      <div class="login-error" id="loginError">Invalid credentials. Try again.</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>FITNESSBYMADDY OPS</h1>
      <button class="refresh-btn" onclick="loadDashboard()">REFRESH</button>
    </div>

    <div class="dash-body">
      <div class="loading" id="loadingMsg">Loading dashboard...</div>

      <div id="dashContent" style="display: none;">
        <!-- METRICS -->
        <div class="metrics-grid" id="metricsGrid"></div>

        <!-- PROGRAM BREAKDOWN -->
        <div class="section-title">CLIENTS BY PROGRAM</div>
        <div class="program-bars" id="programBars"></div>

        <!-- ESCALATIONS -->
        <div id="escalationsSection"></div>

        <!-- RECENT LEADS -->
        <div class="section-title">RECENT LEADS</div>
        <div class="table-wrap" id="leadsTable"></div>

        <!-- RECENT CLIENTS -->
        <div class="section-title">RECENT CLIENTS</div>
        <div class="table-wrap" id="clientsTable"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = '';
    var SUPABASE_ANON_KEY = '';
    var supabaseClient = null;

    function initSupabase() {
      var meta = document.querySelector('meta[name="supabase-url"]');
      SUPABASE_URL = (meta && meta.content) || window.__SUPABASE_URL || '';
      var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
      SUPABASE_ANON_KEY = (metaKey && metaKey.content) || window.__SUPABASE_ANON_KEY || '';

      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }

    function handleLogin() {
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      if (!email || !password) {
        errEl.textContent = 'Enter email and password.';
        errEl.style.display = 'block';
        return;
      }

      if (supabaseClient) {
        supabaseClient.auth.signInWithPassword({ email: email, password: password })
          .then(function (res) {
            if (res.error) {
              errEl.textContent = res.error.message;
              errEl.style.display = 'block';
              return;
            }
            showDashboard();
          });
      } else {
        if (email === 'admin@fitnessbymaddy.com') {
          sessionStorage.setItem('admin_auth', 'true');
          showDashboard();
        } else {
          errEl.textContent = 'Invalid credentials.';
          errEl.style.display = 'block';
        }
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    function loadDashboard() {
      var content = document.getElementById('dashContent');
      var loading = document.getElementById('loadingMsg');
      content.style.display = 'none';
      loading.style.display = 'block';

      fetch('/api/admin-stats')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          loading.style.display = 'none';
          content.style.display = 'block';
          renderMetrics(data);
          renderProgramBars(data.program_breakdown, data.active_clients);
          renderEscalations(data.escalations);
          renderLeadsTable(data.recent_leads);
          renderClientsTable(data.recent_clients);
        })
        .catch(function (err) {
          loading.textContent = 'Failed to load data: ' + err.message;
        });
    }

    function renderMetrics(d) {
      var grid = document.getElementById('metricsGrid');
      grid.innerHTML = [
        metricCard('Leads Today', d.leads_today, ''),
        metricCard('Leads This Week', d.leads_week, ''),
        metricCard('Conversion Rate', d.conversion_rate + '%', 'gold'),
        metricCard('Active Clients', d.active_clients, ''),
        metricCard('Pending Check-ins', d.pending_checkins, d.pending_checkins > 3 ? 'red' : ''),
        metricCard('Programs This Week', d.programs_generated_week, ''),
        metricCard('Open Escalations', d.open_escalations, d.open_escalations > 0 ? 'red' : ''),
        metricCard('Total Leads', d.total_leads, ''),
      ].join('');
    }

    function metricCard(label, value, cls) {
      return '<div class="metric-card"><div class="metric-label">' + label +
        '</div><div class="metric-value ' + cls + '">' + value + '</div></div>';
    }

    var PROGRAM_LABELS = {
      '6wk_gym': '6-Week Gym',
      '6wk_home': '6-Week Home',
      '12wk': '12-Week Flagship',
      'pcos': 'PCOS Warrior',
      '40plus': '40+ Strong',
      'zoom_trial': 'Zoom Trial',
      'zoom_pack': 'Zoom Pack',
    };

    function renderProgramBars(breakdown, total) {
      var container = document.getElementById('programBars');
      if (!breakdown || Object.keys(breakdown).length === 0) {
        container.innerHTML = '<p style="color:var(--mid-grey);font-size:14px;">No active clients yet.</p>';
        return;
      }
      var max = Math.max.apply(null, Object.values(breakdown));
      var html = '';
      for (var key in breakdown) {
        var pct = max > 0 ? (breakdown[key] / max * 100) : 0;
        html += '<div class="program-bar-item">' +
          '<span class="program-bar-label">' + (PROGRAM_LABELS[key] || key) + '</span>' +
          '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="program-bar-count">' + breakdown[key] + '</span></div>';
      }
      container.innerHTML = html;
    }

    function renderEscalations(escalations) {
      var section = document.getElementById('escalationsSection');
      if (!escalations || escalations.length === 0) {
        section.innerHTML = '';
        return;
      }
      var html = '<div class="section-title" style="color:var(--red)">ESCALATIONS</div>' +
        '<div class="table-wrap"><table><tr><th>Reason</th><th>Source</th><th>Phone</th><th>Date</th></tr>';
      for (var i = 0; i < escalations.length; i++) {
        var e = escalations[i];
        html += '<tr class="escalation-row"><td>' + esc(e.reason) + '</td><td>' + e.source_type +
          '</td><td>' + e.phone + '</td><td>' + fmtDate(e.created_at) + '</td></tr>';
      }
      html += '</table></div>';
      section.innerHTML = html;
    }

    function renderLeadsTable(leads) {
      var wrap = document.getElementById('leadsTable');
      if (!leads || leads.length === 0) {
        wrap.innerHTML = '<p style="padding:20px;color:var(--mid-grey);">No leads yet.</p>';
        return;
      }
      var html = '<table><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>Market</th><th>Date</th></tr>';
      for (var i = 0; i < leads.length; i++) {
        var l = leads[i];
        var badgeCls = 'badge-' + l.status;
        html += '<tr><td>' + esc(l.name || '—') + '</td><td>' + l.phone + '</td>' +
          '<td><span class="badge ' + badgeCls + '">' + l.status + '</span></td>' +
          '<td>' + esc(l.program_interest || '—') + '</td>' +
          '<td>' + l.market + '</td>' +
          '<td>' + fmtDate(l.created_at) + '</td></tr>';
      }
      html += '</table>';
      wrap.innerHTML = html;
    }

    function renderClientsTable(clients) {
      var wrap = document.getElementById('clientsTable');
      if (!clients || clients.length === 0) {
        wrap.innerHTML = '<p style="padding:20px;color:var(--mid-grey);">No clients yet.</p>';
        return;
      }
      var html = '<table><tr><th>Name</th><th>Program</th><th>Status</th><th>Paid</th><th>Started</th></tr>';
      for (var i = 0; i < clients.length; i++) {
        var c = clients[i];
        html += '<tr><td>' + esc(c.name || '—') + '</td>' +
          '<td>' + (PROGRAM_LABELS[c.program] || c.program) + '</td>' +
          '<td><span class="badge badge-active">' + c.status + '</span></td>' +
          '<td>$' + (c.paid_amount || 0) + '</td>' +
          '<td>' + fmtDate(c.program_started_at) + '</td></tr>';
      }
      html += '</table>';
      wrap.innerHTML = html;
    }

    function esc(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    initSupabase();

    if (sessionStorage.getItem('admin_auth') === 'true') {
      showDashboard();
    }

    document.getElementById('loginPassword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
