<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #4a9;
      --red: #c55;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box {
      background: white; padding: 48px 36px; border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08); max-width: 380px; width: 100%; text-align: center;
    }
    .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 4px; margin-bottom: 8px; }
    .login-box p { font-size: 13px; color: var(--mid-grey); margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 3px;
      font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      outline: none; margin-bottom: 12px; transition: border-color 0.3s;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px; background: var(--charcoal); color: white; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px;
      cursor: pointer; border-radius: 3px; transition: background 0.3s;
    }
    .login-btn:hover { background: var(--gold); }
    .login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }

    .dashboard { display: none; }
    .top-bar {
      background: var(--charcoal); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-bar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 3px; }
    .logout-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
      padding: 6px 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif;
    }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; padding: 24px;
    }
    .stat-card {
      background: white; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--charcoal); margin-top: 4px; line-height: 1;
    }
    .stat-card .sub { font-size: 12px; color: var(--gold); margin-top: 4px; }

    .section-wrap { padding: 0 24px 24px; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2px; color: var(--charcoal); margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
    }

    .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .data-table th {
      background: var(--charcoal); color: rgba(255,255,255,0.8);
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 12px 16px; text-align: left;
    }
    .data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--light-grey); }
    .data-table tr:hover td { background: var(--sand); }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-new { background: #e8f5e9; color: #2e7d32; }
    .badge-qualified { background: #e3f2fd; color: #1565c0; }
    .badge-converted { background: #fff8e1; color: #f57f17; }
    .badge-dropped { background: #fce4ec; color: #c62828; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-paused { background: #fff8e1; color: #f57f17; }

    .escalation-card {
      background: white; padding: 16px; border-radius: 4px; margin-bottom: 12px;
      border-left: 4px solid var(--red); box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .escalation-card .reason { font-weight: 600; font-size: 14px; color: var(--red); }
    .escalation-card .detail { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .escalation-card .time { font-size: 11px; color: var(--mid-grey); margin-top: 6px; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--mid-grey); font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 13px; }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
      .section-wrap { padding: 0 16px 16px; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="login-screen">
    <div class="login-box">
      <h1>FITNESS BY MADDY</h1>
      <p>Admin Dashboard</p>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button class="login-btn" onclick="doLogin()">SIGN IN</button>
      <div class="login-error" id="login-error">Invalid email or password</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="top-bar">
      <h1>MADDY'S DASHBOARD</h1>
      <button class="logout-btn" onclick="doLogout()">LOGOUT</button>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="label">Leads Today</div><div class="value" id="s-leads-today">—</div></div>
      <div class="stat-card"><div class="label">Leads This Week</div><div class="value" id="s-leads-week">—</div></div>
      <div class="stat-card"><div class="label">Conversion Rate</div><div class="value" id="s-conversion">—</div><div class="sub" id="s-conversion-sub"></div></div>
      <div class="stat-card"><div class="label">Active Clients</div><div class="value" id="s-active">—</div></div>
      <div class="stat-card"><div class="label">Pending Check-ins</div><div class="value" id="s-pending">—</div></div>
      <div class="stat-card"><div class="label">Programs This Week</div><div class="value" id="s-programs">—</div></div>
    </div>

    <!-- ESCALATIONS -->
    <div class="section-wrap">
      <div class="section-title">ESCALATIONS AWAITING REVIEW</div>
      <div id="escalations-list"><div class="loading">Loading...</div></div>
    </div>

    <!-- CLIENTS BY PROGRAM -->
    <div class="section-wrap">
      <div class="section-title">ACTIVE CLIENTS BY PROGRAM</div>
      <div id="clients-table"><div class="loading">Loading...</div></div>
    </div>

    <!-- RECENT LEADS -->
    <div class="section-wrap">
      <div class="section-title">RECENT LEADS</div>
      <div id="leads-table"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    var SUPABASE_URL = '';
    var SUPABASE_ANON_KEY = '';
    var sb = null;

    function initSupabase() {
      var meta = document.querySelector('meta[name="supabase-url"]');
      SUPABASE_URL = (meta && meta.content) || window.__SUPABASE_URL__ || '';
      var metaKey = document.querySelector('meta[name="supabase-anon-key"]');
      SUPABASE_ANON_KEY = (metaKey && metaKey.content) || window.__SUPABASE_ANON_KEY__ || '';

      if (!SUPABASE_URL) {
        SUPABASE_URL = prompt('Enter Supabase URL:');
        SUPABASE_ANON_KEY = prompt('Enter Supabase Anon Key:');
      }

      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function doLogin() {
      if (!sb) initSupabase();
      var email = document.getElementById('login-email').value;
      var pass = document.getElementById('login-password').value;
      var errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      var result = await sb.auth.signInWithPassword({ email: email, password: pass });
      if (result.error) {
        errEl.textContent = result.error.message;
        errEl.style.display = 'block';
        return;
      }

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    async function doLogout() {
      if (sb) await sb.auth.signOut();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    async function checkSession() {
      if (!sb) initSupabase();
      var session = await sb.auth.getSession();
      if (session.data.session) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
      }
    }

    async function loadDashboard() {
      await Promise.all([loadStats(), loadEscalations(), loadClients(), loadLeads()]);
    }

    async function loadStats() {
      var now = new Date();
      var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      var weekStart = new Date(now.getTime() - 7 * 86400000).toISOString();

      var leadsToday = await sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', todayStart);
      document.getElementById('s-leads-today').textContent = leadsToday.count || 0;

      var leadsWeek = await sb.from('leads').select('id', { count: 'exact', head: true }).gte('created_at', weekStart);
      document.getElementById('s-leads-week').textContent = leadsWeek.count || 0;

      var totalLeads = await sb.from('leads').select('id', { count: 'exact', head: true });
      var converted = await sb.from('leads').select('id', { count: 'exact', head: true }).eq('status', 'converted');
      var rate = totalLeads.count > 0 ? Math.round((converted.count / totalLeads.count) * 100) : 0;
      document.getElementById('s-conversion').textContent = rate + '%';
      document.getElementById('s-conversion-sub').textContent = (converted.count || 0) + ' of ' + (totalLeads.count || 0) + ' leads';

      var active = await sb.from('clients').select('id', { count: 'exact', head: true }).eq('status', 'active');
      document.getElementById('s-active').textContent = active.count || 0;

      var activeClients = await sb.from('clients').select('id, program_started_at').eq('status', 'active');
      var pendingCount = 0;
      if (activeClients.data) {
        for (var c of activeClients.data) {
          var startDate = new Date(c.program_started_at);
          var weekNo = Math.ceil((now - startDate) / (7 * 86400000));
          if (weekNo >= 1) {
            var checkin = await sb.from('checkins').select('id').eq('client_id', c.id).eq('week_no', weekNo).single();
            if (!checkin.data) pendingCount++;
          }
        }
      }
      document.getElementById('s-pending').textContent = pendingCount;

      var programs = await sb.from('programs').select('id', { count: 'exact', head: true }).gte('generated_at', weekStart);
      document.getElementById('s-programs').textContent = programs.count || 0;
    }

    async function loadEscalations() {
      var result = await sb.from('escalations').select('*').eq('resolved', false).order('created_at', { ascending: false }).limit(10);
      var container = document.getElementById('escalations-list');

      if (!result.data || result.data.length === 0) {
        container.innerHTML = '<div class="empty-state">No open escalations</div>';
        return;
      }

      container.innerHTML = result.data.map(function(e) {
        var phone = e.phone ? (e.phone.slice(0, 3) + 'XXX...' + e.phone.slice(-3)) : '';
        var time = new Date(e.created_at).toLocaleString();
        return '<div class="escalation-card">' +
          '<div class="reason">' + esc(e.reason) + '</div>' +
          '<div class="detail">' + esc(phone) + ' — ' + esc((e.message_body || '').slice(0, 120)) + '</div>' +
          '<div class="time">' + time + '</div>' +
        '</div>';
      }).join('');
    }

    async function loadClients() {
      var result = await sb.from('clients').select('*').eq('status', 'active').order('created_at', { ascending: false });
      var container = document.getElementById('clients-table');

      if (!result.data || result.data.length === 0) {
        container.innerHTML = '<div class="empty-state">No active clients</div>';
        return;
      }

      var programCounts = {};
      result.data.forEach(function(c) {
        programCounts[c.program] = (programCounts[c.program] || 0) + 1;
      });

      var NAMES = {
        '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
        'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
      };

      var html = '<table class="data-table"><thead><tr><th>Program</th><th>Active Clients</th></tr></thead><tbody>';
      for (var p in programCounts) {
        html += '<tr><td>' + (NAMES[p] || p) + '</td><td>' + programCounts[p] + '</td></tr>';
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function loadLeads() {
      var result = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(20);
      var container = document.getElementById('leads-table');

      if (!result.data || result.data.length === 0) {
        container.innerHTML = '<div class="empty-state">No leads yet</div>';
        return;
      }

      var html = '<table class="data-table"><thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Interest</th><th>Date</th></tr></thead><tbody>';
      result.data.forEach(function(l) {
        var phone = l.phone ? (l.phone.slice(0, 5) + '...' + l.phone.slice(-3)) : '';
        var date = new Date(l.created_at).toLocaleDateString();
        var badgeClass = 'badge badge-' + l.status;
        html += '<tr>' +
          '<td>' + esc(phone) + '</td>' +
          '<td>' + esc(l.name || '—') + '</td>' +
          '<td><span class="' + badgeClass + '">' + l.status + '</span></td>' +
          '<td>' + esc(l.program_interest || '—') + '</td>' +
          '<td>' + date + '</td>' +
        '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function esc(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
        doLogin();
      }
    });

    checkSession();
  </script>
</body>
</html>
