<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/forms.css">
  <style>
    body { background: var(--charcoal); color: white; }
    .dash-page { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .dash-logo { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 4px; color: var(--gold); }
    .dash-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: white; }
    .dash-logout { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 4px; font-size: 12px; letter-spacing: 1px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .dash-logout:hover { border-color: var(--gold); color: var(--gold); }

    .login-box { max-width: 360px; margin: 120px auto; }
    .login-box .form-card { background: #363636; }
    .login-box .field input { background: var(--charcoal); border-color: #555; color: white; }
    .login-box .field input:focus { border-color: var(--gold); }
    .login-box .field label { color: rgba(255,255,255,0.5); }
    .login-error { color: var(--error); font-size: 13px; margin-bottom: 12px; display: none; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .stat-card { background: #363636; border-radius: 8px; padding: 24px; }
    .stat-card-value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); line-height: 1; margin-bottom: 4px; }
    .stat-card-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); }

    .dash-section { background: #363636; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .dash-section-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--gold); margin-bottom: 16px; }

    .program-bar { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #444; }
    .program-bar:last-child { border: none; }
    .program-bar-name { font-size: 13px; color: rgba(255,255,255,0.8); flex: 1; }
    .program-bar-count { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); }
    .program-bar-fill { height: 4px; background: var(--gold); border-radius: 2px; transition: width 0.3s; }

    .esc-item { padding: 10px 0; border-bottom: 1px solid #444; }
    .esc-item:last-child { border: none; }
    .esc-phone { font-size: 12px; color: var(--gold-light); font-weight: 600; }
    .esc-body { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; }
    .esc-time { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; }

    .empty-state { font-size: 13px; color: rgba(255,255,255,0.4); font-style: italic; }
    .loading { text-align: center; padding: 40px; color: rgba(255,255,255,0.4); }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-header { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-box">
  <div style="text-align:center; margin-bottom: 24px;">
    <div class="dash-logo">Fitness by Maddy</div>
    <div class="dash-title" style="margin-top: 8px;">Admin Dashboard</div>
  </div>
  <form id="loginForm" class="form-card" novalidate>
    <div class="login-error" id="loginError">Invalid email or password</div>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required>
    </div>
    <button type="submit" class="btn-submit">Sign In</button>
  </form>
</div>

<!-- DASHBOARD -->
<div id="dashView" class="dash-page" style="display:none">
  <div class="dash-header">
    <div>
      <div class="dash-logo">Fitness by Maddy</div>
      <div class="dash-title">Operations Dashboard</div>
    </div>
    <button class="dash-logout" id="logoutBtn">Sign Out</button>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-card-value" id="leadsToday">-</div><div class="stat-card-label">Leads Today</div></div>
    <div class="stat-card"><div class="stat-card-value" id="leadsWeek">-</div><div class="stat-card-label">Leads This Week</div></div>
    <div class="stat-card"><div class="stat-card-value" id="convRate">-</div><div class="stat-card-label">Conversion Rate</div></div>
    <div class="stat-card"><div class="stat-card-value" id="activeClients">-</div><div class="stat-card-label">Active Clients</div></div>
    <div class="stat-card"><div class="stat-card-value" id="pendingCheckins">-</div><div class="stat-card-label">Pending Check-ins</div></div>
    <div class="stat-card"><div class="stat-card-value" id="programsGen">-</div><div class="stat-card-label">Programs This Week</div></div>
  </div>

  <div class="dash-section">
    <div class="dash-section-title">Active Clients by Program</div>
    <div id="programBreakdown"><div class="empty-state">Loading...</div></div>
  </div>

  <div class="dash-section">
    <div class="dash-section-title">Recent Escalations</div>
    <div id="escalationsList"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script>
(function() {
  var SUPABASE_URL = '';
  var SUPABASE_ANON_KEY = '';

  var loginView = document.getElementById('loginView');
  var dashView = document.getElementById('dashView');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var logoutBtn = document.getElementById('logoutBtn');

  var session = null;

  try {
    var stored = localStorage.getItem('fbm_session');
    if (stored) {
      session = JSON.parse(stored);
      showDashboard();
    }
  } catch (_) {}

  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;

    loginError.style.display = 'none';
    var btn = loginForm.querySelector('.btn-submit');
    btn.disabled = true;

    fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        session = data;
        localStorage.setItem('fbm_session', JSON.stringify(data));
        showDashboard();
      } else {
        loginError.style.display = 'block';
        btn.disabled = false;
      }
    })
    .catch(function() {
      loginError.style.display = 'block';
      btn.disabled = false;
    });
  });

  logoutBtn.addEventListener('click', function() {
    session = null;
    localStorage.removeItem('fbm_session');
    loginView.style.display = '';
    dashView.style.display = 'none';
  });

  function showDashboard() {
    loginView.style.display = 'none';
    dashView.style.display = '';
    loadStats();
  }

  function loadStats() {
    if (!session) return;

    fetch('/api/admin-stats', {
      headers: { 'Authorization': 'Bearer ' + session.access_token },
    })
    .then(function(r) {
      if (r.status === 401) {
        session = null;
        localStorage.removeItem('fbm_session');
        loginView.style.display = '';
        dashView.style.display = 'none';
        return null;
      }
      return r.json();
    })
    .then(function(stats) {
      if (!stats) return;
      renderStats(stats);
    })
    .catch(function() {});
  }

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Week Burn & Build (Gym)',
    '6wk_home': '6-Week Burn & Build (Home)',
    '12wk': '12-Week Custom Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
  };

  function renderStats(s) {
    document.getElementById('leadsToday').textContent = s.leads_today;
    document.getElementById('leadsWeek').textContent = s.leads_this_week;
    document.getElementById('convRate').textContent = s.conversion_rate + '%';
    document.getElementById('activeClients').textContent = s.active_clients;
    document.getElementById('pendingCheckins').textContent = s.pending_checkins;
    document.getElementById('programsGen').textContent = s.programs_generated_this_week;

    var progDiv = document.getElementById('programBreakdown');
    var programs = s.clients_by_program;
    var keys = Object.keys(programs);

    if (keys.length === 0) {
      progDiv.innerHTML = '<div class="empty-state">No active clients yet</div>';
    } else {
      var maxCount = Math.max.apply(null, keys.map(function(k) { return programs[k]; }));
      progDiv.innerHTML = keys.map(function(k) {
        var pct = maxCount > 0 ? (programs[k] / maxCount * 100) : 0;
        return '<div class="program-bar">' +
          '<span class="program-bar-name">' + (PROGRAM_LABELS[k] || k) + '</span>' +
          '<span class="program-bar-count">' + programs[k] + '</span>' +
          '</div>' +
          '<div style="padding:0 0 8px"><div class="program-bar-fill" style="width:' + pct + '%"></div></div>';
      }).join('');
    }

    var escDiv = document.getElementById('escalationsList');
    var escs = s.recent_escalations;

    if (escs.length === 0) {
      escDiv.innerHTML = '<div class="empty-state">No recent escalations</div>';
    } else {
      escDiv.innerHTML = escs.map(function(e) {
        var time = new Date(e.sent_at).toLocaleString();
        return '<div class="esc-item">' +
          '<div class="esc-phone">' + e.phone + '</div>' +
          '<div class="esc-body">' + (e.body || '') + '</div>' +
          '<div class="esc-time">' + time + '</div>' +
          '</div>';
      }).join('');
    }
  }
})();
</script>

</body>
</html>
