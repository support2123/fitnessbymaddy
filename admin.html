<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | FitnessByMaddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #111; color: #fff; min-height: 100vh; }
    .topbar { background: #1a1a1a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
    .topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #D4AF7A; letter-spacing: 3px; }
    .topbar .status { font-size: 12px; color: #4ade80; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #1a1a1a; border: 1px solid #222; border-radius: 12px; padding: 20px; }
    .card-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .card-value { font-size: 32px; font-weight: 600; color: #D4AF7A; }
    .card-sub { font-size: 12px; color: #666; margin-top: 4px; }
    h2 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #D4AF7A; letter-spacing: 2px; margin: 24px 0 12px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    th { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; padding: 12px 16px; text-align: left; border-bottom: 1px solid #222; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #222; }
    tr:hover td { background: #222; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-active { background: #064e3b; color: #4ade80; }
    .badge-new { background: #1e3a5f; color: #60a5fa; }
    .badge-qualified { background: #3b2e00; color: #D4AF7A; }
    .badge-dropped { background: #3b1c1c; color: #f87171; }
    .badge-converted { background: #064e3b; color: #4ade80; }
    .escalation { background: #2d1b1b; border: 1px solid #5c2e2e; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .escalation-type { font-size: 11px; color: #f87171; text-transform: uppercase; letter-spacing: 1px; }
    .escalation-msg { font-size: 14px; margin-top: 4px; color: #ccc; }
    .login-screen { max-width: 400px; margin: 100px auto; padding: 40px; background: #1a1a1a; border-radius: 12px; text-align: center; }
    .login-screen h1 { font-family: 'Bebas Neue', sans-serif; color: #D4AF7A; font-size: 28px; margin-bottom: 24px; }
    .login-screen input { width: 100%; padding: 14px 16px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; }
    .login-screen input:focus { outline: none; border-color: #D4AF7A; }
    .login-screen button { width: 100%; padding: 14px; background: #D4AF7A; color: #1a1a1a; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .hidden { display: none; }
    .refresh-btn { background: #222; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .refresh-btn:hover { border-color: #D4AF7A; color: #D4AF7A; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } table { font-size: 12px; } td, th { padding: 8px; } }
  </style>
</head>
<body>
  <div id="loginView" class="login-screen">
    <h1>FitnessByMaddy Admin</h1>
    <input type="password" id="passInput" placeholder="Enter admin password">
    <button onclick="doLogin()">Access Dashboard</button>
  </div>

  <div id="dashView" class="hidden">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div>
        <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
        <span class="status" id="lastUpdate"></span>
      </div>
    </div>

    <div class="container">
      <div class="grid">
        <div class="card">
          <div class="card-label">New Leads Today</div>
          <div class="card-value" id="leadsToday">-</div>
        </div>
        <div class="card">
          <div class="card-label">Leads This Week</div>
          <div class="card-value" id="leadsWeek">-</div>
        </div>
        <div class="card">
          <div class="card-label">Conversion Rate</div>
          <div class="card-value" id="convRate">-</div>
          <div class="card-sub">lead → paid</div>
        </div>
        <div class="card">
          <div class="card-label">Active Clients</div>
          <div class="card-value" id="activeClients">-</div>
        </div>
        <div class="card">
          <div class="card-label">Pending Check-Ins</div>
          <div class="card-value" id="pendingCheckins">-</div>
        </div>
        <div class="card">
          <div class="card-label">Programs Generated</div>
          <div class="card-value" id="programsGenerated">-</div>
          <div class="card-sub">this week</div>
        </div>
      </div>

      <h2>Active Clients by Program</h2>
      <table id="programsTable">
        <thead><tr><th>Program</th><th>Active</th></tr></thead>
        <tbody id="programsBody"></tbody>
      </table>

      <h2>Recent Leads</h2>
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Interest</th><th>When</th></tr></thead>
        <tbody id="leadsBody"></tbody>
      </table>

      <h2>Escalations</h2>
      <div id="escalations"><p style="color:#666">No pending escalations</p></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.__SUPABASE_URL || '';
    const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';
    let authToken = '';

    function doLogin() {
      const pass = document.getElementById('passInput').value;
      if (pass) {
        authToken = pass;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashView').classList.remove('hidden');
        loadDashboard();
      }
    }

    document.getElementById('passInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    async function supaFetch(table, params) {
      const url = new URL(SUPABASE_URL + '/rest/v1/' + table);
      if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + (authToken || SUPABASE_ANON_KEY),
          'Prefer': 'count=exact',
        },
      });
      const count = res.headers.get('content-range')?.split('/')[1] || null;
      const data = await res.json();
      return { data, count: count ? parseInt(count) : data.length };
    }

    async function loadDashboard() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      const weekStart = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();

      try {
        const [leadsToday, leadsWeek, allLeads, activeClients, programs] = await Promise.all([
          supaFetch('leads', { 'created_at': 'gte.' + todayStart, select: 'id' }),
          supaFetch('leads', { 'created_at': 'gte.' + weekStart, select: 'id' }),
          supaFetch('leads', { select: 'id,status', limit: '1000' }),
          supaFetch('clients', { 'status': 'eq.active', select: 'id,program,name,phone' }),
          supaFetch('programs', { 'generated_at': 'gte.' + weekStart, select: 'id' }),
        ]);

        document.getElementById('leadsToday').textContent = leadsToday.count;
        document.getElementById('leadsWeek').textContent = leadsWeek.count;
        document.getElementById('activeClients').textContent = activeClients.count;
        document.getElementById('programsGenerated').textContent = programs.count;

        const total = allLeads.data.length;
        const converted = allLeads.data.filter(function(l) { return l.status === 'converted'; }).length;
        document.getElementById('convRate').textContent = total > 0 ? Math.round(converted / total * 100) + '%' : '0%';

        const programCounts = {};
        activeClients.data.forEach(function(c) {
          programCounts[c.program] = (programCounts[c.program] || 0) + 1;
        });
        document.getElementById('programsBody').innerHTML = Object.entries(programCounts)
          .map(function(entry) { return '<tr><td>' + entry[0] + '</td><td>' + entry[1] + '</td></tr>'; })
          .join('') || '<tr><td colspan="2" style="color:#666">No active clients</td></tr>';

        const recentLeads = await supaFetch('leads', { select: 'name,phone,status,program_interest,created_at', order: 'created_at.desc', limit: '20' });
        document.getElementById('leadsBody').innerHTML = recentLeads.data.map(function(l) {
          var masked = l.phone ? l.phone.slice(0, 4) + 'XXX...' + l.phone.slice(-3) : '-';
          var badge = '<span class="badge badge-' + l.status + '">' + l.status + '</span>';
          var when = new Date(l.created_at).toLocaleDateString();
          return '<tr><td>' + (l.name || '-') + '</td><td>' + masked + '</td><td>' + badge + '</td><td>' + (l.program_interest || '-') + '</td><td>' + when + '</td></tr>';
        }).join('') || '<tr><td colspan="5" style="color:#666">No leads yet</td></tr>';

        const pendingRes = await supaFetch('clients', { 'status': 'eq.active', select: 'id' });
        document.getElementById('pendingCheckins').textContent = pendingRes.count || '0';

        document.getElementById('lastUpdate').textContent = 'Updated ' + now.toLocaleTimeString();
      } catch (e) {
        console.error('Dashboard load error:', e);
      }
    }

    if (window.location.hash === '#auto') {
      authToken = 'service';
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashView').classList.remove('hidden');
      loadDashboard();
    }
  </script>
</body>
</html>
