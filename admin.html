<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --sand: #F0EAE0; --gold: #B8965A;
      --gold-light: #D4AF7A; --charcoal: #2C2C2C; --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC; --red: #D94F4F; --green: #4CAF50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); }

    .admin-header {
      background: var(--charcoal); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fff;
      letter-spacing: 3px;
    }
    .admin-header .refresh-btn {
      background: transparent; border: 1px solid var(--gold);
      color: var(--gold); padding: 8px 20px; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
      font-family: 'DM Sans', sans-serif; border-radius: 2px;
      transition: all 0.2s;
    }
    .admin-header .refresh-btn:hover { background: var(--gold); color: #fff; }

    .login-screen {
      max-width: 400px; margin: 80px auto; padding: 40px;
      background: #fff; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .login-screen h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      letter-spacing: 2px; margin-bottom: 24px; color: var(--charcoal);
    }
    .login-screen input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-grey);
      border-radius: 3px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px; outline: none;
    }
    .login-screen input:focus { border-color: var(--gold); }
    .login-screen button {
      width: 100%; padding: 14px; background: var(--charcoal); color: #fff;
      border: none; font-family: 'Bebas Neue', sans-serif; font-size: 16px;
      letter-spacing: 3px; cursor: pointer; border-radius: 3px;
    }
    .login-screen button:hover { background: var(--gold); }

    .dashboard { display: none; padding: 32px; max-width: 1200px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: #fff; padding: 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card .stat-value {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: var(--charcoal); line-height: 1;
    }
    .stat-card .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid-grey); margin-top: 6px;
    }
    .stat-card.gold .stat-value { color: var(--gold); }

    .panel { background: #fff; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px; overflow: hidden; }
    .panel-header {
      padding: 16px 24px; border-bottom: 1px solid var(--light-grey);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2px; color: var(--charcoal);
    }
    .panel-badge {
      background: var(--red); color: #fff; font-size: 11px;
      font-weight: 600; padding: 2px 10px; border-radius: 10px;
    }
    .panel-body { padding: 0; }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 24px; font-size: 10px;
      font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid-grey); background: var(--cream); border-bottom: 1px solid var(--light-grey);
    }
    td { padding: 12px 24px; font-size: 13px; border-bottom: 1px solid var(--light-grey); color: var(--charcoal); }
    tr:last-child td { border-bottom: none; }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 2px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .tag-active { background: #e8f5e9; color: #2e7d32; }
    .tag-pending { background: #fff3e0; color: #e65100; }
    .tag-escalation { background: #fce4ec; color: #c62828; }

    .program-bars { padding: 24px; }
    .program-bar { margin-bottom: 12px; }
    .program-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .program-bar-label span:first-child { font-weight: 600; color: var(--charcoal); }
    .program-bar-label span:last-child { color: var(--mid-grey); }
    .program-bar-track { height: 8px; background: var(--light-grey); border-radius: 4px; overflow: hidden; }
    .program-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s; }

    .empty-state { padding: 40px 24px; text-align: center; color: var(--mid-grey); font-size: 13px; }
    .loading { text-align: center; padding: 60px; font-size: 14px; color: var(--mid-grey); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) {
      .dashboard { padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .admin-header { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <h1>FITNESSBYMADDY OPS</h1>
    <button class="refresh-btn" onclick="loadDashboard()">REFRESH</button>
  </div>

  <div id="loginScreen" class="login-screen">
    <h2>ADMIN LOGIN</h2>
    <input type="password" id="adminKey" placeholder="Enter admin key" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">ACCESS DASHBOARD</button>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="loading" id="loadingState">Loading dashboard data...</div>

    <div id="dashboardContent" style="display:none;">
      <div class="stats-grid" id="statsGrid"></div>

      <div class="two-col">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">CLIENTS BY PROGRAM</span>
          </div>
          <div class="panel-body program-bars" id="programBars"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">PENDING CHECK-INS</span>
            <span class="panel-badge" id="pendingBadge">0</span>
          </div>
          <div class="panel-body" id="pendingCheckins"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">ESCALATIONS AWAITING MADDY</span>
          <span class="panel-badge" id="escalationBadge" style="display:none;">0</span>
        </div>
        <div class="panel-body" id="escalations"></div>
      </div>
    </div>
  </div>

  <script>
    var API_KEY = '';

    function login() {
      API_KEY = document.getElementById('adminKey').value;
      if (!API_KEY) return;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    function loadDashboard() {
      var loading = document.getElementById('loadingState');
      var content = document.getElementById('dashboardContent');
      loading.style.display = 'block';
      content.style.display = 'none';

      fetch('/api/admin/dashboard', {
        headers: { 'Authorization': 'Bearer ' + API_KEY }
      })
      .then(function(r) {
        if (r.status === 401) {
          alert('Invalid admin key');
          document.getElementById('loginScreen').style.display = 'block';
          document.getElementById('dashboard').style.display = 'none';
          return null;
        }
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        renderDashboard(data);
        loading.style.display = 'none';
        content.style.display = 'block';
      })
      .catch(function(err) {
        loading.textContent = 'Failed to load. ' + err.message;
      });
    }

    function renderDashboard(data) {
      var o = data.overview;

      document.getElementById('statsGrid').innerHTML =
        statCard(o.leads_today, 'Leads Today', false) +
        statCard(o.leads_this_week, 'Leads This Week', false) +
        statCard(o.active_clients, 'Active Clients', true) +
        statCard(o.conversion_rate, 'Conversion Rate', true) +
        statCard(o.programs_generated_this_week, 'Programs This Week', false) +
        statCard(o.total_leads, 'Total Leads', false);

      var programLabels = {
        '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom',
        'pcos': 'PCOS Warrior', '40plus': '40+ Strong',
        'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack'
      };
      var programs = data.clients_by_program || {};
      var maxCount = Math.max(1, Math.max.apply(null, Object.values(programs).concat([1])));
      var barsHtml = '';
      for (var key in programs) {
        var pct = (programs[key] / maxCount * 100).toFixed(0);
        barsHtml += '<div class="program-bar">' +
          '<div class="program-bar-label"><span>' + (programLabels[key] || key) + '</span><span>' + programs[key] + '</span></div>' +
          '<div class="program-bar-track"><div class="program-bar-fill" style="width:' + pct + '%"></div></div></div>';
      }
      document.getElementById('programBars').innerHTML = barsHtml || '<div class="empty-state">No active clients yet</div>';

      var pending = data.pending_checkins || [];
      document.getElementById('pendingBadge').textContent = pending.length;
      if (pending.length === 0) {
        document.getElementById('pendingCheckins').innerHTML = '<div class="empty-state">All check-ins submitted</div>';
      } else {
        var tbl = '<table><thead><tr><th>Client</th><th>Program</th><th>Week</th></tr></thead><tbody>';
        pending.forEach(function(p) {
          tbl += '<tr><td>' + esc(p.name || 'Unknown') + '</td><td><span class="tag tag-pending">' + esc(p.program) + '</span></td><td>Week ' + p.week_no + '</td></tr>';
        });
        tbl += '</tbody></table>';
        document.getElementById('pendingCheckins').innerHTML = tbl;
      }

      var escalations = data.escalations || [];
      var escBadge = document.getElementById('escalationBadge');
      if (escalations.length > 0) {
        escBadge.textContent = escalations.length;
        escBadge.style.display = 'inline';
        var etbl = '<table><thead><tr><th>Trigger</th><th>Message</th><th>Time</th></tr></thead><tbody>';
        escalations.forEach(function(e) {
          etbl += '<tr><td><span class="tag tag-escalation">' + esc(e.trigger_keyword) + '</span></td>' +
            '<td>' + esc((e.message_body || '').substring(0, 80)) + '</td>' +
            '<td>' + new Date(e.created_at).toLocaleString() + '</td></tr>';
        });
        etbl += '</tbody></table>';
        document.getElementById('escalations').innerHTML = etbl;
      } else {
        escBadge.style.display = 'none';
        document.getElementById('escalations').innerHTML = '<div class="empty-state">No open escalations</div>';
      }
    }

    function statCard(value, label, isGold) {
      return '<div class="stat-card' + (isGold ? ' gold' : '') + '">' +
        '<div class="stat-value">' + value + '</div>' +
        '<div class="stat-label">' + label + '</div></div>';
    }

    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
