<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
    .admin-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--charcoal); }
    .admin-title em { color: var(--gold); }
    .login-form { max-width: 400px; margin: 120px auto; text-align: center; }
    .login-form h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 24px; color: var(--charcoal); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: white; padding: 24px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .stat-card.alert { border-left: 3px solid #c0392b; }
    .stat-card.gold { border-left: 3px solid var(--gold); }

    .section-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
    .panel { background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; }
    .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--charcoal); }
    .panel-badge { font-size: 11px; background: var(--gold); color: white; padding: 3px 10px; border-radius: 2px; font-weight: 600; }
    .panel-body { padding: 16px 24px; }
    .panel-list { list-style: none; }
    .panel-list li { padding: 12px 0; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .panel-list li:last-child { border-bottom: none; }
    .program-tag { font-size: 10px; padding: 3px 8px; border-radius: 2px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    .program-tag.p12wk { background: #2C2C2C; color: white; }
    .program-tag.p6wk { background: var(--gold); color: white; }
    .program-tag.ppcos { background: #8e44ad; color: white; }
    .program-tag.p40plus { background: #27ae60; color: white; }
    .program-tag.ptrial { background: var(--taupe); color: white; }

    .msg-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .msg-table th { text-align: left; padding: 10px 12px; background: var(--cream); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--mid-grey); }
    .msg-table td { padding: 10px 12px; border-bottom: 1px solid var(--light-grey); vertical-align: top; }
    .msg-in { color: #2980b9; }
    .msg-out { color: #27ae60; }
    .msg-body { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .refresh-btn { background: var(--charcoal); color: white; border: none; padding: 10px 20px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 2px; font-family: 'DM Sans', sans-serif; transition: background 0.3s; }
    .refresh-btn:hover { background: var(--gold); }
    .loading { text-align: center; padding: 40px; color: var(--mid-grey); font-size: 14px; }
    .hidden { display: none; }
    .last-updated { font-size: 11px; color: var(--mid-grey); }

    @media (max-width: 768px) {
      .section-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="admin.html" class="active">Dashboard</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <!-- LOGIN -->
  <div id="login-screen" class="login-form">
    <h2>Admin <em>Dashboard</em></h2>
    <p style="color:var(--mid-grey); font-size:14px; margin-bottom:24px;">Enter your admin key to continue.</p>
    <div class="form-group">
      <input class="form-input" type="password" id="admin-key" placeholder="Admin Key" style="text-align:center">
    </div>
    <button class="btn-primary" style="width:100%; margin-top:8px" onclick="doLogin()">Access Dashboard</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="admin-wrap hidden">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Ops <em>Dashboard</em></h1>
        <div class="last-updated" id="last-updated"></div>
      </div>
      <button class="refresh-btn" onclick="loadStats()">Refresh</button>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="loading">Loading stats...</div>
    </div>

    <div class="section-row">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Active Clients by Program</div>
        </div>
        <div class="panel-body">
          <ul class="panel-list" id="program-list">
            <li class="loading">Loading...</li>
          </ul>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Pending Check-ins</div>
          <div class="panel-badge" id="pending-count">0</div>
        </div>
        <div class="panel-body">
          <ul class="panel-list" id="checkin-list">
            <li class="loading">Loading...</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:32px">
      <div class="panel-header">
        <div class="panel-title">Recent Messages</div>
      </div>
      <div class="panel-body" style="padding:0; overflow-x:auto">
        <table class="msg-table" id="msg-table">
          <thead>
            <tr><th>Time</th><th>Dir</th><th>Phone</th><th>Message</th><th>Status</th></tr>
          </thead>
          <tbody id="msg-tbody">
            <tr><td colspan="5" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var adminKey = '';

function doLogin() {
  adminKey = document.getElementById('admin-key').value.trim();
  if (!adminKey) { alert('Please enter the admin key.'); return; }
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadStats();
}

function loadStats() {
  fetch('/api/admin-stats', {
    headers: { 'Authorization': 'Bearer ' + adminKey }
  })
  .then(function(r) {
    if (r.status === 401) { alert('Invalid admin key.'); location.reload(); throw new Error('auth'); }
    return r.json();
  })
  .then(function(d) {
    renderStats(d);
    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  })
  .catch(function(e) {
    if (e.message !== 'auth') console.error(e);
  });
}

function renderStats(d) {
  var grid = document.getElementById('stats-grid');
  grid.innerHTML = ''
    + card('Leads Today', d.leads_today, '', '')
    + card('Leads This Week', d.leads_this_week, '', '')
    + card('Conversion Rate', d.conversion_rate + '%', d.total_leads + ' total leads', 'gold')
    + card('Active Clients', d.active_clients, d.total_clients + ' total', 'gold')
    + card('Programs This Week', d.programs_generated_this_week, '', '')
    + card('Escalations', d.escalations, 'Awaiting review', d.escalations > 0 ? 'alert' : '');

  var progList = document.getElementById('program-list');
  var programs = d.clients_by_program || {};
  var progNames = { '6wk_gym': '6-Week Gym', '6wk_home': '6-Week Home', '12wk': '12-Week Custom', 'pcos': 'PCOS Warrior', '40plus': '40+ Strong', 'zoom_trial': 'Zoom Trial', 'zoom_pack': 'Zoom Pack' };
  var keys = Object.keys(programs);
  if (keys.length === 0) {
    progList.innerHTML = '<li style="color:var(--mid-grey)">No active clients yet</li>';
  } else {
    progList.innerHTML = keys.map(function(k) {
      var cls = k === '12wk' ? 'p12wk' : k.includes('6wk') ? 'p6wk' : k === 'pcos' ? 'ppcos' : k === '40plus' ? 'p40plus' : 'ptrial';
      return '<li><span>' + (progNames[k] || k) + '</span><span class="program-tag ' + cls + '">' + programs[k] + '</span></li>';
    }).join('');
  }

  var pending = d.pending_checkins || [];
  document.getElementById('pending-count').textContent = pending.length;
  var checkinList = document.getElementById('checkin-list');
  if (pending.length === 0) {
    checkinList.innerHTML = '<li style="color:var(--mid-grey)">All caught up!</li>';
  } else {
    checkinList.innerHTML = pending.map(function(c) {
      return '<li><span>' + (c.name || 'Unknown') + ' — Week ' + c.week_no + '</span><span class="program-tag p' + (c.program || '6wk') + '">' + (c.program || '') + '</span></li>';
    }).join('');
  }

  var msgs = d.recent_messages || [];
  var tbody = document.getElementById('msg-tbody');
  if (msgs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:var(--mid-grey)">No messages yet</td></tr>';
  } else {
    tbody.innerHTML = msgs.map(function(m) {
      var time = new Date(m.sent_at).toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
      var dirClass = m.direction === 'in' ? 'msg-in' : 'msg-out';
      var masked = m.phone ? m.phone.slice(0, 4) + '...' + m.phone.slice(-3) : '---';
      var body = (m.body || '').length > 60 ? m.body.substring(0, 60) + '...' : (m.body || '—');
      return '<tr><td>' + time + '</td><td class="' + dirClass + '">' + m.direction.toUpperCase() + '</td><td>' + masked + '</td><td class="msg-body">' + escHtml(body) + '</td><td>' + (m.status || '') + '</td></tr>';
    }).join('');
  }
}

function card(label, value, sub, cls) {
  return '<div class="stat-card ' + (cls || '') + '"><div class="stat-card-label">' + label + '</div><div class="stat-card-value">' + value + '</div>' + (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') + '</div>';
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
