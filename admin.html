<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #111; color: #fff; }
    .login-screen {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 24px;
    }
    .login-screen h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 36px;
      color: #B8965A; letter-spacing: 4px;
    }
    .login-box {
      background: #1a1a1a; padding: 40px; border-radius: 8px;
      width: 100%; max-width: 400px; border: 1px solid #333;
    }
    .login-box input {
      width: 100%; padding: 14px 16px; margin-bottom: 16px;
      border: 1.5px solid #333; border-radius: 4px; font-size: 14px;
      font-family: 'DM Sans', sans-serif; color: #fff; background: #222;
      outline: none;
    }
    .login-box input:focus { border-color: #B8965A; }
    .login-box button {
      width: 100%; padding: 14px; background: #B8965A; color: #fff;
      border: none; border-radius: 4px; font-size: 14px; font-weight: 600;
      letter-spacing: 1px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .login-error { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; }

    .dashboard { display: none; }
    .dash-nav {
      background: #1a1a1a; border-bottom: 1px solid #222; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-nav h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      color: #B8965A; letter-spacing: 3px;
    }
    .dash-nav button {
      background: transparent; border: 1px solid #444; color: #999;
      padding: 8px 16px; border-radius: 4px; cursor: pointer;
      font-size: 12px; font-family: 'DM Sans', sans-serif;
    }
    .dash-content { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: #1a1a1a; border: 1px solid #222; border-radius: 8px;
      padding: 24px; text-align: center;
    }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif; font-size: 42px;
      color: #B8965A; line-height: 1;
    }
    .stat-card .label {
      font-size: 11px; color: #666; letter-spacing: 1px;
      text-transform: uppercase; margin-top: 8px;
    }
    .section-header {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px;
      color: #B8965A; letter-spacing: 2px; margin: 32px 0 16px;
      border-bottom: 1px solid #222; padding-bottom: 8px;
    }
    .data-table {
      width: 100%; border-collapse: collapse; background: #1a1a1a;
      border-radius: 8px; overflow: hidden; margin-bottom: 24px;
    }
    .data-table th {
      text-align: left; font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: #B8965A; padding: 12px 16px;
      background: #222; border-bottom: 1px solid #333;
    }
    .data-table td {
      font-size: 13px; padding: 12px 16px; border-bottom: 1px solid #1e1e1e;
      color: #ccc;
    }
    .data-table tr:hover td { background: #1e1e1e; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-new { background: #1a3a2a; color: #4ade80; }
    .badge-qualified { background: #1a2a3a; color: #60a5fa; }
    .badge-converted { background: #2a2a1a; color: #B8965A; }
    .badge-dropped { background: #2a1a1a; color: #f87171; }
    .badge-active { background: #1a3a2a; color: #4ade80; }
    .badge-paused { background: #2a2a1a; color: #fbbf24; }
    .escalation-item {
      background: #2a1a1a; border: 1px solid #3a2222; border-radius: 8px;
      padding: 16px; margin-bottom: 8px;
    }
    .escalation-item .reason { color: #f87171; font-weight: 600; font-size: 13px; }
    .escalation-item .detail { color: #999; font-size: 12px; margin-top: 4px; }
    .refresh-btn {
      background: #222; border: 1px solid #333; color: #999;
      padding: 8px 20px; border-radius: 4px; cursor: pointer;
      font-size: 12px; font-family: 'DM Sans', sans-serif;
      margin-bottom: 24px;
    }
    .refresh-btn:hover { border-color: #B8965A; color: #B8965A; }
    .empty-state { color: #444; font-size: 13px; text-align: center; padding: 24px; }
  </style>
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <h1>FITNESSBYMADDY</h1>
    <div class="login-box">
      <div class="login-error" id="loginError">Invalid credentials</div>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-nav">
      <h1>FITNESSBYMADDY OPS</h1>
      <button onclick="doLogout()">Sign Out</button>
    </div>
    <div class="dash-content">
      <button class="refresh-btn" onclick="loadDashboard()">Refresh Data</button>

      <div class="stats-grid" id="statsGrid"></div>

      <div class="section-header">RECENT LEADS</div>
      <table class="data-table" id="leadsTable">
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Source</th><th>Interest</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="section-header">ACTIVE CLIENTS</div>
      <table class="data-table" id="clientsTable">
        <thead>
          <tr><th>Name</th><th>Program</th><th>Started</th><th>Ends</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="section-header">PENDING CHECK-INS</div>
      <div id="pendingCheckins"></div>

      <div class="section-header">RECENT PROGRAMS GENERATED</div>
      <table class="data-table" id="programsTable">
        <thead>
          <tr><th>Client</th><th>Week</th><th>Generated</th><th>Sent</th><th>PDF</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="section-header">ESCALATIONS</div>
      <div id="escalations"></div>
    </div>
  </div>

  <script>
    var supabaseUrl = '';
    var supabaseKey = '';
    var session = null;

    function initSupabase() {
      supabaseUrl = localStorage.getItem('sb_url') || '';
      supabaseKey = localStorage.getItem('sb_key') || '';
    }

    async function sbQuery(table, query) {
      var url = supabaseUrl + '/rest/v1/' + table + '?' + query;
      var res = await fetch(url, {
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + (session ? session.access_token : supabaseKey),
          'Content-Type': 'application/json'
        }
      });
      return res.json();
    }

    async function doLogin() {
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var errEl = document.getElementById('loginError');

      supabaseUrl = prompt('Supabase URL:', localStorage.getItem('sb_url') || '');
      supabaseKey = prompt('Supabase Anon Key:', localStorage.getItem('sb_key') || '');

      if (!supabaseUrl || !supabaseKey) {
        errEl.textContent = 'Supabase URL and Key required';
        errEl.style.display = 'block';
        return;
      }

      localStorage.setItem('sb_url', supabaseUrl);
      localStorage.setItem('sb_key', supabaseKey);

      try {
        var res = await fetch(supabaseUrl + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: {
            'apikey': supabaseKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email, password: password })
        });
        var data = await res.json();
        if (data.access_token) {
          session = data;
          localStorage.setItem('sb_session', JSON.stringify(data));
          showDashboard();
        } else {
          errEl.textContent = data.error_description || 'Login failed';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Connection failed';
        errEl.style.display = 'block';
      }
    }

    function doLogout() {
      session = null;
      localStorage.removeItem('sb_session');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    function maskPhone(phone) {
      if (!phone || phone.length < 6) return '***';
      return phone.slice(0, 4) + 'XXX...' + phone.slice(-3);
    }

    function badge(status) {
      var cls = 'badge-' + (status || 'new');
      return '<span class="badge ' + cls + '">' + (status || 'unknown') + '</span>';
    }

    function fmtDate(d) {
      if (!d) return '-';
      return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
    }

    async function loadDashboard() {
      try {
        var leads = await sbQuery('leads', 'select=*&order=created_at.desc&limit=30');
        var clients = await sbQuery('clients', 'select=*&order=program_started_at.desc&limit=30');
        var programs = await sbQuery('programs', 'select=*&order=generated_at.desc&limit=10');

        var today = new Date().toISOString().split('T')[0];
        var weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();

        var leadsToday = leads.filter(function(l) { return l.created_at && l.created_at.startsWith(today); }).length;
        var leadsWeek = leads.filter(function(l) { return l.created_at && l.created_at >= weekAgo; }).length;
        var totalConverted = leads.filter(function(l) { return l.status === 'converted'; }).length;
        var totalLeads = leads.length;
        var convRate = totalLeads > 0 ? Math.round((totalConverted / totalLeads) * 100) : 0;
        var activeClients = clients.filter(function(c) { return c.status === 'active'; }).length;
        var progsThisWeek = programs.filter(function(p) { return p.generated_at && p.generated_at >= weekAgo; }).length;

        document.getElementById('statsGrid').innerHTML =
          '<div class="stat-card"><div class="value">' + leadsToday + '</div><div class="label">Leads Today</div></div>' +
          '<div class="stat-card"><div class="value">' + leadsWeek + '</div><div class="label">Leads This Week</div></div>' +
          '<div class="stat-card"><div class="value">' + convRate + '%</div><div class="label">Conversion Rate</div></div>' +
          '<div class="stat-card"><div class="value">' + activeClients + '</div><div class="label">Active Clients</div></div>' +
          '<div class="stat-card"><div class="value">' + progsThisWeek + '</div><div class="label">Programs This Week</div></div>';

        var leadsHtml = '';
        leads.forEach(function(l) {
          leadsHtml += '<tr>' +
            '<td>' + (l.name || '-') + '</td>' +
            '<td>' + maskPhone(l.phone) + '</td>' +
            '<td>' + (l.source || '-') + '</td>' +
            '<td>' + (l.program_interest || '-') + '</td>' +
            '<td>' + badge(l.status) + '</td>' +
            '<td>' + fmtDate(l.created_at) + '</td></tr>';
        });
        document.querySelector('#leadsTable tbody').innerHTML = leadsHtml || '<tr><td colspan="6" class="empty-state">No leads yet</td></tr>';

        var clientsHtml = '';
        clients.forEach(function(c) {
          clientsHtml += '<tr>' +
            '<td>' + (c.name || '-') + '</td>' +
            '<td>' + (c.program || '-').replace(/_/g, ' ') + '</td>' +
            '<td>' + fmtDate(c.program_started_at) + '</td>' +
            '<td>' + fmtDate(c.program_ends_at) + '</td>' +
            '<td>' + badge(c.status) + '</td></tr>';
        });
        document.querySelector('#clientsTable tbody').innerHTML = clientsHtml || '<tr><td colspan="5" class="empty-state">No clients yet</td></tr>';

        var progsHtml = '';
        programs.forEach(function(p) {
          progsHtml += '<tr>' +
            '<td>' + (p.client_id || '-') + '</td>' +
            '<td>Week ' + p.week_no + '</td>' +
            '<td>' + fmtDate(p.generated_at) + '</td>' +
            '<td>' + (p.whatsapp_sent_at ? fmtDate(p.whatsapp_sent_at) : 'Pending') + '</td>' +
            '<td>' + (p.pdf_url ? '<a href="' + p.pdf_url + '" target="_blank" style="color:#B8965A">View</a>' : '-') + '</td></tr>';
        });
        document.querySelector('#programsTable tbody').innerHTML = progsHtml || '<tr><td colspan="5" class="empty-state">No programs generated</td></tr>';

        var activeForCheckin = clients.filter(function(c) { return c.status === 'active'; });
        if (activeForCheckin.length === 0) {
          document.getElementById('pendingCheckins').innerHTML = '<div class="empty-state">No pending check-ins</div>';
        } else {
          var checkinHtml = '';
          activeForCheckin.forEach(function(c) {
            var startDate = new Date(c.program_started_at);
            var daysSince = Math.floor((Date.now() - startDate) / 86400000);
            var weekNo = Math.ceil(daysSince / 7);
            checkinHtml += '<div style="background:#1a1a1a;border:1px solid #222;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">' +
              '<div><span style="color:#ccc;font-size:13px">' + (c.name || maskPhone(c.phone)) + '</span><span style="color:#666;font-size:12px;margin-left:12px">' + (c.program || '').replace(/_/g, ' ') + '</span></div>' +
              '<span style="color:#B8965A;font-size:12px">Week ' + weekNo + '</span></div>';
          });
          document.getElementById('pendingCheckins').innerHTML = checkinHtml;
        }

        document.getElementById('escalations').innerHTML = '<div class="empty-state">No recent escalations</div>';

      } catch (err) {
        console.error('Dashboard load error:', err);
      }
    }

    initSupabase();
    var saved = localStorage.getItem('sb_session');
    if (saved) {
      try {
        session = JSON.parse(saved);
        showDashboard();
      } catch (e) {
        // session expired
      }
    }
  </script>
</body>
</html>
