<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .admin-header { text-align: center; margin-bottom: 48px; }
    .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 8px; }
    .admin-header h1 em { color: var(--gold); font-style: italic; }

    /* Login */
    .login-box {
      max-width: 400px; margin: 120px auto; background: white;
      padding: 48px; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .login-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 24px; }
    .login-box .form-group { text-align: left; margin-bottom: 16px; }
    .login-box .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .login-box .form-input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: var(--cream); outline: none;
    }
    .login-box .form-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px; margin-top: 8px;
      background: var(--charcoal); color: white; border: none;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
    }
    .login-btn:hover { background: var(--gold); }
    .login-error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
    .stat-card {
      background: white; padding: 28px 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); text-align: center;
    }
    .stat-card .stat-value {
      font-family: 'Cormorant Garamond', serif; font-size: 40px;
      font-weight: 600; color: var(--charcoal); line-height: 1;
    }
    .stat-card .stat-title {
      font-size: 11px; color: var(--mid-grey); letter-spacing: 1.5px;
      text-transform: uppercase; margin-top: 8px;
    }
    .stat-card.gold { background: var(--charcoal); }
    .stat-card.gold .stat-value { color: var(--gold); }
    .stat-card.gold .stat-title { color: rgba(255,255,255,0.6); }

    .section-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .panel {
      background: white; padding: 28px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif; font-size: 22px;
      color: var(--charcoal); margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 1px solid var(--light-grey);
    }
    .program-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--light-grey); }
    .program-row:last-child { border-bottom: none; }
    .program-name { font-size: 13px; color: var(--charcoal); }
    .program-count { font-size: 13px; font-weight: 600; color: var(--gold); }

    .escalation-list { max-height: 300px; overflow-y: auto; }
    .escalation-item {
      padding: 12px 0; border-bottom: 1px solid var(--light-grey);
      font-size: 13px; color: var(--charcoal);
    }
    .escalation-item:last-child { border-bottom: none; }
    .escalation-reason { color: #c0392b; font-weight: 600; font-size: 12px; letter-spacing: 0.5px; }
    .escalation-phone { color: var(--mid-grey); font-size: 11px; margin-top: 2px; }
    .no-data { color: var(--mid-grey); font-size: 13px; font-style: italic; }

    .logout-btn {
      background: transparent; border: 1px solid var(--light-grey);
      color: var(--mid-grey); padding: 8px 20px; font-size: 11px;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      border-radius: 2px; float: right;
    }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .section-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="admin.html" class="active">Dashboard</a></li>
  </ul>
</nav>

<div class="page-wrap">

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <div class="form-group">
      <label class="form-label" for="loginEmail">Email</label>
      <input class="form-input" type="email" id="loginEmail" placeholder="support@fitnessbymaddy.com">
    </div>
    <div class="form-group">
      <label class="form-label" for="loginPassword">Password</label>
      <input class="form-input" type="password" id="loginPassword">
    </div>
    <button class="login-btn" id="loginBtn">Sign In</button>
    <p class="login-error" id="loginError"></p>
  </div>

  <!-- Dashboard -->
  <div class="admin-wrap dashboard" id="dashboard">
    <div class="admin-header">
      <p class="section-eyebrow">Operations</p>
      <h1>Daily <em>Dashboard</em></h1>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="leadsToday">-</div>
        <div class="stat-title">Leads Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="leadsWeek">-</div>
        <div class="stat-title">Leads This Week</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-value" id="conversionRate">-</div>
        <div class="stat-title">Conversion Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeClients">-</div>
        <div class="stat-title">Active Clients</div>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
      <div class="stat-card">
        <div class="stat-value" id="pendingCheckins">-</div>
        <div class="stat-title">Pending Check-Ins</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="programsGenerated">-</div>
        <div class="stat-title">Programs This Week</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-value" id="totalLeads">-</div>
        <div class="stat-title">Total Leads</div>
      </div>
    </div>

    <div class="section-row">
      <div class="panel">
        <h3 class="panel-title">Active Clients by Program</h3>
        <div id="programBreakdown"><p class="no-data">Loading...</p></div>
      </div>
      <div class="panel">
        <h3 class="panel-title">Escalations Awaiting Review</h3>
        <div class="escalation-list" id="escalationList"><p class="no-data">Loading...</p></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var SUPABASE_URL = '';
  var token = null;

  function getSupabaseUrl() {
    return SUPABASE_URL || (window.location.origin.includes('localhost')
      ? 'http://localhost:54321'
      : window.location.origin);
  }

  var loginBtn = document.getElementById('loginBtn');
  var logoutBtn = document.getElementById('logoutBtn');

  var stored = sessionStorage.getItem('admin_token');
  if (stored) {
    token = stored;
    showDashboard();
  }

  loginBtn.addEventListener('click', function() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    if (!email || !password) {
      errorEl.textContent = 'Please enter email and password.';
      errorEl.style.display = 'block';
      return;
    }

    loginBtn.textContent = 'SIGNING IN...';
    loginBtn.disabled = true;

    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + btoa(email + ':' + password) },
    })
    .then(function(r) {
      if (r.ok) return r.json();
      throw new Error('Invalid credentials');
    })
    .then(function(data) {
      token = btoa(email + ':' + password);
      sessionStorage.setItem('admin_token', token);
      showDashboard(data);
    })
    .catch(function(err) {
      errorEl.textContent = err.message || 'Login failed. Please try again.';
      errorEl.style.display = 'block';
      loginBtn.textContent = 'SIGN IN';
      loginBtn.disabled = false;
    });
  });

  logoutBtn.addEventListener('click', function() {
    token = null;
    sessionStorage.removeItem('admin_token');
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  });

  function showDashboard(data) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    if (data) renderStats(data);
    else loadStats();
  }

  function loadStats() {
    fetch('/api/admin/stats', {
      headers: { 'Authorization': 'Bearer ' + token },
    })
    .then(function(r) { return r.json(); })
    .then(renderStats)
    .catch(function() {
      token = null;
      sessionStorage.removeItem('admin_token');
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    });
  }

  var PROGRAM_LABELS = {
    '6wk_gym': '6-Week Burn & Build (Gym)',
    '6wk_home': '6-Week Burn & Build (Home)',
    '12wk': '12-Week Flagship',
    'pcos': 'PCOS Warrior',
    '40plus': '40+ Strong',
    'zoom_trial': 'Zoom Trial',
    'zoom_pack': 'Zoom Pack',
  };

  function renderStats(d) {
    document.getElementById('leadsToday').textContent = d.leads_today;
    document.getElementById('leadsWeek').textContent = d.leads_this_week;
    document.getElementById('conversionRate').textContent = d.conversion_rate;
    document.getElementById('activeClients').textContent = d.active_clients;
    document.getElementById('pendingCheckins').textContent = d.pending_checkins;
    document.getElementById('programsGenerated').textContent = d.programs_generated_this_week;
    document.getElementById('totalLeads').textContent = d.total_leads;

    var progEl = document.getElementById('programBreakdown');
    var programs = d.clients_by_program || {};
    var keys = Object.keys(programs);
    if (keys.length === 0) {
      progEl.innerHTML = '<p class="no-data">No active clients yet.</p>';
    } else {
      progEl.innerHTML = keys.map(function(k) {
        return '<div class="program-row"><span class="program-name">' +
          (PROGRAM_LABELS[k] || k) +
          '</span><span class="program-count">' + programs[k] + '</span></div>';
      }).join('');
    }

    var escEl = document.getElementById('escalationList');
    var escs = d.escalations || [];
    if (escs.length === 0) {
      escEl.innerHTML = '<p class="no-data">No escalations. All clear!</p>';
    } else {
      escEl.innerHTML = escs.map(function(e) {
        return '<div class="escalation-item">' +
          '<div class="escalation-reason">' + (e.escalation_reason || 'Unknown') + '</div>' +
          '<div class="escalation-phone">' + (e.name || 'Unknown') + ' &middot; ' +
          new Date(e.created_at).toLocaleDateString() + '</div></div>';
      }).join('');
    }
  }
})();
</script>
</body>
</html>
