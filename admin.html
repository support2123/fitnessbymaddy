<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 100px 24px 60px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
    .admin-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; }
    .login-form { max-width: 400px; margin: 200px auto; text-align: center; }
    .login-form h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card {
      background: white; padding: 28px 24px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); border-top: 3px solid var(--light-grey);
    }
    .stat-card.gold { border-top-color: var(--gold); }
    .stat-card .stat-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .stat-card .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-card .stat-sub { font-size: 12px; color: var(--mid-grey); margin-top: 4px; }
    .dash-section { margin-bottom: 40px; }
    .dash-section h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--light-grey);
    }
    .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .data-table th {
      text-align: left; padding: 14px 16px; font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid-grey); background: var(--cream);
      border-bottom: 1px solid var(--light-grey);
    }
    .data-table td { padding: 12px 16px; font-size: 13px; color: var(--charcoal); border-bottom: 1px solid var(--light-grey); }
    .data-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .badge-12wk { background: #fff3e0; color: #e65100; }
    .badge-6wk { background: #e3f2fd; color: #1565c0; }
    .badge-pcos { background: #fce4ec; color: #c62828; }
    .badge-40plus { background: #f3e5f5; color: #6a1b9a; }
    .badge-zoom { background: #e0f2f1; color: #00695c; }
    .program-bars { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .program-bar {
      background: white; padding: 16px 20px; border-radius: 4px; min-width: 140px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04); text-align: center;
    }
    .program-bar .pb-count { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: var(--charcoal); }
    .program-bar .pb-label { font-size: 11px; color: var(--mid-grey); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
    .refresh-btn { background: var(--charcoal); color: white; border: none; padding: 10px 24px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
    .refresh-btn:hover { background: var(--gold); }
    .loading { text-align: center; padding: 60px; color: var(--mid-grey); }
    .escalation-item { background: #fff8e1; padding: 12px 16px; border-left: 3px solid #ffa000; margin-bottom: 8px; border-radius: 0 4px 4px 0; }
    .escalation-item .esc-time { font-size: 11px; color: var(--mid-grey); }
    .escalation-item .esc-body { font-size: 13px; color: var(--charcoal); margin-top: 4px; }
    @media (max-width: 700px) { .data-table { font-size: 12px; } .data-table th, .data-table td { padding: 8px 10px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="admin.html" class="active">Dashboard</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <!-- LOGIN -->
  <div class="login-form" id="loginSection">
    <h2>Admin <em>Dashboard</em></h2>
    <div class="form-group">
      <label class="form-label">Admin Key</label>
      <input class="form-input" type="password" id="adminKey" placeholder="Enter admin API key">
    </div>
    <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="login()">Access Dashboard</button>
  </div>

  <!-- DASHBOARD -->
  <div class="admin-wrap" id="dashSection" style="display:none;">
    <div class="admin-header">
      <h1>Ops <em>Dashboard</em></h1>
      <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card gold"><div class="stat-title">Leads Today</div><div class="stat-value" id="leadsToday">-</div></div>
      <div class="stat-card"><div class="stat-title">Leads This Week</div><div class="stat-value" id="leadsWeek">-</div></div>
      <div class="stat-card gold"><div class="stat-title">Conversion Rate</div><div class="stat-value" id="convRate">-</div></div>
      <div class="stat-card"><div class="stat-title">Active Clients</div><div class="stat-value" id="activeClients">-</div></div>
      <div class="stat-card"><div class="stat-title">Programs This Week</div><div class="stat-value" id="progsWeek">-</div></div>
    </div>

    <div class="dash-section">
      <h3>Clients by Program</h3>
      <div class="program-bars" id="programBars"></div>
    </div>

    <div class="dash-section">
      <h3>Active Clients</h3>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Program</th><th>Started</th><th>Status</th></tr></thead>
        <tbody id="clientsTable"><tr><td colspan="4" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="dash-section">
      <h3>Recent Escalations</h3>
      <div id="escalations"><p class="loading">Loading...</p></div>
    </div>
  </div>
</div>

<script>
var apiKey = '';

function login() {
  apiKey = document.getElementById('adminKey').value;
  if (!apiKey) return;
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('dashSection').style.display = 'block';
  loadDashboard();
}

function loadDashboard() {
  fetch('/api/admin', {
    headers: { 'Authorization': 'Bearer ' + apiKey }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('Unauthorized');
    return r.json();
  })
  .then(function(d) {
    document.getElementById('leadsToday').textContent = d.leads_today;
    document.getElementById('leadsWeek').textContent = d.leads_this_week;
    document.getElementById('convRate').textContent = d.conversion_rate;
    document.getElementById('activeClients').textContent = d.active_clients;
    document.getElementById('progsWeek').textContent = d.programs_generated_this_week;

    var bars = document.getElementById('programBars');
    bars.innerHTML = '';
    var programs = d.clients_by_program || {};
    var labels = { '12wk': '12-Week', '6wk_gym': '6-Wk Gym', '6wk_home': '6-Wk Home', 'pcos': 'PCOS', '40plus': '40+', 'zoom_trial': 'Trial', 'zoom_pack': 'Zoom Pack' };
    for (var prog in programs) {
      var div = document.createElement('div');
      div.className = 'program-bar';
      div.innerHTML = '<div class="pb-count">' + programs[prog] + '</div><div class="pb-label">' + (labels[prog] || prog) + '</div>';
      bars.appendChild(div);
    }

    var tbody = document.getElementById('clientsTable');
    tbody.innerHTML = '';
    var clients = d.active_client_list || [];
    if (clients.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--mid-grey);">No active clients yet</td></tr>';
    }
    clients.forEach(function(c) {
      var progClass = (c.program || '').includes('12') ? 'badge-12wk' : (c.program || '').includes('6') ? 'badge-6wk' : (c.program || '').includes('pcos') ? 'badge-pcos' : (c.program || '').includes('40') ? 'badge-40plus' : 'badge-zoom';
      var started = c.program_started_at ? new Date(c.program_started_at).toLocaleDateString() : '-';
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (c.name || 'Unnamed') + '</td><td><span class="badge ' + progClass + '">' + (c.program || '-') + '</span></td><td>' + started + '</td><td><span class="badge badge-active">Active</span></td>';
      tbody.appendChild(tr);
    });

    var escDiv = document.getElementById('escalations');
    escDiv.innerHTML = '';
    var escs = d.recent_escalations || [];
    if (escs.length === 0) {
      escDiv.innerHTML = '<p style="color: var(--mid-grey); font-size: 13px;">No recent escalations</p>';
    }
    escs.forEach(function(e) {
      var div = document.createElement('div');
      div.className = 'escalation-item';
      div.innerHTML = '<div class="esc-time">' + new Date(e.sent_at).toLocaleString() + '</div><div class="esc-body">' + (e.body || '').replace(/</g, '&lt;') + '</div>';
      escDiv.appendChild(div);
    });
  })
  .catch(function(err) {
    alert('Failed to load dashboard: ' + err.message);
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashSection').style.display = 'none';
  });
}
</script>
</body>
</html>
