<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
      --sand: #F0EAE0;
      --green: #16a34a;
      --red: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* Login screen */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: white;
      padding: 48px 40px;
      border-radius: 4px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .login-box h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--charcoal);
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .login-box p {
      font-size: 13px;
      color: var(--mid-grey);
      margin-bottom: 32px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 16px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--charcoal);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-box button:hover { background: var(--gold); }
    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* Dashboard */
    .dashboard { display: none; }
    .dash-header {
      background: var(--charcoal);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 3px;
    }
    .dash-header button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
    }
    .dash-header button:hover { border-color: var(--gold); color: var(--gold); }
    .dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 4px;
      border-top: 3px solid var(--light-grey);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .stat-card.gold { border-top-color: var(--gold); }
    .stat-card.green { border-top-color: var(--green); }
    .stat-card.red { border-top-color: var(--red); }
    .stat-card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-bottom: 8px;
    }
    .stat-card-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card-sub {
      font-size: 12px;
      color: var(--mid-grey);
      margin-top: 4px;
    }

    /* Sections */
    .dash-section {
      margin-bottom: 40px;
    }
    .dash-section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--charcoal);
      letter-spacing: 2px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }

    /* Tables */
    .dash-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .dash-table th {
      background: var(--sand);
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid-grey);
      text-align: left;
    }
    .dash-table td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--light-grey);
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge-gold { background: var(--gold); color: white; }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red { background: #fef2f2; color: #dc2626; }
    .badge-grey { background: var(--sand); color: var(--mid-grey); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--mid-grey);
      font-size: 14px;
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--mid-grey);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--light-grey);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .dash-body { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .dash-header { padding: 16px; }
      .dash-table { font-size: 12px; }
      .dash-table th, .dash-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>ADMIN DASHBOARD</h1>
      <p>Fitness by Maddy — Operations</p>
      <div class="login-error" id="loginError">Invalid password. Try again.</div>
      <input type="password" id="adminPassword" placeholder="Enter admin password">
      <button onclick="doLogin()">ACCESS DASHBOARD</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>FITNESSBYMADDY OPS</h1>
      <div>
        <button onclick="loadDashboard()">REFRESH</button>
        <button onclick="doLogout()">LOGOUT</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="loading" id="loadingState">Loading dashboard</div>

      <div id="dashContent" style="display:none">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Clients by Program -->
        <div class="dash-section">
          <div class="dash-section-title">ACTIVE CLIENTS BY PROGRAM</div>
          <div id="programTable"></div>
        </div>

        <!-- Pending Check-ins -->
        <div class="dash-section">
          <div class="dash-section-title">PENDING CHECK-INS</div>
          <div id="checkinTable"></div>
        </div>

        <!-- Recent Escalations -->
        <div class="dash-section">
          <div class="dash-section-title">ESCALATIONS AWAITING MADDY</div>
          <div id="escalationTable"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var API_KEY = '';

    function doLogin() {
      var pw = document.getElementById('adminPassword').value;
      if (!pw) return;
      API_KEY = pw;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      sessionStorage.setItem('fbm_admin_key', pw);
      loadDashboard();
    }

    function doLogout() {
      sessionStorage.removeItem('fbm_admin_key');
      API_KEY = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPassword').value = '';
    }

    // Auto-login from session
    (function() {
      var saved = sessionStorage.getItem('fbm_admin_key');
      if (saved) {
        API_KEY = saved;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
      }
      document.getElementById('adminPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });
    })();

    function loadDashboard() {
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('dashContent').style.display = 'none';

      fetch('/api/admin/stats', {
        headers: { 'Authorization': 'Bearer ' + API_KEY }
      })
      .then(function(r) {
        if (r.status === 401) {
          document.getElementById('loginError').style.display = 'block';
          doLogout();
          return null;
        }
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('dashContent').style.display = 'block';
        renderStats(data);
        renderPrograms(data.clients.by_program);
        renderCheckins(data.checkins.pending);
        renderEscalations(data.escalations);
      })
      .catch(function(err) {
        document.getElementById('loadingState').textContent = 'Failed to load data. Check connection.';
      });
    }

    function renderStats(data) {
      var grid = document.getElementById('statsGrid');
      grid.innerHTML = [
        statCard('LEADS TODAY', data.leads.today, 'gold'),
        statCard('LEADS THIS WEEK', data.leads.this_week, 'gold'),
        statCard('CONVERSION RATE', data.leads.conversion_rate + '%', 'green', data.leads.total + ' total leads'),
        statCard('ACTIVE CLIENTS', data.clients.active, 'green'),
        statCard('PROGRAMS GENERATED', data.programs.generated_this_week, 'gold', 'This week'),
        statCard('PENDING CHECK-INS', data.checkins.pending.length, data.checkins.pending.length > 0 ? 'red' : 'gold')
      ].join('');
    }

    function statCard(label, value, color, sub) {
      return '<div class="stat-card ' + (color || '') + '">' +
        '<div class="stat-card-label">' + label + '</div>' +
        '<div class="stat-card-value">' + value + '</div>' +
        (sub ? '<div class="stat-card-sub">' + sub + '</div>' : '') +
        '</div>';
    }

    var PROGRAM_LABELS = {
      '6wk_gym': '6-Week Burn (Gym)',
      '6wk_home': '6-Week Burn (Home)',
      '12wk': '12-Week Flagship',
      'pcos': 'PCOS Warrior',
      '40plus': '40+ Strong',
      'zoom_trial': 'Zoom Trial',
      'zoom_pack': 'Zoom Pack'
    };

    function renderPrograms(byProgram) {
      var el = document.getElementById('programTable');
      var keys = Object.keys(byProgram || {});
      if (keys.length === 0) {
        el.innerHTML = '<div class="empty-state">No active clients yet</div>';
        return;
      }
      var rows = keys.map(function(k) {
        return '<tr><td>' + (PROGRAM_LABELS[k] || k) + '</td><td><span class="badge badge-green">' + byProgram[k] + '</span></td></tr>';
      }).join('');
      el.innerHTML = '<table class="dash-table"><thead><tr><th>Program</th><th>Active</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderCheckins(pending) {
      var el = document.getElementById('checkinTable');
      if (!pending || pending.length === 0) {
        el.innerHTML = '<div class="empty-state">All check-ins submitted — great!</div>';
        return;
      }
      var rows = pending.map(function(c) {
        return '<tr><td>' + (c.name || '—') + '</td><td>' + (PROGRAM_LABELS[c.program] || c.program || '—') + '</td><td><span class="badge badge-red">Week ' + c.week_no + '</span></td></tr>';
      }).join('');
      el.innerHTML = '<table class="dash-table"><thead><tr><th>Client</th><th>Program</th><th>Pending Week</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderEscalations(escalations) {
      var el = document.getElementById('escalationTable');
      if (!escalations || escalations.length === 0) {
        el.innerHTML = '<div class="empty-state">No escalations — all clear!</div>';
        return;
      }
      var rows = escalations.map(function(e) {
        var d = new Date(e.time);
        var timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        return '<tr><td>' + e.phone + '</td><td>' + (e.body || '').slice(0, 120) + '</td><td>' + timeStr + '</td></tr>';
      }).join('');
      el.innerHTML = '<table class="dash-table"><thead><tr><th>Phone</th><th>Details</th><th>Time</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
  </script>
</body>
</html>
