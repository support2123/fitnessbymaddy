<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    .admin-gate input {
      padding: 14px 20px;
      border: 1.5px solid var(--light-grey);
      border-radius: 2px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      width: 280px;
      text-align: center;
      outline: none;
    }
    .admin-gate input:focus { border-color: var(--gold); }
    .admin-gate button {
      padding: 14px 36px;
      background: var(--charcoal);
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }
    .admin-gate button:hover { background: var(--gold); }

    .admin-layout { display: none; }
    .admin-header {
      background: var(--charcoal);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: white;
      font-weight: 400;
    }
    .admin-header .admin-date {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1px;
      background: var(--light-grey);
      margin: 0;
    }
    .stat-card {
      background: white;
      padding: 28px 24px;
      text-align: center;
    }
    .stat-card .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1;
    }
    .stat-card .stat-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mid-grey);
      margin-top: 8px;
    }

    .admin-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--light-grey);
    }
    .admin-panel {
      background: white;
      padding: 32px;
      min-height: 400px;
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--charcoal);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--light-grey);
    }

    .client-list { list-style: none; }
    .client-list li {
      padding: 14px 0;
      border-bottom: 1px solid var(--light-grey);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    .client-list li:hover { background: var(--cream); margin: 0 -16px; padding: 14px 16px; }
    .client-name { font-size: 14px; font-weight: 500; color: var(--charcoal); }
    .client-program { font-size: 11px; color: var(--mid-grey); letter-spacing: 0.5px; }
    .client-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .status-active { background: #4CAF50; }
    .status-paused { background: #FF9800; }
    .status-completed { background: var(--gold); }

    .lead-list { list-style: none; }
    .lead-list li {
      padding: 12px 0;
      border-bottom: 1px solid var(--light-grey);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lead-name { font-size: 14px; color: var(--charcoal); }
    .lead-meta { font-size: 11px; color: var(--mid-grey); }
    .lead-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .badge-new { background: #E3F2FD; color: #1565C0; }
    .badge-qualified { background: #FFF3E0; color: #E65100; }
    .badge-converted { background: #E8F5E9; color: #2E7D32; }
    .badge-dropped { background: #FAFAFA; color: #999; }

    .escalation-list { list-style: none; }
    .escalation-list li {
      padding: 14px;
      margin-bottom: 8px;
      background: #FFF8E1;
      border-left: 3px solid #FF9800;
      border-radius: 2px;
      font-size: 13px;
      color: var(--charcoal);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--mid-grey);
      font-size: 13px;
    }

    .admin-actions {
      padding: 20px 40px;
      background: var(--cream);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-btn {
      padding: 10px 20px;
      background: white;
      border: 1px solid var(--light-grey);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .admin-btn:hover { border-color: var(--gold); color: var(--gold); }

    .refresh-time {
      font-size: 11px;
      color: var(--mid-grey);
      text-align: center;
      padding: 12px;
    }

    @media (max-width: 900px) {
      .admin-content { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .admin-header { padding: 16px 20px; }
      .admin-panel { padding: 24px 16px; }
      .admin-actions { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<div class="admin-gate" id="adminGate">
  <h2 style="font-family:'Cormorant Garamond',serif; font-weight:400; color:var(--charcoal)">Admin Access</h2>
  <input type="password" id="adminPassword" placeholder="Enter admin password">
  <button id="adminLoginBtn">Enter Dashboard</button>
</div>

<div class="admin-layout" id="adminLayout">
  <div class="admin-header">
    <h1>Fitness by Maddy — Dashboard</h1>
    <span class="admin-date" id="adminDate"></span>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-value" id="statLeads">-</div><div class="stat-title">New Leads (7d)</div></div>
    <div class="stat-card"><div class="stat-value" id="statConversion">-</div><div class="stat-title">Conversion Rate</div></div>
    <div class="stat-card"><div class="stat-value" id="statActive">-</div><div class="stat-title">Active Clients</div></div>
    <div class="stat-card"><div class="stat-value" id="statCheckins">-</div><div class="stat-title">Check-ins (7d)</div></div>
    <div class="stat-card"><div class="stat-value" id="statPrograms">-</div><div class="stat-title">Programs Generated</div></div>
    <div class="stat-card"><div class="stat-value" id="statEscalations">-</div><div class="stat-title">Escalations</div></div>
  </div>

  <div class="admin-actions">
    <button class="admin-btn" id="btnRefresh">Refresh Data</button>
    <button class="admin-btn" id="btnExportClients">Export Clients CSV</button>
  </div>

  <div class="admin-content">
    <div class="admin-panel">
      <h3 class="panel-title">Active Clients</h3>
      <ul class="client-list" id="clientList">
        <li class="empty-state">Loading...</li>
      </ul>
    </div>
    <div class="admin-panel">
      <h3 class="panel-title">Recent Leads</h3>
      <ul class="lead-list" id="leadList">
        <li class="empty-state">Loading...</li>
      </ul>
    </div>
  </div>

  <div class="admin-content" style="margin-top:1px">
    <div class="admin-panel">
      <h3 class="panel-title">Pending Check-ins</h3>
      <ul class="client-list" id="pendingCheckins">
        <li class="empty-state">Loading...</li>
      </ul>
    </div>
    <div class="admin-panel">
      <h3 class="panel-title">Escalations</h3>
      <ul class="escalation-list" id="escalationList">
        <li class="empty-state">No escalations</li>
      </ul>
    </div>
  </div>

  <div class="refresh-time" id="refreshTime"></div>
</div>

<script>
(function() {
  var token = sessionStorage.getItem('admin_token');

  if (token) {
    showDashboard(token);
  }

  document.getElementById('adminLoginBtn').addEventListener('click', function() {
    var pw = document.getElementById('adminPassword').value;
    if (!pw) return;
    sessionStorage.setItem('admin_token', pw);
    showDashboard(pw);
  });

  document.getElementById('adminPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
  });

  function showDashboard(authToken) {
    document.getElementById('adminGate').style.display = 'none';
    document.getElementById('adminLayout').style.display = 'block';
    document.getElementById('adminDate').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    loadData(authToken);
  }

  function api(path, authToken) {
    return fetch(path, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    }).then(function(r) { return r.json(); });
  }

  function loadData(authToken) {
    Promise.all([
      api('/api/admin/stats', authToken),
      api('/api/admin/clients', authToken)
    ]).then(function(results) {
      var stats = results[0];
      var clientsData = results[1];

      if (stats.error) {
        alert('Invalid admin credentials');
        sessionStorage.removeItem('admin_token');
        location.reload();
        return;
      }

      document.getElementById('statLeads').textContent = stats.new_leads_7d || 0;
      document.getElementById('statConversion').textContent = (stats.conversion_rate || 0) + '%';
      document.getElementById('statActive').textContent = stats.active_clients || 0;
      document.getElementById('statCheckins').textContent = stats.checkins_7d || 0;
      document.getElementById('statPrograms').textContent = stats.programs_7d || 0;
      document.getElementById('statEscalations').textContent = stats.escalations || 0;

      renderClients(clientsData.clients || []);
      renderLeads(clientsData.leads || []);
      renderPendingCheckins(clientsData.pending_checkins || []);
      renderEscalations(clientsData.escalations || []);

      document.getElementById('refreshTime').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    }).catch(function() {
      document.getElementById('clientList').innerHTML = '<li class="empty-state">Failed to load data</li>';
    });
  }

  function renderClients(clients) {
    var list = document.getElementById('clientList');
    if (!clients.length) { list.innerHTML = '<li class="empty-state">No active clients</li>'; return; }
    list.innerHTML = clients.map(function(c) {
      var statusClass = 'status-' + (c.status || 'active');
      return '<li><div><span class="client-status ' + statusClass + '"></span><span class="client-name">' +
        esc(c.name) + '</span><br><span class="client-program">' + esc(c.program || '') + ' &middot; Week ' +
        (c.current_week || '?') + '</span></div></li>';
    }).join('');
  }

  function renderLeads(leads) {
    var list = document.getElementById('leadList');
    if (!leads.length) { list.innerHTML = '<li class="empty-state">No recent leads</li>'; return; }
    list.innerHTML = leads.map(function(l) {
      var badgeClass = 'badge-' + (l.status || 'new');
      return '<li><div><span class="lead-name">' + esc(l.name || 'Unknown') + '</span><br>' +
        '<span class="lead-meta">' + esc(l.source || 'whatsapp') + ' &middot; ' + timeAgo(l.created_at) +
        '</span></div><span class="lead-badge ' + badgeClass + '">' + esc(l.status || 'new') + '</span></li>';
    }).join('');
  }

  function renderPendingCheckins(pending) {
    var list = document.getElementById('pendingCheckins');
    if (!pending.length) { list.innerHTML = '<li class="empty-state">All clients checked in</li>'; return; }
    list.innerHTML = pending.map(function(c) {
      return '<li><div><span class="client-name">' + esc(c.name) + '</span><br>' +
        '<span class="client-program">Week ' + (c.week_no || '?') + ' &middot; ' + (c.days_overdue || 0) + ' days overdue</span></div></li>';
    }).join('');
  }

  function renderEscalations(escalations) {
    var list = document.getElementById('escalationList');
    if (!escalations.length) { list.innerHTML = '<li class="empty-state">No escalations</li>'; return; }
    list.innerHTML = escalations.map(function(e) {
      return '<li>' + esc(e.reason) + ' — ' + esc(e.client_name || 'Unknown') + ' (' + timeAgo(e.created_at) + ')</li>';
    }).join('');
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    var diff = Date.now() - new Date(dateStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  document.getElementById('btnRefresh').addEventListener('click', function() {
    var t = sessionStorage.getItem('admin_token');
    if (t) loadData(t);
  });

  document.getElementById('btnExportClients').addEventListener('click', function() {
    var t = sessionStorage.getItem('admin_token');
    if (!t) return;
    api('/api/admin/clients?format=csv', t).then(function(data) {
      if (data.csv) {
        var blob = new Blob([data.csv], { type: 'text/csv' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'clients_export.csv';
        a.click();
      }
    });
  });
})();
</script>

</body>
</html>
