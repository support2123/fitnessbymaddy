<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit { width: 100%; margin-top: 24px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot { padding: 12px; border: 1.5px solid var(--light-grey); border-radius: 2px; text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s; }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    @media (max-width: 600px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-hero">
    <p class="section-eyebrow">Session Management</p>
    <h1 class="section-title"><em>Reschedule</em> Session</h1>
    <p class="section-body" style="margin:0 auto">Pick a new time that works for you. We'll confirm within 2 hours.</p>
  </div>

  <div class="form-card" id="rescheduleForm">
    <form id="reschedule" novalidate>
      <input type="hidden" id="clientId" name="client_id">

      <div class="form-group">
        <label class="form-label" for="reason">Reason for Reschedule</label>
        <select class="form-select" id="reason" name="reason">
          <option value="">Select</option>
          <option value="schedule_conflict">Schedule Conflict</option>
          <option value="not_feeling_well">Not Feeling Well</option>
          <option value="travel">Travelling</option>
          <option value="emergency">Emergency</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="preferred_date">Preferred Date *</label>
        <input class="form-input" type="date" id="preferred_date" name="preferred_date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Time Slot *</label>
        <div class="time-slots" id="timeSlots">
          <div class="time-slot" data-time="07:00">7:00 AM</div>
          <div class="time-slot" data-time="08:00">8:00 AM</div>
          <div class="time-slot" data-time="09:00">9:00 AM</div>
          <div class="time-slot" data-time="10:00">10:00 AM</div>
          <div class="time-slot" data-time="17:00">5:00 PM</div>
          <div class="time-slot" data-time="18:00">6:00 PM</div>
          <div class="time-slot" data-time="19:00">7:00 PM</div>
          <div class="time-slot" data-time="20:00">8:00 PM</div>
          <div class="time-slot" data-time="21:00">9:00 PM</div>
        </div>
        <input type="hidden" id="selectedTime" name="preferred_time">
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Additional Notes</label>
        <textarea class="form-textarea" id="notes" name="notes" placeholder="Anything else we should know..."></textarea>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn-primary form-submit">Request Reschedule</button>
    </form>
  </div>

  <div class="form-success" id="formSuccess">
    <h2>Request Received!</h2>
    <p>We'll confirm your new slot within 2 hours on WhatsApp.</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  if (clientId) document.getElementById('clientId').value = clientId;

  var today = new Date();
  today.setDate(today.getDate() + 1);
  document.getElementById('preferred_date').min = today.toISOString().split('T')[0];

  var slots = document.querySelectorAll('.time-slot');
  slots.forEach(function(slot) {
    slot.addEventListener('click', function() {
      slots.forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      document.getElementById('selectedTime').value = slot.dataset.time;
    });
  });

  document.getElementById('reschedule').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errEl = document.getElementById('formError');
    errEl.style.display = 'none';

    var date = document.getElementById('preferred_date').value;
    var time = document.getElementById('selectedTime').value;

    if (!date || !time) {
      errEl.textContent = 'Please select a date and time slot.';
      errEl.style.display = 'block';
      return;
    }

    var btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    document.getElementById('rescheduleForm').style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
  });
})();
</script>
</body>
</html>
