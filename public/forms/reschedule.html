<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --charcoal: #2C2C2C;
      --mid-grey: #6B6B6B;
      --light-grey: #E8E3DC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 24px 60px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; }
    .brand p { font-size: 13px; color: var(--mid-grey); margin-top: 8px; }
    .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; margin-bottom: 8px; letter-spacing: 1px; }
    .form-subtitle { font-size: 14px; color: var(--mid-grey); margin-bottom: 32px; line-height: 1.6; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey);
      border-radius: 4px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--charcoal); background: white; transition: border-color 0.3s; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
    .field textarea { min-height: 80px; resize: vertical; }
    .submit-btn {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; margin-top: 16px;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { display: none; text-align: center; padding: 60px 20px; }
    .success h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin-bottom: 12px; }
    .success p { font-size: 15px; color: var(--mid-grey); line-height: 1.7; }
    .gold-bar { width: 40px; height: 3px; background: var(--gold); margin: 0 auto 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>FITNESS BY MADDY</h1>
      <p>Session Rescheduler</p>
    </div>

    <form id="rescheduleForm">
      <h2 class="form-title">RESCHEDULE YOUR SESSION</h2>
      <p class="form-subtitle">Life happens! Pick a new time that works for you and we'll get you rebooked.</p>

      <div class="field">
        <label>Your Phone (WhatsApp) *</label>
        <input type="tel" name="phone" required placeholder="+91 9876543210">
      </div>

      <div class="field">
        <label>Preferred Date *</label>
        <input type="date" name="preferred_date" required>
      </div>

      <div class="field">
        <label>Preferred Time *</label>
        <select name="preferred_time" required>
          <option value="">Select a time slot</option>
          <option value="7am">7:00 AM</option>
          <option value="8am">8:00 AM</option>
          <option value="9am">9:00 AM</option>
          <option value="10am">10:00 AM</option>
          <option value="5pm">5:00 PM</option>
          <option value="6pm">6:00 PM</option>
          <option value="7pm">7:00 PM</option>
          <option value="8pm">8:00 PM</option>
        </select>
      </div>

      <div class="field">
        <label>Reason (optional)</label>
        <textarea name="reason" placeholder="Brief reason for rescheduling..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">REQUEST RESCHEDULE</button>
    </form>

    <div class="success" id="successMsg">
      <div class="gold-bar"></div>
      <h2>REQUEST SENT!</h2>
      <p>We'll confirm your new session time on WhatsApp within 24 hours. Thanks for letting us know!</p>
    </div>
  </div>

  <script>
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.querySelector('input[name="preferred_date"]').min = tomorrow.toISOString().split('T')[0];

    document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'SENDING...';

      const form = new FormData(this);
      const data = Object.fromEntries(form.entries());

      try {
        const res = await fetch('/api/send-whatsapp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: '+917082478374',
            body: `Reschedule request from ${data.phone}:\nDate: ${data.preferred_date}\nTime: ${data.preferred_time}\nReason: ${data.reason || 'Not provided'}`
          })
        });

        document.getElementById('rescheduleForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'REQUEST RESCHEDULE';
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
