<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-hero { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 48px 36px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-select { appearance: none; }
    .form-submit { width: 100%; margin-top: 24px; }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 12px; }
    .form-success p { color: var(--mid-grey); font-size: 15px; }
    .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 32px 20px; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Fitness by Maddy</a>
</nav>

<div class="form-page">
  <div class="form-hero">
    <p class="section-eyebrow">Getting Started</p>
    <h1 class="section-title">Client <em>Intake</em> Form</h1>
    <p class="section-body" style="margin:0 auto">Tell us about yourself so Maddy can build your perfect program.</p>
  </div>

  <div class="form-card" id="intakeForm">
    <form id="intake" novalidate>
      <input type="hidden" id="leadId" name="lead_id">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input class="form-input" type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="age">Age *</label>
          <input class="form-input" type="number" id="age" name="age" min="14" max="80" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="gender">Gender *</label>
          <select class="form-select" id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="height">Height (cm) *</label>
          <input class="form-input" type="text" id="height" name="height" placeholder="e.g. 165cm or 5'5" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="weight">Current Weight (kg) *</label>
          <input class="form-input" type="number" id="weight" name="weight" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="goal">Primary Goal *</label>
          <select class="form-select" id="goal" name="goal" required>
            <option value="">Select</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="strength">Strength</option>
            <option value="pcos_management">PCOS Management</option>
            <option value="general_fitness">General Fitness</option>
            <option value="body_recomp">Body Recomposition</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="injuries">Current Injuries / Medical Conditions</label>
        <textarea class="form-textarea" id="injuries" name="injuries" placeholder="Any injuries, conditions, or medications we should know about..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="medical_conditions">Are you on any medications?</label>
        <input class="form-input" type="text" id="medical_conditions" name="medical_conditions" placeholder="List medications if any">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="diet_preference">Diet Preference *</label>
          <select class="form-select" id="diet_preference" name="diet_preference" required>
            <option value="">Select</option>
            <option value="no_restriction">No Restrictions</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="eggetarian">Eggetarian</option>
            <option value="pescatarian">Pescatarian</option>
            <option value="jain">Jain</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="workout_experience">Experience Level *</label>
          <select class="form-select" id="workout_experience" name="workout_experience" required>
            <option value="">Select</option>
            <option value="beginner">Beginner (< 6 months)</option>
            <option value="intermediate">Intermediate (6m - 2yrs)</option>
            <option value="advanced">Advanced (2+ years)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="available_days">Days/Week Available *</label>
          <select class="form-select" id="available_days" name="available_days" required>
            <option value="">Select</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="equipment_access">Equipment Access *</label>
          <select class="form-select" id="equipment_access" name="equipment_access" required>
            <option value="">Select</option>
            <option value="full_gym">Full Gym</option>
            <option value="home_basic">Home (Dumbbells + Bands)</option>
            <option value="bodyweight">Bodyweight Only</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="wake_time">Usual Wake Time</label>
          <input class="form-input" type="time" id="wake_time" name="wake_time">
        </div>
        <div class="form-group">
          <label class="form-label" for="sleep_time">Usual Sleep Time</label>
          <input class="form-input" type="time" id="sleep_time" name="sleep_time">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="supplements">Current Supplements</label>
        <input class="form-input" type="text" id="supplements" name="supplements" placeholder="e.g. Whey, Creatine, Multivitamin">
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn-primary form-submit">Submit Intake Form</button>
    </form>
  </div>

  <div class="form-success" id="formSuccess">
    <h2>You're All Set!</h2>
    <p>Thanks for submitting your intake form. Maddy will review your details and your personalised program will be ready soon.</p>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead');
  if (leadId) document.getElementById('leadId').value = leadId;

  document.getElementById('intake').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const errEl = document.getElementById('formError');
    errEl.style.display = 'none';

    const data = {
      lead_id: form.lead_id.value,
      name: form.name.value.trim(),
      age: form.age.value,
      gender: form.gender.value,
      height: form.height.value.trim(),
      weight: form.weight.value,
      goal: form.goal.value,
      injuries: form.injuries.value.trim(),
      medical_conditions: form.medical_conditions.value.trim(),
      diet_preference: form.diet_preference.value,
      workout_experience: form.workout_experience.value,
      available_days: form.available_days.value,
      equipment_access: form.equipment_access.value,
      wake_time: form.wake_time.value,
      sleep_time: form.sleep_time.value,
      supplements: form.supplements.value.trim()
    };

    if (!data.lead_id || !data.name || !data.age || !data.gender || !data.weight) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.style.display = 'block';
      return;
    }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await fetch('/api/lead-intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Submission failed');

      document.getElementById('intakeForm').style.display = 'none';
      document.getElementById('formSuccess').style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Intake Form';
    }
  });
})();
</script>
</body>
</html>
