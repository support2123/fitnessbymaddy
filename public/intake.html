<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Intake | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --white: #ffffff;
      --grey: #2a2a2a;
      --light-text: #cccccc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--light-text);
      font-size: 14px;
      margin-bottom: 36px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--grey);
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    select { appearance: none; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 28px;
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--light-text); }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--gold);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #3a3a3a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FITNESS BY MADDY</div>
    <p class="subtitle">Let's get to know you — fill this out so we can build your perfect plan.</p>

    <form id="intakeForm">
      <div class="section-title">BASIC INFO</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" min="14" max="80" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Height (cm)</label>
          <input type="text" name="height" placeholder="165cm" required>
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required>
        </div>
      </div>

      <div class="section-title">FITNESS GOALS</div>
      <div class="form-group">
        <label>Primary Goal</label>
        <select name="goal" required>
          <option value="">Select your goal</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain / Toning</option>
          <option value="strength">Strength & Performance</option>
          <option value="pcos_management">PCOS Management</option>
          <option value="general_fitness">General Fitness & Energy</option>
          <option value="postpartum">Postpartum Recovery</option>
        </select>
      </div>
      <div class="form-group">
        <label>Any Injuries or Pain?</label>
        <textarea name="injuries" placeholder="E.g., lower back pain, knee issues, shoulder injury..."></textarea>
      </div>
      <div class="form-group">
        <label>Medical Conditions</label>
        <textarea name="medical_conditions" placeholder="E.g., PCOS, thyroid, diabetes, blood pressure..."></textarea>
      </div>

      <div class="section-title">LIFESTYLE</div>
      <div class="form-group">
        <label>Diet Preference</label>
        <select name="diet_preference">
          <option value="no_restriction">No Restrictions</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="non_veg">Non-Veg</option>
          <option value="jain">Jain</option>
        </select>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Training Days/Week</label>
          <select name="training_days" required>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5" selected>5 days</option>
            <option value="6">6 days</option>
          </select>
        </div>
        <div class="form-group">
          <label>Workout Duration</label>
          <select name="workout_duration">
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60" selected>60 min</option>
            <option value="90">90 min</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Wake Time</label>
          <input type="time" name="wake_time" value="07:00">
        </div>
        <div class="form-group">
          <label>Sleep Time</label>
          <input type="time" name="sleep_time" value="23:00">
        </div>
      </div>
      <div class="form-group">
        <label>Current Supplements (if any)</label>
        <input type="text" name="supplements" placeholder="E.g., whey protein, creatine, multivitamin...">
      </div>

      <button type="submit" class="btn-submit">SUBMIT INTAKE FORM</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>YOU'RE ALL SET!</h2>
      <p>Thanks for submitting. Your coach will review this and your personalized plan will arrive on WhatsApp soon.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('intakeForm');
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const data = Object.fromEntries(new FormData(form));
      data.lead_id = leadId;

      try {
        const res = await fetch('/api/lead-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          form.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
