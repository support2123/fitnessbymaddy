<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reschedule Session | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .time-slot {
      padding: 12px; text-align: center; border: 1.5px solid var(--light-grey);
      border-radius: 2px; font-size: 13px; cursor: pointer; transition: all 0.3s;
      color: var(--charcoal); background: var(--cream);
    }
    .time-slot:hover { border-color: var(--gold); color: var(--gold); }
    .time-slot.selected { background: var(--charcoal); color: white; border-color: var(--charcoal); }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 16px; line-height: 1.7; }
    @media (max-width: 500px) { .time-slots { grid-template-columns: repeat(2, 1fr); } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <p class="section-eyebrow">Reschedule</p>
      <h1 class="section-title">Pick a New <em>Time</em></h1>
      <p class="section-body" style="margin:0 auto">Life happens. Let's find a slot that works better for you.</p>
    </div>

    <div id="formContainer">
      <form id="rescheduleForm" class="form-card">
        <div class="form-group">
          <label class="form-label">Preferred Date *</label>
          <input type="date" name="date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot *</label>
          <div class="time-slots" id="timeSlots">
            <div class="time-slot" data-time="07:00">7:00 AM</div>
            <div class="time-slot" data-time="08:00">8:00 AM</div>
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="11:00">11:00 AM</div>
            <div class="time-slot" data-time="16:00">4:00 PM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
            <div class="time-slot" data-time="18:00">6:00 PM</div>
            <div class="time-slot" data-time="19:00">7:00 PM</div>
          </div>
          <input type="hidden" name="time" id="selectedTime" required>
        </div>

        <div class="form-group">
          <label class="form-label">Reason (optional)</label>
          <textarea name="reason" class="form-textarea" placeholder="Quick note on why you need to reschedule..."></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Request Reschedule</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Request Sent!</h2>
      <p>Your reschedule request has been received. You'll get a confirmation on WhatsApp shortly.</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var selectedTime = '';

  var dateInput = document.querySelector('input[name="date"]');
  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  document.querySelectorAll('.time-slot').forEach(function(slot) {
    slot.addEventListener('click', function() {
      document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });
      slot.classList.add('selected');
      selectedTime = slot.getAttribute('data-time');
      document.getElementById('selectedTime').value = selectedTime;
    });
  });

  document.getElementById('rescheduleForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!selectedTime) { alert('Please select a time slot.'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var form = e.target;
    var data = {
      client_id: clientId,
      date: form.date.value,
      time: selectedTime,
      reason: form.reason.value
    };

    fetch('/api/send-whatsapp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer internal'
      },
      body: JSON.stringify({
        phone: '917082478374',
        type: 'text',
        text: 'RESCHEDULE REQUEST\nClient: ' + clientId + '\nDate: ' + data.date + '\nTime: ' + data.time + '\nReason: ' + (data.reason || 'Not specified')
      })
    })
    .then(function() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Request Reschedule';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
