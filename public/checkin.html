<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-in | Fitness by Maddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #1a1a1a;
      --gold: #B8965A;
      --gold-light: #D4AF7A;
      --white: #ffffff;
      --grey: #2a2a2a;
      --light-text: #cccccc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 24px; }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .week-badge {
      text-align: center;
      background: var(--grey);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--gold);
      margin: 0 auto 32px;
      display: block;
      width: fit-content;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--grey);
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slider-group { margin-bottom: 24px; }
    .slider-group label { margin-bottom: 12px; }
    .slider-value {
      text-align: center;
      font-size: 24px;
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      margin-bottom: 8px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--grey);
      border-radius: 3px;
      border: none;
      padding: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--gold);
      border-radius: 50%;
      cursor: pointer;
    }
    .photo-upload {
      border: 2px dashed #3a3a3a;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload p { color: var(--light-text); font-size: 13px; margin-top: 8px; }
    .photo-preview {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .photo-preview img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 4px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { display: none; text-align: center; padding: 40px 20px; }
    .success-msg h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 28px;
      margin-bottom: 12px;
    }
    .success-msg p { color: var(--light-text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FITNESS BY MADDY</div>
    <div class="week-badge" id="weekBadge">WEEK 1 CHECK-IN</div>

    <form id="checkinForm">
      <div class="row">
        <div class="form-group">
          <label>Current Weight (kg)</label>
          <input type="number" name="weight" step="0.1" required>
        </div>
        <div class="form-group">
          <label>Waist (inches)</label>
          <input type="number" name="waist" step="0.1">
        </div>
      </div>

      <div class="slider-group">
        <label>How well did you follow the plan? (1 = barely, 10 = perfectly)</label>
        <div class="slider-value" id="complianceVal">7</div>
        <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('complianceVal').textContent=this.value">
      </div>

      <div class="slider-group">
        <label>Energy Level This Week (1 = drained, 10 = amazing)</label>
        <div class="slider-value" id="energyVal">7</div>
        <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
      </div>

      <div class="form-group">
        <label>Any Issues or Concerns?</label>
        <textarea name="issues" placeholder="Anything bothering you — pain, sleep, cravings, stress, digestion..."></textarea>
      </div>

      <div class="form-group">
        <label>Progress Photos (Front, Side, Back)</label>
        <div class="photo-upload" id="photoUpload">
          <div style="font-size: 28px;">📷</div>
          <p>Tap to upload 3 photos</p>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
        </div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>

      <button type="submit" class="btn-submit">SUBMIT CHECK-IN</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h2>CHECK-IN RECEIVED!</h2>
      <p>Your coach is reviewing your progress. Your updated plan will arrive on WhatsApp within 24 hours.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('c');
    const weekNo = params.get('w') || '1';
    document.getElementById('weekBadge').textContent = `WEEK ${weekNo} CHECK-IN`;

    const photoUpload = document.getElementById('photoUpload');
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    let photoFiles = [];

    photoUpload.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
      photoFiles = Array.from(e.target.files).slice(0, 3);
      photoPreview.innerHTML = '';
      photoFiles.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        photoPreview.appendChild(img);
      });
    });

    document.getElementById('checkinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const formData = Object.fromEntries(new FormData(e.target));
      formData.client_id = clientId;
      formData.week_no = weekNo;
      formData.photos_urls = [];

      try {
        const res = await fetch('/api/checkin-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        if (res.ok) {
          e.target.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'ERROR — TRY AGAIN';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'ERROR — TRY AGAIN';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
