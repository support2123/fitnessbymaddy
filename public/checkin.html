<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Check-In | Fitness by Maddy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-page { max-width: 640px; margin: 0 auto; padding: 100px 24px 60px; }
    .form-header { text-align: center; margin-bottom: 48px; }
    .form-card { background: white; padding: 40px 32px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--light-grey); border-radius: 2px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal);
      background: var(--cream); transition: border-color 0.3s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%; padding: 16px; background: var(--charcoal); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; transition: background 0.3s; border-radius: 2px; margin-top: 12px;
    }
    .form-submit:hover { background: var(--gold); }
    .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .week-badge {
      display: inline-block; background: var(--gold); color: white;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 2px; margin-bottom: 16px;
    }
    .slider-group { margin-bottom: 20px; }
    .slider-row { display: flex; align-items: center; gap: 16px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--gold); }
    .slider-val { font-size: 24px; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--charcoal); min-width: 32px; text-align: center; }
    .photo-upload { border: 2px dashed var(--light-grey); padding: 32px; text-align: center; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { display: none; }
    .photo-upload p { font-size: 13px; color: var(--mid-grey); }
    .form-success { display: none; text-align: center; padding: 60px 24px; }
    .form-success h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--charcoal); margin-bottom: 16px; }
    .form-success p { color: var(--mid-grey); font-size: 16px; line-height: 1.7; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Fitness by Maddy</a>
</nav>

<div class="page-wrap">
  <div class="form-page">
    <div class="form-header">
      <div class="week-badge" id="weekBadge">Week 1</div>
      <h1 class="section-title">Weekly <em>Check-In</em></h1>
      <p class="section-body" style="margin:0 auto">Track your progress. Honest data = better results.</p>
    </div>

    <div id="formContainer">
      <form id="checkinForm" class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Weight (kg) *</label>
            <input type="number" name="weight" class="form-input" required step="0.1" min="30" max="300" placeholder="72.5">
          </div>
          <div class="form-group">
            <label class="form-label">Waist (inches)</label>
            <input type="number" name="waist" class="form-input" step="0.1" min="20" max="80" placeholder="32">
          </div>
        </div>

        <div class="slider-group">
          <label class="form-label">Workout Compliance (1-10) *</label>
          <div class="slider-row">
            <span style="font-size:12px;color:var(--mid-grey)">Low</span>
            <input type="range" name="compliance_score" min="1" max="10" value="7" oninput="document.getElementById('compVal').textContent=this.value">
            <span style="font-size:12px;color:var(--mid-grey)">Perfect</span>
            <div class="slider-val" id="compVal">7</div>
          </div>
        </div>

        <div class="slider-group">
          <label class="form-label">Energy Level (1-10) *</label>
          <div class="slider-row">
            <span style="font-size:12px;color:var(--mid-grey)">Drained</span>
            <input type="range" name="energy" min="1" max="10" value="7" oninput="document.getElementById('energyVal').textContent=this.value">
            <span style="font-size:12px;color:var(--mid-grey)">Fired Up</span>
            <div class="slider-val" id="energyVal">7</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Issues / Challenges This Week</label>
          <textarea name="issues" class="form-textarea" placeholder="Any struggles, soreness, schedule issues, food challenges..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Progress Photos (Front, Side, Back)</label>
          <div class="photo-upload" onclick="this.querySelector('input').click()">
            <input type="file" name="photos" accept="image/*" multiple>
            <p>Tap to upload 3 progress photos</p>
          </div>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Submit Check-In</button>
      </form>
    </div>

    <div class="form-success" id="successMsg">
      <h2>Check-In Received!</h2>
      <p>Great job staying consistent. Your updated program will be sent via WhatsApp within 24 hours. Keep pushing!</p>
    </div>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('c');
  var weekNo = parseInt(params.get('w') || '1', 10);

  document.getElementById('weekBadge').textContent = 'Week ' + weekNo;

  document.getElementById('checkinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    var form = e.target;
    var data = {
      client_id: clientId,
      week_no: weekNo,
      weight: parseFloat(form.weight.value),
      waist: form.waist.value ? parseFloat(form.waist.value) : null,
      compliance_score: parseInt(form.compliance_score.value, 10),
      energy: parseInt(form.energy.value, 10),
      issues: form.issues.value,
      photos_urls: []
    };

    fetch('/api/checkin-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Submit Check-In';
      alert('Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
