name: Secure REP RANGE voice retrieval

on:
  workflow_dispatch:
    inputs:
      transfer_url:
        description: Expiring user-provided transfer URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve supplied voice transfer
        env:
          TRANSFER_URL: ${{ inputs.transfer_url }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m pip install --quiet requests
          cat > /tmp/retrieve.py <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import requests

          source_url = os.environ['TRANSFER_URL']
          if not source_url.startswith('https://'):
              raise SystemExit('Transfer URL is unavailable.')
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','x-requested-with':'XMLHttpRequest'})
          landing = s.get(source_url, allow_redirects=True, timeout=60)
          landing.raise_for_status()
          parts = [p for p in urlparse(landing.url).path.split('/') if p]
          pos = parts.index('downloads')
          transfer_id, security_hash = parts[pos + 1], parts[pos + 2]
          csrf = re.search(r'name="csrf-token" content="([^"]+)"', landing.text)
          if csrf: s.headers['x-csrf-token'] = csrf.group(1)
          r = s.post(f'https://wetransfer.com/api/v4/transfers/{transfer_id}/download', json={'intent':'entire_transfer','security_hash':security_hash}, timeout=60)
          r.raise_for_status()
          direct = r.json().get('direct_link')
          if not direct: raise SystemExit('No transfer download returned.')
          media = s.get(direct, stream=True, timeout=180)
          media.raise_for_status()
          disp = media.headers.get('content-disposition','')
          m = re.search(r'''filename\*?=(?:UTF-8'')?["']?([^"';]+)''', disp, re.I)
          name = Path(unquote(m.group(1)) if m else 'clone3-intake.bin').name
          dest = Path('/tmp/rep-range-clone')
          dest.mkdir(mode=0o700)
          out = dest / name
          size = 0
          with out.open('wb') as h:
              for chunk in media.iter_content(1024 * 1024):
                  if chunk:
                      h.write(chunk); size += len(chunk)
          if size < 256: raise SystemExit('Transfer payload was unexpectedly small.')
          print(f'Retrieved protected voice intake ({size} bytes).')
          PY
          python3 /tmp/retrieve.py
      - name: Store short-lived protected artifact
        uses: actions/upload-artifact@v4
        with:
          name: rep-range-clone3-intake
          path: /tmp/rep-range-clone/*
          if-no-files-found: error
          retention-days: 1
