name: One-time Drive workspace transfer

on:
  push:
    branches:
      - arena/01a0dd9b-fitnessbymaddy
    paths:
      - .github/workflows/one-time-drive-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the user-provided workspace archive
        id: download
        continue-on-error: true
        env:
          DRIVE_URL: https://drive.google.com/file/d/1_Lxb1lzj_SN8jW-AFgrDMiLOpRgLyNN-/view?usp=drive_link
        run: |
          set -o pipefail
          {
            echo 'Installing gdown...'
            python -m pip install --disable-pip-version-check --quiet --upgrade gdown
            echo 'Retrieving the public Drive archive...'
            python -m gdown "$DRIVE_URL" --output /tmp/previous-arena-workspace.zip
            echo 'Archive details:'
            ls -lh /tmp/previous-arena-workspace.zip
            file /tmp/previous-arena-workspace.zip
            unzip -tq /tmp/previous-arena-workspace.zip
            sha256sum /tmp/previous-arena-workspace.zip
          } 2>&1 | tee /tmp/drive-transfer-debug.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Commit transfer diagnostics to this temporary branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}
      - name: Save transfer diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .arena-drive-transfer
          cp /tmp/drive-transfer-debug.txt .arena-drive-transfer/diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .arena-drive-transfer/diagnostics.txt
          git diff --cached --quiet || git commit -m 'chore: record Drive transfer diagnostics'
          git push
      - name: Retain the archive for the transfer only
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: previous-arena-workspace
          path: /tmp/previous-arena-workspace.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Enforce successful archive verification
        if: steps.download.outcome != 'success'
        run: exit 1
