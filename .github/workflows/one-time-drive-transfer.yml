name: One-time Drive workspace transfer
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0dd9b-fitnessbymaddy]
    paths: [.github/workflows/one-time-drive-transfer.yml]
jobs:
  fetch:
    if: contains(github.event.head_commit.message, 'Run temporary') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, trim and package licensed stock clips
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p clips raw
          exec > >(tee bridge.log) 2>&1
          cat > clips.tsv <<'EOF'
          deadlift|https://www.pexels.com/download/video/12890962/|3
          curls|https://www.pexels.com/download/video/5319426/|5
          pullups|https://www.pexels.com/download/video/5752496/|2
          treadmill|https://www.pexels.com/download/video/5320011/|4
          ropes|https://www.pexels.com/download/video/4117488/|2
          boxing|https://www.pexels.com/download/video/5752370/|3
          dumbbells|https://www.pexels.com/download/video/5319439/|6
          barbell|https://www.pexels.com/download/video/5319095/|8
          sprint|https://www.pexels.com/download/video/4921639/|2
          EOF
          while IFS='|' read -r name url ss; do
            echo "FETCH $name"
            if ! curl -L --fail --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "raw/$name.mp4"; then echo "FAILED_DOWNLOAD $name"; continue; fi
            if ! ffmpeg -y -ss "$ss" -i "raw/$name.mp4" -t 3.34 -an -vf "fps=30,scale=540:960:force_original_aspect_ratio=increase,crop=540:960,eq=contrast=1.10:saturation=0.86:brightness=-0.025" -c:v libx264 -preset veryfast -crf 20 -movflags +faststart "clips/$name.mp4"; then echo "FAILED_CONFORM $name"; rm -f "clips/$name.mp4"; fi
          done < clips.tsv
          find clips -maxdepth 1 -name "*.mp4" -print -quit | grep -q . || { echo "NO_CLIPS_CREATED"; exit 1; }
          sha256sum clips/*.mp4 > clips/SHA256SUMS.txt
          cp bridge.log clips/bridge.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motivation-video-clips
          path: |
            clips/
            bridge.log
          retention-days: 1
