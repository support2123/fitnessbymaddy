name: One-time Drive workspace transfer

on:
  push:
    branches:
      - arena/01a0dd9b-fitnessbymaddy
    paths:
      - .github/workflows/one-time-drive-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the user-provided workspace archive
        id: download
        continue-on-error: true
        env:
          DRIVE_URL: https://drive.google.com/file/d/1_Lxb1lzj_SN8jW-AFgrDMiLOpRgLyNN-/view?usp=drive_link
        run: |
          set -o pipefail
          {
            echo 'Installing gdown...'
            python -m pip install --disable-pip-version-check --quiet --upgrade gdown
            echo 'Retrieving the public Drive archive...'
            python -m gdown "$DRIVE_URL" --output /tmp/previous-arena-workspace.zip
            echo 'Archive details:'
            ls -lh /tmp/previous-arena-workspace.zip
            file /tmp/previous-arena-workspace.zip
            unzip -tq /tmp/previous-arena-workspace.zip
            sha256sum /tmp/previous-arena-workspace.zip
          } 2>&1 | tee /tmp/drive-transfer-debug.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check out the temporary transfer branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}
      - name: Build an inspectable workspace snapshot
        if: steps.download.outcome == 'success'
        env:
          ARCHIVE_PATH: /tmp/previous-arena-workspace.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ['ARCHIVE_PATH'])
          snapshot = Path(os.environ['GITHUB_WORKSPACE']) / '.arena-drive-transfer'
          text_root = snapshot / 'workspace-text'
          inventory = snapshot / 'inventory.tsv'
          summary = snapshot / 'snapshot-summary.md'

          if text_root.exists():
              shutil.rmtree(text_root)
          text_root.mkdir(parents=True, exist_ok=True)
          snapshot.mkdir(parents=True, exist_ok=True)

          ignored_dirs = {'.git', 'node_modules', '.next', '.nuxt', '.cache', 'coverage', 'dist', 'build', 'out', 'target', '__pycache__', '.venv', 'venv'}
          sensitive_names = {'.env', '.env.local', '.env.production', '.env.development', 'id_rsa', 'id_ed25519'}
          sensitive_suffixes = {'.pem', '.key', '.p12', '.pfx'}
          max_file_bytes = 2 * 1024 * 1024
          max_total_text_bytes = 40 * 1024 * 1024
          total_text_bytes = 0
          counts = {'files': 0, 'copied': 0, 'ignored': 0, 'sensitive': 0, 'binary': 0, 'large': 0, 'cap': 0, 'unsafe': 0}

          with zipfile.ZipFile(archive) as zf, inventory.open('w', encoding='utf-8') as listing:
              listing.write('path\tbytes\tstatus\n')
              for member in zf.infolist():
                  if member.is_dir():
                      continue
                  counts['files'] += 1
                  path = PurePosixPath(member.filename)
                  parts = path.parts
                  status = ''
                  if not parts or any(part in ('', '.', '..') for part in parts):
                      status = 'unsafe-path'
                      counts['unsafe'] += 1
                  elif any(part in ignored_dirs for part in parts):
                      status = 'ignored-generated-or-dependency'
                      counts['ignored'] += 1
                  elif path.name in sensitive_names or path.suffix.lower() in sensitive_suffixes:
                      status = 'not-copied-sensitive'
                      counts['sensitive'] += 1
                  elif member.file_size > max_file_bytes:
                      status = 'not-copied-over-2MiB'
                      counts['large'] += 1
                  elif total_text_bytes + member.file_size > max_total_text_bytes:
                      status = 'not-copied-snapshot-cap'
                      counts['cap'] += 1
                  else:
                      data = zf.read(member)
                      try:
                          if b'\0' in data:
                              raise UnicodeDecodeError('utf-8', data, 0, 1, 'NUL byte')
                          data.decode('utf-8')
                      except UnicodeDecodeError:
                          status = 'not-copied-binary-or-non-utf8'
                          counts['binary'] += 1
                      else:
                          destination = text_root.joinpath(*parts)
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(data)
                          total_text_bytes += len(data)
                          status = 'copied-text'
                          counts['copied'] += 1
                  listing.write(f'{member.filename}\t{member.file_size}\t{status}\n')

          summary.write_text(
              '# Drive workspace snapshot\n\n'
              'This is an inspectable, non-binary snapshot generated from the user-provided archive. '
              'The original archive is not committed to the repository.\n\n'
              f'- Archive entries: {counts["files"]}\n'
              f'- UTF-8 text files copied: {counts["copied"]}\n'
              f'- Copied text total: {total_text_bytes} bytes\n'
              f'- Generated/dependency files omitted: {counts["ignored"]}\n'
              f'- Sensitive files intentionally omitted: {counts["sensitive"]}\n'
              f'- Binary/non-UTF-8 files catalogued only: {counts["binary"]}\n'
              f'- Files over 2 MiB catalogued only: {counts["large"]}\n'
              f'- Files omitted by 40 MiB text cap: {counts["cap"]}\n'
              f'- Unsafe paths omitted: {counts["unsafe"]}\n\n'
              'See `inventory.tsv` for every archive file and its snapshot status.\n',
              encoding='utf-8'
          )
          PY
      - name: Save transfer diagnostics and snapshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .arena-drive-transfer
          cp /tmp/drive-transfer-debug.txt .arena-drive-transfer/diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .arena-drive-transfer
          git diff --cached --quiet || git commit -m 'chore: snapshot transferred workspace'
          git push
      - name: Enforce successful archive verification
        if: steps.download.outcome != 'success'
        run: exit 1
