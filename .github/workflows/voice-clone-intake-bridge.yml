# Manual intake trigger — 2026-09-27: user supplied a new English voice-transfer link.
name: Encrypted voice-clone intake

on:
  push:
    branches:
      - arena/01a0dd9b-fitnessbymaddy
    paths:
      - .github/workflows/voice-clone-intake-bridge.yml

jobs:
  retrieve-and-encrypt:
    name: Retrieve and encrypt clone audio
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out bridge public key
        uses: actions/checkout@v4

      - name: Prepare encrypted handoff
        id: handoff
        env:
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/transfer-handoff-private.key >/dev/null 2>&1
          openssl pkey -in /tmp/transfer-handoff-private.key -pubout -out /tmp/transfer-handoff-public.pem
          issue_title="VOICE-BRIDGE-${RUN_ID}"
          body_file=/tmp/bridge-issue-body.md
          {
            printf '%s\n\n' 'Temporary encrypted handoff for a user-owned voice-clone transfer. The public key below accepts one encrypted payload only; no audio or download link should be posted here.'
            printf '%s\n' '```'
            cat /tmp/transfer-handoff-public.pem
            printf '%s\n' '```'
          } > "$body_file"
          request=$(jq -n --arg title "$issue_title" --rawfile body "$body_file" '{title: $title, body: $body}')
          curl --fail-with-body --silent --show-error \
            -X POST "$GH_API/repos/$GH_REPO/issues" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d "$request" > /tmp/bridge-issue.json
          issue_number=$(jq -r '.number' /tmp/bridge-issue.json)
          test "$issue_number" != null
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "VOICE_BRIDGE_ISSUE=$issue_number"

      - name: Wait for encrypted transfer link
        env:
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BRIDGE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          bridge_path=".arena-voice-bridge/${RUN_ID}.b64"
          received=false
          # Poll the branch ref, not the initial checkout. The encrypted payload is
          # committed after this job publishes its ephemeral public key.
          for attempt in $(seq 1 120); do
            git fetch --no-tags --quiet origin "$BRIDGE_BRANCH" || true
            if git cat-file -e "FETCH_HEAD:$bridge_path" 2>/dev/null; then
              encoded=$(git show "FETCH_HEAD:$bridge_path" | tr -d '\n')
              if [ -n "$encoded" ] && \
                 printf '%s' "$encoded" | base64 --decode | base64 --decode > /tmp/transfer-link.enc 2>/dev/null && \
                 openssl pkeyutl -decrypt -inkey /tmp/transfer-handoff-private.key -in /tmp/transfer-link.enc -out /tmp/transfer-url; then
                transfer_url=$(cat /tmp/transfer-url)
                if [[ "$transfer_url" == https://we.tl/* || "$transfer_url" == https://wetransfer.com/* ]]; then
                  printf '%s' "$transfer_url" > /tmp/transfer-url
                  received=true
                  break
                fi
              fi
            fi
            sleep 3
          done
          if [ "$received" != true ]; then
            echo 'No valid encrypted transfer link arrived before the 6-minute handoff deadline.' >&2
            exit 1
          fi

      - name: Retrieve transfer
        run: |
          set -euo pipefail
          export TRANSFER_URL="$(cat /tmp/transfer-url)"
          python3 -m pip install --quiet requests
          cat > /tmp/download_transfer.py <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import requests

          source_url = os.environ['TRANSFER_URL']
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'x-requested-with': 'XMLHttpRequest',
          }
          session = requests.Session()
          session.headers.update(headers)
          landing = session.get(source_url, allow_redirects=True, timeout=60)
          landing.raise_for_status()
          resolved = landing.url
          parts = [p for p in urlparse(resolved).path.split('/') if p]
          # Expected: /downloads/<transfer-id>/<security-hash>
          try:
              pos = parts.index('downloads')
              transfer_id, security_hash = parts[pos + 1], parts[pos + 2]
          except (ValueError, IndexError):
              raise SystemExit(f'Could not parse a WeTransfer download URL: {resolved}')

          csrf = re.search(r'name="csrf-token" content="([^"]+)"', landing.text)
          if csrf:
              session.headers['x-csrf-token'] = csrf.group(1)
          api = f'https://wetransfer.com/api/v4/transfers/{transfer_id}/download'
          response = session.post(api, json={'intent': 'entire_transfer', 'security_hash': security_hash}, timeout=60)
          response.raise_for_status()
          direct_link = response.json().get('direct_link')
          if not direct_link:
              raise SystemExit('WeTransfer did not return a direct download link.')

          media = session.get(direct_link, stream=True, timeout=180)
          media.raise_for_status()
          disposition = media.headers.get('content-disposition', '')
          matched = re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)', disposition, re.I)
          filename = unquote(matched.group(1)) if matched else 'voice-clone-intake.bin'
          filename = Path(filename).name or 'voice-clone-intake.bin'
          destination = Path('/tmp/clone-intake')
          destination.mkdir(parents=True, exist_ok=True)
          output = destination / filename
          total = 0
          with output.open('wb') as handle:
              for chunk in media.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      handle.write(chunk)
                      total += len(chunk)
          if total < 256:
              raise SystemExit('Downloaded file is unexpectedly small.')
          print(f'Retrieved clone intake payload: {total} bytes')
          PY
          python3 /tmp/download_transfer.py

      - name: Encrypt temporary payload to local public key
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/voice-intake.key
          tar -C /tmp/clone-intake -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/voice-intake.key -out /tmp/voice-clones.payload.enc
          openssl pkeyutl -encrypt -pubin -inkey .github/voice-intake-bridge.pub -in /tmp/voice-intake.key -out /tmp/voice-clones.key.enc
          rm -rf /tmp/clone-intake /tmp/download_transfer.py
          shred -u /tmp/voice-intake.key /tmp/transfer-url /tmp/transfer-link.enc /tmp/transfer-handoff-private.key
          mkdir -p /tmp/voice-clone-artifact
          mv /tmp/voice-clones.payload.enc /tmp/voice-clones.key.enc /tmp/voice-clone-artifact/
          test -s /tmp/voice-clone-artifact/voice-clones.payload.enc
          test -s /tmp/voice-clone-artifact/voice-clones.key.enc

      - name: Commit encrypted intake for local decryption
        env:
          BRIDGE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin "$BRIDGE_BRANCH"
          git checkout -B "$BRIDGE_BRANCH" "origin/$BRIDGE_BRANCH"
          destination=".arena-voice-artifacts/${RUN_ID}"
          mkdir -p "$destination"
          mv /tmp/voice-clone-artifact/voice-clones.payload.enc "$destination/"
          mv /tmp/voice-clone-artifact/voice-clones.key.enc "$destination/"
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m "Store encrypted voice intake ${RUN_ID}"
          git push origin "HEAD:refs/heads/$BRIDGE_BRANCH"

      - name: Close encrypted handoff
        if: always()
        env:
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            curl --silent --show-error --fail-with-body \
              -X PATCH "$GH_API/repos/$GH_REPO/issues/$ISSUE_NUMBER" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d '{"state":"closed"}'
          fi
