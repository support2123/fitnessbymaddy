name: One-time reel doctrine import

on:
  push:
    branches:
      - arena/01a0dd9b-fitnessbymaddy
    paths:
      - .github/workflows/import-reel-doctrine.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}
      - name: Retrieve the user-provided doctrine documents
        env:
          DRIVE_FOLDER: https://drive.google.com/drive/folders/1IgwNXLFmrbhIXmtznG7tosC2KGlaAzZ6?usp=sharing
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet --upgrade gdown
          rm -rf /tmp/fbm-doctrine
          python -m gdown --folder "$DRIVE_FOLDER" --output /tmp/fbm-doctrine
          mkdir -p reel-studio/doctrine/source
          for f in 00-MASTER-SPEC.md DOCTRINE-01-HOOK-SCRIPT.md DOCTRINE-02-OPENING-IMAGE.md DOCTRINE-03-DESIGN-MOTION.md; do
            src="$(find /tmp/fbm-doctrine -type f -name "$f" -print -quit)"
            test -n "$src"
            cp "$src" "reel-studio/doctrine/source/$f"
          done
          {
            echo '# Source import manifest'
            echo
            echo 'These four user-supplied doctrine documents are the canonical upstream input for this setup.'
            echo 'Imported from the shared Drive folder on the CI runner; no credentials or secrets are stored.'
            echo
            for f in reel-studio/doctrine/source/*.md; do
              sha256sum "$f"
            done
          } > reel-studio/doctrine/source/IMPORT-MANIFEST.md
      - name: Commit the doctrine source files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reel-studio/doctrine/source
          git diff --cached --quiet || git commit -m 'docs: import reel production doctrine'
          git push
